<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">Count new work and retained KV separately</title><desc id="desc">B retains 6 KV positions and processes 1 new input to reach 7. C processes 6 prompt inputs to create 6 KV positions. The 7 input tokens fit a step budget of 8, and the 13 resulting KV positions fit capacity 24. Solid outlines denote existing KV; dashed outlines denote KV to add.</desc><metadata>{&quot;id&quot;:&quot;03-work-and-state&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Count new work and retained KV separately</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Computing new tokens does not remove the KV already retained.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="219" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Candidates for the next execution</text><rect x="48" y="246" width="520" height="160" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="600" y="246" width="552" height="160" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="72" y="283" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">B · Decode</text><text x="72" y="326" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">6 KV positions retained</text><text x="72" y="373" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">1 new input → 7 KV positions</text><text x="624" y="283" fill="#7954A3" font-size="28" font-weight="700" text-anchor="start">C · Prefill</text><text x="624" y="326" fill="#7954A3" font-size="24" font-weight="400" text-anchor="start">No KV yet</text><text x="624" y="373" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">6 inputs → 6 KV positions</text><text x="48" y="471" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Tokens to compute now</text><text x="115" y="510" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B</text><text x="262" y="510" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">C</text><rect x="96" y="529" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="180" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="222" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="264" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="306" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="348" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="390" y="529" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,590 v9 h332 v-9" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="262" y="632" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Step token budget: 8</text><text x="650" y="564" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">1 + 6 = 7</text><text x="650" y="609" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Fits the budget of 8</text><path d="M48,679 H1152" stroke="#DCE4EC"/><text x="48" y="731" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Actual KV to retain after this execution</text><text x="241" y="776" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">B · 7</text><text x="514" y="776" fill="#7954A3" font-size="23" font-weight="700" text-anchor="middle">C · 6</text><rect x="96" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="180" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="222" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="264" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="306" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="348" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="390" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="432" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="