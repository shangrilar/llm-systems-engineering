<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="title desc">
<title id="title">기본 MLP: 확장 → 활성화 → 축소</title><desc id="desc">한 토큰의 4차원 입력을 첫 선형 변환으로 8차원으로 확장한다. 예시 중간 값 [−2,1,0.5,−1,3,0,−0.5,2]에 ReLU를 적용하면 [0,1,0.5,0,3,0,0,2]다. 두 번째 선형 변환은 다시 4차원으로 바꾼다. 다른 토큰을 섞지 않으며 선형 변환은 한 토큰 내 성분을 조합한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1360" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">기본 MLP: 확장 → 활성화 → 축소</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">두 선형 변환 사이에 활성화 함수를 적용합니다. 전체 토큰 수 T는 바뀌지 않습니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="600" y="225" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">토큰 하나를 확대 · 입력 d = 4</text><rect x="400.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="500.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="600.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="700.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M600,318 L600,350" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="410.0" y="365" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="397" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">선형 변환 1</text><text x="600" y="425" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → m  ·  4 → 8</text><path d="M600,453 L600,495" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="600" y="530" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">중간 벡터 · m = 8</text><rect x="200.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="250.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−2</text><rect x="300.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="350.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="400.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.5</text><rect x="500.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="600.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="700.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="800.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="850.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.5</text><rect x="900.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="950.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M600,618 L600,650" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="340.0" y="664" width="520" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="696" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ReLU</text><text x="600" y="724" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">각 성분에 max(0, 값) 적용</text><path d="M600,752 L600,789" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><rect x="200.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="250.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="300.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="400.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="450.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0.5</text><rect x="500.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="550.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="600.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="650.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="700.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="750.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="800.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="850.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="900.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="950.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M600,872 L600,909" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="410.0" y="923" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="955" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">선형 변환 2</text><text x="600" y="983" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">m → d  ·  8 → 4</text><path d="M600,1011 L600,1043" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="400.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">4</tspan></text><text x="600" y="1157" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">출력도 d = 4</text><text x="600" y="1212" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">선형 변환은 한 토큰 안의 성분들을 조합합니다.</text><path d="M48,1280 L1152,1280" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1321" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">d = 4, m = 8과 중간 값은 설명용입니다. 선형 변환의 가중치와 bias는 생략했습니다.</text>
</svg>