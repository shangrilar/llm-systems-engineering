<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1072" viewBox="0 0 1200 1072" role="img" aria-labelledby="title desc"><title id="title">현재 자원에서 개선하고, 필요한 자원을 늘립니다</title><desc id="desc">왼쪽 실행 시간은 100에서 60ms로 줄었지만 30ms 목표를 넘는다. 오른쪽은 12GB GPU 용량 경계를 16GB의 필요 메모리가 넘는다. 필요량을 줄이거나 자원을 늘리는 선택에서 여러 GPU로 연결한다. 수치는 설명용이다.</desc><metadata>{&quot;id&quot;:&quot;02-beyond-one-gpu&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">현재 자원에서 개선하고, 필요한 자원을 늘립니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">실행 시간의 목표와 실행에 필요한 메모리 용량을 구분합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="207" width="536" height="476" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="250" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">목표 시간에 도달하지 못한 경우</text><text x="76" y="287" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">현재 GPU에서 실행을 개선</text><rect x="616" y="207" width="536" height="476" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="644" y="250" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">메모리 용량이 부족한 경우</text><text x="644" y="287" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">선택한 실행에 필요한 저장 공간</text><text x="156" y="349" fill="#182C40" font-size="20" font-weight="400" text-anchor="end">처음</text><rect x="170" y="316" width="360" height="49" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350" y="348.5" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">100 ms</text><text x="156" y="436" fill="#182C40" font-size="20" font-weight="400" text-anchor="end">개선 후</text><rect x="170" y="403" width="216" height="49" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="278" y="435.5" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">60 ms</text><path d="M278,384 V399 M278,457 V514" fill="none" stroke="#B55B22" stroke-width="2" stroke-dasharray="7 6"/><text x="278" y="550" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">목표 30 ms</text><text x="76" y="606" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">실행 시간은 줄었지만,</text><text x="76" y="640" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">목표를 달성하려면 추가 개선이 필요</text><text x="644" y="349" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start">한 GPU의 용량: 12 GB</text><rect x="644" y="382" width="300" height="128" rx="5" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><rect x="644" y="420" width="400" height="54" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="844" y="455" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">필요한 메모리: 16 GB</text><path d="M944,365 V415 M944,479 V526" fill="none" stroke="#2470BB" stroke-width="2" stroke-dasharray="7 6"/><text x="944" y="550" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">용량 경계</text><text x="644" y="606" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">선택한 실행을 그대로 담을 수 없음</text><text x="644" y="640" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">필요량을 줄이거나 저장 자원을 늘림</text><path d="M316,705 L316,750" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M884,705 L884,750" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="48" y="767" width="1104" height="183" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="76" y="813" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">더 많은 자원을 활용한다면?</text><text x="76" y="858" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">더 빠른 응답 · 더 많은 요청 처리 · 부족한 메모리 용량 확보</text><text x="76" y="897" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU를 추가하면, 데이터와 계산을 어떻게 나눌까요?</text></g></g><path d="M48,994 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1032" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">수치는 설명용이며 특정 모델이나 GPU의 값이 아닙니다.</text></svg>