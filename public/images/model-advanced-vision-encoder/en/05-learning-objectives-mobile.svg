<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1818" viewBox="0 0 360 1818" role="img" aria-labelledby="title desc"><title id="title">Different targets can train a vision encoder</title><desc id="desc">Targets may be a class, matching image–text pairs, masked pixels, or the next text token. These are alternative examples, not four required stages. The text encoder used for alignment has a different role from an answer-generating LLM.</desc><metadata>{&quot;id&quot;:&quot;ma-21-05&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ViT&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2010.11929&quot;},{&quot;label&quot;:&quot;CLIP&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2103.00020&quot;},{&quot;label&quot;:&quot;MAE&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2111.06377&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 5 · Vision</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Different targets can</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">train a vision encoder</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">ViT is an architecture · The objective</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">defines the learning task</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Match images and captions</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="220" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Image encoder</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">Image → summary</text></g><g data-container="true"><rect x="280" y="110" width="220" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="296" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Text encoder</text><text x="296" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">Caption → vector</text></g><path d="M130 260 L200 310" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M390 260 L320 310" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="260" y="350" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="480">Image × caption similarity</text><g data-container="true"><rect x="140" y="390" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="177.5" y="430.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">✓</text></g><g data-container="true"><rect x="223" y="390" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260.5" y="430.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="306" y="390" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="343.5" y="430.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="140" y="463" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="177.5" y="503.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="223" y="463" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260.5" y="503.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">✓</text></g><g data-container="true"><rect x="306" y="463" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="343.5" y="503.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="140" y="536" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="177.5" y="576.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="223" y="536" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260.5" y="576.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="306" y="536" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="343.5" y="576.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">✓</text></g><text x="128" y="430.5" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="end" data-max-width="64">I₁</text><text x="128" y="503.5" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="end" data-max-width="64">I₂</text><text x="128" y="576.5" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="end" data-max-width="64">I₃</text><text x="177" y="380" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="70">T1</text><text x="260" y="380" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="70">T2</text><text x="343" y="380" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="70">T3</text><g data-container="true"><rect x="20" y="650" width="480" height="145" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="681" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Target: matching image–text pairs</text><text x="36" y="721" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Raise similarity for matches; distinguish</text><text x="36" y="749" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">other pairs</text></g><g data-container="true"><rect x="20" y="900" width="480" height="230" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="931" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Another objective: classification</text><text x="36" y="971" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Image → encoder → classification head</text><text x="36" y="999" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Compare predicted and labeled classes</text><text x="36" y="1027" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Example: cat / dog</text></g></g><g transform="translate(16 1011.5538461538462) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Predict text from an image</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Image → vision encoder</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Hidden states for patches</text></g><path d="M260 250 L260 285" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="295" width="480" height="145" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="326" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Connector → language model</text><text x="36" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Also receives the question and prior target</text><text x="36" y="394" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">tokens</text></g><path d="M260 450 L260 490" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="500" width="480" height="115" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="531" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Predict the next text token</text><text x="36" y="571" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Vocabulary scores → compare with target</text></g><g data-container="true"><rect x="20" y="650" width="480" height="145" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="681" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Target: the next text token</text><text x="36" y="721" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Loss can train the vision encoder too</text><text x="36" y="749" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Update scopes: next article</text></g><g data-container="true"><rect x="20" y="900" width="480" height="230" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="931" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Another objective: masked</text><text x="36" y="961.8" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">reconstruction</text><text x="36" y="1002" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Mask patches → encode visible patches</text><text x="36" y="1030" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Reconstruction decoder predicts masked</text><text x="36" y="1058" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">pixels</text><text x="36" y="1086" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Compare with original pixels</text></g></g></svg>