size="25" font-weight="400" text-anchor="start">Q₁: ℓ ≈ 1.368 + 0.503 = 1.871</text><text x="600" y="1230" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">교육용: 스케일링·마스크 생략 · 수치는 반올림 · 중앙 전체 격자는 저장 공간이 아닌 처리 지도</text></g></g><path d="M48,1280 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1318" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Q와 출력 위치를 고정하고 두 K/V 타일을 순회하며 m, ℓ, a를 갱신합니다.</text></svg>