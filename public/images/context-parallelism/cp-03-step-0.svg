nt-weight="400" text-anchor="start">블록별 평균을 더하지 않고, 같은 Softmax 기준으로 누적합니다.</text><text x="600" y="1310" font-size="23" fill="#182C40" font-weight="700" text-anchor="middle">모든 GPU가 자기 Q에 대해 같은 과정을 동시에 진행합니다.</text></g></g><path d="M48,1419 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1457" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Q는 각 GPU에 남고, K·V 블록이 차례로 도착할 때마다 기여를 정규화 통계와 함께 누적합니다.</text></svg>