470BB" font-size="20" font-weight="400" text-anchor="middle">참조 가능</text><rect x="845" y="978" width="205" height="95" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="947.5" y="1017" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">토큰 3</text><text x="947.5" y="1054" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">미래 · 제외</text><text x="335" y="1115" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">토큰 1과 2를 참조합니다.</text><text x="90" y="1202" fill="#2470BB" font-size="27" font-weight="600" text-anchor="start">토큰 3</text><text x="90" y="1242" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">참조 범위</text><rect x="335" y="1163" width="205" height="95" rx="14" fill="#EDF5FD" stroke="#AFCDE8" stroke-width="1.5"/><text x="437.5" y="1202" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">토큰 1</text><text x="437.5" y="1239" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">참조 가능</text><rect x="590" y="1163" width="205" height="95" rx="14" fill="#EDF5FD" stroke="#AFCDE8" stroke-width="1.5"/><text x="692.5" y="1202" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">토큰 2</text><text x="692.5" y="1239" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">참조 가능</text><rect x="845" y="1163" width="205" height="95" rx="14" fill="#EDF5FD" stroke="#AFCDE8" stroke-width="1.5"/><text x="947.5" y="1202" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">토큰 3</text><text x="947.5" y="1239" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">참조 가능</text><text x="335" y="1300" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">토큰 1, 2, 3을 참조합니다.</text><text x="600" y="1358" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">마스크 M의 값: 참조 가능 위치는 0, 제외할 위치는 −∞</text><path d="M48,1390 L1152,1390" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" 