<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc"><title id="title">대기 시간과 처리량의 분모를 구별하기</title><desc id="desc">출력 3개의 TTFT는 100ms, ITL은 30과 40ms, 마지막 토큰 기준 TPOT는 35ms, E2E는 180ms입니다. 10초간 3요청과 출력 10토큰은 0.3req/s와 1tok/s입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1036" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">대기 시간과 처리량의 분모를 구별하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">왼쪽은 한 요청의 시간 기록, 오른쪽은 서버 전체 관측 창의 별도 집계입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><g data-panel="true"><rect x="48" y="197" width="530" height="445" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="233.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">한 요청 A: 시간 간격</text><text x="68" y="281.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">제출 0 ms · 토큰 100 / 130 / 170 ms</text><text x="68" y="313.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">종료 관측 180 ms · 출력 토큰 3개</text><text x="68" y="345.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="68" y="377.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">TTFT = 100 − 0 = 100 ms</text><text x="68" y="409.79999999999995" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">ITL = 30 ms, 40 ms</text><text x="68" y="442.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">TPOT = (170 − 100) / (3 − 1)</text><text x="68" y="474.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">= 35 ms/token</text><text x="68" y="506.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">E2E = 180 − 0 = 180 ms</text></g><g data-panel="true"><rect x="622" y="197" width="530" height="445" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="642" y="233.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">전체 서버: 10초 관측 창</text><text x="642" y="281.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 창에서 요청 A·B·C 모두 완료</text><text x="642" y="313.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">출력 토큰: A 3개 · B 5개 · C 2개</text><text x="642" y="345.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="642" y="377.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">요청 처리량 = 3 / 10</text><text x="642" y="409.79999999999995" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">= 0.3 req/s</text><text x="642" y="442.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">출력 토큰 처리량 = (3 + 5 + 2) / 10</text><text x="642" y="474.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">= 1 tok/s</text><text x="642" y="506.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">입력 토큰은 이 분자에 포함하지 않음</text></g><g data-panel="true"><rect x="48" y="685" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="720.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">TPOT도 종료 경계의 정의를 확인해야 합니다.</text><text x="72" y="762.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">본문은 마지막 토큰 170 ms를 사용합니다. 종료 180 ms를 쓰면 TPOT는 40 ms입니다.</text></g><g data-panel="true"><rect x="48" y="851" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="886.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">개별 지연 시간의 역수는 서버 전체 처리량이 아닙니다.</text><text x="72" y="928.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">숫자는 계산 연습용입니다. 한 요청만으로 p95·p99 같은 지연 분포를 알 수 없습니다.</text></g></svg>