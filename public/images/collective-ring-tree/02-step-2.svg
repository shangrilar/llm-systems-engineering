<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">Ring: 완성된 조각을 모두에게</title><desc id="desc">Ring: 완성된 조각을 모두에게 — 전달 2단계. 화살표: 보내는 조각 · 상자: 보관한 조각</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="830" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Ring: 완성된 조각을 모두에게</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">화살표: 보내는 조각 · 상자: 보관한 조각</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="237.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">2단계 · 전달한 뒤의 상태</text><path d="M758,355 L899,432" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="389.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">D</text><path d="M899,558 L758,635" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="615.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A</text><path d="M442,635 L301,558" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="615.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">B</text><path d="M301,432 L442,355" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="389.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">C</text><rect x="450" y="269" width="300" height="114" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="301.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0</text><text x="600" y="339.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">A · C · D</text><text x="600" y="369.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">새로 받은 조각: C</text><rect x="780" y="438" width="300" height="114" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="930" y="470.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">GPU 1</text><text x="930" y="508.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">A · B · D</text><text x="930" y="538.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">새로 받은 조각: D</text><rect x="450" y="607" width="300" height="114" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="639.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="600" y="677.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">A · B · C</text><text x="600" y="707.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">새로 받은 조각: A</text><rect x="120" y="438" width="300" height="114" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="270" y="470.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="270" y="508.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">B · C · D</text><text x="270" y="538.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">새로 받은 조각: B</text><text x="600" y="488.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">받은 조각을 보관</text><text x="600" y="517.4" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">다시 더하지 않음</text></svg>