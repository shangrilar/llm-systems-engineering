<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc"><title id="title">Routing creates load imbalance</title><desc id="desc">E0 and E1 process one token each, E2 six, and E3 none.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="925" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Routing creates load imbalance</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Each block is one token assignment, not a measured unit of execution time.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="208.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Four equal-size experts and eight top-1 token assignments</text><text x="48" y="298.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E0 · GPU 0</text><rect x="293" y="259" width="96" height="65" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="341" y="301.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><text x="1020" y="301.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1</text><text x="48" y="413.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E1 · GPU 0</text><rect x="293" y="374" width="96" height="65" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="341" y="416.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><text x="1020" y="416.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1</text><text x="48" y="528.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E2 · GPU 1</text><rect x="293" y="489" width="96" height="65" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="341" y="531.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><rect x="403" y="489" width="96" height="65" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="451" y="531.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><rect x="513" y="489" width="96" height="65" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="561" y="531.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><rect x="623" y="489" width="96" height="65" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="671" y="531.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><rect x="733" y="489" width="96" height="65" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="781" y="531.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><rect x="843" y="489" width="96" height="65" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="891" y="531.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><text x="1020" y="531.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">6</text><text x="48" y="643.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E3 · GPU 1</text><text x="307" y="646.0" fill="#526577" font-size="25" font-weight="400" text-anchor="start">None</text><text x="1020" y="646.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">0</text><rect x="48" y="781" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="817.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Equal expert counts do not guarantee equal work.</text><text x="72" y="857.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0: 2 tokens / GPU 1: 6 tokens → the busy GPU can delay completion.</text></svg>