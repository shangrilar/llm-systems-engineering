<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="837" viewBox="0 0 1200 837" role="img" aria-labelledby="title desc"><title id="title">Keep Q local; bring in the required K and V</title><desc id="desc">Each GPU retains Q for its own tokens and receives other required K,V blocks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="837" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Keep Q local; bring in the required K and V</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">K and V can move block by block; masked-out references are unnecessary.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="207" width="510" height="238" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="243.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Owned tokens: t0, t1</text><text x="66" y="325.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Local Q · K · V</text><text x="66" y="357.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Keep Q on this GPU</text><rect x="642" y="207" width="510" height="238" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="243.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Owned tokens: t2, t3</text><text x="660" y="325.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Local Q · K · V</text><text x="660" y="357.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Keep Q on this GPU</text><path d="M558,498 L639,498" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="600" y="478.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">Exchange K·V</text><path d="M642,550 L561,550" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="596" width="510" height="194" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="632.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="682.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Q₀₋₁ attends to required K·V</text><text x="66" y="714.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Output: t0, t1</text><rect x="642" y="596" width="510" height="194" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="632.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="682.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Q₂₋₃ attends to required K·V</text><text x="660" y="714.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Output: t2, t3</text></svg>