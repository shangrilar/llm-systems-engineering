" y="700" width="66" height="66" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="668" y="743.56" font-size="24" fill="#2470BB" font-weight="400" text-anchor="middle">●</text><rect x="775" y="260" width="355" height="198" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="797" y="300" font-size="26" fill="#2470BB" font-weight="700" text-anchor="start">GPU 0</text><text x="797" y="343" font-size="23" fill="#182C40" font-weight="700" text-anchor="start">t0 · t1 · t6 · t7</text><text x="797" y="390" font-size="23" fill="#182C40" font-weight="400" text-anchor="start">1 + 2 + 7 + 8</text><text x="797" y="431" font-size="25" fill="#2470BB" font-weight="700" text-anchor="start">= 18 token pairs</text><rect x="775" y="500" width="355" height="198" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="797" y="540" font-size="26" fill="#B55B22" font-weight="700" text-anchor="start">GPU 1</text><text x="797" y="583" font-size="23" fill="#182C40" font-weight="700" text-anchor="start">t2 · t3 · t4 · t5</text><text x="797" y="630" font-size="23" fill="#182C40" font-weight="400" text-anchor="start">3 + 4 + 5 + 6</text><text x="797" y="671" font-size="25" fill="#B55B22" font-weight="700" text-anchor="start">= 18 token pairs</text><text x="436" y="820" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">Rows: Q tokens / Columns: K tokens / ●: Computed pair</text><rect x="173" y="871" width="922" height="44" rx="10" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><text x="634" y="900" font-size="20" fill="#7954A3" font-weight="700" text-anchor="middle">Keep original positions and the causal mask; change only the assigned GPU.</text><text x="600" y="976" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">Token-pair counts are balanced here. Runtime also depends on communication and kernels.</text></g></g><path d="M48,1085 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1123" fill="#5C6