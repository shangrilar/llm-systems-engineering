<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" role="img" aria-labelledby="title desc"><title id="title">Choose the observation boundary first</title><desc id="desc">The engine selects at 90, 120, 160ms and the client observes at 100, 130, 170ms. Submission is 0ms, completion 180ms, and TTFT 100ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1018" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Choose the observation boundary first</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Arrows show selected tokens passing through output handling to the client.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="208.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Illustrative shared clock · assume one token per output chunk</text><text x="48" y="270.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">Engine selection</text><path d="M250,326 L1120,326" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="424.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Client observation</text><path d="M120,484 L1120,484" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="570" cy="326" r="8" fill="#2470BB"/><text x="570" y="293.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">x0 · 90 ms</text><path d="M570,341 L620,462" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="620" cy="484" r="8" fill="#287D78"/><text x="620" y="525.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x0 · 100 ms</text><circle cx="720" cy="326" r="8" fill="#2470BB"/><text x="720" y="293.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">x1 · 120 ms</text><path d="M720,341 L770,462" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="770" cy="484" r="8" fill="#287D78"/><text x="770" y="525.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x1 · 130 ms</text><circle cx="920" cy="326" r="8" fill="#2470BB"/><text x="920" y="293.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">x2 · 160 ms</text><path d="M920,341 L970,462" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="970" cy="484" r="8" fill="#287D78"/><text x="970" y="525.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x2 · 170 ms</text><circle cx="120" cy="484" r="8" fill="#182C40"/><text x="120" y="447.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">Send · 0 ms</text><text x="276" y="373.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">Includes input work,</text><text x="276" y="402.4" fill="#526577" font-size="21" font-weight="400" text-anchor="start">queueing, and prefill</text><path d="M120,598 V618 M120,608 H620 M620,598 V618" stroke="#526577" fill="none" stroke-width="2"/><text x="370.0" y="586.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">TTFT = 100 ms</text><path d="M620,675 V695 M620,685 H970 M970,675 V695" stroke="#526577" fill="none" stroke-width="2"/><text x="795.0" y="663.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">First → last token: 70 ms</text><path d="M120,764 V784 M120,774 H1020 M1020,764 V784" stroke="#526577" fill="none" stroke-width="2"/><text x="570.0" y="752.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Send → completion: E2E = 180 ms</text><text x="1020" y="818.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">Done · 180 ms</text><g data-panel="true"><rect x="48" y="859" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="894.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Selection time differs from the time seen by the user.</text><text x="72" y="936.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">When chunks contain several tokens, chunk gaps do not reveal each token’s</text><text x="72" y="968.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">individual ITL.</text></g></svg>