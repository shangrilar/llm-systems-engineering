"#7954A3" font-size="22" font-weight="400" text-anchor="middle">4 &lt; C의 입력 6</text><path d="M48,531 H1152" stroke="#DCE4EC"/><text x="48" y="587" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">필요한 블록만 배정</text><text x="1152" y="587" fill="#7954A3" font-size="27" font-weight="700" text-anchor="end">C 합류 가능</text><text x="232" y="644" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 2블록 = 8칸</text><text x="600" y="644" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · 2블록 = 8칸</text><text x="968" y="644" fill="#5C6C7C" font-size="24" font-weight="700" text-anchor="middle">가용 · 2블록 = 8칸</text><rect x="58" y="666" width="164" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="66" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="83" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="104" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="142" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="180" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="197" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="242" y="666" width="164" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="250" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="267" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="288" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text