<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1607" viewBox="0 0 1200 1607" role="img" aria-labelledby="title desc"><title id="title">RoPE: add position information before comparing Q and K</title><desc id="desc">After projection and grouping by head, rotate Q and K by position before Core Attention. V does not receive RoPE. Concatenate the head outputs and apply the output projection.</desc><metadata>{&quot;id&quot;:&quot;02-rope-location&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">RoPE: add position information before comparing Q and K</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">MHA · T = 3 · d = 8 · h = 2 · dh = 4</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><rect x="275" y="213" width="650" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="245" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">X · T × d = 3 × 8</text><text x="600" y="273" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Input vector for each token</text><path d="M600,302 L600,338" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="275" y="354" width="650" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="386" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Q·K·V projection</text><text x="600" y="414" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Compute Q, K and V for each token</text><path d="M600,444 L600,478" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><text x="600" y="520" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Group by head · only Head 1 is shown below</text><rect x="48" y="557" width="1104" height="780" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="105" y="592" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="250" y="624" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Q · 3 × 4</text><text x="250" y="652" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Three tokens in Head 1</text><path d="M250,681 L250,720" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="105" y="738" width="290" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="250" y="770" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">RoPE</text><text x="250" y="798" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Token positions 0 · 1 · 2</text><path d="M250,832 L250,906" fill="none" stroke="#287D78" stroke-width="2.5" marker-end="url(#arrow-teal)"/><rect x="105" y="925" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="2