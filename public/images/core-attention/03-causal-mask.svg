<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1470" viewBox="0 0 1200 1470" role="img" aria-labelledby="title desc">
<title id="title">마스크: 참조할 수 있는 토큰 구분</title><desc id="desc">3×3 점수 행렬의 대각선 위쪽을 −∞로 만든다. 토큰 1은 토큰 1만, 토큰 2는 토큰 1과 2, 토큰 3은 토큰 1과 2와 3을 참조한다. 각 행의 참조 가능한 토큰과 차단된 미래 토큰을 따로 표시한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1470" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">마스크: 참조할 수 있는 토큰 구분</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Softmax 전에 미래 위치의 점수를 −∞로 바꿉니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="197" width="1104" height="62" rx="14" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1.5"/><text x="80" y="237" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">Head 1 확대 · Head 2도 같은 순서로 독립적으로 계산합니다.</text><text x="600" y="315" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">각 토큰은 자기 자신과 이전 토큰만 참조합니다.</text><text x="300" y="377" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">스케일링한 점수</text><rect x="165.0" y="435" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="210.0" y="478.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="255.0" y="435" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="300.0" y="478.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="345.0" y="435" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="390.0" y="478.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="165.0" y="503" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="210.0" y="546.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="255.0" y="503" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="300.0" y="546.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="345.0" y="503" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="390.0" y="546.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="165.0" y="571" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="210.0" y="614.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="255.0" y="571" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="300.0" y="614.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="345.0" y="571" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="390.0" y="614.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><text x="210.0" y="416" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="300.0" y="416" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="390.0" y="416" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><text x="148" y="477.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="148" y="545.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="148" y="613.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><path d="M492,537 L699,537" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="600" y="496" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Causal mask</text><text x="890" y="377" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">마스크 적용 후</text><rect x="755.0" y="435" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="478.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="845.0" y="435" width="90.0" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="890.0" y="478.0" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="935.0" y="435" width="90.0" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="980.0" y="478.0" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="755.0" y="503" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="546.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="845.0" y="503" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="890.0" y="546.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="935.0" y="503" width="90.0" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="980.0" y="546.0" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="755.0" y="571" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="614.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="845.0" y="571" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="890.0" y="614.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="935.0" y="571" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="980.0" y="614.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><text x="800.0" y="416" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="890.0" y="416" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="980.0" y="416" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><text x="738" y="477.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="738" y="545.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="738" y="613.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="600" y="695" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">행 = Query 토큰 · 열 = Key 토큰 · 미래 위치의 점수는 −∞</text><path d="M48,741 L1152,741" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="90" y="832" fil