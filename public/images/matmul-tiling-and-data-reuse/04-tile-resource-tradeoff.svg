<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1155" viewBox="0 0 1200 1155" role="img" aria-labelledby="title desc"><title id="title">타일을 크게 잡으면 항상 유리할까요?</title><desc id="desc">작은 출력 타일은 입력 하나를 재사용하는 출력 수가 적고 큰 타일은 더 많다. 블록 타일의 확대는 공유 메모리의 입력 저장량을 늘릴 수 있고 스레드 타일의 확대는 레지스터의 입력과 부분합 저장량을 늘릴 수 있다. SM의 자원이 유한하므로 블록당 사용량이 커지면 동시에 상주 가능한 블록과 워프가 줄 수 있다. 네 개와 두 개의 블록 그림은 개념적인 자원 점유 비교이며 특정 타일 크기에 따른 실제 상주 수를 계산한 것이 아니다. 공유 메모리와 레지스터는 각각 별도의 자원 제한이다. 상주량이 높다고 항상 빠른 것도 아니며 타일 선택에는 행렬 모양과 작업량도 영향을 준다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1155" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">타일을 크게 잡으면 항상 유리할까요?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">데이터 재사용의 이점과 공유 메모리·레지스터 사용량을 함께 봅니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="219" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">재사용을 늘리려면, 더 많은 입력과 부분합을 가까이 보관해야 합니다.</text><rect x="48" y="254" width="536" height="791" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="303" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">작은 타일</text><rect x="266" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="316" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="266" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="316" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="578" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">입력 하나를 쓰는 출력이 적음</text><text x="316" y="624" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">보관할 입력·부분합이 적음</text><path d="M316,649 L316,687" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="76" y="710" width="480" height="223" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="753" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">SM의 한정된 자원</text><text x="316" y="790" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">공유 메모리 · 레지스터</text><rect x="95" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="145.5" y="865.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">블록</text><rect x="206" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="256.5" y="865.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">블록</text><rect x="317" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="367.5" y="865.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">블록</text><rect x="428" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="478.5" y="865.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">블록</text><text x="316" y="980" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">블록당 자원 사용이 작아</text><text x="316" y="1015" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">여러 블록이 상주할 여지가 있음</text><rect x="616" y="254" width="536" height="791" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="303" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">큰 타일</text><rect x="784" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="784" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="784" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="784" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="884" y="578" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">입력 하나를 더 많은 출력에 사용</text><text x="884" y="624" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">보관할 입력·부분합이 많음</text><path d="M884,649 L884,687" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="644" y="710" width="480" height="223" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="753" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">SM의 한정된 자원</text><text x="884" y="790" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">공유 메모리 · 레지스터</text><rect x="663" y="819" width="212" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="769.0" y="865.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">블록</text><rect x="885" y="819" width="212" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="991.0" y="865.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">블록</text><text x="884" y="980" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">블록당 자원 사용이 커져</text><text x="884" y="1015" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">상주할 블록·워프가 줄 수 있음</text><text x="600" y="1107" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">입력 재사용과 동시에 실행할 작업의 양을 함께 고려합니다.</text></svg>