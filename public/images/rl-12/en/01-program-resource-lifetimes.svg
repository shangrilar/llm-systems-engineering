<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1333" viewBox="0 0 1200 1333" role="img" aria-labelledby="title desc"><title id="title">An agent program outlives each model call</title><desc id="desc">Program P alternates Reasoning, Acting, Reasoning and Acting. GPU computation occurs during Reasoning and tool execution during Acting. In this example KV and the tool environment persist between calls and are released at termination.</desc><metadata>{&quot;id&quot;:&quot;12-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1#S4&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">An agent program outlives each model call</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The same coding program P writes, tests, revises and retests. While tools run, computation and</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">memory have different lifetimes.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(0.9857142857142858)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1120">Program P · one job across calls</text><path d="M0 68 L1120 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="118" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="1088">Execution order →</text><rect x="192" y="149" width="224" height="78" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="304" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">Write</text><text x="304" y="212" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">R</text><rect x="420" y="149" width="224" height="78" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="532" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">Test</text><text x="532" y="212" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">A</text><rect x="648" y="149" width="224" height="78" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="760" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">Edit</text><text x="760" y="212" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">R</text><rect x="876" y="149" width="224" height="78" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="988" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">Retest</text><text x="988" y="212" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">A</text><text x="16" y="300" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">GPU work</text><path d="M190 336 L1102 336" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="416" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">KV held</text><path d="M190 452 L1102 452" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="532" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">Tool env.</text><path d="M190 568 L1102 568" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="648" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">Tool work</text><path d="M190 684 L1102 684" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="195" y="275" width="218" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="304" y="307" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">Run</text><rect x="195" y="624" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="304" y="656" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="423" y="275" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="532" y="307" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="423" y="624" width="218" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="532" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">Run</text><rect x="651" y="275" width="218" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="760" y="307" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">Run</text><rect x="651" y="624" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="760" y="656" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="879" y="275" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="988" y="307" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="879" y="624" width="218" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="988" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">Run</text><rect x="195" y="391" width="902" height="49" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="646" y="422" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle" data-max-width="888">Keep KV · choice in this example</text><rect x="195" y="507" width="902" height="49" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="646" y="538" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle" data-max-width="888">Keep files and environment</text><text x="16" y="741" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="1088">R: Reasoning · model generation | A: Acting · tool execution</text><g data-container="true"><rect x="16" y="815" width="1088" height="108" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="846" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="1056">Program terminates → release resources</text><text x="32" y="886" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="1056">Call completion ≠ program termination.</text></g><text x="16" y="976" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="1088">Separate axis: scheduling state Active / Paused / Terminated</text></g></svg>