<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">KV caching avoids repeating prior computation</title><desc id="desc">Without caching, recompute p0 p1 p2 x0. With caching, process only x0 and let its Q attend to reused prior KV plus its new KV to select x1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1120" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">KV caching avoids repeating prior computation</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Compare one request’s next step. p denotes prompt tokens; x denotes selected output</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">tokens.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><g data-box="48,198,1104,108"><rect x="48" y="198" width="1104" height="108" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="233.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Current state: p0 p1 p2 have been processed and x0 selected</text><text x="70" y="275.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">The next step consumes x0 to select x1.</text></g><text x="48" y="365.0" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">Recompute without a cache</text><text x="642" y="365.0" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">Reuse previously computed KV</text><rect x="68" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="119.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="662" y="403" width="102" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="713.0" y="440.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="186" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="237.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="780" y="403" width="102" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="831.0" y="440.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="304" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="355.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="898" y="403" width="102" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="949.0" y="440.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="422" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="473.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="1016" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1067.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><g data-box="48,499,510,158"><rect x="48" y="499" width="510" height="158" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="68" y="534.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Run every input position again</text><text x="68" y="577.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Projections and MLP for p0 p1 p2 x0</text><text x="68" y="607.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Recompute K/V at prior positions</text></g><g data-box="642,499,510,158"><rect x="642" y="499" width="510" height="158" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="534.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Run only the new input position</text><text x="662" y="577.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Projections and MLP for x0</text><text x="662" y="607.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reuse stored K/V for p0 p1 p2</text></g><path d="M303,671 L303,705" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,671 L897,705" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,720,510,130"><rect x="48" y="720" width="510" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="755.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Final position → x1</text><text x="68" y="798.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Recompute earlier context</text><text x="68" y="828.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Attend to the full history</text></g><g data-box="642,720,510,130"><rect x="642" y="720" width="510" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="755.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">New Q attends to all K/V</text><text x="662" y="798.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(x0) and K/V(p0 p1 p2 x0)</text><text x="662" y="828.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Final position → x1</text></g><g data-box="48,901,1104,112"><rect x="48" y="901" width="1104" height="112" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="936.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Future tokens do not change earlier positions’ results</text><text x="70" y="978.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">With causal attention and fixed model conditions, reuse each layer’s earlier K/V.</text></g><text x="48" y="1064.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Orange: positions computed now · Green: reused KV · Cell sizes do not show runtime</text></svg>