<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1081" viewBox="0 0 1200 1081" role="img" aria-labelledby="title desc"><title id="title">Two engines can share GPUs or use separate pools</title><desc id="desc">Shared placement: generation and training alternate on four GPUs. Separate placement: the same four GPUs are split into two inference and two training GPUs. Sharing involves switching and memory management; separation involves allocation and weight transfer.</desc><metadata>{&quot;id&quot;:&quot;5-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0 architecture&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/developer/architecture.md&quot;},{&quot;label&quot;:&quot;Slime&quot;,&quot;url&quot;:&quot;https://github.com/THUDM/slime&quot;},{&quot;label&quot;:&quot;NeMo RL&quot;,&quot;url&quot;:&quot;https://github.com/NVIDIA-NeMo/RL&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Two engines can share GPUs or use separate pools</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The same total GPU resources are shown in two placements. The GPU count and split are</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">illustrative.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Shared placement</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="8" y="104" width="504" height="347" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="28" y="143" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="492">Total GPU resources</text><rect x="28" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="80.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 1</text><rect x="147" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="199.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 2</text><rect x="266" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="318.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 3</text><rect x="385" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="437.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 4</text><g data-container="true"><rect x="28" y="320" width="195" height="85" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="44" y="351" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="163">Generation</text></g><g data-container="true"><rect x="297" y="320" width="195" height="85" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="313" y="351" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="163">Training</text></g><path d="M231 348 L289 348" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M289 380 L231 380" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="28" y="285" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="455">Alternate on the same GPU pool</text><g data-container="true"><rect x="8" y="487" width="504" height="112" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="518" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">Switching cost</text><text x="24" y="558" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">Switch execution state between generation and</text><text x="24" y="586" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">training</text></g><g data-container="true"><rect x="8" y="623" width="504" height="137" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="654" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">Memory management</text><text x="24" y="694" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">Make memory available for the next phase</text></g></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Separate placement</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="8" y="104" width="504" height="347" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="28" y="143" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="492">Total GPU resources</text><rect x="24" y="170" width="225" height="249" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="271" y="170" width="225" height="249" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="42" y="209" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="186">Inference</text><text x="289" y="209" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="186">Training</text><rect x="42" y="240" width="188" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="136" y="277" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 1</text><rect x="42" y="326" width="188" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="136" y="363" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 2</text><rect x="289" y="240" width="188" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="383" y="277" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 3</text><rect x="289" y="326" width="188" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="383" y="363" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 4</text><g data-container="true"><rect x="8" y="487" width="504" height="112" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="518" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">Resource allocation</text><text x="24" y="558" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">Size the two pools for the workload</text></g><g data-container="true"><rect x="8" y="623" width="504" height="137" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="654" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">Weight transfer</text><text x="24" y="694" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">Send updated weights to the inference pool</text></g></g></svg>