<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1672" viewBox="0 0 1200 1672" role="img" aria-labelledby="title desc"><title id="title">MLP and MoE in the same position</title><desc id="desc">A gated MLP uses Gate projection and SiLU, Up projection, their elementwise product, then Down projection. MoE takes a weighted sum of two selected gated MLP experts and optionally adds a shared expert output. Both map one d-dimensional token input to a d-dimensional output.</desc><metadata>{&quot;id&quot;:&quot;03-mlp-and-moe&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">MLP and MoE in the same position</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">How is one token transformed? Both structures return to d dimensions.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><rect x="48" y="285" width="528" height="1145" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="331" fill="#182C40" font-size="31" font-weight="600" text-anchor="middle">Gated MLP</text><text x="312" y="376" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Apply the same MLP to every token</text><rect x="192" y="425" width="240" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="455" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">x</text><text x="312" y="482" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">One token, d dimensions</text><rect x="624" y="285" width="528" height="1145" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="331" fill="#182C40" font-size="31" font-weight="600" text-anchor="middle">MoE</text><text x="888" y="376" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Select experts for each token</text><rect x="768" y="425" width="240" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="455" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">x</text><text x="888" y="482" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">One token, d dimensions</text><path d="M312,510 V532 H182 V548" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><path d="M312,532 H442 V548" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><rect x="69.5" y="562" width="225" height="80" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="182" y="592" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Gate projection</text><text x="182" y="619" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → m</text><rect x="329.5" y="562" width="225" height="80" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="442" y="592" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Up projection</text><text x="442" y="619" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → m</text><path d="M182,655 L182,688" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="69.5" y="702" width="225" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="182" y="732" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">SiLU</text><text x="182" y="759" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Elementwise activation</text><path d="M182,795 V900 H278" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><path d="M442,655 V900 H346" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><circle cx="312" cy="900" r="24" fill="white" stroke="#287D78" stroke-width="3"/><text x="312" y="909" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">⊙</text><text x="312" y="960" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Multiply matching components</text><text x="312" y="995" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">m dimensions</text><path d="M312,1010 L312,1034" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="137" y="1048" width="350" height="85" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="1078" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Down projection</text><text x="312" y="1105" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">m → d</text><path d="M312,1146 L312,1274" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="192" y="1290" width="240" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="1320" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">y</text><text x="312" y="1347" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d-dimensional output</text><path d="M888,510 V532 H806 V548" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><path d="M888,532 H1060 V728" fill="none" stroke="#8191A0" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-slate)"/><path d="M888,518 H645 V830 H655" fill="none" stroke="#2470BB" stroke-width="2.2" marker-end="url(#arrow-blue)"/><text x="669" y="700" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start">Input x</text><rect x="661" y="562" width="290" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="806" y="592" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">Router</text><text x="806" y="619" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Selection + weights</text><path d="M806,655 L806,727" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="661" y="742" width="290" height="180" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="806" y="781" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Selected experts</text><rect x="677" y="806" width="118" height="85" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="736" y="836" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">E1</text><text x="736" y="863" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → d</text><rect x="817" y="806" width="118" height="85" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="876" y="836" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">E3</text><text x="876" y="863" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → d</text><path d="M806,937 L806,1027" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="661" y="1040" width="290" height="88" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="806" y="1070" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">Combine</text><text x="806" y="1097" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Sum with Router weights</text><rect x="981" y="742" width="158" height="180" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1060" y="784" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">Shared</text><text x="1060" y="815" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">expert</text><text x="1060" y="858" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">Optional</text><text x="1060" y="894" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">d → d</text><path d="M806,1142 V1210 H854" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><path d="M1060,938 V1210 H922" fill="none" stroke="#8191A0" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-slate)"/><circle cx="888" cy="1210" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M879,1210 L897,1210" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M888,1201 L888,1219" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M888,1244 L888,1274" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="768" y="1290" width="240" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="1320" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">y</text><text x="888" y="1347" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d-dimensional output</text><text x="600" y="1494" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Each expert also has the gated MLP structure shown on the left.</text><text x="600" y="1542" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Dashed path: an optional shared expert, applied to every token</text></g></g><path d="M48,1594 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1632" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Both the gated MLP and MoE turn one token’s d-dimensional input into a d-dimensional output.</text></svg>