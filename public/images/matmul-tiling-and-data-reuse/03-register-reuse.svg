<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">레지스터에 읽어온 값도 여러 계산에 사용합니다</title><desc id="desc">블록이 맡은 4×4 출력 중 2×2를 한 스레드가 맡는 예시다. 첫 번째 곱을 위해 공유 메모리의 A[0,0], A[1,0], B[0,0], B[0,1]을 레지스터로 읽는다. a0,b0로 c00, a0,b1로 c01, a1,b0로 c10, a1,b1로 c11에 곱을 누적한다. 각 입력은 두 곱셈에 사용된다. 부분합은 지금까지 계산한 곱을 더한 값이며 처음 0으로 시작한다. 입력 a,b 레지스터는 다음 곱을 계산할 때 새 값을 받지만 네 부분합은 모든 곱을 더할 때까지 유지된다. 레지스터는 이 스레드의 상태이며 다른 스레드와 공유하는 저장소가 아니다. CUDA 코어의 스칼라 곱셈과 누산으로 설명하는 개념도다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1160" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">레지스터에 읽어온 값도 여러 계산에 사용합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">출력 하나 대신 작은 출력 타일을 맡으면, 스레드 내부에서도 입력을 재사용할 수 있습니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="1104" height="99" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="76" y="246" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">블록이 맡은 출력 중 2 × 2 영역을 한 스레드가 계산한다고 해봅시다.</text><text x="76" y="281" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">부분합은 지금까지 계산한 곱을 더한 값입니다. 출력 네 개의 부분합을 유지합니다.</text><rect x="48" y="337" width="1104" height="576" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="382" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">각 출력에 필요한 여러 곱 중, 첫 번째 곱을 계산하는 순간</text><rect x="421" y="431" width="280" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="561.0" y="472.0" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">b0 = B[0, 0]</text><rect x="757" y="431" width="280" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="897.0" y="472.0" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">b1 = B[0, 1]</text><rect x="77" y="552" width="278" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="216.0" y="593.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">a0 = A[0, 0]</text><rect x="77" y="711" width="278" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="216.0" y="752.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">a1 = A[1, 0]</text><rect x="421" y="529" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="561" y="568" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c00</text><text x="561" y="613" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">a0 × b0 더하기</text><rect x="757" y="529" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="897" y="568" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c01</text><text x="897" y="613" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">a0 × b1 더하기</text><rect x="421" y="688" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="561" y="727" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c10</text><text x="561" y="772" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">a1 × b0 더하기</text><rect x="757" y="688" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="897" y="727" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c11</text><text x="897" y="772" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">a1 × b1 더하기</text><path d="M366,585 L407,585" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><path d="M366,744 L407,744" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><path d="M561,502 L561,522" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><path d="M897,502 L897,522" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="600" y="864" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">입력 네 개를 읽어 네 곱셈에 사용 · 각 입력을 두 번씩 재사용</text><rect x="48" y="950" width="1104" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="600" y="994" fill="#B55B22" font-size="26" font-weight="700" text-anchor="middle">c00, c01, c10, c11은 레지스터에 유지</text><text x="600" y="1034" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle">두 번째, 세 번째 곱도 여기에 더합니다. 모든 곱을 더하면 출력이 완성됩니다.</text><text x="600" y="1115" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">공유 메모리에서 읽어온 값도, 여러 계산에 다시 사용할 수 있습니다.</text></svg>