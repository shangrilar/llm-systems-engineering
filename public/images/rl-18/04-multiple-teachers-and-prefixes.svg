<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1343" viewBox="0 0 1200 1343" role="img" aria-labelledby="title desc"><title id="title">교사와 학생이 시작할 문맥을 함께 고른다</title><desc id="desc">왼쪽은 질문부터 학생이 전체 rollout을 만들고 mixRL 교사가 지도하는 Standard MOPD이다. 오른쪽은 교사 rollout 또는 SFT 데이터에서 만든 h1은 P와 원본 2턴, h2는 P와 원본 3턴을 포함한다. 학생은 각각 새 3턴 y1과 새 4턴 y2를 독립적으로 생성하고 지정된 교사로부터 지도받는다. 두 경로 모두 학생을 업데이트한다.</desc><metadata>{&quot;id&quot;:&quot;5-4&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;MiMo V2.6 §5.6 · Figure 13&quot;,&quot;url&quot;:&quot;https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/blob/main/MiMo_V2_6_technical_report.pdf&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">교사와 학생이 시작할 문맥을 함께 고른다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">MiMo MOPD²는 전체 학생 rollout과, 준비된 대화 이력에서 시작하는 한 턴 생성을 함께 사용합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">전체를 학생이 생성</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="112" width="488" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="143" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">검증 가능한 분야</text><text x="32" y="183" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">적합한 mixRL 교사 활용</text></g><g data-container="true"><rect x="16" y="286" width="488" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="317" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">프롬프트 P</text><text x="32" y="357" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">주어진 시작 문맥</text></g><path d="M260 388 L260 448" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="461" width="488" height="164" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="492" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학생의 전체 rollout</text><text x="32" y="532" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">y₁ → y₂ → … → yT</text><text x="32" y="560" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">이후 대화도 학생이 이어서 생성</text></g><path d="M260 637 L260 755" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M508 165 H518 V807 H508" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="768" width="488" height="145" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="799" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 문맥에서 교사가 평가</text><text x="32" y="839" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">학생의 앞선 토큰을 조건으로</text><text x="32" y="867" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">토큰별 확률 정보 제공</text></g><path d="M260 925 L260 964" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="977" width="488" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="1008" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학생 손실 → 학생 가중치 갱신</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">준비된 이력에서 한 턴 생성</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="112" width="488" height="130" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="143" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">이력의 출처</text><text x="32" y="183" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">교사가 만든 rollout 또는 SFT 데이터</text><text x="32" y="211" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">각 assistant 턴 직전까지 잘라 준비</text></g><text x="16" y="322" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">h₁ · P + 원본 2턴</text><g data-container="true"><rect x="16" y="350" width="48" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="381" fill="#657789" font-size="22" font-we