<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc">
<title id="title">위치가 반영되면 Attention 점수도 달라집니다</title><desc id="desc">이전 편 Q/K를 그대로 사용한다. 위치에 따라 두 성분 쌍을 회전하고 스케일링한 점수를 전후 비교한다. 대각선은 같고 비대각선은 달라진다. 마스크, Softmax, PV로 이어진다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1570" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 6</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">위치가 반영되면 Attention 점수도 달라집니다</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">T = 3 · dh = 4 · 점수는 √dh = 2로 나눈 값</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
