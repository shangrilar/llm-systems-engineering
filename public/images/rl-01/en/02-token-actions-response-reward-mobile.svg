<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1247" viewBox="0 0 360 1247" role="img" aria-labelledby="title desc"><title id="title">Choose tokens repeatedly, then evaluate the response</title><desc id="desc">The same LLM chooses x1 from the prompt, then x2 from the prompt plus x1. The completed response 2+3=5 is checked for correctness and receives a reward of +1.</desc><metadata>{&quot;id&quot;:&quot;1-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;RLHF Book — Training Overview&quot;,&quot;url&quot;:&quot;https://rlhfbook.com/c/03-training-overview&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Choose tokens repeatedly,</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">then evaluate the</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">response</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Each chosen token enters the next</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">context. This example receives one</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">reward at completion.</text><path d="M16,234.79999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 258.79999999999995) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Append each choice to the next input</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="104" width="488" height="102" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="135" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Context 1</text><text x="32" y="175" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Prompt: “What is 2+3?”</text></g><path d="M210 215 L210 236" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="112" y="247" width="196" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="128" y="278" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="164">Same LLM</text></g><path d="M317 285 L359 285" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="371" y="260" width="82" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="412" y="292" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">x₁</text><path d="M412 318 V373" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="386" width="488" height="102" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="417" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Context 2</text><text x="32" y="457" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Prompt: “What is 2+3?” + x₁</text></g><path d="M210 497 L210 518" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="112" y="529" width="196" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="128" y="560" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="164">Same LLM</text></g><path d="M317 567 L359 567" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="371" y="542" width="82" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="412" y="574" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">x₂</text><text x="16" y="682" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">Repeated calls to the same model</text><text x="16" y="718" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">Choose → extend context → choose again → …</text></g><g transform="translate(16 754.8307692307692) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Assign one reward to this response</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="114" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Successive choices form one response</text><rect x="31" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="76" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">x₁</text><rect x="153" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="198" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">x₂</text><rect x="275" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="320" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">…</text><rect x="397" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="442" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">xₜ</text><path d="M31 210 V226 H487 V210" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="260" y="261" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="480">Whole response</text><g data-container="true"><rect x="30" y="294" width="460" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="325" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Completed response</text><text x="46" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">“2+3=5”</text></g><path d="M260 409 L260 436" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="30" y="447" width="460" height="116" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="478" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Check the answer</text><text x="46" y="518" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Check whether the completed answer is</text><text x="46" y="546" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">correct</text></g><path d="M260 575 L260 601" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="130" y="612" width="260" height="76" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="146" y="643" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="228">Reward +1</text></g><text x="16" y="732" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">Evaluate once, after completion, in this example</text></g></svg>