<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="979" viewBox="0 0 1200 979" role="img" aria-labelledby="title desc">
<title id="title">Reduce-Scatter: 합산한 결과를 나눠 갖기</title><desc id="desc">각 GPU의 입력은 각각 [1,2,3,4], [10,20,30,40], [100,200,300,400], [1000,2000,3000,4000]이다. 모든 GPU가 네 결과 위치 각각에 기여한다. 위치별 합은 [1111,2222,3333,4444]이며 완료 후 GPU 0,1,2,3이 각각 한 원소씩 받는다. 가운데 전체 합은 결과를 설명하기 위한 표현이며 특정 GPU의 중간 버퍼가 아니다. 이 출력들을 같은 rank 순서로 All-Gather하면 모든 GPU가 네 원소 합산 결과를 갖게 되어 동일 입력의 All-Reduce 결과와 같다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="979" fill="white"/>
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">집합 통신의 조합과 확장 · 그림 3</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Reduce-Scatter: 합산한 결과를 나눠 갖기</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">각 GPU가 네 위치의 값을 제공하고, 합산된 결과 중 한 원소씩 받습니다.</text><path d="M48,169 H1152" stroke="#DCE4EC"/><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">통신 전 · 입력 버퍼</text><rect x="48" y="229" width="264" height="190" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="72" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="236.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><rect x="72" y="347" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124.0" y="378" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">3</text><rect x="184" y="347" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="236.0" y="378" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">4</text><path d="M180,428 V457" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="229" width="264" height="190" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5"/><text x="364" y="267" fill="#287D78" f