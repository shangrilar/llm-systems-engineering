<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1206" viewBox="0 0 1200 1206" role="img" aria-labelledby="title desc"><title id="title">Learned weights of CSA attention</title><desc id="desc">A CSA layer has query, local-KV and output weights with HCA’s structure, plus twice-as-wide overlapping-compression weights (the a|b halves of W^{KV}_{comp} and W^Z) and an indexer. The indexer takes X and the c^Q shared with the main query and returns the block ids to select.</desc><metadata>{&quot;id&quot;:&quot;csa-flow-01-weight-map&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 report · §2.3.1 (CSA)&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro&quot;},{&quot;label&quot;:&quot;DeepSeek-V4-Pro inference code · Attention, Compressor, Indexer&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/blob/main/inference/model.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker i