<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1171" viewBox="0 0 360 1171" role="img" aria-labelledby="title desc"><title id="title">Fuse after gaining context; start lookup in advance</title><desc id="desc">Input fusion allows subsequent attention and MoE to learn how to use N-gram features. Middle-layer insertion uses context from preceding attention to gate memory. Token IDs determine addresses early, allowing CPU retrieval and transfer to overlap preceding GPU computation. Achievable overlap depends on hardware and workload. Very late insertion prevents earlier layers from using the memory. Bar lengths are not measured times.</desc><metadata>{&quot;id&quot;:&quot;ma-20-05&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2, §4.1, §6.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 5</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Fuse after gaining</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">context; start lookup in</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">advance</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Input fusion is a valid alternative ·</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Timelines are qualitative</text><path d="M16,211 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 235) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Fuse at the input</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="190" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="148" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="178">e(B)</text><rect x="290" y="110" width="210" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="395" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">g(A,B)</text><path d="M115 180 V220 H235" stroke="#2470BB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M395 180 V220 H285" stroke="#287D78" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/><circle cx="260" cy="220" r="22" fill="#FFF2E6" stroke="#B55B22"/><text x="260" y="229" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle" data-max-width="35">+</text><path d="M260 250 L260 300" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="50" y="310" width="420" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="341" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="388">First attention → later layers</text><text x="66" y="381" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="388">Learns to use the combined features</text></g><text x="20" y="505" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" data-max-width="480">Execution order →</text><rect x="20" y="540" width="180" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="110" y="580.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">Fetch</text><path d="M210 572 L265 572" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><rect x="280" y="540" width="220" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="390" y="580.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">Block 1</text></g><g transform="translate(16 704.5384615384615) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Fuse after gaining context</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="190" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="148" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="178">e(B)</text><rect x="290" y="110" width="210" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="395" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">g(A,B)</text><path d="M115 180 L115 220" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="230" width="230" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="261" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">First attention</text><text x="36" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">h: context</text></g><path d="M395 180 V365 H390 V375" stroke="#287D78" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/><path d="M135 340 L135 375" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="385" width="480" height="80" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="416" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Context gate → fusion → later layers</text></g><text x="20" y="505" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" data-max-width="490">Time → overlap the two tasks</text><rect x="20" y="540" width="320" height="55" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="575.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">GPU · Block 1</text><rect x="20" y="620" width="320" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="180" y="655.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">CPU → GPU · Fetch</text><path d="M365 540 V675" stroke="#B55B22" stroke-width="3" fill="none"/><text x="440" y="580" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="130">Join</text></g></svg>