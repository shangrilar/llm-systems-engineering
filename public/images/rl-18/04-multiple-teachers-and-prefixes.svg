="66">1턴</text><rect x="158" y="545" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="197" y="577" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">원본</text><text x="197" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">2턴</text><rect x="244" y="545" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="283" y="577" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">원본</text><text x="283" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">3턴</text><path d="M332 597 L366 597" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="378" y="545" width="126" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="441" y="577" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle" data-max-width="106">y₂</text><text x="441" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="112">새 4턴</text><path d="M508 597 H518 V720" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M518 720 H260 V755" stroke="#2470BB" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="768" width="488" height="145" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="799" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">지정된 분야 교사가 평가</text><text x="32" y="839" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">mixRL 교사 또는 SFT 교사</text><text x="32" y="867" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">조건: 같은 hᵢ + 학생의 앞선 토큰</text></g><path d="M260 925 L260 964" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="977" width="488" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="1008" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학생 손실 → 학생 가중치 갱신</text></g></g></svg>