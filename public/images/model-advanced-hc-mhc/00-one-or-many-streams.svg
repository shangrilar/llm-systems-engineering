<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="917" viewBox="0 0 1200 917" role="img" aria-labelledby="title desc"><title id="title">층의 결과를 담는 경로를 넓힐 수 있을까요?</title><desc id="desc">왼쪽에서 e에 f1과 f2가 차례로 더해져 e+f1+f2가 된다. 오른쪽은 각 깊이에서 같은 토큰의 두 표현을 함께 유지하며 층별 연결 상자를 통해 갱신한다.</desc><metadata>{&quot;id&quot;:&quot;ma-13-00&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC §1, residual and expanded stream&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">층의 결과를 담는 경로를 넓힐 수 있을까요?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 토큰의 깊이 방향 흐름 · 표현 하나는 d차원 벡터</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 한 stream에 누적</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="110" y="115" width="300" height="64" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">e</text><path d="M260 189 L260 222" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><circle cx="260" cy="250" r="20" fill="#FFFFFF" stroke="#287D78"/><text x="260" y="257" fill="#182C40" font-size="27" font-weight="400" text-anchor="middle" data-max-width="35">+</text><rect x="20" y="226" width="100" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="70" y="258" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">f₁</text><path d="M130 250 L230 250" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M260 273 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="110" y="285" width="300" height="64" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="325" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">e + f₁</text><path d="M260 359 L260 392" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><circle cx="260" cy="420" r="20" fill="#FFFFFF" stroke="#287D78"/><text x="260" y="427" fill="#182C40" font-size="27" font-weight="400" text-anchor="middle" data-max-width="35">+</text><rect x="20" y="396" width="100" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="70" y="428" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">f₂</text><path d="M130 420 L230 420" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M260 443 L260 448" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="110" y="455" width="300" height="64" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="495" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">e + f₁ + f₂</text><text x="260" y="615" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">각 층의 새 결과를 같은 벡터에 더함</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 여러 stream을 유지</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="65" y="115" width="165" height="64" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="147.5" y="155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="153">x₁</text><rect x="290" y="115" width="165" height="64" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="372.5" y="155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="153">x₂</text><path d="M148 189 L148 209" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M373 189 L373 209" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="65" y="218" width="390" height="48" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="81" y="249" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">층별 연결과 갱신</text></g><path d="M148 273 L148 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M373 273 L373 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="65" y="285" width="165" height="64" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="147.5" y="325" fill="#287D78" font-size="22" font-weight="600" text-anchor="m