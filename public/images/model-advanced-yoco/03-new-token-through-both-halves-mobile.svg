<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1639" viewBox="0 0 360 1639" role="img" aria-labelledby="title desc"><title id="title">새 토큰도 앞부분을 거쳐 기억에 추가됩니다</title><desc id="desc">x4가 self-decoder1과2를 통과하며 각기 S1과S2를 읽고 갱신한다. 출력 m4에서 k4,v4를 만들어 이전 네 행이 남아 있는 global bank에 주황 p4 행을 추가한다. Cross-decoder3과4가 각각 q3,q4로 같은 다섯 행을 읽고 LM head가 x5를 선택한다.</desc><metadata>{&quot;id&quot;:&quot;yoco-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;YOCO §2 and §3.1, recurrent state and global KV&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.05254v1#S2&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report §2.2–2.3&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D7