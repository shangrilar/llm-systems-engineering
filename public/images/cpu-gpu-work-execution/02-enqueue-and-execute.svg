<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="813" viewBox="0 0 1200 813" role="img" aria-labelledby="title desc"><title id="title">등록한 작업은 언제 실행될까?</title><desc id="desc">같은 시간축의 CPU 행에는 A 등록과 B 등록 후 다른 CPU 작업이 있다. GPU 스트림 S에서는 A 후 B가 실행된다. 세로 표시 시점에 CPU는 B 등록까지 마쳤지만 GPU는 A를 실행 중이다. 입력 복사는 미리 완료된 상태다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="813" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 5 · 그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">등록한 작업은 언제 실행될까?</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">CPU가 작업을 등록하는 시점과 GPU가 실행을 마치는 시점은 다릅니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="222" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">입력 x는 이미 GPU에 준비된 상태</text><path d="M240,254 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="239" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="327" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU</text><text x="48" y="363" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">작업 등록</text><rect x="240" y="292" width="126" height="70" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="303.0" y="336.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">A 등록</text><rect x="410" y="292" width="126" height="70" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="473.0" y="336.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">B 등록</text><rect x="650" y="292" width="488" height="70" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="894.0" y="336.0" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">다른 CPU 작업</text><text x="48" y="506" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU</text><text x="48" y="542" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">스트림 S</text><rect x="376" y="474" width="404" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="578.0" y="526.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">계산 A  ·  x → u</text><rect x="780" y="474" width="358" height="86" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="959.0" y="526.0" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">계산 B  ·  u → y</text><path d="M366,373 L376,464" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" stroke-dasharray="7 7"/><path d="M536,373 L780,464" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" stroke-dasharray="7 7"/><path d="M608,275 V490 M608,545 V585" fill="none" stroke="#B55B22" stroke-width="2.5" stroke-dasharray="7 7"/><text x="608" y="619" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">이 시점</text><rect x="48" y="657" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="702" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">CPU는 B까지 등록했지만, GPU는 아직 A를 실행 중입니다.</text><text x="600" y="741" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">같은 스트림에서는 A가 끝난 뒤 B가 실행됩니다.</text></svg>