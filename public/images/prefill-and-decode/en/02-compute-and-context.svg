<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1374" viewBox="0 0 1200 1374" role="img" aria-labelledby="title desc"><title id="title">Tokens processed and context length are different</title><desc id="desc">Prefill processes four positions p0 p1 p2 p3, giving four rows for token-wise projection and MLP operations. Decode processes only the new x0, giving one row. Prefill attention follows a causal triangle with four rows and four columns; the decode query at x0 reads K and V at five positions p0 p1 p2 p3 x0. T is the number of positions processed now; L is context length including the current position.</desc><metadata>{&quot;id&quot;:&quot;02-compute-and-context&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Tokens processed and context length are different</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">With a cache, past token-wise work is skipped, but attention still reads past K/V.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="223" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Prefill</text><text x="650" y="223" fill="#B55B22" font-size="29" font-weight="700" text-anchor="start">Decode</text><text x="48" y="265" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Input positions to process</text><text x="650" y="265" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Input positions to process</text><rect x="48" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88" y="326" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="140" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="326" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="232" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="272" y="326" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="324" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="364" y="326" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p3</text><rect x="650" y="289" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="690" y="326" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="420" y="326" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">T = 4</text><text x="805" y="326" fill="#B55B22" font-size="28" font-weight="700" text-anchor="start">T = 1</text><text x="48" y="408" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Rows in token-wise operations</text><text x="48" y="449" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Projection · MLP, etc.</text><text x="84" y="507" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p0</text><rect x="132" y="476" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M248,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M306,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M364,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M422,476 V516" stroke="#2470BB" stroke-width="1"/><text x="84" y="556" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p1</text><rect x="132" y="525" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M248,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M306,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M364,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M422,525 V565" stroke="#2470BB" stroke-width="1"/><text x="84" y="605" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p2</text><rect x="132" y="574" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M248,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M306,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M364,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M422,574 V614" stroke="#2470BB" stroke-width="1"/><text x="84" y="654" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p3</text><rect x="132" y="623" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M248,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M306,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M364,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M422,623 V663" stroke="#2470BB" stroke-width="1"/><text x="306" y="715" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Same weights for each row</text><text x="686" y="507" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">x0</text><rect x="734" y="476" width="348" height="40" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M792,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M850,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M908,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M966,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M1024,476 V516" stroke="#B55B22" stroke-width="1"/><text x="908" y="715" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle">Same weights for each row</text><path d="M48,749 H1152" stroke="#DCE4EC"/><text x="48" y="798" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Positions read by attention</text><text x="48" y="842" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Rows: current Q · columns: K/V positions</text><text x="158" y="889" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><text x="231" y="889" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><text x="304" y="889" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><text x="377" y="889" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><text x="104" y="945" fill="#2470BB" font-size="22" font-weight="700" text-anchor="end">p0</text><rect x="126" y="909" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="158" y="943" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="199" y="909" width="64" height="49" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="