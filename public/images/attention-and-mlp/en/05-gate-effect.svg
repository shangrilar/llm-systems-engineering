<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1384" viewBox="0 0 1200 1384" role="img" aria-labelledby="title desc"><title id="title">Gate: adjust components based on the input</title><desc id="desc">Four components are shown: Up [2,-1,3,0.5] times post-SiLU Gate [0.1,1.5,0,2] gives [0.2,-1.5,0,1]. Component 1 shrinks, 2 and 4 grow in magnitude, and 3 becomes zero. Bars share a scale and negatives extend downward. SwiGLU Gate values can exceed 1 or be negative.</desc><metadata>{&quot;id&quot;:&quot;05-gate-effect&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Gate: adjust components based on the input</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">One branch produces intermediate values; the other produces their multipliers.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><text x="600" y="224" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Zoom in on four intermediate components. Gate values are after SiLU.</text><text x="350" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Component 1</text><text x="570" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Component 2</text><text x="790" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Component 3</text><text x="1010" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Component 4</text><text x="70" y="351" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">Up values u</text><rect x="240" y="310" width="220" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="350" y="352" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">2</text><rect x="460" y="310" width="220" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="570" y="352" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">−1</text><rect x="680" y="310" width="220" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="790" y="352" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">3</text><rect x="900" y="310" width="220" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1010" y="352" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">0.5</text><text x="70" y="473" fill="#287D78" font-size="25" font-weight="600" text-anchor="start">Gate values g</text><rect x="240" y="432" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350" y="474" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0.1</text><rect x="460" y="432" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="570" y="474" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">1.5</text><rect x="680" y="432" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="790" y="474" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0</text><rect x="900" y="432" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1010" y="474" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">2</text><text x="70" y="615" fill="#287D78" font-size="25" font-weight="600" text-anchor="start">u ⊙ g</text><rect x="240" y="574" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350" y="616" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0.2</text><rect x="460" y="574" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="570" y="616" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">−1.5</text><rect x="680" y="574" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="790" y="616" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0</text><rect x="900" y="574" width="220" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1010" y="616" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">1</text><path d="M240,540 L1120,540" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="694" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">Input-dependent Gate values multiply the corresponding Up values.</text><rect x="48" y="737" width="1104" height="415" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="355" y="769" width="18" height="18" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="385" y="785" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">Up value</text><rect x="655" y="769" width="18" height="18" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="685" y="785" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">Product</text><text x="350" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Smaller magnitude</text><path d="M268,1044 L432,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="259" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="301" y="936" width="36" height="108" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="363" y="1033.2" width="36" height="10.8" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="350" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">1</text><text x="570" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Larger magnitude</text><path d="M488,1044 L652,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="479" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="521" y="1044" width="36" height="54" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="583" y="1044" width="36" height="81" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="570" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">2</text><text x="790" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Zero</text><path d="M708,1044 L872,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="699" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="741" y="882" width="36" height="162" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M803,1044 L839,1044" fill="none" stroke="#287D78" stroke-width="4"/><text x="790" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">3</text><text x="1010" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Larger magnitude</text><path d="M928,1044 L1092,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="919" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="961" y="1017" width="36" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="1023" y="990" width="36" height="54" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1010" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">4</text><text x="600" y="1200" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">All bars share one scale. Negative values extend below zero.</text><text x="600" y="1253" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">SwiGLU Gate values are not restricted to 0–1; they can also be negative.</text></g></g><path d="M48,1306 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1344" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Illustrative values showing the product. Both branches use the same token input.</text></svg>