<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" role="img" aria-labelledby="title desc"><title id="title">어디에서 시간을 재는지 먼저 정하기</title><desc id="desc">엔진은 90, 120, 160ms에 토큰을 선택하고 클라이언트는 100, 130, 170ms에 관측합니다. 제출 0ms, 종료 180ms이며 TTFT는 100ms입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1018" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">어디에서 시간을 재는지 먼저 정하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">화살표는 선택된 토큰이 출력 처리를 거쳐 클라이언트에 도달하는 경로입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="208.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">같은 시간축의 교육용 값 · 한 출력 청크에 토큰 하나를 가정</text><text x="48" y="270.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">엔진 선택</text><path d="M250,326 L1120,326" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="424.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">클라이언트 관측</text><path d="M120,484 L1120,484" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="570" cy="326" r="8" fill="#2470BB"/><text x="570" y="293.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">x0 · 90 ms</text><path d="M570,341 L620,462" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="620" cy="484" r="8" fill="#287D78"/><text x="620" y="525.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x0 · 100 ms</text><circle cx="720" cy="326" r="8" fill="#2470BB"/><text x="720" y="293.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">x1 · 120 ms</text><path d="M720,341 L770,462" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="770" cy="484" r="8" fill="#287D78"/><text x="770" y="525.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x1 · 130 ms</text><circle cx="920" cy="326" r="8" fill="#2470BB"/><text x="920" y="293.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">x2 · 160 ms</text><path d="M920,341 L970,462" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="970" cy="484" r="8" fill="#287D78"/><text x="970" y="525.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x2 · 170 ms</text><circle cx="120" cy="484" r="8" fill="#182C40"/><text x="120" y="447.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">제출 · 0 ms</text><text x="276" y="373.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">입력 준비·큐 대기·prefill</text><text x="276" y="402.4" fill="#526577" font-size="21" font-weight="400" text-anchor="start">포함</text><path d="M120,598 V618 M120,608 H620 M620,598 V618" stroke="#526577" fill="none" stroke-width="2"/><text x="370.0" y="586.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">TTFT = 100 ms</text><path d="M620,675 V695 M620,685 H970 M970,675 V695" stroke="#526577" fill="none" stroke-width="2"/><text x="795.0" y="663.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">첫 토큰 → 마지막 토큰: 70 ms</text><path d="M120,764 V784 M120,774 H1020 M1020,764 V784" stroke="#526577" fill="none" stroke-width="2"/><text x="570.0" y="752.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">제출 → 종료 관측: E2E = 180 ms</text><text x="1020" y="818.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">종료 · 180 ms</text><g data-panel="true"><rect x="48" y="859" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="894.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">엔진에서 선택한 시각과 사용자가 받은 시각은 다릅니다.</text><text x="72" y="936.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">청크가 여러 토큰을 담으면 청크 간격으로 개별 토큰의 ITL을 복원할 수 없습니다.</text></g></svg>