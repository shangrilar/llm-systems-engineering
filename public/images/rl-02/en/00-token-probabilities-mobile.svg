e recorded response u → b → d</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">with the current model. Each column is</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">a prediction position in the same model.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="12" y="30" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="496">Position 1 · recorded u</text><g data-container="true"><rect x="12" y="56" width="496" height="88" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="28" y="87" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="464">P</text><text x="28" y="127" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="464">Context available here</text></g><path d="M260 150 L260 174" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="12" y="184" width="496" height="92" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="28" y="215" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="464">Transformer · weights θ</text><text x="28" y="255" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="464">Compute contextual features</text></g><path d="M260 284 L260 310" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="198" y="320" width="124" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="352" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="112">h₁</text><path d="M260 376 L260 400" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="12" y="410" width="496" height="56" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="28" y="441" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="464">LM head → softmax</text></g><path d="M260 474 L260 502" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="12" y="532" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="496">Next-token probabilities</text><text x="14" y="578" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">u</text><rect x="88" y="560" width="350" height="23" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="504" y="579" fill="#2470BB" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.5</text><text x="14" y="618" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">b</text><rect x="88" y="600" width="140" height="23" rx="3" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="504" y="619" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.2</text><text x="14" y="658" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">d</text><rect x="88" y="640" width="70" height="23" rx="3" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="504" y="659" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.1</text><text x="14" y="698" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">Other</text><rect x="88" y="680" width="140" height="23" rx="3" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="504" y="699" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.2</text><path d="M260 722 L260 743" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"