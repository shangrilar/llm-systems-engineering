<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1074" viewBox="0 0 360 1074" role="img" aria-labelledby="title desc"><title id="title">학습 스텝과 배포 버전은 다른 속도로 증가한다</title><desc id="desc">학습은 step 9에서 12까지 진행한다. 추론기는 step 9의 가중치인 v3을 사용하다 step 12에서 sync한 뒤 v4가 된다. step 11에서는 학습이 두 번 진행됐지만 v3 데이터의 배포 버전 간격은 0이다.</desc><metadata>{&quot;id&quot;:&quot;10-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles fully async&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/main/docs/user-guide/fully-async.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">학습 스텝과 배포 버전은 다른</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">속도로 증가한다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">교육용 예: 스텝마다 한 번 업데이트하고,</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">세 스텝마다 가중치를 반영합니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">두 개의 진행 기록</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="20" y="121" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="500">학습기</text><text x="315" y="121" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="205">추론기</text><g data-container="true"><rect x="16" y="153" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="184" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 9</text></g><path d="M119 234 L119 264" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="271" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="302" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 10</text></g><path d="M119 352 L119 382" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="389" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="420" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 11</text></g><path d="M119 470 L119 500" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="507" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="538" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 12</text></g><g data-container="true"><rect x="300" y="153" width="204" height="312" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="316" y="184" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="172">v3</text><text x="316" y="224" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="172">step 9 가중치</text></g><g data-container="true"><rect x="300" y="507" width="204" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="316" y="538" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="172">v4</text></g><path d="M228 189 L294 189" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="260" y="170" fill="#B55B22" font-size="17" font-weight="400" text-anchor="middle" data-max-width="260">sync</text><path d="M228 543 L294 543" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="260" y="524" fill="#B55B22" font-size="17" font-weight="400" text-anchor="middle" data-max-width="260">sync</text><text x="16" y="626" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">step 10·11: 추론 가중치 유지</text></g><g transform="translate(16 639.4) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">step 11에서 확인하기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="110" width="488" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학습기: step 11</text><text x="32" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">v3 반영 이후 두 번 업데이트</text></g><g data-container="true"><rect x="16" y="237" width="488" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="268" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">추론기: 마지막 배포 v3</text><text x="32" y="308" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">아직 다음 sync 전</text></g><path d="M260 349 L260 387" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="397" width="488" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="428" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">v3으로 만든 경험</text><text x="32" y="468" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">현재 배포 v3 − 생성 v3 = 0</text></g><text x="24" y="553" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="470">배포 버전 간격 0</text><text x="24" y="602" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="470">학습기와 가중치가 같다는 뜻은 아님</text></g></svg>