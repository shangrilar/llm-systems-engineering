<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1214" viewBox="0 0 1200 1214" role="img" aria-labelledby="title desc"><title id="title">Three modes of a CSA2 layer</title><desc id="desc">A CSA2 layer is Full, Reindex or Reuse. Full builds the compressed KV and the indexer keys and selects the top-k KV rows with its own indexer query. Reindex borrows the KV and indexer keys from the latest Full layer and reselects with its own indexer query. A Reuse layer has no indexer: it borrows the KV and the latest Full or Reindex selection. All three join the k selected rows with their own window KV and compute attention with their own query.</desc><metadata>{&quot;id&quot;:&quot;csa2-flow-01-three-modes&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3 (CSA2)&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash model card and code&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 23 · CSA2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Three modes of a CSA2 layer</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">What a layer builds and what it borrows</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="26" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="1104"><tspan>top-k, window: example 2, small / real 512, 128 · Full is not dense either: it reads only top-k</tspan></text><text x="0" y="52" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="1104"><tspan>dashed = borrowed · solid = computed here · grey = not run</tspan></text><text x="0" y="194" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="200"><tspan>Full</tspan></text><text x="0" y="222" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="220"><tspan>this layer builds the KV and the picks</tspan></text><g data-matrix="C^{Comp}"><rect x="268" y="176" width="64" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="300" y="164" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="184"><tspan>C</tspan><tspan dy="-9.1" font-size="16.8">Comp</tspan></text><text x="308" y="247" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[N</tspan><tspan dy="4" font-size="12.6">c</tspan><tspan dy="-4">, c]</tspan></text><g data-matrix="K^{IComp}"><rect x="416" y="176" width="48" height="48" rx="0" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/></g><text x="440" y="164" fill="#B34242" font-size="24" font-weight="600" text-anchor="middle" data-max-width="168"><tspan>K</tspan><tspan dy="-9.1" font-size="16.8">IComp</tspan></text><tex