<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">무엇이 처리 속도를 제한할까요?</title><desc id="desc">같은 GPU에서 메모리 데이터 공급이 제한인 경우와 계산 처리량이 제한인 경우를 비교한다. 위쪽은 입력이 부족해 연산 장치 일부가 기다리고, 아래쪽은 입력당 계산량이 많아 계산이 한계이다. 작은 칸은 데이터와 연산 활동을 나타내며 코어 수나 실제 이용률을 나타내지 않는다. 아래쪽이 위쪽보다 같은 계산을 더 빨리 실행한다는 비교가 아니라 서로 다른 작업의 병목 비교다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">무엇이 처리 속도를 제한할까요?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">메모리의 데이터 공급과 연산 장치의 계산을 함께 봅니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="215" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="261" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">데이터를 공급하는 속도가 병목일 때</text><rect x="76" y="313" width="170" height="127" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="161.0" y="384.5" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">HBM</text><path d="M268,330 H501 M268,425 H501" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="280" y="364" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="310" y="364" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M468,377 L514,377" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="536" y="303" width="370" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="721" y="337" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">연산 장치</text><rect x="560" y="366" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="601" y="366" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="642" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="683" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="724" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="765" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="806" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="847" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><path d="M919,377 L960,377" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)"/><rect x="979" y="333" width="145" height="91" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1051.5" y="386.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">결과</text><text x="381" y="483" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">필요한 입력 전달</text><text x="721" y="483" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">입력이 부족해 계산이 뜸함</text><text x="600" y="530" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">연산 능력이 남아도, 데이터 공급이 계산의 진행을 제한합니다.</text><rect x="48" y="596" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="642" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">계산을 처리하는 속도가 병목일 때</text><rect x="76" y="694" width="170" height="127" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="161.0" y="765.5" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">HBM</text><path d="M268,711 H501 M268,806 H501" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="280" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="310" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="340" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="370" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="400" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="430" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M468,758 L514,758" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="536" y="684" width="370" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="721" y="718" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">연산 장치</text><rect x="560" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="601" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="642" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="683" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="724" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="765" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="806" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="847" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M919,758 L960,758" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)"/><rect x="979" y="714" width="145" height="91" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1051.5" y="767.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">결과</text><text x="381" y="864" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">필요한 입력 전달</text><text x="721" y="864" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">입력당 필요한 계산이 많음</text><text x="600" y="911" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">데이터 공급이 충분해도, 계산을 끝내는 데 시간이 걸립니다.</text><text x="600" y="991" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">같은 GPU에서도 계산량과 데이터 이동량에 따라 병목이 달라집니다.</text></svg>