<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1137" viewBox="0 0 360 1137" role="img" aria-labelledby="title desc"><title id="title">문맥을 얻은 뒤 결합하고, 조회는 미리 시작합니다</title><desc id="desc">입력에 N-gram 표현을 더해도 이후 Attention과 MoE가 활용법을 학습할 수 있습니다. 중간 삽입은 앞선 Attention으로 문맥을 얻은 hidden을 gate에 사용합니다. 조회 주소는 토큰 ID로 미리 정해져 CPU 조회와 전송을 앞선 GPU 계산과 겹칠 수 있습니다. 겹침 정도는 하드웨어와 워크로드에 달려 있습니다. 너무 늦게 넣으면 앞선 층이 해당 정보를 활용할 수 없습니다. 막대 길이는 측정 시간이 아닙니다.</desc><metadata>{&quot;id&quot;:&quot;ma-20-05&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2, §4.1, §6.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 5</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">문맥을 얻은 뒤 결합하고,</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">조회는 미리 시작합니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">입력 결합도 가능한 대안 · 시간축은</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">정성적 예시</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 입력에서 함께 결합</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="190" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="148" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="178">e(B)</text><rect x="290" y="110" width="210" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="395" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">g(A,B)</text><path d="M115 180 V220 H235" stroke="#2470BB" stroke-width="3" fill="none" marker-end="url(#arrow-blue)"/><path d="M395 180 V220 H285" stroke="#287D78" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/><circle cx="260" cy="220" r="22" fill="#FFF2E6" stroke="#B55B22"/><text x="260" y="229" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle" data-max-width="35">+</text><path d="M260 250 L260 300" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="50" y="310" width="420" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="341" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="388">첫 Attention → 이후 층</text><text x="66" y="381" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="388">결합된 정보의 활용법을 학습</text></g><text x="20" y="505" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" data-max-width="480">실행 순서 →</text><rect x="20" y="540" width="180" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="110" y="580.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">조회·전송</text><path d="M210 572 L265 572" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><rect x="280" y="540" width="220" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="390" y="580.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">첫 블록 계산</text></g><g transform="translate(16 670.9384615384615) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 문맥을 얻은 뒤 결합</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="190" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="148" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="178">e(B)</text><rect x="290" y="110" width="210" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="395" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">g(A,B)</text><path d="M115 180 L115 220" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="230" width="230" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="261" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">첫 Attention</text><text x="36" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">h: context</text></g><path d="M395 180 V365 H390 V375" stroke="#287D78" stroke-width="3" fill="none" marker-end="url(#arrow-teal)"/><path d="M135 340 L135 375" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="385" width="480" height="80" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="416" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">문맥 gate → 결합 → 이후 층</text></g><text x="20" y="505" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" data-max-width="490">시간 → 두 작업을 겹침</text><rect x="20" y="540" width="320" height="55" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="575.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">GPU · 첫 블록 계산</text><rect x="20" y="620" width="320" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="180" y="655.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">CPU → GPU · 조회·전송</text><path d="M365 540 V675" stroke="#B55B22" stroke-width="3" fill="none"/><text x="440" y="580" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="130">합류</text></g></svg>