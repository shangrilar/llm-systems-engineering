<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2240" viewBox="0 0 1200 2240" role="img" aria-labelledby="title desc"><title id="title">Ring: pass chunks and accumulate</title><desc id="desc">Four GPUs arranged in a ring exchange and reduce chunks in three steps. Arrows show sent values and boxes show sums after receipt.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="2240" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Ring: pass chunks and accumulate</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Arrows show sent chunks; boxes show results after receipt. Colors identify GPUs.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="204.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Start: each GPU holds inputs for A · B · C · D</text><rect x="48" y="225" width="264" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="255.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[1, 2, 3, 4]</text><text x="66" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">First send: D</text><rect x="328" y="225" width="264" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="255.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">GPU 1</text><text x="346" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[10, 20, 30, 40]</text><text x="346" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">First send: A</text><rect x="608" y="225" width="264" height="126" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="255.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">GPU 2</text><text x="626" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[100, 200, 300, 400]</text><text x="626" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">First send: B</text><rect x="888" y="225" width="264" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="255.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="start">GPU 3</text><text x="906" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[1000, 2000, 3000, 4000]</text><text x="906" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">First send: C</text><text x="48" y="389.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A · B · C · D = array positions 1 · 2 · 3 · 4</text><text x="48" y="447.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Step 1 · state after transfer</text><path d="M758,565 L899,642" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="599.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">D: 4</text><path d="M899,768 L758,845" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="825.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A: 10</text><path d="M442,845 L301,768" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="825.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">B: 200</text><path d="M301,642 L442,565" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="599.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">C: 3000</text><rect x="450" y="479" width="300" height="114" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="511.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0</text><text x="600" y="549.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">C = 3003</text><text x="600" y="579.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">3000 + 3</text><rect x="780" y="648" width="300" height="114" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="930" y="680.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">GPU 1</text><text x="930" y="718.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">D = 44</text><text x="930" y="748.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">4 + 40</text><rect x="450" y="817" width="300" height="114" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="849.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="600" y="887.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">A = 110</text><text x="600" y="917.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">10 + 100</text><rect x="120" y="648" width="300" height="114" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="270" y="680.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="270" y="718.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">B = 2200</text><text x="270" y="748.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">200 + 2000</text><text x="600" y="698.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Received + local input</text><text x="600" y="727.4" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">All 