<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1601" viewBox="0 0 1200 1601" role="img" aria-labelledby="title desc"><title id="title">Shared expert: 모든 토큰에 적용하는 변환</title><desc id="desc">같은 세 토큰의 입력을 shared와 routed 두 경로에 보낸다. Shared expert S는 모든 토큰에 독립적으로 적용하고, routed 경로는 토큰마다 네 expert 중 두 개를 선택해 가중합 R을 만든다. 같은 토큰의 S와 R 결과를 성분별로 더해 d차원 출력 y를 만든다.</desc><metadata>{&quot;id&quot;:&quot;04-shared-and-routed&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Shared expert: 모든 토큰에 적용하는 변환</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Shared expert 1개 + routed expert 4개 중 Top-2</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><rect x="48" y="205" width="1104" height="110" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="251" fill="#182C40" font-size="27" font-weight="600" text-anchor="start">입력 X (3 × d)</text><text x="80" y="288" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">d = 8</text><rect x="430" y="236" width="190" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="525" y="260" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">x₁</text><text x="525" y="281" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d차원</text><rect x="660" y="236" width="190" height="54" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="755" y="260" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">x₂</text><text x="755" y="281" fill="#287D78" font-size="18" font-weight="400" text-anchor="middle">d차원</text><rect x="890" y="236" width="190" height="54" rx="14" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="985" y="260" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">x₃</text><text x="985" y="281" fill="#7954A3" font-size="18" font-weight="400" text-anchor="middle">d차원</text><path d="M600,327 V365 H312 V404" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><path d="M600,365 H888 V404" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="48" y="420" width="528" height="580" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="464" fill="#182C40" font-size="31" font-weight="600" text-anchor="middle">Shared expert</text><text x="312" y="508" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">모든 토큰에 항상 적용</text><rect x="624" y="420" width="528" height="580" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="464" fill="#182C40" font-size="31" font-weight="600" text-anchor="middle">Routed experts</text><text x="888" y="508" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">토큰마다 4개 중 2개 선택</text><rect x="82" y="550" width="140" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="152" y="574" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">x₁</text><text x="152" y="595" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d차원</text><rect x="242" y="550" width="140" height="54" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="574" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">x₂</text><text x="312" y="595" fill="#287D78" font-size="18" font-weight="400" text-anchor="middle">d차원</text><rect x="402" y="550" width="140" height="54" rx="14" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="472" y="574" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">x₃</text><text x="472" y="595" fill="#7954A3" font-size="18" font-weight="400" text-anchor="middle">d차원</text><path d="M312,615 L312,636" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="97" y="650" width="430" height="105" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="682" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Shared expert S</text><text x="312" y="710" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Gated MLP · d → m → d</text><path d="M312,768 L312,788" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><text x="312" y="822" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">세 토큰 각각에 같은 MLP 적용</text><path d="M312,842 L312,886" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="683" y="550" width="410" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="582" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Router</text><text x="888" y="610" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">expert 선택 + 가중치</text><path d="M888,634 L888,649" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="683" y="665" width="410" height="75" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="697" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Routed experts</text><text x="888" y="725" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">선택된 expert 2개 계산</text><path d="M888,750 L888,769" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="683" y="785" width="410" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="817" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Combine</text><text x="888" y="845" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">같은 토큰의 결과끼리 가중합</text><path d="M888,872 L888,886" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="82" y="904" width="140" height="56" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="152" y="940" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">S(x₁)</text><rect x="658" y="904" width="140" height="56" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="728" y="940" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">R(x₁)</text><rect x="242" y="904" width="140" height="56" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="940" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">S(x₂)</text><rect x="818" y="904" width="140" height="56" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="940" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">R(x₂)</text><rect x="402" y="904" width="140" height="56" rx="14" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="472" y="940" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">S(x₃)</text><rect x="978" y="904" width="140" height="56" rx="14" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="1048" y="940" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">R(x₃)</text><path d="M312,1012 V1120 H568" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><path d="M888,1012 V1120 H632" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><circle cx="600" cy="1120" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M591,1120 L609,1120" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M600,1111 L600,1129" fill="none" stroke="#2470BB" stroke-width="2.5"/><text x="600" y="1185" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">같은 토큰의 두 결과를 성분별로 더합니다.</text><path d="M600,1202 L600,1235" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="48" y="1250" width="1104" height="155" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="1300" fill="#182C40" font-size="27" font-weight="600" text-anchor="start">출력 Y (3 × d)</text><text x="80" y="1343" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">각 토큰 d차원</text><rect x="430" y="1272" width="190" height="110" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="525" y="1310" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">y₁</text><text x="525" y="1357" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">S(x₁) + R(x₁)</text><rect x="660" y="1272" width="190" height="110" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="755" y="1310" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">y₂</text><text x="755" y="1357" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">S(x₂) + R(x₂)</text><rect x="890" y="1272" width="190" height="110" rx="14" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="985" y="1310" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">y₃</text><text x="985" y="1357" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">S(x₃) + R(x₃)</text><text x="600" y="1470" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">R(x)는 그림 3에서 계산한 routed expert 결과의 가중합입니다.</text></g></g><path d="M48,1523 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1561" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Shared expert S는 모든 토큰에 적용하고, routed 경로의 결과 R과 같은 토큰끼리 성분별로 더합니다.</text></svg>