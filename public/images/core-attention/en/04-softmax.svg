<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1411" viewBox="0 0 1200 1411" role="img" aria-labelledby="title desc"><title id="title">Softmax: turn scores into weights</title><desc id="desc">Apply Softmax to each masked score row. Rows of P are [1,0,0], [0.818,0.182,0], [0.114,0.042,0.844]. The token-3 example exponentiates scores 1,0,3 and divides by their sum, then compares the weights with bars.</desc><metadata>{&quot;id&quot;:&quot;04-softmax&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Softmax: turn scores into weights</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">P = softmax(S / √dh + M) · applied to each row</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><rect x="48" y="197" width="1104" height="62" rx="14" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1.5"/><text x="80" y="237" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">Inside Head 1 · Head 2 follows the same steps independently.</text><text x="600" y="315" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">Compute weights within each row, one Query token at a time.</text><text x="285" y="383" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Masked scores</text><rect x="150" y="440" width="90" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="195" y="483" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="240" y="440" width="90" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="285" y="483" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="330" y="440" width="90" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="375" y="483" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="150" y="508" width="90" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="195" y="551" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="240" y="508" width="90" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="285" y="551" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="330" y="508" width="90" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="375" y="551" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="150" y="576" width="90" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="195" y="619" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="240" y="576" width="90" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="285" y="619" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="330" y="576" width="90" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="375" y="619" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><text x="132" y="482" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="132" y="550" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="132" y="618" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="195" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="285" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="375" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><path d="M473,540 L682,540" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><text x="578" y="497" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Softmax</text><text x="885" y="383" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Attention weights P</text><rect x="750" y="440" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800" y="483" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="850" y="440" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900" y="483" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="950" y="440" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000" y="483" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="750" y="508" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800" y="551" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.818</text><rect x="850" y="508" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900" y="551" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.182</text><rect x="950" y="508" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000" y="551" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="750" y="576" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800" y="619" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.114</text><rect x="850" y="576" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900" y="619" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.042</text><rect x="950" y="576" width="100" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000" y="619" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.844</text><text x="731" y="482" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="731" y="550" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="731" y="618" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="800" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="900" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="1000" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><text x="600" y="709" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Each row sums to 1 · masked positions have weight 0</text><path d="M48,760 L1152,760" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="819" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Focusing on the row for token 3,</text><text x="600" y="875" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">[1, 0, 3] → [e¹, e⁰, e³] ÷ (e¹ + e⁰ + e³)</text><text x="280" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Token 1</text><rect x="190" y="990" width="180" height="175" rx="0" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><rect x="190" y="1145.015840107696" width="180" height="19.984159892304035" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.114</text><text x="600" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Token 2</text><rect x="510" y="990" width="180" height="175" rx="0" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><rect x="510" y="1157.6482384265385" width="180" height="7.351761573461559" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.042</text><text x="920" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Token 3</text><rect x="830" y="990" width="180" height="175" rx="0" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><rect x="830" y="1017.3359214657656" width="180" height="147.6640785342344" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="920" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.844</text><text x="600" y="1280" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">A higher score gives that token’s Value a larger weight.</text></g></g><path d="M48,1333 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1371" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Head 1 · P is rounded to three decimal places.</text></svg>