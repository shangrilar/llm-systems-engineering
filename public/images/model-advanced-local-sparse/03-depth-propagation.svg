<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1769" viewBox="0 0 1200 1769" role="img" aria-labelledby="title desc"><title id="title">먼 위치의 정보도 중간 위치를 거쳐 전달됩니다</title><desc id="desc">가로축은 위치 0부터 7, 세로축은 아래 L0에서 위 L3로 증가하는 층 깊이다. L3,p7의 조상 위치만 강조하며 주황 경로는 L0,p1에서 L1,p3, L2,p5를 거쳐 L3,p7로 이어진다. 모바일은 그 경로를 세로로 펼친다. 아래 표에서 p7의 L0 입력 영향 범위는 한 층 후 5…7, 두 층 후 3…7, 세 층 후 1…7이다.</desc><metadata>{&quot;id&quot;:&quot;ma-04-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mistral 7B §2, stacked sliding-window attention&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2310.06825v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3 · 층을 통한 전달</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">먼 위치의 정보도 중간 위치를 거쳐 전달됩니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Window 3: 이전 층의 같은 위치와 직전 두 위치 · L0는 입력 · L1…L3는 층 깊이</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="32" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="1104">강조한 위치는 L3,p7에 영향을 줄 수 있습니다.</text><rect x="130" y="662" width="80" height="70" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="170" y="705" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p0</text><rect x="254" y="662" width="80" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="294" y="705" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p1</text><rect x="378" y="662" width="80" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="418" y="705" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p2</text><rect x="502" y="662" width="80" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="542" y="705" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p3</text><rect x="626" y="662" width="80" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="666" y="705" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p4</text><rect x="750" y="662" width="80" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="790" y="705" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p5</text><rect x="874" y="662" width="80" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="914" y="705" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p6</text><rect x="998" y="662" width="80" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1038" y="705" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p7</text><rect x="130" y="482" width="80" he