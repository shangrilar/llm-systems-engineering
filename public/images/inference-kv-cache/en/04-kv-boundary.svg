<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1492" viewBox="0 0 1200 1492" role="img" aria-labelledby="title desc"><title id="title">Token selection and KV computation are one execution apart</title><desc id="desc">Immediately after selecting x0, KV exists only for p0 p1 p2. The next execution consumes x0, creates its K/V in each layer, and selects x1. At that point x1 has no own KV; consuming x1 in the following execution creates its K/V and selects x2.</desc><metadata>{&quot;id&quot;:&quot;04-kv-boundary&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Token selection and KV computation are one execution apart</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">A just-selected token obtains its own K/V when it becomes input to the next execution.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="220" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Immediately after selecting x0</text><rect x="88" y="252" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="136" y="289" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="88" y="345" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">Selected output</text><text x="442" y="220" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Available KV</text><g data-box="442,250,94,74"><rect x="442" y="250" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M442,281 H536" stroke="#287D78"/><text x="489" y="273" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="489" y="309" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="552,250,94,74"><rect x="552" y="250" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M552,281 H646" stroke="#287D78"/><text x="599" y="273" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="599" y="309" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="662,250,94,74"><rect x="662" y="250" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M662,281 H756" stroke="#287D78"/><text x="709" y="273" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="709" y="309" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="772,250,94,74"><rect x="772" y="250" width="94" height="74" fill="#F8FAFC" stroke="#5C6C7C" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M772,281 H866" stroke="#5C6C7C"/><text x="819" y="273" fill="#5C6C7C" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="819" y="309" fill="#5C6C7C" font-size="22" font-weight="700" text-anchor="middle">x0</text></g><text x="893" y="280" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Not yet</text><text x="442" y="367" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">The model has not yet processed x0 as input.</text><path d="M136,369 L136,477" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="162" y="426" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Input to the next</text><text x="162" y="458.2" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">execution</text><rect x="88" y="510" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="136" y="547" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><path d="M196,539 L296,539" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="308" y="474" width="502" height="166" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="334" y="512" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Execute the model with x0</text><text x="334" y="560" fill="#B55B22" font-size="24" font-weight="400" text-anchor="start">Compute K/V for x0 in each layer</text><text x="334" y="607" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Compute scores after the final layer</text><path d="M824,557 L1020,557" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="913" y="531" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Select</text><rect x="1034" y="529" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1082" y="566" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><text x="1030" y="627" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Own KV:</text><text x="1030" y="659" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">not yet</text><path d="M559,652 V688 H819 V717" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="88" y="754" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Add to KV</text><g data-box="442,729,94,74"><rect x="442" y="729" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M442,760 H536" stroke="#287D78"/><text x="489" y="752" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="489" y="788" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="552,729,94,74"><rect x="552" y="729" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M552,760 H646" stroke="#287D78"/><text x="599" y="752" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="599" y="788" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="662,729,94,74"><rect x="662" y="729" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M662,760 H756" stroke="#287D78"/><text x="709" y="752" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="709" y="788" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="772,729,94,74"><rect x="772" y="729" width="94" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M772,760 H866" stroke="#B55B22"/><text x="819" y="752" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="819" y="788" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x0</text></g><path d="M1082,683 V849 H136 V917" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="165" y="879" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Selected x1 becomes the next input</text><rect x="88" y="930" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="136" y="967" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><path d="M196,959 L296,959" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="308" y="894" width="502" height="166" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="334" y="932" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Execute the model with x1</text><text x="334" y="980" fill="#B55B22" font-size="24" font-weight="400" text-anchor="start">Compute K/V for x1 in each layer</text><text x="334" y="1027" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Compute scores after the final layer</text><path d="M824,977 L1020,977" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="913" y="951" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Select</text><rect x="1034" y="949" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1082" y="986" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="1030" y="1047" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Own KV:</text><text x="1030" y="1079" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">not yet</text><path d="M559,1072 V1108 H929 V1137" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="88" y="1174" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Add to KV</text><g data-box="442,1149,94,74"><rect x="442" y="1149" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M442,1180 H536" stroke="#287D78"/><text x="489" y="1172" fill="#287D78" font-size="17" font-weigh