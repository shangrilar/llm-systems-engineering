<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">통신과 계산을 함께 마치는 시간</title><desc id="desc">위는 SM 통신 커널과 독립 계산 C가 SM 자원을 함께 사용해 C가 늦어지는 경우다. 아래는 지원되는 복사를 CE가 맡아 SM 경쟁이 줄어 C가 더 일찍 끝날 수 있는 경우다. 두 경우 전달량과 계산량, 통신 시간은 같다. 전체 완료는 통신과 C가 모두 끝나는 시점이다. CE도 메모리와 연결 대역폭을 사용하므로 성능 개선을 항상 보장하는 그림이 아니며 실측 수치가 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 14 · 그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">통신과 계산을 함께 마치는 시간</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">통신 시간이 같아도 SM 자원 경쟁이 줄면 계산 C가 더 일찍 끝날 수 있습니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="210" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="250" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">같은 통신·계산 C · SM 자원 경쟁이 계산을 늦추는 경우</text><text x="48" y="321" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">SM을 통신과 계산이 함께 사용</text><path d="M250,365 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="350" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="426" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">통신 (SM)</text><rect x="250" y="390" width="450" height="58" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="475.0" y="428.0" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">같은 통신 시간</text><path d="M700,454 V467" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="720" y="472" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="start">통신 완료</text><text x="48" y="540" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">계산 C</text><rect x="250" y="502" width="780" height="58" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="640.0" y="540.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">SM에서 계산</text><path d="M1030,571 V588" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="1030" y="619" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">전체 완료</text><text x="48" y="716" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">복사를 CE에 맡기고 SM에서 계산</text><path d="M250,760 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="745" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="821" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">통신 (CE)</text><rect x="250" y="785" width="450" height="58" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="475.0" y="823.0" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">같은 통신 시간</text><path d="M700,849 V862" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="720" y="867" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="start">통신 완료</text><text x="48" y="935" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">계산 C</text><rect x="250" y="897" width="580" height="58" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="540.0" y="935.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">SM에서 계산</text><path d="M830,966 V983" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="830" y="1014" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">전체 완료</text></svg>