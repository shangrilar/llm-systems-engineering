<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1206" viewBox="0 0 1200 1206" role="img" aria-labelledby="title desc"><title id="title">Where OPD belongs depends on the training goal</title><desc id="desc">On the left, teacher RL produces specialists whose probabilities guide student OPD, followed by student evaluation. On the right, a prepared student learns through OPD from an external teacher, then task-reward RL.</desc><metadata>{&quot;id&quot;:&quot;5-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek V4 §5.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2606.19348v1#S5.SS1&quot;},{&quot;label&quot;:&quot;RL Starts before RL&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.28145&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Where OPD belongs depends on the training goal</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">OPD can integrate teacher capabilities or prepare a student for further RL.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Transfer and integrate capabilities</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="108" width="488" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="139" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Domain-specific teacher RL</text><text x="32" y="179" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Learn specialist skills from domain rewards</text></g><path d="M260 232 L260 269" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="282" width="488" height="100" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="313" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Prepared specialist teachers</text><text x="32" y="353" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Teachers stay frozen during distillation</text></g><path d="M260 394 L260 482" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><text x="282" y="440" fill="#7954A3" font-size="19" font-weight="400" text-anchor="start" data-max-width="215">Probabilities</text><g data-container="true"><rect x="16" y="495" width="488" height="152" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="526" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Student OPD</text><text x="32" y="566" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Read teacher distributions on student</text><text x="32" y="594" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">contexts</text><text x="32" y="622" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Update student weights</text></g><path d="M260 659 L260 762" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="776" width="488" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="807" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Evaluate the integrated student</text><text x="32" y="847" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Were capabilities transferred across</text><text x="32" y="875" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">domains?</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Prepare a starting point for further RL</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="108" width="488" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="139" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Prepared student</text><text x="32" y="179" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Starting model checkpoint</text></g><path d="M260 220 L260 382" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="282" y="238" width="222" height="103" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="298" y="269" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">External teacher</text><text x="298" y="309" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">Provides guidance</text></g><path d="M393 353 V369 H445 V382" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="395" width="488" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="426" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Student OPD</text><text x="32" y="466" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">First train the student with teacher</text><text x="32" y="494" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">guidance</text></g><path d="M260 519 L260 557" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="570" width="488" height="130" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="601" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Further RL on the same student</text><text x="32" y="641" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Continue improving with task rewards</text></g></g></svg>