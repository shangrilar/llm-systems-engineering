<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">입력 벡터에 변환 결과 더하기</title><desc id="desc">한 토큰의 4차원 입력 [1,2,−1,0]이 중앙 경로로 그대로 전달된다. 옆 경로의 설명용 변환 결과 [0.2,−0.5,0.3,0.1]을 더하면 [1.2,1.5,−0.7,0.1]이 된다. 네 성분은 위치별로 더해지고 출력도 4차원이다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1110" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">입력 벡터에 변환 결과 더하기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">d차원 입력은 그대로 전달되고, d차원 변환 결과가 성분별로 더해집니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="80" y="221" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">토큰 하나의 벡터를 확대합니다.</text><text x="420" y="270" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">입력 x</text><path d="M260,318 V310 H580 V318" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="420.0" y="297" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">모델 차원 d = 4</text><rect x="260.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="300.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="340.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="380.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="420.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="460.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="500.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="540.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M420,387 L420,562" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue-arrow)"/><path d="M420,424 H930 V461" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><circle cx="420" cy="424" r="5" fill="#2470BB"/><rect x="770" y="474" width="320" height="125" rx="14" fill="#F7F9FB" stroke="#E3E8ED" stroke-width="1.5"/><text x="930" y="513" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">변환 경로</text><text x="930" y="549" fill="#728190" font-size="22" font-weight="400" text-anchor="middle">RMSNorm →</text><text x="930" y="580" fill="#728190" font-size="22" font-weight="400" text-anchor="middle">Attention 또는 MLP</text><text x="150" y="478" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">그대로</text><text x="150" y="513" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">전달</text><text x="420" y="598" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">덧셈 직전에도 같은 x</text><rect x="260.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="300.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="340.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="380.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="420.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="460.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="500.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="540.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M930,599 L930,635" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="930" y="670" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">변환 결과 Δ · d = 4</text><rect x="770.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="810.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.2</text><rect x="850.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="890.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.5</text><rect x="930.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="970.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.3</text><rect x="1010.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1050.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.1</text><path d="M930,760 V802 H455" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M420,679 L420,768" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue-arrow)"/><circle cx="420" cy="802" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M411,802 L429,802" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M420,793 L420,811" fill="none" stroke="#2470BB" stroke-width="2.5"/><text x="150" y="811" fill="#2470BB" font-size="28" font-weight="600" text-anchor="start">x + Δ</text><path d="M420,825 L420,864" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue-arrow)"/><rect x="260.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="300.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1.2</text><rect x="340.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="380.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1.5</text><rect x="420.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="460.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.7</text><rect x="500.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="540.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.1</text><text x="420" y="976" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">출력도 d = 4</text><rect x="690" y="875" width="450" height="104" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="915" y="916" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">같은 위치의 성분끼리 더합니다.</text><text x="915" y="953" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">예: 두 번째 성분  2 + (−0.5) = 1.5</text><path d="M48,1030 L1152,1030" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1071" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">d = 4와 수치는 설명용 예시입니다. Attention은 이 토큰 외의 다른 토큰도 참조할 수 있습니다.</text>
</svg>