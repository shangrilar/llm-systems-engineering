<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1367" viewBox="0 0 360 1367" role="img" aria-labelledby="title desc"><title id="title">Whose probabilities weight the difference?</title><desc id="desc">Teacher probabilities for a,b,c are 49%,49%,2%; student probabilities are 78%,2%,20%. Forward KL weights by the teacher and highlights the underrepresented b; reverse KL weights by the student and highlights the overrepresented c. Both sum over every candidate. Each panel presents the formula, penalty summary, then its mode-covering or mode-seeking tendency.</desc><metadata>{&quot;id&quot;:&quot;4-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;GKD §2–3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2306.13649v3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Whose probabilities weight</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">the difference?</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Same context P + v, same two</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">distributions. Change the weighting.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Forward KL · KL(T ‖ S)</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="110" fill="#7954A3" font-size="24" font-weight="600" text-anchor="start" data-max-width="488">Weight by teacher probabilities</text><rect x="16" y="137" width="16" height="12" rx="2" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="42" y="151" fill="#7954A3" font-size="19" font-weight="400" text-anchor="start" data-max-width="185">Teacher T</text><rect x="255" y="137" width="16" height="12" rx="2" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="281" y="151" fill="#2470BB" font-size="19" font-weight="400" text-anchor="start" data-max-width="220">Student S</text><text x="31" y="234" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">a</text><rect x="86" y="205" width="191.1" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="286.1" y="224" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">49%</text><rect x="86" y="239" width="304.2" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="399.2" y="258" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">78%</text><rect x="8" y="290" width="504" height="100" rx="10" fill="#F1F4F7" stroke="#182C40" stroke-width="1.5"/><text x="31" y="342" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">b</text><rect x="86" y="313" width="191.1" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="286.1" y="332" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">49%</text><rect x="86" y="347" width="7.8" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="102.8" y="366" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">2%</text><text x="31" y="450" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">c</text><rect x="86" y="421" width="7.8" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="102.8" y="440" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">2%</text><rect x="86" y="455" width="78" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="173" y="474" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">20%</text><path d="M86 511 L476 511" stroke="#5C6C7C" stroke-width="1" fill="none"/><path d="M86 511 L86 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="86" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">0%</text><path d="M281 511 L281 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="281" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">50%</text><path d="M476 511 L476 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="476" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">100%</text><text x="16" y="597" fill="#7954A3" font-size="26" font-weight="600" text-anchor="start" data-max-width="488">Σ pT × ln(pT / pS)</text><text x="16" y="652" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Large penalty when the student assigns</text><text x="16" y="681.4" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">low probability to a token the teacher</text><text x="16" y="710.8" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">assigns high probability.</text><text x="16" y="773" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="488">Mode-covering</text><text x="16" y="815" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Cover the teacher’s range of choices</text></g><g transform="translate(16 785.7384615384615) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Reverse KL · KL(S ‖ T)</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="110" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start" data-max-width="488">Weight by student probabilities</text><rect x="16" y="137" width="16" height="12" rx="2" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="42" y="151" fill="#7954A3" font-size="19" font-weight="400" text-anchor="start" data-max-width="185">Teacher T</text><rect x="255" y="137" width="16" height="12" rx="2" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="281" y="151" fill="#2470BB" font-size="19" font-weight="400" text-anchor="start" data-max-width="220">Student S</text><text x="31" y="234" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">a</text><rect x="86" y="205" width="191.1" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="286.1" y="224" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">49%</text><rect x="86" y="239" width="304.2" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="399.2" y="258" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">78%</text><text x="31" y="342" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">b</text><rect x="86" y="313" width="191.1" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="286.1" y="332" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">49%</text><rect x="86" y="347" width="7.8" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="102.8" y="366" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">2%</text><rect x="8" y="398" width="504" height="100" rx="10" fill="#F1F4F7" stroke="#182C40" stroke-width="1.5"/><text x="31" y="450" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">c</text><rect x="86" y="421" width="7.8" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="102.8" y="440" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">2%</text><rect x="86" y="455" width="78" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="173" y="474" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">20%</text><path d="M86 511 L476 511" stroke="#5C6C7C" stroke-width="1" fill="none"/><path d="M86 511 L86 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="86" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">0%</text><path d="M281 511 L281 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="281" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">50%</text><path d="M476 511 L476 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="476" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">100%</text><text x="16" y="597" fill="#2470BB" font-size="26" font-weight="600" text-anchor="start" data-max-width="488">Σ pS × ln(pS / pT)</text><text x="16" y="652" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Large penalty when the student assigns</text><text x="16" y="681.4" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">high probability to a token the teacher</text><text x="16" y="710.8" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">assigns low probability.</text><text x="16" y="773" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start" data-max-width="488">Mode-seeking</text><text x="16" y="815" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Concentrate on teacher-preferred choices</text></g></svg>