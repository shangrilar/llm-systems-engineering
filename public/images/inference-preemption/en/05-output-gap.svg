<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1024" viewBox="0 0 1200 1024" role="img" aria-labelledby="title desc"><title id="title">Pausing and recovery extend the output gap</title><desc id="desc">A and B, block changes, and B’s output events share one timeline. After delivering x0 and x1, B pauses and releases two blocks. A adds one block and grows from nine to twelve KV slots. When A completes and releases three blocks, B allocates three blocks and recomputes KV from nine known tokens. No new output is delivered while B waits or recomputes; x2 and x3 follow afterward.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1024" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Pausing and recovery extend the output gap</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Releasing B’s KV lets A proceed, but B must wait and recover before delivering its</text><text x="48" y="140.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">next output.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="72" y="216.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">Example using recomputation</text><path d="M220,262 L1124.0,262.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M1134,262 L1124.0,266.5 L1124.0,257.5 Z" fill="#526577"/><text x="1132" y="241.0" fill="#526577" font-size="22" font-weight="400" text-anchor="end">Time</text><text x="405" y="311.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">B pauses</text><text x="780" y="311.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A completes</text><path d="M405,324 V908" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="5 6" fill="none"/><path d="M780,324 V908" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="5 6" fill="none"/><text x="72" y="390.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">Request A</text><text x="72" y="560.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Request B</text><rect x="220" y="346" width="185" height="72" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="411" y="346" width="369" height="72" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="312.5" y="390.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Generate</text><text x="592.5" y="390.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Keep generating</text><text x="312.5" y="457.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">KV 7 → 8</text><text x="312.5" y="486.4" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">2 blocks</text><text x="592.5" y="457.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">KV 9 → 12 · 3 blocks</text><text x="966" y="390.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Done · blocks released</text><rect x="220" y="516" width="185" height="72" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="411" y="516" width="363" height="72" rx="10" fill="#F6F8FA" stroke="#DCE4EC" stroke-width="1.5"/><rect x="780" y="516" width="204" height="72" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="990" y="516" width="144" height="72" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="312.5" y="560.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">Generate</text><text x="592.5" y="560.0" fill="#526577" font-size="24" font-weight="700" text-anchor="middle">Wait</text><text x="885.0" y="560.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">Recompute KV</text><text x="1062.0" y="560.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">Generate</text><text x="312.5" y="629.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">KV 7 → 8</text><text x="312.5" y="658.4" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">2 blocks</text><text x="592.5" y="629.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">No GPU KV</text><text x="885.0" y="629.0" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">On completion: 9 KV</text><text x="885.0" y="658.4" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">3 blocks</text><text x="72" y="722.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Block changes</text><rect x="309" y="677" width="192" height="111" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="405" y="715.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B: release 2</text><text x="405" y="752.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A: add 1</text><rect x="654" y="677" width="252" height="111" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="780" y="715.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A: release 3</text><text x="780" y="752.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B: allocate 3</text><text x="72" y="872.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B’s output</text><path d="M220,876 L1124.0,876.0" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M1134,876 L1124.0,880.5 L1124.0,871.5 Z" fill="#287D78"/><rect x="248" y="852" width="52" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="274.0" y="883.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x0</text><rect x="344" y="852" width="52" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="370.0" y="883.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x1</text><rect x="964" y="852" width="52" height="48" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="990.0" y="883.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x2</text><rect x="1059" y="852" width="52" height="48" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1085.0" y="883.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x3</text><path d="M397,925 V936 H963 V925" stroke="#287D78" stroke-width="2.5" fill="none"/><text x="680" y="978.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">No new output while waiting and recomputing KV</text></svg>