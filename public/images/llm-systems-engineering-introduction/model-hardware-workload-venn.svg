<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">세 관점이 만나는 실행 시스템</title><desc id="desc">모델, 하드웨어, 워크로드를 나타내는 세 원이 겹치고, 세 원의 공통 영역에 실행 시스템이 놓인 벤 다이어그램.</desc><metadata>{&quot;id&quot;:&quot;model-hardware-workload-venn&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">세 관점이 만나는 실행 시스템</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">모델, 하드웨어, 워크로드를 함께 볼 때 실행 방식의 선택이 보입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><circle cx="552" cy="230" r="215" fill="#EDF5FD" style="mix-blend-mode:multiply"/><circle cx="417" cy="465" r="215" fill="#EDF7F5" style="mix-blend-mode:multiply"/><circle cx="687" cy="465" r="215" fill="#FFF2E6" style="mix-blend-mode:multiply"/><circle cx="552" cy="230" r="215" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="417" cy="465" r="215" fill="none" stroke="#287D78" stroke-width="3"/><circle cx="687" cy="465" r="215" fill="none" stroke="#B55B22" stroke-width="3"/><text x="552" y="150" fill="#2470BB" font-size="36" font-weight="700" text-anchor="middle" data-max-width="260">모델</text><text x="345" y="555" fill="#287D78" font-size="36" font-weight="700" text-anchor="middle" data-max-width="260">하드웨어</text><text x="759" y="555" fill="#B55B22" font-size="36" font-weight="700" text-anchor="middle" data-max-width="260">워크로드</text><text x="552" y="398" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle" data-max-width="300">실행 시스템</text></g><path d="M48,942 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="980" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">이 시리즈는 모델, 하드웨어, 워크로드의 세 관점으로 실행 시스템을 살펴봅니다.</text></svg>