<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1204" viewBox="0 0 360 1204" role="img" aria-labelledby="title desc"><title id="title">Two paths for forming keys and values</title><desc id="desc">From p3, W_D produces c3=[1,2,3], while W_KR and RoPE(3) produce [r0,r1]. These two vectors are cached. Each head projects c3 through its U_K and U_V. Head 1 has key [1,2,r0,r1] and value [4,2]; Head 2 has key [2,3,r0,r1] and value [1,5]. Both keys share the positional part; values do not concatenate it.</desc><metadata>{&quot;id&quot;:&quot;ma-02-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V2 §2.1.3, equations 14–19&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.04434v5#S2.SS1.SSS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><mark