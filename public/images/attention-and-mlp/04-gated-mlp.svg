<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1369" viewBox="0 0 1200 1369" role="img" aria-labelledby="title desc"><title id="title">Gated MLP: 두 갈래로 계산한 뒤 곱하기</title><desc id="desc">동일한 4차원 토큰 입력이 두 경로로 갈라진다. Gate projection과 SiLU를 거쳐 8차원 g를, Up projection으로 8차원 u를 만든다. g와 u를 성분별로 곱한 뒤 Down projection으로 4차원 출력으로 바꾼다. 세 선형 변환을 순서대로 통과하는 구조가 아니다.</desc><metadata>{&quot;id&quot;:&quot;04-gated-mlp&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Gated MLP: 두 갈래로 계산한 뒤 곱하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">SwiGLU에서는 같은 입력에서 Gate 값과 Up 값을 각각 계산합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><text x="600" y="224" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">같은 토큰의 입력 x · d = 4</text><rect x="400" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">4</tspan></text><path d="M600,306 L600,360" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="600" cy="360" r="5" fill="#2470BB"/><path d="M600,360 H320 V404" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M600,360 H880 V404" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="120" y="420" width="400" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="320" y="452" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Gate projection</text><text x="320" y="480" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">d → m  ·  4 → 8</text><rect x="680" y="420" width="400" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="880" y="452" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Up projection</text><text x="880" y="480" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → m  ·  4 → 8</text><path d="M320,508 L320,548" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="120" y="562" width="400" height="70" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="320" y="594" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">SiLU</text><text x="320" y="622" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">성분별 활성화</text><path d="M320,644 L320,682" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M880,508 L880,682" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="320" y="721" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">Gate 값 g · m = 8</text><text x="880" y="721" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Up 값 u · m = 8</text><rect x="96" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="124.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="152" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="180.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="208" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="236.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="264" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="292.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="320" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="348.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="376" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="404.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="432" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="460.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="488" y="743" width="56" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="516.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">8</tspan></text><rect x="656" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="684.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="712" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="740.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="768" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="796.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="824" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="852.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="880" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="908.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="936" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="964.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="992" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1020.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="1048" y="743" width="56" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1076.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M320,810 V862 H565" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M880,810 V862 H635" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><circle cx="600" cy="862" r="24" fill="white" stroke="#287D78" stroke-width="2.5"/><text x="600" y="871" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">⊙</text><text x="600" y="922" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">같은 위치의 성분끼리 곱하기 · m차원 유지</text><path d="M600,943 L600,983" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="410" y="998" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Down projection</text><text x="600" y="1058" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">m → d  ·  8 → 4</text><path d="M600,1086 L600,1126" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="400" y="1140" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500" y="1140" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600" y="1140" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700" y="1140" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">4</tspan></text><text x="600" y="1238" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">출력도 d = 4 · 세 선형 변환은 Gate, Up, Down입니다.</text></g></g><path d="M48,1291 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1329" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Gate와 Up은 서로 다른 가중치를 사용합니다. 그림의 크기는 설명용이며 bias는 생략했습니다.</text></svg>