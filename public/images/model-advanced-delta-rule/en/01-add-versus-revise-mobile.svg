 S₂ and new KV · Unit Key k₂=[1,0]</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">· Delta β=1</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Additive rule</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="120" fill="#287D78" font-size="24" font-weight="400" text-anchor="middle" data-max-width="500">Read with the Key before update</text><g data-container="true"><rect x="165" y="155" width="85" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="207.5" y="197.1" fill="#287D78" font-size="30" font-weight="500" text-anchor="middle" data-max-width="73">2</text></g><g data-container="true"><rect x="260" y="155" width="85" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="302.5" y="197.1" fill="#287D78" font-size="30" font-weight="500" text-anchor="middle" data-max-width="73">0</text></g><text x="260" y="280" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle" data-max-width="500">New Value to write</text><g data-container="true"><rect x="165" y="315" width="85" height="65" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="207.5" y="357.1" fill="#B55B22" font-size="30" font-weight="500" text-anchor="middle" data-max-width="73">1</text></g><g data-container="true"><rect x="260" y="315" width="85" height="65" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="302.5" y="357.1" fill="#B55B22" font-size="30" font-weight="500" text-anchor="middle" data-max-width="73">1</text></g><path d="M260 400 L260 435" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="60" y="450" width="400" he