<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">Count new work and retained KV separately</title><desc id="desc">B retains 6 KV positions and processes 1 new input to reach 7. C processes 6 prompt inputs to create 6 KV positions. The 7 input tokens fit a step budget of 8, and the 13 resulting KV positions fit capacity 24. Solid outlines denote existing KV; dashed outlines denote KV to add.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1150" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Count new work and retained KV separately</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Computing new tokens does not remove the KV already retained.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="219.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Candidates for the next execution</text><rect x="48" y="246" width="520" height="160" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="600" y="246" width="552" height="160" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="72" y="283.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">B · Decode</text><text x="72" y="326.0" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">6 KV positions retained</text><text x="72" y="373.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">1 new input → 7 KV positions</text><text x="624" y="283.0" fill="#7954A3" font-size="28" font-weight="700" text-anchor="start">C · Prefill</text><text x="624" y="326.0" fill="#7954A3" font-size="24" font-weight="400" text-anchor="start">No KV yet</text><text x="624" y="373.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">6 inputs → 6 KV positions</text><text x="48" y="471.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Tokens to compute now</text><text x="115" y="510.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B</text><text x="262" y="510.0" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">C</text><rect x="96" y="529" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="180" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="222" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="264" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="306" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="348" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="390" y="529" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,590 v9 h332 v-9" stroke="#526577" stroke-width="1.5" fill="none"/><text x="262.0" y="632.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Step token budget: 8</text><text x="650" y="564.0" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">1 + 6 = 7</text><text x="650" y="609.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Fits the budget of 8</text><path d="M48,679 H1152" stroke="#DCE4EC"/><text x="48" y="731.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Actual KV to retain after this execution</text><text x="241" y="776.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">B · 7</text><text x="514" y="776.0" fill="#7954A3" font-size="23" font-weight="700" text-anchor="middle">C · 6</text><rect x="96" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="180" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="222" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="264" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="306" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="348" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="390" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="432" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="474" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="516" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="558" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="600" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="642" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="684" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="726" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="768" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="810" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="852" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="894" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="936" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="978" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1020" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1062" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,858 v9 h1004 v-9" stroke="#526577" stroke-width="1.5" fill="none"/><text x="598.0" y="900.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">KV capacity: 24 token positions</text><text x="48" y="951.0" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">7 + 6 = 13</text><text x="364" y="951.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">Fits within capacity 24</text><rect x="48" y="987" width="26" height="28" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><text x="89" y="1010.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Existing KV</text><rect x="319" y="987" width="26" height="28" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6" stroke-dasharray="5 4"/><text x="360" y="1010.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">KV to add in this execution</text><text x="48" y="1090.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Can the engine actually allocate this space?</text></svg>