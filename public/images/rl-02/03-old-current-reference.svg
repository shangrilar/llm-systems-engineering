<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1227" viewBox="0 0 1200 1227" role="img" aria-labelledby="title desc"><title id="title">현재 모델을 누구와, 무엇으로 비교하는가</title><desc id="desc">왼쪽은 같은 P를 current와 old 모델에 넣고 토큰 u의 확률 0.6과 0.5로 확률비 1.2를 구한다. 오른쪽은 같은 P를 current와 reference에 넣고 후보 u b d e 전체 확률분포를 KL로 비교한다. 두 current는 같은 현재 모델이며 reference는 고정한다.</desc><metadata>{&quot;id&quot;:&quot;2-4&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;PPO&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/1707.06347&quot;},{&quot;label&quot;:&quot;RLHF Book — Regularization&quot;,&quot;url&quot;:&quot;https://rlhfbook.com/c/15-regularization&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">현재 모델을 누구와, 무엇으로 비교하는가</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 입력 P에서, old와는 선택 토큰의 확률비를 구하고 reference와는 분포의 차이를 구합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">데이터 생성 이후의 변화 · 확률비</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="104" width="488" height="86" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="135" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 입력 P</text><text x="32" y="175" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">첫 토큰을 예측할 문맥</text></g><path d="M260 202 V224 H127 V244" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><path d="M260 224 H393 V244" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="16" y="257" width="222" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="288" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">current</text><text x="32" y="328" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">학습 중 모델</text></g><path d="M127 377 L127 410" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="432" width="222" height="128" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="463" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">선택 토큰 u</text><text x="32" y="503" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">p(u | P) = 0.6</text></g><path d="M127 572 V650 H226 V679" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="282" y="257" width="222" height="108" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="298" y="288" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">old</text><text x="298" y="328" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">생성 당시 모델</text></g><path d="M393 377 L393 410" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="282" y="432" width="222" height="128" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="298" y="463" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">선택 토큰 u</text><text x="298" y="503" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">p(u | P) = 0.5</text></g><path d="M393 572 V650 H294 V679" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="692" width="488" height="144" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="723" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">r = p_current(u | P) / p_old(u | P)</text><text x="32" y="763" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">0.6 / 0.5 = 1.2</text><text x="32" y="791" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">이 선택의 확률이 얼마나 달라졌는가?</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">기준과의 거리 · 선택적 KL</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="104" width="488" height="86" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="135" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 입력 P</text><text x="32" y="175" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">첫 토큰을 예측할 문맥</text></g><path d="M260 202 V224 H127 V244" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><path d="M260 224 H393 V244" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="16" y="257" width="222" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="288" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">current</text><text x="32" y="328" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">학습 중 모델</text></g><path d="M127 377 L127 410" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="16" y="439" fill="#2470BB" font-size="20" font-weight="600" text-anchor="start" data-max-width="222">다음 토큰 분포</text><text x="16" y="484" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">u</text><rect x="50" y="465" width="128" height="23" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="234" y="485" fill="#2470BB" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.6</text><text x="16" y="522" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">b</text><rect x="50" y="503" width="42.66666666666667" height="23" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="234" y="523" fill="#2470BB" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.2</text><text x="16" y="560" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">d</text><rect x="50" y="541" width="21.333333333333336" height="23" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="234" y="561" fill="#2470BB" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.1</text><text x="16" y="598" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">e</text><rect x="50" y="579" width="21.333333333333336" height="23" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="234" y="599" fill="#2470BB" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.1</text><path d="M127 619 V650 H226 V679" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="282" y="257" width="222" height="108" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="298" y="288" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">reference</text><text x="298" y="328" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">고정 기준 모델</text></g><path d="M393 377 L393 410" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="282" y="439" fill="#7954A3" font-size="20" font-weight="600" text-anchor="start" data-max-width="222">다음 토큰 분포</text><text x="282" y="484" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">u</text><rect x="316" y="465" width="85.33333333333334" height="23" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="500" y="485" fill="#7954A3" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.4</text><text x="282" y="522" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">b</text><rect x="316" y="503" width="64" height="23" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="500" y="523" fill="#7954A3" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.3</text><text x="282" y="560" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">d</text><rect x="316" y="541" width="42.66666666666667" height="23" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="500" y="561" fill="#7954A3" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.2</text><text x="282" y="598" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="24">e</text><rect x="316" y="579" width="21.333333333333336" height="23" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="500" y="599" fill="#7954A3" font-size="20" font-weight="400" text-anchor="end" data-max-width="43">0.1</text><path d="M393 619 V650 H294 V679" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="692" width="488" height="144" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="723" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">KL(current ∥ reference)</text><text x="32" y="763" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">전체 분포가 기준에서 얼마나 달라졌는가?</text></g></g><path d="M48,1119.2923076923075 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1157.2923076923075" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">네 후보만 있는 가상 어휘의 예입니다. 두 current는 같은 현재 모델입니다. old는 데이터를 만든 정책이고,</text><text x="48" y="1186.6923076923076" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">reference는 유지하려는 고정 기준입니다.</text></svg>