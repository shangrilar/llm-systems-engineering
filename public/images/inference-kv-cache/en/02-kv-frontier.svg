<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1216" viewBox="0 0 1200 1216" role="img" aria-labelledby="title desc"><title id="title">The boundary between token selection and KV computation</title><desc id="desc">After prefill, KV exists for p0 p1 p2 and x0 has been selected without its own KV. The next step computes KV for x0 and selects x1; the following step computes KV for x1 and selects x2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1216" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">The boundary between token selection and KV computation</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Ordinary one-token generation: the first output x0 comes from the final prefill</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">position’s logits.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="214.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">State immediately after model execution and next-token selection</text><rect x="48" y="254" width="214" height="57" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="65" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Step</text><rect x="286" y="254" width="540" height="57" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="303" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Prompt and output history</text><rect x="850" y="254" width="302" height="57" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="867" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Just selected</text><text x="48" y="386.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">After prefill</text><rect x="286" y="348" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="325.5" y="385.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="375" y="348" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="414.5" y="385.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="464" y="348" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="503.5" y="385.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="553" y="348" width="79" height="57" rx="10" fill="#F7F9FB" stroke="#526577" stroke-width="1.5" stroke-dasharray="6 5"/><text x="592.5" y="385.0" fill="#526577" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="286" y="447.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="start">KV computed: 3 positions</text><text x="286" y="486.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">Next input if continuing: x0</text><g data-box="850,348,302,144"><rect x="850" y="348" width="302" height="144" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="870" y="383.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">x0</text><text x="870" y="426.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Already selected</text><text x="870" y="456.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">No own K/V yet</text></g><text x="48" y="590.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">After decode</text><rect x="286" y="552" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="325.5" y="589.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="375" y="552" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="414.5" y="589.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="464" y="552" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="503.5" y="589.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="553" y="552" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="592.5" y="589.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="642" y="552" width="79" height="57" rx="10" fill="#F7F9FB" stroke="#526577" stroke-width="1.5" stroke-dasharray="6 5"/><text x="681.5" y="589.0" fill="#526577" font-size="25" font-weight="700" text-anchor="middle">x1</text><text x="286" y="651.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="start">KV computed: 4 positions</text><text x="286" y="690.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">Next input if continuing: x1</text><g data-box="850,552,302,144"><rect x="850" y="552" width="302" height="144" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="870" y="587.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">x1</text><text x="870" y="630.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Already selected</text><text x="870" y="660.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">No own K/V yet</text></g><text x="48" y="794.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">After next</text><text x="48" y="826.2" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">decode</text><rect x="286" y="756" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="325.5" y="793.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="375" y="756" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="414.5" y="793.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="464" y="756" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="503.5" y="793.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="553" y="756" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="592.5" y="793.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="642" y="756" width="79" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="681.5" y="793.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">x1</text><rect x="731" y="756" width="79" height="57" rx="10" fill="#F7F9FB" stroke="#526577" stroke-width="1.5" stroke-dasharray="6 5"/><text x="770.5" y="793.0" fill="#526577" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="286" y="855.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="start">KV computed: 5 positions</text><text x="286" y="894.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">Next input if continuing: x2</text><g data-box="850,756,302,144"><rect x="850" y="756" width="302" height="144" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="870" y="791.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">x2</text><text x="870" y="834.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Already selected</text><text x="870" y="864.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">No own K/V yet</text></g><g data-box="48,1001,1104,111"><rect x="48" y="1001" width="1104" height="111" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="1036.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Selected tokens and KV-ready positions are different counts</text><text x="70" y="1078.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">If generation stops at x2, no subsequent model execution on x2 is required.</text></g><text x="48" y="1161.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Solid green: KV exists · Dashed gray: in history, but its KV is not ready</text></svg>