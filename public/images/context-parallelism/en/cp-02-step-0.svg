<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Token partitioning must preserve attention connections · Why remote K·V is needed</title><desc id="desc">Q(t3) on GPU 1 also needs K,V for t0,t1 on GPU 0. The lower-triangular matrix shows references across the GPU boundary.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,&quot;Apple SD Gothic Neo&quot;,&quot;Noto Sans KR&quot;,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1050" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">Token partitioning must preserve attention connections</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">Causal attention · Rows = query Q tokens / Columns = key K tokens</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="48" y="147" width="528" height="252" rx="10" fill="white" stroke="#2470bb" stroke-width="1.5"/><text x="70" y="181.0" font-size="24" fill="#2470bb" font-weight="700" text-anchor="start">GPU 0</text><rect x="624" y="147" width="528" height="252" rx="10" fill="white" stroke="#b55b22" stroke-width="1.5"/><text x="646" y="181.0" font-size="24" fill="#b55b22" font-weight="700" text-anchor="start">GPU 1</text><text x="158.0" y="223.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">Q</text><rect x="122" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="158" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="122" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="158" y="274" width="36" height="36" f