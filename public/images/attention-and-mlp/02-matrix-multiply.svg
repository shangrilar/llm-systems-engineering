rrow)"/><rect x="714" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="753.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">−1</text><text x="831.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">5</text><rect x="792" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="792" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="792" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="792" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">2</text><path d="M831.0,566 L831.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="792" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="831.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">3</text><text x="909.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">6</text><rect x="870" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="909.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="870" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="909.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="870" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="909.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">2</text><rect x="870" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="909.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><path d="M909.0,566 L909.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="870" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="909.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">0</text><text x="987.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">7</text><rect x="948" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="987.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="948" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="987.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="948" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="987.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0.5</text><rect x="948" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="987.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><path d="M987.0,566 L987.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="948" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="987.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">−0.5</text><text x="1065.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">8</text><rect x="1026" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="1065.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="1026" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="1065.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="1026" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="1065.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="1026" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="1065.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">−1</text><path d="M1065.0,566 L1065.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="1026" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1065.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">2</text><text x="278" y="675" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">출력 z · 1 × 8</text><text x="600" y="753" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">x (1 × 4)  ×  W (4 × 8)  =  z (1 × 8)</text><rect x="48" y="796" width="1104" height="255" rx="14" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1.5"/><text x="80" y="841" fill="#287D78" font-size="27" font-weight="600" text-anchor="start">세 번째 열로 세 번째 출력 성분을 계산합니다.</text><text x="600" y="912" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">z<tspan baseline-shift="sub" font-size="70%">3</tspan> = 1 × 2 + 2 × (−1) + (−1) × (−0.5) + 0 × 1 = 0.5</text><text x="80" y="977" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">입력과 열의 성분을 위치별로 곱한 뒤, 네 결과를 더합니다.</text><text x="80" y="1020" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">각 출력 성분은 입력 성분들의 가중합입니다.</text><text x="600" y="1116" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">모든 토큰에 같은 W를 각각 적용합니다. 토큰끼리는 섞이지 않습니다.</text><text x="600" y="1165" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">X (T × d)  ×  W (d × m)  =  Z (T × m)</text><path d="M48,1200 L1152,1200" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1241" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">입력과 가중치는 설명용 수치입니다. 다음 그림의 첫 선형 변환에 해당하며 bias는 생략했습니다.</text>
