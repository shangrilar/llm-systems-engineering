" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M894,412 L1063,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="1020" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1063" y="541" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t3</text><path d="M1063,575 L1063,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="1020" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="894" y="691" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">출력 4행</text><text x="636" y="771" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">가중치 데이터량</text><rect x="636" y="790" width="240" height="38" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="894" y="818" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">1×</text><text x="636" y="884" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">선형 연산량</text><rect x="636" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="696" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="756" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="816" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="892" y="931" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">4×</text><text x="48" y="1001" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">각 항목의 1토큰 값을 기준으로 비교 · 가중치 한 벌을 읽는 근사</text><text x="48" y="1054" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">여러 토큰: 한 요청의 Prefill 또는 여러 요청의 Decode</text></g></g><path d="M48,1105 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1143" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">출력 행과 선형 연산량은 네 배로 늘지만, 읽을 가중치 데이터량은 같습니다.</text></svg>