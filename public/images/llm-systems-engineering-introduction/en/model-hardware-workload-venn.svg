22" stroke-width="3"/><text x="552" y="150" fill="#2470BB" font-size="36" font-weight="700" text-anchor="middle" data-max-width="260">Model</text><text x="345" y="555" fill="#287D78" font-size="36" font-weight="700" text-anchor="middle" data-max-width="260">Hardware</text><text x="759" y="555" fill="#B55B22" font-size="36" font-weight="700" text-anchor="middle" data-max-width="260">Workload</text><text x="552" y="382" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle" data-max-width="300">Execution</text><text x="552" y="421.2" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle" data-max-width="300">system</text></g><path d="M48,942 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="980" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">This series examines execution systems through three perspectives: models, hardware, and workloads.</text></svg>