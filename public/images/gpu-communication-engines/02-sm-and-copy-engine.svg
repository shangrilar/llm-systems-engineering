<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1378" viewBox="0 0 1200 1378" role="img" aria-labelledby="title desc"><title id="title">같은 연결을 사용하는 SM과 복사 엔진</title><desc id="desc">NVLink 연결과 전달 데이터를 동일하게 둔 두 복사 방식의 비교다. 위에서는 SM의 통신 커널이 GPU 0 메모리를 읽고 NVLink를 통해 상대 GPU 메모리에 쓴다. 계산 C도 SM을 사용한다. 아래에서는 지원되는 복사를 CE가 수행하고 C는 SM에서 실행한다. SM과 CE는 실행 장치이고 NVLink는 연결이다. 이 도식은 임의의 NCCL Send/Recv가 CE로 전환된다는 뜻이 아니다.</desc><metadata>{&quot;id&quot;:&quot;02-sm-and-copy-engine&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">같은 연결을 사용하는 SM과 복사 엔진</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">GPU 0에서 독립 계산 C를 함께 실행하며, 같은 NVLink 연결로 전달합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><rect x="48" y="207" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="246" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">NVLink로 복사할 수 있는 환경 · CE가 지원하는 복사 작업</text><text x="48" y="300" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">SM의 통신 커널로 전달</text><rect x="72" y="328" width="456" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="776" y="328" width="352" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="100" y="371" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 0</text><text x="804" y="371" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><rect x="100" y="396" width="400" height="150" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="120" y="431" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">SM</text><rect x="120" y="449" width="166" height="70" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="203" y="493" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">계산 C</text><rect x="302" y="449" width="178" height="70" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="391" y="493" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">통신 커널</text><rect x="120" y="626" width="380" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="310" y="663" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">GPU 메모리</text><text x="310" y="698" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">전달할 x</text><path d="M400,616 V556" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="310" y="593" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="end">읽기</text><rect x="800" y="443" width="304" height="86" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="952" y="480" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">GPU 메모리</text><text x="952" y="515" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">전달받은 x</text><path d="M500,486 H789" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="650" y="456" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NVLink</text><text x="650" y="529" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">같은 연결</text><text x="952" y="631" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">상대 GPU에 쓰기</text><text x="48" y="814" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">복사 엔진 CE로 전달</text><rect x="72" y="842" width="456" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="776" y="842" width="352" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="100" y="885" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 0</text><text x="804" y="885" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><rect x="100" y="910" width="186" height="150" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="193" y="979" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">SM</text><text x="193" y="1014" fill="#7954A3" font-size="24" font-weight="400" text-anchor="middle">계산 C</text><rect x="302" y="910" width="198" height="150" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="401" y="979" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">복사 엔진 CE</text><text x="401" y="1014" fill="#4C60A8" font-size="22" font-weight="400" text-anchor="middle">복사 수행</text><rect x="120" y="1140" width="380" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="310" y="1177" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">GPU 메모리</text><text x="310" y="1212" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">전달할 x</text><path d="M400,1130 V1070" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="310" y="1107" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="end">읽기</text><rect x="800" y="957" width="304" height="86" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="952" y="994" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">GPU 메모리</text><text x="952" y="1029" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">전달받은 x</text><path d="M500,1000 H789" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="650" y="970" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NVLink</text><text x="650" y="1043" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">같은 연결</text><text x="952" y="1145" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">상대 GPU에 쓰기</text></g></g><path d="M48,1300 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1338" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">SM과 CE는 실행 장치이고 NVLink는 연결입니다. 모든 NCCL Send/Recv가 CE로 바뀐다는 뜻은 아닙니다.</text></svg>