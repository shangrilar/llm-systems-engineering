<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1234" viewBox="0 0 1200 1234" role="img" aria-labelledby="title desc"><title id="title">Where a CSA layer differs from HCA</title><desc id="desc">A CSA layer has query, local-KV and output weights with HCA’s structure, plus twice-as-wide overlapping-compression weights (the a|b halves of W^{KV}_{comp} and W^Z) and an indexer. The indexer takes X and the c^Q shared with the main query and returns the block ids to select.</desc><metadata>{&quot;id&quot;:&quot;csa-flow-01-weight-map&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 report · §2.3.1 (CSA)&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro&quot;},{&quot;label&quot;:&quot;DeepSeek-V4-Pro inference code · Attention, Compressor, Indexer&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/blob/main/inference/model.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 16 · CSA</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Where a CSA layer differs from HCA</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Overlapping compression (candidates twice as wide) and the indexer</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="800"><tspan>Shared query part and the indexer</tspan></text><g data-matrix="X"><rect x="16" y="146" width="128" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="80" y="134" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="248"><tspan>X</tspan></text><text x="88" y="217" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[T, D]</tspan></text><g data-matrix="W^{DQ}"><rect x="242" y="76" width="96" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="290" y="64" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="216"><tspan>W</tspan><tspan dy="-9.1" font-size="16.8">DQ</tspan></text><text x="298" y="147" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[D, r</tspan><tspan dy="4" font-size="12.6">q</tspan><tspan dy="-4">]</tspan></text><path d="M290 124 L290 153" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/><circle cx="290" cy="170" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="290" y="176.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><rect x="354" y="153" width="128" height="34" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="418" y="177" fill="#657789" font-size="19" font-weight="600" text-anchor="middle" data-max-width="120">RMSNorm</text><g data-matrix="c^Q"><rect x="530" y="146" width="96" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="578" y="134" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="216"><tspan>c</tspan><tspan dy="-9.1" font-size="16.8">Q</tspan></text><text x="578" y="217" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, r</tspan><tspan dy="4" font-size="12.6">q</tspan><tspan dy="-4">]</tspan></text><text x="654" y="164" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>the indexer reuses this c</tspan><tspan dy="-6.5" font-size="11.9">Q</tspan></text><text x="654" y="190" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>c</tspan><tspan dy="-6.5" font-size="11.9">Q</tspan><tspan dy="6.5"> → W</tspan><tspan dy="-6.5" font-size="11.9">UQ</tspan><tspan dy="6.5"> → Q: as in HCA</tspan></text><rect x="595" y="334" width="210" height="52" rx="10" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/><text x="700" y="367" fill="#B34242" font-size="20" font-weight="700" text-anchor="middle" data-max-width="200">indexer</text><text x="120" y="390" fill="#B34242" font-size="17" font-weight="400" text-anchor="start" data-max-width="420"><tspan>red = indexer path (CSA only)</tspan></text><g data-matrix="ids"><rect x="903" y="336" width="44" height="48" rx="0" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/></g><text x="925" y="324" fill="#B34242" font-size="24" font-weight="600" text-anchor="middle" data-max-width="164"><tspan>ids</tspan></text><text x="925" y="407" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, k]</tspan></text><text x="595" y="422" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="480"><tspan>outputs: the selected block ids (top-k)</tspan></text><path d="M306 170 L352 170" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M482 170 L524 170" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M144 170 L273 170" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M80 194 L80 360 L593 360" stroke="#B34242" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/><path d="M626 170 L647 170 L647 297.8 L700 297.8 L700 332" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M807 360 L897 360" stroke="#B34242" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/></g><g transform="translate(48 704) scale(1)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="800"><tspan>Compression KV: candidates C and scores Z</tspan></text><g data-matrix="X"><rect x="16" y="146" width="128" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="80" y="134" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="248"><tspan>X</tspan></text><text x="88" y="217" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[T, D]</tspan></text><text x="112" y="134" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="170"><tspan>same input as above</tspan></text><g data-matrix="W^{KV}_{comp}"><rect x="240" y="76" width="100" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="290" y="64" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>W</tspan><tspan dy="-9.1" font-size="16.8">KV</tspan><tspan dy="14.4" dx="-19.2" font-size="16.8">comp</tspan></text><text x="298" y="147" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[D, 2c]</tspan></text><path d="M290 124 L290 153" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/><circle cx="290" cy="170" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="290" y="176.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><g data-matrix="C"><rect x="360" y="146" width="100" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="410" y="134" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>C</tspan></text><text x="410" y="217" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, 2c]</tspan></text><text x="488" y="164" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>first half a: the previous span of the next entry</tspan></text><text x="488" y="190" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>second half b: for its own span (overlap)</tspan></text><g data-matrix="W^Z"><rect x="240" y="266" width="100" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="290" y="254" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>W</tspan><tspan dy="-9.1" font-size="16.8">Z</tspan></text><text x="298" y="337" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[D, 2c]</tspan></text><path d="M290 314 L290 343" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/><circle cx="290" cy="360" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="290" y="366.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><g data-matrix="Z"><rect x="360" y="336" width="100" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="410" y="324" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>Z</tspan></text><text x="410" y="407" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, 2c]</tspan></text><text x="0" y="470" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="1100"><tspan>local KV and output paths are as in HCA and omitted (parameters are per layer)</tspan></text><path d="M306 170 L354 170" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/><path d="M306 360 L354 360" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/><path d="M144 170 L273 170" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M80 194 L80 360 L273 360" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/></g></svg>