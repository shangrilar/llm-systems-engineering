<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2045" viewBox="0 0 360 2045" role="img" aria-labelledby="title desc"><title id="title">같은 예측 loss도 갱신 범위를 다르게 정할 수 있습니다</title><desc id="desc">두 구성 모두 이미지와 질문, 앞선 정답 토큰으로 다음 정답 토큰의 점수를 예측해 loss를 계산합니다. 왼쪽은 pretrained 시각 인코더와 LLM을 고정하고 projector만 갱신합니다. 고정 LLM도 projector로 전달할 입력 gradient를 계산합니다. 오른쪽은 시각 인코더·projector·LLM을 함께 갱신합니다. 공동 학습과 처음부터 초기화해 학습하는 것은 다른 선택이며 둘을 동일시하지 않습니다.</desc><metadata>{&quot;id&quot;:&quot;ma-22-05&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;LLaVA&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2304.08485&quot;},{&quot;label&quot;:&quot;Kimi K3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.24653v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 5 · 시각과 언어</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">같은 예측 loss도 갱신 범위를</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">다르게 정할 수 있습니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">연결부만 학습 / 전체 공동 학습 · 필수</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">순서가 아닌 두 가지 구성</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 연결부만 갱신</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="50" y="110" width="300" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="200" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">이미지</text><path d="M200 180 L200 220" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="230" width="390" height="125" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="261" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Vision encoder</text><text x="36" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">가중치 고정</text></g><path d="M195 370 L195 455" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="475" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="506" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Projector</text><text x="36" y="546" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">가중치 갱신</text></g><path d="M195 615 L195 700" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="720" width="390" height="125" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="751" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">LLM + LM head</text><text x="36" y="791" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">가중치 고정</text></g><text x="225" y="645" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="275">질문·앞선 정답도 입력</text><path d="M195 865 L195 910" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="920" width="390" height="175" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="951" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">다음 토큰 예측 loss</text><text x="36" y="991" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">예측 점수와 정답 비교</text><text x="36" y="1019" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">현재 정답을 입력에서 미리 읽지 않음</text></g><path d="M420 1000 H490 V840 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><path d="M420 750 H455 V555 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><text x="260" y="1130" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle" data-max-width="500">실선: 순방향 · 점선: gradient</text><g data-container="true"><rect x="20" y="1170" width="480" height="190" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1201" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">고정 ≠ 입력 gradient 차단</text><text x="36" y="1241" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">LLM 가중치는 유지해도 입력에 대한 미분은</text><text x="36" y="1269" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">projector로 전달</text></g></g><g transform="translate(16 1125.0923076923077) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 전체 공동 학습</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="50" y="110" width="300" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="200" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">이미지</text><path d="M200 180 L200 220" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="230" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="261" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Vision encoder</text><text x="36" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">가중치 갱신</text></g><path d="M195 370 L195 455" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="475" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="506" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Projector</text><text x="36" y="546" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">가중치 갱신</text></g><path d="M195 615 L195 700" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="720" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="751" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">LLM + LM head</text><text x="36" y="791" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">가중치 갱신</text></g><text x="225" y="645" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="275">질문·앞선 정답도 입력</text><path d="M195 865 L195 910" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="920" width="390" height="175" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="951" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">다음 토큰 예측 loss</text><text x="36" y="991" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">예측 점수와 정답 비교</text><text x="36" y="1019" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">현재 정답을 입력에서 미리 읽지 않음</text></g><path d="M420 1000 H490 V840 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><path d="M420 750 H455 V555 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><path d="M420 505 H455 V305 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><text x="260" y="1130" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle" data-max-width="500">실선: 순방향 · 점선: gradient</text><g data-container="true"><rect x="20" y="1170" width="480" height="190" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1201" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">함께 학습 ≠ 반드시 from scratch</text><text x="36" y="1241" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">pretrained 초기화 여부와 갱신 범위는 별개의</text><text x="36" y="1269" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">선택</text></g></g></svg>