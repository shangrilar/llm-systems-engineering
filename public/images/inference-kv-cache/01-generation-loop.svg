="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="312" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="400" y="795" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="832" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><path d="M490,823 L694,823" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="704" y="777" width="180" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="794" y="818" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="794" y="859" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">예측 점수</text><path d="M896,823 L1034,823" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="965" y="802" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">선택</text><rect x="1044" y="795" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087" y="832" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="48" y="893" fill="#2470BB" font-size="23" font-weight="400" text-anchor="start">입력 문맥</text><text x="48" y="975" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">각 실행의 마지막 입력 위치에서 나온 점수로 다음 토큰을 선택합니다.</text><text x="48" y="1040" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">입력 문맥은 생성이 참조하는 정보입니다. 실제로 다시 계산할 위치는 다음 그림에서 살펴봅니다.</text></g></g><path d="M48,1122 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1160" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">다음에 입력할 토큰은 현재 토큰을 선택한 뒤에 정해집니다.</text></svg>