<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2006" viewBox="0 0 360 2006" role="img" aria-labelledby="title desc"><title id="title">적게 읽는 것과 적게 보관하는 것은 다릅니다</title><desc id="desc">A의 window-only 층은 p7에서{5,6,7}, p8에서{6,7,8}을 보관하므로 5를 삭제하고 8을 추가한다. 별도 full-attention 층의 캐시에는 p0부터 p8이 있고 p5도 유지된다. B는 원래 KV가 선택에 필요한 sparse 층으로 p0부터 p7의 8개를 보관하면서 현재 q7은{0,5,7}의 3개만 읽는다.</desc><metadata>{&quot;id&quot;:&quot;ma-04-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mistral 7B §2, rolling buffer cache&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2310.06825v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 4 · 읽기와 보관</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">적게 읽는 것과 적게 보관하는</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">것은 다릅니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">각 칸은 한 위치의 KV · 층마다 자기</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">cache를 관리 · 교육용 상태 예시</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Window 전용 층</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="10" y="114" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="500">조건: window 밖 위치를 다시 읽지 않음</text><rect x="10" y="199" width="500" height="659" rx="12" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5"/><text x="30" y="244" fill="#287D78" font-size="26" font-weight="600" text-anchor="start" data-max-width="458">이 층의 KV cache</text><text x="30" y="310" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">p7을 처리할 때</text><g data-container="true"><rect x="112" y="347" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="156" y="386.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">5</text></g><g data-container="true"><rect x="216" y="347" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="386.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">6</text></g><g data-container="true"><rect x="320" y="347" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="364" y="386.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">7</text></g><path d="M260 435 L260 558" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="83" y="491" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle" data-max-width="142">p5 삭제</text><text x="425" y="491" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle" data-max-width="142">p8 추가</text><text x="30" y="601" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">p8을 처리할 때</text><g data-container="true"><rect x="112" y="638" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="156" y="677.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">6</text></g><g data-container="true"><rect x="216" y="638" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="677.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">7</text></g><g data-container="true"><rect x="320" y="638" width="88" height="62" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="364" y="677.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">8</text></g><text x="30" y="774" fill="#287D78" font-size="25" font-weight="600" text-anchor="start" data-max-width="458">보관: 최근 3개 위치의 KV</text><rect x="10" y="927" width="500" height="278" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="30" y="971" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">다른 full-attention 층의 cache</text><g data-container="true"><rect x="38" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="60" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">0</text></g><g data-container="true"><rect x="88" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="110" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">1</text></g><g data-container="true"><rect x="138" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="160" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">2</text></g><g data-container="true"><rect x="188" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="210" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">3</text></g><g data-container="true"><rect x="238" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="260" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">4</text></g><g data-container="true"><rect x="288" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="310" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">5</text></g><g data-container="true"><rect x="338" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="360" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">6</text></g><g data-container="true"><rect x="388" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="410" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">7</text></g><g data-container="true"><rect x="438" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="460" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">8</text></g><text x="30" y="1147" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" data-max-width="458">이 cache의 p5는 그대로 보관합니다.</text></g><g transform="translate(16 1024.1692307692306) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 선택에 원래 KV가 필요한 층</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="10" y="114" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="500">조건: 다음 Query가 다른 위치를 고를 수 있음</text><rect x="216" y="226" width="88" height="54" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="261" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="76">q7</text><text x="20" y="260" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="176">현재 읽기</text><g data-container="true"><rect x="38" y="427" width="48" height="56" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="62" y="462.68" fill="#287D78" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">0</text></g><g data-container="true"><rect x="94" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="118" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">1</text></g><g data-container="true"><rect x="150" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="174" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">2</text></g><g data-container="true"><rect x="206" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="230" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">3</text></g><g data-container="true"><rect x="262" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="286" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">4</text></g><g data-container="true"><rect x="318" y="427" width="48" height="56" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="342" y="462.68" fill="#287D78" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">5</text></g><g data-container="true"><rect x="374" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="398" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">6</text></g><g data-container="true"><rect x="430" y="427" width="48" height="56" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="454" y="462.68" fill="#287D78" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">7</text></g><rect x="10" y="397" width="500" height="350" rx="12" fill="none" stroke="#287D78" stroke-width="1.5"/><path d="M260 288 L260 343" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M62 343 L454 343" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M62 343 L62 419" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M342 343 L342 419" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M454 343 L454 419" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="30" y="547" fill="#287D78" font-size="26" font-weight="600" text-anchor="start" data-max-width="458">이 층의 KV cache</text><text x="30" y="605" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">회색 칸도 보관 중입니다.</text><text x="30" y="663" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" data-max-width="458">다음 Query에서 선택될 수 있습니다.</text><text x="260" y="830" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle" data-max-width="490">보관 8개 · 현재 읽기 3개</text><g data-container="true"><rect x="30" y="929" width="460" height="196" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="960" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">읽지 않았다고 삭제하지는 않습니다.</text><text x="46" y="1000" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">선택에 필요한 상태와 선택 후 읽는 KV를</text><text x="46" y="1028" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">구별합니다.</text></g></g><path d="M16,1842.9384615384613 H344" stroke="#DCE4EC" stroke-width="2"/><text x="16" y="1869.9384615384613" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">Window 밖의 위치를 다시 읽지 않는 층은</text><text x="16" y="1892.3384615384614" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">오래된 KV를 버릴 수 있습니다. 그러나 원래</text><text x="16" y="1914.7384615384613" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">KV에서 다음 Query의 선택을 수행하는</text><text x="16" y="1937.1384615384613" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">sparse 설계에서는 지금 읽지 않은 KV도</text><text x="16" y="1959.5384615384612" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">필요할 수 있습니다. 삭제 가능 여부는 해당</text><text x="16" y="1981.9384615384613" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">층의 접근 규칙과 상태 수명으로 판단합니다.</text></svg>