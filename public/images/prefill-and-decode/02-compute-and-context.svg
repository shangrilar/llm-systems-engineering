-weight="400" text-anchor="start">행: 이번 Q · 열: 참조할 K/V 위치</text><text x="158" y="889.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><text x="231" y="889.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><text x="304" y="889.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><text x="377" y="889.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><text x="104" y="945.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="end">p0</text><rect x="126" y="909" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="158" y="943.0" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="199" y="909" width="64" height="49" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="231" y="943.0" fill="#526577" font-size="20" font-weight="400" text-anchor="middle">×</text><rect x="272" y="909" width="64" height="49" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="304" y="943.0" fill="#526577" font-size="20" font-weight="400" text-anchor="middle">×</text><rect x="345" y="909" width="64" height="49" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="377" y="943.0" fill="#526577" font-size="20" font-weight="400" text-anchor="middle">×</text><text x="104" y="1002.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="end">p1</text><rect x="126" y="966" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="158" y="1000.0" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="199" y="966" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="231" y="1000.0" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="272" y="966" width="64" height="49" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke