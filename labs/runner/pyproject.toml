[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-experiment-runner"
version = "0.1.0"
description = "Shared RunPod execution, artifact collection and cleanup for experiments"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
experiment-runner = "experiment_runner.cli:main"

[tool.setuptools.packages.find]
include = ["experiment_runner*"]
