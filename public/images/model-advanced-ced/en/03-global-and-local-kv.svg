<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1252" viewBox="0 0 1200 1252" role="img" aria-labelledby="title desc"><title id="title">One global KV bank; local KV in every layer</title><desc id="desc">Final encoder states E supply global KV generation in the first Full layer. One Full, four Reindex and fifteen Reuse layers use the same global bank, with layer-local KV in every layer.</desc><metadata>{&quot;id&quot;:&quot;ced-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek Figure 3 and §4.2.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1#S1.F3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3 · Actual decoder sharing</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">One global KV bank; local KV in every layer</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">DeepSeek-V4.1-Flash · 20 decoder layers · Sequence compression m = 1</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Shared global KV</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="30" y="110" width="460" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Final encoder states E</text></g><path d="M260 230 L260 270" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="30" y="280" width="460" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="311" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">KV projection of the first Full layer</text><text x="46" y="351" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Built from E · No sequence compression</text></g><path d="M260 420 L260 460" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="30" y="470" width="460" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">One global main KV bank</text><text x="46" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Indexer K is derived from this bank</text></g><path d="M260 620 L260 680" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="30" y="690" width="460" height="150" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="721" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Shared across all 20 decoder layers</text><text x="46" y="761" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">1 Full · 4 Reindex · 15 Reuse</text></g><text x="30" y="910" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="460">Each layer keeps its own main Q and local</text><text x="30" y="942.2" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="460">KV</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Layer-local work and placement</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="30" y="110" width="130" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="95" y="148" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="118">hₗ</text><path d="M170 140 L220 140" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="230" y="110" width="260" height="115" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="246" y="141" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="228">Local SWA KV</text><text x="246" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="228">Built in this layer</text></g><path d="M95 180 L95 260" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="30" y="270" width="180" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="120" y="308" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">Main Qₗ</text><path d="M120 340 L120 400" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M360 235 V435 H320" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="30" y="410" width="280" height="120" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="441" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="248">Attention</text><text x="46" y="481" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="248">Local + selected global</text></g><path d="M170 540 L170 580" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="30" y="590" width="280" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="170" y="628" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="268">Attention output</text><g data-container="true"><rect x="30" y="720" width="460" height="100" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="751" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Full → Reuse ×3</text></g><path d="M260 830 L260 860" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="30" y="870" width="460" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="901" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">[Reindex → Reuse ×3] ×4</text></g></g></svg>