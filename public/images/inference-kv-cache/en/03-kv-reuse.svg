<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650" role="img" aria-labelledby="title desc"><title id="title">Save computed K and V for the next generation step</title><desc id="desc">The first execution stores p0 p1 p2 K/V in each layer’s cache and selects x0. The next computes new Q/K/V for x0, lets attention read past and current K/V, and selects x1. Then x1 adds its K/V and x2 is selected. The selected output token has not yet produced its own K/V.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1650" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Save computed K and V for the next generation step</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Follow new computation, K/V additions, and attention reads in each layer across the</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">same executions.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="211.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Orange path: add new K and V</text><text x="642" y="211.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">Green path: read for attention</text><text x="48" y="280.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Process the prompt</text><text x="354" y="280.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">Attention in each layer</text><rect x="332" y="303" width="624" height="141" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="48" y="346" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="383.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="346" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="383.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="346" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="383.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><path d="M310,374 L344,374" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="354" y="330" width="240" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="474" y="382.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Compute Q · K · V</text><path d="M604,374 L706,374" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="656" y="356.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">Q</text><rect x="716" y="330" width="218" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="825" y="367.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">Attention</text><text x="825" y="400.0" fill="#287D78" font-size="17" font-weight="400" text-anchor="middle">Current and earlier only</text><path d="M966,374 L984,374" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="994" y="329" width="160" height="117" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1074" y="369.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">Remaining</text><text x="1074" y="403.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">model work</text><path d="M1087,456 L1087,511" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1099" y="487.0" fill="#526577" font-size="20" font-weight="400" text-anchor="start">Select</text><rect x="1044" y="521" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="558.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><g data-box="354,512,88,74"><rect x="354" y="512" width="88" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M354,543 H442" stroke="#B55B22"/><text x="398.0" y="535.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="398.0" y="571.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="454,512,88,74"><rect x="454" y="512" width="88" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M454,543 H542" stroke="#B55B22"/><text x="498.0" y="535.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="498.0" y="571.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="554,512,88,74"><rect x="554" y="512" width="88" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M554,543 H642" stroke="#B55B22"/><text x="598.0" y="535.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="598.0" y="571.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><path d="M474,430 V469" stroke="#B55B22" stroke-width="2.5" fill="none"/><path d="M474,469 H398 V502" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M474,469 H498 V502" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M474,469 H598 V502" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="541.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">This layer’s</text><text x="48" y="577.0" fill="