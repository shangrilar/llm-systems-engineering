82C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">The 40-layer layout of</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">DeepSeek-V4.1-Flash</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">encoder 2 SWA + 18 CSA2 · decoder 20</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">CSA2 · KV groups differ from selection</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">groups</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(1)" data-panel="1"><text x="8" y="22" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="318"><tspan>Reuse = dashed box</tspan></text><rect x="8" y="40" width="42" height="34" rx="6" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="29" y="63" fill="#657789" font-size="16" font-weight="600" text-anchor="middle" data-max-width="38">S</text><text x="60" y="64" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-width="110"><tspan>SWA only</tspan></text><rect x="8" y="88" width="42" height="34" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="29" y="111" fill="#287D78" font-size="16" font-weight="600" text-anchor="middle" data-max-width="38">F</text><text x="60" y="112" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-width="110"><tspan>Full</tspan></text><rect x="8" y="136" width="42" height="34" rx="6" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/><text x="29" y="159" fill="#B34242" font-size="16" font-weight="600" text-anchor="middle" data-max-width="38">Ri</text><text x="60" y="160" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-widt