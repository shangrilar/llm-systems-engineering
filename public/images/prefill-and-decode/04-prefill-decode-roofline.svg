<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1173" viewBox="0 0 1200 1173" role="img" aria-labelledby="title desc"><title id="title">처리 토큰 수가 선형 연산의 병목을 바꿉니다</title><desc id="desc">Roofline의 기울어진 대역폭 상한 아래는 memory-bound, 수평 연산 성능 상한 아래는 compute-bound 영역입니다. 작은 배치 Decode의 적은 새 토큰과 충분한 입력 Prefill의 많은 토큰을 각각 낮은 산술 강도와 높은 산술 강도의 예로 표시합니다.</desc><metadata>{&quot;id&quot;:&quot;04-prefill-decode-roofline&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">처리 토큰 수가 선형 연산의 병목을 바꿉니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">가중치를 사용하는 선형 연산에 Roofline을 적용합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">연산 처리량</text><path d="M145,765 L145,265" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M145,765 L1145,765" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M145,765 L705,355" fill="none" stroke="#2470BB" stroke-width="6"/><path d="M705,355 H1110" fill="none" stroke="#B55B22" stroke-width="6"/><path d="M145,355 H705 V765" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="460" y="306" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">대역폭 × 산술 강도</text><text x="920" y="306" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 연산 성능 상한</text><circle cx="330" cy="629.5535714285714" r="10" fill="white" stroke="#182C40" stroke-width="3"/><circle cx="955" cy="355" r="10" fill="white" stroke="#182C40" stroke-width="3"/><text x="190" y="466" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">작은 배치의 Decode</text><text x="190" y="505" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">적은 새 입력 토큰</text><path d="M330,526 L330,589" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="810" y="448" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">충분한 입력의 Prefill</text><text x="810" y="488" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">많은 입력 토큰</text><path d="M955,418 L955,374" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="330" y="817" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">낮음</text><text x="955" y="817" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">높음</text><text x="665" y="867" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">산술 강도 · FLOP/byte</text><text x="350" y="708" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Memory-bound</text><text x="917" y="708" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">Compute-bound</text><path d="M226,929 L1080,929" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="654" y="975" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">처리 토큰 수 ↑ → 가중치 재사용 ↑ → 산술 강도 ↑</text><text x="48" y="1044" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">선은 처리량의 상한 · 위치는 실행 조건의 예시이며 실측값이 아닙니다.</text></g></g><path d="M48,1095 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1133" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">작은 배치의 Decode는 낮은 산술 강도, 입력이 충분한 Prefill은 높은 산술 강도의 예입니다.</text></svg>