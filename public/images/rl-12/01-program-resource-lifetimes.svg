<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1333" viewBox="0 0 1200 1333" role="img" aria-labelledby="title desc"><title id="title">모델 호출이 끝나도 에이전트 작업은 계속된다</title><desc id="desc">프로그램 P가 Reasoning,Acting,Reasoning,Acting을 순서대로 거친다. GPU 계산은 Reasoning에서, 도구 실행은 Acting에서 진행된다. 이 예에서 KV와 도구 환경은 호출 사이에도 유지되고 끝에서 회수된다.</desc><metadata>{&quot;id&quot;:&quot;12-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1#S4&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">모델 호출이 끝나도 에이전트 작업은 계속된다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 코딩 프로그램 P가 작성·테스트·수정·재시험을 이어 갑니다. 도구를 기다리는 동안 연산과 메모리의</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">수명은 다릅니다.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(0.9857142857142858)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1120">Program P · 호출을 잇는 하나의 작업</text><path d="M0 68 L1120 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="118" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="1088">실행 순서 →</text><rect x="192" y="149" width="224" height="78" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="304" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">작성</text><text x="304" y="212" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">R</text><rect x="420" y="149" width="224" height="78" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="532" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">시험</text><text x="532" y="212" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">A</text><rect x="648" y="149" width="224" height="78" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="760" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">수정</text><text x="760" y="212" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">R</text><rect x="876" y="149" width="224" height="78" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="988" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="220">재시험</text><text x="988" y="212" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle" data-max-width="220">A</text><text x="16" y="300" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">GPU 연산</text><path d="M190 336 L1102 336" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="416" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">KV 보유</text><path d="M190 452 L1102 452" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="532" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">도구 환경</text><path d="M190 568 L1102 568" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="648" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="160">도구 실행</text><path d="M190 684 L1102 684" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="195" y="275" width="218" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="304" y="307" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">계산</text><rect x="195" y="624" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="304" y="656" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="423" y="275" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="532" y="307" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="423" y="624" width="218" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="532" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">실행</text><rect x="651" y="275" width="218" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="760" y="307" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">계산</text><rect x="651" y="624" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="760" y="656" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="879" y="275" width="218" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="988" y="307" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">—</text><rect x="879" y="624" width="218" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="988" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="206">실행</text><rect x="195" y="391" width="902" height="49" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="646" y="422" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle" data-max-width="888">KV 유지 · 이 예의 선택</text><rect x="195" y="507" width="902" height="49" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="646" y="538" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle" data-max-width="888">파일·실행 환경 유지</text><text x="16" y="741" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="1088">R: Reasoning · 모델 생성 | A: Acting · 도구 실행</text><g data-container="true"><rect x="16" y="815" width="1088" height="108" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="846" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="1056">작업 종료 → 자원 회수</text><text x="32" y="886" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="1056">호출 종료와 프로그램 종료는 다릅니다.</text></g><text x="16" y="976" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="1088">별도 축: 스케줄 상태 Active / Paused / Terminated</text></g></svg>