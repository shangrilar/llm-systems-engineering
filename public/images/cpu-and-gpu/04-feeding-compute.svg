<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">연산 장치가 일하려면 데이터가 필요합니다</title><desc id="desc">같은 네 연산 장치를 비교한다. 데이터 공급이 충분한 쪽은 모두 계산하고 공급이 부족한 쪽은 하나만 계산하고 셋은 기다린다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="950" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">연산 장치가 일하려면 데이터가 필요합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 연산 장치도 데이터 공급에 따라 일하거나 기다립니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="208" width="528" height="624" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="255" fill="#182C40" font-size="27" font-weight="600" text-anchor=