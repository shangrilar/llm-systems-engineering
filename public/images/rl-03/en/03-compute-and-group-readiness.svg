<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1064" viewBox="0 0 1200 1064" role="img" aria-labelledby="title desc"><title id="title">Which responses must finish first?</title><desc id="desc">A group baseline waits for the fourth response to P even after three finish. Single-rollout collection puts completed experience from P₁,P₂,P₃ in a buffer while P₄ keeps running. Batching and updating are later steps.</desc><metadata>{&quot;id&quot;:&quot;3-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SAO §3.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.07508v1#S3.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Which responses must finish first?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">A snapshot compares the outcomes needed for a prompt group with individual rollout collection.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Group: four responses to the same P</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="113" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">Same prompt P</text><rect x="16" y="150" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="182" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">Response 1</text><path d="M188 175 L218 175" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="150" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="182" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Done · reward ready</text><path d="M496 175 L514 175" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="227" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="259" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">Response 2</text><path d="M188 252 L218 252" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="227" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="259" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Done · reward ready</text><path d="M496 252 L514 252" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="304" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="336" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">Response 3</text><path d="M188 329 L218 329" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="304" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="336" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Done · reward ready</text><path d="M496 329 L514 329" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="381" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">Response 4</text><path d="M188 406 L218 406" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="230" y="381" width="266" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="363" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Running · no reward</text><path d="M514 175 V445 H260 V472" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="486" width="488" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="517" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Group baseline waits</text><text x="32" y="557" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Response 4’s reward is still needed</text></g><path d="M260 623 L260 662" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><g data-container="true"><rect x="16" y="676" width="488" height="106" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="707" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Batch and learn when the group is ready</text><text x="32" y="747" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Other groups can keep progressing</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Single-rollout: one response per prompt</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="113" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">Different prompts P₁…P₄</text><rect x="16" y="150" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="182" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₁</text><path d="M188 175 L218 175" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="150" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="182" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Done · reward ready</text><path d="M496 175 L514 175" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="227" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="259" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₂</text><path d="M188 252 L218 252" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="227" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="259" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Done · reward ready</text><path d="M496 252 L514 252" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="304" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="336" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₃</text><path d="M188 329 L218 329" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="304" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="336" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Done · reward ready</text><path d="M496 329 L514 329" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="381" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₄</text><path d="M188 406 L218 406" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="230" y="381" width="266" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="363" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">Running · no reward</text><path d="M514 175 V445 H260 V472" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="486" width="488" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="517" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Ready buffer: three completed runs</text><text x="32" y="557" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">No need to wait for P₄</text></g><path d="M260 623 L260 662" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="676" width="488" height="106" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="707" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Batch → compute A → update</text><text x="32" y="747" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Required scoring and value work still apply</text></g></g></svg>