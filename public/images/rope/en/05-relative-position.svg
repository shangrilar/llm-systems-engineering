<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc">
<title id="title">Rotate by absolute position, compare by relative position</title><desc id="desc">Rotate the same q=[1,0] and k=[1,1] at positions 0/1 and 1/2. Both have position difference 1, angle 75 degrees and dot product approximately 0.366.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1270" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 5</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Rotate by absolute position, compare by relative position</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Rotation rate for one component pair: 30° per position</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="205" width="1104" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="244" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Head 1 · one component pair · fix q = [1, 0] and k = [1, 1] before rotation</text><rect x="58" y="305" width="516" height="624" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="352" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Q position 0 · K position 1</text><path d="M146,573 L486,573" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M316,403 L316,743" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="316" cy="573" r="170" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M316,573 L424.0,573.0" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M316,573 L355.5307436087194,425.4692563912806" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><path d="M381.0,573.0 A65,65 0 0 0 332.82323793166387,510.21482129121057" fill="none" stroke="#8191A0" stroke-width="2" marker-end="url(#arrow-arrow)"/><text x="407.23563413349206" y="510.9924356639971" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">75°</text><text x="236" y="392" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Q′</text><text x="396" y="392" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">K′</text><text x="316" y="803" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">Q rotates 0° · K rotates 30°</text><text x="316" y="854" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Position difference = 1</text><text x="316" y="900" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Dot product ≈ 0.366</text><rect x="626" y="305" width="516" height="624" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="352" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Q position 1 · K position 2</text><path d="M714,573 L1054,573" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M884,403 L884,743" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="884" cy="573" r="170" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M884,573 L977.5307436087194,519.0" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M884,573 L844.4692563912806,425.4692563912806" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><path d="M940.2916512459885,540.5 A65,65 0 0 0 867.1767620683362,510.21482129121057" fill="none" stroke="#8191A0" stroke-width="2" marker-end="url(#arrow-arrow)"/><text x="928.0085947219853" y="474.75385376120204" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">75°</text><text x="804" y="392" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Q′</text><text x="964" y="392" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">K′</text><text x="884" y="803" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">Q rotates 30° · K rotates 60°</text><text x="884" y="854" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Position difference = 1</text><text x="884" y="900" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Dot product ≈ 0.366</text><text x="600" y="986" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">Rotating both vectors by another 30° preserves their angle and dot product.</text><rect x="48" y="1034" width="1104" height="120" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1081" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Each vector rotates according to its own position.</text><text x="600" y="1124" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Their comparison reflects the position difference: K position − Q position.</text><path d="M48,1190 L1152,1190" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1231" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Angles are illustrative, not a real model’s frequency settings.</text>
</svg>