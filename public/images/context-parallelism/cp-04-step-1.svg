"/><text x="301.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="277" y="414" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="301.5" y="447.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="277" y="463" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="301.5" y="496.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="277" y="512" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="301.5" y="545.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><text x="267" y="399.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="267" y="448.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="267" y="497.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="267" y="546.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="460.5" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">V</text><rect x="436" y="365" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="460.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="436" y="414" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="460.5" y="447.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="436" y="463" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="460.5" y="496.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="436" y="512" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="460.5" y="545.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0