<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1269" viewBox="0 0 1200 1269" role="img" aria-labelledby="title desc"><title id="title">송수신 버퍼는 언제 다시 써도 될까?</title><desc id="desc">공통 시간축에서 GPU 0 송신 버퍼는 A의 값 작성과 송신의 읽기가 끝나면 다음 값으로 덮어쓸 수 있다. GPU 1 수신 버퍼는 수신이 값을 쓰고 B가 그 값을 읽는 동안 유지해야 하며 B 완료 뒤 재사용할 수 있다. GPU 0 송신 완료 뒤에도 GPU 1의 B가 진행 중일 수 있다. B는 수신 버퍼 x를 읽고 별도 y에 [2,4,6,8]을 출력한다. 표시한 완료는 CPU API 반환이 아닌 GPU 작업 완료다.</desc><metadata>{&quot;id&quot;:&quot;04-buffer-reuse&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">송수신 버퍼는 언제 다시 써도 될까?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">통신이 끝난 시점과 받은 데이터를 사용하는 계산이 끝난 시점은 다릅니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><text x="48" y="225" fill="#182C40" font-size="26" font-weight="600" text-anchor="start">각 버퍼를 마지막으로 사용하는 작업이 끝난 뒤 다음 값을 씁니다.</text><path d="M250,292 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1148" y="277" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="409" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0</text><text x="48" y="447" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">송신 버퍼</text><rect x="250" y="372" width="200" height="104" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350" y="418" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">계산 A</text><text x="350" y="453" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">값 작성</text><rect x="450" y="372" width="210" height="104" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="555" y="418" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">송신</text><text x="555" y="453" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">값 읽기</text><rect x="660" y="372" width="480" height="104" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="900" y="433" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">다음 값으로 덮어쓰기 가능</text><path d="M660,332 V361" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="660" y="320" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">송신 완료</text><path d="M250,499 v10 H660 v-10" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="455" y="545" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">사용 중 · 재사용 불가</text><path d="M660,499 v10 H1140 v-10" fill="none" stroke="#287D78" stroke-width="2"/><text x="900" y="545" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">송신 버퍼 재사용 가능</text><text x="48" y="682" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="720" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">수신 버퍼</text><rect x="250" y="648" width="200" height="104" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="350" y="694" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">수신에서</text><text x="350" y="729" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle">대기</text><rect x="450" y="648" width="230" height="104" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="565" y="694" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">수신</text><text x="565" y="729" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">값 쓰기</text><rect x="680" y="648" width="240" height="104" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="800" y="694" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">계산 B</text><text x="800" y="729" fill="#287D78" font-size="25" font-weight="400" text-anchor="middle">수신값 읽기</text><rect x="920" y="648" width="220" height="104" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1030" y="694" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">다음 값으로</text><text x="1030" y="729" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">덮어쓰기 가능</text><path d="M680,608 V637" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="680" y="596" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">수신 완료</text><path d="M920,608 V637" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="920" y="596" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">B 완료</text><path d="M250,776 v10 H920 v-10" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="585" y="822" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">수신과 계산 B가 사용 중 · 재사용 불가</text><path d="M920,776 v10 H1140 v-10" fill="none" stroke="#287D78" stroke-width="2"/><text x="1030" y="822" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">재사용 가능</text><rect x="48" y="875" width="1104" height="118" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="920" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">B는 수신 버퍼를 읽고, 별도 결과 버퍼 y에 씁니다.</text><text x="600" y="963" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">x = [1, 2, 3, 4]  →  B: 두 배로 계산  →  y = [2, 4, 6, 8]</text><rect x="48" y="1035" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1080" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">송신이 끝나도 상대 GPU의 계산 B는 진행 중일 수 있습니다.</text><text x="600" y="1119" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">호출 반환이 아니라, GPU에서 해당 작업이 끝난 시점을 봅니다.</text></g></g><path d="M48,1191 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1229" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">송신 버퍼는 송신 완료 뒤, 수신 버퍼는 B가 값을 모두 읽은 뒤 다시 쓸 수 있습니다.</text></svg>