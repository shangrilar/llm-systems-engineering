<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1901" viewBox="0 0 360 1901" role="img" aria-labelledby="title desc"><title id="title">Combine information across positions for each component</title><desc id="desc">Input H=[[1,0],[0,1]] is projected with content matrix Wᵤ=[[2,0],[0,4]] and score matrix Wₛ=[[ln3,0],[0,ln3]]. Content U=[[2,0],[0,4]] and scores S=[[ln3,0],[0,ln3]] result. Column-wise softmax over positions gives weights A=[[.75,.25],[.25,.75]]. Multiply U and A elementwise and sum across positions to form c₀=[1.5,3]. All numbers and projection matrices are illustrative.</desc><metadata>{&quot;id&quot;:&quot;ma-06-02&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 §2.3, component-wise compression weights and row-axis softmax&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2606.19348v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" marke