<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">여러 응답이 공통 KV를 공유하기</title><desc id="desc">위쪽은 두 응답이 같은 프롬프트 p0부터 p5까지의 KV를 각자 복사하여 물리 블록 네 개를 쓰는 장면이다. 아래쪽은 두 개의 별도 블록 테이블이 같은 P0와 P1을 가리켜 물리 블록 두 개만 쓰는 장면이다. P0에는 p0부터 p3, P1에는 p4와 p5가 있고 마지막 두 칸은 비어 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1010" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">여러 응답이 공통 KV를 공유하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">같은 입력 6토큰에서 응답 2개를 만듭니다. 블록 하나에는 4위치의 KV가 들어갑니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="210.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">응답마다 KV 복사</text><text x="1152" y="210.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="end">물리 블록 4개</text><rect x="48" y="237" width="1104" height="316" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="273.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">블록 테이블</text><rect x="76" y="293" width="172" height="156" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="162.0" y="326.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">응답 1</text><path d="M90,342 H234" stroke="#DCE4EC"/><text x="162.0" y="376.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L0 → P0</text><text x="162.0" y="425.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L1 → P1</text><text x="352" y="330.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P0</text><rect x="352" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="374.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><rect x="400" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="422.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><rect x="448" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="470.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><rect x="496" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="518.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><text x="352" y="436.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P1</text><rect x="352" y="452" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="374.0" y="483.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p4</text><rect x="400" y="452" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="422.0" y="483.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p5</text><rect x="448" y="452" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="496" y="452" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><path d="M256,370 L330.0,370.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M340,370 L330.0,374.5 L330.0,365.5 Z" fill="#526577"/><path d="M256,419 H302 V476" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M302,476 L330.0,476.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M340,476 L330.0,480.5 L330.0,471.5 Z" fill="#526577"/><text x="652" y="273.0" fill="#526577" f