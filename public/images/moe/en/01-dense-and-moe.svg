eight="400" text-anchor="middle">d → d</text><path d="M888,640 V715 H947 V750" fill="none" stroke="#2470BB" stroke-width="2.3" marker-end="url(#blue-arrow)"/><path d="M947,895 V985 H888 V1005" fill="none" stroke="#2470BB" stroke-width="2.3" marker-end="url(#blue-arrow)"/><rect x="1016" y="760" width="108" height="125" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1070" y="807" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">E4</text><text x="1070" y="849" fill="#728190" font-size="21" font-weight="400" text-anchor="middle">d → d</text><text x="720" y="940" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start">× 0.27</text><text x="966" y="940" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start">× 0.73</text><rect x="718.0" y="1020" width="340" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="1052" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Weighted sum</text><text x="888" y="1080" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Add the two weighted results</text><path d="M888,1108 L888,1133" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="806" y="1145" width="165" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.5" y="1169" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">y₁</text><text x="888.5" y="1190" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d dimensions</text><rect x="48" y="1290" width="1104" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1336" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">With one MLP or selected experts, both input and output have d components.</text><path d="M48,1410 L1152,1410" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1451" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Example: Top-2 of four experts. E1–E4 are gated MLPs with different weights.</text>
</svg>