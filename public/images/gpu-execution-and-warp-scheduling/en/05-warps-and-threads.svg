ill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" /><rect x="640" y="789" width="246" height="190" rx="12" fill="#FFFFFF" stroke="#B55B22" stroke-width="1.5" /><text x="763" y="832" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">Thread 2</text><text x="763" y="888" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">3 + 30</text><text x="763" y="943" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">= 33</text><path d="M1045,742 L1045,774" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" /><rect x="922" y="789" width="246" height="190" rx="12" fill="#FFFFFF" stroke="#B55B22" stroke-width="1.5" /><text x="1045" y="832" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">Thread 3</text><text x="1045" y="888" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">4 + 40</text><text x="1045" y="943" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">= 44</text><text x="600" y="1042" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">A warp is an execution unit grouping 32 threads from the same block.</text><text x="600" y="1090" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">This does not mean all 32 operations finish in one cycle.</text></svg>