<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2079" viewBox="0 0 360 2079" role="img" aria-labelledby="title desc"><title id="title">The same prediction loss can train different modules</title><desc id="desc">Both configurations predict the next target token from an image, a question and previous target tokens. Left: pretrained vision encoder and LLM weights are fixed; only the projector updates. The fixed LLM still computes gradients to its inputs for the projector. Right: the vision encoder, projector and LLM update jointly. Joint training and training from scratch are separate choices.</desc><metadata>{&quot;id&quot;:&quot;ma-22-05&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;LLaVA&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2304.08485&quot;},{&quot;label&quot;:&quot;Kimi K3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.24653v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 5 · Vision</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">The same prediction loss</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">can train different</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">modules</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Connector-only / joint training · Two</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">configurations, not mandatory stages</text><path d="M16,211 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 235) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Update only the connector</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="50" y="110" width="300" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="200" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">Image</text><path d="M200 180 L200 220" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="230" width="390" height="125" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="261" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Vision encoder</text><text x="36" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Fixed weights</text></g><path d="M195 370 L195 455" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="475" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="506" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Projector</text><text x="36" y="546" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Update weights</text></g><path d="M195 615 L195 700" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="720" width="390" height="125" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="751" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">LLM + LM head</text><text x="36" y="791" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Fixed weights</text></g><text x="225" y="645" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="275">Also input: question + prior</text><text x="225" y="670.2" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="275">targets</text><path d="M195 865 L195 910" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="920" width="390" height="175" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="951" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Next-token prediction loss</text><text x="36" y="991" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Compare scores with the target</text><text x="36" y="1019" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">The current target is not visible as</text><text x="36" y="1047" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">input</text></g><path d="M420 1000 H490 V840 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><path d="M420 750 H455 V555 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><text x="260" y="1130" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle" data-max-width="500">Solid: forward · Dashed: gradient</text><g data-container="true"><rect x="20" y="1170" width="480" height="190" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1201" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Fixed ≠ blocked input gradients</text><text x="36" y="1241" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">LLM weights stay fixed, but input</text><text x="36" y="1269" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">derivatives reach the projector</text></g></g><g transform="translate(16 1158.6923076923076) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Train all modules jointly</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="50" y="110" width="300" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="200" y="148" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">Image</text><path d="M200 180 L200 220" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="230" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="261" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Vision encoder</text><text x="36" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Update weights</text></g><path d="M195 370 L195 455" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="475" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="506" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Projector</text><text x="36" y="546" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Update weights</text></g><path d="M195 615 L195 700" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="720" width="390" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="751" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">LLM + LM head</text><text x="36" y="791" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Update weights</text></g><text x="225" y="645" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="275">Also input: question + prior</text><text x="225" y="670.2" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="275">targets</text><path d="M195 865 L195 910" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="920" width="390" height="175" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="951" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Next-token prediction loss</text><text x="36" y="991" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">Compare scores with the target</text><text x="36" y="1019" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">The current target is not visible as</text><text x="36" y="1047" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="358">input</text></g><path d="M420 1000 H490 V840 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><path d="M420 750 H455 V555 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><path d="M420 505 H455 V305 H420" stroke="#B55B22" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-orange)"/><text x="260" y="1130" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle" data-max-width="500">Solid: forward · Dashed: gradient</text><g data-container="true"><rect x="20" y="1170" width="480" height="190" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1201" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Joint training ≠ necessarily from</text><text x="36" y="1231.8" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">scratch</text><text x="36" y="1272" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Pretrained initialization and update scope</text><text x="36" y="1300" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">are separate choices</text></g></g></svg>