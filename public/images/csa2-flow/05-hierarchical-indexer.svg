<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="852" viewBox="0 0 1200 852" role="img" aria-labelledby="title desc"><title id="title">계층형 sparse indexer</title><desc id="desc">계층형 sparse indexer는 decoder에서만 쓰인다. 한 query에 대해 첫 Full 층이 인과적으로 볼 수 있는 모든 main KV 위치를 점수 매기고 자기 top-k를 고르며, 블록별 최댓값이 큰 블록들을 골라 후보 pool을 만든다. 뒤의 Reindex 층은 pool 안의 위치만 점수 매겨 자기 top-k를 고르고, Reuse 층은 점수를 매기지 않고 최근의 선택을 그대로 쓴다. 후보 pool은 최종 top-k보다 크다.</desc><metadata>{&quot;id&quot;:&quot;csa2-flow-05-hierarchical-indexer&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3 (CSA2)&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash model card and code&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 25 · CSA2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">계층형 sparse indexer</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">decoder 전용 · 첫 Full 층이 후보 pool을 만들고 뒤의 Reindex가 그 안에서만 점수를 매긴다</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="22" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="1100"><tspan>빨강 농도 = 점수(교육용) · 청록 테두리 = 최종 top-3 · 파란 상자 = 고른 블록 · 점선 회색 = 점수 안 매김</tspan></text><text x="0" y="48" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="1100"><tspan>예시: 한 query가 볼 수 있는 32위치 · 블록당 위치·선택 블록·최종 선택: 예시 4·3·3 / 실제 8·최대 2,048·512</tspan></text><text x="0" y="106" fill="#182C40" font-size="22" font-weight="700" text-anchor="start" data-max-width="1104"><tspan>① 첫 Full 층 · 전체를 점수 매김</tspan></text><text x="0" y="132" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="1104"><tspan>자기 top-3 + 블록 최댓값으로 후보 블록</tspan></text><rect x="0" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.34" stroke="#B34242" stroke-opacity=".35"/><rect x="33" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.10" stroke="#B34242" stroke-opacity=".35"/><rect x="66" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.44" stroke="#B34242" stroke-opacity=".35"/><rect x="99" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.19" stroke="#B34242" stroke-opacity=".35"/><rect x="132" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.53" stroke="#B34242" stroke-opacity=".35"/><rect x="165" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.28" stroke="#B34242" stroke-opacity=".35"/><rect x="198" y="164" width="30" height="30" rx="4" fill="#B34242" fill-opacity="0.62" stroke="#B34242" stroke-opacity=".35"/><rect x="196.5" y="162.5" width="33" height="33" rx="5" fill="none" stroke="#287D78" stroke-width="1.5"/><rect x="231" y="164" width="30" height="30" rx="4" fi