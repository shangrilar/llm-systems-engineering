<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1268" viewBox="0 0 1200 1268" role="img" aria-labelledby="title desc"><title id="title">Are larger tiles always better?</title><desc id="desc">A small output tile uses an input for fewer outputs; a large tile uses it for more. Larger block tiles can increase shared memory input storage, and larger thread tiles can increase register storage for inputs and partial sums. Limited SM resources mean more resources per block may reduce resident blocks and warps. Four versus two blocks is a conceptual resource comparison, not a calculated residency for particular tile sizes. Shared memory and registers have separate resource limits. Higher residency is not always faster; matrix shape and workload also affect tile choice.</desc><metadata>{&quot;id&quot;:&quot;04-tile-resource-tradeoff&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Are larger tiles always better?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Consider both data reuse and shared memory and register usage.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="600" y="219" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">More reuse requires keeping more inputs and partial sums nearby.</text><rect x="48" y="254" width="536" height="791" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="303" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">Small tile</text><rect x="266" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="316" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="266" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="316" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="578" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Fewer outputs per input</text><text x="316" y="624" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Fewer inputs and partial sums to keep</text><path d="M316,649 L316,687" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="76" y="710" width="480" height="223" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="753" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Limited resources per SM</text><text x="316" y="790" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Shared memory · Registers</text><rect x="95" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="145.5" y="865" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Block</text><rect x="206" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="256.5" y="865" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Block</text><rect x="317" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="367.5" y="865" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Block</text><rect x="428" y="819" width="101" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="478.5" y="865" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Block</text><text x="316" y="980" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Fewer resources per block</text><text x="316" y="1015" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">leave room for more resident blocks</text><rect x="616" y="254" width="536" height="791" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="303" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">Large tile</text><rect x="784" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="336" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="784" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="386" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="784" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="436" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="784" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="834" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="884" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="934" y="486" width="47" height="47" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="884" y="578" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">More outputs per input</text><text x="884" y="624" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">More inputs and partial sums to keep</text><path d="M884,649 L884,687" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="644" y="710" width="480" height="223" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="753" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Limited resources per SM</text><text x="884" y="790" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Shared memory · Registers</text><rect x="663" y="819" width="212" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="769" y="865" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Block</text><rect x="885" y="819" width="212" height="76" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="991" y="865" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Block</text><text x="884" y="980" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">More resources per block</text><text x="884" y="1015" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">may reduce resident blocks and warps</text><text x="600" y="1107" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Balance input reuse with the amount of concurrent work.</text></g></g><path d="M48,1160 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1198" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The block drawings compare resource occupancy conceptually; they are not actual residency counts for a</text><text x="48" y="1227.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">specific tile size.</text></svg>