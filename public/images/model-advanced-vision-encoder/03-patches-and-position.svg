<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1709" viewBox="0 0 1200 1709" role="img" aria-labelledby="title desc"><title id="title">펼친 벡터에 원래 위치 정보를 함께 전달합니다</title><desc id="desc">2×2 patch 지도에서 A(0,0),B(0,1),C(1,0),D(1,1)를 행 우선 index 0,1,2,3에 대응시킨다. e_A[4]+p0[4]=u_A[4]와 같은 덧셈을 네 patch에 적용한다. 표시 순서를 A,C,B,D로 바꾼 예시에도 위치 대응은 p0,p2,p1,p3으로 유지된다. 좌표는 독자용 주석이며 원래 ViT는 학습된 1D position embedding을 쓴다.</desc><metadata>{&quot;id&quot;:&quot;ma-21-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Vision Transformer §3.1, Eq. 1 and 1D position embeddings&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2010.11929v2#S3.SS1&quot;},{&quot;label&quot;:&quot;Rotary Position Embedding for Vision Transformer&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2403.13298&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fil