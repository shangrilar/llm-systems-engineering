ont-weight="700" text-anchor="middle">t2·t3의 h0 → GPU 0</text><rect x="193" y="864" width="814" height="44" rx="10" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><text x="600" y="893" font-size="20" fill="#7954A3" font-weight="700" text-anchor="middle">All-to-All: h0 데이터는 GPU 0으로, h1 데이터는 GPU 1로</text><text x="600" y="949" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">Q·K·V 모두 재배치: 각 GPU는 자기 헤드의 전체 문맥을 갖습니다.</text><text x="600" y="1025" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">예: 토큰 4개 · 헤드 2개 · GPU 2개 / 기본 멀티헤드 어텐션</text></g></g><path d="M48,1166.2 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1204.2" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">순전파에서는 어텐션 앞뒤로 All-to-All이 한 번씩, 모두 두 번 필요합니다.</text></svg>