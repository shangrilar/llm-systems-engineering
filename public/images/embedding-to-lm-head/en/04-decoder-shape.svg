<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Same dimensions, different vector values</title><desc id="desc">Three four-dimensional token vectors enter a single decoder block with hidden internals. The output still has three rows and four columns, but the values change. Rows do not enter separate blocks; the figure does not imply independent processing of each token.</desc>
