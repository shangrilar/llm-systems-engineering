<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1179" viewBox="0 0 1200 1179" role="img" aria-labelledby="title desc"><title id="title">KV cache: what is stored and what is read</title><desc id="desc">Two graphs compare a hypothetical MHA, V2, V3.2, V4-Flash and V4.1-Flash. Left: KV cache added per token in a long context, from 3,932,160 B to 890 B. Right: bytes read across all layers to generate one token in a 131,072-token context, from 515 GB to 35.0 MB, with search keys dominating from V3.2 on. The graphs use different units and scales.</desc><metadata>{&quot;id&quot;:&quot;deepseek-kv-cache-00-kv-per-token&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V2 report · §2.1, Table 1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2405.04434&quot;},{&quot;label&quot;:&quot;FlashMLA FP8 KV cache (V3.2)&quot;,&quot;url&quot;:&quot;https://github.com/deepseek-ai/FlashMLA/blob/ba89a3466e9470ad08ab39738d4e7bb66989e1e7/README.md#fp8-kv-cache&quot;},{&quot;label&quot;:&quot;SGLang DeepSeek-V4 KV layout&quot;,&quot;url&quot;:&quot;https://github.com/sgl-project/sglang/blob/main/python/sglang/kernels/ops/attention/dsv4/kv_layout.py&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3, §2.4.4&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.19969&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><ma