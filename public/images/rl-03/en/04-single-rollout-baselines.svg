<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1213" viewBox="0 0 1200 1213" role="img" aria-labelledby="title desc"><title id="title">Single-rollout learning can use different baselines</title><desc id="desc">Completed rollouts for distinct P₁,P₂,P₃ have rewards 1,1,0. SAO combines context-specific critic predictions and rewards through GAE for token advantages. FlashREINFORCE subtracts the batch mean 2/3, sharing 1/3,1/3,−2/3 across each response’s generated tokens. Both feed A into policy losses.</desc><metadata>{&quot;id&quot;:&quot;3-4&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SAO §3.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.07508v1#S3.SS2&quot;},{&quot;label&quot;:&quot;FlashREINFORCE — One-Batch REINFORCE&quot;,&quot;url&quot;:&quot;https://github.com/yifanzhang-pro/FlashREINFORCE#1-one-batch-reinforce&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Single-rollout learning can use different baselines</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">From the same completed experience, SAO uses context values; FlashREINFORCE uses the batch</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">reward mean.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">SAO: context-specific critic predictions</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="111" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">Three completed rollouts · different prompts</text><rect x="16" y="146" width="153" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="92.5" y="178" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="141">P₁: R = 1</text><rect x="183" y="146" width="153" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="259.5" y="178" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="141">P₂: R = 1</text><rect x="350" y="146" width="153" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="426.5" y="178" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="141">P₃: R = 0</text><path d="M260 207 V222 H128 V233" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="16" y="247" width="225" height="106" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="278" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">Token context</text><text x="32" y="318" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">Pᵢ + prior tokens</text></g><path d="M128 364 L128 392" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="16" y="405" width="225" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="128.5" y="437" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="213">Critic → V(sₜ)</text><path d="M260 207 H390 V476" stroke="#B55B22" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/><path d="M128 466 L128 476" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="490" width="488" height="93" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="521" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Rewards + V → GAE → token advantages</text></g><path d="M260 594 L260 620" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="16" y="666" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="60">P₁</text><rect x="94" y="636" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="154" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₁₁</text><rect x="232" y="636" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="292" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₁₂</text><rect x="370" y="636" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="430" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₁₃</text><text x="16" y="725" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="60">P₂</text><rect x="94" y="695" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="154" y="727" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₂₁</text><rect x="232" y="695" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="292" y="727" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₂₂</text><rect x="370" y="695" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="430" y="727" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₂₃</text><text x="16" y="784" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="60">P₃</text><rect x="94" y="754" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="154" y="786" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₃₁</text><rect x="232" y="754" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="292" y="786" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₃₂</text><rect x="370" y="754" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="430" y="786" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">A₃₃</text><text x="94" y="827" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start" data-max-width="410">Each cell has its token’s A</text><g data-container="true"><rect x="16" y="854" width="488" height="62" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="885" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">A → each token’s policy loss</text></g></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">FlashREINFORCE: batch mean</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="111" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">Three completed rollouts · different prompts</text><rect x="16" y="146" width="153" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="92.5" y="178" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="141">P₁: R = 1</text><rect x="183" y="146" width="153" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="259.5" y="178" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="141">P₂: R = 1</text><rect x="350" y="146" width="153" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="426.5" y="178" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="141">P₃: R = 0</text><path d="M260 207 L260 232" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="247" width="488" height="106" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="278" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Batch mean = (1 + 1 + 0) / 3</text><text x="32" y="318" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Baseline for this batch: 2/3</text></g><path d="M260 364 L260 391" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="405" width="488" height="178" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="436" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Subtract the mean from each R</text><text x="32" y="476" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">P₁: 1 − 2/3 = +1/3</text><text x="32" y="504" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">P₂: 1 − 2/3 = +1/3</text><text x="32" y="532" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">P₃: 0 − 2/3 = −2/3</text></g><path d="M260 594 L260 620" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="16" y="666" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="60">P₁</text><rect x="94" y="636" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="154" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">+1/3</text><rect x="232" y="636" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="292" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">+1/3</text><rect x="370" y="636" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="430" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">+1/3</text><text x="16" y="725" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="60">P₂</text><rect x="94" y="695" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="154" y="727" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">+1/3</text><rect x="232" y="695" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="292" y="727" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">+1/3</text><rect x="370" y="695" width="120" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="430" y="727" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">+1/3</text><text x="16" y="784" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="60">P₃</text><rect x="94" y="754" width="120" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="154" y="786" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">−2/3</text><rect x="232" y="754" width="120" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="292" y="786" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">−2/3</text><rect x="370" y="754" width="120" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="430" y="786" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">−2/3</text><text x="94" y="827" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start" data-max-width="410">Shared within each response</text><g data-container="true"><rect x="16" y="854" width="488" height="62" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="885" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">A → each token’s policy loss</text></g></g></svg>