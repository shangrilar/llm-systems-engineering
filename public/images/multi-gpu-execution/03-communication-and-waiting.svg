<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1234" viewBox="0 0 1200 1234" role="img" aria-labelledby="title desc"><title id="title">GPU가 늘어도 속도가 비례하지는 않습니다</title><desc id="desc">같은 작업을 한 GPU에서는 100ms에 처리한다. 균등 분할은 GPU별 계산 50ms 후 통신과 취합 10ms로 60ms에 완료한다. 불균형 분할은 GPU 0이 30ms 계산 후 40ms 기다리고 GPU 1이 70ms 계산한 뒤, 10ms 통신과 취합으로 80ms에 완료한다. 시간 축은 같으며 대기 40ms를 전체에 다시 더하지 않는다. 설명용이며 계산과 통신은 겹치지 않는다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1234" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 12 · 그림 3</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">GPU가 늘어도 속도가 비례하지는 않습니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">한 GPU의 시간 축을 여러 GPU의 실행과 통신·대기로 확장합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="198" width="22" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="82" y="216" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">연산</text><rect x="239" y="198" width="22" height="22" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="273" y="216" fill="#7954A3" font-size="21" font-weight="400" text-anchor="start">통신·취합</text><rect x="555" y="198" width="22" height="22" rx="3" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="589" y="216" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">대기</text><text x="1152" y="216" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end">동일한 작업 · 단위: ms</text><text x="281" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">0</text><path d="M281,320 V385 M281,477 V627 M281,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="421" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">20</text><path d="M421,320 V385 M421,477 V627 M421,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="561" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">40</text><path d="M561,320 V385 M561,477 V627 M561,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="701" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">60</text><path d="M701,320 V385 M701,477 V627 M701,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="841" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">80</text><path d="M841,320 V385 M841,477 V627 M841,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="981" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">100</text><path d="M981,320 V385 M981,477 V627 M981,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="48" y="311" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 GPU</text><text x="48" y="363" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 0</text><rect x="281" y="331" width="700" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="631.0" y="363.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">전체 계산 100</text><text x="1010" y="363" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">100 ms</text><text x="48" y="463" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">고른 분할</text><text x="48" y="520" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 0</text><rect x="281" y="488" width="350" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="456.0" y="520.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">계산 50</text><rect x="631" y="488" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="666.0" y="520.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><text x="48" y="600" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 1</text><rect x="281" y="568" width="350" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="456.0" y="600.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">계산 50</text><rect x="631" y="568" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="666.0" y="600.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><path d="M666,541 L666,561" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="725" y="601" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">60 ms</text><text x="281" y="659" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">50 ms 계산 + 10 ms 통신·취합 = 60 ms</text><text x="48" y="765" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">불균형한 분할</text><text x="48" y="821" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 0</text><rect x="281" y="789" width="210" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="386.0" y="821.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">계산 30</text><rect x="491" y="789" width="280" height="48" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="631.0" y="821.0" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">대기 40</text><rect x="771" y="789" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="806.0" y="821.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><text x="48" y="901" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 1</text><rect x="281" y="869" width="490" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="526.0" y="901.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">계산 70</text><rect x="771" y="869" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="806.0" y="901.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><path d="M806,842 L806,862" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="865" y="901" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">80 ms</text><text x="281" y="959" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">늦게 끝나는 계산 70 ms + 통신·취합 10 ms = 80 ms</text><rect x="48" y="1049" width="1104" height="137" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1095" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">계산을 줄여도, 통신과 기다리는 시간이 추가될 수 있습니다.</text><text x="600" y="1137" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">전체 완료 시간은 GPU별 시간을 더한 값이 아니라 실행 경로로 결정됩니다.</text></svg>