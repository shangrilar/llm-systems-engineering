<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc">
<title id="title">From the whole model to a decoder block</title><desc id="desc">The model runs from token IDs through Embedding, N decoder blocks, final RMSNorm and LM Head to logits. One block is expanded around its residual stream, with RMSNorm plus Attention and RMSNorm plus MLP or MoE as two additive branches. Block states have shape T by d, and logits have shape T by Vocab size.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1520" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">From the whole model to a decoder block</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Connect Embedding and LM Head with the structure inside a block.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="248" y="239" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">Whole model</text><text x="843" y="239" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">One decoder block</text><rect x="48" y="275" width="400" height="1110" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="535" y="275" width="617" height="1110" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="108.0" y="310" width="280" height="62" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="349.0" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">Token IDs (T tokens)</text><path d="M248,385 L248,435" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="108.0" y="450" width="280" height="75" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="495.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Embedding</text><path d="M248,538 L248,602" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="280" y="581" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">T × d</text><rect x="108.0" y="615" width="280" height="130" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="645" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">Decoder block</text><text x="248" y="672" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">× N</text><path d="M400,680 H522" fill="none" stroke="#8191A0" stroke-width="2.2" stroke-dasharray="7 6"/><text x="467" y="656" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">Zoom</text><path d="M248,760 L248,890" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="280" y="837" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">T × d</text><rect x="108.0" y="905" width="280" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="935" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="248" y="962" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Final normalization</text><path d="M248,994 L248,1064" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="280" y="1036" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">T × d</text><rect x="108.0" y="1080" width="280" height="80" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="1128.0" fill="#B65B20" font-size="26" font-weight="600" text-anchor="middle">LM Head</text><path d="M248,1175 L248,1240" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="93.0" y="1255" width="310" height="85" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="1285" fill="#B65B20" font-size="26" font-weight="600" text-anchor="middle">Logits</text><text x="248" y="1312" fill="#B65B20" font-size="20" font-weight="400" text-anchor="middle">T × Vocab size</text><rect x="557.5" y="320" width="245" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="680" y="350" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Block input</text><text x="680" y="377" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">T × d</text><text x="680" y="429" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Residual stream</text><path d="M680,445 L680,458" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="680" cy="458" r="5" fill="#2470BB"/><path d="M680,458 L680,761" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M680,458 H940 V487" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="790.0" y="500" width="300" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="530" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="940" y="557" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Normalize each token</text><path d="M940,587 L940,617" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="790.0" y="630" width="300" height="75" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="660" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Attention</text><text x="940" y="687" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">Expanded in Figure 2</text><path d="M940,718 V790 H715" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><circle cx="680" cy="790" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M671,790 L689,790" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,781 L680,799" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,815 L680,850" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="680" cy="850" r="5" fill="#2470BB"/><path d="M680,850 L680,1161" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M680,850 H940 V882" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="790.0" y="895" width="300" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="925" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="940" y="952" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Normalize each token</text><path d="M940,982 L940,1012" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="790.0" y="1025" width="300" height="75" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="1055" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">MLP or MoE</text><text x="940" y="1082" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">Expanded in Figure 3</text><path d="M940,1113 V1190 H715" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><circle cx="680" cy="1190" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M671,1190 L689,1190" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,1181 L680,1199" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,1215 L680,1276" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="557.5" y="1290" width="245" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="680" y="1320" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Block output</text><text x="680" y="1347" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">T × d</text><text x="600" y="1450" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">The block preserves d dimensions and adds transformations to the residual stream.</text>
</svg>