<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="891" viewBox="0 0 1200 891" role="img" aria-labelledby="title desc"><title id="title">Fill the pipeline with multiple inputs</title><desc id="desc">A diagonal four-GPU schedule completes four microbatches in seven slots, with idle slots at the start and end.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="891" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Fill the pipeline with multiple inputs</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Equal stage times; forward pass only; communication time omitted.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="208.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">One slot = one stage computation / A–D = different microbatches</text><text x="285" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">1</text><text x="411" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">2</text><text x="537" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">3</text><text x="663" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">4</text><text x="789" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">5</text><text x="915" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">6</text><text x="1041" y="269.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">7</text><text x="48" y="332.0" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">GPU 0</text><rect x="228" y="294" width="112" height="76" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="284" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">A</text><rect x="354" y="294" width="112" height="76" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="410" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">B</text><rect x="480" y="294" width="112" height="76" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="536" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">C</text><rect x="606" y="294" width="112" height="76" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">D</text><rect x="732" y="294" width="112" height="76" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="788" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">—</text><rect x="858" y="294" width="112" height="76" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="914" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">—</text><rect x="984" y="294" width="112" height="76" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1040" y="343.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">—</text><text x="48" y="430.0" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">GPU 1</text><rect x="228" y="392" width="112" height="76" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="284" y="441.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">—</text><rect x="354" y="392" width="112" height="76" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="410" y="441.0" fill="#182C40" font-size="28" font-weight="400" text-anchor="middle">A</text><rect x="480" y