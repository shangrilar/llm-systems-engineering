<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1659" viewBox="0 0 1200 1659" role="img" aria-labelledby="title desc"><title id="title">Fewer reads do not always mean less storage</title><desc id="desc">A window-only layer retains {5,6,7} at p7 and {6,7,8} at p8, removing 5 and adding 8. A separate full-attention layer retains positions 0–8, including p5. B is a sparse layer whose selection requires original KV: it keeps all 8 positions 0–7 while q7 reads only 3 positions {0,5,7}.</desc><metadata>{&quot;id&quot;:&quot;ma-04-04&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mistral 7B §2, rolling buffer cache&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2310.06825v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4 · Read and retain</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Fewer reads do not always mean less storage</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Each cell is one position’s KV · Each layer owns its cache · Teaching state examples</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. A window-only layer</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="10" y="114" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="500">Condition: never reads outside the window</text><rect x="10" y="199" width="500" height="659" rx="12" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5"/><text x="30" y="244" fill="#287D78" font-size="26" font-weight="600" text-anchor="start" data-max-width="458">This layer’s KV cache</text><text x="30" y="310" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">While processing p7</text><g data-container="true"><rect x="112" y="347" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="156" y="386.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">5</text></g><g data-container="true"><rect x="216" y="347" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="386.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">6</text></g><g data-container="true"><rect x="320" y="347" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="364" y="386.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">7</text></g><path d="M260 435 L260 558" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="83" y="491" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle" data-max-width="142">Remove p5</text><text x="425" y="491" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle" data-max-width="142">Add p8</text><text x="30" y="601" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">While processing p8</text><g data-container="true"><rect x="112" y="638" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="156" y="677.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">6</text></g><g data-container="true"><rect x="216" y="638" width="88" height="62" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="677.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">7</text></g><g data-container="true"><rect x="320" y="638" width="88" height="62" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="364" y="677.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="76">8</text></g><text x="30" y="774" fill="#287D78" font-size="25" font-weight="600" text-anchor="start" data-max-width="458">Retain KV for the latest 3 positions</text><rect x="10" y="927" width="500" height="278" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="30" y="971" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">A different full-attention layer’s</text><text x="30" y="1004.6" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">cache</text><g data-container="true"><rect x="38" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="60" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">0</text></g><g data-container="true"><rect x="88" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="110" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">1</text></g><g data-container="true"><rect x="138" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="160" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">2</text></g><g data-container="true"><rect x="188" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="210" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">3</text></g><g data-container="true"><rect x="238" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="260" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">4</text></g><g data-container="true"><rect x="288" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="310" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">5</text></g><g data-container="true"><rect x="338" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="360" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">6</text></g><g data-container="true"><rect x="388" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="410" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">7</text></g><g data-container="true"><rect x="438" y="1045" width="44" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="460" y="1078.04" fill="#657789" font-size="22" font-weight="500" text-anchor="middle" data-max-width="32">8</text></g><text x="30" y="1147" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" data-max-width="458">This cache still retains p5.</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Selection needs original KV</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="10" y="114" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="500">Condition: the next query may select</text><text x="10" y="147.6" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="500">other positions</text><rect x="216" y="226" width="88" height="54" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="261" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="76">q7</text><text x="20" y="260" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="176">Current reads</text><g data-container="true"><rect x="38" y="427" width="48" height="56" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="62" y="462.68" fill="#287D78" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">0</text></g><g data-container="true"><rect x="94" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="118" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">1</text></g><g data-container="true"><rect x="150" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="174" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">2</text></g><g data-container="true"><rect x="206" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="230" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">3</text></g><g data-container="true"><rect x="262" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="286" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">4</text></g><g data-container="true"><rect x="318" y="427" width="48" height="56" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="342" y="462.68" fill="#287D78" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">5</text></g><g data-container="true"><rect x="374" y="427" width="48" height="56" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="398" y="462.68" fill="#657789" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">6</text></g><g data-container="true"><rect x="430" y="427" width="48" height="56" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="454" y="462.68" fill="#287D78" font-size="24" font-weight="500" text-anchor="middle" data-max-width="36">7</text></g><rect x="10" y="397" width="500" height="350" rx="12" fill="none" stroke="#287D78" stroke-width="1.5"/><path d="M260 288 L260 343" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M62 343 L454 343" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M62 343 L62 419" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M342 343 L342 419" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M454 343 L454 419" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="30" y="547" fill="#287D78" font-size="26" font-weight="600" text-anchor="start" data-max-width="458">This layer’s KV cache</text><text x="30" y="605" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" data-max-width="458">Gray entries are still retained.</text><text x="30" y="663" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" data-max-width="458">They may be selected by the next</text><text x="30" y="696.6" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" data-max-width="458">query.</text><text x="260" y="830" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle" data-max-width="490">8 retained · 3 read now</text><g data-container="true"><rect x="30" y="929" width="460" height="196" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="960" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Unread does not mean disposable.</text><text x="46" y="1000" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Distinguish the state needed for selection</text><text x="46" y="1028" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">from the KV read after selection.</text></g></g><path d="M48,1521.3846153846155 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1559.3846153846155" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">A layer that never reads outside its window can discard old KV. A sparse design that selects the next</text><text x="48" y="1588.7846153846156" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">query’s positions from original KV may still need entries that are unread now. Safe deletion depends on</text><text x="48" y="1618.1846153846154" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">that layer’s access rule and state lifetime.</text></svg>