onents, then sum the four products.</text><text x="80" y="1020" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">Each output component is a weighted sum of the input components.</text><text x="600" y="1116" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">Apply the same W separately to every token; token positions do not mix.</text><text x="600" y="1165" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">X (T × d)  ×  W (d × m)  =  Z (T × m)</text><path d="M48,1200 L1152,1200" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1241" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Values are illustrative. This is the next figure’s first linear transformation, with bias omitted.</text>
