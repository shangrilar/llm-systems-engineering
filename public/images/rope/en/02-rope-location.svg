<title id="title">RoPE: add position information before comparing Q and K</title><desc id="desc">After projection and grouping by head, rotate Q and K by position before Core Attention. V does not receive RoPE. Concatenate the head outputs and apply the output projection.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1600" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">RoPE: add position information before comparing Q and K</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">MHA · T = 3 · d = 8 · h = 2 · dh = 4</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="275.0" y="213" width="650" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="245" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">X · T × d = 3 × 8</text><text x="600" y="273" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Input vector for each token</text><path d="M600,302 L600,338" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="275.0" y="354" width="650" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="386" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Q·K·V projection</text><text x="600" y="414" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Compute Q, K and V for each token</text><path d="M600,444 L600,478" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="600" y="520" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Group by head · only Head 1 is shown below</text><rect x="48" y="557" width="1104" height="780" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="105.0" y="592" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="250" y="624" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Q · 3 × 4</text><text x="250" y="652" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Three tokens in Head 1</text><path d="M250,681 L250,720" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="105.0" y="738" width="290" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="250" y="770" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">RoPE</text><text x="250" y="798" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Token positions 0 · 1 · 2</text><path d="M250,832 L250,906" fill="none" stroke="#287D78" stroke-width="2.5" marker-end="url(#teal-arrow)"/><rect x="105.0" y="925" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="250" y="957" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Q′ · 3 × 4</text><text x="250" y="985" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Rotated by position</text><path d="M250,1017 L250,1060" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="455.0" y="592" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="624" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">K · 3 × 4</text><text x="600" y="652" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Three tokens in Head 1</text><path d="M600,681 L600,720" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="455.0" y="738" width="290" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="770" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">RoPE</text><text x="600" y="798" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Token positions 0 · 1 · 2</text><path d="M600,832 L600,906" fill="none" stroke="#287D78" stroke-width="2.5" marker-end="url(#teal-arrow)"/><rect x="455.0" y="925" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="957" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">K′ · 3 × 4</text><text x="600" y="985" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Rotated by position</text><path d="M600,1017 L600,1060" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="805.0" y="592" width="290" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="950" y="624" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">V · 3 × 4</text><text x="950" y="652" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Three tokens in Head 1</text><path d="M950,681 L950,720" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M950,738 L950,906" fill="none" stroke="#8191A0" stroke-width="2"/><rect x="805.0" y="925" width="290" height="76" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="950" y="957" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">V · 3 × 4</text><text x="950" y="985" fill="#728190" font-size="21" font-weight="400" text-anchor="middle">Value is unchanged</text><path d="M950,1017 L950,1060" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="103" y="1079" width="994" height="114" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1120" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">Core Attention</text><text x="600" y="1162" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">Q′K′ᵀ / √dh → Mask → Softmax → PV</text><path d="M600,1205 L600,1238" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="600" y="1282" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Head 1 output O1 · 3 × 4</text><path d="M600,1352 L600,1390" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="85.0" y="1408" width="1030" height="76" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1440" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">Concat head results → output projection</text><text x="600" y="1468" fill="#728190" font-size="21" font-weight="400" text-anchor="middle">d output components per token · T × d = 3 × 8</text><path d="M48,1520 L1152,1520" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1561" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">RoPE operates on each token independently; Q′K′ᵀ compares different tokens.</text>
