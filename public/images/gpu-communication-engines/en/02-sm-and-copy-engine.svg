<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc"><title id="title">SMs and Copy Engines on the Same Link</title><desc id="desc">Two supported copy methods use the same data and NVLink connection. At the top, an SM communication kernel reads GPU 0 memory and writes to GPU 1 memory while C also uses SMs. Below, CE performs a supported copy while C runs on SMs. SM and CE are execution devices; NVLink is the connection. This does not imply arbitrary NCCL Send/Recv calls can switch to CE.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1300" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 14 · Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">SMs and Copy Engines on the Same Link</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Transfer over the same NVLink while independent computation C runs on GPU 0.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="246" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">NVLink copies available · Copy operation supported by CE</text><text x="48" y="300" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Transfer with an SM communication kernel</text><rect x="72" y="328" width="456" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="776" y="328" width="352" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="100" y="371" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 0</text><text x="804" y="371" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><rect x="100" y="396" width="400" height="150" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="120" y="431" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">SM</text><rect x="120" y="449" width="166" height="70" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="203.0" y="493.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">Compute C</text><rect x="302" y="449" width="178" height="70" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="391.0" y="493.0" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="middle">Comm. kernel</text><rect x="120" y="626" width="380" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="310.0" y="663.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">GPU memory</text><text x="310.0" y="698.0" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">x to send</text><path d="M400,616 V556" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="310" y="593" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="end">Read</text><rect x="800" y="443" width="304" height="86" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="952.0" y="480.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">GPU memory</text><text x="952.0" y="515.0" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">Received x</text><path d="M500,486 H789" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="650" y="456" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NVLink</text><text x="650" y="529" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Same link</text><text x="952" y="631" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">Write to peer GPU</text><text x="48" y="814" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Transfer with a copy engine (CE)</text><rect x="72" y="842" width="456" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="776" y="842" width="352" height="416" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="100" y="885" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 0</text><text x="804" y="885" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><rect x="100" y="910" width="186" height="150" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="193.0" y="979.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">SM</text><text x="193.0" y="1014.0" fill="#7954A3" font-size="24" font-weight="400" text-anchor="middle">Compute C</text><rect x="302" y="910" width="198" height="150" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="401.0" y="979.0" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="middle">Copy engine CE</text><text x="401.0" y="1014.0" fill="#4C60A8" font-size="22" font-weight="400" text-anchor="middle">Perform copy</text><rect x="120" y="1140" width="380" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="310.0" y="1177.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">GPU memory</text><text x="310.0" y="1212.0" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">x to send</text><path d="M400,1130 V1070" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="310" y="1107" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="end">Read</text><rect x="800" y="957" width="304" height="86" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="952.0" y="994.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">GPU memory</text><text x="952.0" y="1029.0" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">Received x</text><path d="M500,1000 H789" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="650" y="970" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NVLink</text><text x="650" y="1043" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Same link</text><text x="952" y="1145" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">Write to peer GPU</text></svg>