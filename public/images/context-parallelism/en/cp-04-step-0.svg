<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Ulysses: switch from token shards to head shards · Q·K·V by token</title><desc id="desc">Each GPU holds two heads for two tokens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,&quot;Apple SD Gothic Neo&quot;,&quot;Noto Sans KR&quot;,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">Ulysses: switch from token shards to head shards</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">Rearrange Q·K·V and outputs, not weights · The original work also calls this Sequence Parallelism.</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="40" y="137" width="220" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="150.0" y="166.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">Token shards</text><rect x="273" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="383.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">All-to-All</text><rect x="506" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="616.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">Attention per head</text><rect x="739" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="849.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">Reverse All-to-All</text><rect x="972" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="1082.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">Restore token shards</text><rect x="48" y="213" width="528" height="621" rx="10" fill="white" stroke="#2470bb" stroke-width="1.5"/><text x="70" y="247.0" font-size="24" fill="#2470bb" font-weight="700" text-anchor="start">GPU 0</text><rect x="624" y="213" width="528" height="621" rx="10" fill="white" stroke="#b55b22" stroke-width="1.5"/><text x="646" y="247.0" font-size="24" fill="#b55b22" font-weight="700" text-anchor="start">GPU 1</text><text x="167.0" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">Q</text><rect x="118" y="365" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="142.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="167" y="365" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="191.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="118" y="414" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="142.5" y="447.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="167" y="414" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="191.5" y="447.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><text x="108" y="399.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="108" y="448.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="326.0" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">K</text><rect x="277" y="365" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="301.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-ancho