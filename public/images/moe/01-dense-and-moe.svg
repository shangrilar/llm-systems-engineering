<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1490" viewBox="0 0 1200 1490" role="img" aria-labelledby="title desc">
<title id="title">Dense MLP와 MoE</title><desc id="desc">왼쪽은 하나의 Gated MLP, 오른쪽은 Router와 네 expert다. 토큰 1은 E1과 E3을 선택하고 가중합한다. 두 구조 모두 d차원 입력과 출력을 유지한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1490" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Dense MLP와 MoE</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">같은 토큰의 입력으로 두 구조를 비교합니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="205" width="1104" height="64" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="247" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">디코더 블록의 MLP 자리를 비교합니다.</text><rect x="48" y="302" width="528" height="940" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="350" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">Dense MLP</text><text x="312" y="394" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">모든 토큰에 같은 MLP 적용</text><rect x="624" y="302" width="528" height="940" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="350" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">Sparse MoE</text><text x="888" y="394" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">토큰마다 일부 expert 선택</text><rect x="230" y="440" width="165" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312.5" y="464" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">x₁</text><text x="312.5" y="485" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d차원</text><rect x="806" y="440" width="165" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.5" y="464" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">x₁</text><text x="888.5" y="485" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d차원</text><path d="M312,504 L312,680" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="132.0" y="698" width="360" height="90" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="730" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Gated MLP</text><text x="312" y="758" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → m → d</text><path d="M312,801 L312,1128" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="230" y="1145" width="165" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312.5" y="1169" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">y₁</text><text x="312.5" y="1190" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d차원</text><path d="M888,505 L888,537" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="758.0" y="553" width="260" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="585" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Router</text><text x="888" y="613" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">expert 선택 + 가중치</text><rect x="647" y="760" width="108" height="125" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="701" y="807" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">E1</text><text x="701" y="849" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → d</text><path d="M888,640 V715 H701 V750" fill="none" stroke="#2470BB" stroke-width="2.3" marker-end="url(#blue-arrow)"/><path d="M701,895 V985 H888 V1005" fill="none" stroke="#2470BB" stroke-width="2.3" marker-end="url(#blue-arrow)"/><rect x="770" y="760" width="108" height="125" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="824" y="807" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">E2</text><text x="824" y="849" fill="#728190" font-size="21" font-weight="400" text-anchor="middle">d → d</text><rect x="893" y="760" width="108" height="125" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="947" y="807" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">E3</text><text x="947" y="849" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → d</text><path d="M888,640 V715 H947 V750" fill="none" stroke="#2470BB" stroke-width="2.3" marker-end="url(#blue-arrow)"/><path d="M947,895 V985 H888 V1005" fill="none" stroke="#2470BB" stroke-width="2.3" marker-end="url(#blue-arrow)"/><rect x="1016" y="760" width="108" height="125" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1070" y="807" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">E4</text><text x="1070" y="849" fill="#728190" font-size="21" font-weight="400" text-anchor="middle">d → d</text><text x="720" y="940" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start">× 0.27</text><text x="966" y="940" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start">× 0.73</text><rect x="718.0" y="1020" width="340" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="1052" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">가중합</text><text x="888" y="1080" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">가중치를 곱한 결과를 더함</text><path d="M888,1108 L888,1133" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="806" y="1145" width="165" height="54" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.5" y="1169" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">y₁</text><text x="888.5" y="1190" fill="#2470BB" font-size="18" font-weight="400" text-anchor="middle">d차원</text><rect x="48" y="1290" width="1104" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1336" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">MLP 하나를 쓰거나 여러 expert를 선택해도, 입력과 출력은 d차원입니다.</text><path d="M48,1410 L1152,1410" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1451" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">예시: expert 4개 중 Top-2 선택 · E1~E4는 서로 다른 가중치를 가진 Gated MLP입니다.</text>
</svg>