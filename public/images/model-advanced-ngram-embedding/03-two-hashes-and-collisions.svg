<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="947" viewBox="0 0 1200 947" role="img" aria-labelledby="title desc"><title id="title">표 하나에서 충돌해도 전체 표현은 달라질 수 있습니다</title><desc id="desc">교육용 두 해시는 (2,5)와 (1,1)을 첫 표의 row 4에 함께 배정하지만 둘째 표에서는 row 1과 row 3으로 구별합니다. 두 입력은 같은 테이블들을 사용합니다. 주황 벡터 구간은 공유하고 나머지 구간은 달라질 수 있습니다. 조회는 독립적이지만 물리적 메모리 접근이 한 번이라는 뜻은 아닙니다. 모든 해시에서의 충돌 제거를 보장하지 않습니다.</desc><metadata>{&quot;id&quot;:&quot;ma-19-05&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2, §4.1, §6.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">표 하나에서 충돌해도 전체 표현은 달라질 수 있습니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">해시마다 별도 표 · 독립적으로 조회한 벡터를 이어 붙임</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 두 입력, 공통 테이블 두 개</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="220" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="130" y="150.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">(A,B) = (2,5)</text><rect x="280" y="110" width="220" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="390" y="150.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">(C,C) = (1,1)</text><g data-container="true"><rect x="20" y="255" width="220" height="130" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="286" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Hash 1</text><text x="36" y="326" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">(3u + v) mod 7</text></g><g data-container="true"><rect x="280" y="255" width="220" height="130" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="296" y="286" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Hash 2</text><text x="296" y="326" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">(u + 2v) mod 11</text></g><path d="M130 185 L130 245" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M390 185 L390 245" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M130 200 V220 H370 V245" stroke="#2470BB" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><path d="M390 200 V230 H150 V245" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M130 395 L130 470" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M390 395 L390 470" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="485" width="220" height="180" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="516" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 1 · 7 rows</text><text x="36" y="556" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">두 입력 → row 4</text><text x="36" y="584" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">[0.2, 0.8]</text></g><g data-container="true"><rect x="280" y="485" width="220" height="180" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="296" y="516" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 2 · 11 rows</text><text x="296" y="556" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">row 1: [−0.5, 0.1]</text><text x="296" y="584" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">row 3: [a, b]</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 같은 구간과 다른 구간</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="25" y="130" fill="#182C40" font-size="27" font-weight="600" text-anchor="start" data-max-width="450">(A,B)</text><rect x="20" y="175" width="220" height="80" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="130" y="223" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">0.2 | 0.8</text><rect x="260" y="175" width="240" height="80" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="380" y="223" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="228">−0.5 | 0.1</text><path d="M25 275 V290 H495 V275" stroke="#182C40" stroke-width="2" fill="none"/><text x="260" y="340" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="490">이어 붙인 4성분 벡터</text><text x="25" y="420" fill="#182C40" font-size="27" font-weight="600" text-anchor="start" data-max-width="450">(C,C)</text><rect x="20" y="465" width="220" height="80" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="130" y="513" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">0.2 | 0.8</text><rect x="260" y="465" width="240" height="80" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="380" y="513" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="228">a | b</text><path d="M25 565 V580 H495 V565" stroke="#182C40" stroke-width="2" fill="none"/><text x="260" y="630" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="490">이어 붙인 4성분 벡터</text></g></svg>