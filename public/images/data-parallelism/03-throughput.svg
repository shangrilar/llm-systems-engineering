<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" role="img" aria-labelledby="title desc"><title id="title">실행 시간과 처리량을 구별하기</title><desc id="desc">GPU 하나는 네 요청을 네 슬롯에 처리하고 두 GPU는 두 슬롯에 처리하지만 개별 요청의 실행은 한 슬롯입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="807" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">실행 시간과 처리량을 구별하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">네 요청이 동시에 도착하고, 요청 간 간섭과 분산 비용은 생략한 일정입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="211.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 요청의 실행에 1칸이 걸린다고 가정</text><rect x="48" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">배치</text><rect x="268.8" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">시간 1</text><rect x="489.6" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">시간 2</text><rect x="710.4000000000001" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">시간 3</text><rect x="931.2" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" 