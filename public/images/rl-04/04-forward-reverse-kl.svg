text><text x="31" y="450" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="44">c</text><rect x="86" y="421" width="7.8" height="22" rx="0" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="102.8" y="440" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">2%</text><rect x="86" y="455" width="78" height="22" rx="0" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="173" y="474" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="70">20%</text><path d="M86 511 L476 511" stroke="#5C6C7C" stroke-width="1" fill="none"/><path d="M86 511 L86 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="86" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">0%</text><path d="M281 511 L281 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="281" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">50%</text><path d="M476 511 L476 518" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="476" y="541" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="74">100%</text><text x="16" y="597" fill="#7954A3" font-size="26" font-weight="600" text-anchor="start" data-max-width="488">Σ pT × ln(pT / pS)</text><text x="16" y="652" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">교사가 높은 확률을 준 토큰에</text><text x="16" y="681.4" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">학생이 낮은 확률을 주면 크게 패널티</text><text x="16" y="773" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="488">Mode-covering</text><text x="16" y="815" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">교사의 여러 선택지를 넓게 포괄</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fi