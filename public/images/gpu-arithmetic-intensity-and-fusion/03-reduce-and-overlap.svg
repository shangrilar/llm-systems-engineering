<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">이동을 줄이거나, 대기 중에 다른 계산을 합니다</title><desc id="desc">세 경우 모두 같은 A와 B 계산을 완료한다. B는 A의 새 입력과 독립적이며 입력이 이미 준비되어 있다고 가정한다. 기준은 A입력 준비4칸 뒤 A계산2칸과 B계산2칸이다. 이동 감소는 재사용이나 중간값 이동 생략으로 A입력 준비를2칸으로 줄이고 계산은 유지한다. 동시 진행은 A입력 준비4칸 동안 B계산2칸을 먼저 진행한 뒤 A입력이 준비되면 A계산을 한다. 계산 A는 자기 입력 준비가 끝난 뒤에만 시작한다. 시간선은 상대적인 실행 순서 설명이며 실제 속도 향상 측정이 아니다. 이전 워프 스케줄링 편과 연결되는 개념도이며 구체적인 비동기 복사 API를 뜻하지 않는다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1220" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">이동을 줄이거나, 대기 중에 다른 계산을 합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">데이터 이동량을 줄이는 것과 데이터 대기를 가리는 것은 다른 방법입니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="218" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">A의 입력을 준비하는 동안 실행할 수 있는 독립적인 계산 B가 있습니다.</text><rect x="48" y="250" width="1104" height="234" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="292" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">기준 · 입력을 기다린 뒤 계산</text><text x="75" y="352" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">A의 입력 준비</text><text x="75" y="414" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start">연산 장치</text><rect x="276" y="315" width="376" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="464.0" y="347.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">데이터 이동</text><rect x="276" y="380" width="376" height="48" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="464.0" y="412.0" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">대기</text><rect x="652" y="380" width="188" height="48" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="746.0" y="412.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">A 계산</text><rect x="840" y="380" width="188" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="934.0" y="412.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B 계산</text><path d="M652,365 L652,375" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M1028,311 V437" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="1028" y="468" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">전체 완료</text><rect x="48" y="510" width="1104" height="234" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="552" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">이동 감소 · 필요한 데이터 이동 자체를 줄임</text><text x="75" y="612" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">A의 입력 준비</text><text x="75" y="674" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start">연산 장치</text><rect x="276" y="575" width="188" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="370.0" y="607.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">데이터 이동</text><rect x="276" y="640" width="188" height="48" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="370.0" y="672.0" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">대기</text><rect x="464" y="640" width="188" height="48" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="558.0" y="672.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">A 계산</text><rect x="652" y="640" width="188" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="746.0" y="672.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B 계산</text><path d="M464,625 L464,635" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M840,571 V697" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="840" y="728" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">전체 완료</text><rect x="48" y="770" width="1104" height="234" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="812" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">동시 진행 · 데이터 이동 중 독립적인 계산을 진행</text><text x="75" y="872" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">A의 입력 준비</text><text x="75" y="934" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start">연산 장치</text><rect x="276" y="835" width="376" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="464.0" y="867.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">데이터 이동</text><rect x="464" y="900" width="188" height="48" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="558.0" y="932.0" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">대기</text><rect x="276" y="900" width="188" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="370.0" y="932.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B 계산</text><rect x="652" y="900" width="188" height="48" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="746.0" y="932.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">A 계산</text><path d="M652,885 L652,895" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M840,831 V957" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="840" y="988" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">전체 완료</text><text x="1030" y="872" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">이동 시간은 동일</text><path d="M278,1050 L1100,1050" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1110" y="1083" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간</text><text x="600" y="1130" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">세 경우 모두 A와 B의 계산량은 같습니다.</text><text x="600" y="1174" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">옮길 데이터를 줄이거나, 데이터가 준비되는 동안 다른 계산을 진행합니다.</text></svg>