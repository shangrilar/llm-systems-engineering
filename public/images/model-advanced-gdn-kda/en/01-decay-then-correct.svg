<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1269" viewBox="0 0 1200 1269" role="img" aria-labelledby="title desc"><title id="title">Read the retained state, then correct</title><desc id="desc">1: Retain half of S₂=[[2,0],[0,3]] to obtain S̄=[[1,0],[0,1.5]]. 2: The current Key reads [1,0] from S̄. 3: Subtract this from the new Value [1,1] to get [0,1]. 4: With β=1, add [[0,1],[0,0]] to S̄, yielding S₃=[[1,1],[0,1.5]].</desc><metadata>{&quot;id&quot;:&quot;ma-10-01&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Gated DeltaNet §3.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2412.06464v1#S3.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Read the retained state, then correct</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">k₂=[1,0], v₂=[1,1] · α=0.5, β=1</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">1. Retain the old state</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="115" y="125" fill="#287D78" font-size="26" font-weight="400" text-anchor="middle" data-max-width="160">S₂</text><text x="405" y="125" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle" data-max-width="160">S̄</text><g data-container="true"><rect x="35" y="160" width="70" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="70" y="199.28" fill="#287D78" font-size="29" font-weight="500" text-anchor="middle" data-max-width="58">2</text></g><g data-container="true"><rect x="115" y="160" width="70" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="150" y="199.28" fill="#287D78" font-size="29" font-weight="500" text-anchor="middle" data-max-width="58">0</text></g><g data-container="true"><rect x="35" y="230" width="70" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="70" y="269.28" fill="#287D78" font-size="29" font-weight="500" text-anchor="middle" data-max-width="58">0</text></g><g data-container="true"><rect x="115" y="230" width="70" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="150" y="269.28" fill="#287D78" font-size="29" font-weight="500" text-anchor="middle" data-max-width="58">3</text></g><g data-container="true"><rect x="325" y="160" width="70" height="60" rx="4" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="360" y="199.28" fill="#7954A3" font-size="29" font-weight="500" text-anchor="middle" data-max-width="58">1</text></g><g data-container="true"><rect x="405" y="160" width="70" height="60" rx="4" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="440" y="199.28" fill="#7954A3" font-size="29" font-weight="500" text-anchor="middle" 