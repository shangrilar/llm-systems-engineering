-weight="600" text-anchor="middle" data-max-width="108">p₂</text><path d="M260 170 L260 225" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="160" y="240" width="200" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="278" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">Query q₂</text><text x="260" y="347" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">Current retrieval cue</text><path d="M260 365 L260 438" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="75" y="435" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle" data-max-width="150">Updated state</text><rect x="20" y="475" width="110" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="75" y="513" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="98">S₃</text><path d="M140 505 L190 505" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="200" y="450" width="180" height="85" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="290" y="500.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">Read</text><path d="M290 550 L290 610" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><rect x="190" y="625" width="200" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="668" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">Output o₂</text></g></svg>