<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1131" viewBox="0 0 360 1131" role="img" aria-labelledby="title desc"><title id="title">Training steps and rollout versions advance separately</title><desc id="desc">Training advances from step 9 to 12. Inference keeps v3 from step 9 until synchronization at step 12 publishes v4. At step 11, v3 data has rollout-version lag zero despite two learner updates.</desc><metadata>{&quot;id&quot;:&quot;10-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles fully async&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/main/docs/user-guide/fully-async.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Training steps and rollout</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">versions advance</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">separately</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Illustrative example: one update per</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">step; synchronize weights every three</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">steps.</text><path d="M16,234.79999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 258.79999999999995) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Two progress counters</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="20" y="121" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="500">Learner</text><text x="315" y="121" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="205">Inference</text><g data-container="true"><rect x="16" y="153" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="184" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 9</text></g><path d="M119 234 L119 264" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="271" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="302" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 10</text></g><path d="M119 352 L119 382" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="389" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="420" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 11</text></g><path d="M119 470 L119 500" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="507" width="206" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="538" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="174">step 12</text></g><g data-container="true"><rect x="300" y="153" width="204" height="312" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="316" y="184" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="172">v3</text><text x="316" y="224" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="172">Step 9 weights</text></g><g data-container="true"><rect x="300" y="507" width="204" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="316" y="538" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="172">v4</text></g><path d="M228 189 L294 189" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="260" y="170" fill="#B55B22" font-size="17" font-weight="400" text-anchor="middle" data-max-width="260">sync</text><path d="M228 543 L294 543" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="260" y="524" fill="#B55B22" font-size="17" font-weight="400" text-anchor="middle" data-max-width="260">sync</text><text x="16" y="626" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Steps 10–11: inference weights unchanged</text></g><g transform="translate(16 696.8) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">At step 11</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="110" width="488" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Learner: step 11</text><text x="32" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Two updates since publishing v3</text></g><g data-container="true"><rect x="16" y="237" width="488" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="268" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Inference: last published v3</text><text x="32" y="308" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Before the next synchronization</text></g><path d="M260 349 L260 387" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="397" width="488" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="428" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Experience generated by v3</text><text x="32" y="468" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Current rollout v3 − generation v3 = 0</text></g><text x="24" y="553" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="470">Rollout-version lag: 0</text><text x="24" y="602" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="470">Learner weights can still differ</text></g></svg>