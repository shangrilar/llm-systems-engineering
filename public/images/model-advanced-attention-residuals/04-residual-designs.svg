<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1587" viewBox="0 0 1200 1587" role="img" aria-labelledby="title desc"><title id="title">무엇을 보관하고, 어떻게 읽고, 무엇을 갱신할까요?</title><desc id="desc">mHC, GR, AttnRes를 보관, 읽기, 갱신 세 기준으로 비교한다. mHC는 혼합한 우회에 쓰고 GR은 원본 우회에 쓴다. AttnRes는 깊이 목록을 읽고 새 출력을 추가한다.</desc><metadata>{&quot;id&quot;:&quot;ma-14-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1&quot;},{&quot;label&quot;:&quot;GR&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2608.30320v1#S2.SS2&quot;},{&quot;label&quot;:&quot;AttnRes&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.24653v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 5 · 세 편의 연결</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">무엇을 보관하고, 어떻게 읽고, 무엇을 갱신할까요?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 토큰의 깊이 방향 전달 · F는 Attention 또는 MLP</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1104">A. 13편 · mHC</text><path d="M0 68 L1104 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="120" width="480" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">보관</text><text x="36" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">여러 stream X = [x₁, x₂]</text></g><path d="M260 246 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="293" width="480" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="324" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">읽기 → F</text><text x="36" y="364" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Stream별 scalar로 읽기</text></g><g data-container="true"><rect x="584" y="120" width="480" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="600" y="151" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">갱신</text><text x="600" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">제약된 우회 혼합 + 새 출력 쓰기</text></g><text x="824" y="289" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="470">X′ = H_res X + H_post F(H_pre X)</text><path d="M514 349 L569 176" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/></g><g transform="translate(48 669) scale(1)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1104">B. 14편 · Gated Residual</text><path d="M0 68 L1104 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="120" width="480" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">보관</text><text x="36" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">여러 branch R = [R₁, R₂]</text></g><path d="M260 246 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="293" width="480" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="324" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">읽기 → F</text><text x="36" y="364" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Branch norm → 성분 Gate → 평균</text></g><g data-container="true"><rect x="584" y="120" width="480" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="600" y="151" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">갱신</text><text x="600" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">원본 우회 + 새 출력의 scalar 쓰기</text></g><text x="824" y="289" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="470">Rᵢ′ = Rᵢ + sᵢ F(x)</text><path d="M514 349 L569 176" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/></g><g transform="translate(48 1132) scale(1)" data-panel="3"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1104">C. 15편 · Attention Residuals</text><path d="M0 68 L1104 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="120" width="480" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">보관</text><text x="36" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">깊이별 새 출력 [e, f₁, f₂, …]</text></g><path d="M260 246 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="293" width="480" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="324" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">읽기 → F</text><text x="36" y="364" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">깊이별 점수 → softmax → 가중합</text></g><g data-container="true"><rect x="584" y="120" width="480" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="600" y="151" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">갱신</text><text x="600" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">새 출력 추가 · Block은 현재 합 갱신</text></g><text x="824" y="289" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="470">h = Σ αᵢ sourceᵢ → F(h) = f_new</text><path d="M514 349 L569 176" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/></g></svg>