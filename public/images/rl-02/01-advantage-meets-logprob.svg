<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1219" viewBox="0 0 1200 1219" role="img" aria-labelledby="title desc"><title id="title">손실의 기울기는 모델 가중치로 돌아간다</title><desc id="desc">보상에서 구한 return 1과 기준값 0.4로 어드밴티지 +0.6을 구한다. 생성 당시 문맥과 선택 토큰을 현재 모델에 넣어 계산한 로그확률과 고정된 어드밴티지가 손실 -A log p에서 만난다. 역전파는 모델의 학습 가능한 파라미터로 흐른다.</desc><metadata>{&quot;id&quot;:&quot;2-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;PPO §2&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/1707.06347&quot;},{&quot;label&quot;:&quot;RLHF Book — Policy gradients&quot;,&quot;url&quot;:&quot;https://rlhfbook.com/c/06-policy-gradients&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">손실의 기울기는 모델 가중치로 돌아간다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">그림 1의 첫 토큰 u를 따라갑니다. 파랑은 확률 계산, 초록 점선은 역전파입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">순전파 · 첫 토큰 u를 다시 평가</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="98" width="488" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="129" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">입력 P · 기록된 선택 u</text><text x="32" y="169" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">토큰 ID는 고정된 학습 데이터</text></g><path d="M260 198 L260 224" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="234" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="265" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Transformer → h₁</text><text x="32" y="305" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">학습 중인 가중치로 문맥 표현 계산</text></g><path d="M260 334 L260 360" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="370" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="401" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">LM head → softmax</text><text x="32" y="441" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">후보 분포에서 u의 확률 조회</text></g><path d="M260 470 L260 496" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="506" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="537" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">pθ(u | P) = 0.5</text><text x="32" y="577" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">log pθ(u | P) ≈ −0.693</text></g><g data-container="true"><rect x="16" y="628" width="488" height="90" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="659" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">평가에서 얻은 고정 신호</text><text x="32" y="699" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">A₁ = 1 − 0.4 = +0.6</text></g><path d="M 510 554 H 516 V 826 H 506" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 728 L260 754" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="764" width="488" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="795" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">L₁ = −A₁ log pθ(u | P)</text><text x="32" y="835" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">−0.6 × (−0.693) ≈ 0.416</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">역전파 · 같은 손실에서 가중치로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="98" width="488" height="160" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="129" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">로그확률 z에 대한 기울기</text><text x="32" y="169" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">z = log pθ(u | P)</text><text x="32" y="197" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">L₁ = −0.6z → ∂L₁/∂z = −0.6</text></g><path d="M260 268 L260 294" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="304" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="335" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">softmax · LM head</text><text x="32" y="375" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">로그확률에서 출력 계산으로 미분 전달</text></g><path d="M260 404 L260 430" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="440" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="471" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">h₁ → Transformer</text><text x="32" y="511" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">문맥 표현을 만든 학습 가능한 층으로</text></g><path d="M260 540 L260 566" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="576" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="607" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">파라미터별 gradient를 모음</text><text x="32" y="647" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">다른 학습 토큰의 기여도 함께 합산</text></g><path d="M260 676 L260 698" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="708" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="739" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Optimizer → 새 가중치 θ′</text><text x="32" y="779" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">확률표가 아닌 모델 파라미터를 갱신</text></g><path d="M260 808 L260 834" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="844" width="488" height="96" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="875" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">다음 forward에서 확률 재계산</text><text x="32" y="915" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">같은 P에서도 분포가 달라질 수 있음</text></g></g></svg>