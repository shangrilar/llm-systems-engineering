<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">같은 가중치로 더 많은 토큰 계산하기</title><desc id="desc">동일한 W를 입력 토큰 하나와 네 개에 사용하는 두 경우를 비교합니다. 출력 행과 선형 연산량은 하나에서 네 개로 늘지만 가중치 데이터량은 같습니다. 각 비교 막대는 해당 항목의 한 토큰 값을 기준으로 합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1110" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">같은 가중치로 더 많은 토큰 계산하기</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">가중치의 크기는 같고, 함께 계산하는 입력과 출력 행이 늘어납니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="306" y="221.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">입력 토큰 1개</text><rect x="211" y="265" width="190" height="132" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><path d="M249,265 V397 M211, 291.4 H401" stroke="#7954A3" opacity=".18"/><path d="M287,265 V397 M211, 317.8 H401" stroke="#7954A3" opacity=".18"/><path d="M325,265 V397 M211, 344.2 H401" stroke="#7954A3" opacity=".18"/><path d="M363,265 V397 M211, 370.6 H401" stroke="#7954A3" opacity=".18"/><rect x="271" y="301" width="70" height="56" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="306" y="339.0" fill="#7954A3" font-size="33" font-weight="700" text-anchor="middle">W</text><path d="M306,412 L306,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="263" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="306.0" y="541.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t0</text><path d="M306,575 L306,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="263" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="306" y="691.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">출력 1행</text><text x="48" y="771.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">가중치 데이터량</text><rect x="48" y="790" width="240" height="38" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="306" y="818.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">1×</text><text x="48" y="884.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">선형 연산량</text><rect x="48" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124" y="931.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">1×</text><text x="894" y="221.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">입력 토큰 4개</text><rect x="799" y="265" width="190" height="132" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><path d="M837,265 V397 M799, 291.4 H989" stroke="#7954A3" opacity=".18"/><path d="M875,265 V397 M799, 317.8 H989" stroke="#7954A3" opacity=".18"/><path d="M913,265 V397 M799, 344.2 H989" stroke="#7954A3" opacity=".18"/><path d="M951,265 V397 M799, 370.6 H989" stroke="#7954A3" opacity=".18"/><rect x="859" y="301" width="70" height="56" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="894" y="339.0" fill="#7954A3" font-size="33" font-weight="700" text-anchor="middle">W</text><path d="M894,412 L703,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="660" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="703.0" y="541.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t0</text><path d="M703,575 L703,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="660" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M894,412 L823,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="780" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="823.0" y="541.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t1</text><path d="M823,575 L823,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="780" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M894,412 L943,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="943.0" y="541.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t2</text><path d="M943,575 L943,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="900" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M894,412 L1063,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1020" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1063.0" y="541.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t3</text><path d="M1063,575 L1063,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1020" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="894" y="691.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">출력 4행</text><text x="636" y="771.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">가중치 데이터량</text><rect x="636" y="790" width="240" height="38" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="894" y="818.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">1×</text><text x="636" y="884.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">선형 연산량</text><rect x="636" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="696" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="756" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="816" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="892" y="931.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">4×</text><text x="48" y="1001.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">각 항목의 1토큰 값을 기준으로 비교 · 가중치 한 벌을 읽는 근사</text><text x="48" y="1054.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">여러 토큰: 한 요청의 Prefill 또는 여러 요청의 Decode</text></svg>