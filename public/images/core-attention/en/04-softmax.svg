idth="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.818</text><rect x="850.0" y="508" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.182</text><rect x="950.0" y="508" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="750.0" y="576" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.114</text><rect x="850.0" y="576" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.042</text><rect x="950.0" y="576" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.844</text><text x="731" y="482.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="731" y="550.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="731" y="618.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="800.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="900.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="1000.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><text x="600" y="709" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Each row sums to 1 · masked positions have weight 0</text><path d="M48,760 L1152,760" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="819" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Focusing on the row for token 3,</text><text x="600" y="875" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">[1, 0, 3] → [e¹, e⁰, e³] ÷ (e¹ + e⁰ + e³)</text><text x="280" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Token 1</text><rect x="190" y="990" width="180" height="175" rx="0" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="190" y="1145.015840107696" width="180" height="19.984159892304035" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.114</text><text x="600" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Token 2</text><rect x="510" y="990" width="180" height="175" rx="0" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="510" y="1157.6482384265385" width="180" height="7.351761573461559" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.042</text><text x="920" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Token 3</text><rect x="830" y="990" width="180" height="175" rx="0" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="830" y="1017.3359214657656" width="180" height="147.6640785342344" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="920" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.844</text><text x="600" y="1280" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">A higher score gives that token’s Value a larger weight.</text><path d="M48,1340 L1152,1340" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1381" fill="#5C6C7C" font-size="20" font-weight="400" 