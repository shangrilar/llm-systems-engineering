ne" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Fill free slots while staying</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">within KV capacity</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Illustrative execution: admit D after A</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">finishes. D needs input computation,</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">while long-running B and C continue to</text><text x="16" y="205" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">occupy KV memory.</text><path d="M16,225 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 249) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Request progress and KV snapshots</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="122" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="75">Slot</text><text x="100" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">0</text><path d="M100 136 L100 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="165" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">1</text><path d="M165 136 L165 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="230" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">2</text><path d="M230 136 L230 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="295" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">3</text><path d="M295 136 L295 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="360" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">4</text><path d="M360 136 L360 408" stroke="#DCE4EC" stroke-width="1" fill=