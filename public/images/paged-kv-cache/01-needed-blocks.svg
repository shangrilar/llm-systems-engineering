<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="918" viewBox="0 0 1200 918" role="img" aria-labelledby="title desc"><title id="title">예약 공간을 필요한 블록으로 바꾸기</title><desc id="desc">24칸 KV 풀에서 B의 실제 KV는 6칸이다. 20칸을 예약하면 미사용 예약이 14칸이고 가용 공간은 4칸이어서 입력 6토큰의 C가 기다린다. 블록당 4칸으로 B에 2블록, C에 2블록을 배정하면 2블록이 남는다. C의 블록은 배정만 되었고 아직 KV를 계산하지 않아 비어 있다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="918" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">예약 공간을 필요한 블록으로 바꾸기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">같은 24칸에서도, B가 미리 차지하는 공간을 줄이면 C를 받을 수 있습니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="207.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B의 현재 KV 6칸</text><text x="1152" y="207.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="end">새 요청 C · 입력 6토큰</text><text x="48" y="278.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">큰 공간을 미리 예약</text><text x="1152" y="278.0" fill="#7954A3" font-size="27" font-weight="700" text-anchor="end">C 대기</text><text x="68" y="335.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B 예약 20칸</text><text x="1060" y="335.0" fill="#526577" font-size="24" font-weight="700" text-anchor="middle">가용 4칸</text><rect x="58" y="354" width="900" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="978" y="354" width="164" height="90" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="66" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x=