<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1173" viewBox="0 0 1200 1173" role="img" aria-labelledby="title desc"><title id="title">Token count changes the bottleneck of linear operations</title><desc id="desc">The sloped bandwidth ceiling marks the memory-bound region, and the flat compute ceiling marks the compute-bound region. Few new tokens in small-batch decode and many tokens in sufficiently large prefill illustrate low and high arithmetic intensity respectively.</desc><metadata>{&quot;id&quot;:&quot;04-prefill-decode-roofline&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Token count changes the bottleneck of linear operations</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Apply the Roofline model to linear operations that use model weights.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Compute throughput</text><path d="M145,765 L145,265" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M145,765 L1145,765" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M145,765 L705,355" fill="none" stroke="#2470BB" stroke-width="6"/><path d="M705,355 H1110" fill="none" stroke="#B55B22" stroke-width="6"/><path d="M145,355 H705 V765" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="460" y="306" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Bandwidth × arithmetic intensity</text><text x="920" y="306" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU compute ceiling</text><circle cx="330" cy="629.5535714285714" r="10" fill="white" stroke="#182C40" stroke-width="3"/><circle cx="955" cy="355" r="10" fill="white" stroke="#182C40" stroke-width="3"/><text x="190" y="466" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Small-batch decode</text><text x="190" y="505" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Few new input tokens</text><path d="M330,526 L330,589" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="810" y="448" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Prefill with enough input</text><text x="810" y="488" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Many input tokens</text><path d="M955,418 L955,374" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="330" y="817" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Low</text><text x="955" y="817" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">High</text><text x="665" y="867" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Arithmetic intensity · FLOP/byte</text><text x="350" y="708" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Memory-bound</text><text x="917" y="708" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">Compute-bound</text><path d="M226,929 L1080,929" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="654" y="975" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">More tokens → more weight reuse → higher arithmetic intensity</text><text x="48" y="1044" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">The line is a throughput ceiling; positions illustrate conditions, not measurements.</text></g></g><path d="M48,1095 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1133" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Small-batch Decode is an example of low arithmetic intensity; Prefill with enough input, of high intensity.</text></svg>