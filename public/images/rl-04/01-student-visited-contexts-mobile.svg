<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1334" viewBox="0 0 360 1334" role="img" aria-labelledby="title desc"><title id="title">학생이 방문한 문맥에서 교사의 확률을 읽는다</title><desc id="desc">같은 질문P에서 SFT의 주어진답은 u,a,c이고 학생이 생성한 OPD경로는 u,b,d이다. SFT는 P,Pu,Pua 문맥에서 주어진 다음토큰을 목표로 삼고 OPD는 P,Pu,Pub 문맥에서 학생 선택 u,b,d의 교사확률을 구한다.</desc><metadata>{&quot;id&quot;:&quot;4-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Thinking Machines — On-policy distillation&quot;,&quot;url&quot;:&quot;https://thinkingmachines.ai/blog/on-policy-distillation/&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">학생이 방문한 문맥에서</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">교사의 확률을 읽는다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">SFT는 주어진 답의 경로를 따릅니다. OPD는</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">학생이 만든 경로 위에서 교사의 학습</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">신호를 구합니다.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">SFT: 주어진 답의 경로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="84" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 질문 P</text></g><rect x="26" y="216" width="112" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="82" y="248" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">u</text><path d="M150 240 L187 240" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="202" y="216" width="112" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="258" y="248" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">a</text><path d="M326 240 L363 240" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="378" y="216" width="112" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="434" y="248" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">c</text><text x="16" y="308" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="256">주어진 답의 문맥</text><text x="304" y="308" fill="#B55B22" font-size="21" font-weight="600" text-anchor="start" data-max-width="200">목표 토큰</text><g data-container="true"><rect x="16" y="342" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="373" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P</text><text x="32" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">행동 직전 문맥</text></g><path d="M269 392 L291 392" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="304" y="342" width="200" height="104" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="320" y="373" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">u</text><text x="320" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">주어진 다음 토큰</text></g><g data-container="true"><rect x="16" y="474" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="505" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u</text><text x="32" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">행동 직전 문맥</text></g><path d="M269 524 L291 524" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="304" y="474" width="200" height="104" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="320" y="505" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">a</text><text x="320" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">주어진 다음 토큰</text></g><g data-container="true"><rect x="16" y="606" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="637" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u + a</text><text x="32" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">행동 직전 문맥</text></g><path d="M269 656 L291 656" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="304" y="606" width="200" height="104" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="320" y="637" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">c</text><text x="320" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">주어진 다음 토큰</text></g><text x="16" y="762" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">답의 출처가 반드시 교사일 필요는 없습니다.</text></g><g transform="translate(16 781.1538461538462) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">OPD: 학생이 경로를 생성</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="84" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 질문 P</text></g><rect x="26" y="216" width="112" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="82" y="248" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">u</text><path d="M150 240 L187 240" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="202" y="216" width="112" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="258" y="248" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">b</text><path d="M326 240 L363 240" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="378" y="216" width="112" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="434" y="248" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">d</text><text x="16" y="308" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="256">학생의 실제 문맥</text><text x="304" y="308" fill="#7954A3" font-size="21" font-weight="600" text-anchor="start" data-max-width="200">교사의 확률</text><g data-container="true"><rect x="16" y="342" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="373" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P</text><text x="32" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">행동 직전 문맥</text></g><path d="M269 392 L291 392" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="304" y="342" width="200" height="104" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="373" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">pT(u)</text><text x="320" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">이 문맥에서</text></g><g data-container="true"><rect x="16" y="474" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="505" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u</text><text x="32" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">행동 직전 문맥</text></g><path d="M269 524 L291 524" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="304" y="474" width="200" height="104" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="505" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">pT(b)</text><text x="320" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">이 문맥에서</text></g><g data-container="true"><rect x="16" y="606" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="637" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u + b</text><text x="32" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">행동 직전 문맥</text></g><path d="M269 656 L291 656" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="304" y="606" width="200" height="104" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="637" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">pT(d)</text><text x="320" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">이 문맥에서</text></g><text x="16" y="762" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">교사는 학생의 선택을 평가합니다.</text></g></svg>