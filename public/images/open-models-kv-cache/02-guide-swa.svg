="400" text-anchor="start" data-max-width="1104">요청당 고정 상태: 요청마다 따로 들고 문맥과 무관 · 상태 행렬 Kimi FP32·Qwen BF16, conv BF16 · SWA·local KV는 window를 채운 뒤의 값</text></g></svg>