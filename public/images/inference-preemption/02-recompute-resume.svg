<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">출력 이력을 지키면서 KV를 다시 만들기</title><desc id="desc">중단 전 KV는 p0, p1, p2, x0이고 출력은 x1까지 전달되었습니다. KV를 해제해도 이력을 유지하고 재개 시 x1까지 계산하여 새 x2만 선택·전달합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1050" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">출력 이력을 지키면서 KV를 다시 만들기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">입력 p0·p1·p2, 출력 x0·x1까지 진행한 요청 B의 교육용 예시입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><g data-panel="true"><rect x="48" y="203" width="1104" height="167" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="239.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">중단 직전: x1까지 선택·전달</text><text x="68" y="287.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">보존할 이력: p0 p1 p2 x0 x1 / GPU KV: p0 p1 p2 x0</text><text x="68" y="319.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">x1은 다음 실행의 입력이므로 아직 자기 KV가 없을 수 있습니다.</text></g><path d="M600,390 L600,433" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="454" width="1104" height="141" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="68" y="490.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">중단: 토큰 이력은 유지, GPU KV는 해제</text><text x="68" y="538.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이력: p0 p1 p2 x0 x1 / GPU KV: 없음 / 사용자에게 새 출력 없음</text></g><path d="M600,615 L600,658" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="679" width="1104" height="168" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="715.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">재개: 고정된 이력을 입력으로 KV 재계산</text><text x="68" y="763.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">입력: p0 p1 p2 x0 x1 → KV: p0 p1 p2 x0 x1 → 다음 토큰 x2 선택</text><text x="68" y="795.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">기존 x0·x1을 다시 샘플링하지 않습니다. 새 x2만 사용자에게 전달합니다.</text></g><g data-panel="true"><rect x="48" y="895" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="930.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">복구하는 것은 계산 상태이며, 기존 출력의 선택은 유지합니다.</text><text x="72" y="972.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">여기서는 recompute를 표시합니다. Swap은 다른 저장소에 보관한 KV를 복원합니다.</text></g></svg>