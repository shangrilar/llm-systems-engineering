<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1045" viewBox="0 0 1200 1045" role="img" aria-labelledby="title desc"><title id="title">한 배치를 더 작은 마이크로배치로 나누기</title><desc id="desc">배치에 있던 네 입력 시퀀스를 하나씩 나누되 각 시퀀스의 토큰은 유지한다. 모든 입력은 네 GPU를 통과하고 학습 예시에서는 기울기를 모아 한 번 갱신한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1045" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">한 배치를 더 작은 마이크로배치로 나누기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">색 = 입력 A·B·C·D · 작은 칸 = 각 시퀀스의 토큰</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="100" y="209" width="1000" height="168" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="249.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">배치 크기 4 = 입력 시퀀스 4개</text><rect x="134" y="270" width="206" height="85" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="148" y="299.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">A</text><rect x="149.0" y="315" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="184.2" y="315" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="219.4" y="315" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="254.6" y="315" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="289.8" y="315" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="371" y="270" width="206" height="85" rx="10" fill="#EDF7F5" s