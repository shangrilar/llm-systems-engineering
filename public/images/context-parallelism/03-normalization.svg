<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">블록 결과는 가중치를 함께 합칩니다</title><desc id="desc">블록별 가중합과 가중치 합을 더해 16/3을 얻습니다. 블록별 출력의 단순 평균 6.5는 틀립니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="800" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">블록 결과는 가중치를 함께 합칩니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Q 하나, 같은 점수 0, 스칼라 V를 사용해 정규화의 의미만 살펴봅니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="204" width="510" height="220" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="240.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">K·V 블록 A</text><text x="66" y="290.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">점수: [0, 0] → 가중치 [1, 1]</text><text x="66" y="322.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">V: [2, 4]</text><text x="66" y="354.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">가중합 6 / 가중치 합 2</text><rect x="642" y="204" width="510" height="220" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="240.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">K·V 블록 B</text><text x="660" y="290.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">점수: [0] → 가중치 [1]</text><text x="660" y="322.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">V: [10]</text><text x="660" y="354.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">가중합 10 / 가중치 합 1</text><path d="M303,438 L303,492" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,438 L897,492" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="509" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="545.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">전체 기준으로 정규화</text><text x="72" y="585.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">(6 + 10) / (2 + 1) = 16 / 3 ≈ 5.33</text><rect x="48" y="653" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="689.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">블록별 평균을 단순 평균하면 다른 값</text><text x="72" y="729.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">(3 + 10) / 2 = 6.5 ≠ 5.33</text></svg>