<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc"><title id="title">Start with prefill, then repeat decode</title><desc id="desc">Prefill computes four input positions p0 p1 p2 p3, leaves KV for four positions in each layer, and selects x0. Decode computes x0 alone, extends KV to five positions, and selects x1. The next decode computes x1 alone, extends KV to six positions, and selects x2. The newly selected output does not yet have its own KV.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1270" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Start with prefill, then repeat decode</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Follow one request’s input, selected output, and KV retained in each layer.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><defs><marker id="flow-write" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#B55B22" stroke-width="2.5"/></marker><marker id="flow-read" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#287D78" stroke-width="2.5"/></marker></defs><text x="48" y="227.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Prefill</text><text x="48" y="265.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">4 input positions</text><rect x="48" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="134" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="172.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="220" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="258.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="306" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="344.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p3</text><path d="M394,315 L484,315" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="494" y="273" width="258" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="623" y="313.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">Model</text><text x="623" y="349.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Compute 4 positions</text><path d="M766,315 L1026,315" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="894" y="294.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">Select next token</text><rect x="1038" y="287" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1081.0" y="324.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="1030" y="390.0" fill="#B55B22" font-size="19" font-weight="400" text-anchor="middle">No KV(x0) yet</text><text x="48" y="444.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">KV cache in each layer</text><text x="48" y="478.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">4 positions after this pass</text><g data-box="494,419,68,74"><rect x="494" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M494,450 H562" stroke="#B55B22"/><text x="528.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="528.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="572,419,68,74"><rect x="572" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M572,450 H640" stroke="#B55B22"/><text x="606.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="606.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="650,419,68,74"><rect x="650" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M650,450 H718" stroke="#B55B22"/><text x="684.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="684.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="728,419,68,74"><rect x="728" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M728,450 H796" stroke="#B55B22"/><text x="762.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="762.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p3</text></g><path d="M623,378 V399 H528 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M623,378 V399 H606 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M623,378 V399 H684 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M623,378 V399 H762 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M11