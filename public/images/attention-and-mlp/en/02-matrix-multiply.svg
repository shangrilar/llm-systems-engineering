<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">Matrix multiplication: combine input components</title><desc id="desc">Multiplying [1,2,-1,0] by the 4×8 matrix gives [-2,1,0.5,-1,3,0,-0.5,2]. Column 3, [2,-1,-0.5,1], and output component 3, 0.5, are highlighted along with the sum of four products. The same matrix applies independently at every token position.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1280" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Matrix multiplication: combine input components</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Each weight-matrix column produces one output component. Here, d = 4 and m = 8.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="600" y="222" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Use one token’s d components to produce m output components.</text><text x="792" y="272" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Weight matrix W · d × m = 4 × 8</text><text x="204" y="377" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Input x · 1 × 4</text><rect x="60.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="96.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="132.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="168.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="204.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="240.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="276.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="312.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><text x="410" y="447" fill="#182C40" font-size="38" font-weight="600" text-anchor="middle">×</text><text x="519.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">1</text><rect x="480" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="480" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="480" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="475" fill="#5C6C7C" font-size="24" fon