<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Ulysses: 토큰 분할을 헤드 분할로 바꿔 계산합니다 · Q·K·V All-to-All</title><desc id="desc">GPU 0은 모든 토큰의 h0, GPU 1은 모든 토큰의 h1의 Q,K,V를 갖는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">Ulysses: 토큰 분할을 헤드 분할로 바꿔 계산합니다</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">가중치 분할이 아니라 Q·K·V와 출력의 재배치 · 이 방식도 원문에서는 Sequence Parallelism으로 부릅니다.</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="40" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="150.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">토큰 분할</text><rect x="273" y="137" width="220" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="383.0" y="166.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">All-to-All</text><rect x="506" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="616.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">헤드별 어텐션</text><rect x="739" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="849.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">역 All-to-All</text><rect x="972" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="1082.0" y="1