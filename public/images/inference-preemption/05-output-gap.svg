<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1118" viewBox="0 0 1200 1118" role="img" aria-labelledby="title desc"><title id="title">중단과 복구가 늘리는 출력 간격</title><desc id="desc">같은 시간축에서 요청 A와 B, 블록 변화, B의 출력 이벤트를 비교한다. B가 x0와 x1을 전달한 뒤 중단해 두 블록을 반환하면 A는 한 블록을 추가하고 KV 9개에서 12개까지 진행한다. A가 완료해 세 블록을 반환하면 B가 세 블록을 배정받아 알려진 9개 토큰으로 KV를 재계산한다. 대기와 재계산 중에는 새 출력이 없으며, 이후 x2와 x3가 전달된다.</desc><metadata>{&quot;id&quot;:&quot;05-output-gap&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">중단과 복구가 늘리는 출력 간격</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">B의 KV를 반환하면 A가 진행할 수 있지만, B의 다음 출력은 대기와 복구를 거친 뒤에 나옵니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="72" y="216" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">재계산 방식의 실행 예시</text><path d="M220,262 L1124.0,262.0" stroke="#5C6C7C" stroke-width="2.5" fill="none"/><path d="M1134,262 L1124.0,266.5 L1124.0,257.5 Z" fill="#5C6C7C"/><text x="1132" y="241" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="end">시간</text><text x="405" y="311" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">B 중단</text><text x="780" y="311" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A 완료</text><path d="M405,324 V908" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="5 6" fill="none"/><path d="M780,324 V908" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="5 6" fill="none"/><text x="72" y="390" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">요청 A</text><text x="72" y="560" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">요청 B</text><rect x="220" y="346" width="185" height="72" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="411" y="346" width="369" height="72" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="312.5" y="390" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">생성</text><text x="592.5" y="390" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">생성 계속</text><text x="312.5" y="457" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">KV 7 → 8</text><text x="312.5" y="486.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2블록</text><text x="592.5" y="457" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">KV 9 → 12 · 3블록</text><text x="966" y="390" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">완료 · 블록 반환</text><rect x="220" y="516" width="185" height="72" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="411" y="516" width="363" height="72" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><rect x="780" y="516" width="204" height="72" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="990" y="516" width="144" height="72" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="312.5" y="560" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">생성</text><text x="592.5" y="560" fill="#5C6C7C" font-size="24" font-weight="700" text-anchor="middle">대기</text><text x="885" y="560" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">KV 재계산</text><text x="1062" y="560" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">생성</text><text x="312.5" y="629" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">KV 7 → 8</text><text x="312.5" y="658.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2블록</text><text x="592.5" y="629" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">GPU KV 없음</text><text x="885" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">완료 시 KV 9개</text><text x="885" y="658.4" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">3블록</text><text x="72" y="722" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">블록 변화</text><rect x="309" y="677" width="192" height="111" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="405" y="715" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B: 2블록 반환</text><text x="405" y="752" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A: 1블록 추가</text><rect x="654" y="677" width="252" height="111" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="780" y="715" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A: 3블록 반환</text><text x="780" y="752" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B: 3블록 배정</text><text x="72" y="872" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B의 출력</text><path d="M220,876 L1124.0,876.0" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M1134,876 L1124.0,880.5 L1124.0,871.5 Z" fill="#287D78"/><rect x="248" y="852" width="52" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="274" y="883" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x0</text><rect x="344" y="852" width="52" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="370" y="883" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x1</text><rect x="964" y="852" width="52" height="48" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="990" y="883" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x2</text><rect x="1059" y="852" width="52" height="48" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1085" y="883" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x3</text><path d="M397,925 V936 H963 V925" stroke="#287D78" stroke-width="2.5" fill="none"/><text x="680" y="978" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">대기 + KV 재계산 동안 새 출력 없음</text></g></g><path d="M48,1040 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1078" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">B의 공간을 회수해 A를 진행시키는 동안, B의 다음 출력에는 대기와 복구 시간이 더해집니다.</text></svg>