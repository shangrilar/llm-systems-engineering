<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="817" viewBox="0 0 1200 817" role="img" aria-labelledby="title desc"><title id="title">When does the CPU wait?</title><desc id="desc">The CPU submits A and B, then waits in a cudaMemcpy call that copies the result from GPU to CPU. Meanwhile, the GPU performs A, B, and the result copy. Once the result is ready in CPU memory, the call returns and the CPU uses the values. The CPU wait and GPU work overlap in time.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="817" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 5 · Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">When does the CPU wait?</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Retrieve results with a GPU → CPU copy call that waits for completion.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="222" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">When the CPU needs the actual values of y</text><path d="M240,254 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="239" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="329" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU</text><text x="48" y="365" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start">Submit / use results</text><rect x="240" y="297" width="176" height="70" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="328.0" y="341.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Submit A, B</text><rect x="448" y="297" width="522" height="70" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="709.0" y="341.0" fill="#5C6C7C" font-size="26" font-weight="600" text-anchor="middle">Wait inside the result-copy call</text><rect x="970" y="297" width="168" height="70" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1054.0" y="341.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Use results</text><text x="449" y="412" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMemcpy(..., cudaMemcpyDeviceToHost)</text><text x="48" y="526" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU work</text><text x="48" y="562" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Compute / copy</text><rect x="320" y="492" width="270" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="455.0" y="544.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Compute A</text><rect x="590" y="492" width="230" height="86" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="705.0" y="544.0" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">Compute B</text><rect x="820" y="492" width="150" height="86" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="895" y="527" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">Copy result</text><text x="895" y="560" fill="#7954A3" font-size="19" font-weight="400" text-anchor="middle">GPU → CPU</text><path d="M970,483 V375" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="971" y="619" fill="#7954A3" font-size="23" font-weight="600" text-anchor="end">Result ready in CPU memory</text><rect x="48" y="661" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="706" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">GPU computation and data transfer continue while the CPU waits.</text><text x="600" y="745" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">The CPU can use the values of y once the result copy finishes.</text></svg>