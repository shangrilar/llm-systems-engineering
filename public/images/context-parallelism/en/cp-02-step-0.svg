="700" text-anchor="middle">Compute Q·K·V from my tokens</text><text x="600" y="453" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">One Q row connects to every allowed K·V position.</text><rect x="238" y="548" width="82" height="82" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="279" y="599.66" font-size="26" fill="#2470BB" font-weight="400" text-anchor="middle">●</text><rect x="320" y="548" width="82" height="82" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="361" y="599.66" font-size="26" fill="#c3cbd2" font-weight="400" text-anchor="middle">—</text><rect x="402" y="548" width="82" height="82" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="443" y="599.66" font-size="26" fill="#c3cbd2" font-weight="400" text-anchor="middle">—</text><rect x="484" y="548" width="82" height="82" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="525" y="599.66" font-size="26" fill="#c3cbd2" font-weight="400" text-anchor="middle">—</text><text x="218" y="600.48" font-size="22" fill="#2470BB" font-weight="700" text-anchor="end">Q(t0)</text><text x="279" y="526" font-size="21" fill="#2470BB" font-weight="700" text-anchor="middle">K(t0)</text><rect x="238" y="630" width="82" height="82" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="279" y="681.66" font-size="26" fill="#2470BB" font-weight="400" text-anchor="middle">●</text><rect x="320" y="630" width="82" height="82" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="361" y="681.66" font-size="26" fill="#2470BB" font-weight="400" text-anchor="middle">●</text><rect x="402" y="630" width="82" height="82" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="443" y="681.66" font-size="26" fill="#c3cbd2" font-weight="400" text-anchor="middle">—</text><rect x="484" y="630" width="82" height="82" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="525" y="681.66" font-size="26" fill="#c3cbd2" font-weight="400" text-anchor="middle">—</text><text x="218" y="682.48" font-size="22" fill="#2470BB" font-weight="700" text-anchor="end">Q(t1)</text><text x="361" y="526" font-size="21" fill="#2470BB" font-weight="700" text-anchor="middle">K(t1)</text><rect x="238" y="712" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="279" y="763.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><rect x="320" y="712" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="361" y="763.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><rect x="402" y="712" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="443" y="763.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><rect x="484" y="712" width="82" height="82" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="525" y="763.66" font-size="26" fill="#c3cbd2" font-weight="400" text-anchor="middle">—</text><text x="218" y="764.48" font-size="22" fill="#B55B22" font-weight="700" text-anchor="end">Q(t2)</text><text x="443" y="526" font-size="21" fill="#B55B22" font-weight="700" text-anchor="middle">K(t2)</text><rect x="238" y="794" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="279" y="845.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><rect x="320" y="794" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="361" y="845.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><rect x="402" y="794" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="443" y="845.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><rect x="484" y="794" width="82" height="82" rx="0" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="525" y="845.66" font-size="26" fill="#B55B22" font-weight="400" text-anchor="middle">●</text><text x="218" y="846.48" font-size="22" fill="#B55B22" font-weight="700" text-anchor="end">Q(t3)</text><text x="525" y="526" font-size="21" fill="#B55B22" font-weight="700" text-anchor="middle">K(t3)</text><rect x="238" y="794" width="328" height="82" rx="2" fill="none" stroke="#B55B22" stroke-width="1.5"/><text x="670" y="583" font-size="25" fill="#B55B22" font-weight="700" text-anchor="start">Example: Q(t3) on GPU 1</text><text x="670" y="629" font-size="22" fill="#2470BB" font-weight="700" text-anchor="start">K·V for t0·t1 → On GPU 0</text><text x="670" y="671" font-size="22" fill="#B55B22" font-weight="700" text-anchor="start">K·V for t2·t3 → On GPU 1</text><text x="670" y="746" font-size="23" fill="#182C40" font-weight="700" text-anchor="start">Using only local tokens</text><text x="670" y="783" font-size="23" fill="#182C40" font-weight="700" text-anchor="start">leaves out earlier context t0·t1.</text><text x="402" y="922" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">● Token pair computed   — Future token: masked</text><rect x="186" y="968" width="828" height="44" rx="10" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><text x="600" y="997" font-size="20" fill="#7954A3" font-weight="700" text-anchor="middle">Ring: circulate K·V blocks / Ulysses: rearrange full context by head</text></g></g><path d="M48,1114 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1152" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The lower-triangular matrix shows the reference range of causal attention.</text></svg>