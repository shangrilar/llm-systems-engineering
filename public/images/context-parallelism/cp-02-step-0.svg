"218" y="764.48" font-size="22" fill="#b55b22" font-weight="700" text-anchor="end">Q(t2)</text><text x="443.0" y="526.0" font-size="21" fill="#b55b22" font-weight="700" text-anchor="middle">K(t2)</text><rect x="238" y="794" width="82" height="82" rx="0" fill="#fff0e3" stroke="#b55b22" stroke-width="1.5"/><text x="279.0" y="845.66" font-size="26" fill="#b55b22" font-weight="400" text-anchor="middle">●</text><rect x="320" y="794" width="82" height="82" rx="0" fill="#fff0e3" stroke="#b55b22" stroke-width="1.5"/><text x="361.0" y="845.66" font-size="26" fill="#b55b22" font-weight="400" text-anchor="middle">●</text><rect x="402" y="794" width="82" height="82" rx="0" fill="#fff0e3" stroke="#b55b22" stroke-width="1.5"/><text x="443.0" y="845.66" font-size="26" fill="#b55b22" font-weight="400" text-anchor="middle">●</text><rect x="484" y="794" width="82" height="82" rx="0" fill="#fff0e3" stroke="#b55b22" stroke-width="1.5"/><text x="525.0" y="845.66" font-size="26" fill="#b55b22" font-weight="400" text-anchor="middle">●</text><text x="218" y="846.48" font-size="22" fill="#b55b22" font-weight="700" text-anchor="end">Q(t3)</text><text x="525.0" y="526.0" font-size="21" fill="#b55b22" font-weight="700" text-anchor="middle">K(t3)</text><rect x="238" y="794" width="328" height="82" rx="2" fill="none" stroke="#b55b22" stroke-width="1.5"/><text x="670" y="583.0" font-size="25" fill="#b55b22" font-weight="700" text-anchor="start">예: GPU 1의 Q(t3)</text><text x="670" y="629.0" font-size="22" fill="#2470bb" font-weight="700" text-anchor="start">t0·t1의 K·V → GPU 0에 있음</text><text x="670" y="671.0" font-size="22" fill="#b55b22" font-weight="700" text-anchor="start">t2·t3의 K·V → GPU 1에 있음</text><text x="670" y="746.0" font-size="23" fill="#183149" font-weight="700" text-anchor="start">로컬 토큰만 계산하면</text><text x="670" y="783.0" font-size="23" fill="#183149" font-weight="700" text-anchor="start">앞선 문맥 t0·t1을 빠뜨립니다.</text><text x="402" y="922.0" font-size="21" fill="#587084" font-weight="400" text-anchor="middle">● 계산하는 토큰 쌍   — 미래 토큰: 마스킹</text><rect x="186" y="968" width="828" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="600.0" y="997.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">Ring: K·V 블록을 순환  /  Ulysses: 전체 문맥을 헤드별로 재배치</text></svg>