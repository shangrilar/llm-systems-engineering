<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1196" viewBox="0 0 1200 1196" role="img" aria-labelledby="title desc"><title id="title">중간 복사를 줄이는 GPUDirect RDMA</title><desc id="desc">GPUDirect RDMA가 지원되는 경로에서 서버 0의 GPU 메모리에 A가 만든 x가 있다. 송신 NIC가 PCIe를 통해 x를 읽고 네트워크로 전달한다. 서버 1의 수신 NIC는 PCIe를 통해 GPU 메모리에 x를 쓴다. 수신 완료 뒤 B가 실행된다. NIC는 네트워크 송수신 장치이며 실제 데이터는 CPU 메모리를 중간 버퍼로 거치지 않는다. 이 그림은 CPU의 제어 참여 여부를 나타내지 않는다.</desc><metadata>{&quot;id&quot;:&quot;02-direct-gpu-memory&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">중간 복사를 줄이는 GPUDirect RDMA</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">NIC가 GPU 메모리에 직접 접근해 CPU 메모리의 중간 버퍼를 거치지 않습니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><rect x="48" y="210" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="250" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">GPUDirect RDMA가 지원되는 환경</text><rect x="48" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">서버 0</text><rect x="632" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">서버 1</text><rect x="96" y="365" width="424" height="82" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308" y="400" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 · 계산 A</text><text x="308" y="435" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">전달할 x 만들기</text><rect x="680" y="365" width="424" height="82" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="892" y="400" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">GPU 1 · 계산 B</text><text x="892" y="435" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">수신이 끝난 뒤 실행</text><rect x="96" y="520" width="424" height="106" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308" y="567" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 메모리</text><text x="308" y="602" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">A가 만든 x = [1, 2, 3, 4]</text><rect x="680" y="520" width="424" height="106" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892" y="567" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">GPU 1 메모리</text><text x="892" y="602" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">수신 버퍼에 x 도착</text><path d="M308,456 V510" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><path d="M892,510 V457" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="176" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308" y="952" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="308" y="987" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">네트워크 송수신</text><rect x="760" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892" y="952" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="892" y="987" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">네트워크 송수신</text><path d="M308,637 V889" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="342" y="698" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">PCIe</text><text x="342" y="738" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">NIC가</text><text x="342" y="774" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">x 읽기</text><path d="M892,889 V637" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="926" y="698" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">PCIe</text><text x="926" y="738" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">NIC가</text><text x="926" y="774" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">x 쓰기</text><path d="M440,958 H749" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="600" y="924" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">네트워크</text><text x="600" y="998" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">x 전달</text></g></g><path d="M48,1118 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1156" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">GPUDirect RDMA를 지원하는 경로입니다. 이 그림은 CPU가 제어에 참여하는지 여부를 나타내지 않습니다.</text></svg>