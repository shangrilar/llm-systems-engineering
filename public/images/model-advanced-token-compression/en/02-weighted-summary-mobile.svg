 y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">positions for each</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">component</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Rows = token positions · Columns =</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">components · Toy projection matrices</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">and values</text><path d="M16,234.79999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 258.79999999999995) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">① Project the same input along two paths</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="120" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle" data-max-width="510">Input vectors H at two positions</text><g data-container="true"><rect x="175" y="160" width="78" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="214" y="194" fill="#657789" font-size="25" font-weight="500" text-anchor="middle" data-max-width="66">1</text></g><g data-container="true"><rect x="263" y="160" width="78" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="302" y="194" fill="#657789" font-size="25" font-weight="500" text-anchor="middle" data-max-width="66">0</text></g><g data-container="true"><rect x="175" y="222" width="78" height="52" rx="4" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="214" y="256" fill="#657789" font-size="25" font-weight="500" text-anchor="middle" data-max-width="66">0</text></g><g d