<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="996" viewBox="0 0 1200 996" role="img" aria-labelledby="title desc"><title id="title">CPU의 요청에서 실제 데이터 전달로</title><desc id="desc">CPU 프로세스 0과 1의 사용자 코드가 NCCL 송신과 수신을 요청한다. NCCL은 요청을 확인하고 실행할 작업을 구성한다. 주황 점선은 각 GPU에서 실행할 작업의 등록이며 파란 실선은 GPU 0 메모리의 x가 GPU 1 메모리로 전달되는 관계다. 하나의 호출이 하나의 커널과 일대일 대응한다는 의미는 아니다.</desc><metadata>{&quot;id&quot;:&quot;01-call-and-transfer&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">CPU의 요청에서 실제 데이터 전달로</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">CPU가 통신 작업을 구성해 등록하면, 그 작업이 GPU의 데이터를 전달합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><path d="M70,216 H150" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><text x="170" y="224" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">요청·상태</text><path d="M400,216 H480" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="500" y="224" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="start">데이터 이동</text><rect x="48" y="266" width="520" height="298" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="307" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">프로세스 0 · CPU 코드</text><rect x="76" y="330" width="464" height="86" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="308" y="367" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">사용자 코드: 송신 요청</text><text x="308" y="402" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">ncclSend(...)</text><path d="M308,425 V449" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="76" y="462" width="464" height="76" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="308" y="509" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">NCCL: 요청 확인 · 작업 구성</text><rect x="48" y="678" width="520" height="198" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="718" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0</text><rect x="96" y="750" width="424" height="100" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308" y="794" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">통신 작업 · 송신</text><text x="308" y="829" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">GPU 메모리의 x 보내기</text><path d="M308,549 V739" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><text x="328" y="625" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">작업 등록</text><rect x="632" y="266" width="520" height="298" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="307" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">프로세스 1 · CPU 코드</text><rect x="660" y="330" width="464" height="86" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="892" y="367" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">사용자 코드: 수신 요청</text><text x="892" y="402" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">ncclRecv(...)</text><path d="M892,425 V449" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="660" y="462" width="464" height="76" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="892" y="509" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">NCCL: 요청 확인 · 작업 구성</text><rect x="632" y="678" width="520" height="198" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="718" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1</text><rect x="680" y="750" width="424" height="100" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892" y="794" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">통신 작업 · 수신</text><text x="892" y="829" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">GPU 메모리에 x 받기</text><path d="M892,549 V739" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><text x="912" y="625" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">작업 등록</text><path d="M520,800 H668" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="600" y="775" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="middle">x 전달</text></g></g><path d="M48,918 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="956" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">주황 점선은 작업 등록, 파란 실선은 데이터 전달입니다. 호출 하나가 커널 하나와 일대일로 대응한다는 뜻은 아닙니다.</text></svg>