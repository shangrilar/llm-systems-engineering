<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1596" viewBox="0 0 1200 1596" role="img" aria-labelledby="title desc"><title id="title">Reducing Intermediate Matrix Traffic</title><desc id="desc">On the left, score matrix S and probability matrix P are stored in HBM and reread in subsequent stages. FlashAttention on the right reads input tiles and computes scores, exponentials, and Value weighted sums on chip. For each Q tile it traverses K/V tiles, keeps m,l,a, and writes the final output. This conceptual forward path omits caches and saved backward statistics. Not all global-memory accesses imply HBM transfers. Quadratic operation count does not become linear.</desc><metadata>{&quot;id&quot;:&quot;04-memory-traffic&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Reducing Intermediate Matrix Traffic</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Connect both matrix multiplies and softmax in small tiles, avoiding large intermediates.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="209" width="536" height="959" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="245" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">Basic attention</text><text x="316" y="277" fill="#B55B22" font-size="20" font-weight="500" text-anchor="middle">Store and read intermediate matrices</text><rect x="78" y="292" width="476" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="335" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · Inputs Q / K / V</text><path d="M316,376 L316,423" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#arrow-orange)"/><text x="333" y="404" fill="#B55B22" font-size="20" font-weight="400" text-anchor="start">Read inputs</text><rect x="98" y="443" width="436" height="65" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="483.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">QKᵀ · Compute scores</text><rect x="98" y="673" width="436" height="65" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="713.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Softmax</text><rect x="98" y="903" width="436" height="65" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="943.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">PV · Compute output</text><path d="M316,518 L316,541" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="78" y="550" width="476" height="67" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="591.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">HBM · Large score matrix S</text><path d="M316,627 L316,660" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#arrow-orange)"/><text x="344" y="653" fill="#B55B22" font-size="19" font-weight="400" text-anchor="start">Read again</text><path d="M316,748 L316,771" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#arrow-orange)"/><rect x="78" y="780" width="476" height="67" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="821.5" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">HBM · Large probability matrix P</text><path d="M316,857 L316,890" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#arrow-orange)"/><text x="344" y="883" fill="#B55B22" font-size="19" font-weight="400" text-anchor="start">Read again</text><path d="M316,980 L316,1064" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="78" y="1080" width="476" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="1119" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · Final output O</text><rect x="616" y="209" width="536" height="959" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="245" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">FlashAttention</text><text x="884" y="277" fill="#287D78" font-size="20" font-weight="500" text-anchor="middle">Compute and accumulate in tiles</text><rect x="646" y="292" width="476" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="335" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · Inputs Q / K / V</text><path d="M884,376 L884,423" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><text x="901" y="404" fill="#287D78" font-size="20" font-weight="400" text-anchor="start">Read tiles</text><rect x="646" y="443" width="476" height="530" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="884" y="489" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">On-chip memory · Tile execution</text><rect x="674" y="519" width="420" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="558" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">QKᵀ → Scale and mask</text><path d="M884,592 L884,619" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="674" y="637" width="420" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="676" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Update m · Apply exp · Update ℓ</text><path d="M884,710 L884,737" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="674" y="755" width="420" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="794" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Rescale a + accumulate exp × V</text><text x="884" y="863" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">Keep m, ℓ, a → Next K/V tile</text><text x="884" y="925" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">After all tiles: O = a ÷ ℓ</text><path d="M884,985 L884,1064" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><text x="902" y="1032" fill="#287D78" font-size="20" font-weight="400" text-anchor="start">Write final output</text><rect x="646" y="1080" width="476" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="1119" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · Final output O</text><rect x="48" y="1206" width="1104" height="149" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1256" fill="#287D78" font-size="30" font-weight="700" text-anchor="middle">Avoid storing and rereading large S and P matrices.</text><text x="600" y="1307" fill="#287D78" font-size="24" font-weight="400" text-anchor="middle">Compute and consume each score tile. Keep m, ℓ, and a across tiles.</text><text x="600" y="1404" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">Conceptual forward path · On-chip storage includes shared memory and registers</text><text x="600" y="1438" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">Caches and saved backward statistics omitted · Dense attention remains quadratic</text></g></g><path d="M48,1488 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1526" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Instead of storing the large S and P matrices, scores, exponentials, and weighted sums are computed</text><text x="48" y="1555.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">together within each tile.</text></svg>