<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title desc"><title id="title">SP와 CP는 어디까지 토큰을 나눠 처리할까요? · SP와 CP의 분할 범위</title><desc id="desc">SP와 TP의 결합은 정규화에서 토큰을 나누고 어텐션과 FFN에서는 모든 토큰의 일부 특징을 계산한다. CP 단독은 토큰을 나눠 맡고 어텐션에서 타 GPU 정보와 연결한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1530" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">SP와 CP는 어디까지 토큰을 나눠 처리할까요?</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">행 = 토큰 · 열 = 특징   |   기본 순전파, TP와 CP를 결합한 경우는 생략</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="48" y="146" width="528" height="1180" rx="10" fill="white" stroke="#d8e2ea" stroke-width="1.5"/><text x="312" y="186.0" font-size="28" fill="#183149" font-weight="700" text-anchor="middle">SP + TP</text><text x="312" y="225.0" font-size="19" fill="#587084" font-weight="400" text-anchor="middle">Megatron SP · 가중치는 TP로 분할</text><text x="312" y="282.0" font-size="24" fill="#183149" font-weight="700" text-anchor="middle">정규화</text><rect x="95" y="316" width="192" height="180" rx="10" fill="#eaf3fd" stroke="#2470bb" stroke-width="1.5"/><text x="191" y="347.0" font-size="21" fill="#2470bb" font-weight="700" text-anchor="middle">GPU 0</text><rect x="139" y="400" width="26" height="26" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="165" y="400" width="26" height="26" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="191" y="400" width="26" height="26" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="217" y="400" width="26" height="