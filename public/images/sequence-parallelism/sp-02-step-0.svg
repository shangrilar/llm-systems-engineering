<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">토큰을 나누되, 한 토큰의 특징은 모두 갖습니다 · 토큰별 정규화와 잔차</title><desc id="desc">4×4 입력의 두 행씩을 GPU에 배치한다. 각 GPU에 한 토큰의 특징 네 개가 모두 있어 RMSNorm과 대응 토큰의 잔차 덧셈을 독립적으로 수행한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1150" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">토큰을 나누되, 한 토큰의 특징은 모두 갖습니다</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">SP 구간의 예: RMSNorm과 잔차 연결 · 파랑 t0·t1 / 주황 t2·t3</text><path d="M40,112 H1160" stroke="#d8e2ea"/><text x="600" y="156.0" font-size="24" fill="#183149" font-weight="700" text-anchor="middle">같은 입력 X를 토큰 행으로 나눕니다</text><rect x="504" y="212" width="48" height="48" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="528.0" y="245.12" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">1</text><rect x="552" y="212" width="48" height="48" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="576.0" y="245.12" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">2</text><rect x="600" y="212" width="48" height="48" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="624.0" y="245.12" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">3</text><rect x="648" y="212" width="48" height="48" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="672.0" y="245.12" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">4</text><rect x="504" y="260" width="48" height="48" fill="#eaf3fd" stroke="#2470bb