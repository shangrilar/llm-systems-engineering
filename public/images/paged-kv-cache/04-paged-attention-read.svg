<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1133" viewBox="0 0 1200 1133" role="img" aria-labelledby="title desc"><title id="title">흩어진 KV로 Attention 계산하기</title><desc id="desc">B의 블록 테이블은 L0를 P3, L1을 P0, L2를 P5에 연결합니다. 현재 입력 위치 8의 Q는 P3의 4개, P0의 4개, P5의 1개 KV로 하나의 Attention 결과를 계산합니다. C의 KV, 빈 P2, P5의 미사용 칸은 제외합니다.</desc><metadata>{&quot;id&quot;:&quot;04-paged-attention-read&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">흩어진 KV로 Attention 계산하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">블록 테이블로 저장 위치를 찾고, 현재 Q와 같은 요청의 KV를 함께 사용합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><rect x="48" y="203" width="1104" height="116" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="72" y="242" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">B의 블록 테이블</text><text x="72" y="286" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">L0 → P3  ·  L1 → P0  ·  L2 → P5</text><text x="48" y="368" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">물리 블록 풀에서 B의 유효한 KV 9개를 참조</text><text x="48" y="409" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">색이 있는 칸 = 읽는 KV · 회색 = 읽지 않는 공간</text><text x="48" y="465" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">P0 · B</text><rect x="48" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="65" y="522" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="86" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="103" y="522" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="124" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="141" y="522" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">6</text><rect x="162" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="179" y="522" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">7</text><text x="232" y="465" fill="#8191A0" font-size="24" font-weight="700" text-anchor="start">P1 · C</text><rect x="232" y="489" width="34" height="52" rx="5" fill="#F1F4F7" stroke="#B7C0C8" stroke-width="1.5"/><text x="249" y="522" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">0</text><path d="M237,536 L261,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="270" y="489" width="34" height="52" rx="5" fill="#F1F4F7" stroke="#B7C0C8" stroke-width="1.5"/><text x="287" y="522" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">1</text><path d="M275,536 L299,494" stroke="#A9B3BC" stroke-width="1.4"/><rec