="316" y="878" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">A의 같은 행을 다시 사용</text><rect x="616" y="676" width="536" height="235" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="644" y="723" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">같은 출력 열을 계산할 때</text><text x="644" y="773" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">c00 = A의 0행 · B의 0열</text><text x="644" y="815" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">c10 = A의 1행 · B의 0열</text><text x="884" y="878" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">B의 같은 열을 다시 사용</text><text x="600" y="973" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">출력을 묶어 계산하면, 함께 필요한 입력을 재사용할 수 있습니다.</text></svg>