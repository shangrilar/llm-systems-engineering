<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1513" viewBox="0 0 1200 1513" role="img" aria-labelledby="title desc"><title id="title">Router: select experts and compute weights</title><desc id="desc">An 8-by-4 router projection gives token 1 four scores [1,0,2,-1]. E1 and E3 are selected, then Softmax assigns weights of approximately 0.269 and 0.731.</desc><metadata>{&quot;id&quot;:&quot;02-router&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Router: select experts and compute weights</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Token 1 · d = 8 · 4 experts · Top-2</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><text x="48" y="238" fill="#182C40" font-size="28" font-weight="600" text-anchor="start">1. Compute a score for each expert</text><rect x="48" y="270" width="1104" height="120" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="313" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Router projection</text><text x="600" y="358" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">x₁ (1 × 8)  ×  Wᵣ (8 × 4)  =  r₁ (1 × 4)</text><rect x="48" y="435" width="240" height="110" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="168" y="470" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Expert 1</text><text x="168" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">1</text><rect x="336" y="435" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="456" y="470" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Expert 2</text><text x="456" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">0</text><rect x="624" y="435" width="240" height="110" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="744" y="470" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Expert 3</text><text x="744" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">2</text><rect x="912" y="435" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1032" y="470" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Expert 4</text><text x="1032" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">-1</text><text x="48" y="630" fill="#182C40" font-size="28" font-weight="600" text-anchor="start">2. Top-2: select the two highest scores</text><rect x="180" y="680" width="350" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="355" y="726" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Expert 1 (score 1)</text><rect x="670" y="680" width="350" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="845" y="726" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Expert 3 (score 2)</text><path d="M600,781 L600,820" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><text x="48" y="875" fill="#182C40" font-size="28" font-weight="600" text-anchor="start">3. Apply Softmax to the selected scores</text><rect x="70" y="920" width="495" height="97" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="317.5" y="978" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">E1: e¹ / (e¹ + e²) ≈ 0.269</text><rect x="635" y="920" width="495" height="97" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="882.5" y="978" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">E3: e² / (e¹ + e²) ≈ 0.731</text><text x="600" y="1090" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Weights for each expert</text><rect x="48" y="1120" width="240" height="110" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="168" y="1155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Expert 1</text><text x="168" y="1202" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">0.269</text><rect x="336" y="1120" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="456" y="1155" fill="#657789" font-size="22" font-weight="600" text-anchor="middle">Expert 2</text><text x="456" y="1202" fill="#657789" font-size="30" font-weight="600" text-anchor="middle">0</text><rect x="624" y="1120" width="240" height="110" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="744" y="1155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Expert 3</text><text x="744" y="1202" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">0.731</text><rect x="912" y="1120" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1032" y="1155" fill="#657789" font-size="22" font-weight="600" text-anchor="middle">Expert 4</text><text x="1032" y="1202" fill="#657789" font-size="30" font-weight="600" text-anchor="middle">0</text><rect x="48" y="1290" width="1104" height="100" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1331" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Send this token’s input to the selected experts.</text><text x="600" y="1369" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Combine their outputs using the weights above.</text></g></g><path d="M48,1435 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1473" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Illustrative scores. This example applies Softmax to the Top-2 selected scores.</text></svg>