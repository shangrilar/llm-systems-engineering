<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1188" viewBox="0 0 1200 1188" role="img" aria-labelledby="title desc"><title id="title">Time to Finish Communication and Compute</title><desc id="desc">An example where sharing SM resources with communication slows independent computation C. Using CE for a supported copy can reduce this contention and let C finish earlier. Transfer volume, computation and communication time are equal. Overall completion means both communication and C have finished. CE still uses memory and link bandwidth; this is an illustration, not a measurement or guaranteed improvement.</desc><metadata>{&quot;id&quot;:&quot;hardware-14-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Time to Finish Communication and Compute</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">With equal communication time, less SM contention can let C finish earlier.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(0.9857142857142858)" data-panel="1"><rect x="8" y="10" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="560" y="50" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle" data-max-width="1080">Same transfer and C · Case where SM contention slows computation</text><text x="8" y="121" fill="#182C40" font-size="28" font-weight="700" text-anchor="start" data-max-width="1100">Communication and compute share SMs</text><path d="M210 165 L1102 165" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="1102" y="150" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end" data-max-width="200">Time →</text><text x="8" y="228" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="186">Comm. (SM)</text><rect x="210" y="190" width="450" height="58" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="435" y="228" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle" data-max-width="434">Same communication time</text><text x="8" y="340" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="186">Compute C</text><rect x="210" y="302" width="780" height="58" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="340" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="764">Compute on SMs</text><path d="M660 258 L660 270" stroke="#4C60A8" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="680" y="277" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="start" data-max-width="260">Comm. complete</text><path d="M990 370 L990 388" stroke="#287D78" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="990" y="418" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="260">Overall completion</text><text x="8" y="516" fill="#182C40" font-size="28" font-weight="700" text-anchor="start" data-max-width="1100">CE copies while SMs compute</text><path d="M210 560 L1102 560" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="1102" y="545" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end" data-max-width="200">Time →</text><text x="8" y="623" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="186">Comm. (CE)</text><rect x="210" y="585" width="450" height="58" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="435" y="623" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle" data-max-width="434">Same communication time</text><text x="8" y="735" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="186">Compute C</text><rect x="210" y="697" width="580" height="58" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="500" y="735" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="564">Compute on SMs</text><path d="M660 653 L660 665" stroke="#4C60A8" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="680" y="672" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="start" data-max-width="260">Comm. complete</text><path d="M790 765 L790 783" stroke="#287D78" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="790" y="813" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="260">Overall completion</text></g><path d="M48,1079.857142857143 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1117.857142857143" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Communication time and work are the same in both cases. CE also uses memory and link bandwidth, so</text><text x="48" y="1147.257142857143" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">improvement is not guaranteed; this is not a measurement.</text></svg>