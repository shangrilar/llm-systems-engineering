<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1025" viewBox="0 0 1200 1025" role="img" aria-labelledby="title desc"><title id="title">B의 KV를 회수해 A 진행시키기</title><desc id="desc">첫 장면에서 B를 실행에서 제외해도 A와 B의 블록 두 개씩이 그대로 남아 가용 블록은 없다. B의 독점 블록 두 개를 반환하면 두 블록이 빈다. A에 하나를 배정하고 다음 입력의 KV를 쓰면 A는 KV 9칸을 세 블록에 보유하고 한 블록이 남는다. B는 이력을 보존하고 재개를 기다린다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1025" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">B의 KV를 회수해 A 진행시키기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">실행을 쉬게 해도 KV는 남습니다. 블록을 반환해야 다른 요청이 쓸 수 있습니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">같은 풀: A 2블록 + B 2블록 · B의 토큰 이력은 계속 보존</text><rect x="48" y="246" width="340" height="615" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="68" y="285.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">1. B 실행만 보류</text><text x="68" y="334.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">A · 공간 부족</text><text x="68" y="369.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="start">B · 이번 실행 제외</text><rect x="63" y="410" width="152" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="75" y="440.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">P0 · A</text><rect x="75" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="89.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="108" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="122.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="141" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="155.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="174" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="188.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="223" y="410" width="152" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="235" y="440.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">P1 · A</text><rect x="235" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="249.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="268" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="282.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="301" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="315.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">6</text><rect x="334" y="456" width="29" height="42" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="348.5" y="484.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">7</text><rect x="63" y="553" width="152" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="75" y="583.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="start">P2 · B</text><rect x="75" y="599" width="29" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><tex