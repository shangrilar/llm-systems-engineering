 · Current token</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">p₂</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">1. Associate a Value with a Key</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="200" y="95" width="120" height="60" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="260" y="133" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">p₂</text><path d="M260 165 L260 190" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M120 190 L400 190" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M120 190 L120 225" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M400 190 L400 225" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="20" y="240" width="200" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="120" y="278" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">Key k₂</text><rect x="300" y="240" width="200" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="400" y="278" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">Value v₂</text><text x="120" y="347" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle" data-max-width="220">Retrieval cue</text><text x="400" y="347" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="220">Content to write</text><path d="M120 365 L120 390" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M120 390 L230 390" stroke="#2470BB" stroke-width="2" fill="no