<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1339" viewBox="0 0 1200 1339" role="img" aria-labelledby="title desc"><title id="title">Build all prompt memory, then compute the position needed for the first output</title><desc id="desc">Self1 and Self2 execute all four columns p0–p3. Cross3 and Cross4 have dashed skipped cells at p0–p2 and active read cells only at p3. The p3 output selects x4. Separate notes explain the lack of global-KV dependence on past cross outputs and processing the selected token on the next step.</desc><metadata>{&quot;id&quot;:&quot;yoco-04&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;YOCO §2.3, prefill early exit&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.05254v1#S2.SS3&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report §2.2 and §3.2.2&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4 · Prefill work</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Build all prompt memory, then compute the position needed for</text><text x="48" y="149.4" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">the first output</text><text x="48" y="191.4" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">YOCO · Prompt p0–p3 · Only the first generated token x₄ is required · Cells show layer-position</text><text x="48" y="223.6" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">work</text><path d="M48,252.6 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 288.6) scale(1)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1104">YOCO: prepare the first output</text><path d="M0 68 L1104 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="330" y="139" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle" data-max-width="365">Prompt</text><text x="194" y="208" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p0</text><text x="280" y="208" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p1</text><text x="366" y="208" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p2</text><text x="452" y="208" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p3</text><text x="131" y="285" fill="#2470BB" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Self 1</text><rect x="155" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="194" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><rect x="241" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><rect x="327" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="366" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><rect x="413" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="452" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><text x="131" y="395" fill="#2470BB" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Self 2</text><rect x="155" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="194" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><rect x="241" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><rect x="327" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="366" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><rect x="413" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="452" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Run</text><text x="131" y="595" fill="#287D78" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Cross 3</text><rect x="155" y="550" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="194" y="594" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Skip</text><rect x="241" y="550" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="280" y="594" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Skip</text><rect x="327" y="550" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="366" y="594" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Skip</text><rect x="413" y="550" width="78" height="74" rx="9" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="452" y="594" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Read</text><text x="131" y="705" fill="#287D78" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Cross 4</text><rect x="155" y="660" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="194" y="704" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Skip</text><rect x="241" y="660" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="280" y="704" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Skip</text><rect x="327" y="660" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="366" y="704" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Skip</text><rect x="413" y="660" width="78" height="74" rx="9" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="452" y="704" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">Read</text><text x="260" y="487" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">Global KV for p0–p3 is ready</text><path d="M452 744 L452 810" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="400" y="820" width="104" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="452" y="858" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="92">x₄</text><text x="260" y="943" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">At p3, read all memory and select x₄</text><g data-container="true"><rect x="600" y="210" width="480" height="175" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="616" y="241" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">When skipping is valid</text><text x="616" y="281" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Past late-layer outputs are not required to</text><text x="616" y="309" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">build later global KV.</text></g><g data-container="true"><rect x="600" y="425" width="480" height="233" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="616" y="456" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">When generation continues</text><text x="616" y="496" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Selected x₄ is the next input. It then</text><text x="616" y="524" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">traverses both halves and adds new KV.</text></g></g></svg>