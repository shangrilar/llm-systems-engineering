<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1044" viewBox="0 0 1200 1044" role="img" aria-labelledby="title desc"><title id="title">Shared KV, fresh attention in every layer</title><desc id="desc">Matched Full, Reindex and Reuse diagrams. Later layers share global main KV and indexer K from Full. Reindex uses its own indexer Q within a shared candidate pool; Reuse also reuses the latest Full or Reindex selection. Every mode computes attention with its own main Q and local KV.</desc><metadata>{&quot;id&quot;:&quot;ced-06&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek Figures 4–5&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1#S2.F4&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 5 · Three modes</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Shared KV, fresh attention in every layer</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Matched layouts · Solid: fresh · Dashed: reused · Illustrative Top-2</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(0.6814814814814815)" data-panel="1"><g transform="translate(0 0)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Full</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="100" width="480" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="131" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Global main KV + Indexer K</text><text x="36" y="171" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">NEW · E → Main KV → Indexer K</text></g><path d="M260 230 L260 270" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="280" width="480" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="36" y="311" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Layer h → Indexer Q → Scores</text><text x="36" y="351" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Search the full causal range</text></g><path d="M260 415 L260 455" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="20" y="465" width="480" height="120" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="36" y="496" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Top-2 [p0, p3]</text><text x="36" y="536" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">NEW position IDs, not KV values</text></g><path d="M260 595 V620 H385 V635" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container=