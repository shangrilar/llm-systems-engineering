nchor="start" data-max-width="328">CSA2 builds the indexer key</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">from the main KV</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">CSA: two compressors from X · CSA2:</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">one compressor and one projection</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(1)" data-panel="1"><text x="8" y="22" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="320">rows = tokens or entries · red = indexer</text><text x="8" y="60" fill="#182C40" font-size="19" font-weight="700" text-anchor="start" data-max-width="318"><tspan>CSA · two compressors</tspan></text><g data-path="m" transform="translate(0 80)"><text x="116" y="24" fill="#182C40" font-size="19" font-weight="600" text-anchor="start" data-max-width="212"><tspan>main KV</tspan></text><rect x="78" y="44" width="44" height="30" rx="6" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="100" y="65" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle" data-max-width="40"><tspan>X</tspan></text><g data-matrix="W^{KV}_{comp}"><rect x="140" y="136" width="80" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="180" y="124" fill="#7954A3" font-size="20" font-weight="600" text-anchor="middle" data-max-width="200"><tspan>W</tspan><tspan dy="-7.6" font-size="14">KV</tspan><tspan dy="12" dx="-16" font-size="14">comp</tspan></text><text x="180" y="203" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[D, 2c]</tspan></text><path d="M140 160 L118 160" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-