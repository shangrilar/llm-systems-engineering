<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">Check three different budgets before admission</title><desc id="desc">Three requests and eight execution tokens fit their limits, but 26 KV positions exceed capacity 24. Deferring C lets A and B execute two tokens and store 20 KV positions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1030" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Check three different budgets before admission</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">KV uses a simplified token-slot model; block rounding and sharing are omitted.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="195" width="174" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Candidate</text><rect x="228" y="195" width="258" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">New work</text><rect x="492" y="195" width="288" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Tokens this step</text><rect x="786" y="195" width="360" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Stored KV positions</text><rect x="48" y="268" width="174" height="82" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">A</text><rect x="228" y="268" width="258" height="82" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Decode</text><rect x="492" y="268" width="288" height="82" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">1</text><rect x="786" y="268" width="360" height="82" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">7 → 8</text><rect x="48" y="358" width="174" height="82" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">B</text><rect x="228" y="358" width="258" height="82" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Decode</text><rect x="492" y="358" width="288" height="82" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">1</text><rect x="786" y="358" width="360" height="82" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">11 → 12</text><rect x="48" y="448" width="174" height="82" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">C</text><rect x="228" y="448" width="258" height="82" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Prefill</text><rect x="492" y="448" width="288" height="82" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">6</text><rect x="786" y="448" width="360" height="82" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">0 → 6</text><g data-panel="true"><rect x="48" y="589" width="352" height="187" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="625.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Request count</text><text x="68" y="673.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">3 / 3</text></g><text x="68" y="745.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Fits</text><g data-panel="true"><rect x="424" y="589" width="352" height="187" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="444" y="625.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Step token budget</text><text x="444" y="673.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">8 / 8</text></g><text x="444" y="745.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="start">1 + 1 + 6: fits</text><g data-panel="true"><rect x="800" y="589" width="352" height="187" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="820" y="625.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV capacity</text><text x="820" y="673.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">26 / 24</text></g><text x="820" y="745.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">8 + 12 + 6: does not fit</text><path d="M600,800 L600,848" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="871" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="906.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Run A and B this step; keep C waiting</text><text x="72" y="948.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">2 tokens execute; KV occupies 20/24 afterward. These limits count different</text><text x="72" y="980.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">things.</text></g></svg>