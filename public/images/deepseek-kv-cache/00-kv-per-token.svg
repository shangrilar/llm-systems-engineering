><rect x="0" y="314" width="286.2" height="18" rx="3" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="350" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">69,120 B · MHA의 약 1/57</text><text x="0" y="372" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">BF16</text><text x="0" y="410" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">V3.2 · 61층</text><rect x="0" y="420" width="270.3" height="18" rx="3" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="456" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">48,068 B · MHA의 약 1/82</text><text x="0" y="478" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">KV FP8·RoPE BF16: 656 B · 검색용 key FP8: 132 B</text><text x="0" y="516" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">V4-Flash · 43층</text><rect x="0" y="526" width="156.4" height="18" rx="3" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="562" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">3,563 B · MHA의 약 1/1,104</text><text x="0" y="584" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">KV FP8·RoPE BF16: 584 B · 검색용 key FP4: 68 B · 페이지 패딩 포함</text><text x="0" y="606" fill="#B55B22" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">+ 별도: local KV (SWA, 최근 128위치) 약 3.2 MB</text><text x="0" y="644" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">V4.1-Flash · 40층</text><rect x="0" y="654" width="95.7" height="18" rx="3" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="690" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">890 B · MHA의 약 1/4,418</text><text x="0" y="712" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">KV FP4: 288 B · 검색용 key FP4: 68 B</text><text x="0" y="734" fill="#B55B22" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">+ 별도: local KV (SWA, 최근 128위치) 약 2.7 MB</text><text x="0" y="780" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="80">100 B</text><text x="100.8" y="780" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="80">1 kB</text><text x="201.6" y="780" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="80">10 kB</text><text x="302.4" y="780" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="80">100 kB</text><text x="403.2" y="780" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="80">1 MB</text><text x="504" y="780" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="end" data-max-width="80">10 MB</text><text x="0" y="810" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="528">로그 눈금: 한 칸에 10배, 왼쪽 끝은 100 B입니다.</text><text x="0" y="835.6" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="528">형식 줄의 bytes는 캐시 항목 하나의 크기이며 scale을 포함합니다.</text></g><g transform="translate(624 206) scale(1)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="528">읽기: 토큰 하나 생성</text><path d="M0 68 L528 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="0" y="96" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="528">문맥 131,072토큰 · 모든 층 · BF16 환산</text><rect x="0" y="116" width="22" height="14" rx="3" fill="#2470BB" fill-opacity=".85"/><text x="30" y="128" fill="#182C40" font-size="15" font-weight="400" text-anchor="start" data-max-width="498">attention이 읽는 KV</text><rect x="0" y="140" width="22" height="14" rx="3" fill="#B34242" fill-opacity=".85"/><text x="30" y="152" fill="#182C40" font-size="15" font-weight="400" text-anchor="start" data-max-width="498">위치를 고르려고 읽는 검색용 key</text><path d="M504 176 L504 758" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M403.2 176 L403.2 758" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M302.4 176 L302.4 758" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M201.6 176 L201.6 758" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M100.8 176 L100.8 758" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M0 176 L0 758" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="0" y="198" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">가상 MHA · 60층</text><rect x="0" y="208" width="475.0" height="18" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="244" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">515 GB · KV</text><text x="0" y="304" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">V2 · 60층</text><rect x="0" y="314" width="298.1" height="18" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="350" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">9.06 GB · KV</text><text x="0" y="410" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">V3.2 · 61층</text><rect x="0" y="420" width="15.5" height="18" fill="#2470BB" fill-opacity="0.9"/><rect x="15.5" y="420" width="220.4" height="18" fill="#B34242" fill-opacity="0.9"/><text x="0" y="456" fill="#182C40" font-size="16" font-weight="700" text-anchor="start" data-max-width="528">2.19 GB · KV 144 MB + 검색용 key 2.05 GB</text><text x="0" y="516" fill="#182C40" font-size="17" font-weight="700" text-anchor="start" data-max-width="528">V4-Flash · 43층</text><rect x="0" y="526" width="23.6" height="18" fill="#2470BB" fill-opacity="0.9"/><rect x="23.6" y="526" width="110.5" height="18" fill="#B34242" fill-opacity="0.9"/><text x="0" y="562" fill="#182C40" font