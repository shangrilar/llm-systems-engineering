"/><path d="M48,552 V566 H196 V552 M122.0,566 V650" fill="none" stroke="#287D78" stroke-width="2.5"/><path d="M600,552 V566 H748 V552 M674.0,566 V650" fill="none" stroke="#287D78" stroke-width="2.5"/><path d="M968,552 V566 H1002 V552 M985.0,566 V650" fill="none" stroke="#287D78" stroke-width="2.5"/><path d="M122,650 H985" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M590,650 L590.0,727.0" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M590,737 L585.5,727.0 L594.5,727.0 Z" fill="#287D78"/><text x="625" y="704" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">KV 9개</text><rect x="48" y="753" width="248" height="124" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="172" y="801" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">현재 Q</text><text x="172" y="846" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">입력 위치 8</text><path d="M306,815 L397.0,815.0" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M407,815 L397.0,819.5 L397.0,810.5 Z" fill="#2470BB"/><g data-panel="true"><rect x="420" y="753" width="340" height="124" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="590" y="805" fill="#182C40" font-size="30" font-weight="700" text-anchor="middle">Attention</text><text x="590" y="848" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">유효한 KV 전체로 계산</text></g><path d="M773,815 L895.0,815.0" stroke="#5C6C7C" stroke-width="2.5" fill="none"/><path d="M905,815 L895.0,819.5 L895.0,810.5 Z" fill="#5C6C7C"/><rect x="918" y="753" width="234" height="124" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1035" y="821" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">하나의 결과</text><text x="48" y="949" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">KV는 각자의 블록에 둔 채로 읽습니다.</text><text x="48" y="994" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">C의 KV와 P5의 미사용 3칸은 계산 대상에서 제외합니다.</text></g></g><path d="M48,1055 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1093" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">현재 Q는 같은 요청의 유효한 KV 9개를 사용하며, 다른 요청과 미사용 칸은 제외합니다.</text></svg>