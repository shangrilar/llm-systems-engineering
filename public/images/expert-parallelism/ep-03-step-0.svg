<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc"><title id="title">여러 Expert의 결과도 같은 토큰으로 돌아오기</title><desc id="desc">GPU0의 A2가 E0과 원격 GPU1의 E2를 선택한다. 두 결과 u0/u2를 GPU0에서 0.7/0.3으로 가중합해 y(A2)를 만든다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1440" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">여러 Expert의 결과도 같은 토큰으로 돌아오기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A2의 Router: E0 0.7, E2 0.3 선택</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="205" width="480" height="1120" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="1120" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A2의 출발 GPU</text><rect x="218.0" y="313" width="140" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="288" y="342.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><text x="912" y="314.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">다른 토큰의 흐름은 생략</text><path d="M288,365 L288,388" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="78.0" y="397" width="420" height="106" rx="10" fill="#edf7f5" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="431.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="288" y="465.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">E0: 0.7     E2: 0.3</text><rect x="82" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="180" y="736.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E0</text><rect x="298" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="396" y="736.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E1</text><rect x="706" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="804" y="736.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E2</text><rect x="922" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="1020" y="736.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E3</text><text x="396" y="817.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">A2는 선택 안 함</text><text x="1020" y="817.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">A2는 선택 안 함</text><text x="180" y="817.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">A2가 선택한 Expert</text><text x="804" y="817.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">A2가 선택한 Expert</text><rect x="68.0" y="1098" width="440" height="137" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="1132.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">GPU0 · A2의 결과 결합</text><text x="288" y="1166.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">두 출력이 모두 필요</text><text x="600" y="1390.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">다른 토큰끼리 합치지 않습니다. 같은 A2에서 나온 두 결과만 결합합니다.</text></svg>