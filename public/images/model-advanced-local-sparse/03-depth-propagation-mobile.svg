<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1238" viewBox="0 0 360 1238" role="img" aria-labelledby="title desc"><title id="title">먼 위치의 정보도 중간 위치를 거쳐 전달됩니다</title><desc id="desc">가로축은 위치 0부터 7, 세로축은 아래 L0에서 위 L3로 증가하는 층 깊이다. L3,p7의 조상 위치만 강조하며 주황 경로는 L0,p1에서 L1,p3, L2,p5를 거쳐 L3,p7로 이어진다. 모바일은 그 경로를 세로로 펼친다. 아래 표에서 p7의 L0 입력 영향 범위는 한 층 후 5…7, 두 층 후 3…7, 세 층 후 1…7이다.</desc><metadata>{&quot;id&quot;:&quot;ma-04-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mistral 7B §2, stacked sliding-window attention&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2310.06825v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 3 · 층을 통한 전달</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">먼 위치의 정보도 중간 위치를</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">거쳐 전달됩니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Window 3: 이전 층의 같은 위치와 직전 두</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">위치 · L0는 입력 · L1…L3는 층 깊이</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="32" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="520">한 경로를 아래에서 위로 따라갑니다.</text><rect x="220" y="662" width="230" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="335" y="705" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L0 · p1</text><path d="M335 654 L335 560" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="150" y="607" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="180">위치 +2</text><rect x="220" y="482" width="230" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="335" y="525" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L1 · p3</text><path d="M335 474 L335 380" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="150" y="427" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="180">위치 +2</text><rect x="220" y="302" width="230" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="335" y="345" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L2 · p5</text><path d="M335 294 L335 200" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="150" y="247" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="180">위치 +2</text><rect x="220" y="122" width="230" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="335" y="165" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L3 · p7</text><path d="M35 729 L35 115" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="10" y="94" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="190">층 깊이</text><text x="260" y="800" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">주황: 가능한 전달 경로 하나</text><path d="M0 879 L520 879" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="0" y="919" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">p7에 영향을 줄 수 있는 입력(L0)의 범위</text><text x="306" y="978" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle" data-max-width="360">입력 위치 j</text><rect x="140" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="182" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="224" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="266" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="308" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="350" y="1019" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="392" y="1019" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="1019" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="140" y="1061" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="182" y="1061" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="224" y="1061" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="266" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="308" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="350" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="392" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="140" y="1103" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="182" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="224" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="266" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="308" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="350" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="392" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">0</text><text x="201" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">1</text><text x="243" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">2</text><text x="285" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">3</text><text x="327" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">4</text><text x="369" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">5</text><text x="411" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">6</text><text x="453" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">7</text><text x="122" y="1046" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L1, p7</text><text x="122" y="1088" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L2, p7</text><text x="122" y="1130" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L3, p7</text><text x="260" y="1205" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle" data-max-width="500">p0은 세 층으로 아직 도달하지 못합니다.</text></g><path d="M16,1051.7076923076922 H344" stroke="#DCE4EC" stroke-width="2"/><text x="16" y="1078.7076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">한 층을 지날 때 오른쪽으로 최대 두 위치까지</text><text x="16" y="1101.1076923076923" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">전달됩니다. 강조한 경로는 L0,p1 → L1,p3 →</text><text x="16" y="1123.5076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">L2,p5 → L3,p7입니다. 따라서 L3,p7은 입력</text><text x="16" y="1145.9076923076923" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">p1…p7의 영향을 받을 수 있지만 p0은 아직</text><text x="16" y="1168.3076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">도달하지 못합니다. 간접 전달은 원래 KV를</text><text x="16" y="1190.7076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">직접 읽는 것과 같은 정보 보존을 보장하지</text><text x="16" y="1213.107692307692" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">않습니다.</text></svg>