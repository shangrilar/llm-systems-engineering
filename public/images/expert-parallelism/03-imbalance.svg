<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="925" viewBox="0 0 1200 925" role="img" aria-labelledby="title desc"><title id="title">라우팅이 만드는 작업량 불균형</title><desc id="desc">E0과 E1은 각각 한 토큰, E2는 여섯 토큰, E3는 영 토큰을 처리합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="925" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">라우팅이 만드는 작업량 불균형</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">막대 한 칸은 Expert에 배정된 토큰 하나이며 실행 시간의 측정값이 아닙니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="208.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">같은 크기의 Expert 네 개, top-1 토큰 여덟 개</text><text x="48" y="298.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E0 · GPU 0</text><rect x="293" y="259" width="96" height="65" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="341" y="301.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><text x="1020" y="301.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1</text><text x="48" y="413.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E1 · GPU 0</text><rect x="293" y="374" width="96" height="65" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="341" y="416.0" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">t</text><text x="1020" y="416.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1</text><text x="48" y="528.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">E2 · GPU 1</text><rect x="293" y=