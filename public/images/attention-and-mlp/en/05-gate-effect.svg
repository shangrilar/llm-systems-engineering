<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
<title id="title">Gate: adjust components based on the input</title><desc id="desc">Four components are shown: Up [2,-1,3,0.5] times post-SiLU Gate [0.1,1.5,0,2] gives [0.2,-1.5,0,1]. Component 1 shrinks, 2 and 4 grow in magnitude, and 3 becomes zero. Bars share a scale and negatives extend downward. SwiGLU Gate values can exceed 1 or be negative.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1400" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 5</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Gate: adjust components based on the input</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">One branch produces intermediate values; the other produces their multipliers.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
