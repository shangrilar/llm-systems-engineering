<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc"><title id="title">Without a cache, recompute the input context</title><desc id="desc">Without caching, the first execution computes p0 p1 p2 to select x0. The next recomputes p0 p1 p2 and newly computes x0 to select x1. The following recomputes p0 p1 p2 x0 and newly computes x1 to select x2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1280" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Without a cache, recompute the input context</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Unroll the positions computed in each model layer across the same three executions.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Generate x0</text><rect x="48" y="247" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><path d="M86,312 L86,334" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="136" y="247" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><path d="M174,312 L174,334" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="224" y="247" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><path d="M262,312 L262,334" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="341" width="854" height="112" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="48" y="360" width="76" height="72" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="86" y="389.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">p0</text><text x="86" y="417.0" fill="#B55B22" font-size="18" font-weight="400" text-anchor="middle">calc</text><rect x="136" y="360" width="76" height="72" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="174" y="389.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">p1</text><text x="174" y="417.0" fill="#B55B22" font-size="18" font-weight="400" text-anchor="middle">calc</text><rect x="224" y="360" width="76" height="72" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="262" y="389.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">p2</text><text x="262" y="417.0" fill="#B55B22" font-size="18" font-weight="400" text-anchor="middle">calc</text><text x="694" y="385.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Each model layer</text><text x="694" y="422.0" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Compute these positions</text><path d="M896,396 L1034,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="965" y="375.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">Select</text><rect x="1044" y="368" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="405.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="48" y="530.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Generate x1</text><rect x="48" y="557" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="594.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><path d="M86,622 L86,644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="136" y="557" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="594.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><path d="M174,622 L174,644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="224" y="557" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="594.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><path d="M262,622 L262,644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="312" y="557" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="350.0" y="594.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><path d="M350,622 L350,644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="651" width="854" height="112" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="48" y="670" width="76" height="72" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="86" y="699.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">p0</text><text x="86" y="727.0" fill="#7954A3" font-size="18" font-weight="400" text-anchor="middle">calc</text><rect x="136" y="670" width="76" height="72" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="174" y="699.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">p1</text><text x="174" y="727.0" fill="#7954A3" font-size="18" font-weight="400" text-anchor="middle">calc</text><rect x="224" y="6