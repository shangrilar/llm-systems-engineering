<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Ulysses: switch from token shards to head shards · Attention for the assigned head</title><desc id="desc">Each GPU computes full-context attention for its assigned head.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,&quot;Apple SD Gothic Neo&quot;,&quot;Noto Sans KR&quot;,sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">Ulysses: switch from token shards to head shards</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">Rearrange Q·K·V and outputs, not weights · The original work also calls this Sequence Parallelism.</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="40" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="150.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">Token shards</text><rect x="273" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="383.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">All-to-All</text><rect x="506" y="137" width="220" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="616.0" y="166.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">Attention per head</text><rect x="739" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="849.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">Reverse All-to-All</text><rect x="972" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="1082.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">Restore token shards</text><rect x="48" y="213" width="528" height="621" rx="10" fill="white" stroke="#2470bb" stroke-width="1.5"/><text x="70" y="247.0" font-size="24" fill="#2470bb" font-weight="700" text-anchor="start">GPU 0</text><rect x="624" y="213" width="528" height="621" rx="10" fill="white" stroke="#b55b22" stroke-width="1.5"/><text x="646" y="247.0" font-size="24" fill="#b55b22" font-weight="700" text-anchor="start">GPU 1</text><text x="312.0" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">O = Attention(Q,K,V)</text><rect x="282" y="365" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="312.0" y="406.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="425" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="312.0" y="466.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="485" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="312.0" y="526.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="545" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="312.0" y="586.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><text x="272" y="407.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="272" y="467.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="272" y="527.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="272" y="587.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="312" y="753.0" font-size="20" fill="#2470bb" font-weight="700" text-anchor="middle">Head h0: All Q tokens × All K tokens</text><text x="888.0" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">O = Attention(Q,K,V)</text><rect x="858" y="365" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="888.0" y="406.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="425" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="888.0" y="466.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="485" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="888.0" y="526.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="545" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="888.0" y="586.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><text x="848" y="407.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="848" y="467.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="848" y="527.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="848" y="587.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="888" y="753.0" font-size="20" fill="#b55b22" font-weight="700" text-anchor="middle">Head h1: All Q tokens × All K tokens</text><rect x="276" y="864" width="648" height="44" rx="10" fill="#e7f5ef" stroke="#e7f5ef" stroke-width="1.5"/><text x="600.0" y="893.0" font-size="20" fill="#168376" font-weight="700" text-anchor="middle">Each head’s full context is now on one GPU.</text><text x="600" y="949.0" font-size="24" fill="#183149" font-weight="700" text-anchor="middle">Complete attention locally for the assigned head.</text><text x="600" y="1025.0" font-size="21" fill="#587084" font-weight="400" text-anchor="middle">Example: 4 tokens · 2 heads · 2 GPUs / Basic multi-head attention</text></svg>