<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="954" viewBox="0 0 1200 954" role="img" aria-labelledby="title desc"><title id="title">Ring: 조각을 전달하며 합산하기</title><desc id="desc">세 번의 이웃 전달 뒤 GPU 0부터 3에 A=1111, B=2222, C=3333, D=4444가 완성됩니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="954" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Ring: 조각을 전달하며 합산하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">각 칸은 그 단계에서 전달할 값 또는 새로 합산한 값입니다. 전체 버퍼는 아닙니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="188" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="224.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">네 GPU의 입력을 같은 위치끼리 더하기</text><text x="72" y="264.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0 [1, 2, 3, 4]    GPU 1 [10, 20, 30, 40]</text><text x="72" y="327.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 2 [100, 200, 300, 400]    GPU 3 [1000, 2000, 3000, 4000]</text><text x="48" y="381.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">조각 A / B / C / D = 첫째 / 둘째 / 셋째 / 넷째 위치</text><rect x="48" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">상태</text><rect x="268.8" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="489.6" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="710.4000000000001" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 2</text><rect x="931.2" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 3</text><rect x="48" y="477" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">첫 전송 값</text><rect x="268.8" y="477" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 4</text><rect x="489.6" y="477" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 10</text><rect x="710.4000000000001" y="477" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 200</text><rect x="931.2" y="477" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3000</text><rect x="48" y="553" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">1회 전달 후</text><rect x="268.8" y="553" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3003</text><rect x="489.6" y="553" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 44</text><rect x="710.4000000000001" y="553" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 110</text><rect x="931.2" y="553" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 2200</text><rect x="48" y="629" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">2회 전달 후</text><rect x="268.8" y="629" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 2202</text><rect x="489.6" y="629" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3033</text><rect x="710.4000000000001" y="629" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 444</text><rect x="931.2" y="629" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 1110</text><rect x="48" y="705" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">3회 전달 후</text><rect x="268.8" y="705" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 1111</text><rect x="489.6" y="705" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 2222</text><rect x="710.4000000000001" y="705" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3333</text><rect x="931.2" y="705" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 4444</text><rect x="48" y="812" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="848.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">GPU 0 → GPU 1 → GPU 2 → GPU 3 → GPU 0</text><text x="72" y="888.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">매 단계에서 네 GPU가 동시에 전달하고, 받은 값에 자신의 값을 더합니다.</text></svg>