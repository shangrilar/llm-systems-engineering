<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1127" viewBox="0 0 1200 1127" role="img" aria-labelledby="title desc"><title id="title">Resident Warps Are Not Always Ready to Execute</title><desc id="desc">One warp scheduler has resident warps A, B, C, and D. A waits for a needed memory read result, and C waits at a synchronization point. B and D are ready for their next instructions, and the scheduler selects B this time. Of four resident warps, two are eligible and one is selected. D is ready but not selected, unlike A and C, which cannot issue their next instructions. This does not mean the SM has only one scheduler; this separate example does not map directly to warps 0 through 3 in Figure 5.</desc><metadata>{&quot;id&quot;:&quot;06-ready-warps&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 6</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Resident Warps Are Not Always Ready to Execute</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The scheduler selects a warp whose next instruction can be issued.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="218" width="726" height="554" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="77" y="263" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Resident warps managed by one scheduler</text><rect x="74" y="294" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="329" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">Warp A</text><text x="97" y="365" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Waiting for a memory read result</text><rect x="571" y="316" width="152" height="48" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="647" y="348" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Waiting</text><rect x="74" y="406" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="441" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">Warp B</text><text x="97" y="477" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Ready for the next instruction</text><rect x="571" y="428" width="152" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="647" y="460" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Eligible</text><rect x="74" y="518" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="553" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">Warp C</text><text x="97" y="589" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Waiting at a synchronization point</text><rect x="571" y="540" width="152" height="48" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="647" y="572" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Waiting</text><rect x="74" y="630" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="665" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">Warp D</text><text x="97" y="701" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Ready for the next instruction</text><rect x="571" y="652" width="152" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="647" y="684" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Eligible</text><path d="M750,452 H825 V405 H855" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><path d="M750,676 H825 V472 H855" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="861" y="354" width="291" height="187" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1006" y="399" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Warp scheduler</text><text x="1006" y="449" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">From eligible candidates</text><text x="1006" y="493" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Select B this time</text><path d="M1006,551 L1006,612" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="861" y="630" width="291" height="69" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1006.5" y="672.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Issue B's next instruction</text><rect x="48" y="821" width="352" height="70" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="864" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">4 resident</text><rect x="424" y="821" width="352" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="864" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">2 eligible</text><rect x="800" y="821" width="352" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="864" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">1 selected this time</text><text x="600" y="949" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">D is also ready, but is not selected this time.</text><text x="600" y="997" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Waiting warps remain resident on the SM and retain their execution state.</text></g></g><path d="M48,1049 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1087" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">This does not mean one scheduler per SM; it is a separate example, not the warps of Figure 5.</text></svg>