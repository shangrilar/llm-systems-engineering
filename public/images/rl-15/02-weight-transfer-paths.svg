<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1511" viewBox="0 0 1200 1511" role="img" aria-labelledby="title desc"><title id="title">배치와 통신 환경에 맞는 전송 경로를 고른다</title><desc id="desc">Broadcast는 학습 측에서 NCCL로 분배한 후 추론 측에서 분할 적용한다. P2P는 학습 GPU에서 CPU 모델의 layout 변환과 pinned host buffer를 거쳐 RDMA로 대상 GPU의 weight 주소에 쓴다. Disk-delta는 같은 기준 checkpoint의 byte 변경을 공유 저장소로 전달하고 수신 측 local checkpoint를 패치한 후 GPU로 읽는다.</desc><metadata>{&quot;id&quot;:&quot;15-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SGLang receiver, Miles v0.1.0 release pin&quot;,&quot;url&quot;:&quot;https://github.com/sgl-project/sglang/blob/cb05a44f35a7c9e27e46d74112cc841ca674ef43/python/sglang/srt/model_loader/remote_instance_weight_loader_utils.py&quot;},{&quot;label&quot;:&quot;Miles P2P v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/p2p-weight-transfer.md&quot;},{&quot;label&quot;:&quot;Miles disk-delta v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/miles/backends/megatron_utils/update_weight/update_weight_from_distributed/delta.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">배치와 통신 환경에 맞는 전송 경로를 고른다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Miles v0.1.0의 세 경로를 단순화했습니다. 화살표는 메모리·저장소 사이 이동이며, 길이나 굵기는 속도</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">비교가 아닙니다.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(0.9857142857142858)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1120">같은 원본과 대상 · 다른 이동 경로</text><path d="M0 68 L1120 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g transform="translate(0 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">Broadcast</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">공통 GPU 통신망의 기본 선택</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">학습 GPU들</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">동일한 새 가중치</text></g><path d="M172 217 L172 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="312" height="164" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="297" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">전송할 텐서 준비</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Gather·형식 변환 후 source</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">rank에서 배포</text></g><g data-container="true"><rect x="16" y="492" width="312" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">NCCL broadcast</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">collective 통신 그룹</text></g><g data-container="true"><rect x="16" y="681" width="312" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">대상별 load</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">각 추론 rank의 분할에 맞춰</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">적용</text></g><path d="M172 443 L172 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M172 632 L172 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M172 855 L172 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">추론 GPU들</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">일관된 새 가중치</text></g></g></g><g transform="translate(388 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">P2P</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">여러 노드의 병렬 전송 활용</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">학습 GPU들</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">동일한 새 가중치</text></g><path d="M172 217 L172 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="312" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">송신 CPU 메모리</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">CPU 모델로 layout 변환 →</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">pinned host buffer</text></g><g data-container="true"><rect x="16" y="492" width="312" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">RDMA write</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">대상 rank별 필요한 조각</text></g><g data-container="true"><rect x="16" y="681" width="312" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">등록된 GPU 주소</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">대상 가중치 메모리에 직접</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">쓰기</text></g><path d="M172 443 L172 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M172 632 L172 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M172 855 L172 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">추론 GPU들</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">일관된 새 가중치</text></g></g></g><g transform="translate(776 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">Disk-delta</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">직접 통신망 없이 저장소 공유</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">학습 GPU들</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">동일한 새 가중치</text></g><path d="M172 217 L172 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="312" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">CPU의 이전 snapshot</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">같은 base에서 바뀐 bytes를</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">인코딩</text></g><g data-container="true"><rect x="16" y="492" width="312" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">공유 파일 저장소</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">base b → delta b+1</text></g><g data-container="true"><rect x="16" y="681" width="312" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">로컬 checkpoint 패치</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">base·version·checksum</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">확인 → GPU로 reload</text></g><path d="M172 443 L172 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M172 632 L172 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M172 855 L172 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">추론 GPU들</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">일관된 새 가중치</text></g></g></g></g></svg>