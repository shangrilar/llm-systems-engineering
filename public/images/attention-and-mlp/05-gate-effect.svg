<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc">
<title id="title">Gate: 입력에 따라 성분별 값 조절하기</title><desc id="desc">중간 벡터 중 4개 성분을 확대한다. Up 값 [2,−1,3,0.5]에 SiLU 적용 후 Gate 값 [0.1,1.5,0,2]를 성분별로 곱하면 [0.2,−1.5,0,1]이다. 첫 성분은 작아지고, 둘째와 넷째는 크기가 커지며 셋째는 0이다. 막대는 동일 눈금이며 음수는 아래로 향한다. SwiGLU의 Gate 값은 0~1로 제한되지 않으며 음수도 가능하다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1400" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 5</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Gate: 입력에 따라 성분별 값 조절하기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">한 경로는 중간 값을, 다른 경로는 각 성분에 곱할 조절값을 만듭니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="600" y="224" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">중간 벡터의 4개 성분을 확대합니다. Gate 값은 SiLU를 거친 값입니다.</text><text x="350" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">성분 1</text><text x="570" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">성분 2</text><text x="790" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">성분 3</text><text x="1010" y="278" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">성분 4</text><text x="70" y="351" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">Up 값 u</text><rect x="240.0" y="310" width="220.0" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="350.0" y="352.0" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">2</text><rect x="460.0" y="310" width="220.0" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="570.0" y="352.0" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">−1</text><rect x="680.0" y="310" width="220.0" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="790.0" y="352.0" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">3</text><rect x="900.0" y="310" width="220.0" height="66" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1010.0" y="352.0" fill="#2470BB" font-size="30" font-weight="400" text-anchor="middle">0.5</text><text x="70" y="473" fill="#287D78" font-size="25" font-weight="600" text-anchor="start">Gate 값 g</text><rect x="240.0" y="432" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350.0" y="474.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0.1</text><rect x="460.0" y="432" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="570.0" y="474.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">1.5</text><rect x="680.0" y="432" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="790.0" y="474.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0</text><rect x="900.0" y="432" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1010.0" y="474.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">2</text><text x="70" y="615" fill="#287D78" font-size="25" font-weight="600" text-anchor="start">u ⊙ g</text><rect x="240.0" y="574" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350.0" y="616.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0.2</text><rect x="460.0" y="574" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="570.0" y="616.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">−1.5</text><rect x="680.0" y="574" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="790.0" y="616.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">0</text><rect x="900.0" y="574" width="220.0" height="66" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1010.0" y="616.0" fill="#287D78" font-size="30" font-weight="400" text-anchor="middle">1</text><path d="M240,540 L1120,540" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="694" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">입력에 따라 계산한 Gate 값이 각 성분에 곱해집니다.</text><rect x="48" y="737" width="1104" height="415" rx="14" fill="#FAFCFE" stroke="#DCE4EC" stroke-width="1.5"/><rect x="355" y="769" width="18" height="18" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="385" y="785" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">Up 값</text><rect x="655" y="769" width="18" height="18" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="685" y="785" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">곱셈 결과</text><text x="350" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">크기 감소</text><path d="M268,1044 L432,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="259" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="301" y="936" width="36" height="108" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="363" y="1033.2" width="36" height="10.8" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="350" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">1</text><text x="570" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">크기 증가</text><path d="M488,1044 L652,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="479" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="521" y="1044" width="36" height="54" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="583" y="1044" width="36" height="81.0" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="570" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">2</text><text x="790" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">0이 됨</text><path d="M708,1044 L872,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="699" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="741" y="882" width="36" height="162" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M803,1044 L839,1044" fill="none" stroke="#287D78" stroke-width="4"/><text x="790" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">3</text><text x="1010" y="842" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">크기 증가</text><path d="M928,1044 L1092,1044" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="919" y="1050" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end">0</text><rect x="961" y="1017.0" width="36" height="27.0" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="1023" y="990.0" width="36" height="54.0" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1010" y="1131" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">4</text><text x="600" y="1200" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">모든 막대는 같은 눈금입니다. 음수는 0 아래로 그렸습니다.</text><text x="600" y="1253" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">SwiGLU의 Gate 값은 0~1로 제한되지 않으며, 음수도 가능합니다.</text><path d="M48,1320 L1152,1320" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1361" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">수치는 곱셈 효과를 보여주는 설명용 예시입니다. 두 경로 모두 같은 토큰의 입력을 사용합니다.</text>
</svg>