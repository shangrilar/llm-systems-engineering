<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" role="img" aria-labelledby="title desc"><title id="title">PP: 층을 나누고 중간값 전달하기</title><desc id="desc">여덟 층을 두 층씩 네 GPU에 배치하고 입력이 순서대로 모든 단계를 통과합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="778" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">PP: 층을 나누고 중간값 전달하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">한 입력의 계산은 앞 단계의 결과를 받은 뒤 다음 단계로 진행합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">모델의 층을 연속된 네 구간으로 배치</text><rect x="48" y="275" width="232" height="253" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="311.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">층 0 · 1</text><text x="66" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 가중치</text><text x="66" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 계산</text><path d="M285,396 L323,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="328" y="275" width="232" height="253" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="311.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="346" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">층 2 · 3</text><text x="346" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 가중치</text><text x="346" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 계산</text><path d="M565,396 L603,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="608" y="275" width="232" height="253" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="311.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="626" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">층 4 · 5</text><text x="626" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 가중치</text><text x="626" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 계산</text><path d="M845,396 L883,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="888" y="275" width="232" height="253" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="311.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="906" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">층 6 · 7</text><text x="906" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 가중치</text><text x="906" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">이 구간의 계산</text><rect x="48" y="623" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="659.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">입력 → GPU 0 → GPU 1 → GPU 2 → GPU 3 → 출력</text><text x="72" y="699.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">단계 사이에는 이전 층의 출력인 중간값을 전달합니다.</text></svg>