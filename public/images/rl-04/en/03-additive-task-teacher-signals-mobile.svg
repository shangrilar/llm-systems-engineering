-size="17" font-weight="400" text-anchor="start" data-max-width="328">A_total = A_task + λdₜ ·</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Teacher-signal weight λ = 0.2</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><circle cx="24" cy="30" r="7" fill="#B55B22" stroke="#B55B22"/><text x="42" y="37" fill="#B55B22" font-size="21" font-weight="400" text-anchor="start" data-max-width="160">Task signal</text><circle cx="273" cy="30" r="7" fill="#287D78" stroke="#287D78"/><text x="291" y="37" fill="#287D78" font-size="21" font-weight="400" text-anchor="start" data-max-width="200">Combined signal</text><text x="16" y="150" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="160">Token b</text><path d="M58 214 L478 214" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M58 221 L58 207" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="58" y="250" fill="#182C40" font-size="19" font-weight="400" text-anchor="middle" data-max-width="58">0</text><path d="M163 221 L163 207" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="163" y="250" fill="#182C40" font-size="19" font-weight="400" text-anchor="middle" data-max-width="58">0.2</text><path d="M268 221 L268 207" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="268" y="250" fill="#182C40" font-size="19" font-weight="400" text-anchor="middle" data-max-width="58">0.4</text><path d="M373 221 L373 207" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="373" y="250" fill="#182C40" font-size="19" font-weight="400" text-anchor="middle" data-max-width="58">0.6</text><path d="M478 221 L478 207" stroke="#5C6C7C" stroke-width="1" fill="none"/><text x="478" y="250" fill="#182C40" font-size="19" font-weight="400" text-anchor="middle" data-max-width="58">0.8</text><path d="M320.5 2