<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">생성 중 부족해지는 KV 공간</title><desc id="desc">네 블록에 A와 B의 KV가 각각 7칸씩 들어 있다. 각 마지막 블록의 한 칸을 채워 8칸이 되면 모든 칸이 찬다. 다음 위치 8의 KV를 쓰려면 새 블록이 필요하지만 가용 블록은 없다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1060" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">생성 중 부족해지는 KV 공간</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">남은 칸까지 채운 뒤에는, 다음 입력을 처리할 새 블록이 필요합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">KV 풀 4블록 · 블록당 4칸 · 공유 없음</text><text x="48" y="265.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. 마지막 블록에 한 칸씩 남아 있음</text><rect x="48" y="294" width="260" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="324.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">P0 · A</text><rect x="60" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88.0" y="371.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="120" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="148.0" y="371.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="180" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="208.0" y="371.0" fill="#2470BB" font-size="22" font