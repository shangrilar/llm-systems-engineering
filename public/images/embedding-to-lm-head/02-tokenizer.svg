rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="720" y="627" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">1879</text><rect x="890" y="450" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1000" y="495" fill="#182C40" font-size="31" font-weight="500" text-anchor="middle">!</text><path d="M1000,532 L1000,569" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="890" y="582" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1000" y="627" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">0</text><text x="678" y="700" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">토큰마다 고유한 ID가 대응합니다.</text></g></g></g></g><path d="M48,753 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="791" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Qwen3 실제 예시 · ␣는 공백을 보이게 쓴 기호입니다. 특수 토큰은 추가하지 않았습니다.</text></svg>