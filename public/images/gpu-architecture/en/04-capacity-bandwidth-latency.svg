<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Capacity, Bandwidth, and Latency Differ</title><desc id="desc">Capacity compares spaces holding four and eight equal data cells. Bandwidth compares three and six data bundles arriving in the same time. Access latency compares short and long timelines from a request until data is available. Each panel is a separate conceptual comparison, not a measurement.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1200" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Capacity, Bandwidth, and Latency Differ</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Distinguish how much is stored, how much is transferred, and how long we wait.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="215" width="1104" height="245" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="271" fill="#182C40" font-size="30" font-weight="700" text-anchor="start">Capacity</text><text x="78" y="315" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">How much</text><text x="78" y="346" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">can it hold?</text><text x="744" y="258" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Amount of data that can be stored</text><rect x="374" y="287" width="208" height="69" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><rect x="389" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="435" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="481" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="527" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="478" y="432" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Smaller capacity</text><rect x="812" y="287" width="208" height="113" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><rect x="827" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="873" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="919" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="965" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="827" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="873" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="919" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="965" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="916" y="432" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Larger capacity</text><rect x="48" y="484" width="1104" height="272" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="542" fill="#182C40" font-size="30" font-weight="700" text-anchor="start">Bandwidth</text><text x="78" y="586" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">How much moves</text><text x="78" y="617" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">in the same time?</text><text x="744" y="528" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Data arriving in the same time</text><text x="417" y="592" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Less</text><rect x="489" y="557" width="602" height="60" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><rect x="509" y="570" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="600" y="570" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="691" y="570" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="417" y="691" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">More</text><rect x="489" y="656" width="602" height="60" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><rect x="509" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="600" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="691" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="782" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="873" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="964" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="48" y="780" width="1104" height="307" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="838" fill="#182C40" font-size="30" font-weight="700" text-anchor="start">Access latency</text><text x="78" y="882" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">After a request,</text><text x="78" y="913" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">how long to wait?</text><text x="385" y="839" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">Request</text><text x="677" y="839" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">Available</text><rect x="385" y="860" width="292" height="44" rx="6" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5" /><path d="M385,852 V912" fill="none" stroke="#7954A3" stroke-width="2" /><path d="M389,882 L677,882" fill="none" stroke="#7954A3" stroke-width="2.5" marker-end="url(#purple)" /><path d="M677,852 V912" fill="none" stroke="#7954A3" stroke-width="2" /><text x="531.0" y="939" fill="#7954A3" font-size="21" font-weight="400" text-anchor="middle">Waiting time</text><text x="385" y="974" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">Request</text><text x="1058" y="974" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">Available</text><rect x="385" y="995" width="673" height="44" rx="6" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5" /><path d="M385,987 V1047" fill="none" stroke="#7954A3" stroke-width="2" /><path d="M389,1017 L1058,1017" fill="none" stroke="#7954A3" stroke-width="2.5" marker-end="url(#purple)" /><path d="M1058,987 V1047" fill="none" stroke="#7954A3" stroke-width="2" /><text x="721.5" y="1074" fill="#7954A3" font-size="21" font-weight="400" text-anchor="middle">Waiting time</text><text x="600" y="1151" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Storage amount, transfer amount, and waiting time are distinct.</text></svg>