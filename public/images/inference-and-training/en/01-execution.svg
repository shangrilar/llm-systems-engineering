<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">Same model, different execution flows</title><desc id="desc">Generation repeats forward passes and token selection with fixed weights. Training predicts known positions, computes loss and gradients, and updates weights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1210" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Same model, different execution flows</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Generation selects its next input; training updates weights against known targets.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="219.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">Autoregressive generation</text><text x="642" y="219.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">Next-token training</text><g data-box="48,249,510,130"><rect x="48" y="249" width="510" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Known input</text><text x="68" y="327.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2</text><text x="68" y="357.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">The next token is not yet known</text></g><g data-box="642,249,510,130"><rect x="642" y="249" width="510" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="284.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Known training sequence</text><text x="662" y="327.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2 p3</text><text x="662" y="357.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Next-position targets are in the data</text></g><path d="M303,393 L303,418" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,393 L897,418" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,435,510,125"><rect x="48" y="435" width="510" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="470.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Forward: compute predictions</text><text x="68" y="513.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Keep weights W fixed</text><text x="68" y="543.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Current input with prior context</text></g><g data-box="642,435,510,125"><rect x="642" y="435" width="510" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="470.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Forward: known positions</text><text x="662" y="513.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Predict from input positions p0 p1 p2</text><text x="662" y="543.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Each position cannot see the future</text></g><path d="M303,574 L303,599" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,574 L897,599" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,616,510,140"><rect x="48" y="616" width="510" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="651.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Logits → select the next token</text><text x="68" y="694.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Last-position logits → x0</text><text x="68" y="724.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Greedy selection or sampling</text></g><g data-box="642,616,510,140"><rect x="642" y="616" width="510" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="651.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Loss → backward</text><text x="662" y="694.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Compare with targets p1 p2 p3</text><text x="662" y="724.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Weight gradients from the loss</text></g><path d="M303,770 L303,795" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,770 L897,795" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,812,510,138"><rect x="48" y="812" width="510" height="138" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="847.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Continue with the selected token</text><text x="68" y="890.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">If continuing, use x0 as next input</text><text x="68" y="920.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Repeat in order within a request</text></g><g data-box="642,812,510,138"><rect x="642" y="812" width="510" height="138" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="847.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Optimizer → update weights</text><text x="662" y="890.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Update W using the gradients</text><text x="662" y="920.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Repeat on the next training batch</text></g><g data-box="48,996,510,130"><rect x="48" y="996" width="510" height="130" rx="10" fill="#F5F7FA" stroke="#526577" stroke-width="1.5"/><text x="68" y="1031.0" fill="#526577" font-size="25" font-weight="700" text-anchor="start">State to retain</text><text x="68" y="1074.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Token history · KV cache · stop</text><text x="68" y="1104.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">conditions</text></g><g data-box="642,996,510,130"><rect x="642" y="996" width="510" height="130" rx="10" fill="#F5F7FA" stroke="#526577" stroke-width="1.5"/><text x="662" y="1031.0" fill="#526577" font-size="25" font-weight="700" text-anchor="start">State to retain</text><text x="662" y="1074.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Activations · gradients</text><text x="662" y="1104.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Optimizer state</text></g><text x="48" y="1160.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Standard supervised training and generation; arrows show order, not elapsed time.</text></svg>