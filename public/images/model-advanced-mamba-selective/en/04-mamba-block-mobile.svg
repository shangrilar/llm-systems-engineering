xt x="110" y="791.4" fill="#287D78" font-size="20" font-weight="500" text-anchor="middle" data-max-width="128">Comp. 0</text></g><g data-container="true"><rect x="190" y="750" width="140" height="70" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="791.4" fill="#287D78" font-size="20" font-weight="500" text-anchor="middle" data-max-width="128">…</text></g><g data-container="true"><rect x="340" y="750" width="140" height="70" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="410" y="791.4" fill="#287D78" font-size="20" font-weight="500" text-anchor="middle" data-max-width="128">Comp. N−1</text></g><text x="260" y="860" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle" data-max-width="480">State vector of one channel</text><path d="M260 890 L260 935" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="40" y="950" width="440" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="993" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="428">State update at the next step</text></g></svg>