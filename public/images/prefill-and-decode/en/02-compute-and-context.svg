<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc"><title id="title">Tokens processed and context length are different</title><desc id="desc">Prefill processes four positions p0 p1 p2 p3, giving four rows for token-wise projection and MLP operations. Decode processes only the new x0, giving one row. Prefill attention follows a causal triangle with four rows and four columns; the decode query at x0 reads K and V at five positions p0 p1 p2 p3 x0. T is the number of positions processed now; L is context length including the current position.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1300" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Tokens processed and context length are different</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">With a cache, past token-wise work is skipped, but attention still reads past K/V.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="223.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Prefill</text><text x="650" y="223.0" fill="#B55B22" font-size="29" font-weight="700" text-anchor="start">Decode</text><text x="48" y="265.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">Input positions to process</text><text x="650" y="265.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">Input positions to process</text><rect x="48" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="140" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="232" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="272.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="324" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="364.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p3</text><rect x="650" y="289" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="690.0" y="326.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="420" y="326.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">T = 4</text><text x="805" y="326.0" fill="#B55B22" font-size="28" font-weight="700" text-anchor="start">T = 1</text><text x="48" y="408.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Rows in token-wise operations</text><text x="48" y="449.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Projection · MLP, etc.</text><text x="84" y="507.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p0</text><rect x="132" y="476" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M248,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M306,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M364,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M422,476 V516" stroke="#2470BB" stroke-width="1"/><text x="84" y="556.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p1</text><rect x="132" y="525" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M248,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M306,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M364,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M422,525 V565" stroke="#2470BB" stroke-width="1"/><text x="84" y="605.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p2</text><rect x="132" y="574" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M248,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M306,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M364,574 V614" stroke="#2470BB" stroke-width="1"/><path d="M422,574 V614" stroke="#2470BB" stroke-width="1"/><text x="84" y="654.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p3</text><rect x="132" y="623" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M248,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M306,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M364,623 V663" stroke="#2470BB" stroke-width="1"/><path d="M422,623 V663" stroke="#2470BB" stroke-width="1"/><text x="306" y="715.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Same weights for each row</text><text x="686" y="507.0" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">x0</text><rect x="734" y="476" width="348" height="40" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M792,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M850,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M908,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M966,476 V516" stroke="#B55B22" stroke-width="1"/><path d="M1024,476 V516" stroke="#B55B22" stroke-width="1"/><text x="908" y="715.0" fi