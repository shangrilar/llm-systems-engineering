<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="854" viewBox="0 0 1200 854" role="img" aria-labelledby="title desc"><title id="title">DP: same model, different inputs</title><desc id="desc">Each GPU stores full model W and independently processes one of requests A–D.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="854" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">DP: same model, different inputs</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">An example of ordinary dense-model inference with fixed weights.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Four copies of the same model W</text><rect x="48" y="249" width="264" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="285.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Request A</text><text x="66" y="335.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M180,386 L180,427" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="439" width="264" height="178" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="475.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="525.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="66" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M180,630 L180,673" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="685" width="264" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="721.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Result A</text><text x="66" y="771.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><rect x="328" y="249" width="264" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="285.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Request B</text><text x="346" y="335.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M460,386 L460,427" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="328" y="439" width="264" height="178" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="475.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="346" y="525.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="346" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M460,630 L460,673" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="328" y="685" width="264" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="721.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Result B</text><text x="346" y="771.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><rect x="608" y="249" width="264" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="285.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Request C</text><text x="626" y="335.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M740,386 L740,427" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="608" y="439" width="264" height="178" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="475.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="626" y="525.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="626" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M740,630 L740,673" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="608" y="685" width="264" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="721.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Result C</text><text x="626" y="771.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><rect x="888" y="249" width="264" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="285.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Request D</text><text x="906" y="335.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M1020,386 L1020,427" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="888" y="439" width="264" height="178" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="475.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="906" y="525.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="906" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M1020,630 L1020,673" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="888" y="685" width="264" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="721.0" fill="#