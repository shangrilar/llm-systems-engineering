"/><text x="92.0" y="790.0" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">C</text><text x="139" y="764" fill="#7954A3" font-size="19" font-weight="600" text-anchor="start">출력 1행 · 6열</text><text x="139" y="803" fill="#7954A3" font-size="25" font-weight="400" text-anchor="start">1 × 0 + 2 × 1 + (−1) × 1 + 0 × 2 = 1</text><text x="600" y="900" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">각 칸 안에서는 곱을 더하고, 서로 다른 칸은 병렬로 계산할 수 있습니다.</text><path d="M48,952 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="992" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">T = 3, d = 4, m = 8인 설명용 예시 · A·B·C는 첫 번째 출력 행의 서로 다른 칸입니다.</text></svg>