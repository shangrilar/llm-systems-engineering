<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1013" viewBox="0 0 1200 1013" role="img" aria-labelledby="title desc"><title id="title">Separate token order from storage location</title><desc id="desc">A’s logical blocks L0,L1,L2 map to physical blocks P3,P0,P5. Each stores four tokens’ K,V; the final block leaves two slots unused.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1013" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Separate token order from storage location</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Teaching example with block size 4. A and B own separate KV blocks.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="207.0" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">Request A: 10 tokens → 3 logical blocks</text><g data-panel="true"><rect x="48" y="240" width="352" height="151" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="276.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">L0</text><text x="68" y="324.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">t0 t1 t2 t3</text></g><path d="M224,404 L224,449" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="467" width="352" height="83" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="519.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">L0 → P3</text><g data-panel="true"><rect x="424" y="240" width="352" height="151" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="444" y="276.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">L1</text><text x="444" y="324.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">t4 t5 t6 t7</text></g><path d="M600,404 L600,449" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="424" y="467" width="352" height="83" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="519.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">L1 → P0</text><g data-panel="true"><rect x="800" y="240" width="352" height="151" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="820" y="276.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">L2</text><text x="820" y="324.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">t8 t9 — —</text></g><path d="M976,404 L976,449" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="800" y="467" width="352" height="83" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="519.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">L2 → P5</text><text x="48" y="598.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Block table: translate logical order into physical addresses.</text><text x="48" y="666.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU physical block pool · each block stores K and V for 4 tokens</text><rect x="48" y="705" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="64" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P0</text><text x="64" y="777.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L1</text><rect x="232" y="705" width="168" height="97" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="248" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P1</text><text x="248" y="777.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B · L0</text><rect x="416" y="705" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="432" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P2</text><text x="432" y="777.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="600" y="705" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="616" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P3</text><text x="616" y="777.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L0</text><rect x="784" y="705" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P4</text><text x="800" y="777.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="968" y="705" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="984" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P5</text><text x="984" y="777.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L2</text><g data-panel="true"><rect x="48" y="851" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="886.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Attention follows P3 → P0 → P5 for A’s logical KV order</text><text x="72" y="928.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Physical blocks need not be adjacent. Two positions remain unused in the last</text><text x="72" y="960.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">block.</text></g></svg>