<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Collective Communication Basics · Figure 5</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Reduce: combine matching positions</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Use the same inputs as Gather, but sum matching positions.</text><path d="M48,169 H1152" stroke="#DCE4EC" /><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Before communication · input buffers</text><rect x="48" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5" /><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="222" y="244" width="72" height="30" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="258" y="266" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle">root</text><rect x="72" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="124.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="236.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M180,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="328" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5" /><text x="364" y="267" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="293" width="104" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="404.0" y="324" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">10</text><rect x="464" y="293" width="104" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="516.0" y="324" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">20</text><path d="M460,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="608" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="624" y="244" width="8" height="27" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5" /><text x="644" y="267" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><rect x="632" y="293" width="104" height="44" rx="7" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" /><text x="684.0" y="324" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">100</text><rect x="744" y="293" width="104" height="44" rx="7" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" /><text x="796.0" y="324" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">200</text><path d="M740,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="888" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="904" y="244" width="8" height="27" rx="3" fill="#B55B22" stroke="#B55B22" stroke-width="1.5" /><text x="924" y="267" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><rect x="912" y="293" width="104" height="44" rx="7" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="964.0" y="324" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="1024" y="293" width="104" height="44" rx="7" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="1076.0" y="324" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle