="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="762" y="943" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="803" y="909" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="835" y="943" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="876" y="909" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="908" y="943" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="949" y="909" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="981" y="943" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><rect x="1022" y="909" width="64" height="49" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1054" y="943" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">●</text><text x="730" y="1178" fill="#B55B22" font-size="26" font-weight="700" text-anchor="start">T = 1   ·   L = 5</text><text x="650" y="1026" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">Read current x0’s K/V too</text><text x="650" y="1070" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">L grows → more attention work and reads</text><text x="650" y="1132" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">● Read   × Future position: not read</text><text x="48" y="1245" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">T: positions processed now · L: context length, including the current position</text></g></g><path d="M48,1296 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1334" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Decode processes one position, but its Q attends to K and V across the whole context.</text></svg>