<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc"><title id="title">Inference generates tokens; training updates the model</title><desc id="desc">In inference, input p0 p1 p2 passes through the fixed-weight model and final-position scores select x0, which becomes the next input if generation continues. In training, loss compares predictions at p0 p1 p2 with targets p1 p2 p3 from the data. Backpropagation computes gradients used to update model weights.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1420" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Inference generates tokens; training updates the model</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">After the same input p0 p1 p2 passes through the model, its outputs serve different</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">purposes.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="219.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Inference: generate the next token</text><g data-box="48,267,310,126"><rect x="48" y="267" width="310" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="302.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Request input</text><text x="68" y="345.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2</text></g><g data-box="442,267,290,126"><rect x="442" y="267" width="290" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="462" y="302.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Model</text><text x="462" y="345.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Fixed weights W</text><text x="462" y="375.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Compute scores</text></g><g data-box="816,267,336,150"><rect x="816" y="267" width="336" height="150" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="836" y="302.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Next token</text><text x="836" y="345.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Final-position scores</text><text x="836" y="375.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">select x0</text></g><path d="M368,330 L432,330" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M742,330 L806,330" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M984,425 V466 H394 V362 H432" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="442" y="507.0" fill="#2470BB" font-size="25" font-weight="400" text-anchor="start">If continuing, x0 is the next input</text><path d="M48,543 H1152" stroke="#DCE4EC"/><text x="48" y="595.0" fill="#287D78" font-size="29" font-weight="700" text-anchor="start">Training: update the model using known targets</text><text x="48" y="637.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">Training data p0 p1 p2 p3 supplies both inputs and next-position targets.</text><g data-box="48,684,310,126"><rect x="48" y="684" width="310" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="719.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Training input</text><text x="68" y="762.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2</text></g><g data-box="442,684,290,126"><rect x="442" y="684" width="290" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="462" y="719.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Model</text><text x="462" y="762.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Use weights W</text><text x="462" y="792.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Compute predictions</text></g><g data-box="816,684,336,126"><rect x="816" y="684" width="336" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="719.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Predictions</text><text x="836" y="762.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Vocabulary scores</text><text x="836" y="792.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">at p0, p1, and p2</text></g><path d="M368,747 L432,747" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M742,747 L806,747" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="867.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">No input position sees</text><text x="48" y="900.6" fill="#526577" font-size="24" font-weight="400" text-anchor="start">future positions.</text><g data-box="896,867,256,126"><rect x="896" y="867" width="256" height="126" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="916" y="902.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Known targets</text><text x="916" y="945.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p1 p2 p3</text></g><path d="M840,820 L840,1027" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1024,1003 L1024,1027" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="816,1037,336,126"><rect x="816" y="1037" width="336" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="1072.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Loss</text><text x="836" y="1115.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Compare position scores</text><text x="836" y="1145.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">with their targets</text></g><path d="M984,1173 L984,1190" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="816,1200,336,110"><rect x="816" y="1200" width="336" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="1235.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Backward pass</text><text x="836" y="1278.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Compute gradients</text></g><path d="M806,1255 L742,1255" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="442,1200,290,110"><rect x="442" y="1200" width="290" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="462" y="1235.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Update weights</text><text x="462" y="1278.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Use the gradients</text></g><path d="M587,1190 L587,820" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="1235.0" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">Update W, then process</text><text x="48" y="1268.6" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">the next batch.</text><text x="48" y="1370.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Arrows connect computations and data; their lengths do not represent execution time.</text></svg>