<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1468" viewBox="0 0 360 1468" role="img" aria-labelledby="title desc"><title id="title">Block 안은 합으로 묶고, Block 사이는 선택해서 읽습니다</title><desc id="desc">Full은 네 source를 따로 선택한다. Block은 세 source로 줄이지만 f1과 f2가 같은 비중을 공유한다. f4 생성 후 현재 합만 f3+f4로 바뀐다.</desc><metadata>{&quot;id&quot;:&quot;ma-14-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Kimi K3 §2.2, Block Attention Residuals equations 10–11&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.24653v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 4 · 깊이를 묶어 저장하기</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Block 안은 합으로 묶고, Block</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">사이는 선택해서 읽습니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">같은 토큰 t · B₁ = {f₁, f₂} · 현재 B₂ =</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">{f₃, f₄} · 각 source는 [d]</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Full · 각각 보관</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="123" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">f₃까지 계산한 같은 시점</text><rect x="100" y="157" width="250" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="225" y="194" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">e [d]</text><path d="M360 186 L450 186" stroke="#287D78" stroke-width="2.5" fill="none"/><rect x="100" y="241" width="250" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="225" y="278" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">f₁ [d]</text><path d="M360 270 L450 270" stroke="#287D78" stroke-width="2.5" fill="none"/><rect x="100" y="325" width="250" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="225" y="362" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">f₂ [d]</text><path d="M360 354 L450 354" stroke="#287D78" stroke-width="2.5" fill="none"/><rect x="100" y="409" width="250" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="225" y="446" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">f₃ [d]</text><path d="M360 438 L450 438" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M450 186 V535 H260 V567" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="30" y="577" width="460" height="118" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="608" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">4개를 따로 선택</text><text x="46" y="648" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">h₄ = α₀e + α₁f₁ + α₂f₂ + α₃f₃</text></g><text x="260" y="750" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">f₁과 f₂에 서로 다른 비중 가능</text></g><g transform="translate(16 740.3230769230769) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Block · 합으로 보관</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="123" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">f₃까지 계산한 같은 시점</text><rect x="100" y="157" width="250" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="225" y="194" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">e [d]</text><path d="M360 186 L450 186" stroke="#287D78" stroke-width="2.5" fill="none"/><rect x="100" y="269" width="250" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="225" y="306" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">f₁ + f₂ [d]</text><path d="M360 298 L450 298" stroke="#287D78" stroke-width="2.5" fill="none"/><rect x="100" y="381" width="250" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="225" y="418" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">f₃ [d]</text><path d="M360 410 L450 410" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M450 186 V488 H260 V517" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="30" y="527" width="460" height="118" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="558" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">3개 source를 선택</text><text x="46" y="598" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">h₄ = β₀e + β₁(f₁ + f₂) + β₂f₃</text></g><text x="260" y="687" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">f₁과 f₂는 같은 β₁을 공유</text><g data-container="true"><rect x="30" y="716" width="460" height="80" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="747" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">F₄가 f₄를 만든 뒤 현재 합만 갱신</text></g></g><g transform="translate(16 1279.246153846154) scale(0.6307692307692307)" data-panel="3"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">C. 새 출력은 현재 block에 더하기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="30" y="120" width="95" height="62" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="77.5" y="159" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="83">f₃</text><text x="155" y="160" fill="#182C40" font-size="30" font-weight="400" text-anchor="middle" data-max-width="40">+</text><rect x="185" y="120" width="95" height="62" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="232.5" y="159" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="83">f₄</text><path d="M295 151 L345 151" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="360" y="120" width="140" height="62" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="430" y="159" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="128">f₃ + f₄</text><text x="260" y="230" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="490">e와 완료된 f₁ + f₂는 그대로</text></g></svg>