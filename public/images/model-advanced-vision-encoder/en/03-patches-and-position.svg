or="middle" data-max-width="103">C · p2</text><rect x="260" y="1100" width="115" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="317.5" y="1140.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="103">B · p1</text><rect x="385" y="1100" width="115" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="442.5" y="1140.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="103">D · p3</text><text x="260" y="1250" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="480">Sequence order alone does not replace</text><text x="260" y="1283.6" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="480">spatial information.</text></g></svg>