<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">Move Less Data or Compute While Waiting</title><desc id="desc">All three cases complete the same computations A and B. B is independent of the new inputs for A and already has its inputs. The baseline prepares inputs for A for four slots, then computes A for two and B for two. Reducing movement through reuse or omitting intermediate transfers shortens preparation to two slots with unchanged computation. Concurrent progress computes B for two slots during the four-slot preparation for A, then computes A after its inputs are ready. A always starts after its own inputs are ready. The timelines illustrate relative execution order, not measured speedups. They connect to the preceding warp-scheduling article and do not specify an asynchronous-copy API.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1220" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Move Less Data or Compute While Waiting</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Reducing data movement and hiding data waits are different approaches.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="48" y="218" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Independent computation B can run while the inputs for A are being prepared.</text><rect x="48" y="250" width="1104" height="234" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="75" y="292" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Baseline · Wait for Inputs, Then Compute</text><text x="75" y="352" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">Prepare A’s inputs</text><text x="75" y="414" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start">Compute units</text><rect x="276" y="315" width="376" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="464.0" y="347.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Data movement</text><rect x="276" y="380" width="376" height="48" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="464.0" y="412.0" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Waiting</text><rect x="652" y="380" width="188" height="48" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="746.0" y="412.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Compute A</text><rect x="840" y="380" width="188" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="934.0" y="412.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Compute B</text><path d="M652,365 L652,375" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><path d="M1028,311 V437" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7" /><text x="1028" y="468" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">All work done</text><rect x="48" y="510" width="1104" height="234" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="75" y="552" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Less Movement · Reduce the Required Data Transfers</text><text x="75" y="612" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">Prepare A’s inputs</text><text x="75" y="674" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start">Compute units</text><rect x="276" y="575" width="188" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="370.0" y="607.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Data movement</text><rect x="276" y="640" width="188" height="48" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="370.0" y="672.0" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Waiting</text><rect x="464" y="640" width="188" height="48" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="558.0" y="672.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Compute A</text><rect x="652" y="640" width="188" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="746.0" y="672.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Compute B</text><path d="M464,625 L464,635" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><path d="M840,571 V697" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7" /><text x="840" y="728" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">All work done</text><rect x="48" y="770" width="1104" height="234" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="75" y="812" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Concurrent Progress · Compute Independently During Data Movement</text><text x="75" y="872" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">Prepare A’s inputs</text><text x="75" y="934" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start">Compute units</text><rect x="276" y="835" width="376" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="464.0" y="867.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Data movement</text><rect x="464" y="900" width="188" height="48" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="558.0" y="932.0" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Waiting</text><rect x="276" y="900" width="188" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="370.0" y="932.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Compute B</text><rect x="652" y="900" width="188" height="48" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="746.0" y="932.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Compute A</text><path d="M652,885 L652,895" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><path d="M840,831 V957" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7" /><text x="840" y="988" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">All work done</text><text x="1030" y="872" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Same transfer time</text><path d="M278,1050 L1100,1050" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" /><text x="1110" y="1083" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time</text><text x="600" y="1130" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">All three cases perform the same computation for A and B.</text><text x="600" y="1174" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Move less data, or do other computation while the data is being prepared.</text></svg>