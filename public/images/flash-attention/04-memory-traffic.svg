<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1480" viewBox="0 0 1200 1480" role="img" aria-labelledby="title desc"><title id="title">중간 행렬의 저장과 재읽기 줄이기</title><desc id="desc">왼쪽은 점수 행렬 S와 확률 행렬 P를 HBM에 저장하고 다음 단계에서 다시 읽는 구현이다. 오른쪽 FlashAttention은 입력을 타일로 읽고 온칩에서 점수, exp, Value 가중합을 계산한다. Q를 기준으로 K/V 타일을 순회하며 m,l,a를 유지하고 최종 출력을 쓴다. 캐시와 역전파용 통계 저장을 생략한 순전파 개념도다. 모든 전역 접근이 실제 HBM 전송이라는 뜻이 아니다. 이차 연산량을 선형으로 바꾸는 방법은 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1480" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">중간 행렬의 저장과 재읽기 줄이기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">큰 행렬을 단계 사이에 옮기는 대신, 작은 타일 안에서 두 행렬 곱과 소프트맥스를 연결합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="209" width="536" height="959" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="245" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">기본 어텐션</text><text x="316" y="277" fill="#B55B22" font-size="20" font-weight="500" text-anchor="middle">중간 행렬 저장·읽기</text><rect x="78" y="292" width="476" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="335.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · 입력 Q / K / V</text><path d="M316,376 L316,423" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="333" y="404" fill="#B55B22" font-size="20" font-weight="400" text-anchor="start">입력 읽기</text><rect x="98" y="443" width="436" height="65" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="483.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">QKᵀ · 점수 계산</text><rect x="98" y="673" width="436" height="65" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="713.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">소프트맥스</text><rect x="98" y="903" width="436" height="65" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="943.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">PV · 출력 계산</text><path d="M316,518 L316,541" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><rect x="78" y="550" width="476" height="67" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="591.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">HBM · 큰 점수 행렬 S</text><path d="M316,627 L316,660" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="344" y="653" fill="#B55B22" font-size="19" font-weight="400" text-anchor="start">다시 읽기</text><path d="M316,748 L316,771" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><rect x="78" y="780" width="476" height="67" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="821.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">HBM · 큰 확률 행렬 P</text><path d="M316,857 L316,890" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="344" y="883" fill="#B55B22" font-size="19" font-weight="400" text-anchor="start">다시 읽기</text><path d="M316,980 L316,1064" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="78" y="1080" width="476" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="1119.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · 최종 출력 O</text><rect x="616" y="209" width="536" height="959" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="245" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">FlashAttention</text><text x="884" y="277" fill="#287D78" font-size="20" font-weight="500" text-anchor="middle">타일 단위 계산·누적</text><rect x="646" y="292" width="476" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="335.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · 입력 Q / K / V</text><path d="M884,376 L884,423" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)"/><text x="901" y="404" fill="#287D78" font-size="20" font-weight="400" text-anchor="start">타일로 읽기</text><rect x="646" y="443" width="476" height="530" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="884" y="489" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">온칩 메모리 · 타일 단위 실행</text><rect x="674" y="519" width="420" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="558.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">QKᵀ → 스케일링·마스크</text><path d="M884,592 L884,619" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><rect x="674" y="637" width="420" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="676.0" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">m 갱신 · exp 계산 · ℓ 갱신</text><path d="M884,710 L884,737" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><rect x="674" y="755" width="420" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="794.0" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">a 보정 + exp 값과 V의 곱 누적</text><text x="884" y="863" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">m · ℓ · a 유지 → 다음 K/V 타일</text><text x="884" y="925" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">모든 타일 처리 후 O = a ÷ ℓ</text><path d="M884,985 L884,1064" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)"/><text x="902" y="1032" fill="#287D78" font-size="20" font-weight="400" text-anchor="start">최종 출력 쓰기</text><rect x="646" y="1080" width="476" height="62" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="1119.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">HBM · 최종 출력 O</text><rect x="48" y="1206" width="1104" height="149" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1256" fill="#287D78" font-size="30" font-weight="700" text-anchor="middle">큰 S·P 행렬의 저장과 재읽기를 피합니다.</text><text x="600" y="1307" fill="#287D78" font-size="24" font-weight="400" text-anchor="middle">점수 타일은 계산하고 바로 소비합니다. 타일을 넘어 유지하는 것은 m·ℓ·a입니다.</text><text x="600" y="1404" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">순전파 핵심 경로의 개념도 · 온칩은 공유 메모리와 레지스터 등을 포함</text><text x="600" y="1438" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">캐시·역전파용 통계 저장은 생략 · 일반적인 dense Attention의 이차 연산량은 유지</text></svg>