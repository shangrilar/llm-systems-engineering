<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1061" viewBox="0 0 1200 1061" role="img" aria-labelledby="title desc"><title id="title">같은 시간 동안 처리한 양 세기</title><desc id="desc">10초 안에서 A·B·C가 중첩 실행해 모두 완료하며 출력은 각각3·5·2개. 요청 처리량0.3requests/s, 출력 처리량1token/s.</desc><metadata>{&quot;id&quot;:&quot;02-counting-throughput&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">같은 시간 동안 처리한 양 세기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">완료한 요청을 셀 수도 있고, 전달한 출력 토큰을 셀 수도 있습니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="205" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">모든 요청과 출력이 들어 있는 10초 관측 창</text><path d="M190,258 L1010,258" stroke="#182C40" stroke-width="2" fill="none"/><path d="M190,250 L190,266" stroke="#182C40" stroke-width="2" fill="none"/><path d="M1010,250 L1010,266" stroke="#182C40" stroke-width="2" fill="none"/><text x="600" y="238" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">관측 시간 10초</text><path d="M190,290 L190,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="190" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">0 s</text><path d="M354,290 L354,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="354" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2 s</text><path d="M518,290 L518,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="518" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4 s</text><path d="M682,290 L682,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="682" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">6 s</text><path d="M846,290 L846,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="846" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">8 s</text><path d="M1010,290 L1010,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="1010" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">10 s</text><text x="48" y="342" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">A</text><path d="M272,335 L632.8,335" stroke="#2470BB" stroke-width="2" fill="none"/><circle cx="272" cy="335" r="9" fill="white" stroke="#2470BB" stroke-width="3"/><circle cx="436" cy="335" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><circle cx="518" cy="335" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><circle cx="600" cy="335" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><rect x="620.8" y="319" width="30" height="32" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="635.8" y="342" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">✓</text><text x="1100" y="342" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">3토큰</text><text x="48" y="457" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">B</text><path d="M354,450 L878.8000000000001,450" stroke="#287D78" stroke-width="2" fill="none"/><circle cx="354" cy="450" r="9" fill="white" stroke="#287D78" stroke-width="3"/><circle cx="518" cy="450" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><circle cx="600" cy="450" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><circle cx="682" cy="450" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><circle cx="764" cy="450" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><circle cx="846" cy="450" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><rect x="866.8000000000001" y="434" width="30" height="32" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="881.8000000000001" y="457" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">✓</text><text x="1100" y="457" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">5토큰</text><text x="48" y="572" fill="#7954A3" font-size="28" font-weight="700" text-anchor="start">C</text><path d="M436,565 L928,565" stroke="#7954A3" stroke-width="2" fill="none"/><circle cx="436" cy="565" r="9" fill="white" stroke="#7954A3" stroke-width="3"/><circle cx="764" cy="565" r="9" fill="#7954A3" stroke="#7954A3" stroke-width="3"/><circle cx="887" cy="565" r="9" fill="#7954A3" stroke="#7954A3" stroke-width="3"/><rect x="916" y="549" width="30" height="32" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="931" y="572" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">✓</text><text x="1100" y="572" fill="#7954A3" font-size="23" font-weight="700" text-anchor="middle">2토큰</text><circle cx="90" cy="697" r="9" fill="white" stroke="#182C40" stroke-width="3"/><text x="112" y="705" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청 제출</text><circle cx="360" cy="697" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="382" y="705" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">출력 토큰 수신</text><text x="795" y="705" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">✓</text><text x="828" y="705" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청 완료</text><rect x="48" y="758" width="525" height="110" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="792" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">완료 요청 3개</text><text x="68" y="838" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">3 / 10 = 0.3 requests/s</text><rect x="605" y="758" width="547" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="625" y="792" fill="#287D78" font-size="22" font-weight="700" text-anchor="start">출력 토큰 3 + 5 + 2 = 10개</text><text x="625" y="838" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">10 / 10 = 1 token/s</text><text x="48" y="922" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">여러 요청의 결과를 같은 시간으로 나눕니다. 입력 토큰은 세지 않았습니다.</text></g></g><path d="M48,983 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1021" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">여러 요청의 완료 수와 출력 토큰 수를 같은 관측 시간으로 나눕니다.</text></svg>