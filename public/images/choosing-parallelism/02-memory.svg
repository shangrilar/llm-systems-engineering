<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="851" viewBox="0 0 1200 851" role="img" aria-labelledby="title desc"><title id="title">속도를 비교하기 전에 메모리부터</title><desc id="desc">24GiB GPU와 32GiB 모델에서 추가 상태 8GiB를 포함하면 세 배치가 각각 40,24,16GiB를 사용합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="851" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">속도를 비교하기 전에 메모리부터</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">실제 모델 벤치마크가 아닌, 가정을 둔 용량 계산 예시입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="194" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="230.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">GPU당 사용 가능 메모리 24 GiB / 모델 가중치 32 GiB</text><text x="72" y="270.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">요청 상태·중간값·임시 공간 등에 GPU당 8 GiB가 필요하다고 가정</text><rect x="48" y="344" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">배치</text><rect x="328" y="344" width="244" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">가중치 / GPU</text><rect x="578" y="344" width="288" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">총 사용 / GPU</text><rect x="872" y="344" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">판단</text><rect x="48" y="410" width="274" height="103" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">DP × 4</text><rect x="328" y="410" width="244" height="103" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">32 GiB</text><rect x="578" y="410" width="288" height="103" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">32 + 8 = 40 GiB</text><rect x="872" y="410" width="274" height="103" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">초과</text><rect x="48" y="521" width="274" height="103" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">TP 2 × DP 2</text><rect x="328" y="521" width="244" height="103" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">16 GiB</text><rect x="578" y="521" width="288" height="103" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">16 + 8 = 24 GiB</text><rect x="872" y="521" width="274" height="103" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">여유 없음</text><rect x="48" y="632" width="274" height="103" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">TP 4 × DP 1</text><rect x="328" y="632" width="244" height="103" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">8 GiB</text><rect x="578" y="632" width="288" height="103" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">8 + 8 = 16 GiB</text><rect x="872" y="632" width="274" height="103" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">8 GiB 여유</text><text x="48" y="795.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">모델 가중치만 들어간다고 실행에 필요한 메모리까지 충족되는 것은 아닙니다.</text></svg>