<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1660" viewBox="0 0 360 1660" role="img" aria-labelledby="title desc"><title id="title">확률비가 커져도 계속 밀어붙이지 않도록</title><desc id="desc">생성 확률은 0.5로 고정한다. A=+1이면 현재 확률 증가를, A=-1이면 감소를 비교한다. 오른쪽 clip 결과 0.8에 A=-1을 곱하면 -0.8이 된다. A가 양수면 목적함수는 r이 1.2를 넘을 때, A가 음수면 r이 0.8보다 작을 때 평평해진다.</desc><metadata>{&quot;id&quot;:&quot;2-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;PPO §3, Figure 1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/1707.06347&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">확률비가 커져도 계속</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">밀어붙이지 않도록</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">J = min(rA, clip(r, 0.8, 1.2) × A)를</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">최대화합니다. 최소화하는 손실은</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">−J입니다.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">좋았던 선택: A = +1</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">생성 당시 확률은 고정</text><text x="32" y="171" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">p_old = 0.5 · r = p_current / p_old</text></g><text x="16" y="243" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">p_current:  0.5 → 0.6 → 0.7</text><text x="16" y="280" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">r:  1 → 1.2 → 1.4</text><g data-container="true"><rect x="16" y="307" width="488" height="142" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="338" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">clip(1.4, 0.8, 1.2) = 1.2</text><text x="32" y="378" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">1.2 × (+1) = +1.2</text><text x="32" y="406" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">J = min(+1.4, +1.2) = +1.2</text></g><g transform="translate(0,180)"><rect x="346.66666666666663" y="332" width="133.33333333333348" height="324" rx="0" fill="#EDF7F5" stroke="#EDF7F5" stroke-width="1.5"/><text x="16" y="326" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">목적함수 J</text><path d="M80 582 L480 582" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="589" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">0.4</text><path d="M80 514 L480 514" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="521" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">0.8</text><path d="M80 446 L480 446" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="453" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">1.2</text><path d="M80 378 L480 378" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="385" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">1.6</text><path d="M80 332 L80 657" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><path d="M80 657 L487 657" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><path d="M80 658 L80 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="80" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">0.4</text><path d="M213.33333333333334 658 L213.33333333333334 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="213.33333333333334" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">0.8</text><path d="M280 658 L280 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="280" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">1</text><path d="M346.66666666666663 658 L346.66666666666663 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="346.66666666666663" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">1.2</text><path d="M480.0000000000001 658 L480.0000000000001 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="480.0000000000001" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">1.6</text><text x="503" y="695" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="17">r</text><path d="M213.33333333333334 332 L213.33333333333334 657" stroke="#5C6C7C" stroke-width="1.3" fill="none" stroke-dasharray="7 5"/><path d="M346.66666666666663 332 L346.66666666666663 657" stroke="#5C6C7C" stroke-width="1.3" fill="none" stroke-dasharray="7 5"/><path d="M80 582 L480.0000000000001 378" stroke="#657789" stroke-width="3" fill="none" stroke-dasharray="7 5"/><path d="M80 582 L213.33333333333334 514 L346.66666666666663 446 L480.0000000000001 446" stroke="#2470BB" stroke-width="4" fill="none"/><circle cx="346.66666666666663" cy="446" r="5" fill="#2470BB" stroke="#2470BB"/><path d="M16 734 L62 734" stroke="#657789" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="75" y="741" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="55">rA</text><path d="M176 734 L222 734" stroke="#2470BB" stroke-width="4" fill="none"/><text x="235" y="741" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="269">clip 적용 후 J</text><g data-container="true"><rect x="16" y="780" width="488" height="118" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="811" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">r &gt; 1.2에서 기울기 0</text><text x="32" y="851" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">이미 확률이 충분히 커진 선택을 더 밀지 않음</text></g></g></g><g transform="translate(16 944.5230769230768) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">나빴던 선택: A = −1</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">생성 당시 확률은 고정</text><text x="32" y="171" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">p_old = 0.5 · r = p_current / p_old</text></g><text x="16" y="243" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">p_current:  0.5 → 0.4 → 0.3</text><text x="16" y="280" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">r:  1 → 0.8 → 0.6</text><g data-container="true"><rect x="16" y="307" width="488" height="142" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="338" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">clip(0.6, 0.8, 1.2) = 0.8</text><text x="32" y="378" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">0.8 × (−1) = −0.8</text><text x="32" y="406" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">J = min(−0.6, −0.8) = −0.8</text></g><g transform="translate(0,180)"><rect x="80" y="332" width="133.33333333333334" height="324" rx="0" fill="#EDF7F5" stroke="#EDF7F5" stroke-width="1.5"/><text x="16" y="326" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">목적함수 J</text><path d="M80 418 L480 418" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="425" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">−0.4</text><path d="M80 486 L480 486" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="493" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">−0.8</text><path d="M80 554 L480 554" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="561" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">−1.2</text><path d="M80 622 L480 622" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="65" y="629" fill="#182C40" font-size="20" font-weight="400" text-anchor="end" data-max-width="58">−1.6</text><path d="M80 332 L80 657" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><path d="M80 657 L487 657" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><path d="M80 658 L80 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="80" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">0.4</text><path d="M213.33333333333334 658 L213.33333333333334 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="213.33333333333334" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">0.8</text><path d="M280 658 L280 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="280" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">1</text><path d="M346.66666666666663 658 L346.66666666666663 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="346.66666666666663" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">1.2</text><path d="M480.0000000000001 658 L480.0000000000001 665" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="480.0000000000001" y="695" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="60">1.6</text><text x="503" y="695" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="17">r</text><path d="M213.33333333333334 332 L213.33333333333334 657" stroke="#5C6C7C" stroke-width="1.3" fill="none" stroke-dasharray="7 5"/><path d="M346.66666666666663 332 L346.66666666666663 657" stroke="#5C6C7C" stroke-width="1.3" fill="none" stroke-dasharray="7 5"/><path d="M80 418 L480.0000000000001 622" stroke="#657789" stroke-width="3" fill="none" stroke-dasharray="7 5"/><path d="M80 486 L213.33333333333334 486 L346.66666666666663 554 L480.0000000000001 622" stroke="#2470BB" stroke-width="4" fill="none"/><circle cx="213.33333333333334" cy="486" r="5" fill="#2470BB" stroke="#2470BB"/><path d="M16 734 L62 734" stroke="#657789" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="75" y="741" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="55">rA</text><path d="M176 734 L222 734" stroke="#2470BB" stroke-width="4" fill="none"/><text x="235" y="741" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="269">clip 적용 후 J</text><g data-container="true"><rect x="16" y="780" width="488" height="118" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="811" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">r &lt; 0.8에서 기울기 0</text><text x="32" y="851" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">이미 확률이 충분히 작아진 선택을 더 누르지 않음</text></g></g></g></svg>