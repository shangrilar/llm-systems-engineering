<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1124" viewBox="0 0 360 1124" role="img" aria-labelledby="title desc"><title id="title">From inference to the buffer: what travels with experience</title><desc id="desc">A trajectory travels from the inference engine to the data buffer. The record links input and generated tokens, generation log probabilities, loss masks, rewards, policy versions, and task/group IDs, assembled from inference, environment records, evaluation, and execution management.</desc><metadata>{&quot;id&quot;:&quot;5-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0 architecture&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/developer/architecture.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">From inference to the</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">buffer: what travels with</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">experience</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">A closer look at the trajectory path</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">in Figure 1.</text><path d="M16,211 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 235) scale(0.6307692307692307)" data-panel="1"><g data-container="true"><rect x="8" y="12" width="192" height="116" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="24" y="43" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="160">Inference</text><text x="24" y="73.8" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="160">engine</text><text x="24" y="114" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="160">e.g. SGLang</text></g><g data-container="true"><rect x="320" y="12" width="192" height="116" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="336" y="43" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="160">Data buffer</text></g><path d="M212 70 L308 70" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="260" y="164" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="230">trajectory</text><path d="M260 178 V204" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5"/><rect x="8" y="220" width="504" height="1120" rx="14" fill="#FFFFFF" stroke="#7954A3" stroke-width="1.5"/><text x="30" y="260" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="460">Information linked to the experience</text><g data-container="true"><rect x="30" y="302" width="460" height="146" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="333" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Input / generated token IDs</text><text x="46" y="373" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Inference / environment → context and</text><text x="46" y="401" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">actions</text></g><g data-container="true"><rect x="30" y="468" width="460" height="146" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="499" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Generation log probabilities</text><text x="46" y="539" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Inference → probabilities at generation</text><text x="46" y="567" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">time</text></g><g data-container="true"><rect x="30" y="634" width="460" height="146" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="665" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Loss mask</text><text x="46" y="705" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Conversation / environment → tokens to</text><text x="46" y="733" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">train on</text></g><g data-container="true"><rect x="30" y="800" width="460" height="146" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="831" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Reward</text><text x="46" y="871" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Evaluation / verification → task score</text></g><g data-container="true"><rect x="30" y="966" width="460" height="146" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="997" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Policy version</text><text x="46" y="1037" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Manager / inference → weights used to</text><text x="46" y="1065" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">generate</text></g><g data-container="true"><rect x="30" y="1132" width="460" height="146" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="1163" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">Task / group ID</text><text x="46" y="1203" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">Execution manager → task and comparison</text><text x="46" y="1231" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">group</text></g></g></svg>