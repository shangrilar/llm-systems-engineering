<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Fusion은 중간값의 저장과 재읽기를 줄입니다</title><desc id="desc">동일한 입력에 대해 u=x+bias, y=ReLU(u)를 두 커널과 한 커널로 수행한다. 분리 실행은 커널 1에서 u를 계산해 전역 메모리의 중간 텐서에 저장한다. 커널 1이 끝난 뒤 커널 2가 이 텐서에서 u를 읽어 ReLU를 적용한다. 전역 메모리 접근에는 캐시가 관여하므로 모든 읽기와 쓰기가 HBM까지 이어지는 것은 아니다. Fusion은 커널 내부에서 중간값을 이어 사용해 최종결과만 저장한다. ReLU는 max(0,u)다. 중간 텐서u의 출력N개에 대해 논리적 쓰기N개와읽기N개,FP32이면8Nbyte 접근을 줄인다. 입력과 최종출력의 접근은 공통이다. 실제HBM바이트나속도향상은캐시,레지스터스필등구현의영향을받는다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1200" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Fusion은 중간값의 저장과 재읽기를 줄입니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">한번 읽어온 값으로 연속된 계산을 수행하고 최종 결과를 저장합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="180" y="211" width="840" height="72" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600.0" y="255.0" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">u = x + bias    →    y = ReLU(u)</text><rect x="48" y="319" width="536" height="770" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="365" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">분리 실행 · 커널 두 개</text><rect x="76" y="397" width="480" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="438.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">입력 x와 bias 읽기</text><path d="M316,474 L316,504" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="76" y="516" width="480" height="115" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="551" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">커널 1</text><text x="316" y="598" fill="#B55B22" font-size="30" font-weight="700" text-anchor="middle">u = x + bias</text><path d="M316,643 L316,673" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="76" y="687" width="480" height="135" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="316" y="719" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">중간 텐서 u</text><text x="316" y="750" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">전역 메모리에 저장</text><text x="316" y="781" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">→ 다음 커널에서 읽기</text><text x="316" y="810" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">출력 N개: 쓰기 N개 + 읽기 N개</text><path d="M316,833 L316,861" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="76" y="873" width="480" height="112" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="908" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">커널 2</text><text x="316" y="953" fill="#B55B22" font-size="30" font-weight="700" text-anchor="middle">y = ReLU(u)</text><path d="M316,993 L316,1012" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><rect x="76" y="1025" width="480" height="43" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="316.0" y="1054.5" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">최종 결과 y 저장</text><rect x="616" y="319" width="536" height="770" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="365" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">Fusion · 커널 하나</text><rect x="644" y="397" width="480" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="438.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">입력 x와 bias 읽기</text><path d="M884,474 L884,504" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="644" y="516" width="480" height="469" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="884" y="554" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">커널 안에서 계산을 이어감</text><text x="884" y="621" fill="#B55B22" font-size="32" font-weight="700" text-anchor="middle">u = x + bias</text><path d="M884,649 L884,694" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="884" y="735" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">중간값 u를 바로 사용</text><text x="884" y="778" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">중간 텐서의 저장·재읽기 없음</text><path d="M884,816 L884,872" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="884" y="947" fill="#B55B22" font-size="32" font-weight="700" text-anchor="middle">y = ReLU(u)</text><path d="M884,993 L884,1012" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><rect x="644" y="1025" width="480" height="43" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="884.0" y="1054.5" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">최종 결과 y 저장</text><text x="600" y="1147" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">계산과 결과는 같고, 중간값을 쓰고 다시 읽는 과정이 사라집니다.</text></svg>