<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1255" viewBox="0 0 1200 1255" role="img" aria-labelledby="title desc"><title id="title">Run Other Warps While One Waits</title><desc id="desc">Two cases compare instruction issue by one scheduler. Warp A requests a read and waits for inputs to its next addition. If B and D are ready, their instructions can be issued. Once A has its inputs, its addition can be selected. Below, all other warps are also waiting, leaving instruction issue empty during A's wait. The data wait is assumed equal in both cases. Cells do not represent actual cycles or instruction durations, or a policy of alternating B and D. A is not guaranteed to be selected immediately when ready. An empty issue slot does not stop all previously issued operations in the hardware.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1255" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 7</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Run Other Warps While One Waits</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Execute other ready work during the wait, rather than shortening memory access.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="48" y="218" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Instruction issue by one warp scheduler</text><path d="M699,211 L1140,211" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" /><text x="921" y="194" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">Time</text><rect x="48" y="250" width="1104" height="343" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="75" y="296" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">When other warps are eligible</text><text x="77" y="365" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Warp A</text><text x="77" y="400" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Input state</text><rect x="292" y="337" width="124" height="67" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="354.0" y="378.5" fill="#2470BB" font-size="18" font-weight="600" text-anchor="middle">Read request</text><rect x="430" y="337" width="538" height="67" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="699.0" y="378.5" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Waiting for inputs to the next computation</text><rect x="982" y="337" width="124" height="67" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="1044.0" y="378.5" fill="#287D78" font-size="20" font-weight="600" text-anchor="middle">Input ready</text><text x="77" y="482" fill="#182C40" font-size="21" font-weight="600" text-anchor="start">Issued instructions</text><rect x="292" y="440" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="354.0" y="483.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A read</text><rect x="430" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="492.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B instr.</text><rect x="568" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="630.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">D instr.</text><rect x="706" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="768.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B instr.</text><rect x="844" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="906.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">D instr.</text><rect x="982" y="440" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="1044.0" y="483.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A add</text><text x="600" y="560" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Instructions from B and D can execute while A waits.</text><rect x="48" y="629" width="1104" height="343" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="75" y="675" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">When all other warps are also waiting</text><text x="77" y="744" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Warp A</text><text x="77" y="779" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Input state</text><rect x="292" y="716" width="124" height="67" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="354.0" y="757.5" fill="#2470BB" font-size="18" font-weight="600" text-anchor="middle">Read request</text><rect x="430" y="716" width="538" height="67" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="699.0" y="757.5" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Waiting for inputs to the next computation</text><rect x="982" y="716" width="124" height="67" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="1044.0" y="757.5" fill="#287D78" font-size="20" font-weight="600" text-anchor="middle">Input ready</text><text x="77" y="861" fill="#182C40" font-size="21" font-weight="600" text-anchor="start">Issued instructions</text><rect x="292" y="819" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="354.0" y="862.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A read</text><rect x="430" y="819" width="538" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="699" y="861" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">No instruction issued</text><rect x="982" y="819" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="1044.0" y="862.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A add</text><text x="600" y="939" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">With no eligible warp, this scheduler cannot issue an instruction.</text><rect x="48" y="1007" width="1104" height="150" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="1057" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">Latency hiding</text><text x="600" y="1109" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">Make progress on other work during waits to reduce idle time for compute units.</text><text x="600" y="1207" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">A waits for its data for the same duration in both cases.</text></svg>