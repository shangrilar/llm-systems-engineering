<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc"><title id="title">CPU는 언제 기다릴까?</title><desc id="desc">CPU는 A와 B를 등록하고 GPU에서 CPU로 결과를 복사하는 cudaMemcpy 호출에서 기다린다. 그동안 GPU는 계산 A, 계산 B, 결과 복사를 진행한다. 결과가 CPU 메모리에 준비되면 복사 호출이 반환되고 CPU가 실제 값을 사용한다. CPU의 대기와 GPU의 작업은 같은 시간에 일어난다.</desc><metadata>{&quot;id&quot;:&quot;03-host-waits-for-result&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">CPU는 언제 기다릴까?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">완료를 기다리는 GPU → CPU 복사 호출로 결과를 가져옵니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><text x="48" y="222" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">CPU에서 실제 결과 y를 사용하는 경우</text><path d="M240,254 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1148" y="239" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="329" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU</text><text x="48" y="365" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">등록·결과 사용</text><rect x="240" y="297" width="176" height="70" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="328" y="341" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">A·B 등록</text><rect x="448" y="297" width="522" height="70" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="709" y="341" fill="#5C6C7C" font-size="26" font-weight="600" text-anchor="middle">결과 복사 호출 안에서 대기</text><rect x="970" y="297" width="168" height="70" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1054" y="341" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">결과 사용</text><text x="449" y="412" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMemcpy(..., cudaMemcpyDeviceToHost)</text><text x="48" y="526" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 작업</text><text x="48" y="562" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">계산·복사</text><rect x="320" y="492" width="270" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="455" y="544" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">계산 A</text><rect x="590" y="492" width="230" height="86" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="705" y="544" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">계산 B</text><rect x="820" y="492" width="150" height="86" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="895" y="527" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">결과 복사</text><text x="895" y="560" fill="#7954A3" font-size="19" font-weight="400" text-anchor="middle">GPU → CPU</text><path d="M970,483 V375" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#arrow-purple)"/><text x="971" y="619" fill="#7954A3" font-size="23" font-weight="600" text-anchor="end">CPU 메모리에 결과 준비</text><rect x="48" y="661" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="706" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">CPU가 기다리는 동안에도 GPU 계산과 데이터 전달은 진행됩니다.</text><text x="600" y="745" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">결과 복사가 끝나야 CPU가 y의 실제 값을 사용할 수 있습니다.</text></g></g><path d="M48,817 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="855" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">복사 호출에서 기다리는 시간에는 앞선 GPU 계산이 끝나기를 기다리는 시간도 포함될 수 있습니다.</text></svg>