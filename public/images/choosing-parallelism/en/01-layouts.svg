<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951" role="img" aria-labelledby="title desc"><title id="title">Three ways to arrange four GPUs</title><desc id="desc">Compare four single-GPU replicas, two two-GPU TP replicas, and one four-GPU TP replica.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="951" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Three ways to arrange four GPUs</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Assume TP can evenly partition the dense model’s weights in this example.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Four replicas · DP</text><rect x="48" y="241" width="264" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 0</text><text x="180" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Full W</text><rect x="328" y="241" width="264" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="460" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 1</text><text x="460" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Full W</text><rect x="608" y="241" width="264" height="140" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="740" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 2</text><text x="740" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Full W</text><rect x="888" y="241" width="264" height="140" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 3</text><text x="1020" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Full W</text><text x="48" y="438.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Two replicas of two GPUs · TP + DP</text><rect x="48" y="467" width="544" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 0</text><text x="180" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/2 of W</text><text x="460" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 1</text><text x="460" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/2 of W</text><rect x="608" y="467" width="544" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="740" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 2</text><text x="740" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/2 of W</text><text x="1020" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 3</text><text x="1020" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/2 of W</text><text x="48" y="664.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">One replica across four GPUs · TP</text><rect x="48" y="693" width="1104" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 0</text><text x="180" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/4 of W</text><text x="460" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 1</text><text x="460" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/4 of W</text><text x="740" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 2</text><text x="740" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/4 of W</text><text x="1020" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 3</text><text x="1020" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1/4 of W</text><text x="48" y="901.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPUs inside one border cooperate on the same model execution.</text></svg>