,1249 L288,1281" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="78" y="1289" width="420" height="110" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="1323" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">다음 공통 연산 · DP</text><text x="288" y="1357" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">자기 입력의 계산을 이어감</text><rect x="702" y="1147" width="420" height="94" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="1181" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">원래 토큰별 결과</text><text x="912" y="1215" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">B1 · B2</text><path d="M912,1249 L912,1281" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="702" y="1289" width="420" height="110" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="1323" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">다음 공통 연산 · DP</text><text x="912" y="1357" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">자기 입력의 계산을 이어감</text><text x="600" y="1444" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">GPU는 그대로 · 연산 부분에 따라 DP와 EP를 적용</text><text x="600" y="1527" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">예시: 공통 가중치와 Router는 복제 · Expert 가중치는 분할 · 순전파</text></g></g><path d="M48,1588 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1626" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">어텐션과 Router 가중치는 복제하므로, Expert를 반씩 나누어도 전체 메모리가 반으로 줄지는 않습니다.</text></svg>