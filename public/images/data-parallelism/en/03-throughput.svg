<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="807" viewBox="0 0 1200 807" role="img" aria-labelledby="title desc"><title id="title">Distinguish execution time from throughput</title><desc id="desc">One GPU finishes in four slots; two GPUs finish in two, while each request executes for one slot.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="807" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Distinguish execution time from throughput</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">All four requests arrive together; interference and dispatch costs are omitted.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="211.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Assume each request takes one time slot</text><rect x="48" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Deployment</text><rect x="268.8" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 1</text><rect x="489.6" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 2</text><rect x="710.4000000000001" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 3</text><rect x="931.2" y="254" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 4</text><rect x="48" y="320" width="214.8" height="92" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="354.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">1 GPU</text><rect x="268.8" y="320" width="214.8" height="92" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="354.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A</text><rect x="489.6" y="320" width="214.8" height="92" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="354.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B</text><rect x="710.4000000000001" y="320" width="214.8" height="92" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="354.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C</text><rect x="931.2" y="320" width="214.8" height="92" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="354.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D</text><rect x="48" y="420" width="214.8" height="92" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="454.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">2 GPUs · GPU 0</text><rect x="268.8" y="420" width="214.8" height="92" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="454.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A</text><rect x="489.6" y="420" width="214.8" height="92" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="454.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C</text><rect x="710.4000000000001" y="420" width="214.8" height="92" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="454.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="931.2" y="420" width="214.8" height="92" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="454.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="48" y="520" width="214.8" height="92" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="554.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">2 GPUs · GPU 1</text><rect x="268.8" y="520" width="214.8" height="92" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="554.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B</text><rect x="489.6" y="520" width="214.8" height="92" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="554.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D</text><rect x="710.4000000000001" y="520" width="214.8" height="92" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="554.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="931.2" y="520" width="214.8" height="92" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="554.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="48" y="662" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="698.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Completion of all four requests: 4 slots → 2 slots</text><text x="72" y="738.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Each request still executes for one slot; time spent in the queue can shrink.</text></svg>