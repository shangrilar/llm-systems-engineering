stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="135" y="1400" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="260">Output</text><text x="135" y="1433.6" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="260">representation</text><g data-container="true"><rect x="20" y="1510" width="480" height="250" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1541" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Reuse one global KV bank</text><text x="36" y="1581" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Layer-local state: fixed size¹</text><text x="36" y="1609" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Global KV: grows with context T</text><text x="36" y="1637" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Teal: read · Orange: update</text></g><text x="30" y="1830" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="460">¹ At fixed model size and local window</text></g></svg>