<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">행렬 곱: 입력 성분들을 조합해 출력 만들기</title><desc id="desc">입력 [1,2,−1,0]과 4×8 가중치 행렬을 곱하면 [−2,1,0.5,−1,3,0,−0.5,2]가 된다. 세 번째 열 [2,−1,−0.5,1]과 세 번째 출력 0.5를 강조하고 네 곱의 합을 보여준다. 각 토큰에는 같은 행렬을 따로 적용한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1280" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">행렬 곱: 입력 성분들을 조합해 출력 만들기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">가중치 행렬의 각 열이 출력 성분 하나를 만듭니다. 여기서는 d = 4, m = 8입니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="600" y="222" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">토큰 하나의 d개 성분으로 m개의 출력 성분을 만듭니다.</text><text x="792" y="272" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">가중치 행렬 W · d × m = 4 × 8</text><text x="204" y="377" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">입력 x · 1 × 4</text><rect x="60.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="96.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="132.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="168.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="204.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="240.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="276.0" y="410" width="72.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="312.0" y="447.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><text x="410" y="447" fill="#182C40" font-size="38" font-weight="600" text-anchor="middle">×</text><text x="519.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">1</text><rect x="480" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="480" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="480" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">2</text><rect x="480" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="519.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><path d="M519.0,566 L519.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="480" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="519.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">−2</text><text x="597.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">2</text><rect x="558" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="597.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="558" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="597.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="558" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="597.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">2</text><rect x="558" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="597.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><path d="M597.0,566 L597.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="558" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="597.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">1</text><text x="675.0" y="308" fill="#287D78" font-size="19" font-weight="600" text-anchor="middle">3</text><rect x="636" y="326" width="78" height="56" rx="0" fill="#EDF7F5" stroke="#9FC8C1" stroke-width="1"/><text x="675.0" y="363" fill="#287D78" font-s