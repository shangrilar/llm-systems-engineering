<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1493" viewBox="0 0 360 1493" role="img" aria-labelledby="title desc"><title id="title">What is stored, read, and updated?</title><desc id="desc">Compare mHC, GR and AttnRes by storage, read and update. mHC writes into mixed bypasses; GR writes into original bypasses. AttnRes reads depth sources and appends fresh output.</desc><metadata>{&quot;id&quot;:&quot;ma-14-04&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1&quot;},{&quot;label&quot;:&quot;GR&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2608.30320v1#S2.SS2&quot;},{&quot;label&quot;:&quot;AttnRes&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.24653v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 5 · Connect the three designs</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">What is stored, read, and</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">updated?</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Information along depth for one token</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">· F is Attention or MLP</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Part 13 · mHC</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="120" width="480" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Store</text><text x="36" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Multiple streams X = [x₁, x₂]</text></g><path d="M260 246 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="293" width="480" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="324" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Read → F</text><text x="36" y="364" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Read with streamwise scalars</text></g><g data-container="true"><rect x="20" y="450" width="480" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="481" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Update</text><text x="36" y="521" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Constrained bypass mix + write</text></g><text x="260" y="619" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="470">X′ = H_res X + H_post F(H_pre X)</text></g><g transform="translate(16 633.0923076923077) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Part 14 · Gated Residual</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="120" width="480" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Store</text><text x="36" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Multiple branches R = [R₁, R₂]</text></g><path d="M260 246 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="293" width="480" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="324" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Read → F</text><text x="36" y="364" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Branch norm → gates → average</text></g><g data-container="true"><rect x="20" y="450" width="480" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="481" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Update</text><text x="36" y="521" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Original bypass + scalar write</text></g><text x="260" y="619" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="470">Rᵢ′ = Rᵢ + sᵢ F(x)</text></g><g transform="translate(16 1064.7846153846153) scale(0.6307692307692307)" data-panel="3"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">C. Part 15 · Attention Residuals</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="120" width="480" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Store</text><text x="36" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Fresh depth outputs [e, f₁, f₂, …]</text></g><path d="M260 246 L260 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="293" width="480" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="324" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Read → F</text><text x="36" y="364" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Depth scores → softmax → mix</text></g><g data-container="true"><rect x="20" y="450" width="480" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="481" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Update</text><text x="36" y="521" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Append output; Block updates sum</text></g><text x="260" y="619" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="470">h = Σ αᵢ sourceᵢ → F(h) = f_new</text></g></svg>