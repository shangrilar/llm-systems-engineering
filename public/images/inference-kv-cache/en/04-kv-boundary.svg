<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="title desc"><title id="title">Token selection and KV computation are one execution apart</title><desc id="desc">Immediately after selecting x0, KV exists only for p0 p1 p2. The next execution consumes x0, creates its K/V in each layer, and selects x1. At that point x1 has no own KV; consuming x1 in the following execution creates its K/V and selects x2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1440" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Token selection and KV computation are one execution apart</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A just-selected token obtains its own K/V when it becomes input to the next</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">execution.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Immediately after selecting x0</text><rect x="88" y="252" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="136.0" y="289.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="88" y="345.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">Selected output</text><text x="442" y="220.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Available KV</text><g data-box="442,250,94,74"><rect x="442" y="250" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M442,281 H536" stroke="#287D78"/><text x="489.0" y="273.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="489.0" y="309.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="552,250,94,74"><rect x="552" y="250" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M552,281 H646" stroke="#287D78"/><text x="599.0" y="273.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="599.0" y="309.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="662,250,94,74"><rect x="662" y="250" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M662,281 H756" stroke="#287D78"/><text x="709.0" y="273.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="709.0" y="309.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="772,250,94,74"><rect x="772" y="250" width="94" height="74" fill="#F7F9FB" stroke="#526577" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M772,281 H866" stroke="#526577"/><text x="819.0" y="273.0" fill="#526577" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="819.0" y="309.0" fill="#526577" font-size="22" font-weight="700" text-anchor="middle">x0</text></g><text x="893" y="280.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">Not yet</text><text x="442" y="367.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">The model has not yet processed x0 as input.</text><path d="M136,369 L136,477" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="162" y="426.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Input to the next</text><text x="162" y="458.2" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">execution</text><rect x="88" y="510" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="136.0" y="547.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><path d="M196,539 L296,539" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="308" y="474" width="502" height="166" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="334" y="512.0" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Execute the model with x0</text><text x="334" y="560.0" fill="#B55B22" font-size="24" font-weight="400" text-anchor="start">Compute K/V for x0 in each layer</text><text x="334" y="607.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Compute scores after the final layer</text><path d="M824,557 L1020,557" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="913" y="531.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Select</text><rect x="1034" y="529" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1082.0" y="566.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><text x="1030" y="627.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">Own KV:</text><text x="1030" y="659.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">not yet</text><path d="M559,652 V688 H819 V717" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="88" y="754.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Add to KV</text><g data-box="442,729,94,74"><rect x="442" y="729" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M442,760 H536" stroke="#287D78"/><text x="489.0" y="752.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="489.0" y="788.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="552,729,94,74"><rect x="552" y="729" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M552,760 H646" stroke="#287D78"/><text x="599.0" y="752.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="599.0" y="788.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="662,729,94,74"><rect x="662" y="729" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M662,760 H756" stroke="#287D78"/><text x="709.0" y="752.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="709.0" y="788.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="772,729,94,74"><rect x="772" y="729" width="94" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M772,760 H866" stroke="#B55B22"/><text x="819.0" y="752.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="819.0" y="788.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x0</text></g><path d="M1082,683 V849 H136 V917" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="165" y="879.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Selected x1 becomes the next input</text><rect x="88" y="930" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="136.0" y="967.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><path d="M196,959 L296,959" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="308" y="894" width="502" height="166" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="334" y="932.0" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Execute the model with x1</text><text x="334" y="980.0" fill="#B55B22" font-size="24" font-weight="400" text-anchor="start">Compute K/V for x1 in each layer</text><text x="334" y="1027.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Compute scores after the final layer</text><path d="M824,977 L1020,977" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="913" y="951.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Select</text><rect x="1034" y="949" width="96" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1082.0" y="986.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="1030" y="1047.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">Own KV:</text><text x="1030" y="1079.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">not yet</text><path d="M559,1072 V1108 H929 V1137" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="88" y="1174.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Add to KV</text><g data-box="442,1149,94,74"><rect x="442" y="1149" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M442,1180 H536" stroke="#287D78"/><text x="489.0" y="1172.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="489.0" y="1208.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="552,1149,94,74"><rect x="552" y="1149" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M552,1180 H646" stroke="#287D78"/><text x="599.0" y="1172.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="599.0" y="1208.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="662,1149,94,74"><rect x="662" y="1149" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M662,1180 H756" stroke="#287D78"/><text x="709.0" y="1172.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="709.0" y="1208.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="772,1149,94,74"><rect x="772" y="1149" width="94" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M772,1180 H866" stroke="#287D78"/><text x="819.0" y="1172.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="819.0" y="1208.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">x0</text></g><g data-box="882,1149,94,74"><rect x="882" y="1149" width="94" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M882,1180 H976" stroke="#B55B22"/><text x="929.0" y="1172.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="929.0" y="1208.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x1</text></g><text x="48" y="1297.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Compute KV for the input token, then select the following token as output.</text><text x="48" y="1363.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Rounded cell: token · Split rectangle: K/V · Dashed cell: K/V not yet computed</text></svg>