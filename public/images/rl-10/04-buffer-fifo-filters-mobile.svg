<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1251" viewBox="0 0 360 1251" role="img" aria-labelledby="title desc"><title id="title">넣을 때 두 조건, 꺼낼 때 staleness를 확인한다</title><desc id="desc">버퍼에 넣기 전 중단·실패와 사용자 필터를 검사한다. 통과한 완료 그룹은 B,C,A 순으로 들어왔으면 같은 순서로 꺼낸다. 현재 v5이고 허용 간격이 1이면 가장 오래된 버전 v3인 B는 제외하고 C를 검사한다.</desc><metadata>{&quot;id&quot;:&quot;10-4&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §2.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 4</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">넣을 때 두 조건, 꺼낼 때</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">staleness를 확인한다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Miles v0.1의 세 가지 제외 사유와 기본</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">FIFO 버퍼를 단순화한 예입니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">입구 · 완료 그룹을 받기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="112" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="143" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">그룹의 생성·평가 결과</text><text x="32" y="183" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">필요한 샘플 결과를 모음</text></g><path d="M168 210 L168 252" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="262" width="298" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="293" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="266">중단·실패 확인</text><text x="32" y="333" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="266">정상 완료했는가?</text></g><path d="M319 323 L359 323" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="369" y="262" width="135" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="385" y="293" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="103">① 제외</text></g><path d="M168 395 L168 455" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="185" y="429" fill="#287D78" font-size="20" font-weight="400" text-anchor="start" data-max-width="125">통과</text><g data-container="true"><rect x="16" y="465" width="298" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="496" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="266">사용자 필터</text><text x="32" y="536" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="266">학습에 사용할 그룹인가?</text></g><path d="M319 526 L359 526" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="369" y="465" width="135" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="385" y="496" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="103">② 제외</text></g><path d="M168 598 L168 652" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="185" y="628" fill="#287D78" font-size="20" font-weight="400" text-anchor="start" data-max-width="125">통과</text><g data-container="true"><rect x="16" y="662" width="488" height="98" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="693" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">완료 그룹 버퍼에 추가</text></g></g><g transform="translate(16 727.7076923076924) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">출구 · 들어온 순서대로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="120" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">입고 순서: B → C → A</text><text x="16" y="160" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">각 버전 = 그룹에서 가장 오래된 생성 버전</text><g data-container="true"><rect x="16" y="203" width="152" height="83" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="234" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="120">B · v3</text></g><g data-container="true"><rect x="184" y="203" width="152" height="83" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="200" y="234" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="120">C · v4</text></g><g data-container="true"><rect x="352" y="203" width="152" height="83" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="368" y="234" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="120">A · v4</text></g><text x="16" y="322" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">B부터 꺼내 검사 → 다음은 C</text><path d="M260 338 L260 381" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="391" width="488" height="131" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="422" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">staleness 검사</text><text x="32" y="462" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">현재 v5 · 허용 간격 1</text></g><path d="M135 530 L135 574" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M385 530 L385 574" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="584" width="236" height="152" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="615" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">B: 5 − 3 = 2</text><text x="32" y="655" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="204">③ 초과 → 제외</text></g><g data-container="true"><rect x="268" y="584" width="236" height="152" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="284" y="615" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">C: 5 − 4 = 1</text><text x="284" y="655" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="204">통과 → 학습 배치</text></g></g></svg>