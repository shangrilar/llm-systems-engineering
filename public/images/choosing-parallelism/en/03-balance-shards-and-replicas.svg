t="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="412" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="449" y="523" width="74" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="486" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><path d="M325,394 L325,416 L201,416 L201,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M325,416 L449,416 L449,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M298,554 L352,554" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><rect x="626" y="330" width="498" height="278" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2"/><rect x="809" y="344" width="132" height="44" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="2"/><text x="875" y="373" font-size="23" fill="#287D78" font-weight="700" text-anchor="middle">C · D</text><rect x="661" y="456" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="751" y="496" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="677" y="523" width="74" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="714" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="751" y="523" width="74" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="788" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="909" y="456" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="999" y="496" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="925" y="523" width="74" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="962" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="999" y="523" width="74" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="1036" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><path d="M875,394 L875,416 L751,416 L751,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M875,416 L999,416 L999,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M848,554 L902,554" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><text x="600" y="651" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">Two groups handle different requests</text><text x="600" y="689" font-size="22" fill="#5C6C7C" font-weight="400" text-anchor="middle">Requests are assigned to independently running groups</text><rect x="48" y="740" width="1104" height="504" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="76" y="784" font-size="29" fill="#182C40" font-weight="700" text-anchor="start">TP 4 × DP 1</text><text x="1124" y="784" font-size="25" fill="#2470BB" font-weight="700" text-anchor="end">One model replica</text><text x="600" y="836" font-size="23" fill="#5C6C7C" font-weight="400" text-anchor="middle">The same requests A · B · C · D</text><rect x="76" y="866" width="1048" height="278" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2"/><rect x="471" y="880" width="258" height="44" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="2"/><text x="600" y="909" font-size="23" fill="#287D78" font-weight="700" text-anchor="middle">A · B · C · D</text><path d="M600,930 L600,952 L210,952 L210,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M600,952 L470,952 L470,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M600,952 L730,952 L730,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M600,952 L990,952 L990,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="120" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="210" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="173" y="1059" width="74" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="210" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="380" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="470" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="433" y="1059" width="74" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="470" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="640" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="730" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="693" y="1059" width="74" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="730" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="900" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="990" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="953" y="1059" width="74" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="990" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><path d="M307,1090 L373,1090" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><path d="M567,1090 L633,1090" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><path d="M827,1090 L893,1090" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><text x="600" y="1187" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">All four GPUs cooperate on the requests in one group</text><text x="600" y="1225" font-size="22" fill="#5C6C7C" font-weight="400" text-anchor="middle">One group can also batch multiple requests</text><text x="600" y="1317" font-size="27" fill="#182C40" font-weight="700" text-anchor="middle">Compare both feasible candidates</text><rect x="48" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="180" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">Memory headroom</text><rect x="328" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="460" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">Request latency</text><rect x="608" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="740" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">Total throughput</text><rect x="888" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="1020" y="1385" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">Within-group</text><text x="1020" y="1415.8" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">communication</text><text x="600" y="1496" font-size="23" fill="#5C6C7C" font-weight="400" text-anchor="middle">Adjust GPUs per model together with the number of independent replicas.</text></g></g><path d="M48,1636 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1674" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">A single group can batch several requests, so one replica does not mean one request at a time.</text></svg>