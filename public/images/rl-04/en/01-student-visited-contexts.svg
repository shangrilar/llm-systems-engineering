<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1179" viewBox="0 0 1200 1179" role="img" aria-labelledby="title desc"><title id="title">Read teacher probabilities on contexts visited by the student</title><desc id="desc">For prompt P, the SFT answer is u,a,c while the student generates u,b,d. SFT targets the given next token in contexts P,Pu,Pua. OPD evaluates teacher probabilities for the student choices u,b,d in contexts P,Pu,Pub.</desc><metadata>{&quot;id&quot;:&quot;4-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Thinking Machines — On-policy distillation&quot;,&quot;url&quot;:&quot;https://thinkingmachines.ai/blog/on-policy-distillation/&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Read teacher probabilities on contexts visited by the</text><text x="48" y="149.4" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">student</text><text x="48" y="191.4" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">SFT follows a provided answer. OPD obtains teacher signals along a path generated by the</text><text x="48" y="223.6" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">student.</text><path d="M48,252.6 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 288.6) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">SFT: a provided answer’s path</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="84" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">The same prompt P</text></g><rect x="26" y="216" width="112" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="82" y="248" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">u</text><path d="M150 240 L187 240" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="202" y="216" width="112" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="258" y="248" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">a</text><path d="M326 240 L363 240" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="378" y="216" width="112" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="434" y="248" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">c</text><text x="16" y="308" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="256">Provided-answer prefix</text><text x="304" y="308" fill="#B55B22" font-size="21" font-weight="600" text-anchor="start" data-max-width="200">Target token</text><g data-container="true"><rect x="16" y="342" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="373" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P</text><text x="32" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">Input prefix</text></g><path d="M269 392 L291 392" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="304" y="342" width="200" height="104" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="320" y="373" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">u</text><text x="320" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">Given next token</text></g><g data-container="true"><rect x="16" y="474" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="505" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u</text><text x="32" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">Input prefix</text></g><path d="M269 524 L291 524" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="304" y="474" width="200" height="104" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="320" y="505" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">a</text><text x="320" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">Given next token</text></g><g data-container="true"><rect x="16" y="606" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="637" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u + a</text><text x="32" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">Input prefix</text></g><path d="M269 656 L291 656" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="304" y="606" width="200" height="104" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="320" y="637" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">c</text><text x="320" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">Given next token</text></g><text x="16" y="762" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">The provided answer need not come from a</text><text x="16" y="791.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">teacher.</text></g><g transform="translate(624 288.6) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">OPD: the student makes the path</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="84" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">The same prompt P</text></g><rect x="26" y="216" width="112" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="82" y="248" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">u</text><path d="M150 240 L187 240" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="202" y="216" width="112" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="258" y="248" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">b</text><path d="M326 240 L363 240" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="378" y="216" width="112" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="434" y="248" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="100">d</text><text x="16" y="308" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="256">Student prefix</text><text x="304" y="308" fill="#7954A3" font-size="21" font-weight="600" text-anchor="start" data-max-width="200">Teacher p</text><g data-container="true"><rect x="16" y="342" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="373" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P</text><text x="32" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">Input prefix</text></g><path d="M269 392 L291 392" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="304" y="342" width="200" height="104" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="373" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">pT(u)</text><text x="320" y="413" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">In this context</text></g><g data-container="true"><rect x="16" y="474" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="505" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u</text><text x="32" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">Input prefix</text></g><path d="M269 524 L291 524" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="304" y="474" width="200" height="104" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="505" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">pT(b)</text><text x="320" y="545" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">In this context</text></g><g data-container="true"><rect x="16" y="606" width="242" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="637" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="210">P + u + b</text><text x="32" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="210">Input prefix</text></g><path d="M269 656 L291 656" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="304" y="606" width="200" height="104" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="637" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">pT(d)</text><text x="320" y="677" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">In this context</text></g><text x="16" y="762" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">The teacher evaluates the student’s choices.</text></g></svg>