<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">토큰 순서와 저장 위치 연결하기</title><desc id="desc">B의 논리 블록 L0는 토큰 위치 0에서 3의 KV를 담고 물리 블록 P3에 저장된다. L1은 위치 4에서 6의 KV를 담고 P0에 저장된다. C의 L0와 L1은 각각 P1과 P4에 저장된다. P2와 P5는 비어 있다. 각 논리 블록에서 블록 테이블을 거쳐 실제 KV 셀까지 연결선이 이어진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">토큰 순서와 저장 위치 연결하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">첫 실행 뒤: B의 KV 7칸과 C의 KV 6칸을 각각 2블록에 저장했습니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">논리 블록</text><text x="497" y="212.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">블록 테이블</text><text x="970" y="212.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">실제 KV 풀</text><rect x="792" y="239" width="360" height="96" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="808" y="267.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P0</text><text x="808" y="316.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">B</text><rect x="924" y="263" width="48" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="948.0" y="294.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">b4</text><rect x="977" y="263" width="48" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1001.0" y="294.0"