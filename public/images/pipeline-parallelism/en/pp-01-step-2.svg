<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc"><title id="title">Partition layers and connect forward and backward passes</title><desc id="desc">Backpropagate from the loss through layers 7 to 0. Send activation gradients to the previous stage and compute weight gradients locally.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="825" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Partition layers and connect forward and backward passes</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">One block = one Transformer layer · Arrows = computation direction for one input</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="600" y="211.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">One model · Eight Transformer layers</text><rect x="40" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="172" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 0</text><rect x="60" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="107" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 0</text><rect x="190" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="237" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 1</text><text x="172" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Stage 0 · Two layers</text><rect x="320" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="452" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 1</text><rect x="340" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="387" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 2</text><rect x="470" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="517" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 3</text><text x="452" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Stage 1 · Two layers</text><rect x="600" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="732" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 2</text><rect x="620" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="667" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 4</text><rect x="750" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="797" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 5</text><text x="732" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Stage 2 · Two layers</text><rect x="880" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="1012" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 3</text><rect x="900" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="947" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 6</text><rect x="1030" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="1077" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 7</text><text x="1012" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Stage 3 · Two layers</text><path d="M185,379 L159,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M335,379 L289,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M465,379 L439,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M615,379 L569,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M745,379 L719,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M895,379 L849,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M1025,379 L999,379" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="600" y="567.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Backward: loss → GPU 3 → GPU 2 → GPU 1 → GPU 0</text><rect x="48" y="607" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="643.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Send gradients of activations back across GPU boundaries</text><text x="72" y="683.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Each GPU also computes and retains gradients for its own weights.</text><text x="600" y="773.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">Backward computation also needs values obtained during the forward pass.</text></svg>