<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1115" viewBox="0 0 1200 1115" role="img" aria-labelledby="title desc"><title id="title">보존한 토큰으로 KV 재계산하기</title><desc id="desc">요청 B의 입력 p0부터 p6과 출력 x0, x1 이력은 중단 중에도 보존한다. 원래 KV는 x0까지 8개이며 x1의 KV는 없다. GPU KV를 반환한 뒤 공간을 확보하면 알려진 토큰 9개를 모델에 입력한다. 기존 KV 8개를 복구하고 x1의 KV를 처음 계산하며, 새 x2만 선택해 사용자에게 전달한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1115" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">보존한 토큰으로 KV 재계산하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">답변의 이력을 그대로 입력에 넣어, 생성에 필요한 계산 상태를 다시 만듭니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">요청 B · 입력 7개 + 이미 전달한 출력 x0, x1</text><rect x="48" y="242" width="340" height="772" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="66" y="281.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">1. 중단 직전</text><text x="66" y="337.0" fill="#526577" font-size="22" font-weight="700" text-anchor="start">보존한 토큰 이력</text><rect x="77" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="90.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p0</text><rect x="108" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p1</text><rect x="139" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="152.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p2</text><rect x="170" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="183.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p3</text><rect x="201" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="214.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p4</text><rect x="232" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="245.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p5</text><rect x="263" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="276.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p6</text><rect x="294" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="307.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">x0</text><rect x="325" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="338.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">x1</text><text x="66" y="507.0" fill="#526577" font-size="23" font-weight="700" text-anchor="start">GPU KV</text><rect x="77" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="90.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p0</text><rect x="108" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p1</text><rect x="139" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="152.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p2</text><rect x="170" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="183.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p3</text><rect x="201" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="214.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p4</text><rect x="232" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="245.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p5</text><rect x="263" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="276.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p6</text><rect x="294" y="538" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="307.5" y="566.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">x0</text><rect x="325" y="538" width="27" height="42" rx="5" fill="white" stroke="#526577" stroke-width="1.5" stroke-dasharray="4 4"/><text x="66" y="626.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">기존 KV 8개</text><text x="66" y="666.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">x1은 선택됐지만 KV는 아직</text><text x="66" y="695.4" fill="#526577" font-size="21" font-weight="400" text-anchor="start">없음</text><text x="66" y="832.0" fill="#526577" font-size="21" font-weight="700" text-anchor="start">사용자에게 전달한 출력</text><rect x="78" y="862" width="47" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="101.5" y="890.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">x0</text><rect x="129" y="862" width="47" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><tex