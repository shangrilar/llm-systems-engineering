<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">선택한 출력이 다음 입력이 됩니다</title><desc id="desc">입력 문맥 p0 p1 p2로 x0를 선택하고, x0를 문맥에 추가해 x1을 선택하며, x1을 추가해 x2를 선택합니다. 각 출력에서 다음 입력의 같은 토큰으로 화살표가 연결됩니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1120" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">선택한 출력이 다음 입력이 됩니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">p0 p1 p2로 시작해, 방금 선택한 토큰을 입력 문맥에 붙이며 생성을 이어 갑니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">x0 생성</text><rect x="48" y="255" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="292.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="255" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="292.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="255" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="292.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><path d="M314,283 L694,283" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="704" y="237" width="180" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="794" y="278.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="794" y="319.0" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">예측 점수</text><path d="M896,283 L1034,283" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="965" y="262.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">선택</text><rect x="1044" y="255" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="292.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="48" y="353.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="start">입력 문맥</text><path d="M1087,322 V396 H350 V517" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="470" y="439.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">선택한 토큰을 다음 입력에 추가</text><text x="48" y="490.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">x1 생성</text><rect x="48" y="525" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="562.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="525" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="562.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="525" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="562.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="312" y="525" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="350.0" y="562.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><path d="M402,553 L694,553" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="704" y="507" width="180" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="794" y="548.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="794" y="589.0" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">예측 점수</text><path d="M896,553 L1034,553" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="965" y="532.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">선택</text><rect x="1044" y="525" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="562.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><text x="48" y="623.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="start">입력 문맥</text><path d="M1087,592 V666 H438 V787" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="470" y="709.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">선택한 토큰을 다음 입력에 추가</text><text x="48" y="760.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">x2 생성</text><rect x="48" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="832.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="832.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="832.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="312" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350.0" y="832.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="400" y="795" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438.0" y="832.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><path d="M490,823 L694,823" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="704" y="777" width="180" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="794" y="818.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="794" y="859.0" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">예측 점수</text><path d="M896,823 L1034,823" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="965" y="802.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">선택</text><rect x="1044" y="795" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="832.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="48" y="893.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="start">입력 문맥</text><text x="48" y="975.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">각 실행의 마지막 입력 위치에서 나온 점수로 다음 토큰을 선택합니다.</text><text x="48" y="1040.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">입력 문맥은 생성이 참조하는 정보입니다. 실제로 다시 계산할 위치는 다음 그림에서 살펴봅니다.</text></svg>