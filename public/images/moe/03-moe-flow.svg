<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc">
<title id="title">Router에서 Combine까지</title><desc id="desc">Router가 각 토큰의 expert 두 개와 가중치를 정한다. Dispatch에서 E1은 토큰 1과 3, E2는 토큰 2, E3은 세 토큰을 받으며 E4는 입력이 없다. 각 expert는 토큰별로 MLP를 적용한다. Combine은 같은 토큰의 두 expert 출력을 가중합하고 원래 순서의 세 d차원 출력을 만든다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1570" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Router에서 Combine까지</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">토큰 3개 · expert 4개 · 토큰마다 Top-2 · expert별로 모았다가 토큰별로 합칩니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
