<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc"><title id="title">수신을 기다리는 동안 독립적인 계산하기</title><desc id="desc">A 완료 이후 GPU 1의 두 실행을 같은 시간 척도로 비교한다. 순차 실행은 수신, C, B 순이다. 동시 진행에서는 통신 스트림의 수신과 계산 스트림의 독립적인 C가 겹친다. 수신 뒤 이벤트 E를 기록하고 계산 스트림은 C 뒤 E 완료를 기다린 후 B를 실행한다. 두 그림의 수신, C, B 길이는 각각 같으며 전체 완료는 모든 B와 C가 끝난 때다. 하드웨어와 자원이 동시 실행을 허용하는 경우를 보여준다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1340" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 13 · 그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">수신을 기다리는 동안 독립적인 계산하기</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">필요한 데이터는 기다리되, 그 데이터와 무관한 계산은 함께 진행할 수 있습니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="205" width="1104" height="108" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="247" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">A 완료 이후 · 같은 데이터 전달과 같은 계산 B·C</text><text x="600" y="287" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">C는 x와 무관한 계산 · 두 스트림이 함께 실행될 자원이 있는 경우</text><text x="48" y="369" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">한 스트림에 순서대로 배치</text><path d="M250,415 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="400" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="492" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="528" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">스트림 S</text><rect x="250" y="457" width="350" height="90" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="425.0" y="511.0" fill="#4C60A8" font-size="28" font-weight="600" text-anchor="middle">수신</text><rect x="600" y="457" width="190" height="90" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="695.0" y="511.0" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">계산 C</text><rect x="790" y="457" width="250" height="90" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="915.0" y="511.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">계산 B</text><path d="M1040,558 V584" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="1040" y="616" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">B·C 완료</text><text x="48" y="689" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">통신과 독립 계산을 다른 스트림에 배치</text><text x="48" y="729" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">GPU 1의 통신 스트림은 수신 뒤에 이벤트 E를 기록합니다.</text><path d="M250,778 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="763" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="858" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="894" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">통신 스트림</text><rect x="250" y="822" width="350" height="88" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="425.0" y="875.0" fill="#4C60A8" font-size="28" font-weight="600" text-anchor="middle">수신</text><path d="M600,910 V933" fill="none" stroke="#4C60A8" stroke-width="2"/><circle cx="600" cy="943" r="8" fill="#B55B22"/><text x="629" y="952" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">이벤트 E 완료</text><path d="M600,956 V1001" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)"/><text x="48" y="1059" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="1095" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">계산 스트림</text><rect x="250" y="1016" width="190" height="90" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="345.0" y="1070.0" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">계산 C</text><rect x="440" y="1016" width="160" height="90" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="520.0" y="1055.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">이벤트 E</text><text x="520.0" y="1090.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="middle">완료 대기</text><rect x="600" y="1016" width="250" height="90" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="725.0" y="1070.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">계산 B</text><path d="M850,1117 V1144" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="850" y="1176" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">B·C 완료</text><rect x="48" y="1220" width="1104" height="82" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1265" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">B는 수신 완료와 C 완료 뒤에 실행됩니다.</text></svg>