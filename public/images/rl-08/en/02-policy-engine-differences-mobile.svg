<svg xmlns="http://www.w3.org/2000/svg" width="360" height="788" viewBox="0 0 360 788" role="img" aria-labelledby="title desc"><title id="title">Separate engine differences from model updates</title><desc id="desc">Generation v1 gives .50, training v1 .52: an engine difference. Training v1 gives .52 and v2 .60: a weight update. The overall ratio is .60/.50 = 1.2.</desc><metadata>{&quot;id&quot;:&quot;9-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §3.4, §5.3&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Separate engine</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">differences from model</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">updates</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">An illustrative comparison of</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">probabilities for the same token x,</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">given the same P and preceding tokens.</text><path d="M16,234.79999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 258.79999999999995) scale(0.6307692307692307)" data-panel="1"><g data-container="true"><rect x="40" y="20" width="440" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="56" y="51" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">Generation · v1</text><text x="56" y="91" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">P(token x): 0.50</text></g><path d="M260 164 L260 229" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="282" y="198" fill="#B55B22" font-size="20" font-weight="400" text-anchor="start" data-max-width="220">Engine gap</text><g data-container="true"><rect x="40" y="250" width="440" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="281" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">Training · v1</text><text x="56" y="321" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">P(token x): 0.52</text></g><path d="M260 394 L260 459" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="282" y="428" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="220">Weight update</text><g data-container="true"><rect x="40" y="480" width="440" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="511" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">Training · v2</text><text x="56" y="551" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">P(token x): 0.60</text></g><g data-container="true"><rect x="16" y="705" width="488" height="85" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="736" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Current training / generation probability</text><text x="32" y="776" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">0.60 / 0.50 = 1.2</text></g></g></svg>