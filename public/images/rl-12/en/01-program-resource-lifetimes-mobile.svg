<svg xmlns="http://www.w3.org/2000/svg" width="360" height="948" viewBox="0 0 360 948" role="img" aria-labelledby="title desc"><title id="title">An agent program outlives each model call</title><desc id="desc">Program P alternates Reasoning, Acting, Reasoning and Acting. GPU computation occurs during Reasoning and tool execution during Acting. In this example KV and the tool environment persist between calls and are released at termination.</desc><metadata>{&quot;id&quot;:&quot;12-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1#S4&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">An agent program outlives</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">each model call</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">The same coding program P writes,</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">tests, revises and retests. While</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">tools run, computation and memory</text><text x="16" y="205" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">have different lifetimes.</text><path d="M16,225 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 249) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Program P · one job across calls</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="118" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">Execution order →</text><rect x="124" y="149" width="91" height="78" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="169.5" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">Write</text><text x="169.5" y="212" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle" data-max-width="87">R</text><rect x="219" y="149" width="91" height="78" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="264.5" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">Test</text><text x="264.5" y="212" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle" data-max-width="87">A</text><rect x="314" y="149" width="91" height="78" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="359.5" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">Edit</text><text x="359.5" y="212" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle" data-max-width="87">R</text><rect x="409" y="149" width="91" height="78" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="454.5" y="181" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">Retest</text><text x="454.5" y="212" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle" data-max-width="87">A</text><text x="16" y="300" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="92">GPU work</text><path d="M122 336 L502 336" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="416" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="92">KV held</text><path d="M122 452 L502 452" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="532" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="92">Tool env.</text><path d="M122 568 L502 568" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="648" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="92">Tool</text><text x="16" y="677.4" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="92">work</text><path d="M122 684 L502 684" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="127" y="275" width="85" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="169.5" y="307" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">Run</text><rect x="127" y="624" width="85" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="169.5" y="656" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">—</text><rect x="222" y="275" width="85" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="264.5" y="307" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">—</text><rect x="222" y="624" width="85" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="264.5" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">Run</text><rect x="317" y="275" width="85" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="359.5" y="307" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">Run</text><rect x="317" y="624" width="85" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="359.5" y="656" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">—</text><rect x="412" y="275" width="85" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="454.5" y="307" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">—</text><rect x="412" y="624" width="85" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="454.5" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="73">Run</text><rect x="127" y="391" width="370" height="49" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="312" y="422" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle" data-max-width="356">Keep KV · choice in this example</text><rect x="127" y="507" width="370" height="49" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="312" y="538" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle" data-max-width="356">Keep files and environment</text><text x="16" y="741" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">R: Reasoning · model generation | A: Acting ·</text><text x="16" y="771.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">tool execution</text><g data-container="true"><rect x="16" y="815" width="488" height="108" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="846" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Program terminates → release resources</text><text x="32" y="886" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Call completion ≠ program termination.</text></g><text x="16" y="976" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Separate axis: scheduling state Active /</text><text x="16" y="1008.2" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Paused / Terminated</text></g></svg>