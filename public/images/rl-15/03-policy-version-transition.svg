<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1436" viewBox="0 0 1200 1436" role="img" aria-labelledby="title desc"><title id="title">복사가 끝나도 새 정책을 바로 쓰는 것은 아니다</title><desc id="desc">Trainer가 v21을 준비해 전송한다. 같은 복사 완료 시점 이후 worker A는 먼저 적용을 마치고 B는 재양자화를 계속한다. B까지 준비되었음을 확인한 뒤 새 v21 요청을 허용한다. 전환 전에 진행 중인 요청과 KV의 처리 정책을 정해야 한다.</desc><metadata>{&quot;id&quot;:&quot;15-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles P2P v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/p2p-weight-transfer.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">복사가 끝나도 새 정책을 바로 쓰는 것은 아니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">재양자화가 필요한 모델의 예시입니다. 기존 생성을 멈춘 뒤, 같은 추론 실행에 참여하는 GPU A/B를</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">갱신합니다. 막대 길이는 실측이 아닙니다.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">같은 시간축에서 본 전환</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M0 108 L506 108" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="418" y="96" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-width="96">시간</text><path d="M260 170 L260 270" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 170 L450 270" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M260 314 L260 415" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 314 L450 415" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M260 459 L260 560" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 459 L450 560" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M260 604 L260 704" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 604 L450 704" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><text x="0" y="156" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">Trainer · v21 준비와 전송</text><rect x="0" y="179" width="114" height="58" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="57" y="216" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="102">준비 v21</text><rect x="122" y="179" width="138" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="191" y="216" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="126">전송</text><text x="0" y="301" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">GPU A · 재양자화 먼저 완료</text><rect x="122" y="324" width="138" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="191" y="361" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="126">복사</text><rect x="266" y="324" width="120" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="326" y="361" fill="#B55B22" font-size="19" font-weight="600" text-anchor="middle" data-max-width="112">재양자화</text><rect x="392" y="324" width="48" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="416" y="361" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="36">✓</text><path d="M392 398 L440 398" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><text x="0" y="446" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">GPU B · 재양자화 진행 중</text><rect x="122" y="469" width="138" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="191" y="506" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="126">복사</text><rect x="266" y="469" width="174" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="353" y="506" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="162">재양자화</text><text x="0" y="591" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">새 요청 허용 상태</text><rect x="0" y="614" width="440" height="58" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="220" y="651" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="428">대기 · 중간 상태를 사용하지 않음</text><rect x="450" y="614" width="58" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="479" y="651" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="46">✓</text><circle cx="260" cy="718" r="19" fill="#F1F4F7" stroke="#5C6C7C"/><text x="260" y="725" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle" data-max-width="32">1</text><circle cx="450" cy="718" r="19" fill="#EDF7F5" stroke="#287D78"/><text x="450" y="725" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle" data-max-width="32">2</text><g data-container="true"><rect x="0" y="779" width="508" height="113" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="16" y="810" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="476">① 복사 완료</text><text x="16" y="850" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">숫자는 도착했지만 추론용 표현은 준비 중</text></g><g data-container="true"><rect x="0" y="919" width="508" height="150" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="16" y="950" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="476">② 전환 확인 후 v21 새 요청 허용</text><text x="16" y="990" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">갱신에 참여한 A/B 모두 준비됐는지 확인. A만</text><text x="16" y="1018" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">완료됐다고 재개하지 않음</text></g></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">가중치 변환과 별개인 전환 작업</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="111" width="488" height="180" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="142" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">기존 요청 정리</text><text x="32" y="182" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">가중치를 바꾸기 전에 완료까지 기다리거나 중단.</text><text x="32" y="210" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">이어가기는 엔진의 지원 방식에 따름</text></g><path d="M260 311 L260 349" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="370" width="488" height="180" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="401" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">이전 가중치의 KV 처리</text><text x="32" y="441" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">이전 KV의 사용 조건을 확인하고, 필요한 캐시를</text><text x="32" y="469" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">비우거나 문맥을 다시 계산</text></g><path d="M260 570 L260 608" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="629" width="488" height="180" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="660" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">모두 준비되면 v21으로 재개</text><text x="32" y="700" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">A/B의 가중치 준비와 요청·캐시 처리를 확인한 뒤</text><text x="32" y="728" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">함께 생성 재개</text></g></g></svg>