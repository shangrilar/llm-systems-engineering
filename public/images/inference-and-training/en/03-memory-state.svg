<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1394" viewBox="0 0 1200 1394" role="img" aria-labelledby="title desc"><title id="title">GPU memory in training and inference</title><desc id="desc">Both training and inference store model weights in GPU memory. Training retains activations for backpropagation, gradients, and optimizer state; inference retains KV for later generation. Both also need intermediate values and workspace. Cards compare storage roles, not memory amounts or proportions.</desc><metadata>{&quot;id&quot;:&quot;03-memory-state&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">GPU memory in training and inference</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Both use model weights, but retain different state for the computations that follow.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="219" fill="#287D78" font-size="29" font-weight="700" text-anchor="start">Training</text><text x="642" y="219" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Inference</text><g data-box="48,255,510,126"><rect x="48" y="255" width="510" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="290" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Model weights W</text><text x="68" y="333" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Shared by inputs in a batch</text><text x="68" y="363.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Updated during training</text></g><g data-box="642,255,510,126"><rect x="642" y="255" width="510" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="290" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Model weights W</text><text x="662" y="333" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Shared by multiple requests</text><text x="662" y="363.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Kept fixed during generation</text></g><text x="48" y="433" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">Retained for weight updates</text><text x="642" y="433" fill="#B55B22" font-size="26" font-weight="700" text-anchor="start">Retained for later generation</text><g data-box="48,470,510,132"><rect x="48" y="470" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="505" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Saved activations</text><text x="68" y="548" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Forward-pass intermediate values</text><text x="68" y="578.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Retained for backward</text></g><g data-box="48,622,510,132"><rect x="48" y="622" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="657" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Gradients</text><text x="68" y="700" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Computed by backpropagation</text><text x="68" y="730.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Used to update the weights</text></g><g data-box="48,774,510,132"><rect x="48" y="774" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="809" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Optimizer state</text><text x="68" y="852" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Running statistics, for example</text><text x="68" y="882.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Contents depend on the optimizer</text></g><g data-box="642,470,510,132"><rect x="642" y="470" width="510" height="132" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="662" y="505" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV cache</text><text x="662" y="548" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">K and V from processed tokens</text><text x="662" y="578.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reused in later generation</text></g><text x="642" y="661" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">State for a request’s context</text><text x="642" y="714" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">Keeping more requests active</text><text x="642" y="747.6" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">or retaining longer contexts</text><text x="642" y="781.2" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">increases the space needed for KV.</text><g data-box="48,955,1104,142"><rect x="48" y="955" width="1104" height="142" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="990" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Both also need intermediate values and workspace</text><text x="70" y="1032" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Inference also creates activations during execution, without retaining them for</text><text x="70" y="1062.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">backpropagation.</text></g><text x="48" y="1141" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Cards explain storage roles, not a partition into separate memory regions or actual</text><text x="48" y="1171.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">amounts and proportions.</text><text x="48" y="1204" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Typical full-parameter training and generation with KV caching, with state on the GPU.</text><text x="48" y="1234.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Storage choices can vary.</text></g></g><path d="M48,1286 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1324" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Training keeps state for the backward pass and updates; inference keeps the KV cache for later</text><text x="48" y="1353.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">generation.</text></svg>