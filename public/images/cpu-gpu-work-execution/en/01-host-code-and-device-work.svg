<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Where does this code run?</title><desc id="desc">CPU code requests GPU buffers, an input copy, kernel launches A and B, and a result copy. GPU kernel A adds 1 to the input; B doubles the intermediate values. Input [1,2,3,4] is copied to the GPU, passes through x, u, and y, and returns to the CPU as [4,6,8,10]. Intermediate values u stay on the GPU. Dashed arrows represent launch requests; solid arrows represent data flow.</desc><metadata>{&quot;id&quot;:&quot;01-host-code-and-device-work&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Where does this code run?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Connect CPU calls to the kernel bodies that run on the GPU.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><rect x="48" y="210" width="510" height="424" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="612" y="210" width="540" height="424" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="251" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Calling code on the CPU</text><text x="640" y="251" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Kernel bodies on the GPU</text><text x="76" y="297" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMalloc(...)</text><text x="76" y="325" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Allocate GPU buffers for x, u, and y</text><text x="76" y="366" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMemcpy(...)</text><text x="76" y="394" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Copy CPU input to the GPU</text><text x="76" y="590" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMemcpy(...)</text><text x="76" y="618" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Copy GPU results to the CPU</text><text x="76" y="445" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace">A&lt;&lt;&lt;...&gt;&gt;&gt;(d_x, d_u);</text><text x="76" y="521" fill="#287D78" font-size="23" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace">B&lt;&lt;&lt;...&gt;&gt;&gt;(d_u, d_y);</text><rect x="640" y="398" width="484" height="70" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="425" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">Compute A</text><text x="662" y="453" fill="#2470BB" font-size="24" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">u[i] = x[i] + 1;</text><rect x="640" y="474" width="484" height="70" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="501" fill="#287D78" font-size="21" font-weight="600" text-anchor="start">Compute B</text><text x="662" y="529" fill="#287D78" font-size="24" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">y[i] = 2 * u[i];</text><path d="M544,437 H631" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)" stroke-dasharray="7 7"/><path d="M544,513 H631" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)" stroke-dasharray="7 7"/><text x="640" y="310" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">The CPU requests allocation and copies</text><text x="640" y="347" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">GPU threads perform the computation</text><path d="M646,588 H704" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)" stroke-dasharray="7 7"/><text x="719" y="596" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Dashed: kernel launch request</text><text x="48" y="698" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Where data lives and how it moves</text><rect x="48" y="736" width="226" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="161" y="776" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">CPU memory</text><rect x="343" y="736" width="514" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="776" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">GPU memory</text><rect x="926" y="736" width="226" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="1039" y="776" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">CPU memory</text><text x="161" y="829" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Input x</text><text x="161" y="865" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">[1, 2, 3, 4]</text><rect x="364" y="806" width="112" height="62" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="420" y="846" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">x</text><rect x="544" y="806" width="112" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="846" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">u</text><rect x="724" y="806" width="112" height="62" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="780" y="846" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">y</text><path d="M278,837 H355" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#arrow-purple)"/><path d="M860,837 H918" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#arrow-purple)"/><path d="M482,837 H535" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="507" y="793" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">A</text><path d="M662,837 H715" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="688" y="793" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">B</text><text x="1039" y="829" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Result y</text><text x="1039" y="865" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">[4, 6, 8, 10]</text><rect x="48" y="938" width="1104" height="82" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="983" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Intermediate values u stay on the GPU as input to B.</text></g></g><path d="M48,1062 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1100" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Dashed lines are execution requests; solid lines are data movement. Values are illustrative.</text></svg>