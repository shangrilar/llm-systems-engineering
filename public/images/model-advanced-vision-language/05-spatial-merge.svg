<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1363" viewBox="0 0 1200 1363" role="img" aria-labelledby="title desc"><title id="title">이웃한 네 벡터를 하나의 긴 벡터로 묶습니다</title><desc id="desc">첫 글의 네 패치 예시를 16개로 확장했습니다. 각 2×2 공간 그룹의 hidden state 네 개를 정해진 순서로 이어 붙입니다. [16,4]가 [4,16]이 되어 벡터 개수는 4분의 1, 폭은 4배이며 총 64개 값은 보존됩니다. 이 재배열 자체는 평균이나 값 삭제가 아닙니다. 실제 연결에서는 pooling이나 query resampler 등 다른 축소 방법도 사용하며 재배열과 projector를 하나의 모듈로 구현할 수도 있습니다.</desc><metadata>{&quot;id&quot;:&quot;ma-22-01&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek V4.1 multimodal architecture&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" m