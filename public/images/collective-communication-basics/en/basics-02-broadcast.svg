<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="777" viewBox="0 0 1200 777" role="img" aria-labelledby="title desc">
<title id="title">Broadcast: the same data for everyone</title><desc id="desc">GPU 0 supplies [1,2]. All four participants, including root 0, receive [1,2] in their output buffers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="777" fill="white" />
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Collective Communication Basics · Figure 2</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Broadcast: the same data for everyone</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">The root supplies the source data. Here, GPU 0 is the root.</text><path d="M48,169 H1152" stroke="#DCE4EC" /><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Before communication · input buffers</text><rect x="48" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5" /><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="222" y="244" width="72" height="30" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="258" y="266" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle">root</text><rect x="72" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="124.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="236.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M180,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="328" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5" /><text x="364" y="267" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="460" y="326.0" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">No source input</text><rect x="608" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="624" y="244" width="8" height="27" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5" /><text x="644" y="267" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="740" y="326.0" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">No source input</text><rect x="888" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="904" y="244" width="8" height="27" rx="3" fill="#B55B22" stroke="#B55B22" stroke-width="1.5" /><text x="924" y="267" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="1020" y="326.0" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">No source input</text><rect x="48" y="417" width="1104" height="72" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="463" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Copy GPU 0’s entire array to every participant’s output buffer</text><path d="M180,499 V534" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M460,499 V534" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M740,499 V534" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><path d="M1020,499 V534" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><text x="48" y="570" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">After completion · output buffers</text><rect x="48" y="595" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="64" y="610" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5" /><text x="84" y="633" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="222" y="610" width="72" height="30" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="258" y="632" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle">root</text><rect x="72" y="659" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="124.0" y="690" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="659" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="236.0" y="690" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><rect x="328" y="595" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="344" y="610" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5" /><text x="364" y="633" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="659" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="404.0" y="690" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="464" y="659" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="516.0" y="690" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><rect x="608" y="595" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="624" y="610" width="8" height="27" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5" /><text x="644" y="633" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><rect x="632" y="659" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="684.0" y="690" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="744" y="659" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="796.0" y=