<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1007" viewBox="0 0 1200 1007" role="img" aria-labelledby="title desc"><title id="title">The same average can hide different gaps</title><desc id="desc">Two streams have ITLs of 35/35ms and 5/65ms. Both have TPOT 35ms/token, but the second has a 65ms gap.</desc><metadata>{&quot;id&quot;:&quot;03-average-and-gaps&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">The same average can hide different gaps</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">TPOT averages the intervals. ITL exposes each individual gap.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="205" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Both cases span 70 ms from the first to the last token</text><text x="48" y="245" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Even intervals</text><path d="M170,330 L940,330" stroke="#5C6C7C" stroke-width="2" fill="none"/><circle cx="170" cy="330" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><text x="170" y="369" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">x0</text><circle cx="555" cy="330" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><text x="555" y="369" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">x1</text><circle cx="940" cy="330" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><text x="940" y="369" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">x2</text><path d="M170,310 L555,310" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M170,302 L170,318" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M555,302 L555,318" stroke="#2470BB" stroke-width="2" fill="none"/><text x="362.5" y="290" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">35 ms</text><path d="M555,310 L940,310" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M555,302 L555,318" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M940,302 L940,318" stroke="#2470BB" stroke-width="2" fill="none"/><text x="747.5" y="290" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">35 ms</text><text x="990" y="337" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">TPOT</text><text x="980" y="377" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">35 ms/token</text><text x="48" y="505" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">A long output gap</text><path d="M170,590 L940,590" stroke="#5C6C7C" stroke-width="2" fill="none"/><circle cx="170" cy="590" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="170" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">x0</text><circle cx="225" cy="590" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="225" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">x1</text><circle cx="940" cy="590" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="940" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">x2</text><path d="M170,570 L225,570" stroke="#287D78" stroke-width="2" fill="none"/><path d="M170,562 L170,578" stroke="#287D78" stroke-width="2" fill="none"/><path d="M225,562 L225,578" stroke="#287D78" stroke-width="2" fill="none"/><text x="197.5" y="550" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle"></text><path d="M197.5,562 L270,525" stroke="#287D78" stroke-width="2" fill="none"/><text x="280" y="523" fill="#287D78" font-size="22" font-weight="700" text-anchor="start">5 ms</text><path d="M225,570 L940,570" stroke="#287D78" stroke-width="2" fill="none"/><path d="M225,562 L225,578" stroke="#287D78" stroke-width="2" fill="none"/><path d="M940,562 L940,578" stroke="#287D78" stroke-width="2" fill="none"/><text x="582.5" y="550" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">65 ms</text><text x="990" y="597" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">TPOT</text><text x="980" y="637" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">35 ms/token</text><rect x="250" y="653" width="650" height="55" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="575" y="688" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">No next output for 65 ms</text><rect x="48" y="775" width="1104" height="100" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="80" y="816" fill="#7954A3" font-size="27" font-weight="700" text-anchor="start">The same average can hide a pause during generation.</text><text x="80" y="852" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">(35 + 35) / 2 = (5 + 65) / 2 = 35 ms/token</text></g></g><path d="M48,929 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="967" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Even with the same TPOT, individual token intervals can reveal a long pause during generation.</text></svg>