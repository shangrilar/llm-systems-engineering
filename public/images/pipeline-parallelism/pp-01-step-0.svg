<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="825" viewBox="0 0 1200 825" role="img" aria-labelledby="title desc"><title id="title">모델의 레이어를 나누고, 계산의 앞뒤를 연결하기</title><desc id="desc">8개 레이어를 GPU 0부터 3까지 두 개씩 배치한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="825" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">모델의 레이어를 나누고, 계산의 앞뒤를 연결하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">블록 하나 = Transformer 레이어 하나 · 화살표 = 한 입력의 계산 방향</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="600" y="211.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">하나의 모델 · Transformer 레이어 8개</text><rect x="40" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="172" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 0</text><rect x="60" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="107" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 0</text><rect x="190" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="237" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 1</text><text x="172" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">단계 0 · 레이어 2개</text><rect x="320" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="452" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 1</text><rect x="340" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="387" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 2</text><rect x="470" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="517" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 3</text><text x="452" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">단계 1 · 레이어 2개</text><rect x="600" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="732" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 2</text><rect x="620" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="667" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 4</text><rect x="750" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="797" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 5</text><text x="732" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">단계 2 · 레이어 2개</text><rect x="880" y="247" width="264" height="281" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="1012" y="285.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 3</text><rect x="900" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="947" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 6</text><rect x="1030" y="326" width="94" height="106" rx="10" fill="#edf5fd" stroke="#2470bb" stroke-width="1.5"/><text x="1077" y="385.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">층 7</text><text x="1012" y="477.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">단계 3 · 레이어 2개</text><rect x="48" y="570" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="606.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">각 GPU는 자기 레이어의 가중치와 계산을 담당</text><text x="72" y="646.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">입력 하나는 네 GPU의 레이어를 모두 통과합니다.</text><text x="600" y="746.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">다음: 순전파와 역전파의 전달 방향 보기</text></svg>