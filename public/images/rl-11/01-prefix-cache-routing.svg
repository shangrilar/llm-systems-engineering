<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1127" viewBox="0 0 1200 1127" role="img" aria-labelledby="title desc"><title id="title">이미 계산한 prefix와 엔진의 대기열을 함께 본다</title><desc id="desc">공유 prefix P에서 응답 a와 b가 갈라지고 멀티턴에서는 응답 a와 도구 관측 뒤 새 입력이 붙는다. 엔진 A는 P의 KV가 있지만 긴 대기열, B는 P가 없지만 짧은 대기열이다. 라우터는 재계산과 대기를 함께 비교한다.</desc><metadata>{&quot;id&quot;:&quot;11-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/tree/v0.1.0&quot;},{&quot;label&quot;:&quot;SGLang RadixAttention&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2312.07104&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">이미 계산한 prefix와 엔진의 대기열을 함께 본다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">엔진을 선택할 수 있는 요청의 예입니다. 같은 토큰 prefix의 KV를 재사용하면 입력 계산을 줄일 수</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">있습니다. 캐시가 가장 많이 맞는 엔진이 항상 가장 빨리 끝나는 것은 아닙니다.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">어디까지 같은 문맥인가</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="106" width="488" height="113" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="137" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">P · 공통 입력 prefix</text><text x="32" y="177" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">같은 token IDs와 앞선 문맥</text></g><path d="M126 225 L126 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M388 225 L388 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="288" width="230" height="122" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="319" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">응답 a</text><text x="32" y="359" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">고유 suffix</text></g><g data-container="true"><rect x="274" y="288" width="230" height="122" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="290" y="319" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">응답 b</text><text x="290" y="359" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">다른 suffix</text></g><text x="16" y="463" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">P는 공유해도 a와 b의 KV는 다릅니다.</text><text x="16" y="551" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">a의 다음 턴 입력</text><rect x="16" y="586" width="80" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="618" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">P</text><rect x="106" y="586" width="80" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="146" y="618" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">a</text><rect x="196" y="586" width="168" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="280" y="618" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="156">도구 관측</text><rect x="374" y="586" width="130" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="439" y="618" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="118">새 입력</text><text x="16" y="690" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">누적된 문맥 중 실제로 남아 있고 일치하는</text><text x="16" y="720.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">부분까지 재사용</text></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">가상 엔진 상태와 배치 판단</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="16" y="102" width="488" height="191" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="139" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start" data-max-width="456">엔진 A · 긴 prefix hit</text><rect x="32" y="168" width="160" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="112" y="200" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="148">KV(P)</text><text x="213" y="198" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="277">입력 재계산 적음</text><text x="32" y="257" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="100">대기열</text><rect x="145" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="198" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="251" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="304" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="357" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="410" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="16" y="322" width="488" height="191" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="359" fill="#B55B22" font-size="24" font-weight="600" text-anchor="start" data-max-width="456">엔진 B · prefix miss</text><rect x="32" y="386" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="112" y="418" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="142">KV 없음</text><text x="213" y="418" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="277">입력 재계산 필요</text><text x="32" y="477" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="100">대기열</text><rect x="145" y="452" width="43" height="35" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M260 520 L260 574" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><g data-container="true"><rect x="16" y="584" width="488" height="135" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="615" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Router: 개념적 판단 기준</text><text x="32" y="655" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">재계산 비용 + 대기 비용 → 배치 결정</text></g><text x="16" y="772" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">높은 hit 비율 ≠ 짧은 완료 시간</text></g></svg>