<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="927" viewBox="0 0 1200 927" role="img" aria-labelledby="title desc"><title id="title">Ring: distribute the completed chunks</title><desc id="desc">Three All-Gather steps give all GPUs chunks A–D; with Reduce-Scatter, there are six steps.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="927" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Ring: distribute the completed chunks</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">The A–D labels identify result chunks; each row lists the chunks now held.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="198" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">State</text><rect x="268.8" y="198" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="489.6" y="198" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="710.4000000000001" y="198" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 2</text><rect x="931.2" y="198" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 3</text><rect x="48" y="264" width="214.8" height="80" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Start</text><rect x="268.8" y="264" width="214.8" height="80" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A</text><rect x="489.6" y="264" width="214.8" height="80" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B</text><rect x="710.4000000000001" y="264" width="214.8" height="80" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C</text><rect x="931.2" y="264" width="214.8" height="80" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D</text><rect x="48" y="352" width="214.8" height="80" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="386.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">After step 1</text><rect x="268.8" y="352" width="214.8" height="80" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="386.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · D</text><rect x="489.6" y="352" width="214.8" height="80" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="386.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B</text><rect x="710.4000000000001" y="352" width="214.8" height="80" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="386.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B · C</text><rect x="931.2" y="352" width="214.8" height="80" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="386.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C · D</text><rect x="48" y="440" width="214.8" height="80" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="474.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">After step 2</text><rect x="268.8" y="440" width="214.8" height="80" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="474.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · C · D</text><rect x="489.6" y="440" width="214.8" height="80" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="474.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · D</text><rect x="710.4000000000001" y="440" width="214.8" height="80" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="474.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C</text><rect x="931.2" y="440" width="214.8" height="80" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="474.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B · C · D</text><rect x="48" y="528" width="214.8" height="80" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">After step 3</text><rect x="268.8" y="528" width="214.8" height="80" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C · D</text><rect x="489.6" y="528" width="214.8" height="80" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C · D</text><rect x="710.4000000000001" y="528" width="214.8" height="80" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C · D</text><rect x="931.2" y="528" width="214.8" height="80" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C · D</text><rect x="48" y="650" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="686.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">GPU 0 → GPU 1 → GPU 2 → GPU 3 → GPU 0</text><text x="72" y="726.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Forward one completed chunk per step. Do not add it again.</text><rect x="48" y="784" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="820.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Final result on every GPU</text><text x="72" y="860.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">[A, B, C, D] = [1111, 2222, 3333, 4444]</text></svg>