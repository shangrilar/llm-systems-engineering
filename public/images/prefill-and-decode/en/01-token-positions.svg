<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">Positions computed now and context attended to</title><desc id="desc">Prefill computes projections and MLPs at four input positions with triangular causal attention. Decode computes one new input position per request, while each Q attends to its own request’s K/V of length L.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1260" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Positions computed now and context attended to</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Token-wise work depends on current positions; attention also depends on context</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">length.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="213.0" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">Prefill: one request, four input tokens</text><rect x="48" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="91.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="148" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="191.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="248" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="291.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="348" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="391.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p3</text><g data-box="502,243,650,133"><rect x="502" y="243" width="650" height="133" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="522" y="278.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Token-wise operations: T = 4</text><text x="522" y="321.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Projections and MLP compute four input positions</text><text x="522" y="351.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Each query attends to its past and current K/V</text></g><text x="48" y="418.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Causal attention: Q rows, K/V columns</text><text x="258" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p0</text><text x="324" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p1</text><text x="390" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p2</text><text x="456" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p3</text><text x="48" y="520.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p0)</text><rect x="232" y="488" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="517.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="488" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="517.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><rect x="364" y="488" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="517.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><rect x="430" y="488" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="517.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><text x="48" y="576.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p1)</text><rect x="232" y="544" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="573.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="544" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="573.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="364" y="544" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="573.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><rect x="430" y="544" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="573.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><text x="48" y="632.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p2)</text><rect x="232" y="600" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="629.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="600" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="629.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="364" y="600" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="629.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="430" y="600" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="629.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><text x="48" y="688.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p3)</text><rect x="232" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="364" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="430" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><g data-box="642,463,510,240"><rect x="642" y="463" width="510" height="240" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="498.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Compute Q for multiple positions</text><text x="662" y="541.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q: [4, d] · K/V: [4, d]</text><text x="662" y="571.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Logical score shape: [4, 4]</text><text x="662" y="602.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Future positions are masked out</text></g><text x="48" y="779.0" fill="#B55B22" font-size="27" font-weight="700" text-anchor="start">Decode: B requests, one new input each</text><g data-box="48,808,510,196"><rect x="48" y="808" width="510" height="196" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="68" y="843.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Token-wise operations: T = B</text><text x="68" y="886.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">New input x0 for request A</text><text x="68" y="916.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">New input x0 for request B</text><text x="68" y="947.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Independent tokens and contexts</text></g><g data-box="642,808,510,196"><rect x="642" y="808" width="510" height="196" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="843.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Attend to this request’s K/V</text><text x="662" y="886.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Per-request Q: [1, d]</text><text x="662" y="916.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Per-request K/V: [L, d]</text><text x="662" y="947.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Per-request scores: [1, L]</text></g><g data-box="48,1044,1104,114"><rect x="48" y="1044" width="1104" height="114" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="1079.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">T: positions computed now · L: one request’s attended context length</text><text x="70" y="1121.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Shapes are for one head. L includes the current position and can differ by request.</text></g><text x="48" y="1205.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">● Attended / — Masked future. The logical score array need not be materialized in</text><text x="48" y="1235.8" fill="#526577" font-size="22" font-weight="400" text-anchor="start">memory.</text></svg>