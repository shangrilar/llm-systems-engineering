<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1445" viewBox="0 0 1200 1445" role="img" aria-labelledby="title desc"><title id="title">토큰을 Expert로 보내고 원래 위치로 돌려받기</title><desc id="desc">원격 결과는 GPU 경계를 다시 건너고, 로컬 결과는 같은 GPU에 남습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1445" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">토큰을 Expert로 보내고 원래 위치로 돌려받기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">회수: 결과를 출발 GPU로</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="205" width="480" height="1090" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="1090" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="291.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">출발 위치: 시퀀스 A</text><text x="288" y="341.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">A1 · A2</text><rect x="78.0" y="398" width="420" height="112" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="432.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="288" y="466.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">같은 가중치 · 자기 토큰으로 선택</text><text x="288" y="497.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">A1 → E0    A2 → E2</