hor="middle">Q and K at the same position receive the same rotation.</text><path d="M600,1140 L600,1178" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="80.0" y="1196" width="1040" height="76" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1228" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">Causal mask → Softmax → PV</text><text x="600" y="1256" fill="#728190" font-size="21" font-weight="400" text-anchor="middle">Use the new scores to determine weights on the Values</text><rect x="48" y="1330" width="1104" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1374" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Scores now reflect both the Q–K content and relative position.</text><path d="M48,1490 L1152,1490" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1531" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Illustrative rates: 30° / 10° per position. Decimals are rounded to three places.</text>
