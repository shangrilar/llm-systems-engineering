<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">두 값을 더할 때 일어나는 일</title><desc id="desc">입력 읽기, 덧셈 실행, 결과 보관, 결과 저장의 네 단계. 메모리에 있는 a=2와 b=3을 register로 읽고 CUDA Core에서 더한 결과 c=5를 register에 담은 뒤 메모리에 저장한다. 캐시와 데이터 이동 장치의 세부 동작은 생략한다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1080" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">두 값을 더할 때 일어나는 일</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">a = 2, b = 3을 읽어 c = 5를 만드는 과정을 따라갑니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="220" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="266" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">① 입력 읽기</text><text x="72" y="526" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">입력 값을 register로 가져옵니다.</text><rect x="624" y="220" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="648" y="266" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">② 덧셈 실행</text><text x="648" y="526" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">준비된 두 값을 CUDA Core가 더합니다.</text><rect x="48" y="612" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="658" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">③ 결과 보관</text><text x="72" y="918" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">계산 결과를 register에 담습니다.</text><rect x="624" y="612" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="648" y="658" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">④ 결과 저장</text><text x="648" y="918" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">register의 결과를 메모리에 씁니다.</text><rect x="76" y="310" width="176" height="164" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.0" y="349" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">메모리</text><text x="164.0" y="399" fill="#2470BB" font-size="26" font-weight="400" text-anchor="middle">a = 2</text><text x="164.0" y="436" fill="#2470BB" font-size="26" font-weight="400" text-anchor="middle">b = 3</text><rect x="372" y="310" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="460.0" y="349" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="460.0" y="399" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">a = 2</text><text x="460.0" y="436" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">b = 3</text><path d="M261,392 L359,392" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><text x="310" y="367" fill="#2470BB" font-size="20" font-weight="600" text-anchor="middle">읽기</text><rect x="652" y="310" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="740.0" y="349" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="740.0" y="399" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">a = 2</text><text x="740.0" y="436" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">b = 3</text><rect x="948" y="310" width="176" height="164" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="1036.0" y="349" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">CUDA Core</text><text x="1036.0" y="399" fill="#B55B22" font-size="26" font-weight="400" text-anchor="middle">2 + 3</text><path d="M837,392 L935,392" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="886" y="367" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">입력</text><rect x="76" y="702" width="176" height="164" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.0" y="741" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">CUDA Core</text><text x="164.0" y="791" fill="#B55B22" font-size="26" font-weight="400" text-anchor="middle">2 + 3 = 5</text><rect x="372" y="702" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="460.0" y="741" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="460.0" y="791" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">c = 5</text><path d="M261,784 L359,784" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="310" y="759" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">결과</text><rect x="652" y="702" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="740.0" y="741" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="740.0" y="791" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">c = 5</text><rect x="948" y="702" width="176" height="164" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1036.0" y="741" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">메모리</text><text x="1036.0" y="791" fill="#2470BB" font-size="26" font-weight="400" text-anchor="middle">c = 5</text><path d="M837,784 L935,784" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><text x="886" y="759" fill="#2470BB" font-size="20" font-weight="600" text-anchor="middle">쓰기</text><text x="600" y="1031" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">계산의 앞뒤에는 데이터를 읽고 저장하는 과정이 있습니다.</text></svg>