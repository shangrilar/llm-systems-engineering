<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1091" viewBox="0 0 1200 1091" role="img" aria-labelledby="title desc"><title id="title">Optimization reveals the next target</title><desc id="desc">Attention, MLP, and other operations take 60/30/10, then 20/30/10, then 20/15/10 ms. Totals of 100, 60, and 45 ms use one time scale. Measure, improve, and measure again. Illustrative sequential execution.</desc><metadata>{&quot;id&quot;:&quot;01-shifting-bottlenecks&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Optimization reveals the next target</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Connect a faster operation to the time saved across the whole run.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="198" width="22" height="22" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="82" y="216" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">Attention</text><rect x="258" y="198" width="22" height="22" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="292" y="216" fill="#B55B22" font-size="21" font-weight="400" text-anchor="start">MLP</text><rect x="410" y="198" width="22" height="22" rx="4" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="444" y="216" fill="#7954A3" font-size="21" font-weight="400" text-anchor="start">Other</text><text x="1152" y="216" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end">Same time scale · Unit: ms</text><path d="M282,280 V369 M282,446 V535 M282,612 V701" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="282" y="254" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">0</text><path d="M422,280 V369 M422,446 V535 M422,612 V701" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="422" y="254" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">20</text><path d="M562,280 V369 M562,446 V535 M562,612 V701" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="562" y="254" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">40</text><path d="M702,280 V369 M702,446 V535 M702,612 V701" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="702" y="254" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">60</text><path d="M842,280 V369 M842,446 V535 M842,612 V701" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="842" y="254" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">80</text><path d="M982,280 V369 M982,446 V535 M982,612 V701" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="982" y="254" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">100</text><text x="48" y="317" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="start">01</text><text x="48" y="353" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">Initial run</text><rect x="282" y="295" width="420" height="66" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="492" y="337" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">60</text><rect x="702" y="295" width="210" height="66" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="807" y="337" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">30</text><rect x="912" y="295" width="70" height="66" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="947" y="337" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">10</text><text x="1004" y="337" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">100 ms</text><text x="282" y="399" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Attention takes the most time</text><text x="48" y="483" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="start">02</text><text x="48" y="519" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">Optimize Attention</text><rect x="282" y="461" width="140" height="66" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="352" y="503" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">20</text><rect x="422" y="461" width="210" height="66" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="527" y="503" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">30</text><rect x="632" y="461" width="70" height="66" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="667" y="503" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">10</text><text x="724" y="503" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">60 ms</text><text x="282" y="565" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">MLP becomes the next main target</text><text x="48" y="649" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="start">03</text><text x="48" y="685" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">Optimize MLP</text><rect x="282" y="627" width="140" height="66" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="352" y="669" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">20</text><rect x="422" y="627" width="105" height="66" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="474.5" y="669" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">15</text><rect x="527" y="627" width="70" height="66" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="562" y="669" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">10</text><text x="619" y="669" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">45 ms</text><text x="282" y="731" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Measure the whole run again</text><rect x="48" y="794" width="1104" height="145" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="837" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Measure → Improve the main bottleneck → Measure again</text><text x="600" y="881" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Attention is 3× faster; the whole run goes from 100 to 60 ms</text><text x="600" y="915" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">The goal is a shorter whole run; the bottleneck can change along the way.</text></g></g><path d="M48,983 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1021" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Times are grouped by operation type; values are illustrative and assume sequential execution without</text><text x="48" y="1050.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">overlap.</text></svg>