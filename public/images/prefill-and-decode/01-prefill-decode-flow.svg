<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc"><title id="title">Prefill에서 시작해 Decode를 반복합니다</title><desc id="desc">Prefill은 입력 p0 p1 p2 p3의 네 위치를 계산하고 각 층에 네 위치의 KV를 남겨 x0를 선택합니다. 다음 Decode는 x0 한 위치를 계산해 KV를 다섯 위치로 늘리고 x1을 선택합니다. 이어서 x1 한 위치를 계산해 KV를 여섯 위치로 늘리고 x2를 선택합니다. 새로 선택된 출력 자체의 KV는 아직 없습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1270" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Prefill에서 시작해 Decode를 반복합니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">한 요청의 입력, 선택한 출력, 각 층에 남는 KV를 함께 따라갑니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><defs><marker id="flow-write" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#B55B22" stroke-width="2.5"/></marker><marker id="flow-read" viewBox="0 0 12 12" refX="10" refY="6" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M2 2 L10 6 L2 10" fill="none" stroke="#287D78" stroke-width="2.5"/></marker></defs><text x="48" y="227.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Prefill</text><text x="48" y="265.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">이번 입력 4개</text><rect x="48" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="134" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="172.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="220" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="258.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="306" y="287" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="344.0" y="324.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p3</text><path d="M394,315 L484,315" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="494" y="273" width="258" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="623" y="313.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="623" y="349.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">4개 위치 계산</text><path d="M766,315 L1026,315" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="894" y="294.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">다음 토큰 선택</text><rect x="1038" y="287" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1081.0" y="324.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="1030" y="390.0" fill="#B55B22" font-size="19" font-weight="400" text-anchor="middle">KV(x0)는 아직 없음</text><text x="48" y="444.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">각 층의 KV 캐시</text><text x="48" y="478.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">실행 후 4개 위치</text><g data-box="494,419,68,74"><rect x="494" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M494,450 H562" stroke="#B55B22"/><text x="528.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="528.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="572,419,68,74"><rect x="572" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M572,450 H640" stroke="#B55B22"/><text x="606.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="606.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="650,419,68,74"><rect x="650" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M650,450 H718" stroke="#B55B22"/><text x="684.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="684.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="728,419,68,74"><rect x="728" y="419" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M728,450 H796" stroke="#B55B22"/><text x="762.0" y="442.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="762.0" y="478.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">p3</text></g><path d="M623,378 V399 H528 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M623,378 V399 H606 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M623,378 V399 H684 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M623,378 V399 H762 V411" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M1134,315 H1168 V516 H26 V645 H38" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><text x="400" y="546.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">x0를 다음 입력으로</text><text x="48" y="557.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Decode</text><text x="48" y="595.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">이번 입력 1개</text><rect x="48" y="617" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="86.0" y="654.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><path d="M136,645 L484,645" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="494" y="603" width="258" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="623" y="643.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="623" y="679.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">1개 위치 계산</text><path d="M766,645 L1026,645" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="894" y="624.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">다음 토큰 선택</text><rect x="1038" y="617" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1081.0" y="654.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><text x="1030" y="720.0" fill="#B55B22" font-size="19" font-weight="400" text-anchor="middle">KV(x1)는 아직 없음</text><text x="48" y="774.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">각 층의 KV 캐시</text><text x="48" y="808.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">실행 후 5개 위치</text><g data-box="494,749,68,74"><rect x="494" y="749" width="68" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M494,780 H562" stroke="#287D78"/><text x="528.0" y="772.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="528.0" y="808.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></g><g data-box="572,749,68,74"><rect x="572" y="749" width="68" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M572,780 H640" stroke="#287D78"/><text x="606.0" y="772.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="606.0" y="808.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text></g><g data-box="650,749,68,74"><rect x="650" y="749" width="68" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M650,780 H718" stroke="#287D78"/><text x="684.0" y="772.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="684.0" y="808.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text></g><g data-box="728,749,68,74"><rect x="728" y="749" width="68" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M728,780 H796" stroke="#287D78"/><text x="762.0" y="772.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="762.0" y="808.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text></g><g data-box="806,749,68,74"><rect x="806" y="749" width="68" height="74" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M806,780 H874" stroke="#B55B22"/><text x="840.0" y="772.0" fill="#B55B22" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="840.0" y="808.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">x0</text></g><path d="M623,708 V729 H840 V741" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><path d="M528,741 L528,711" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#flow-read)"/><text x="495" y="734.0" fill="#287D78" font-size="20" font-weight="400" text-anchor="end">기존 KV 읽기</text><path d="M1134,645 H1168 V846 H26 V975 H38" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#flow-write)"/><text x="400" y="876.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">x1를 다음 입력으로</text><text x="48" y="887.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Decode</text><text x="48" y="925.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">이번 입력 1개</text><rect x="48" y="947" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="86.0" y="984.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><path d="M136,975 L484,975" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="494" y="933" width="258" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="623" y="973.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">모델</text><text x="623" y="1009.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">1개 위치 계산</text><path d="M766,975 L1026,975" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="894" y="954.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">다음 토큰 선택</text><rect x="1038" y="947" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1081.0" y="984.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="1030" y="1050.0" fill="#B55B22" font-size="19" font-weight="400" text-anchor="middle">KV(x2)는 아직 없음</text><text x="48" y="1104.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">각 층의 KV 캐시</text><text x="48" y="1138.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">실행 후 6개 위치</text><g data-box="494,1079,68,74"><rect x="494" y="1079" width="68" height="74" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M494,1110 H562" stroke="#287D78"/><text x="528.0" y="1102.0" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle">K · V</text><text x="528.0" y="1138.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text></