ll="#FFFFFF" font-size="20" font-weight="600" text-anchor="middle" data-max-width="116">C 6</text><text x="1011.6666666666666" y="660" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">9</text><text x="1011.6666666666666" y="855" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="100">t=5.5</text><path d="M150 818 L1090 818" stroke="#5C6C7C" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="918" width="1088" height="135" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="949" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="1056">Satisfy both request limits and KV budget</text><text x="32" y="989" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="1056">A free execution slot is not enough when KV memory is insufficient.</text></g></g></svg>