<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2855" viewBox="0 0 360 2855" role="img" aria-labelledby="title desc"><title id="title">Gated Value를 보정한 뒤 Hidden에 더합니다</title><desc id="desc">Ṽ가 RMSNorm, depthwise causal Conv1D, SiLU를 차례로 지나 내부 덧셈 1에서 원래 Ṽ와 합쳐져 Y가 된다. 외부 덧셈 2는 원래 H와 Y를 합친 뒤 기존 Attention과 MoE로 보낸다. 확대도에서는 정규화된 같은 성분의 10개 시점 중 t−9,t−6,t−3,t 네 칸만 convolution에 연결되고 나머지 칸은 회색이다. C는 공유 표와 Value에서 branch별 Key·gate를 거쳐 각 residual로 연결한다.</desc><metadata>{&quot;id&quot;:&quot;ma-20-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2.3, Eq. 5 and backbone integration&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1#S2.SS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 4 · Backbone으로 복귀</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Gated Value를 보정한 뒤</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Hidden에 더합니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">① Engram 내부의 덧셈 → ② Backbone의</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">덧셈 · Convolution은 B에서 확대</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 서로 다른 두 덧셈</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="300" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="170" y="150.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">Ṽ [T×d]</text><rect x="380" y="110" width="130" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="445" y="150.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="118">H</text><path d="M170 185 L170 215" stroke="#B55B22" stroke-width="2.5" fill="none"/><path d="M170 215 H10 V965 H122" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M170 215 L170 265" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="40" y="275" width="280" height="95" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="56" y="306" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="248">RMSNorm</text></g><path d="M180 380 L180 435" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="40" y="445" width="280" height="155" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="56" y="476" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="248">Depthwise Conv1D</text><text x="56" y="516" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="248">causal · B에서 확대</text></g><path d="M180 610 L180 670" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="40" y="680" width="280" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="180" y="720.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="268">SiLU</text><path d="M180 755 V835 H160 V930" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><circle cx="160" cy="965" r="30" fill="#FFF2E6" stroke="#B55B22"/><text x="160" y="974" fill="#B55B22" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">+</text><text x="205" y="967" fill="#B55B22" font-size="24" font-weight="600" text-anchor="start" data-max-width="150">① 내부</text><path d="M160 1005 L160 1060" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="40" y="1070" width="280" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="180" y="1110.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="268">Y [T×d]</text><path d="M160 1145 L160 1220" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M445 185 V1250 H198" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><circle cx="160" cy="1250" r="30" fill="#EDF5FD" stroke="#2470BB"/><text x="160" y="1259" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">+</text><text x="210" y="1197" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start" data-max-width="200">② H + Y</text><path d="M160 1290 L160 1350" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="1360" width="320" height="190" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="1391" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">기존 Backbone</text><text x="36" y="1431" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="288">Attention → MoE</text></g></g><g transform="translate(16 1257.5538461538463) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 간격을 두고 과거 읽기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="120" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="141" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">w = 4 · δ = N = 3</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">네 시점 · 같은 성분 c</text></g><text x="260" y="300" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle" data-max-width="500">a_s = RMSNorm(Ṽ_s)</text><rect x="25" y="405" width="42" height="42" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="73" y="405" width="42" height="42" rx="3" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><rect x="121" y="405" width="42" height="42" rx="3" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><rect x="169" y="405" width="42" height="42" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="217" y="405" width="42" height="42" rx="3" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><rect x="265" y="405" width="42" height="42" rx="3" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><rect x="313" y="405" width="42" height="42" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="361" y="405" width="42" height="42" rx="3" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><rect x="409" y="405" width="42" height="42" rx="3" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><rect x="457" y="405" width="42" height="42" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="370" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="80">t−9</text><text x="46" y="434" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="36">c</text><path d="M46 458 L46 565" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="190" y="370" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="80">t−6</text><text x="190" y="434" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="36">c</text><path d="M190 458 L190 565" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="334" y="370" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="80">t−3</text><text x="334" y="434" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="36">c</text><path d="M334 458 L334 565" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="478" y="370" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="80">t</text><text x="478" y="434" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="36">c</text><path d="M478 458 L478 565" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="10" y="575" width="500" height="130" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="26" y="606" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="468">성분 c의 Conv1D</text><text x="26" y="646" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="468">선택한 네 값을 가중합</text></g><path d="M260 715 L260 775" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="100" y="785" width="320" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="828" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">Conv(a)_t[c]</text><g data-container="true"><rect x="20" y="950" width="480" height="185" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="981" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Depthwise의 범위</text><text x="36" y="1021" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">이 convolution은 같은 성분의 과거를</text><text x="36" y="1049" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">결합합니다. 다른 성분을 섞는 선은 없습니다.</text></g><g data-container="true"><rect x="20" y="1210" width="480" height="180" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1241" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Causal 경계</text><text x="36" y="1281" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">현재 t까지 읽습니다. 시작 부분에서 부족한</text><text x="36" y="1309" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">과거는 padding으로 채웁니다.</text></g></g><g transform="translate(16 2313.7076923076925) scale(0.6307692307692307)" data-panel="3"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">C. mHC에서는 branch별로 gate</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="480" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="150.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">공유 조회 표 → e</text><path d="M260 185 L260 225" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="20" y="235" width="480" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="275.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">W_V → v (shared)</text><g data-container="true"><rect x="20" y="370" width="220" height="160" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="401" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Branch 1</text><text x="36" y="441" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">h1 ↔ W_K1 e</text><text x="36" y="469" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">→ α1</text></g><path d="M25 185 H8 V350 H130 V360" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 310 V665 H250" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M130 540 L130 585" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="20" y="595" width="220" height="145" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="626" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">α1 × v</text><text x="36" y="666" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">conv 후 해당 H에</text><text x="36" y="694" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">더함</text></g><g data-container="true"><rect x="280" y="370" width="220" height="160" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="296" y="401" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Branch 2</text><text x="296" y="441" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">h2 ↔ W_K2 e</text><text x="296" y="469" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">→ α2</text></g><path d="M495 185 H512 V350 H390 V360" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 310 V665 H270" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M390 540 L390 585" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="280" y="595" width="220" height="145" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="296" y="626" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">α2 × v</text><text x="296" y="666" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">conv 후 해당 H에</text><text x="296" y="694" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">더함</text></g><text x="260" y="780" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="490">2개 branch만 확대 · 실제 실험은 4개</text></g></svg>