<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Ulysses: 토큰 분할을 헤드 분할로 바꿔 계산합니다 · 담당 헤드의 어텐션</title><desc id="desc">각 GPU가 담당 헤드의 전체 문맥 어텐션을 계산한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">Ulysses: 토큰 분할을 헤드 분할로 바꿔 계산합니다</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">가중치 분할이 아니라 Q·K·V와 출력의 재배치 · 이 방식도 원문에서는 Sequence Parallelism으로 부릅니다.</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="40" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="150.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">토큰 분할</text><rect x="273" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="383.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">All-to-All</text><rect x="506" y="137" width="220" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="616.0" y="166.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">헤드별 어텐션</text><rect x="739" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="849.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">역 All-to-All</text><rect x="972" y="137" width="220" height="44" rx="10" fill="#f3f5f7" stroke="#f3f5f7" stroke-width="1.5"/><text x="1082.0" y="166.0" font-size="20" fill="#587084" font-weight="700" text-anchor="middle">토큰 분할 복원</text><rect x="48" y="213" width="528" height="621" rx="10" fill="white" stroke="#2470bb" stroke-width="1.5"/><text x="70" y="247.0" font-size="24" fill="#2470bb" font-weight="700" text-anchor="start">GPU 0</text><rect x="624" y="213" width="528" height="621" rx="10" fill="white" stroke="#b55b22" stroke-width="1.5"/><text x="646" y="247.0" font-size="24" fill="#b55b22" font-weight="700" text-anchor="start">GPU 1</text><text x="312.0" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">O = Attention(Q,K,V)</text><rect x="282" y="365" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="312.0" y="406.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="425" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="312.0" y="466.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="485" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="312.0" y="526.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="545" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="312.0" y="586.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h0</text><text x="272" y="407.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="272" y="467.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="272" y="527.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="272" y="587.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="312" y="753.0" font-size="20" fill="#2470bb" font-weight="700" text-anchor="middle">헤드 h0: Q의 모든 토큰 × K의 모든 토큰</text><text x="888.0" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">O = Attention(Q,K,V)</text><rect x="858" y="365" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="888.0" y="406.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="425" width="60" height="60" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="888.0" y="466.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="485" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="888.0" y="526.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="545" width="60" height="60" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="888.0" y="586.4" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><text x="848" y="407.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="848" y="467.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="848" y="527.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="848" y="587.0" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="888" y="753.0" font-size="20" fill="#b55b22" font-weight="700" text-anchor="middle">헤드 h1: Q의 모든 토큰 × K의 모든 토큰</text><rect x="276" y="864" width="648" height="44" rx="10" fill="#e7f5ef" stroke="#e7f5ef" stroke-width="1.5"/><text x="600.0" y="893.0" font-size="20" fill="#168376" font-weight="700" text-anchor="middle">각 헤드의 전체 문맥이 한 GPU에 모여 있습니다.</text><text x="600" y="949.0" font-size="24" fill="#183149" font-weight="700" text-anchor="middle">담당 헤드의 어텐션을 로컬에서 완성합니다.</text><text x="600" y="1025.0" font-size="21" fill="#587084" font-weight="400" text-anchor="middle">예: 토큰 4개 · 헤드 2개 · GPU 2개 / 기본 멀티헤드 어텐션</text></svg>