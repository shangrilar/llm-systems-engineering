<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">SM 안에서는 warp 단위로 명령을 실행합니다</title><desc id="desc">Thread 128개로 구성된 block 하나를 thread 32개씩인 warp 0부터 3으로 나눈다. 네 줄의 작은 칸은 각 줄마다 정확히 32개이다. Warp 0의 thread 4개를 확대하여 하나의 덧셈 명령이 각자의 데이터에 적용되어 11,22,33,44를 만드는 모습을 보여준다. 여기서는 모든 thread가 같은 명령에 참여하며 분기에 따른 일부 thread 참여는 생략한다. 작은 칸은 CUDA Core 개수를 나타내지 않고 명령의 실제 소요 사이클도 나타내지 않는다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1140" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">SM 안에서는 warp 단위로 명령을 실행합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 명령을 실행하더라도 각 thread가 사용하는 데이터는 다릅니다.</text><path d="M48,170 H1152" fill="none" strok