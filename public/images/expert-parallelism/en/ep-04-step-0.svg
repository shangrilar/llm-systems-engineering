<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Equal expert counts can receive different token counts</title><desc id="desc">Equal initial token counts become 1/1/6/0 across E0/E1/E2/E3 after routing. GPU0 and GPU1 each hold two experts but process two and six tokens.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1240" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Equal expert counts can receive different token counts</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Four tokens per GPU initially; routing assigns two to GPU0 and six to GPU1.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="205" width="480" height="925" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="925" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="297.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Start: four tokens</text><rect x="105.0" y="320" width="150" height="44" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="349.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A1</text><rect x="321.0" y="320" width="150" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="396" y="349.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><rect x="105.0" y="378" width="150" height="44" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="180" y="407.0" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">A3</text><rect x="321.0" y="378" width="150" height="44" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="396" y="407.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">A4</text><path d="M288,428 L288,465" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="78.0" y="474" width="420" height="82" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="508.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="288" y="542.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Select one expert per token</text><text x="912" y="297.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Start: four tokens</text><rect x="729.0" y="320" width="150" height="44" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="804" y="349.0" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">B1</text><rect x="945.0" y="320" width="150" height="44" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="349.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">B2</text><rect x="729.0" y="378" width="150" height="44" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="804" y="407.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">B3</text><rect x="945.0" y="378" width="150" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1020" y="407.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B4</text><path d="M912,428 L912,465" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#