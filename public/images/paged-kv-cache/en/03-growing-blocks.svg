<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1150" viewBox="0 0 1200 1150" role="img" aria-labelledby="title desc"><title id="title">Grow the allocation as generation proceeds</title><desc id="desc">B’s 7 KV positions occupy P3 and P0. Processing input position 7 fills P0. Processing position 8 allocates P5 and adds L2 to the table. Existing B and C blocks do not move.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1150" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Grow the allocation as generation proceeds</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">B grows from 7 to 8 to 9 KV positions. C stays at 6.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="208.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">Cell numbers = KV positions within each request · 4 slots per block</text><rect x="48" y="245" width="1104" height="206" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="68" y="283.0" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">B · KV 7</text><text x="330" y="282.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">L0 → P3  ·  L1 → P0</text><text x="68" y="338.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P0 · B</text><rect x="68" y="354" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="85.0" y="385.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="106" y="354" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" strok