="600" text-anchor="middle">Accumulate per row</text><rect x="336" y="864" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="370" y="893" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">2</text><rect x="336" y="909" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="370" y="938" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">0</text><text x="370" y="984" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">V0</text><rect x="456" y="864" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="490" y="893" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">0</text><rect x="456" y="909" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="490" y="938" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">2</text><text x="490" y="984" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">V1</text><path d="M610,851 L610,772" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="576" y="864" width="68" height="42" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="610" y="893" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">0</text><rect x="576" y="909" width="68" height="42" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="610" y="938" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">2</text><text x="610" y="984" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">V2</text><path d="M730,851 L730,772" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="696" y="864" width="68" height="42" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="730" y="893" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">1</text><rect x="696" y="909" width="68" height="42" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="730" y="938" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">1</text><text x="730" y="984" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">V3</text><text x="550" y="1020" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">Values Vᵀ · Same token order as K above</text><text x="952" y="358" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Tile 1: tokens 0, 1</text><text x="952" y="390" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Tile 2: tokens 2, 3</text><text x="952" y="440" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">2 vector elements</text><text x="952" y="472" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">2 query rows</text><rect x="48" y="1051" width="1104" height="140" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="77" y="1098" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">Q₀: [0.271, 0.736] + 1 × [0, 2] + 0.368 × [1, 1]</text><text x="77" y="1145" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">Q₁: [2, 0.736] + 0.135 × [0, 2] + 0.368 × [1, 1]</text><text x="600" y="1230" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">Illustrative: no scaling or mask · Rounded values · The full grid maps work, not storage</text></g></g><path d="M48,1280 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1318" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">With Q and the output fixed, the two K/V tiles are visited in turn while m, ℓ, and a are updated.</text></svg>