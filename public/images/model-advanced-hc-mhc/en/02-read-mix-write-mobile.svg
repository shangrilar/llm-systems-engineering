<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1649" viewBox="0 0 360 1649" role="img" aria-labelledby="title desc"><title id="title">Read, mix and write coefficients have different jobs</title><desc id="desc">H_pre [.75,.25] reads X=[[2,0],[0,2]] as [1.5,.5], with assumed F output [.4,−.2]. H_res=[[.8,.2],[.2,.8]] mixes the same X into B=[[1.6,.4],[.4,1.6]]. The write column [1,.5] times u gives W=[[.4,−.2],[.2,−.1]], and B+W produces [[2,.2],[.6,1.5]].</desc><metadata>{&quot;id&quot;:&quot;ma-13-02&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC §3, three HC mappings; transpose convention explained in caption&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1#S3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 3 · Three mappings</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Read, mix and write</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">coefficients have</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">different jobs</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Same token · Two streams · d = 2 · X</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">rows are streams; columns are</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">features</text><path d="M16,234.79999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 258.79999999999995) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Read → F → write contribution</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="118" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="490">Input X · Each row is a stream</text><g data-container="true"><rect x="205" y="155" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="250" y="189.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">2</text></g><g data-container="true"><rect x="303" y="155" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="348" y="189.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0</text></g><g data-container="true"><rect x="205" y="215" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="250" y="249.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0</text></g><g data-container="true"><rect x="303" y="215" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="348" y="249.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">2</text></g><text x="193" y="189.64" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="end" data-max-width="45">x₁</text><text x="193" y="249.64" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="end" data-max-width="45">x₂</text><path d="M299 278 L299 310" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="55" y="323" width="410" height="115" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="71" y="354" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">Read · 0.75 x₁ + 0.25 x₂</text><text x="71" y="394" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">[1.5, 0.5]</text></g><path d="M260 448 L260 480" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="55" y="492" width="410" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="71" y="523" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">F · Assume output u</text><text x="71" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">u = [0.4, −0.2]</text></g><path d="M260 614 L260 650" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="55" y="662" width="410" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="71" y="693" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">Write · One scale per stream</text><text x="71" y="733" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">1 × u,  0.5 × u</text></g><path d="M260 784 L260 817" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="205" y="833" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="250" y="867.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0.4</text></g><g data-container="true"><rect x="303" y="833" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="348" y="867.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">−0.2</text></g><g data-container="true"><rect x="205" y="893" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="250" y="927.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0.2</text></g><g data-container="true"><rect x="303" y="893" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="348" y="927.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">−0.1</text></g><text x="193" y="867.64" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="end" data-max-width="50">W₁</text><text x="193" y="927.64" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="end" data-max-width="50">W₂</text><text x="260" y="1000" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">Add these contributions to the bypass</text></g><g transform="translate(16 955.4153846153846) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Bypass from the same X</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="118" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="490">Mix X independently of the read</text><g data-container="true"><rect x="35" y="155" width="450" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="51" y="186" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="418">H_res X</text><text x="51" y="226" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="418">B₁ = 0.8 x₁ + 0.2 x₂ = [1.6, 0.4]</text><text x="51" y="254" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="418">B₂ = 0.2 x₁ + 0.8 x₂ = [0.4, 1.6]</text></g><path d="M260 295 L260 336" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="260" y="380" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle" data-max-width="480">Add B + W per stream</text><text x="20" y="425" fill="#287D78" font-size="25" font-weight="600" text-anchor="start" data-max-width="60">x₁′</text><rect x="100" y="397" width="160" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="180" y="434" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="148">[1.6, 0.4]</text><text x="279" y="435" fill="#182C40" font-size="30" font-weight="400" text-anchor="middle" data-max-width="35">+</text><rect x="305" y="397" width="195" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="402.5" y="434" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="183">[0.4, −0.2]</text><path d="M260 470 L260 508" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="140" y="520" width="240" height="62" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="559" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="228">[2, 0.2]</text><text x="20" y="675" fill="#287D78" font-size="25" font-weight="600" text-anchor="start" data-max-width="60">x₂′</text><rect x="100" y="647" width="160" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="180" y="684" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="148">[0.4, 1.6]</text><text x="279" y="685" fill="#182C40" font-size="30" font-weight="400" text-anchor="middle" data-max-width="35">+</text><rect x="305" y="647" width="195" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="402.5" y="684" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="183">[0.2, −0.1]</text><path d="M260 720 L260 758" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="140" y="770" width="240" height="62" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="809" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="228">[0.6, 1.5]</text><text x="260" y="1000" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="480">Both paths start from the same X</text></g></svg>