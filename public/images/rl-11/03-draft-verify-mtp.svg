<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1318" viewBox="0 0 1200 1318" role="img" aria-labelledby="title desc"><title id="title">여러 토큰을 제안하고 생성 정책으로 검증한다</title><desc id="desc">draft가 x1,x2,x3,x4를 제안한다. target 검증에서 x1,x2를 채택하고 x3에서 거절하여 보정샘플 z를 뽑는다. x4는 폐기하며 다음 문맥은 x1,x2,z다. target 갱신 뒤 draft 적합성과 상태를 확인한다.</desc><metadata>{&quot;id&quot;:&quot;11-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Fast Inference from Transformers via Speculative Decoding&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2211.17192&quot;},{&quot;label&quot;:&quot;NeMo RL speculative decoding&quot;,&quot;url&quot;:&quot;https://research.nvidia.com/labs/nemotron/rl-speculative-decoding/&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">여러 토큰을 제안하고 생성 정책으로 검증한다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">후보 4개 중 앞의 2개가 채택되는 한 번의 반복을 확대했습니다. MTP는 후보를 제안하는 방식 중</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">하나입니다.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">제안 → 검증 → 확정</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="102" width="488" height="130" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="133" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Draft · 후보 생성</text><text x="32" y="173" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">예: 작은 모델 / EAGLE / MTP</text></g><rect x="28" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="77.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₁</text><rect x="151" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="200.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₂</text><rect x="274" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="323.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₃</text><rect x="397" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="446.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₄</text><path d="M260 323 L260 376" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="386" width="488" height="146" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="417" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Target · 후보 위치를 함께 계산</text><text x="32" y="457" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">현재 생성 정책으로 검증 · 보상 채점기가 아님</text></g><path d="M260 538 L260 591" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="28" y="601" width="99" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="77.5" y="633" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₁ ✓</text><rect x="151" y="601" width="99" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="200.5" y="633" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₂ ✓</text><rect x="274" y="601" width="99" height="48" rx="8" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/><text x="323.5" y="633" fill="#B34242" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₃ ×</text><rect x="397" y="601" width="99" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="446.5" y="633" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₄ ×</text><text x="16" y="699" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">앞 2개 채택 · 3번째 거절 · 나머지 폐기</text><g data-container="true"><rect x="16" y="789" width="488" height="124" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="820" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">거절 지점에서 보정 샘플 z</text><text x="32" y="860" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">검증 절차가 정한 보정 분포 사용</text></g><text x="16" y="971" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">다음 문맥: … x₁ x₂ z → 다음 반복</text></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">정책 갱신과 draft의 수명</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="102" width="488" height="132" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="133" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Target v10 + draft</text><text x="32" y="173" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">한 검증 반복은 일관된 정책 버전으로</text></g><path d="M260 240 L260 300" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="310" width="488" height="111" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="341" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Target 가중치 갱신 → v11</text></g><path d="M260 427 L260 486" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="496" width="488" height="151" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="527" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Draft 적합성·내부 상태 확인</text><text x="32" y="567" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">후보 품질, 유효한 KV·특징 상태, 갱신 방식을 확인</text></g><g data-container="true"><rect x="16" y="704" width="488" height="244" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="735" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">두 질문을 구분</text><text x="32" y="775" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">정확성: 검증·보정 조건이 성립하는가? 속도: 순차</text><text x="32" y="803" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">실행의 시간 절약이 추가 비용보다 큰가?</text></g></g></svg>