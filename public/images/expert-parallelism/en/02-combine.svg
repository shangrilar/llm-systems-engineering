<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="809" viewBox="0 0 1200 809" role="img" aria-labelledby="title desc"><title id="title">Multiple selected experts require result combination</title><desc id="desc">Send one token to E0 and E2, then combine their outputs with weights 0.7 and 0.3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="809" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Multiple selected experts require result combination</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A simple top-2 example; the model defines how routing weights are handled.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="194" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="230.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">The router selects two experts and combination weights for token t</text><text x="72" y="270.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">E0: 0.7     E2: 0.3</text><path d="M600,310 L303,373" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M600,310 L897,373" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="390" width="510" height="181" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="426.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0 · E0</text><text x="66" y="476.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Compute on t’s vector</text><text x="66" y="508.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Output u₀</text><rect x="642" y="390" width="510" height="181" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="426.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1 · E2</text><text x="660" y="476.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Compute on t’s vector</text><text x="660" y="508.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Output u₂</text><path d="M303,585 L600,644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,585 L600,644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="661" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="697.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Combine at token t’s origin</text><text x="72" y="737.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">y(t) = 0.7 × u₀ + 0.3 × u₂</text></svg>