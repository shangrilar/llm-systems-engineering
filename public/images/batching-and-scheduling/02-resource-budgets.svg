<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="title desc"><title id="title">배치에 넣기 전에 세 가지 수를 확인하기</title><desc id="desc">요청 수 3과 실행 토큰 8은 제한을 만족하지만 필요한 KV 26은 용량 24를 넘습니다. C를 대기시키면 A와 B가 2토큰을 계산해 KV 20을 저장합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1030" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">배치에 넣기 전에 세 가지 수를 확인하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">KV는 토큰 슬롯 기준의 단순 모델입니다. 블록 반올림과 공유는 생략합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="195" width="174" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">후보</text><rect x="228" y="195" width="258" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">이번 계산</text><rect x="492" y="195" width="288" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">계산할 토큰</text><rect x="786" y="195" width="360" height="65" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="234.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">KV 저장 위치</text><rect x="48" y="268" width="174" height="82" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">A</text><rect x="228" y="268" width="258" height="82" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Decode</text><rect x="492" y="268" width="288" height="82" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">1</text><rect x="786" y="268" width="360" height="82" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="304.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">7 → 8</text><rect x="48" y="358" width="174" height="82" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">B</text><rect x="228" y="358" width="258" height="82" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Decode</text><rect x="492" y="358" width="288" height="82" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">1</text><rect x="786" y="358" width="360" height="82" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="394.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">11 → 12</text><rect x="48" y="448" width="174" height="82" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">C</text><rect x="228" y="448" width="258" height="82" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Prefill</text><rect x="492" y="448" width="288" height="82" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="506" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">6</text><rect x="786" y="448" width="360" height="82" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="484.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">0 → 6</text><g data-panel="true"><rect x="48" y="589" width="352" height="187" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="625.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">요청 수</text><text x="68" y="673.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">3 / 3</text></g><text x="68" y="745.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">허용 범위</text><g data-panel="true"><rect x="424" y="589" width="352" height="187" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="444" y="625.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">실행 토큰 예산</text><text x="444" y="673.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">8 / 8</text></g><text x="444" y="745.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="start">1 + 1 + 6: 허용 범위</text><g data-panel="true"><rect x="800" y="589" width="352" height="187" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="820" y="625.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV 저장 용량</text><text x="820" y="673.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">26 / 24</text></g><text x="820" y="745.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">8 + 12 + 6: 공간 부족</text><path d="M600,800 L600,848" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="871" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="906.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">이번에는 A·B 실행, C는 대기</text><text x="72" y="948.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">실행 토큰은 2개, 계산 후 KV는 20/24. 세 제한은 서로 다른 수를 셉니다.</text></g></svg>