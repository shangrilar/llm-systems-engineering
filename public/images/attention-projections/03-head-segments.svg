<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc">
<title id="title">멀티 헤드: 한 벡터 안의 여러 묶음</title><desc id="desc">토큰 하나의 Q, K, V 각각에 8개 성분이 있다. 앞의 네 성분은 head 1, 뒤의 네 성분은 head 2다. 3×8을 3×2×4로 보는 것은 추가 행렬 곱 없는 형태 변경이다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1210" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">멀티 헤드: 한 벡터 안의 여러 묶음</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">d는 모델 차원, h는 head 수, dh는 head 하나의 차원입니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="600" y="227" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Projection으로 만든 토큰 하나의 벡터를 확대합니다.</text><text x="600" y="272" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">d = 8 = h × dh = 2 × 4</text><text x="93" y="422" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">Q</text><path d="M168,363 V355 H624 V363" fill="none" stroke="#2470BB" stroke-width="1.5"/><text x="396.0" y="342" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Head 1 · dh = 4</text><path d="M624,363 V355 H1080 V363" fill="none" stroke="#287D78" stroke-width="1.5"/><text x="852.0" y="342" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Head 2 · dh = 4</text><rect x="168.0" y="377" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="225.0" y="421.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="282.0" y="377" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="339.0" y="421.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="396.0" y="377" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="453.0" y="421.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="510.0" y="377" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="567.0" y="421.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="624.0" y="377" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="681.0" y="421.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="738.0" y="377" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="795.0" y="421.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="852.0" y="377" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="909.0" y="421.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="966.0" y="377" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1023.0" y="421.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M624,377 L624,447" fill="none" stroke="#287D78" stroke-width="3"/><text x="624" y="489" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">총 8개 성분 · d차원 유지</text><text x="93" y="642" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">K</text><path d="M168,583 V575 H624 V583" fill="none" stroke="#2470BB" stroke-width="1.5"/><text x="396.0" y="562" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Head 1 · dh = 4</text><path d="M624,583 V575 H1080 V583" fill="none" stroke="#287D78" stroke-width="1.5"/><text x="852.0" y="562" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Head 2 · dh = 4</text><rect x="168.0" y="597" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="225.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="282.0" y="597" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="339.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="396.0" y="597" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="453.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="510.0" y="597" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="567.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="624.0" y="597" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="681.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="738.0" y="597" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="795.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="852.0" y="597" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="909.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="966.0" y="597" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1023.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M624,597 L624,667" fill="none" stroke="#287D78" stroke-width="3"/><text x="624" y="709" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">총 8개 성분 · d차원 유지</text><text x="93" y="862" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">V</text><path d="M168,803 V795 H624 V803" fill="none" stroke="#2470BB" stroke-width="1.5"/><text x="396.0" y="782" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Head 1 · dh = 4</text><path d="M624,803 V795 H1080 V803" fill="none" stroke="#287D78" stroke-width="1.5"/><text x="852.0" y="782" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Head 2 · dh = 4</text><rect x="168.0" y="817" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="225.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="282.0" y="817" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="339.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="396.0" y="817" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="453.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="510.0" y="817" width="114.0" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="567.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="624.0" y="817" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="681.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="738.0" y="817" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="795.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="852.0" y="817" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="909.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="966.0" y="817" width="114.0" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1023.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M624,817 L624,887" fill="none" stroke="#287D78" stroke-width="3"/><text x="624" y="929" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">총 8개 성분 · d차원 유지</text><text x="600" y="1042" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">T × d = 3 × 8   ↔   T × h × dh = 3 × 2 × 4</text><text x="600" y="1087" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">같은 값을 다른 형태로 보는 것입니다. 추가 행렬 곱은 없습니다.</text><path d="M48,1130 L1152,1130" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1171" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">각 head의 값은 입력 d개 성분 전체에서 계산됩니다. dh = d/h인 MHA 예시입니다.</text>
</svg>