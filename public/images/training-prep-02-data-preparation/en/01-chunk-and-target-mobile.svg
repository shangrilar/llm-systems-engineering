anchor="start" data-max-width="328">lookahead</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(1)" data-panel="1"><text x="0" y="30" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start" data-max-width="328">Source document</text><rect x="17" y="48" width="42" height="43" rx="5" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="38" y="74.94" fill="#657789" font-size="17" font-weight="600" text-anchor="middle" data-max-width="42">11</text><rect x="65" y="48" width="42" height="43" rx="5" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="86" y="74.94" fill="#657789" font-size="17" font-weight="600" text-anchor="middle" data-max-width="42">12</text><rect x="113" y="48" width="42" height="43" rx="5" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="134" y="74.94" fill="#657789" font-size="17" font-weight="600" text-anchor="middle" data-max-width="42">13</text><rect x="161" y="48" width="42" height="43" rx="5" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="182" y="74.94" fill="#657789" font-size="17" font-weight="600" text-anchor="middle" data-max-width="42">14</text><rect x="209" y="48" width="42" height="43" rx="5" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="230" y="74.94" fill="#657789" font-size="17" font-weight="600" text-anchor="middle" data-max-width="42">15</text><rect x="257" y="48" width="42" height="43" rx="5" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="278" y="74.94" fill="#657789" font-size="17" font-weight="600" text-anchor="middle" data-max-width="42">EOS</text><path d="M17 103 L203 103" stroke="#2470BB" stroke-width="3" fill="none"/><path d="M17 97 L17 109" stroke="#2470BB" stroke-width="3" fill="none"/><path d="M203 97 L203 109" stroke="#2470BB" stroke-width="3" fill="none"/><path d="M209 103 L251 103" stroke="#287D78" stroke-width="3" fill="none"/><text x="110" y="133" fill="#24