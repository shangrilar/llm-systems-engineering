<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1076" viewBox="0 0 360 1076" role="img" aria-labelledby="title desc"><title id="title">Connect inference and tool execution</title><desc id="desc">One agent program uses GPU inference and a CPU tool environment. GPUs execute the model and manage KV. The CPU side prepares environments, queues and executes tools, retains files and environments, and reclaims resources at termination. Tool calls go to the CPU side and results return for the next inference turn.</desc><metadata>{&quot;id&quot;:&quot;12-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4.4 and §5.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1&quot;},{&quot;label&quot;:&quot;DeepSeek Elastic Compute (DSec)&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.22978&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Connect inference and tool</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">execution</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">A coding-agent example: inference</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">GPUs and CPU tool servers exchange</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">calls and results.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><g data-container="true"><rect x="0" y="0" width="520" height="114" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="16" y="31" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">One agent program</text><text x="16" y="71" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">The task continues across inference and tool</text><text x="16" y="99" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">execution.</text></g><rect x="0" y="154" width="520" height="334" rx="14" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="24" y="194" fill="#2470BB" font-size="27" font-weight="600" text-anchor="start" data-max-width="472">GPU inference</text><text x="24" y="228" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="472">Model and KV cache</text><g data-container="true"><rect x="24" y="256" width="472" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="40" y="287" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="440">Model execution</text><text x="40" y="327" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="440">Generate code and tool calls</text></g><g data-container="true"><rect x="24" y="386" width="472" height="86" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="40" y="417" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="440">Inference resources</text><text x="40" y="457" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="440">Batching · KV management</text></g><rect x="0" y="660" width="520" height="438" rx="14" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="24" y="700" fill="#B55B22" font-size="27" font-weight="600" text-anchor="start" data-max-width="472">CPU tool environment</text><text x="24" y="734" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="472">Example: separate servers</text><g data-container="true"><rect x="24" y="762" width="472" height="60" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="40" y="793" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="440">Prepare environment</text></g><g data-container="true"><rect x="24" y="840" width="472" height="60" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="40" y="871" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="440">Queue and run tools</text></g><g data-container="true"><rect x="24" y="918" width="472" height="90" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="40" y="949" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="440">Keep files and environment</text></g><g data-container="true"><rect x="24" y="1020" width="472" height="60" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="40" y="1051" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="440">Reclaim at termination</text></g><path d="M178 500 L178 648" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="18" y="563" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start" data-max-width="140">Tool call</text><path d="M340 648 L340 500" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="362" y="553" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start" data-max-width="140">Result →</text><text x="362" y="585.2" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start" data-max-width="140">next turn</text><text x="12" y="1150" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="496">The next inference turn waits for</text><text x="12" y="1186.4" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="496">tool results.</text><text x="12" y="1237" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="496">Consider both inference speed and</text><text x="12" y="1269.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="496">environment waits.</text></g></svg>