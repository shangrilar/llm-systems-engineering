<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1688" viewBox="0 0 1200 1688" role="img" aria-labelledby="title desc"><title id="title">Context changes how much of the same value is used</title><desc id="desc">Case A normalizes h=[1,1] and k=[1,1], yielding a scaled dot product √2 and sigmoid about 0.8044. Multiplying v=[2,−1] gives [1.6089,−0.8044]. With h=[−1,−1], case B gives logit −√2, gate 0.1956 and result [0.3911,−0.1956]. Both cases keep the same key and value, changing only hidden state.</desc><metadata>{&quot;id&quot;:&quot;ma-20-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2.3, Eqs. 3–4; independently calculated toy values&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1#S2.SS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1