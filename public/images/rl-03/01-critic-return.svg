ke="#657789" stroke-width="1.5"/><text x="47" y="492" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="50">b</text><text x="100" y="491" fill="#182C40" font-size="25" font-weight="400" text-anchor="start" data-max-width="200">1 − 0.6 =</text><rect x="313" y="460" width="118" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="372" y="492" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="106">+0.4</text><rect x="16" y="523" width="62" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="47" y="555" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="50">d</text><text x="100" y="554" fill="#182C40" font-size="25" font-weight="400" text-anchor="start" data-max-width="200">1 − 0.4 =</text><rect x="313" y="523" width="118" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="372" y="555" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="106">+0.6</text><path d="M260 580 L260 608" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="620" width="488" height="88" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="651" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">각 토큰의 정책 손실에 A 전달</text></g></g></svg>