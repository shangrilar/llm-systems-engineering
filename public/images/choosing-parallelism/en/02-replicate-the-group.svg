ted)"/><path d="M312,538 L444,538 L444,558" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="68" y="566" width="224" height="253" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="180" y="606" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="84" y="633" width="96" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="132" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="180" y="633" width="96" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="228" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><text x="180" y="735" font-size="25" fill="#287D78" font-weight="700" text-anchor="middle">A · B</text><text x="180" y="782" font-size="18" fill="#5C6C7C" font-weight="400" text-anchor="middle">Participate in computation</text><rect x="332" y="566" width="224" height="253" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="444" y="606" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="348" y="633" width="96" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="396" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="444" y="633" width="96" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="492" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><text x="444" y="735" font-size="25" fill="#287D78" font-weight="700" text-anchor="middle">A · B</text><text x="444" y="782" font-size="18" fill="#5C6C7C" font-weight="400" text-anchor="middle">Participate in computation</text><path d="M299,684 L325,684" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><text x="312" y="868" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">TP 2 · Split each request’s computation</text><text x="312" y="916" font-size="23" fill="#287D78" font-weight="400" text-anchor="middle">Group outputs: A · B</text><rect x="624" y="387" width="528" height="568" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2" stroke-dasharray="8 6"/><text x="888" y="429" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">Group 2 · Same model replica</text><rect x="693" y="457" width="390" height="44" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="2"/><text x="888" y="486" font-size="23" fill="#287D78" font-weight="700" text-anchor="middle">Assigned requests C · D</text><path d="M888,510 L888,538 L756,538 L756,558" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M888,538 L1020,538 L1020,558" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="644" y="566" width="224" height="253" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="756" y="606" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="660" y="633" width="96" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="708" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="756" y="633" width="96" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="804" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><text x="756" y="735" font-size="25" fill="#287D78" font-weight="700" text-anchor="middle">C · D</text><text x="756" y="782" font-size="18" fill="#5C6C7C" font-weight="400" text-anchor="middle">Participate in computation</text><rect x="908" y="566" width="224" height="253" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="1020" y="606" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="924" y="633" width="96" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="972" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="1020" y="633" width="96" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="1068" y="670" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><text x="1020" y="735" font-size="25" fill="#287D78" font-weight="700" text-anchor="middle">C · D</text><text x="1020" y="782" font-size="18" fill="#5C6C7C" font-weight="400" text-anchor="middle">Participate in computation</text><path d="M875,684 L901,684" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><text x="888" y="868" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">TP 2 · Split each request’s computation</text><text x="888" y="916" font-size="23" fill="#287D78" font-weight="400" text-anchor="middle">Group outputs: C · D</text><text x="600" y="1019" font-size="27" fill="#182C40" font-weight="700" text-anchor="middle">DP 2 · Two groups with the same weight placement</text><text x="600" y="1071" font-size="23" fill="#5C6C7C" font-weight="400" text-anchor="middle">Two GPUs cooperate within a group; different requests go to different groups.</text></g></g><path d="M48,1211 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1249" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The two groups are independent replicas with the same weight placement.</text></svg>