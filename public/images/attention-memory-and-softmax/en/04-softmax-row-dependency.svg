<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc"><title id="title">Unread Scores Change the Probabilities</title><desc id="desc">Compare a row with four unmasked scores, as in the last query row of causal self-attention. The first two scaled scores are both 0 in both cases. If the remaining scores are 0,0, all exponentials are 1, their sum is 4, and the first probability is 25%. If the remaining scores are 2,2, the exponentials are 1,1,exp(2),exp(2), their sum is about 16.78, and the first probability is about 5.96%, shown as 6%. Decimals are rounded. Numerical stability by subtracting a maximum and online updates belong to the next article. Unread scores affect the final probabilities of already computed scores.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1300" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Unread Scores Change the Probabilities</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Compare identical initial scores followed by different remaining scores.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="216" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">One row, four unmasked scores · Only the first two computed</text><rect x="390" y="256" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="438.0" y="296.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="495" y="256" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="543.0" y="296.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="600" y="256" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="648.0" y="296.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">?</text><rect x="705" y="256" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="753.0" y="296.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">?</text><text x="600" y="364" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">Probability = exponential of the score ÷ sum of exponentials across the row</text><path d="M600,391 V427 H316 V458" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M600,427 H884 V458" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="48" y="478" width="536" height="529" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="524" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">If the remaining scores are 0, 0</text><text x="79" y="568" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Scores</text><rect x="109" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="157.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="214" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="262.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="319" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="367.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="424" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="472.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">0</text><text x="79" y="696" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Exponentials</text><rect x="109" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="157.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="214" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="262.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="319" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="367.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="424" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="472.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">1</text><text x="316" y="829" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">Sum across the row = 4</text><rect x="78" y="862" width="476" height="105" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="901" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Probability for the first score, 0</text><text x="316" y="946" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">1 ÷ 4 = 25%</text><rect x="616" y="478" width="536" height="529" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="524" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">If the remaining scores are 2, 2</text><text x="647" y="568" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Scores</text><rect x="677" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="725.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="782" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="830.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="887" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="935.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">2</text><rect x="992" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="1040.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">2</text><text x="647" y="696" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Exponentials</text><rect x="677" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="725.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="782" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="830.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="887" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="935.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">7.39</text><rect x="992" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="1040.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">7.39</text><text x="884" y="829" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">Sum across the row ≈ 16.78</text><rect x="646" y="862" width="476" height="105" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="884" y="901" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Probability for the first score, 0</text><text x="884" y="946" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">1 ÷ 16.78 ≈ 6%</text><text x="600" y="1061" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">The same initial scores get different probabilities as later scores change.</text><rect x="48" y="1110" width="1104" height="138" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="1161" fill="#7954A3" font-size="28" font-weight="400" text-anchor="middle">Can we read scores a few at a time, without storing them all,</text><text x="600" y="1205" fill="#7954A3" font-size="28" font-weight="400" text-anchor="middle">and obtain the information needed for normalization?</text></svg>