<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="998" viewBox="0 0 1200 998" role="img" aria-labelledby="title desc"><title id="title">입력이 달라도 같은 계수로 갱신합니다</title><desc id="desc">입력2와 입력-2를 비교한다. 두 경우 모두 Abar의0.5,0.8로 이전 상태를1,0.8로 남기고 Bbar의1,0.5를 쓴다. 기록값은2,1과-2,-1로 달라지며 새 상태는3,1.8과-1,-0.2다. 같은 C로 읽으면4.8과-1.2다.</desc><metadata>{&quot;id&quot;:&quot;ssm-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mamba §2 · linear time invariance&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2312.00752v2#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="ar