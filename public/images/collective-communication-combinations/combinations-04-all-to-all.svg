<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1093" viewBox="0 0 1200 1093" role="img" aria-labelledby="title desc">
<title id="title">All-to-All: 목적지별로 조각 교환하기</title><desc id="desc">위 입력에서 GPU i의 네 조각은 i에서 GPU 0,1,2,3으로 향하는 조각이다. 아래 출력에서 GPU j는 GPU 0,1,2,3이 자신에게 보낸 조각을 출발 rank 순서로 갖는다. 조각 안의 두 숫자는 실제 데이터 값이 아닌 출발 GPU와 목적지 GPU를 표시한 표식이다. 색상은 원래 출발 GPU를 유지한다. 모든 GPU가 같은 전체 배열을 갖는 All-Gather와 달리 GPU마다 받는 조각이 다르다. 자기 자신을 목적지로 하는 조각도 결과에 포함된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1093" fill="white"/>
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">집합 통신의 조합과 확장 · 그림 4</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">All-to-All: 목적지별로 조각 교환하기</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">각 칸은 데이터 조각 하나입니다. 칸 안의 표기는 보내는 GPU → 받는 GPU입니다.</text><path d="M48,169 H1152" stroke="#DCE4EC"/><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">통신 전 · 입력 버퍼</text><rect x="48" y="229" width="264" height="298" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="72" y="293" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 0</text><rect x="72" y="347" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180.0" y="378" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 1</text><rect x="72" y="401" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180.0" y="432" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 2</text><rect x="72" y="455" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180.0" y="486" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 3</text><path d="M180,536 V565" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="229" width="264" height="298" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5"/><text x="364" y="267" 