<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1690" viewBox="0 0 1200 1690" role="img" aria-labelledby="title desc"><title id="title">계산하는 동안 다음 입력을 준비합니다</title><desc id="desc">각 출력 하나는 여덟 곱의 합이다. 두 곱씩 묶어 계산 1부터 계산 4로 이름 붙인다. 입력 1은 계산 1에 필요한 A와 B의 값들이며 입력 2부터 4도 각각 대응하는 계산에 필요한 값들이다. 시간선의 각 계산은 블록이 맡은 모든 출력에서 해당 두 곱을 처리한다. 현재까지 더한 부분합은 계속 유지한다. 버퍼는 데이터를 잠시 보관할 공간이라는 설명을 시간선보다 먼저 배치한다. 순차 진행 바로 위에는 버퍼 0 한 개를 보여주고, 동시 진행 바로 위에는 버퍼 0과 버퍼 1 두 개를 보여준다. 순차 진행은 같은 버퍼를 채우고 계산한 뒤 다시 채운다. 동시 진행은 두 버퍼를 교대로 사용한다. 입력1은 버퍼0, 입력2는 버퍼1, 입력3은 버퍼0, 입력4는 버퍼1에 들어간다. 이동은 두 단위, 계산은 세 단위인 개념적 시간선이다. 각 계산은 자기 입력이 준비된 뒤 시작한다. 계산1이 끝난 뒤 버퍼0을 입력3으로 채우고 계산2가 끝난 뒤 버퍼1을 입력4로 채운다. 동일한 네 단계의 이동과 계산을 순차 실행 및 동시 진행으로 비교하며 총 이동량과 계산량은 같다. 실제 시간이나 성능 측정이 아니다. 각 보관 공간에는 A와 B의 값들이 함께 들어가며 출력 부분합의 저장 공간이 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1690" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">계산하는 동안 다음 입력을 준비합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">현재 계산에 사용하는 입력과 다음 입력을 서로 다른 공간에 보관합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="218" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">각 출력에 필요한 여덟 곱을, 두 개씩 나누어 계산해봅니다.</text><text x="76" y="284" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">출력 하나 =</text><rect x="249" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="345.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">곱 1 + 곱 2</text><text x="456" y="289" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">+</text><text x="345" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">계산 1</text><rect x="471" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="567.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">곱 3 + 곱 4</text><text x="678" y="289" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">+</text><text x="567" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">계산 2</text><rect x="693" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="789.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">곱 5 + 곱 6</text><text x="900" y="289" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">+</text><text x="789" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">계산 3</text><rect x="915" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="1011.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">곱 7 + 곱 8</text><text x="1011" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">계산 4</text><text x="600" y="395" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">입력 1은 계산 1에 필요한 A와 B의 값들입니다. 입력 2–4도 같은 방식입니다.</text><text x="48" y="454" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">입력을 잠시 보관할 공간(버퍼)을 공유 메모리에 마련합니다.</text><rect x="48" y="482" width="270" height="74" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="183.0" y="527.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">버퍼 0</text><text x="358" y="510" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">순차 진행에서는 버퍼 한 개를 사용합니다.</text><text x="358" y="549" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">입력을 채우고 계산한 뒤, 같은 버퍼를 다시 채웁니다.</text><rect x="48" y="607" width="1104" height="269" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="652" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">순차 진행 · 입력을 가져온 뒤 계산</text><text x="76" y="708" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">버퍼 0에 채움</text><text x="76" y="781" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">계산</text><rect x="270" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="308.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">입력 1</text><rect x="350" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="408.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 1</text><path d="M346,732 L346,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="470" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="508.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">입력 2</text><rect x="550" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="608.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 2</text><path d="M546,732 L546,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="670" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="708.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">입력 3</text><rect x="750" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="808.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 3</text><path d="M746,732 L746,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="870" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="908.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">입력 4</text><rect x="950" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="1008.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 4</text><path d="M946,732 L946,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M1070,668 V816" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="1070" y="849" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">완료</text><text x="48" y="932" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">동시 진행에서는 버퍼 두 개를 번갈아 사용합니다.</text><rect x="48" y="958" width="270" height="74" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="183.0" y="1003.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">버퍼 0</text><rect x="358" y="958" width="270" height="74" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="493.0" y="1003.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">버퍼 1</text><rect x="48" y="1100" width="1104" height="375" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="1147" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">동시 진행 · 계산하는 동안 다음 입력을 가져옴</text><text x="76" y="1205" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">버퍼 0에 채움</text><text x="76" y="1286" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start">버퍼 1에 채움</text><text x="76" y="1367" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">계산</text><rect x="270" y="1173" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="308.0" y="1207.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">입력 1</text><rect x="470" y="1173" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="508.0" y="1207.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">입력 3</text><rect x="350" y="1254" width="76" height="52" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.0" y="1288.0" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">입력 2</text><rect x="590" y="1254" width="76" height="52" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="628.0" y="1288.0" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">입력 4</text><rect x="350" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="408.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 1</text><rect x="470" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="528.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 2</text><rect x="590" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="648.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 3</text><rect x="710" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="768.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">계산 4</text><path d="M830,1170 V1399" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="830" y="1444" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">완료</text><path d="M270,1505 L1110,1505" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1110" y="1539" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간</text><text x="600" y="1600" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">계산 중인 입력을 유지하면서, 다른 버퍼에 다음 입력을 준비합니다.</text><text x="600" y="1645" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">입력이 준비되면 계산을 시작하고, 사용이 끝난 버퍼를 다시 채웁니다.</text></svg>