<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1790" viewBox="0 0 360 1790" role="img" aria-labelledby="title desc"><title id="title">Reshard the same weights for the inference engine</title><desc id="desc">A logical tensor with values 1 through 16 is split by columns across two training GPUs and by rows across two inference GPUs. Per-tensor gathering and format conversion prepare buckets containing multiple pieces. Preparing the next bucket may overlap transfer of the first.</desc><metadata>{&quot;id&quot;:&quot;15-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/tree/v0.1.0&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Reshard the same weights</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">for the inference engine</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">An illustrative 4×4 logical tensor</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">changes from column shards to row</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">shards. Colors and numbers identify</text><text x="16" y="205" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">the same pieces throughout.</text><path d="M16,225 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 249) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Different shards, same values</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="8" y="115" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="512">Training · two column shards</text><text x="97" y="171" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start" data-max-width="115">GPU 0</text><text x="231" y="171" fill="#7954A3" font-size="21" font-weight="400" text-anchor="start" data-max-width="115">GPU 1</text><rect x="84" y="196" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="236" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">1</text><rect x="150" y="196" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="236" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">2</text><rect x="216" y="196" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="236" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">3</text><rect x="282" y="196" width="62