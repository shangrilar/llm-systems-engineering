ll="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Fits within capacity 24</text><rect x="48" y="987" width="26" height="28" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><text x="89" y="1010" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Existing KV</text><rect x="319" y="987" width="26" height="28" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6" stroke-dasharray="5 4"/><text x="360" y="1010" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">KV to add in this execution</text><text x="48" y="1090" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Can the engine actually allocate this space?</text></g></g><path d="M48,1152 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1190" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">This run computes 7 tokens, within the budget of 8; after it, the 13 actual KV entries fit within the</text><text x="48" y="1219.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">capacity of 24.</text></svg>