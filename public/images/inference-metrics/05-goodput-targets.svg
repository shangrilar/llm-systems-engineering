<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="955" viewBox="0 0 1200 955" role="img" aria-labelledby="title desc"><title id="title">지연 목표를 만족한 처리량 세기</title><desc id="desc">10초간10개요청완료.8개는TTFT1초이하와TPOT50ms/token이하를함께만족.2개는하나의목표초과.처리량1request/s,goodput0.8requests/s,달성률80%.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="955" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">지연 목표를 만족한 처리량 세기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Goodput을 계산하려면 먼저 통과 조건과 관측 시간을 정합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="194" width="1104" height="94" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="76" y="231.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">통과 조건 · 각 요청이 두 목표를 모두 만족</text><text x="76" y="270.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">TTFT ≤ 1 s   AND   TPOT ≤ 50 ms/token</text><text x="48" y="340.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">같은 10초 동안 성공 완료한 요청 10개</text><rect x="48" y="380" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="66" y="413.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">A   ✓</text><text x="66" y="445.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="272" y="380" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="413.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">B   ✓</text><text x="290" y="445.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="496" y="380" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="514" y="413.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">C   ✓</text><text x="514" y="445.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="720" y="380" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="738" y="413.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">D   ✓</text><text x="738" y="445.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="944" y="380" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="962" y="413.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">E   ✓</text><text x="962" y="445.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="48" y="492" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="66" y="525.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">F   ✓</text><text x="66" y="557.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="272" y="492" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="525.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">G   ✓</text><text x="290" y="557.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="496" y="492" width="208" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="514" y="525.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">H   ✓</text><text x="514" y="557.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">목표 모두 충족</text><rect x="720" y="492" width="208" height="86" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="738" y="525.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">I   ×</text><text x="738" y="557.0" fill="#B55B22" font-size="21" font-weight="400" text-anchor="start">TTFT 초과</text><rect x="944" y="492" width="208" height="86" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="962" y="525.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">J   ×</text><text x="962" y="557.0" fill="#B55B22" font-size="21" font-weight="400" text-anchor="start">TPOT 초과</text><rect x="48" y="635" width="525" height="110" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="669.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">전체 요청 처리량</text><text x="68" y="715.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">10 / 10 = 1 request/s</text><rect x="605" y="635" width="547" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="625" y="669.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="start">목표 충족 요청 처리량 · Goodput</text><text x="625" y="715.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">8 / 10 = 0.8 requests/s</text><text x="48" y="800.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">목표 달성률은 8 / 10 = 80% · Goodput의 단위는 요청/초</text><text x="48" y="862.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">완료한 양과 지연 목표를 지키며 완료한 양을 함께 봅니다.</text></svg>