<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">Fusion Reduces Intermediate Stores and Rereads</title><desc id="desc">Compute u=x+bias and y=ReLU(u) from identical inputs using two kernels or one. Separate execution computes u in kernel 1 and stores it in an intermediate tensor in global memory. After kernel 1 finishes, kernel 2 reads u and applies ReLU. Caches participate in global-memory accesses, so not every read and write reaches HBM. Fusion uses intermediate values within the kernel and stores only final results. ReLU is max(0,u). For N intermediate values, it removes N logical writes and N reads, or 8N bytes for FP32. Input and final-output accesses are common to both cases. Actual HBM bytes and speedups depend on implementation details such as caches and register spills.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1200" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Fusion Reduces Intermediate Stores and Rereads</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Read values once, perform consecutive operations, and store the final results.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="180" y="211" width="840" height="72" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="600.0" y="255.0" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">u = x + bias    →    y = ReLU(u)</text><rect x="48" y="319" width="536" height="770" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="316" y="365" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Separate Execution · Two Kernels</text><rect x="76" y="397" width="480" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="316.0" y="438.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read inputs x and bias</text><path d="M316,474 L316,504" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="76" y="516" width="480" height="115" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="316" y="551" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">Kernel 1</text><text x="316" y="598" fill="#B55B22" font-size="30" font-weight="700" text-anchor="middle">u = x + bias</text><path d="M316,643 L316,673" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="76" y="687" width="480" height="135" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="316" y="719" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">Intermediate tensor u</text><text x="316" y="750" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Store in global memory</text><text x="316" y="781" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">→ Read in the next kernel</text><text x="316" y="810" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">N outputs: N writes + N reads</text><path d="M316,833 L316,861" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="76" y="873" width="480" height="112" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="316" y="908" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">Kernel 2</text><text x="316" y="953" fill="#B55B22" font-size="30" font-weight="700" text-anchor="middle">y = ReLU(u)</text><path d="M316,993 L316,1012" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" /><rect x="76" y="1025" width="480" height="43" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="316.0" y="1054.5" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Store final result y</text><rect x="616" y="319" width="536" height="770" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="884" y="365" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">Fusion · One Kernel</text><rect x="644" y="397" width="480" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="884.0" y="438.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read inputs x and bias</text><path d="M884,474 L884,504" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="644" y="516" width="480" height="469" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="884" y="554" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">Continue computing within the kernel</text><text x="884" y="621" fill="#B55B22" font-size="32" font-weight="700" text-anchor="middle">u = x + bias</text><path d="M884,649 L884,694" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)" /><text x="884" y="735" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">Use intermediate u directly</text><text x="884" y="778" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">No intermediate tensor stores or rereads</text><path d="M884,816 L884,872" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)" /><text x="884" y="947" fill="#B55B22" font-size="32" font-weight="700" text-anchor="middle">y = ReLU(u)</text><path d="M884,993 L884,1012" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" /><rect x="644" y="1025" width="480" height="43" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="884.0" y="1054.5" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Store final result y</text><text x="600" y="1147" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Same computation and results, without writing and rereading intermediate values.</text></svg>