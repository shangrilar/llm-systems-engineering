<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Skipping work and reclaiming memory are different</title><desc id="desc">Excluding B from a batch retains its two KV blocks and leaves no free space. Releasing B’s KV frees two blocks, one of which can be assigned to A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Skipping work and reclaiming memory are different</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A simple policy chooses B for preemption; it is not claimed to be optimal.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><g data-panel="true"><rect x="48" y="194" width="1104" height="110" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="229.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">A needs one more block for its next token</text><text x="72" y="271.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Current pool: [A, A, B, B] · 0 free blocks · B exclusively owns its two blocks</text></g><path d="M550,327 L303,382" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M650,327 L897,382" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="405" width="510" height="317" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="441.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Skip B for this step</text><text x="68" y="489.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Keep B’s GPU KV allocated</text><text x="68" y="521.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="68" y="553.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Pool: [A, A, B, B]</text><text x="68" y="585.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Free blocks: 0</text><text x="68" y="617.8" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">A still cannot obtain its next</text><text x="68" y="650.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">block</text></g><g data-panel="true"><rect x="642" y="405" width="510" height="317" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="662" y="441.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Preempt B and reclaim its KV</text><text x="662" y="489.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Return B’s two GPU KV blocks</text><text x="662" y="521.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="662" y="553.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Pool: [A, A, —, —]</text><text x="662" y="585.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Free blocks: 2</text><text x="662" y="617.8" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Retain history; B waits to resume</text></g><path d="M897,743 L897,798" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="642" y="821" width="510" height="145" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="857.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Allocate one block to A</text><text x="662" y="905.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Pool: [A, A, A, —] · 1 free block</text></g><text x="48" y="822.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Memory becomes available only</text><text x="48" y="858.4" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">when its allocation is released.</text><text x="48" y="1022.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">This occurs between request execution steps, not by interrupting a running GPU kernel.</text></svg>