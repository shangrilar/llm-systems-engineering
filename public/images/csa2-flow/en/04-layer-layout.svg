<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc"><title id="title">The 40-layer layout of DeepSeek-V4.1-Flash</title><desc id="desc">In the encoder the first two layers use SWA only and the other 18 are CSA2 layers (compression 2) in three groups of [Full, Reuse×5]. The 20 decoder layers are CSA2 layers (compression 1): the first group is [Full, Reuse×3] and four more groups are [Reindex, Reuse×3]. The decoder has a single main KV, built by its first Full layer, and five selection lists: one from Full and four from Reindex.</desc><metadata>{&quot;id&quot;:&quot;csa2-flow-04-layer-layout&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3 (CSA2)&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash model card and code&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 