<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="916" viewBox="0 0 1200 916" role="img" aria-labelledby="title desc"><title id="title">Tree: 모아서 더하고 다시 펼치기</title><desc id="desc">GPU 1과 3의 값을 각각 0과 2로 보내 합산한 뒤 GPU 2가 0으로 보냅니다. 전체 합을 역순으로 배포합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="916" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Tree: 모아서 더하고 다시 펼치기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">각 전송은 네 원소 전체를 보냅니다. Ring의 한 조각 전송과 크기가 다릅니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="198" width="168" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">단계</text><rect x="222" y="198" width="420" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">동시에 수행하는 전달</text><rect x="648" y="198" width="498" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">새로 준비된 결과</text><rect x="48" y="264" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">합산 1</text><rect x="222" y="264" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 1 → 0; GPU 3 → 2</text><rect x="648" y="264" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0: [11,22,33,44]</text><text x="662" y="328.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 2: [1100,2200,3300,4400]</text><rect x="48" y="380" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="414.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">합산 2</text><rect x="222" y="380" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="414.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 2 → 0</text><rect x="648" y="380" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="414.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0: [1111,2222,3333,4444]</text><rect x="48" y="496" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="530.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">배포 1</text><rect x="222" y="496" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="530.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0 → 2</text><rect x="648" y="496" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="530.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0과 2가 전체 합 보유</text><rect x="48" y="612" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="646.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">배포 2</text><rect x="222" y="612" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="646.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0 → 1; GPU 2 → 3</text><rect x="648" y="612" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="646.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">네 GPU가 전체 합 보유</text><rect x="48" y="772" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="808.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">합산 트리: 1 → 0 ← 2 ← 3</text><text x="72" y="848.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0이 합산의 root입니다. 배포에서는 화살표 방향을 뒤집습니다.</text></svg>