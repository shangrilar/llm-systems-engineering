<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1041" viewBox="0 0 1200 1041" role="img" aria-labelledby="title desc"><title id="title">같은 기억, 다른 반영량</title><desc id="desc">문맥 P에서 h=[1,1], k=[1,1]을 정규화하고 내적/√2를 계산하면 √2이며 sigmoid는 약 0.8044다. v=[2,−1]을 곱해 [1.6089,−0.8044]가 된다. 문맥 Q의 h=[−1,−1]에서는 logit −√2, gate 0.1956, 결과 [0.3911,−0.1956]이다. 두 경우는 같은 Key와 Value를 쓰며 hidden만 다르다.</desc><metadata>{&quot;id&quot;:&quot;ma-20-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2.3, Eqs. 3–4; independently calculated toy values&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1#S2.SS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto