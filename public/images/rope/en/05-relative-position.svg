<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1277" viewBox="0 0 1200 1277" role="img" aria-labelledby="title desc"><title id="title">Rotate by absolute position, compare by relative position</title><desc id="desc">Rotate the same q=[1,0] and k=[1,1] at positions 0/1 and 1/2. Both have position difference 1, angle 75 degrees and dot product approximately 0.366.</desc><metadata>{&quot;id&quot;:&quot;05-relative-position&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Rotate by absolute position, compare by relative position</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Rotation rate for one component pair: 30° per position</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><rect x="48" y="205" width="1104" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="244" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Head 1 · one component pair · fix q = [1, 0] and k = [1, 1] before rotation</text><rect x="58" y="305" width="516" height="624" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="352" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Q position 0 · K position 1</text><path d="M146,573 L486,573" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M316,403 L316,743" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="316" cy="573" r="170" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M316,573 L424.0,573.0" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M316,573 L355.5307436087194,425.4692563912806" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M381.0,573.0 A65,65 0 0 0 332.82323793166387,510.21482129121057" fill="none" stroke="#8191A0" stroke-width="2" marker-end="url(#arrow-slate)"/><text x="407.23563413349206" y="510.9924356639971" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">75°</text><text x="236" y="392" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Q′</text><text x="396" y="392" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">K′</text><text x="316" y="803" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">Q rotates 0° · K rotates 30°</text><text x="316" y="854" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Position difference = 1</text><text x="316" y="900" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Dot product ≈ 0.366</text><rect x="626" y="305" width="516" height="624" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="352" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Q position 1 · K position 2</text><path d="M714,573 L1054,573" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M884,403 L884,743" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="884" cy="573" r="170" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M884,573 L977.5307436087194,519.0" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M884,573 L844.4692563912806,425.4692563912806" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><path d="M940.2916512459885,540.5 A65,65 0 0 0 867.1767620683362,510.21482129121057" fill="none" stroke="#8191A0" stroke-width="2" marker-end="url(#arrow-slate)"/><text x="928.0085947219853" y="474.75385376120204" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">75°</text><text x="804" y="392" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Q′</text><text x="964" y="392" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">K′</text><text x="884" y="803" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">Q rotates 30° · K rotates 60°</text><text x="884" y="854" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Position difference = 1</text><text x="884" y="900" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Dot product ≈ 0.366</text><text x="600" y="986" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">Rotating both vectors by another 30° preserves their angle and dot product.</text><rect x="48" y="1034" width="1104" height="120" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1081" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Each vector rotates according to its own position.</text><text x="600" y="1124" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Their comparison reflects the position difference: K position − Q position.</text></g></g><path d="M48,1199 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1237" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Angles are illustrative, not a real model’s frequency settings.</text></svg>