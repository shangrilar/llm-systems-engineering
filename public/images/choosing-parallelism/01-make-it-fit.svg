<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1172" viewBox="0 0 1200 1172" role="img" aria-labelledby="title desc"><title id="title">먼저 작업을 실행할 메모리 확보하기</title><desc id="desc">24GiB 메모리 한 GPU에 가중치24와 실행공간8은 들어가지 않는다. TP2에서는 W1/W2와 W3/W4를 나누어 각 GPU가 가중치12와 실행공간8을 보관하고 여유4를 확보한다.</desc><metadata>{&quot;id&quot;:&quot;01-make-it-fit&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><marker id="ported-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#5C6C7C" stroke-width="1.5" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">먼저 작업을 실행할 메모리 확보하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">모델 가중치뿐 아니라 요청 상태·활성값·버퍼도 들어가야 합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -194)"><rect x="48" y="206" width="342" height="662" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><rect x="438" y="206" width="714" height="662" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2"/><text x="219" y="249" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 하나에 전체 모델</text><text x="795" y="249" font-size="26" fill="#182C40" font-weight="700" text-anchor="middle">TP 2 · 두 GPU로 나눈 모델 한 벌</text><text x="795" y="301" font-size="23" fill="#2470BB" font-weight="400" text-anchor="middle">같은 요청의 계산에 함께 참여</text><rect x="70" y="350" width="298" height="328" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="219" y="391" font-size="26" fill="#182C40" font-weight="700" text-anchor="middle">GPU 0</text><text x="219" y="445" font-size="25" fill="#2470BB" font-weight="700" text-anchor="middle">가중치 24 GiB</text><rect x="87" y="522" width="192" height="60" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="2"/><rect x="87" y="522" width="48" height="60" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="111" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="135" y="522" width="48" height="60" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="159" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="183" y="522" width="48" height="60" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="207" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="231" y="522" width="48" height="60" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="255" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><rect x="279" y="522" width="64" height="60" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="311" y="560" font-size="23" fill="#b8701e" font-weight="700" text-anchor="middle">8</text><text x="183" y="500" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">사용 가능 24 GiB</text><path d="M279,494 V601" stroke="#B34242" stroke-width="3" stroke-dasharray="6 5"/><text x="219" y="636" font-size="20" fill="#B34242" font-weight="700" text-anchor="middle">실행 공간 8 GiB가 초과</text><rect x="460" y="350" width="324" height="328" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="622" y="391" font-size="26" fill="#182C40" font-weight="700" text-anchor="middle">GPU 0</text><text x="622" y="445" font-size="25" fill="#2470BB" font-weight="700" text-anchor="middle">가중치 12 GiB</text><rect x="526" y="522" width="192" height="60" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="2"/><rect x="526" y="522" width="48" height="60" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="550" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="574" y="522" width="48" height="60" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="598" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="622" y="522" width="64" height="60" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="654" y="560" font-size="23" fill="#b8701e" font-weight="700" text-anchor="middle">8</text><text x="622" y="500" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">사용 가능 24 GiB</text><text x="622" y="636" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">실행 공간 8 + 여유 4 GiB</text><rect x="806" y="350" width="324" height="328" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="968" y="391" font-size="26" fill="#182C40" font-weight="700" text-anchor="middle">GPU 1</text><text x="968" y="445" font-size="25" fill="#2470BB" font-weight="700" text-anchor="middle">가중치 12 GiB</text><rect x="872" y="522" width="192" height="60" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="2"/><rect x="872" y="522" width="48" height="60" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="896" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="920" y="522" width="48" height="60" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="944" y="560" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><rect x="968" y="522" width="64" height="60" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="1000" y="560" font-size="23" fill="#b8701e" font-weight="700" text-anchor="middle">8</text><text x="968" y="500" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">사용 가능 24 GiB</text><text x="968" y="636" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">실행 공간 8 + 여유 4 GiB</text><text x="219" y="733" font-size="26" fill="#182C40" font-weight="700" text-anchor="middle">24 + 8 = 32 GiB</text><text x="219" y="788" font-size="25" fill="#B34242" font-weight="700" text-anchor="middle">실행 공간 부족</text><text x="795" y="733" font-size="27" fill="#182C40" font-weight="700" text-anchor="middle">GPU당 12 + 8 = 20 GiB</text><text x="795" y="788" font-size="27" fill="#287D78" font-weight="700" text-anchor="middle">요청을 실행할 수 있는 그룹</text><rect x="100" y="918" width="30" height="25" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="144" y="940" font-size="22" fill="#182C40" font-weight="400" text-anchor="start">W1–W4: 가중치 조각</text><rect x="490" y="918" width="30" height="25" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="534" y="940" font-size="22" fill="#182C40" font-weight="400" text-anchor="start">실행 공간</text><rect x="866" y="918" width="30" height="25" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="2"/><text x="910" y="940" font-size="22" fill="#182C40" font-weight="400" text-anchor="start">여유 공간</text><text x="600" y="1001" font-size="22" fill="#5C6C7C" font-weight="400" text-anchor="middle">계산 예시: 각 GPU의 실행 공간은 8 GiB로 가정</text></g></g><path d="M48,1064 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1102" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">GPU를 더 연결해도 메모리가 하나로 합쳐지지 않으므로, 가중치나 실행 중 데이터를 실제로 나눠야 합니다. 수치는</text><text x="48" y="1131.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">설명용입니다.</text></svg>