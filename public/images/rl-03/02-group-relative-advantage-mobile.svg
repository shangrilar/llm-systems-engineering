<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1463" viewBox="0 0 360 1463" role="img" aria-labelledby="title desc"><title id="title">같은 질문의 다른 응답이 비교 기준이 된다</title><desc id="desc">같은 질문에서 나온 응답 4개의 보상 1,1,0,0을 평균 .5와 모집단 표준편차 .5로 정규화해 어드밴티지 +1,+1,-1,-1을 구한다. 각 응답의 생성 토큰에는 같은 값이 붙는다.</desc><metadata>{&quot;id&quot;:&quot;3-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeekMath §4.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2402.03300v3#S4.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">같은 질문의 다른 응답이 비교</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">기준이 된다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">기본 outcome-only GRPO: 응답 보상을</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">그룹 안에서 비교하고, 그 값을 생성 토큰에</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">공통으로 사용합니다.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">질문 하나 → 응답 네 개 → 보상</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="86" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 질문 P</text></g><path d="M54 198 V605" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M54 260 L91 260" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="235" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="267" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">응답 1</text><path d="M326 260 L366 260" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="235" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="267" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 1</text><path d="M501 260 L516 260" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M54 370 L91 370" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="345" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="377" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">응답 2</text><path d="M326 370 L366 370" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="345" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="377" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 1</text><path d="M501 370 L516 370" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M54 480 L91 480" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="455" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="487" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">응답 3</text><path d="M326 480 L366 480" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="455" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 0</text><path d="M501 480 L516 480" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M54 590 L91 590" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="565" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="597" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">응답 4</text><path d="M326 590 L366 590" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="565" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 0</text><path d="M501 590 L516 590" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M516 260 V650 H260 V671" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="684" width="488" height="133" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="715" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">이 질문의 네 점수로 기준 계산</text><text x="32" y="755" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">평균 μ = 0.5 · 표준편차 σ = 0.5</text></g></g><g transform="translate(16 786.8307692307692) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">상대 점수를 생성 토큰에 할당</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="131" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Aᵢ = (rᵢ − 0.5) / 0.5</text></g><text x="16" y="265" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">응답 1</text><rect x="148" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="186" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="235" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="273" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="322" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="360" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="409" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="447" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><text x="16" y="375" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">응답 2</text><rect x="148" y="345" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="186" y="377" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="235" y="345" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="273" y="377" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="322" y="345" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="360" y="377" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><text x="16" y="485" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">응답 3</text><rect x="148" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="186" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="235" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="273" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="322" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="360" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="409" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="447" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><text x="16" y="595" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">응답 4</text><rect x="148" y="565" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="186" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="235" y="565" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="273" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="322" y="565" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="360" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><text x="148" y="641" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="356">칸 하나 = 생성 토큰 하나</text><g data-container="true"><rect x="16" y="684" width="488" height="133" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="715" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">모두 같은 보상이면 상대 신호 0</text><text x="32" y="755" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">전부 성공·전부 실패한 그룹에는 보상 차이가 없음</text></g></g><path d="M16,1344.4615384615386 H344" stroke="#DCE4EC" stroke-width="2"/><text x="16" y="1371.4615384615386" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">설명용 예: 모집단 표준편차, 안정화 ε 생략.</text><text x="16" y="1393.8615384615387" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">같은 A를 쓴다고 각 토큰의 기여도가 같다는</text><text x="16" y="1416.2615384615385" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">뜻은 아닙니다. 다른 질문의 응답은 이 그룹</text><text x="16" y="1438.6615384615386" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">평균에 섞지 않습니다.</text></svg>