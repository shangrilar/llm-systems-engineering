<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">Reuse register values across computations</title><desc id="desc">One thread owns a 2 × 2 region within the block&#x27;s 4 × 4 outputs. For the first products, it reads A[0,0], A[1,0], B[0,0] and B[0,1] from shared memory into registers. Products a0*b0, a0*b1, a1*b0 and a1*b1 accumulate into c00, c01, c10 and c11 respectively. Each input serves two multiplications. Partial sums add the products computed so far and start at 0. Input registers receive new values for the next products while the four partial sums persist until all products are added. Registers hold this thread&#x27;s state and are not storage shared with other threads. This conceptual example uses scalar CUDA-core multiplication and accumulation.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1160" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Reuse register values across computations</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">A thread can reuse inputs by computing a small tile instead of a single output.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="1104" height="99" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="76" y="246" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Let one thread compute a 2 × 2 region within the block&#x27;s outputs.</text><text x="76" y="281" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">A partial sum adds the products computed so far. Keep one for each of four outputs.</text><rect x="48" y="337" width="1104" height="576" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="382" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Computing the first of the products needed for each output</text><rect x="421" y="431" width="280" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="561.0" y="472.0" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">b0 = B[0, 0]</text><rect x="757" y="431" width="280" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="897.0" y="472.0" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">b1 = B[0, 1]</text><rect x="77" y="552" width="278" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="216.0" y="593.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">a0 = A[0, 0]</text><rect x="77" y="711" width="278" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="216.0" y="752.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">a1 = A[1, 0]</text><rect x="421" y="529" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="561" y="568" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c00</text><text x="561" y="613" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">Add a0 × b0</text><rect x="757" y="529" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="897" y="568" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c01</text><text x="897" y="613" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">Add a0 × b1</text><rect x="421" y="688" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="561" y="727" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c10</text><text x="561" y="772" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">Add a1 × b0</text><rect x="757" y="688" width="280" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="897" y="727" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">c11</text><text x="897" y="772" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">Add a1 × b1</text><path d="M366,585 L407,585" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><path d="M366,744 L407,744" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><path d="M561,502 L561,522" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><path d="M897,502 L897,522" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="600" y="864" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Read four inputs for four products · Use each input twice</text><rect x="48" y="950" width="1104" height="111" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="600" y="994" fill="#B55B22" font-size="26" font-weight="700" text-anchor="middle">Keep c00, c01, c10, c11 in registers</text><text x="600" y="1034" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle">Add the next products here. Each output is complete after all products are added.</text><text x="600" y="1115" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">Values read from shared memory can be reused across computations.</text></svg>