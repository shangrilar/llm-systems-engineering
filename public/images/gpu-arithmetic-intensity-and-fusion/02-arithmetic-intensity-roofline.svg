<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966" role="img" aria-labelledby="title desc"><title id="title">산술 강도는 메모리와 연산의 한계를 연결합니다</title><desc id="desc">왼쪽의 계산 A는 HBM 읽기와 쓰기 총64byte에128FLOP, 산술 강도2이고 B는64byte에512FLOP, 산술 강도8이다. 오른쪽은 설명용 대역폭8GB/s, 계산 상한32GFLOPS의 선형 축 Roofline이다. 산술 강도4에서 두 상한이 만난다. A에서 처리량 상한16GFLOPS, B에서32GFLOPS다. 회색 점은 상한 아래에 있을 수 있는 실제 성능의 개념적 위치이며 실측 결과가 아니다. 수치는 특정 GPU 사양이 아니며 같은 연산 경로와 자료형을 가정한 단순 모델이다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="966" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">산술 강도는 메모리와 연산의 한계를 연결합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">HBM과 주고받는 데이터에 비해 얼마나 많은 계산을 수행하는지 봅니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="213" width="420" height="565" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="74" y="255" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. 이동량 대비 계산량</text><rect x="72" y="284" width="372" height="183" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><text x="94" y="322" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">계산 A</text><text x="94" y="366" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">HBM 이동 64 byte</text><text x="94" y="403" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">필요한 계산 128 FLOP</text><text x="94" y="442" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">128 ÷ 64 = 2 FLOP/byte</text><rect x="72" y="493" width="372" height="183" rx="12" fill="#FFFFFF" stroke="#B55B22" stroke-width="1.5"/><text x="94" y="531" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">계산 B</text><text x="94" y="575" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">HBM 이동 64 byte</text><text x="94" y="612" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">필요한 계산 512 FLOP</text><text x="94" y="651" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">512 ÷ 64 = 8 FLOP/byte</text><text x="258" y="724" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">산술 강도 = 연산량 ÷ 이동량</text><text x="258" y="758" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">이동량에는 읽기와 쓰기를 모두 포함</text><text x="506" y="255" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">2. Roofline: 처리량의 상한</text><text x="582" y="294" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">연산 처리량 (GFLOPS)</text><path d="M592,642 H1100" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="577" y="649" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="end">0</text><path d="M592,514 H1100" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="577" y="521" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="end">16</text><path d="M592,386 H1100" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="577" y="393" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="end">32</text><path d="M592,642 L592,318" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M592,642 L1125,642" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M592,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="592" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">0</text><path d="M712,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="712" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2</text><path d="M832,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="832" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4</text><path d="M1072,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="1072" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">8</text><path d="M592,642 L832,386" fill="none" stroke="#2470BB" stroke-width="5"/><path d="M832,386 H1100" fill="none" stroke="#B55B22" stroke-width="5"/><path d="M832,386 V642" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="968" y="355" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">GPU 연산 처리량 상한</text><text x="609" y="416" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">대역폭 × 산술 강도</text><path d="M703,434 L739,477" fill="none" stroke="#2470BB" stroke-width="2"/><circle cx="712" cy="514" r="7" fill="#2470BB" stroke="white" stroke-width="2"/><text x="728" y="539" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">A: 상한 16</text><circle cx="1072" cy="386" r="7" fill="#B55B22" stroke="white" stroke-width="2"/><text x="1072" y="431" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">B: 상한 32</text><circle cx="952" cy="534" r="7" fill="#5C6C7C" stroke="white" stroke-width="2"/><text x="970" y="560" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">성능 위치 예시</text><text x="928" y="595" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">실제 성능은 상한 아래에 놓일 수 있음</text><text x="851" y="717" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">산술 강도 (FLOP/byte)</text><text x="704" y="761" fill="#2470BB" font-size="20" font-weight="600" text-anchor="middle">대역폭이 정하는 상한</text><text x="978" y="761" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">연산 능력이 정하는 상한</text><rect x="48" y="816" width="1104" height="102" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="857" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">처리량 상한 = min(연산 처리량 상한, 대역폭 × 산술 강도)</text><text x="600" y="897" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">단위 시간에 데이터를 공급하는 양 × 데이터당 계산량</text></svg>