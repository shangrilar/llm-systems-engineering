<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1299" viewBox="0 0 1200 1299" role="img" aria-labelledby="title desc"><title id="title">When Can Send and Receive Buffers Be Reused?</title><desc id="desc">On a shared time axis GPU 0 send memory is written by A and read by the send. It can be overwritten after send completion. GPU 1 receive memory must remain available while receive writes it and B reads it, and can be reused after B finishes. Send completion does not imply peer B completion. B reads x and writes [2,4,6,8] into a separate y buffer. Completion markers refer to GPU work, not CPU API return.</desc><metadata>{&quot;id&quot;:&quot;04-buffer-reuse&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">When Can Send and Receive Buffers Be Reused?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Communication and computation using the received data finish at different times.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><text x="48" y="225" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Write the next values after the last operation using each buffer finishes.</text><path d="M250,292 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1148" y="277" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="409" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0</text><text x="48" y="447" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Send buffer</text><rect x="250" y="372" width="200" height="104" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350" y="418" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Compute A</text><text x="350" y="453" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">Write values</text><rect x="450" y="372" width="210" height="104" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="555" y="418" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Send</text><text x="555" y="453" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">Read values</text><rect x="660" y="372" width="480" height="104" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="900" y="433" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Can overwrite with next values</text><path d="M660,332 V361" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="660" y="320" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">Send completes</text><path d="M250,499 v10 H660 v-10" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="455" y="545" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">In use · Cannot reuse</text><path d="M660,499 v10 H1140 v-10" fill="none" stroke="#287D78" stroke-width="2"/><text x="900" y="545" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Send buffer reusable</text><text x="48" y="682" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="720" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Receive buffer</text><rect x="250" y="648" width="200" height="104" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="350" y="694" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">In receive</text><text x="350" y="729" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle">Waiting</text><rect x="450" y="648" width="230" height="104" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="565" y="694" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Receive</text><text x="565" y="729" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">Write values</text><rect x="680" y="648" width="240" height="104" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="800" y="694" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Compute B</text><text x="800" y="729" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">Read received values</text><rect x="920" y="648" width="220" height="104" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1030" y="694" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Next values</text><text x="1030" y="729" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Can overwrite</text><path d="M680,608 V637" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="680" y="596" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">Receive completes</text><path d="M920,608 V637" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="920" y="596" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">B completes</text><path d="M250,776 v10 H920 v-10" fill="none" stroke="#5C6C7C" stroke-width="2"/><text x="585" y="822" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">In use by receive and B · Cannot reuse</text><path d="M920,776 v10 H1140 v-10" fill="none" stroke="#287D78" stroke-width="2"/><text x="1030" y="822" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Reusable</text><rect x="48" y="875" width="1104" height="118" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="920" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">B reads the receive buffer and writes to a separate result buffer y.</text><text x="600" y="963" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">x = [1, 2, 3, 4]  →  B: double each value  →  y = [2, 4, 6, 8]</text><rect x="48" y="1035" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1080" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">The peer GPU's B may still be running after the send finishes.</text><text x="600" y="1119" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Check when GPU work finishes, not when the CPU call returns.</text></g></g><path d="M48,1191 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1229" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The send buffer can be reused after the send completes; the receive buffer, after B has finished</text><text x="48" y="1258.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">reading it.</text></svg>