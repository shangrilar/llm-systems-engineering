<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1402" viewBox="0 0 1200 1402" role="img" aria-labelledby="title desc"><title id="title">Value 가중합을 먼저 계산하기</title><desc id="desc">점수 1,2와 Value 벡터 2,0 및 0,2의 예시. 확률을 먼저 구해 Value를 가중합하거나, exp 값으로 Value를 가중합한 다음 지수합으로 나누면 같은 출력 약 0.538,1.462를 얻는다. 정규화 전 가중합 a는 약 0.736,2이다. 표시 수치는 반올림했다.</desc><metadata>{&quot;id&quot;:&quot;01-value-before-normalization&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Value 가중합을 먼저 계산하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Attention의 공통 분모를 마지막으로 옮기면, 누적할 대상이 보입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="206" width="1104" height="145" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="249" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">한 쿼리의 점수 [1, 2] · 최댓값 m = 2</text><text x="76" y="303" fill="#7954A3" font-size="27" font-weight="600" text-anchor="start">exp 값 ≈ [0.368, 1]    지수합 ℓ ≈ 1.368</text><text x="770" y="249" fill="#287D78" font-size="23" font-weight="600" text-anchor="start">대응하는 Value 벡터</text><rect x="760" y="268" width="172" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="846" y="308" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">[2, 0]</text><rect x="940" y="268" width="172" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1026" y="308" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">[0, 2]</text><rect x="48" y="386" width="536" height="672" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="433" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">먼저 확률을 구하기</text><text x="76" y="491" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">① exp 값</text><rect x="94" y="512" width="217" height="64" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="202.5" y="552" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0.368</text><rect x="319" y="512" width="217" height="64" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="427.5" y="552" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><path d="M316,590 L316,643" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="336" y="623" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">각각 ÷ ℓ</text><text x="76" y="681" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">② 확률</text><rect x="94" y="702" width="217" height="64" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="202.5" y="742" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0.269</text><rect x="319" y="702" width="217" height="64" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="427.5" y="742" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0.731</text><path d="M316,779 L316,833" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><text x="336" y="812" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">V와 곱해 더하기</text><text x="76" y="873" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">③ 최종 출력 벡터</text><rect x="94" y="894" width="442" height="73" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="938.5" fill="#287D78" font-size="31" font-weight="600" text-anchor="middle">[0.538, 1.462]</text><text x="316" y="1019" fill="#2470BB" font-size="23" font-weight="500" text-anchor="middle">0.269 × [2, 0] + 0.731 × [0, 2]</text><rect x="616" y="386" width="536" height="672" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="433" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">마지막에 한 번 나누기</text><text x="644" y="491" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">① exp 값</text><rect x="662" y="512" width="217" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="770.5" y="552" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">0.368</text><rect x="887" y="512" width="217" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="995.5" y="552" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1</text><path d="M884,590 L884,643" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="904" y="623" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">V와 곱해 더하기</text><text x="644" y="681" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">② 정규화 전 가중합 a</text><rect x="662" y="702" width="442" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="883" y="742" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">[0.736, 2]</text><path d="M884,779 L884,833" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="904" y="812" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">a 전체를 ÷ ℓ</text><text x="644" y="873" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">③ 최종 출력 벡터</text><rect x="662" y="894" width="442" height="73" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="883" y="938.5" fill="#287D78" font-size="31" font-weight="600" text-anchor="middle">[0.538, 1.462]</text><text x="884" y="1019" fill="#287D78" font-size="23" font-weight="500" text-anchor="middle">(0.368 × [2, 0] + 1 × [0, 2]) ÷ ℓ</text><rect x="48" y="1093" width="1104" height="142" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1142" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">출력 = Σ ((exp 값 ÷ ℓ) × V) = (Σ exp 값 × V) ÷ ℓ</text><text x="600" y="1192" fill="#287D78" font-size="25" font-weight="400" text-anchor="middle">같은 지수합으로 나누므로, 가중합을 구한 뒤 마지막에 나눌 수 있습니다.</text><text x="600" y="1273" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">exp 값은 exp(점수 − m) · 소수는 정확한 계산 후 반올림</text></g></g><path d="M48,1324 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1362" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">정규화 전 가중합 a를 지수합 ℓ로 나누면, 확률로 먼저 가중합한 결과와 같습니다.</text></svg>