<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1138" viewBox="0 0 1200 1138" role="img" aria-labelledby="title desc"><title id="title">Other responses to the same prompt provide the baseline</title><desc id="desc">Four responses to one prompt receive rewards 1,1,0,0. Normalizing by mean .5 and population standard deviation .5 gives advantages +1,+1,-1,-1. Each response shares its advantage across its generated tokens.</desc><metadata>{&quot;id&quot;:&quot;3-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeekMath §4.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2402.03300v3#S4.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Other responses to the same prompt provide the baseline</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Basic outcome-only GRPO compares response rewards within a group and shares that signal</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">across generated tokens.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">One prompt → four responses → rewards</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="86" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">The same prompt P</text></g><path d="M54 198 V605" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M54 260 L91 260" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="235" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="267" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">Response 1</text><path d="M326 260 L366 260" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="235" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="267" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 1</text><path d="M501 260 L516 260" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M54 370 L91 370" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="345" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="377" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">Response 2</text><path d="M326 370 L366 370" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="345" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="377" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 1</text><path d="M501 370 L516 370" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M54 480 L91 480" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="455" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="487" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">Response 3</text><path d="M326 480 L366 480" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="455" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 0</text><path d="M501 480 L516 480" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M54 590 L91 590" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="106" y="565" width="208" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="210" y="597" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">Response 4</text><path d="M326 590 L366 590" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="380" y="565" width="116" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="104">r = 0</text><path d="M501 590 L516 590" stroke="#B55B22" stroke-width="1.5" fill="none"/><path d="M516 260 V650 H260 V671" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="684" width="488" height="133" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="715" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Compute the baseline from these four</text><text x="32" y="745.8" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">rewards</text><text x="32" y="786" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Mean μ = 0.5 · standard deviation σ = 0.5</text></g></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Share A across generated tokens</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="100" width="488" height="86" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="131" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Aᵢ = (rᵢ − 0.5) / 0.5</text></g><text x="16" y="265" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">Response 1</text><rect x="148" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="186" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="235" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="273" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="322" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="360" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="409" y="235" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="447" y="267" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><text x="16" y="375" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">Response 2</text><rect x="148" y="345" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="186" y="377" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="235" y="345" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="273" y="377" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><rect x="322" y="345" width="76" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="360" y="377" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">+1</text><text x="16" y="485" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">Response 3</text><rect x="148" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="186" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="235" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="273" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="322" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="360" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="409" y="455" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="447" y="487" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><text x="16" y="595" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="128">Response 4</text><rect x="148" y="565" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="186" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="235" y="565" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="273" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><rect x="322" y="565" width="76" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="360" y="597" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="64">−1</text><text x="148" y="641" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="356">One cell = one generated token</text><g data-container="true"><rect x="16" y="684" width="488" height="133" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="715" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Equal rewards give zero relative signal</text><text x="32" y="755" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">All-success or all-failure groups provide no</text><text x="32" y="783" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">reward contrast</text></g></g></svg>