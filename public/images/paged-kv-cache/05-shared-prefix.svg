21 H368 V890" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M368,890 L482.0,890.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M492,890 L482.0,894.5 L482.0,885.5 Z" fill="#526577"/><path d="M944,821 H824 V890" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M824,890 L714.0,890.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M704,890 L714.0,885.5 L714.0,894.5 Z" fill="#526577"/><text x="600" y="949.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">테이블은 각각, 공통 KV는 한 벌</text></svg>