<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966" role="img" aria-labelledby="title desc"><title id="title">Connect inference and tool execution</title><desc id="desc">One agent program uses GPU inference and a CPU tool environment. GPUs execute the model and manage KV. The CPU side prepares environments, queues and executes tools, retains files and environments, and reclaims resources at termination. Tool calls go to the CPU side and results return for the next inference turn.</desc><metadata>{&quot;id&quot;:&quot;12-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4.4 and §5.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1&quot;},{&quot;label&quot;:&quot;DeepSeek Elastic Compute (DSec)&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.22978&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Connect inference and tool execution</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">A coding-agent example: inference GPUs and CPU tool servers exchange calls and results.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(0.9857142857142858)" data-panel="1"><g data-container="true"><rect x="0" y="0" width="1120" height="114" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="16" y="31" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="1088">One agent program</text><text x="16" y="71" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="1088">The task continues across inference and tool execution.</text></g><rect x="0" y="154" width="368" height="438" rx="14" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="24" y="194" fill="#2470BB" font-size="27" font-weight="600" text-anchor="start" data-max-width="320">GPU inference</text><text x="24" y="228" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="320">Model and KV cache</text><g data-container="true"><rect x="24" y="256" width="320" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="40" y="287" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">Model execution</text><text x="40" y="327" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="288">Generate code and tool calls</text></g><g data-container="true"><rect x="24" y="424" width="320" height="118" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="40" y="455" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">Inference resources</text><text x="40" y="495" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="288">Batching · KV management</text></g><rect x="752" y="154" width="368" height="438" rx="14" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="776" y="194" fill="#B55B22" font-size="27" font-weight="600" text-anchor="start" data-max-width="320">CPU tool environment</text><text x="776" y="228" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="320">Example: separate servers</text><g data-container="true"><rect x="776" y="256" width="320" height="60" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="792" y="287" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">Prepare environment</text></g><g data-container="true"><rect x="776" y="334" width="320" height="60" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="792" y="365" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">Queue and run tools</text></g><g data-container="true"><rect x="776" y="412" width="320" height="90" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="792" y="443" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">Keep files and</text><text x="792" y="473.8" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">environment</text></g><g data-container="true"><rect x="776" y="514" width="320" height="60" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="792" y="545" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="288">Reclaim at termination</text></g><path d="M380 294 L740 294" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="560" y="267" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle" data-max-width="320">Tool call</text><text x="560" y="367" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="320">Connected by calls and</text><text x="560" y="397.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="320">results</text><path d="M740 462 L380 462" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="560" y="433" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="340">Result → next turn</text><text x="12" y="651" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="1096">The next inference turn waits for tool results.</text><text x="12" y="694" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1096">Consider both inference speed and environment waits.</text></g></svg>