<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1884" viewBox="0 0 1200 1884" role="img" aria-labelledby="title desc"><title id="title">Updating Both Sums Together</title><desc id="desc">Pair score chunks 1,2 then 0,1 then 3,2 with their Values. With the same maximum, add new contributions to both sums. When the maximum rises from 2 to 3, multiply both previous sums by exp(-1) before adding the new contributions. Final exponential sum is about 2.056, weighted sum about 0.959,3.153, and output about 0.466,1.534.</desc><metadata>{&quot;id&quot;:&quot;02-rescale-both-accumulators&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Updating Both Sums Together</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">When the maximum rises, rescale both the exponential sum and Value weighted sum.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="207" width="1104" height="204" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="253" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Start · Process the first scores [1, 2] and their Values.</text><text x="76" y="305" fill="#287D78" font-size="25" font-weight="600" text-anchor="start">V = [2, 0], [0, 2]</text><rect x="76" y="331" width="341.3333333333333" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="246.66666666666666" y="371" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">m = 2</text><rect x="425.3333333333333" y="331" width="341.3333333333333" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="596" y="371" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">ℓ ≈ 1.368</text><rect x="774.6666666666666" y="331" width="341.3333333333333" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.3333333333333" y="371" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">a ≈ [0.736, 2]</text><rect x="48" y="447" width="1104" height="444" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="494" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">① Same maximum · Scale factor 1</text><text x="76" y="541" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">New scores [0, 1]    Corresponding V: [1, 1], [2, 0]</text><text x="76" y="586" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start">m: 2 → 2     Scale factor α = exp(2 − 2) ≈ 1</text><text x="360" y="633" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Previous accumulator × α</text><text x="770" y="633" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">New tile contribution</text><text x="100" y="688" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">Exp sum ℓ</text><rect x="241" y="652" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="688.5" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1.368</text><text x="568" y="691" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="652" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="688.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">0.503</text><text x="925" y="691" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">= 1.871</text><text x="100" y="769" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">Weighted a</text><rect x="241" y="733" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="769.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">[0.736, 2]</text><text x="568" y="772" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="733" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="769.5" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[0.871, 0.135]</text><text x="926" y="769" fill="#287D78" font-size="21" font-weight="600" text-anchor="start">Add vectors</text><text x="600" y="851" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">Updated: m = 2    ℓ ≈ 1.871    a ≈ [1.607, 2.135]</text><rect x="48" y="927" width="1104" height="444" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="974" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">② Higher maximum · Rescale both accumulators</text><text x="76" y="1021" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">New scores [3, 2]    Corresponding V: [0, 2], [1, 1]</text><text x="76" y="1066" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start">m: 2 → 3     Scale factor α = exp(2 − 3) ≈ 0.368</text><text x="360" y="1113" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Previous accumulator × α</text><text x="770" y="1113" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">New tile contribution</text><text x="100" y="1168" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">Exp sum ℓ</text><rect x="241" y="1132" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="1168.5" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">0.688</text><text x="568" y="1171" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="1132" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="1168.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">1.368</text><text x="925" y="1171" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">= 2.056</text><text x="100" y="1249" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">Weighted a</text><rect x="241" y="1213" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="1249.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">[0.591, 0.786]</text><text x="568" y="1252" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="1213" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="1249.5" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[0.368, 2.368]</text><text x="926" y="1249" fill="#287D78" font-size="21" font-weight="600" text-anchor="start">Add vectors</text><text x="600" y="1331" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">Updated: m = 3    ℓ ≈ 2.056    a ≈ [0.959, 3.153]</text><rect x="48" y="1410" width="1104" height="210" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1458" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">Keep both sums using the same reference.</text><text x="600" y="1510" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">New ℓ = previous ℓ × α + Σ exp(new score − new m)</text><text x="600" y="1559" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">New a = previous a × α + Σ exp(new score − new m) × V</text><text x="600" y="1600" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">α = exp(previous m − new m)</text><text x="600" y="1676" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">After all chunks: output = a ÷ ℓ ≈ [0.466, 1.534]</text><text x="600" y="1725" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">a is a vector · The same factor scales every element of a · Displayed values are rounded</text></g></g><path d="M48,1776 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1814" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">When the maximum grows, the same correction factor scales both ℓ and a before the new contributions</text><text x="48" y="1843.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">are added.</text></svg>