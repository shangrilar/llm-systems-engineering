<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">과거 계산을 반복하지 않는 KV 캐시</title><desc id="desc">캐시가 없으면 p0 p1 p2 x0의 계산을 반복합니다. KV 캐시가 있으면 x0만 새로 처리하고 x0의 Q가 저장된 과거 KV와 새 KV를 참조해 x1을 선택합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1120" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">과거 계산을 반복하지 않는 KV 캐시</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">한 요청의 다음 생성 단계를 비교합니다. p는 입력 토큰, x는 선택한 출력 토큰입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><g data-box="48,198,1104,108"><rect x="48" y="198" width="1104" height="108" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="233.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">현재 상태: p0 p1 p2를 처리한 뒤 x0를 선택했습니다</text><text x="70" y="275.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">이제 x0를 입력으로 사용해 x1을 선택할 차례입니다.</text></g><text x="48" y="365.0" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">캐시 없이 다시 계산</text><text x="642" y="365.0" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">과거 KV 재사용</text><rect x="68" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="119.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="662" y="403" width="102" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="713.0" y="440.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="186" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="237.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="780" y="403" width="102" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="831.0" y="440.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="304" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="355.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="898" y="403" width="102" height="57" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="949.0" y="440.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="422" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="473.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="1016" y="403" width="102" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1067.0" y="440.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><g data-box="48,499,510,158"><rect x="48" y="499" width="510" height="158" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="68" y="534.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">모든 입력 위치를 다시 통과</text><text x="68" y="577.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2 x0의 projection · MLP</text><text x="68" y="607.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">과거 위치의 K/V도 다시 계산</text></g><g data-box="642,499,510,158"><rect x="642" y="499" width="510" height="158" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="534.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">새 입력 위치만 통과</text><text x="662" y="577.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">x0의 projection · MLP</text><text x="662" y="607.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2의 저장된 K/V는 재사용</text></g><path d="M303,671 L303,705" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,671 L897,705" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,720,510,130"><rect x="48" y="720" width="510" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="755.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">마지막 위치의 결과로 x1 선택</text><text x="68" y="798.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">과거 문맥을 다시 계산해 복원</text><text x="68" y="828.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">새 위치도 전체 과거를 참조</text></g><g data-box="642,720,510,130"><rect x="642" y="720" width="510" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="755.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">새 Q는 누적 K/V를 참조</text><text x="662" y="798.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(x0)와 K/V(p0 p1 p2 x0)</text><text x="662" y="828.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">마지막 위치의 결과로 x1 선택</text></g><g data-box="48,901,1104,112"><rect x="48" y="901" width="1104" height="112" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="936.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">미래 토큰은 과거 위치의 계산 결과를 바꾸지 않습니다</text><text x="70" y="978.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">인과적 어텐션과 고정된 모델 조건에서 각 층의 과거 K/V를 재사용합니다.</text></g><text x="48" y="1064.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">주황: 이번 계산 위치 · 초록: 저장된 KV · 칸 크기는 계산 시간과 무관</text></svg>