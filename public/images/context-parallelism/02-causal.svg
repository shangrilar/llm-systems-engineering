<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="title desc"><title id="title">토큰 수가 같아도 계산량은 다를 수 있습니다</title><desc id="desc">인과적 어텐션의 삼각형에서 앞 세 행은 여섯 위치, 뒤 세 행은 열다섯 위치를 참조합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="884" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">토큰 수가 같아도 계산량은 다를 수 있습니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">여섯 토큰의 인과적 어텐션을 앞 세 토큰과 뒤 세 토큰으로 나눈 예입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="328" y="211.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">참조할 K·V의 토큰 →</text><text x="366" y="258.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="464" y="258.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="562" y="258.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="660" y="258.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="758" y="258.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t4</text><text x="856" y="258.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t5</text><text x="48" y="313.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">GPU 0 · Q(t0)</text><rect x="326" y="279" width="82" height="57" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="367" y="316.0" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">●</text><rect x="424" y="279" wid