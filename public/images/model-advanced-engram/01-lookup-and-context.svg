="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 520 L260 570" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="10" y="580" width="145" height="95" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="611" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="113">RMSNorm</text></g><g data-container="true"><rect x="185" y="580" width="150" height="95" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="201" y="611" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="118">RMSNorm</text></g><path d="M82 685 V735 H130 V780" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 685 V735 H240 V780" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="790" width="315" height="95" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="821" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="283">내적 ÷ √d</text></g><path d="M177 895 L177 935" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="20" y="945" width="315" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="177.5" y="985.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="303">sigmoid → α_t</text><path d="M177 1020 L177 1090" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M440 520 V1120 H215" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><circle cx="177" cy="1120" r="30" fill="#FFF2E6" stroke="#B55B22"/><text x="177" y="1129" fill="#B55B22" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">×</text><path d="M177 1160 L177 1210" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="20" y="1220" width="315" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="177.5" y="1260.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="303">ṽ_t [d] = α_t v_t</text></g></svg>