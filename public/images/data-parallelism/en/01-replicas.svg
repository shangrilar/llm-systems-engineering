="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="285" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Request A</text><text x="66" y="335" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M180,386 L180,427" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="48" y="439" width="264" height="178" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="475" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="525" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="66" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M180,630 L180,673" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="48" y="685" width="264" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="721" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Result A</text><text x="66" y="771" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><rect x="328" y="249" width="264" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="285" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Request B</text><text x="346" y="335" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M460,386 L460,427" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="328" y="439" width="264" height="178" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="475" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="346" y="525" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="346" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M460,630 L460,673" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="328" y="685" width="264" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="721" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Result B</text><text x="346" y="771" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><rect x="608" y="249" width="264" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="285" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Request C</text><text x="626" y="335" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M740,386 L740,427" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="608" y="439" width="264" height="178" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="475" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="626" y="525" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="626" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M740,630 L740,673" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="608" y="685" width="264" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="721" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Result C</text><text x="626" y="771" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><rect x="888" y="249" width="264" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="285" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Request D</text><text x="906" y="335" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M1020,386 L1020,427" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="888" y="439" width="264" height="178" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="475" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="906" y="525" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full model W</text><text x="906" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Own request</text><path d="M1020,630 L1020,673" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="888" y="685" width="264" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="721" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Result D</text><text x="906" y="771" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text></g></g><path d="M48,864 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="902" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">DP splits inputs, not the model, so basic DP alone does not reduce weight memory per GPU.</text></svg>