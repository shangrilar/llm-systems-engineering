 height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="978" y="666" width="164" height="90" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><rect x="986" y="687" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="1024" y="687" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="1062" y="687" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="1100" y="687" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><text x="232" y="799" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">B의 다음 KV 7칸도 수용</text><text x="600" y="799" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">C 배정 · 아직 계산 전</text><text x="968" y="799" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">남은 블록 2개</text><text x="48" y="868" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">1블록 = KV 4칸 · 채운 칸은 이미 계산된 KV · 빈칸은 아직 KV 없음</text></g></g><path d="M48,929 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="967" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">큰 예약 공간을 필요한 블록으로 바꾸면 같은 용량에서 C를 받아들일 수 있습니다.</text></svg>