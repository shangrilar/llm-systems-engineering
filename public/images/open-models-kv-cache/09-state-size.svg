<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="904" viewBox="0 0 1200 904" role="img" aria-labelledby="title desc"><title id="title">고정 상태는 얼마나 큰가</title><desc id="desc">두 패널. Kimi K3는 head 하나 65,536 B에 96 head를 곱해 층 하나 6.3 MB, 69층을 곱해 상태 행렬 434 MB, conv 15.3 MB를 더해 고정 상태 449 MB이고, 출력 토큰마다 행렬 읽기+쓰기 868 MB다. Qwen3.8-Flash-Next는 48 head, 36층으로 상태 행렬 56.6 MB(BF16), conv 등을 더해 59.0 MB, 읽기+쓰기 113 MB다.</desc><metadata>{&quot;id&quot;:&quot;open-models-kv-cache-09-state-size&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Kimi K3 report · §2.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2607.24653&quot;},{&quot;label&quot;:&quot;Qwen3.8-Flash-Next report · §2.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2608.30320&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-widt