<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1821" viewBox="0 0 1200 1821" role="img" aria-labelledby="title desc"><title id="title">Updating the Maximum and Sum with New Scores</title><desc id="desc">Process chunks 1,2 then 0,1 then 3,2 in order. Start with m=2 and l about 1.368. Since 0,1 are below the previous maximum, keep m=2 and add exp(0-2)+exp(1-2), about 0.503, to obtain l about 1.871. The next chunk 3,2 raises m to 3. Multiply the entire previous l by exp(2-3), giving about 0.688, then add exp(3-3)+exp(2-3), about 1.368. The final m is 3 and l is about 2.056. Rescale the single accumulated sum without rereading earlier scores. This figure covers only normalization statistics. Outputting all probabilities additionally requires normalizing each score with the final m and l. Values are rounded after calculation at full precision.</desc><metadata>{&quot;id&quot;:&quot;03-online-update&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Updating the Maximum and Sum with New Scores</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Read chunks in order, keeping two values for all scores processed so far.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="205" width="1104" height="185" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="251" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Start · After processing the first chunk [1, 2]</text><rect x="85" y="284" width="110" height="66" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="140" y="325" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="205" y="284" width="110" height="66" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="260" y="325" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M356,318 L672,318" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="511" y="298" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Keep two values</text><rect x="709" y="284" width="169" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="793.5" y="325" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">m = 2</text><rect x="897" y="284" width="227" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1010.5" y="325" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ℓ ≈ 1.368</text><rect x="48" y="429" width="1104" height="422" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="475" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">① New chunk [0, 1] · Keep the maximum</text><rect x="83" y="506" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="138" y="547" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0</text><rect x="203" y="506" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="258" y="547" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><text x="386" y="547" fill="#7954A3" font-size="27" font-weight="700" text-anchor="start">max(previous max 2, chunk max 1) = 2</text><rect x="83" y="615" width="362" height="73" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="264" y="659.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Previous sum ≈ 1.368</text><text x="480" y="661" fill="#287D78" font-size="35" font-weight="700" text-anchor="middle">+</text><rect x="515" y="615" width="609" height="73" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="819.5" y="659.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">exp(0 − 2) + exp(1 − 2) ≈ 0.503</text><text x="264" y="726" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Same reference: keep the sum</text><text x="819" y="726" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">New scores also use max 2</text><text x="84" y="801" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">After two chunks</text><rect x="709" y="759" width="169" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="793.5" y="800" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">m = 2</text><rect x="897" y="759" width="227" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1010.5" y="800" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ℓ ≈ 1.871</text><path d="M980,864 L980,902" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="48" y="921" width="1104" height="485" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="968" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">② New chunk [3, 2] · Update the maximum</text><rect x="83" y="999" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="138" y="1040" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">3</text><rect x="203" y="999" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="258" y="1040" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><text x="386" y="1040" fill="#7954A3" font-size="27" font-weight="700" text-anchor="start">max(previous max 2, chunk max 3) = 3</text><rect x="83" y="1107" width="450" height="73" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="308" y="1151.5" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">Previous sum × exp(2 − 3)</text><text x="574" y="1153" fill="#287D78" font-size="35" font-weight="700" text-anchor="middle">+</text><rect x="615" y="1107" width="509" height="73" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="869.5" y="1151.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">exp(3 − 3) + exp(2 − 3)</text><text x="308" y="1220" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">≈ 1.871 × 0.368 ≈ 0.688</text><text x="869" y="1220" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">≈ 1.368</text><text x="308" y="1262" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle">Rescale the previous sum to max 3</text><text x="869" y="1262" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">New scores also use max 3</text><text x="84" y="1355" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">After all chunks</text><rect x="709" y="1312" width="169" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="793.5" y="1353" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">m = 3</text><rect x="897" y="1312" width="227" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1010.5" y="1353" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ℓ ≈ 2.056</text><rect x="48" y="1450" width="1104" height="170" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1499" fill="#287D78" font-size="29" font-weight="700" text-anchor="middle">Choose the max first, then add sums using that same max.</text><text x="600" y="1550" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">New sum = previous sum × exp(previous max − new max)</text><text x="600" y="1591" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">+ sum of exp(score − new max) for the new scores</text><text x="600" y="1662" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Same max: the scale factor is exp(0) = 1 · Decimals are rounded</text></g></g><path d="M48,1713 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1751" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">This figure covers only the normalization statistics; outputting probabilities also requires normalizing</text><text x="48" y="1780.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">each score with the final m and ℓ.</text></svg>