<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1633" viewBox="0 0 360 1633" role="img" aria-labelledby="title desc"><title id="title">Transfer completion is not permission to use the new policy</title><desc id="desc">The trainer prepares and transfers v21. After copying completes, worker A finishes requantizing before B. New v21 requests are admitted only after the transition confirms readiness. In-flight request and KV policies must be defined beforehand.</desc><metadata>{&quot;id&quot;:&quot;15-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles P2P v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/p2p-weight-transfer.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Transfer completion is not</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">permission to use the new</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">policy</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Example for a model requiring</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">requantization. Generation is paused</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">before updating GPUs A/B in the same</text><text x="16" y="238.59999999999997" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">inference execution. Bar lengths are</text><text x="16" y="262.4" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">illustrative.</text><path d="M16,282.4 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 306.4) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A transition on one time axis</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><path d="M0 108 L506 108" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="418" y="96" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-width="96">Time</text><path d="M260 170 L260 270" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 170 L450 270" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M260 314 L260 415" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 314 L450 415" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M260 459 L260 560" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 459 L450 560" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M260 604 L260 704" stroke="#5C6C7C" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><path d="M450 604 L450 704" stroke="#287D78" stroke-width="1.5" fill="none" stroke-dasharray="7 5"/><text x="0" y="156" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">Trainer · prepare and transfer v21</text><rect x="0" y="179" width="114" height="58" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="57" y="216" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="102">Prep v21</text><rect x="122" y="179" width="138" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="191" y="216" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="126">Transfer</text><text x="0" y="301" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">GPU A · requantization finishes first</text><rect x="122" y="324" width="138" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="191" y="361" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="126">Copy</text><rect x="266" y="324" width="120" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="326" y="361" fill="#B55B22" font-size="19" font-weight="600" text-anchor="middle" data-max-width="112">Requantize</text><rect x="392" y="324" width="48" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="416" y="361" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="36">✓</text><path d="M392 398 L440 398" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><text x="0" y="446" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">GPU B · still requantizing</text><rect x="122" y="469" width="138" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="191" y="506" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="126">Copy</text><rect x="266" y="469" width="174" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="353" y="506" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="162">Requantize</text><text x="0" y="591" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="520">Admission of new requests</text><rect x="0" y="614" width="440" height="58" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="220" y="651" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="428">Wait for consistent weights</text><rect x="450" y="614" width="58" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="479" y="651" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="46">✓</text><circle cx="260" cy="718" r="19" fill="#F1F4F7" stroke="#5C6C7C"/><text x="260" y="725" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle" data-max-width="32">1</text><circle cx="450" cy="718" r="19" fill="#EDF7F5" stroke="#287D78"/><text x="450" y="725" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle" data-max-width="32">2</text><g data-container="true"><rect x="0" y="779" width="508" height="113" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="16" y="810" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="476">① Copying complete</text><text x="16" y="850" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">Values have arrived; the inference</text><text x="16" y="878" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">representation is not ready yet</text></g><g data-container="true"><rect x="0" y="919" width="508" height="150" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="16" y="950" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="476">② Admit v21 after confirming readiness</text><text x="16" y="990" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">Confirm both participating workers are ready.</text><text x="16" y="1018" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">A finishing early alone does not allow</text><text x="16" y="1046" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="476">resumption</text></g></g><g transform="translate(16 1053.476923076923) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Switching tasks beyond weight conversion</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="111" width="488" height="180" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="142" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Handle existing requests</text><text x="32" y="182" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Before changing weights, drain or pause</text><text x="32" y="210" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">generation. Continuation depends on engine</text><text x="32" y="238" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">support.</text></g><path d="M260 311 L260 349" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="370" width="488" height="180" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="401" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Handle KV from the old weights</text><text x="32" y="441" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Check old-KV compatibility; invalidate caches</text><text x="32" y="469" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">or recompute context as needed.</text></g><path d="M260 570 L260 608" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="629" width="488" height="180" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="660" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Resume with v21 when all are ready</text><text x="32" y="700" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Resume together after weight preparation</text><text x="32" y="728" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">and request/cache handling are complete.</text></g></g></svg>