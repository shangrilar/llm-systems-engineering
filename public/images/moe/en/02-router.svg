<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc">
<title id="title">Router: select experts and compute weights</title><desc id="desc">An 8-by-4 router projection gives token 1 four scores [1,0,2,-1]. E1 and E3 are selected, then Softmax assigns weights of approximately 0.269 and 0.731.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1520" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Router: select experts and compute weights</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Token 1 · d = 8 · 4 experts · Top-2</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="48" y="238" fill="#182C40" font-size="28" font-weight="600" text-anchor="start">1. Compute a score for each expert</text><rect x="48" y="270" width="1104" height="120" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="313" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Router projection</text><text x="600" y="358" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle">x₁ (1 × 8)  ×  Wᵣ (8 × 4)  =  r₁ (1 × 4)</text><rect x="48" y="435" width="240" height="110" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="168" y="470" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Expert 1</text><text x="168" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">1</text><rect x="336" y="435" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="456" y="470" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Expert 2</text><text x="456" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">0</text><rect x="624" y="435" width="240" height="110" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="744" y="470" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Expert 3</text><text x="744" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">2</text><rect x="912" y="435" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1032" y="470" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Expert 4</text><text x="1032" y="522" fill="#182C40" font-size="34" font-weight="600" text-anchor="middle">-1</text><text x="48" y="630" fill="#182C40" font-size="28" font-weight="600" text-anchor="start">2. Top-2: select the two highest scores</text><rect x="180" y="680" width="350" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="355.0" y="726.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Expert 1 (score 1)</text><rect x="670" y="680" width="350" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="845.0" y="726.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Expert 3 (score 2)</text><path d="M600,781 L600,820" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="48" y="875" fill="#182C40" font-size="28" font-weight="600" text-anchor="start">3. Apply Softmax to the selected scores</text><rect x="70" y="920" width="495" height="97" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="317.5" y="978" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">E1: e¹ / (e¹ + e²) ≈ 0.269</text><rect x="635" y="920" width="495" height="97" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="882.5" y="978" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">E3: e² / (e¹ + e²) ≈ 0.731</text><text x="600" y="1090" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Weights for each expert</text><rect x="48" y="1120" width="240" height="110" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="168" y="1155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Expert 1</text><text x="168" y="1202" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">0.269</text><rect x="336" y="1120" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="456" y="1155" fill="#728190" font-size="22" font-weight="600" text-anchor="middle">Expert 2</text><text x="456" y="1202" fill="#728190" font-size="30" font-weight="600" text-anchor="middle">0</text><rect x="624" y="1120" width="240" height="110" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="744" y="1155" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Expert 3</text><text x="744" y="1202" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">0.731</text><rect x="912" y="1120" width="240" height="110" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1032" y="1155" fill="#728190" font-size="22" font-weight="600" text-anchor="middle">Expert 4</text><text x="1032" y="1202" fill="#728190" font-size="30" font-weight="600" text-anchor="middle">0</text><rect x="48" y="1290" width="1104" height="100" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1331" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Send this token’s input to the selected experts.</text><text x="600" y="1369" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Combine their outputs using the weights above.</text><path d="M48,1440 L1152,1440" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1481" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Illustrative scores. This example applies Softmax to the Top-2 selected scores.</text>
</svg>