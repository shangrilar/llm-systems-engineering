<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1400" viewBox="0 0 360 1400" role="img" aria-labelledby="title desc"><title id="title">Two models, the same context and selected token</title><desc id="desc">At P+u, student and frozen teacher compute candidate distributions. Chosen token b has probabilities 0.2 and 0.4, giving log ratio +0.693. At P+u+b, chosen d has probabilities 0.4 and 0.2, giving -0.693.</desc><metadata>{&quot;id&quot;:&quot;4-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0 OPD&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/on-policy-distillation.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Two models, the same</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">context and selected</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">token</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Follow b and d on the student path u →</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">b → d. Each model computes its own</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">context representation and</text><text x="16" y="238.59999999999997" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">next-token distribution.</text><path d="M16,258.59999999999997 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 282.59999999999997) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Position 2 · chosen b</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="98" width="488" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="129" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">P + u</text><text x="32" y="169" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Identical input to both models</text></g><path d="M133 200 L133 230" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M387 200 L387 230" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="16" y="242" width="234" height="150" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="273" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="202">Student · scoring</text><text x="32" y="313" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="202">Transformer → h</text><text x="32" y="341" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="202">LM head → softmax</text></g><path d="M133 402 L133 428" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="16" y="468" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="50">u</text><rect x="71" y="452" width="125" height="18" rx="2" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="71" y="452" width="75" height="18" rx="2" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="246" y="468" fill="#2470BB" font-size="18" font-weight="400" text-anchor="end" data-max-width="40">0.3</text><text x="16" y="508" fill="#2470BB" font-size="18" font-weight="400" text-anchor="start" data-max-width="50">b</text><rect x="71" y="492" width="125" height="18" rx="2" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="71" y="492" width="50" height="18" rx="2" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="246" y="508" fill="#2470BB" font-size="18" font-weight="400" text-anchor="end" data-max-width="40">0.2</text><text x="16" y="548" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="50">d</text><rect x="71" y="532" width="125" height="18" rx="2" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="71" y="532" width="25" height="18" rx="2" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="246" y="548" fill="#2470BB" font-size="18" font-weight="400" text-anchor="end" data-max-width="40">0.1</text><text x="16" y="588" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="50">Other</text><rect x="71" y="572" width="125" height="18" rx="2" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="71" y="572" width="100" height="18" rx="2" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="246" y="588" fill="#2470BB" font-size="18" font-w