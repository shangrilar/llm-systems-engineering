<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">What Happens When We Add Two Values?</title><desc id="desc">Four steps: read inputs, execute addition, keep the result, and store the result. Values a=2 and b=3 are read from memory into registers. A CUDA Core adds them, puts c=5 in a register, and the result is stored in memory. Cache and data movement details are omitted.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1080" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">What Happens When We Add Two Values?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Follow the steps from reading a = 2 and b = 3 to producing c = 5.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="220" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="72" y="266" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">① Read inputs</text><text x="72" y="526" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Read the input values into registers.</text><rect x="624" y="220" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="648" y="266" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">② Execute addition</text><text x="648" y="526" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">A CUDA Core adds the two ready values.</text><rect x="48" y="612" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="72" y="658" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">③ Keep the result</text><text x="72" y="918" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Keep the computed result in a register.</text><rect x="624" y="612" width="528" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="648" y="658" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">④ Store the result</text><text x="648" y="918" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Write the register result to memory.</text><rect x="76" y="310" width="176" height="164" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="164.0" y="349" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Memory</text><text x="164.0" y="399" fill="#2470BB" font-size="26" font-weight="400" text-anchor="middle">a = 2</text><text x="164.0" y="436" fill="#2470BB" font-size="26" font-weight="400" text-anchor="middle">b = 3</text><rect x="372" y="310" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="460.0" y="349" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="460.0" y="399" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">a = 2</text><text x="460.0" y="436" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">b = 3</text><path d="M261,392 L359,392" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)" /><text x="310" y="367" fill="#2470BB" font-size="20" font-weight="600" text-anchor="middle">Read</text><rect x="652" y="310" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="740.0" y="349" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="740.0" y="399" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">a = 2</text><text x="740.0" y="436" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">b = 3</text><rect x="948" y="310" width="176" height="164" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="1036.0" y="349" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">CUDA Core</text><text x="1036.0" y="399" fill="#B55B22" font-size="26" font-weight="400" text-anchor="middle">2 + 3</text><path d="M837,392 L935,392" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)" /><text x="886" y="367" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">Inputs</text><rect x="76" y="702" width="176" height="164" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="164.0" y="741" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">CUDA Core</text><text x="164.0" y="791" fill="#B55B22" font-size="26" font-weight="400" text-anchor="middle">2 + 3 = 5</text><rect x="372" y="702" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="460.0" y="741" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="460.0" y="791" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">c = 5</text><path d="M261,784 L359,784" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)" /><text x="310" y="759" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">Result</text><rect x="652" y="702" width="176" height="164" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="740.0" y="741" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">Register</text><text x="740.0" y="791" fill="#7954A3" font-size="26" font-weight="400" text-anchor="middle">c = 5</text><rect x="948" y="702" width="176" height="164" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="1036.0" y="741" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Memory</text><text x="1036.0" y="791" fill="#2470BB" font-size="26" font-weight="400" text-anchor="middle">c = 5</text><path d="M837,784 L935,784" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)" /><text x="886" y="759" fill="#2470BB" font-size="20" font-weight="600" text-anchor="middle">Write</text><text x="600" y="1031" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">Data is read before computation and stored afterward.</text></svg>