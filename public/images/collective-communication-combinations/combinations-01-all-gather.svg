<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1023" viewBox="0 0 1200 1023" role="img" aria-labelledby="title desc">
<title id="title">All-Gather: 모은 결과를 모두에게</title><desc id="desc">입력은 GPU별로 [1,2], [10,20], [100,200], [1000,2000]이다. All-Gather 완료 후 모든 GPU가 rank 순서로 이어 붙인 같은 8개 원소 배열을 갖는다. Gather 뒤 Broadcast를 수행한 것과 같은 데이터 결과를 설명하며 반드시 두 단계를 실행하는 구현이라는 뜻은 아니다. root를 지정할 필요가 없다.</desc>
