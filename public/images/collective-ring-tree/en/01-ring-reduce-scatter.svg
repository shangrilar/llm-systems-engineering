ight="114" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="1419.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="600" y="1457.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">D = 444</text><text x="600" y="1487.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">44 + 400</text><rect x="120" y="1218" width="300" height="114" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="270" y="1250.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="270" y="1288.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">A = 1110</text><text x="270" y="1318.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">110 + 1000</text><text x="600" y="1268.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Received + local input</text><text x="600" y="1297.4" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">All four GPUs reduce</text><path d="M600,1516 L600,1541" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="1587.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Step 3 · state after transfer</text><path d="M758,1705 L899,1782" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="1739.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">B: 2202</text><path d="M899,1908 L758,1985" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="1965.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">C: 3033</text><path d="M442,1985 L301,1908" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="1965.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">D: 444</text><path d="M301,1782 L442,1705" stroke="#526577" stroke-width="