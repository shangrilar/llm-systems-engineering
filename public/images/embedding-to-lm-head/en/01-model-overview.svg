<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc" lang="en">
<title id="title">The overall structure of an LLM</title><desc id="desc">The left panel shows Embedding, Decoder block times N, and LM Head. The right panel expands the same structure into decoder blocks 1, 2, an ellipsis, and N. The architecture repeats; block internals are hidden.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<style>text{font-family:"Arial","Apple SD Gothic Neo","Noto Sans KR",sans-serif;} path,line{stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1200" height="900" fill="white" />
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">The overall structure of an LLM</text>
<text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Follow the path from input to output, keeping decoder internals hidden for now.</text>
<line x1="48" y1="169" x2="1152" y2="169" stroke="#DCE4EC" stroke-width="2" />
