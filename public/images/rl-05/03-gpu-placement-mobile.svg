<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1274" viewBox="0 0 360 1274" role="img" aria-labelledby="title desc"><title id="title">두 엔진을 같은 GPU에 둘 수도, 나눠 둘 수도 있다</title><desc id="desc">공유 배치에서는 GPU 네 개를 생성과 학습이 번갈아 쓰고 분리 배치에서는 같은 네 개를 추론 두 개와 학습 두 개로 나눈다. 공유 시 전환 비용과 메모리 조정, 분리 시 자원 배분과 가중치 전달을 고려한다.</desc><metadata>{&quot;id&quot;:&quot;5-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0 architecture&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/developer/architecture.md&quot;},{&quot;label&quot;:&quot;Slime&quot;,&quot;url&quot;:&quot;https://github.com/THUDM/slime&quot;},{&quot;label&quot;:&quot;NeMo RL&quot;,&quot;url&quot;:&quot;https://github.com/NVIDIA-NeMo/RL&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">두 엔진을 같은 GPU에 둘 수도,</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">나눠 둘 수도 있다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">같은 전체 GPU 자원에서 배치 방식만</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">비교합니다. GPU 수와 분할 비율은 교육용</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">예시입니다.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">공유 배치</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="8" y="104" width="504" height="347" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="28" y="143" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="492">전체 GPU 자원</text><rect x="28" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="80.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 1</text><rect x="147" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="199.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 2</text><rect x="266" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="318.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 3</text><rect x="385" y="178" width="105" height="64" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="437.5" y="218" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="93">GPU 4</text><g data-container="true"><rect x="28" y="320" width="195" height="85" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="44" y="351" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="163">생성</text></g><g data-container="true"><rect x="297" y="320" width="195" height="85" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="313" y="351" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="163">학습</text></g><path d="M231 348 L289 348" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M289 380 L231 380" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="28" y="285" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="455">동일한 GPU 집합을 번갈아 사용</text><g data-container="true"><rect x="8" y="487" width="504" height="112" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="518" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">전환 비용</text><text x="24" y="558" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">생성 ↔ 학습으로 실행 상태 전환</text></g><g data-container="true"><rect x="8" y="623" width="504" height="137" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="654" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">메모리 조정</text><text x="24" y="694" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">다음 단계가 쓸 메모리 확보</text></g></g><g transform="translate(16 751.5076923076924) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">분리 배치</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="8" y="104" width="504" height="347" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="28" y="143" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="492">전체 GPU 자원</text><rect x="24" y="170" width="225" height="249" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="271" y="170" width="225" height="249" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="42" y="209" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="186">추론용</text><text x="289" y="209" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="186">학습용</text><rect x="42" y="240" width="188" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="136" y="277" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 1</text><rect x="42" y="326" width="188" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="136" y="363" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 2</text><rect x="289" y="240" width="188" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="383" y="277" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 3</text><rect x="289" y="326" width="188" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="383" y="363" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="176">GPU 4</text><g data-container="true"><rect x="8" y="487" width="504" height="112" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="518" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">자원 배분</text><text x="24" y="558" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">두 풀의 크기를 워크로드에 맞게 배분</text></g><g data-container="true"><rect x="8" y="623" width="504" height="137" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="24" y="654" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">가중치 전달</text><text x="24" y="694" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">학습한 가중치를 추론 풀에 반영</text></g></g></svg>