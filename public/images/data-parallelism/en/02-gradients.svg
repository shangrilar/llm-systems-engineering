<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="914" viewBox="0 0 1200 914" role="img" aria-labelledby="title desc"><title id="title">Training DP: synchronize gradients and updates</title><desc id="desc">Average gradients 2 and 6 to get 4; both GPUs update weight 10 to 9.6.</desc><metadata>{&quot;id&quot;:&quot;02-gradients&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Training DP: synchronize gradients and updates</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Assume equal local batch sizes, mean local losses, and a simple SGD update.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><rect x="48" y="207" width="510" height="160" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="243" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="293" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Same weight w = 10</text><text x="66" y="325.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Input A → gradient g₀ = 2</text><rect x="642" y="207" width="510" height="160" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="243" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="293" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Same weight w = 10</text><text x="660" y="325.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Input B → gradient g₁ = 6</text><path d="M303,378 L303,431" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M897,378 L897,431" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="48" y="446" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="482" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">All-Reduce the sum, then divide by the number of participants</text><text x="72" y="522" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">g = (2 + 6) / 2 = 4</text><path d="M303,562 L303,601" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="48" y="615" width="510" height="167" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="651" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="701" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Learning rate η = 0.1</text><text x="66" y="733.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Same update: 10 − 0.1 × 4 = 9.6</text><path d="M897,562 L897,601" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="642" y="615" width="510" height="167" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="651" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="701" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Learning rate η = 0.1</text><text x="660" y="733.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Same update: 10 − 0.1 × 4 = 9.6</text></g></g><path d="M48,836 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="874" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Both GPUs start from the same weight and apply the same update, so the replicas stay identical.</text></svg>