<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="954" viewBox="0 0 1200 954" role="img" aria-labelledby="title desc"><title id="title">Ring: pass chunks and accumulate</title><desc id="desc">After three neighbor transfers, GPUs 0–3 own completed chunks A=1111, B=2222, C=3333, D=4444.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="954" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Ring: pass chunks and accumulate</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Each cell tracks one outgoing or newly reduced chunk, not the full buffer.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="188" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="224.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Add matching positions across four GPUs</text><text x="72" y="264.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0 [1, 2, 3, 4]    GPU 1 [10, 20, 30, 40]</text><text x="72" y="327.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 2 [100, 200, 300, 400]    GPU 3 [1000, 2000, 3000, 4000]</text><text x="48" y="381.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">Chunks A / B / C / D = positions 1 / 2 / 3 / 4</text><rect x="48" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">State</text><rect x="268.8" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="489.6" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="710.4000000000001" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 2</text><rect x="931.2" y="411" width="214.8" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="448.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 3</text><rect x="48" y="477" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">First send</text><rect x="268.8" y="477" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 4</text><rect x="489.6" y="477" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 10</text><rect x="710.4000000000001" y="477" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 200</text><rect x="931.2" y="477" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="511.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3000</text><rect x="48" y="553" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">After step 1</text><rect x="268.8" y="553" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3003</text><rect x="489.6" y="553" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 44</text><rect x="710.4000000000001" y="553" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 110</text><rect x="931.2" y="553" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="587.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 2200</text><rect x="48" y="629" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">After step 2</text><rect x="268.8" y="629" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 2202</text><rect x="489.6" y="629" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3033</text><rect x="710.4000000000001" y="629" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 444</text><rect x="931.2" y="629" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="663.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 1110</text><rect x="48" y="705" width="214.8" height="68" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">After step 3</text><rect x="268.8" y="705" width="214.8" height="68" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A = 1111</text><rect x="489.6" y="705" width="214.8" height="68" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B = 2222</text><rect x="710.4000000000001" y="705" width="214.8" height="68" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C = 3333</text><rect x="931.2" y="705" width="214.8" height="68" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D = 4444</text><rect x="48" y="812" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="848.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">GPU 0 → GPU 1 → GPU 2 → GPU 3 → GPU 0</text><text x="72" y="888.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Each step: all four GPUs send, receive, and add their local contribution.</text></svg>