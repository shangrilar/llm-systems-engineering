<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc"><title id="title">The Attention Computation Flow</title><desc id="desc">Causal self-attention for one head, excluding batch and head axes. Q (T × dh) times the transpose of K (dh × T) produces scores S (T × T). Scaling and a future-token mask are followed by row-wise Softmax to produce probabilities P (T × T). P times V (T × dh) produces O (T × dh). The shapes use T=4 and dh=2. Future-token entries in P are zero, and each valid row sums to one. The numbers label mathematical explanation stages, not separate kernel counts.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1350" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">The Attention Computation Flow</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Scores → Scaling and masking → Softmax → Weighted sum of Values</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="213" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">One head · T: token count · dₕ: head dimension</text><rect x="48" y="248" width="1104" height="301" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="290" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. Compute scores between tokens using Q and K.</text><text x="178.0" y="325" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Q</text><rect x="144" y="353" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="353" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="144" y="387" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="387" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="144" y="421" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="421" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="144" y="455" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="455" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="178.0" y="520" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">T × dₕ</text><text x="316" y="428" fill="#5C6C7C" font-size="36" font-weight="400" text-anchor="middle">×</text><text x="478.0" y="359" fill="#7954A3" font-size="27" font-weight="700" text-anchor="middle">Kᵀ</text><rect x="410" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="444" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="478" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="512" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="410" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="444" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="478" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="512" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="478.0" y="486" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">dₕ × T</text><path d="M627,420 L763,420" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="961.0" y="325" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">Scores S</text><rect x="893" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="893" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="893" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="893" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="961.0" y="520" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">T × T</text><path d="M600,562 L600,595" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="48" y="613" width="1104" height="246" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="655" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">2. Adjust scores and convert each row to probabilities.</text><rect x="76" y="701" width="167" height="91" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="159.5" y="754.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Scores S</text><path d="M257,747 L300,747" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="314" y="701" width="275" height="91" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="451" y="737" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Scale · Mask</text><text x="451" y="770" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Exclude future tokens</text><path d="M604,747 L647,747" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="660" y="701" width="198" height="91" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="759.0" y="754.5" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">Softmax</text><path d="M872,747 L915,747" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="930" y="701" width="192" height="91" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="1026.0" y="754.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Probabilities P</text><text x="758" y="831" fill="#7954A3" font-size="21" font-weight="400" text-anchor="middle">Probabilities in each row sum to 1</text><path d="M600,873 L600,907" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="48" y="925" width="1104" height="314" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="967" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">3. Weight and sum V to produce an output for each token.</text><text x="179.0" y="1002" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">P</text><rect x="111" y="1030" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="145" y="1030" width="31" height="31" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="179" y="1030" width="31" height="31" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="213" y="1030" width="31" height="31" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="111" y="1064" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="145" y="1064" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="179" y="1064" width="31" height="31" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="213" y="1064" width="31" height="31" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="111" y="1098" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="145" 