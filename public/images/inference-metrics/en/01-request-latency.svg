<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">Read latency on one request timeline</title><desc id="desc">Submit at 0ms, tokens at 100, 130 and 170ms, end at 180ms. TTFT 100ms, ITLs 30 and 40ms, TPOT 35ms/token, E2E 180ms.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="880" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Read latency on one request timeline</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Each metric measures a different span on the same timeline.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Client receipt times · One token per chunk in this example</text><path d="M120,325 L1020,325" stroke="#526577" stroke-width="2" fill="none"/><circle cx="120" cy="325" r="9" fill="#182C40" stroke="#182C40" stroke-width="3"/><text x="120" y="270.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Submit</text><text x="120" y="302.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">0 ms</text><circle cx="620" cy="325" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="620" y="270.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">First token x0</text><text x="620" y="302.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">100 ms</text><circle cx="770" cy="325" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="770" y="270.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Token x1</text><text x="770" y="302.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">130 ms</text><circle cx="970" cy="325" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="970" y="270.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Token x2</text><text x="970" y="302.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">170 ms</text><path d="M1020,240 L1020,340" stroke="#B55B22" stroke-width="2" fill="none"/><text x="1020" y="239.0" fill="#B55B22" font-size="21" font-weight="700" text-anchor="middle">End 180 ms</text><path d="M120,410 L620,410" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M120,402 L120,418" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M620,402 L620,418" stroke="#2470BB" stroke-width="2" fill="none"/><text x="370.0" y="390.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">TTFT · 100 ms</text><path d="M620,480 L770,480" stroke="#287D78" stroke-width="2" fill="none"/><path d="M620,472 L620,488" stroke="#287D78" stroke-width="2" fill="none"/><path d="M770,472 L770,488" stroke="#287D78" stroke-width="2" fill="none"/><text x="695.0" y="460.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">ITL · 30 ms</text><path d="M770,480 L970,480" stroke="#287D78" stroke-width="2" fill="none"/><path d="M770,472 L770,488" stroke="#287D78" stroke-width="2" fill="none"/><path d="M970,472 L970,488" stroke="#287D78" stroke-width="2" fill="none"/><text x="870.0" y="460.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">ITL · 40 ms</text><rect x="500" y="535" width="620" height="120" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="530" y="574.0" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">TPOT · Average interval after the first token</text><text x="530" y="621.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">(30 + 40) / 2 = 35 ms/token</text><path d="M120,740 L1020,740" stroke="#182C40" stroke-width="2" fill="none"/><path d="M120,732 L120,748" stroke="#182C40" stroke-width="2" fill="none"/><path d="M1020,732 L1020,748" stroke="#182C40" stroke-width="2" fill="none"/><text x="570.0" y="720.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Full request time · E2E = 180 ms</text><text x="48" y="812.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">3 output tokens → 2 intervals · Last-token receipt and request end are distinct.</text></svg>