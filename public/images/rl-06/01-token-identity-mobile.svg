<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1060" viewBox="0 0 360 1060" role="img" aria-labelledby="title desc"><title id="title">문자열 대신 토큰 ID를 전달한다</title><desc id="desc">문자열 왕복 경로는 토큰 101,202를 문자열 AB로 바꾼 뒤 토큰 303으로 다시 인코딩한다. TITO 경로는 토큰 101,202를 그대로 학습기에 전달한다.</desc><metadata>{&quot;id&quot;:&quot;7-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §2.4&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">문자열 대신 토큰 ID를</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">전달한다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">같은 문자열도 다시 토큰화하면 다른 ID</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">배열이 될 수 있습니다. 숫자는 설명용</text><text x="16" y=