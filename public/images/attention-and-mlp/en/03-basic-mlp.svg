#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="400.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.5</text><rect x="500.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="600.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="700.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="800.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="850.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.5</text><rect x="900.0" y="550" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="950.0" y="587.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M600,618 L600,650" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="340.0" y="664" width="520" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="696" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ReLU</text><text x="600" y="724" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Apply max(0, value) to each component</text><path d="M600,752 L600,789" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><rect x="200.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="250.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="300.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="400.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="450.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0.5</text><rect x="500.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="550.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="600.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="650.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="700.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="750.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="800.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="850.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="900.0" y="804" width="100.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="950.0" y="841.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M600,872 L600,909" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="410.0" y="923" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="955" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Linear transformation 2</text><text x="600" y="983" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">m → d  ·  8 → 4</text><path d="M600,1011 L600,1043" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="400.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700.0" y="1058" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">4</tspan></text><text x="600" y="1157" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Output: d = 4</text><text x="600" y="1212" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">Linear transformations combine components within one token.</text><path d="M48,1280 L1152,1280" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1321" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Dimensions and intermediate values are illustrative. Linear weights and biases are omitted.</text>
