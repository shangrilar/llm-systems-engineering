<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1318" viewBox="0 0 1200 1318" role="img" aria-labelledby="title desc"><title id="title">Propose several tokens and verify with the generation policy</title><desc id="desc">Draft proposes x1,x2,x3,x4. Target verification accepts x1 and x2, rejects x3 and draws correction token z. Discard x4; continue from x1,x2,z. Check draft suitability and state after target updates.</desc><metadata>{&quot;id&quot;:&quot;11-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Fast Inference from Transformers via Speculative Decoding&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2211.17192&quot;},{&quot;label&quot;:&quot;NeMo RL speculative decoding&quot;,&quot;url&quot;:&quot;https://research.nvidia.com/labs/nemotron/rl-speculative-decoding/&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Propose several tokens and verify with the generation policy</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">One iteration where two of four proposed tokens are accepted. MTP is one possible way to</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">propose candidates.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Propose → verify → commit</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="102" width="488" height="130" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="133" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Draft · generate candidates</text><text x="32" y="173" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Examples: small model / EAGLE / MTP</text></g><rect x="28" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="77.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₁</text><rect x="151" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="200.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₂</text><rect x="274" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="323.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₃</text><rect x="397" y="269" width="99" height="48" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="446.5" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₄</text><path d="M260 323 L260 376" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="386" width="488" height="146" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="417" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Target · score candidate positions</text><text x="32" y="447.8" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">together</text><text x="32" y="488" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Verify with the generation policy, not a</text><text x="32" y="516" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">reward scorer</text></g><path d="M260 538 L260 591" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="28" y="601" width="99" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="77.5" y="633" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₁ ✓</text><rect x="151" y="601" width="99" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="200.5" y="633" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₂ ✓</text><rect x="274" y="601" width="99" height="48" rx="8" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/><text x="323.5" y="633" fill="#B34242" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₃ ×</text><rect x="397" y="601" width="99" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="446.5" y="633" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="87">x₄ ×</text><text x="16" y="699" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">Accept first two · reject third · discard</text><text x="16" y="729.8" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">the rest</text><g data-container="true"><rect x="16" y="789" width="488" height="124" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="820" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Draw correction token z at rejection</text><text x="32" y="860" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Use the correction distribution of the</text><text x="32" y="888" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">verifier</text></g><text x="16" y="971" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Next context: … x₁ x₂ z → next iteration</text></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Policy updates and draft lifetime</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="102" width="488" height="132" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="133" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Target v10 + draft</text><text x="32" y="173" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Use a consistent target version within an</text><text x="32" y="201" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">iteration</text></g><path d="M260 240 L260 300" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="310" width="488" height="111" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="341" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Update target weights → v11</text></g><path d="M260 427 L260 486" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="496" width="488" height="151" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="527" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Check draft fit and internal state</text><text x="32" y="567" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Check candidate quality, valid KV/features</text><text x="32" y="595" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">and update handling</text></g><g data-container="true"><rect x="16" y="704" width="488" height="244" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="735" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Ask two separate questions</text><text x="32" y="775" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Correctness: are verification and correction</text><text x="32" y="803" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">valid? Speed: does reduced sequential time</text><text x="32" y="831" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">outweigh added overhead?</text></g></g></svg>