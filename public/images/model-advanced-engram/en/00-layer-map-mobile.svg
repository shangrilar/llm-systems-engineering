t-weight="700" text-anchor="start" data-max-width="328">attention at selected</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">layers</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Main paper experiment: layers 2 and 15</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">of 30 · One-based numbering</text><path d="M16,211 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 235) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Map of 30 layers</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="140" y="110" width="350" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="315" y="153" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="338">Input embedding</text><path d="M315 190 L315 225" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="140" y="235" width="350" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="315" y="278" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="338">Block 1</text><path d="M315 315 L315 380" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="140" y="390" width="350" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="315" y="433" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="338">Block 2</text><rect x="5" y="330" width="115" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="62.5" y="368" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="103">Engram</text><path d="