troke-width="1"/><text x="785" y="796" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="835" y="755" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="885" y="796" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">3.467</text><rect x="935" y="755" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="985" y="796" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">-0.64</text><rect x="735" y="819" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="785" y="860" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">2.439</text><rect x="835" y="819" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="885" y="860" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="935" y="819" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="985" y="860" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">-1.497</text><rect x="735" y="883" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="785" y="924" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">0.866</text><rect x="835" y="883" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="885" y="924" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">-0.43</text><rect x="935" y="883" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="985" y="924" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="735" y="883" width="300" height="64" rx="0" fill="none" stroke="#2470BB" stroke-width="3"/><text x="785" y="738" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="885" y="738" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="985" y="738" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><text x="718" y="796" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="718" y="860" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="718" y="924" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="600" y="813" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">점수 비교</text><text x="600" y="884" fill="#287D78" font-size="40" font-weight="600" text-anchor="middle">≠</text><text x="600" y="1000" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">행 = Query 토큰 · 열 = Key 토큰 · 토큰 3의 행 강조</text><text x="600" y="1067" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">자기 자신과의 점수는 같고, 다른 위치와의 점수는 달라집니다.</text><text x="600" y="1111" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">같은 위치의 Q·K에는 동일한 회전이 적용되기 때문입니다.</text><path d="M600,1140 L600,1178" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="80" y="1196" width="1040" height="76" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1228" fill="#657789" font-size="27" font-weight="600" text-anchor="middle">Causal mask → Softmax → PV</text><text x="600" y="1256" fill="#657789" font-size="21" font-weight="400" text-anchor="middle">달라진 점수로 Value를 반영하는 비중을 계산</text><rect x="48" y="1330" width="1104" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1374" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">이제 점수에는 Q·K의 내용과 상대 위치가 함께 반영됩니다.</text></g></g><path d="M48,1451 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1489" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">한 칸당 회전각 30° / 10°는 설명용입니다. 소수는 셋째 자리까지 반올림했습니다.</text></svg>