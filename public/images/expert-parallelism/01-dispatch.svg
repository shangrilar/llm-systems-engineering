<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="881" viewBox="0 0 1200 881" role="img" aria-labelledby="title desc"><title id="title">EP: 토큰을 Expert에게 보내고 결과 돌려받기</title><desc id="desc">GPU 0의 t1을 GPU 1의 E2로 보내고 GPU 1의 t2를 GPU 0의 E1로 보낸 뒤 결과를 원래 GPU로 돌려보냅니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="881" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">EP: 토큰을 Expert에게 보내고 결과 돌려받기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">E0–E3는 서로 다른 Expert입니다. 먼저 토큰당 하나를 고르는 top-1을 봅니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="199" width="266" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="236.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">순서</text><rect x="320" y="199" width="410" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="236.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0 · E0, E1</text><rect x="736" y="199" width="410" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="236.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1 · E2, E3</text><rect x="48" y="265" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="299.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">토큰의 출발</text><rect x="320" y="265" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="299.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0 → E0; t1 → E2</text><rect x="736" y="265" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="299.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t2 → E1; t3 → E2</text><rect x="48" y="393" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="427.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Expert로 전달</text><rect x="320" y="393" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="427.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E0: t0</text><text x="334" y="457.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E1: t2</text><rect x="736" y="393" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="427.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E2: t1, t3</text><text x="750" y="457.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E3: —</text><rect x="48" y="521" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Expert 계산</text><rect x="320" y="521" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E0(t0), E1(t2)</text><rect x="736" y="521" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E2(t1), E2(t3)</text><rect x="48" y="649" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="683.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">출발지로 결과 회수</text><rect x="320" y="649" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="683.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">y(t0), y(t1)</text><rect x="736" y="649" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="683.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">y(t2), y(t3)</text><text x="48" y="825.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">이동하는 것은 토큰의 벡터와 결과입니다. Expert 가중치는 맡은 GPU에 둡니다.</text></svg>