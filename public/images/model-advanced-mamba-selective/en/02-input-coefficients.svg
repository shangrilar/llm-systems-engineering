" text-anchor="start" data-max-width="448">All components &lt; 0</text></g><g data-container="true"><rect x="20" y="255" width="220" height="95" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="36" y="286" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">A, Δₜ</text><text x="36" y="326" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">Discretize</text></g><path d="M250 303 L285 303" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="300" y="255" width="200" height="95" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="316" y="286" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">Āₜ</text><text x="316" y="326" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">Retain old state</text></g><g data-container="true"><rect x="20" y="425" width="220" height="95" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="456" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Δₜ, Bₜ</text><text x="36" y="496" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">Discretize</text></g><path d="M250 473 L285 473" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="300" y="425" width="200" height="95" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="456" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">B̄ₜ</text><text x="316" y="496" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">Write this input</text></g><g data-container="true"><rect x="20" y="595" width="220" height="95" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="36" y="626" fill="#79