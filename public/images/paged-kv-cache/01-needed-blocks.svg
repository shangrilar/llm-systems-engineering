22" font-weight="400" text-anchor="middle">C 배정 · 아직 계산 전</text><text x="968" y="799.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">남은 블록 2개</text><text x="48" y="868.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">1블록 = KV 4칸 · 채운 칸은 이미 계산된 KV · 빈칸은 아직 KV 없음</text></svg>