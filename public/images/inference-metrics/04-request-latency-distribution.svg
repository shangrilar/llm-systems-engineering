<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">일부 요청이 더 오래 기다립니다</title><desc id="desc">정렬한20개요청의TTFT막대.10번째190ms가p50,19번째600ms가p95,20번째1000ms.순위올림방식을사용한예시.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1000" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">일부 요청이 더 오래 기다립니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">백분위수는 정렬한 지연 값에서 어느 위치를 보는지 나타냅니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">20개 요청의 TTFT · 짧은 순서로 정렬</text><path d="M100,650.0 L1130,650.0" stroke="#DCE4EC" stroke-width="2" fill="none"/><text x="83" y="657.0" fill="#526577" font-size="20" font-weight="400" text-anchor="end">0</text><path d="M100,470.0 L1130,470.0" stroke="#DCE4EC" stroke-width="2" fill="none"/><text x="83" y="477.0" fill="#526577" font-size="20" font-weight="400" text-anchor="end">500</text><path d="M100,290.0 L1130,290.0" stroke="#DCE4EC" stroke-width="2" fill="none"/><text x="83" y="297.0" fill="#526577" font-size="20" font-weight="400" text-anchor="end">1000</text><text x="48" y="253.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">ms</text><rect x="120" y="614.0" width="32" height="36.0" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="136" y="681.0" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">1</text><rect x="169" y="610.4" width="32" height="39.6" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-wi