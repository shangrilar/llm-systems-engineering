<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1089" viewBox="0 0 1200 1089" role="img" aria-labelledby="title desc"><title id="title">새 출력에 Scalar를 곱해 원래 Branch에 더합니다</title><desc id="desc">읽기 결과 x에서 F가 예시 출력 y=[.5,-.25]를 만든다. 별도 controller는 정규화한 두 branch를 모두 보고 s1=1.2,s2=.4를 낸다. 첫 branch는 원래 [2,2]에 [.6,-.3]을 더해 [2.6,1.7]이 되고 둘째는 원래 [4,-4]에 [.2,-.1]을 더해 [4.2,-4.1]이 된다.</desc><metadata>{&quot;id&quot;:&quot;ma-15-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Qwen3.8-Flash-Next §2.2, equations 33–34&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2608.30320v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3 · 원래 Branch에 쓰기</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">새 출력에 Scalar를 곱해 원래 Branch에 더합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">읽기는 성분별 gate · 쓰기는 Branch별 scalar · 앞 그림과 같은 입력</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 새 출력과 쓰기 계수</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="15" y="120" width="230" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="31" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">읽은 입력 x</text><text x="31" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">[0.6, −0.2]</text></g><g data-container="true"><rect x="280" y="120" width="225" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="296" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">R̂₁, R̂₂</text><text x="296" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">모든 정규화 값</text></g><path d="M130 235 L130 280" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M393 235 L393 280" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="15" y="292" width="230" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="31" y="323" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">F</text><text x="31" y="363" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">출력 y를 가정</text></g><g data-container="true"><rect x="280" y="292" width="225" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="296" y="323" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">쓰기 계수</text><text x="296" y="363" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">2 × sigmoid</text></g><path d="M130 407 L130 450" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M393 407 L393 450" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><rect x="20" y="462" width="225" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="132.5" y="502.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="213">y = [0.5, −0.25]</text><rect x="280" y="462" width="225" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="392.5" y="502.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="213">s₁ = 1.2, s₂ = 0.4</text><text x="260" y="606" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle" data-max-width="490">읽기: 성분마다 다른 gate</text><text x="260" y="653" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle" data-max-width="490">쓰기: stream마다 scalar 하나</text><text x="260" y="766" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle" data-max-width="490">0 &lt; sᵢ &lt; 2</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 같은 y를 원본에 더하기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="150" y="112" width="220" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="150" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">y = [0.5, −0.25]</text><path d="M260 182 L260 225" stroke="#B55B22" stroke-width="2" fill="none"/><path d="M130 225 L390 225" stroke="#B55B22" stroke-width="2" fill="none"/><path d="M130 225 L130 269" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="25" y="281" width="210" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="130" y="318" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">× s₁ = 1.2</text><path d="M130 349 L130 390" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="25" y="402" width="210" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="130" y="439" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">[0.6, −0.3]</text><path d="M130 470 L130 510" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="25" y="522" width="210" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="130" y="559" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">+ [2, 2] (R₁)</text><rect x="25" y="622" width="210" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="130" y="660" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">[2.6, 1.7]</text><path d="M130 592 L130 610" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="130" y="729" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="250">R₁′ = R₁ + s₁ y</text><path d="M390 225 L390 269" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="285" y="281" width="210" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="390" y="318" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">× s₂ = 0.4</text><path d="M390 349 L390 390" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="285" y="402" width="210" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="390" y="439" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">[0.2, −0.1]</text><path d="M390 470 L390 510" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="285" y="522" width="210" height="58" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="390" y="559" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">+ [4, −4] (R₂)</text><rect x="285" y="622" width="210" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="390" y="660" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">[4.2, −4.1]</text><path d="M390 592 L390 610" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="390" y="729" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="250">R₂′ = R₂ + s₂ y</text><text x="260" y="799" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="500">정규화 전 원본 R에 더합니다</text></g></svg>