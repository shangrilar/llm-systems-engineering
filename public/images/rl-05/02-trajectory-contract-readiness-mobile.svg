<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1090" viewBox="0 0 360 1090" role="img" aria-labelledby="title desc"><title id="title">추론에서 버퍼로, 경험에 담아 보내는 정보</title><desc id="desc">추론 엔진에서 data buffer로 trajectory를 전달한다. 경험 기록에는 입력과 생성 토큰, 생성 로그확률, 손실 마스크, 보상, 정책 버전, 작업과 그룹 ID가 연결된다. 추론뿐 아니라 환경 기록, 평가와 실행 관리에서 정보를 모은다.</desc><metadata>{&quot;id&quot;:&quot;5-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0 architecture&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/developer/architecture.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">추론에서 버퍼로, 경험에 담아</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">보내는 정보</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">그림 1의 trajectory 전달 경로를 펼쳐</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">봅니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><g data-container="true"><rect x="8" y="12" width="192" height="116" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="24" y="43" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="160">추론 엔진</text><text x="24" y="83" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="160">SGLang 등</text></g><g data-container="true"><rect x="320" y="12" width="192" height="116" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="336" y="43" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="160">경험 버퍼</text></g><path d="M212 70 L308 70" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="260" y="164" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="230">trajectory</text><path d="M260 178 V204" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5"/><rect x="8" y="220" width="504" height="1120" rx="14" fill="#FFFFFF" stroke="#7954A3" stroke-width="1.5"/><text x="30" y="260" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="460">경험 기록에 연결되는 정보</text><g data-container="true"><rect x="30" y="302" width="460" height="146" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="333" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">입력·생성 토큰 ID</text><text x="46" y="373" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">추론·환경 기록 → 실제 문맥과 행동</text></g><g data-container="true"><rect x="30" y="468" width="460" height="146" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="499" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">생성 로그확률</text><text x="46" y="539" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">추론 엔진 → 생성 당시의 선택 확률</text></g><g data-container="true"><rect x="30" y="634" width="460" height="146" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="665" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">손실 마스크</text><text x="46" y="705" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">대화·환경 기록 → 학습할 토큰 위치</text></g><g data-container="true"><rect x="30" y="800" width="460" height="146" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="831" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">보상</text><text x="46" y="871" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">평가·검증 → 과제 수행 점수</text></g><g data-container="true"><rect x="30" y="966" width="460" height="146" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="997" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">정책 버전</text><text x="46" y="1037" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">실행 관리·추론 → 경험을 만든 가중치</text></g><g data-container="true"><rect x="30" y="1132" width="460" height="146" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="1163" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">작업 / 그룹 ID</text><text x="46" y="1203" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">실행 관리 → 과제와 비교 그룹</text></g></g></svg>