="#DCE4EC" stroke-width="1.5"/><text x="312" y="862" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">RoPE</text><text x="312" y="889" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">K → K′</text><path d="M136,916 V930 H183 V989" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><path d="M312,916 V930 H218 V989" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><text x="340" y="985" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Core Attention</text><rect x="83" y="1002" width="318" height="80" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="1032" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">Q′K′ᵀ / √dₕ</text><text x="242" y="1059" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle">3 × 3</text><path d="M242,1094 L242,1111" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="83" y="1124" width="318" height="80" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="1154" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Mask → Softmax</text><text x="242" y="1181" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle">P (3 × 3)</text><path d="M242,1216 V1236 H312 V1255" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><rect x="177" y="1268" width="270" height="80" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="1298" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">PV</text><text x="312" y="1325" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle">O₁ (3 × 4)</text><path d="M488,798 V1308 H459" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-slate)"/><rect x="624" y="650" width="528" height="740" rx="14" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y