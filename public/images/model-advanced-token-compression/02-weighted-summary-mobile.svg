<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1843" viewBox="0 0 360 1843" role="img" aria-labelledby="title desc"><title id="title">여러 위치의 정보를 성분별로 합칩니다</title><desc id="desc">입력 H=[[1,0],[0,1]]을 내용 행렬 Wᵤ=[[2,0],[0,4]]와 점수 행렬 Wₛ=[[ln3,0],[0,ln3]]로 각각 투영한다. 내용 U=[[2,0],[0,4]], 점수 S=[[ln3,0],[0,ln3]]을 얻고 점수의 각 열에 위치 방향 softmax를 적용해 가중치 A=[[.75,.25],[.25,.75]]를 얻는다. U와 A를 성분별로 곱한 뒤 위치 방향으로 합하면 요약 c₀=[1.5,3]이다. 모든 숫자와 투영 행렬은 교육용 예시다.</desc><metadata>{&quot;id&quot;:&quot;ma-06-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 §2.3, component-wise compression weights and row-axis softmax&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2606.19348v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10