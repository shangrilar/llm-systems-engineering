<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc"><title id="title">여러 GPU를 사용하는 세 가지 목적</title><desc id="desc">첫 패널은 모델 A와 B를 두 GPU에 분할 저장한다. 둘째는 같은 요청의 계산 A와 B를 동시에 처리하고 통신과 취합을 거쳐 완료한다. 셋째는 각 GPU에 같은 전체 모델을 복제하고 요청 A와 B를 따로 처리한다. 목적은 겹칠 수 있다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1400" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 11 · 그림 2</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">여러 GPU를 사용하는 세 가지 목적</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">모델을 담는 용량, 한 요청의 완료 시간, 전체 요청 처리량을 구분합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="208" width="1104" height="328" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="251" fill="#2470BB" font-size="19" font-weight="600" text-anchor="start">01</text><text x="119" y="251" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">더 큰 모델 실행</text><text x="1124" y="251" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">용량 확보</text><rect x="48" y="562" width="1104" height="375" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="605" fill="#2470BB" font-size="19" font-weight="600" text-anchor="start">02</text><text x="119" y="605" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">한 요청을 더 빠르게</text><text x="1124" y="605" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">응답 시간 단축</text><rect x="48" y="963" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="1006" fill="#2470BB" font-size="19" font-weight="600" text-anchor="start">03</text><text x="119" y="1006" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">더 많은 요청 처리</text><text x="1124" y="1006" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">처리량 증가</text><text x="76" y="323" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">한 GPU에는</text><text x="76" y="361" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">모델 전체가</text><text x="76" y="399" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">들어가지 않음</text><rect x="423" y="289" width="329" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="445" y="326" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="445" y="348" width="285" height="65" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="587.5" y="388.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">모델 일부 A</text><rect x="795" y="289" width="329" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="817" y="326" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="817" y="348" width="285" height="65" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="959.5" y="388.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">모델 일부 B</text><path d="M439,457 V470 H1108 V457" fill="none" stroke="#B55B22" stroke-width="2"/><text x="773" y="505" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">두 GPU에 모델을 나누어 저장</text><text x="76" y="684" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">한 요청의 계산을</text><text x="76" y="722" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">나누어 수행하고</text><text x="76" y="760" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">결과를 연결</text><rect x="423" y="641" width="329" height="120" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="445" y="676" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="445" y="696" width="285" height="45" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="587.5" y="726.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">계산 A</text><rect x="795" y="641" width="329" height="120" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="817" y="676" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="817" y="696" width="285" height="45" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="959.5" y="726.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">계산 B</text><path d="M587,766 V786 H773 V804" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><path d="M959,766 V786 H773" fill="none" stroke="#7954A3" stroke-width="2"/><rect x="581" y="809" width="385" height="44" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="773.5" y="839.0" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">통신·결과 취합 → 완료</text><text x="773" y="899" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">통신을 포함한 완료 시간이 줄어드는 경우</text><text x="76" y="1085" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">같은 모델을</text><text x="76" y="1123" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">각 GPU에 복제하고</text><text x="76" y="1161" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">서로 다른 요청 처리</text><rect x="423" y="1042" width="329" height="141" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="445" y="1078" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="445" y="1097" width="285" height="59" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="587.5" y="1134.5" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">같은 모델 전체</text><path d="M588,1189 L588,1210" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><text x="588" y="1250" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">요청 A 완료</text><rect x="795" y="1042" width="329" height="141" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="817" y="1078" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="817" y="1097" width="285" height="59" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="959.5" y="1134.5" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">같은 모델 전체</text><path d="M960,1189 L960,1210" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><text x="960" y="1250" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">요청 B 완료</text><text x="600" y="1354" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">세 목적은 함께 달성할 수도 있습니다. 목적에 따라 배치와 실행을 정합니다.</text></svg>