<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1124" viewBox="0 0 1200 1124" role="img" aria-labelledby="title desc"><title id="title">미사용 예약 공간이 새 요청을 막습니다</title><desc id="desc">KV 용량 24개 중 B가 20개를 예약했지만 현재 실제 KV는 6개뿐입니다. 나머지 14개는 B에 예약되어 다른 요청에 줄 수 없고, 배정 가능한 빈 공간은 4개입니다. C는 Prefill을 위해 6개가 필요해 대기합니다. B의 다음 KV 7개와 C의 KV 6개는 합계 13개이지만 현재 예약 방식이 C의 진입을 막습니다.</desc><metadata>{&quot;id&quot;:&quot;04-reserved-memory&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><pattern id="bs-reserved" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#EDF7F5" /><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#8DBCB8" stroke-width="1.5" /></pattern></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">미사용 예약 공간이 새 요청을 막습니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">앞선 그림과 같은 B·C, 같은 KV 저장 용량 24개입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="219" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">B에 20개 위치를 미리 예약한 경우</text><text x="48" y="261" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">현재 실제 KV는 6개입니다.</text><text x="220" y="316" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">실제 KV 6</text><text x="640" y="316" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">아직 쓰지 않은 예약 14</text><text x="1018" y="316" fill="#5C6C7C" font-size="23" font-weight="700" text-anchor="middle">빈 공간 4</text><rect x="96" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="180" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="222" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="264" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="306" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="348" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="390" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="432" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="474" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="516" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="558" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="600" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="642" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="684" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="726" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="768" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="810" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="852" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="894" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="936" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="978" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1020" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1062" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,419 v9 h836 v-9" stroke="#287D78" stroke-width="1.5" fill="none"/><text x="514" y="461" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">B에 배정: 20</text><path d="M936,419 v9 h164 v-9" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="1018" y="461" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">배정 가능: 4</text><text x="48" y="526" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">빗금 영역은 비어 있어도 C에 배정할 수 없습니다.</text><path d="M48,577 H1152" stroke="#DCE4EC"/><text x="48" y="633" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">새 요청 C가 필요한 공간</text><text x="671" y="633" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">실제로 배정할 수 있는 공간</text><rect x="48" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="100" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="152" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="204" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="256" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="308" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="671" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="723" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="775" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="827" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><text x="48" y="765" fill="#7954A3" font-size="23" font-weight="400" text-anchor="start">입력 6개 → KV 공간 6개</text><text x="671" y="765" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">빈 공간 4개 &lt; 필요한 6개</text><path d="M975,693 L1044,693" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="1059" y="661" width="93" height="63" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="1105" y="703" fill="#7954A3" font-size="29" font-weight="700" text-anchor="middle">C</text><text x="1105" y="772" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">대기</text><path d="M48,824 H1152" stroke="#DCE4EC"/><text x="48" y="878" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">필요한 실제 KV는 13개지만 C는 들어오지 못합니다.</text><text x="48" y="924" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">다음 실행의 B 7개 + C 6개 / 전체 용량 24개</text><text x="48" y="983" fill="#B55B22" font-size="28" font-weight="700" text-anchor="start">KV 공간을 필요한 만큼 늘려 배정할 수 있다면?</text></g></g><path d="M48,1046 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1084" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">실제 KV 요구량이 용량보다 작아도, 예약 공간 때문에 새 요청이 기다립니다.</text></svg>