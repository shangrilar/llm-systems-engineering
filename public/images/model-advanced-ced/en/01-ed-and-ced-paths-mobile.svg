<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1712" viewBox="0 0 360 1712" role="img" aria-labelledby="title desc"><title id="title">Does the next input token also pass through the encoder?</title><desc id="desc">ED reuses fixed encoder outputs for x0 x1 x2 while y0 passes only through the decoder to select y1. CED sends current x4 through its causal encoder, creates e4 and global KV, then selects x5 through the decoder.</desc><metadata>{&quot;id&quot;:&quot;ced-01&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;T5 §3.2&quot;,&quot;url&quot;:&quot;https://jmlr.org/papers/volume21/20-074/20-074.pdf&quot;},{&quot;label&quot;:&quot;DeepSeek CED §2.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 1 · Token paths in ED and CED</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Does the next input token</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">also pass through the</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">encoder?</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">T5-style ED and DeepSeek CED · Blue:</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">current computation · Teal: reusable</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">representations/KV</text><path d="M16,234.79999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 258.79999999999995) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Traditional ED · Source and target</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="30" y="115" width="125" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="92.5" y="150.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="113">x0</text><rect x="195" y="115" width="125" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="257.5" y="150.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="113">x1</text><rect x="360" y="115" width="125" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="422.5" y="150.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="113">x2</text><path d="M92 180 L92 195" stroke="#287D78" stroke-width="2" fill="none"/><path d="M257 180 L257 195" stroke="#287D78" stroke-width="2" fill="none"/><path d="M422 180 L422 195" stroke="#287D78" stroke-width="2" fill="none"/><path d="M92 195 L422 195" stroke="#287D78" stroke-width="2" fill="none"/><path d="M257 195 L257 220" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="90" y="230" width="340" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="106" y="261" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="308">Encoder · Bidirectional</text><text x="106" y="301" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">Encode source x0, x1, x2</text></g><path d="M260 350 L260 395" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="90" y="405" width="340" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="106" y="436" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="308">Fixed E → Cross KV</text><text x="106" y="476" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">No encoder rerun during</text><text x="106" y="504" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">generation</text></g><path d="M440 465 H490 V725 H440" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="110" y="585" width="300" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="623" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">y0 · Current input</text><path d="M260 655 L260 685" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="90" y="695" width="340" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="106" y="726" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="308">Decoder</text><text x="106" y="766" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">Self + Cross Attention</text></g><path d="M260 835 L260 875" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="110" y="885" width="300" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="923" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">y1 · Next token selected</text><g data-container="true"><rect x="20" y="985" width="480" height="105" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1016" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Only the target grows in decoder</text><text x="36" y="1056" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Source: 3 tokens; target length can differ</text></g></g><g transform="translate(16 986.9538461538461) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. CED · One continuing sequence</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="10" y="115" width="92" height="55" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="56" y="150.5" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="80">x0</text><rect x="112" y="115" width="92" height="55" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="158" y="150.5" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="80">x1</text><rect x="214" y="115" width="92" height="55" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="260" y="150.5" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="80">x2</text><rect x="316" y="115" width="92" height="55" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="362" y="150.5" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="80">x3</text><rect x="418" y="115" width="92" height="55" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="464" y="150.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="80">x4</text><text x="260" y="218" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="500">x0…x3 cached · x4 is current</text><path d="M464 180 V255 H205 V285" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="35" y="295" width="340" height="135" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="51" y="326" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="308">Causal encoder</text><text x="51" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">The new position traverses</text><text x="51" y="394" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">early layers</text></g><path d="M205 440 L205 480" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="90" y="490" width="230" height="60" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="205" y="528" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">e4</text><path d="M330 520 H410 V565" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="310" y="575" width="200" height="155" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="326" y="606" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">Global KV</text><text x="326" y="646" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">Prepare entries</text><text x="326" y="674" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">from e4</text></g><path d="M205 560 L205 750" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="35" y="760" width="340" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="51" y="791" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="308">Decoder</text><text x="51" y="831" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="308">Global + Local Attention</text></g><path d="M410 740 V822 H385" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M205 895 L205 925" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="55" y="935" width="300" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="205" y="973" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">x5 · Next token selected</text><text x="260" y="1060" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="500">x5 traverses both halves on the next step</text></g></svg>