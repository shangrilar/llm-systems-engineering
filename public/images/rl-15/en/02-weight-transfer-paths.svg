<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1511" viewBox="0 0 1200 1511" role="img" aria-labelledby="title desc"><title id="title">Choose a transfer path for the deployment</title><desc id="desc">Broadcast distributes via NCCL then loads target shards. P2P stages weights through a CPU model and pinned host buffers before RDMA writes into registered target GPU weight memory. Disk-delta publishes byte changes against a matching checkpoint base, patches a local checkpoint and reloads it to GPUs.</desc><metadata>{&quot;id&quot;:&quot;15-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SGLang receiver, Miles v0.1.0 release pin&quot;,&quot;url&quot;:&quot;https://github.com/sgl-project/sglang/blob/cb05a44f35a7c9e27e46d74112cc841ca674ef43/python/sglang/srt/model_loader/remote_instance_weight_loader_utils.py&quot;},{&quot;label&quot;:&quot;Miles P2P v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/p2p-weight-transfer.md&quot;},{&quot;label&quot;:&quot;Miles disk-delta v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/miles/backends/megatron_utils/update_weight/update_weight_from_distributed/delta.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Choose a transfer path for the deployment</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Three simplified paths in Miles v0.1.0. Arrows show movement between memory and storage; their</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">length and width do not encode speed.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(0.9857142857142858)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1120">Three weight-transfer routes</text><path d="M0 68 L1120 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g transform="translate(0 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">Broadcast</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">Default on a shared GPU</text><text x="16" y="130.4" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">fabric</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Training GPUs</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">The same new weights</text></g><path d="M172 217 L172 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="312" height="164" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="297" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Prepare tensors to send</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Gather and convert;</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">distribute from source</text><text x="32" y="393" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">ranks</text></g><g data-container="true"><rect x="16" y="492" width="312" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">NCCL broadcast</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Collective communication</text><text x="32" y="591" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">group</text></g><g data-container="true"><rect x="16" y="681" width="312" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Load on each target</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Apply the shard needed by</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">each inference rank</text></g><path d="M172 443 L172 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M172 632 L172 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M172 855 L172 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Inference GPUs</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Consistent new weights</text></g></g></g><g transform="translate(388 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">P2P</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">Parallel senders across</text><text x="16" y="130.4" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">nodes</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Training GPUs</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">The same new weights</text></g><path d="M172 217 L172 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="312" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Sender CPU memory</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">CPU model layout conversion</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">→ pinned host buffer</text></g><g data-container="true"><rect x="16" y="492" width="312" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">RDMA write</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Required shards per target</text><text x="32" y="591" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">rank</text></g><g data-container="true"><rect x="16" y="681" width="312" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Registered GPU</text><text x="32" y="742.8" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">addresses</text><text x="32" y="783" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Write directly into target</text><text x="32" y="811" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">weights</text></g><path d="M172 443 L172 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M172 632 L172 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M172 855 L172 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Inference GPUs</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Consistent new weights</text></g></g></g><g transform="translate(776 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">Disk-delta</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">Shared storage without a</text><text x="16" y="130.4" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="312">direct fabric</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Training GPUs</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">The same new weights</text></g><path d="M172 217 L172 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="312" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Previous CPU snapshot</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Encode byte changes</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">against the same base</text></g><g data-container="true"><rect x="16" y="492" width="312" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Shared filesystem</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">base b → delta b+1</text></g><g data-container="true"><rect x="16" y="681" width="312" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Patch a local checkpoint</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Check base, version and</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">checksum → reload to GPU</text></g><path d="M172 443 L172 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M172 632 L172 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M172 855 L172 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="312" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Inference GPUs</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Consistent new weights</text></g></g></g></g></svg>