<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="928" viewBox="0 0 1200 928" role="img" aria-labelledby="title desc"><title id="title">토큰당 KV 캐시: SWA를 쓰는 모델</title><desc id="desc">대표 그림에서 SWA를 쓰는 MiMo-V2.6-Pro와 DeepSeek V4.1-Flash를 강조했다. SWA 층의 KV는 39.3 MB와 2.7 MB에서 멈추고, 토큰당 증가량은 MiMo의 global 10층과 DeepSeek의 global KV 저장층 4개에서 나온다.</desc><metadata>{&quot;id&quot;:&quot;open-models-kv-cache-02-guide-swa&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Kimi K3 report · §2.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2607.24653&quot;},{&quot;label&quot;:&quot;Qwen3.8-Flash-Next report · §2.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2608.30320&quot;},{&quot;label&quot;:&quot;MiMo-V2.6 technical report&quot;,&quot;url&quot;:&quot;https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Pro-RL/blob/main/MiMo_V2_6_technical_report.pdf&quot;},{&quot;label&quot;:&quot;GLM-5.3 config&quot;,&quot;url&quot;:&quot;https://huggingface.co/zai-org/GLM-5.3&quot;},{&quot;label&quot;:&quot;Hy4-preview config&quot;,&quot;url&quot;:&quot;https://huggingface.co/tencent/Hy4-preview&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3, §2.4.4&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.19969&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" 