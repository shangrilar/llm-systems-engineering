<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc">
<title id="title">전체 구조에 마지막 RMSNorm 더하기</title><desc id="desc">지난 편과 같은 두 패널이다. 왼쪽은 Embedding, Decoder block × N, RMSNorm, LM Head 순서다. 오른쪽은 블록 1, 2, 생략, N을 펼쳐 보여주고 마지막 블록 뒤에 RMSNorm과 LM Head가 이어진다. 최종 RMSNorm 전후는 T × d이고 LM Head 출력은 T × V다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1140" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">전체 구조에 마지막 RMSNorm 더하기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">지난 편의 전체 구조에, 마지막 디코더 블록과 LM Head 사이의 RMSNorm을 표시합니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="195" width="534" height="770" rx="14" fill="#FAFCFE" stroke="#DCE4EC" stroke-width="1.5"/><rect x="618" y="195" width="534" height="770" rx="14" fill="#FAFCFE" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="236" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">압축해서 보기</text><text x="885" y="236" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">펼쳐서 보기</text><rect x="165" y="265" width="300" height="64" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="306.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Embedding</text><rect x="165" y="705" width="300" height="68" rx="14" fill="#EDF7F5" stroke="#9FC8C1" stroke-width="1.5"/><text x="315.0" y="734" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="315.0" y="758" fill="#287D78" font-size="19" font-weight="400" text-anchor="middle">토큰별 d개 성분</text><rect x="165" y="824" width="300" height="64" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="865.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">LM Head</text><path d="M315,785 L315,812" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="347" y="800" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">T × d</text><text x="315" y="928" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">T × V</text><rect x="735" y="265" width="300" height="64" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="306.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Embedding</text><rect x="735" y="705" width="300" height="68" rx="14" fill="#EDF7F5" stroke="#9FC8C1" stroke-width="1.5"/><text x="885.0" y="734" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="885.0" y="758" fill="#287D78" font-size="19" font-weight="400" text-anchor="middle">토큰별 d개 성분</text><rect x="735" y="824" width="300" height="64" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="865.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">LM Head</text><path d="M885,785 L885,812" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="917" y="800" fill="#287D78" font-size="21" font-weight="400" text-anchor="start">T × d</text><text x="885" y="928" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">T × V</text><rect x="165" y="424" width="300" height="105" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="476.5" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block</text><text x="315" y="507.5" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">× N</text><path d="M315,341 L315,410" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M315,542 L315,690" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="347" y="674" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">T × d</text><rect x="735" y="360" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="401.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block 1</text><path d="M885,337 L885,348" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="735" y="465" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="506.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block 2</text><path d="M885,432 L885,453" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="885" y="565" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">⋮</text><rect x="735" y="594" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="635.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block N</text><path d="M885,669 L885,690" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="917" y="690" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">T × d</text><path d="M1080,360 H1090 V658 H1080" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="1114" y="520" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">N</text><text x="600" y="1017" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">마지막 디코더 블록 → RMSNorm → LM Head</text><path d="M48,1060 L1152,1060" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1101" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">RMSNorm은 T × d를 유지하고, LM Head는 T × V로 바꿉니다. 블록 내부의 RMSNorm은 생략했습니다.</text>
</svg>