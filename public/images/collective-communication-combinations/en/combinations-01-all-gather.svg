<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1023" fill="white" />
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Combining and Extending Collectives · Figure 1</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">All-Gather: collect and share</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Every GPU receives the full array formed by concatenating the input chunks.</text><path d="M48,169 H1152" stroke="#DCE4EC" /><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Before communication · input buffers</text><rect x="48" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5" /><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="72" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="124.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="236.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M180,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="328" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5" /><text x="364" y="267" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="293" width="104" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="404.0" y="324" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">10</text><rect x="464" y="293" width="104" height="44" rx