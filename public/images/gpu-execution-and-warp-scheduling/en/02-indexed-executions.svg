<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Separate Executions, Different Indices</title><desc id="desc">The common computation procedure is expanded into three execution flows with i=0, 1, and 2. Each reads A[i] and B[i], adds them, and stores the result in C[i]. The first stores 1+10=11 in C[0], the second stores 2+20=22 in C[1], and the third stores 3+30=33 in C[2]. The flows are labeled Thread 0, 1, and 2.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1140" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Separate Executions, Different Indices</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">The procedure stays the same; i determines which inputs to read and where to store.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="252" y="214" width="696" height="76" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="600.0" y="260.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Common procedure: add A[i] and B[i], store in C[i]</text><path d="M600,302 V330 H224 M600,330 H976" fill="none" stroke="#2470BB" stroke-width="2" /><path d="M224,331 L224,353" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="48" y="368" width="352" height="656" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5" /><text x="224" y="416" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">i = 0</text><rect x="72" y="454" width="304" height="121" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="224" y="499" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read 1 from A[0]</text><text x="224" y="546" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read 10 from B[0]</text><path d="M224,587 L224,622" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="72" y="637" width="304" height="76" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="224.0" y="683.0" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">1 + 10 = 11</text><path d="M224,726 L224,768" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="72" y="784" width="304" height="93" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="224.0" y="838.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Store 11 in C[0]</text><text x="224" y="948" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">Thread 0</text><text x="224" y="990" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">One individual execution flow</text><path d="M600,331 L600,353" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="424" y="368" width="352" height="656" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5" /><text x="600" y="416" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">i = 1</text><rect x="448" y="454" width="304" height="121" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="499" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read 2 from A[1]</text><text x="600" y="546" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read 20 from B[1]</text><path d="M600,587 L600,622" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="448" y="637" width="304" height="76" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="600.0" y="683.0" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">2 + 20 = 22</text><path d="M600,726 L600,768" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="448" y="784" width="304" height="93" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="600.0" y="838.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Store 22 in C[1]</text><text x="600" y="948" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">Thread 1</text><text x="600" y="990" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">One individual execution flow</text><path d="M976,331 L976,353" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="800" y="368" width="352" height="656" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5" /><text x="976" y="416" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">i = 2</text><rect x="824" y="454" width="304" height="121" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="976" y="499" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read 3 from A[2]</text><text x="976" y="546" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Read 30 from B[2]</text><path d="M976,587 L976,622" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="824" y="637" width="304" height="76" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="976.0" y="683.0" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">3 + 30 = 33</text><path d="M976,726 L976,768" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="824" y="784" width="304" height="93" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="976.0" y="838.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Store 33 in C[2]</text><text x="976" y="948" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">Thread 2</text><text x="976" y="990" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">One individual execution flow</text><text x="600" y="1080" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Each thread follows the same procedure on data at its own index.</text></svg>