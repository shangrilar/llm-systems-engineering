<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1741" viewBox="0 0 1200 1741" role="img" aria-labelledby="title desc"><title id="title">Carry the original position with each flattened vector</title><desc id="desc">A 2×2 patch map links A(0,0),B(0,1),C(1,0),D(1,1) to row-major indices 0,1,2,3. Each patch receives an addition such as e_A[4]+p0[4]=u_A[4]. A reordered display A,C,B,D retains positions p0,p2,p1,p3. Coordinates annotate the diagram; original ViT uses learned 1D position embeddings.</desc><metadata>{&quot;id&quot;:&quot;ma-21-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Vision Transformer §3.1, Eq. 1 and 1D position embeddings&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2010.11929v2#S3.SS1&quot;},{&quot;label&quot;:&quot;Rotary Position Embedding for Vision Transformer&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2403.13298&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3 · Vectors and position</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Carry the original position with each flattened vector</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Representative ViT: patch embedding + learned 1D position embedding · Toy four-component</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">vectors</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. From space to sequence index</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="130" width="230" height="145" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="161" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">A</text><text x="36" y="201" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">(0, 0)</text></g><rect x="180" y="148" width="50" height="50" rx="4" fill="#ff0000" stroke="#DCE4EC" stroke-width="1.5"/><g data-container="true"><rect x="290" y="130" width="230" height="145" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="306" y="161" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">B</text><text x="306" y="201" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">(0, 1)</text></g><rect x="450" y="148" width="50" height="50" rx="4" fill="#00ff00" stroke="#DCE4EC" stroke-width="1.5"/><g data-container="true"><rect x="20" y="320" width="230" height="145" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="351" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">C</text><text x="36" y="391" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">(1, 0)</text></g><rect x="180" y="338" width="50" height="50" rx="4" fill="#0000ff" stroke="#DCE4EC" stroke-width="1.5"/><g data-container="true"><rect x="290" y="320" width="230" height="145" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="306" y="351" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">D</text><text x="306" y="391" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">(1, 1)</text></g><rect x="450" y="338" width="50" height="50" rx="4" fill="#ffffff" stroke="#DCE4EC" stroke-width="1.5"/><path d="M260 485 L260 555" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="260" y="610" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle" data-max-width="500">Row-major correspondence</text><rect x="10" y="660" width="170" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="95" y="700.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="158">A (0,0)</text><path d="M190 692 L245 692" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="255" y="660" width="250" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="380" y="700.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">i=0 → p0 [4]</text><rect x="10" y="770" width="170" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="95" y="810.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="158">B (0,1)</text><path d="M190 802 L245 802" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="255" y="770" width="250" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="380" y="810.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">i=1 → p1 [4]</text><rect x="10" y="880" width="170" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="95" y="920.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="158">C (1,0)</text><path d="M190 912 L245 912" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="255" y="880" width="250" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="380" y="920.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">i=2 → p2 [4]</text><rect x="10" y="990" width="170" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="95" y="1030.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="158">D (1,1)</text><path d="M190 1022 L245 1022" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="255" y="990" width="250" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="380" y="1030.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">i=3 → p3 [4]</text><g data-container="true"><rect x="20" y="1130" width="480" height="245" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1161" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Coordinates annotate this diagram</text><text x="36" y="1201" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Original ViT: learned 1D position vectors</text><text x="36" y="1229" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Alternative: 2D RoPE</text><text x="36" y="1257" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">How position enters depends on the model.</text></g></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Keep each vector with its position</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="120" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle" data-max-width="510">Every e, p and u has 4 components</text><rect x="0" y="180" width="135" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="67.5" y="220.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">e_A</text><text x="168" y="222" fill="#7954A3" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">+</text><rect x="200" y="180" width="135" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="267.5" y="220.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">p0</text><path d="M345 212 L385 212" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="395" y="180" width="120" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="455" y="220.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">u_A</text><rect x="0" y="325" width="135" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="67.5" y="365.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">e_B</text><text x="168" y="367" fill="#7954A3" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">+</text><rect x="200" y="325" width="135" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="267.5" y="365.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">p1</text><path d="M345 357 L385 357" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="395" y="325" width="120" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="455" y="365.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">u_B</text><rect x="0" y="470" width="135" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="67.5" y="510.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">e_C</text><text x="168" y="512" fill="#7954A3" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">+</text><rect x="200" y="470" width="135" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="267.5" y="510.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">p2</text><path d="M345 502 L385 502" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="395" y="470" width="120" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="455" y="510.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">u_C</text><rect x="0" y="615" width="135" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="67.5" y="655.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">e_D</text><text x="168" y="657" fill="#7954A3" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">+</text><rect x="200" y="615" width="135" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="267.5" y="655.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="123">p3</text><path d="M345 647 L385 647" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="395" y="615" width="120" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="455" y="655.5" fill="#2470B