<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1402" viewBox="0 0 360 1402" role="img" aria-labelledby="title desc"><title id="title">Route using both cached prefixes and engine queues</title><desc id="desc">Responses a and b branch from shared prefix P. In a later turn, response a and tool observations extend that context. Engine A has cached P with a long queue; B lacks P but has a short queue. Routing compares recomputation and waiting.</desc><metadata>{&quot;id&quot;:&quot;11-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/tree/v0.1.0&quot;},{&quot;label&quot;:&quot;SGLang RadixAttention&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2312.07104&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Route using both cached</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">prefixes and engine queues</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">An example for requests that can</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">choose an engine. Reusing KV for an</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">identical token prefix reduces input</text><text x="16" y="205" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">computation. The engine with the</text><text x="16" y="228.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">longest cache hit does not always</text><text x="16" y="252.59999999999997" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">finish first.</text><path d="M16,272.6 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 296.6) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Where does the context match?</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="106" width="488" height="113" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="137" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">P · shared input prefix</text><text x="32" y="177" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Identical token IDs and preceding context</text></g><path d="M126 225 L126 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M388 225 L388 278" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="288" width="230" height="122" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="319" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Response a</text><text x="32" y="359" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Unique suffix</text></g><g data-container="true"><rect x="274" y="288" width="230" height="122" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="290" y="319" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Response b</text><text x="290" y="359" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Different suffix</text></g><text x="16" y="463" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">P is shared; the KV for a and b is different.</text><text x="16" y="551" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Next-turn input for a</text><rect x="16" y="586" width="80" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="618" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">P</text><rect x="106" y="586" width="80" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="146" y="618" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">a</text><rect x="196" y="586" width="168" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="280" y="618" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="156">Tool result</text><rect x="374" y="586" width="130" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="439" y="618" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="118">New input</text><text x="16" y="690" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">Reuse the matching part of the accumulated</text><text x="16" y="720.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">context that is still cached</text></g><g transform="translate(16 851.2923076923078) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Example engines and routing</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="16" y="102" width="488" height="191" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="139" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start" data-max-width="456">Engine A · long prefix hit</text><rect x="32" y="168" width="160" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="112" y="200" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="148">KV(P)</text><text x="213" y="198" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="277">Less recomputation</text><text x="32" y="257" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="100">Queue</text><rect x="145" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="198" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="251" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="304" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="357" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="410" y="232" width="43" height="35" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="16" y="322" width="488" height="191" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="359" fill="#B55B22" font-size="24" font-weight="600" text-anchor="start" data-max-width="456">Engine B · prefix miss</text><rect x="32" y="386" width="160" height="48" rx="8" fill="#FFFFFF" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="112" y="418" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="142">No KV</text><text x="213" y="418" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="277">Needs recomputation</text><text x="32" y="477" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="100">Queue</text><rect x="145" y="452" width="43" height="35" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><path d="M260 520 L260 574" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><g data-container="true"><rect x="16" y="584" width="488" height="135" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="615" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Router: conceptual cost comparison</text><text x="32" y="655" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Recomputation cost + queue delay → placement</text></g><text x="16" y="772" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">High hit rate ≠ short completion time</text></g></svg>