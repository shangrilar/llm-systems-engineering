<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1172" viewBox="0 0 1200 1172" role="img" aria-labelledby="title desc"><title id="title">요청 도착에서 종료까지</title><desc id="desc">요청은 입력 준비와 대기를 거쳐 자원에 맞게 선택되어 실행되고 상태와 출력을 갱신합니다. 미완료 요청은 반복하고 KV 부족 시 진입 지연이나 중단과 회수로 처리합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1172" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">요청 도착에서 종료까지</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">개념적 실행 지도입니다. 선택·공간 확보·출력 전달의 세부 순서는 엔진마다 다릅니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><g data-box="48,208,692,121"><rect x="48" y="208" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="243.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">요청 도착 · 입력 준비</text><text x="68" y="286.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">텍스트를 토큰으로 바꾸고 요청 상태 생성</text></g><path d="M394,331 L394,347" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,359,692,121"><rect x="48" y="359" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="394.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">대기 큐</text><text x="68" y="437.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">도착한 요청이 실행 기회를 기다림</text></g><path d="M394,482 L394,498" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,510,692,121"><rect x="48" y="510" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="545.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">실행 대상 선택 · 자원 확인</text><text x="68" y="588.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">이번 단계의 토큰 예산과 KV 공간을 함께 고려</text></g><path d="M394,633 L394,649" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,661,692,121"><rect x="48" y="661" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="696.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">선택한 토큰을 배치로 실행</text><text x="68" y="739.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청별 문맥을 유지하며 모델 계산</text></g><path d="M394,784 L394,800" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,812,692,121"><rect x="48" y="812" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="847.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">다음 토큰 선택 · 상태 갱신</text><text x="68" y="890.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">계산된 KV, 토큰 이력, 종료 조건을 갱신</text></g><path d="M394,935 L394,951" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,963,692,121"><rect x="48" y="963" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="998.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">출력 전달 · 완료/취소 정리</text><text x="68" y="1041.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">완료·취소 시 더 이상 필요 없는 자원 회수</text></g><g data-box="816,208,336,162"><rect x="816" y="208" width="336" height="162" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="243.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">실행 전</text><text x="836" y="286.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">대기 요청 ≠ 진행 중 요청</text><text x="836" y="316.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">≠ 이번 배치의 요청</text></g><g data-box="816,420,336,238"><rect x="816" y="420" width="336" height="238" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="836" y="455.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV 공간 부족</text><text x="836" y="498.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">새 요청 진입을 늦추거나</text><text x="836" y="528.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">진행 요청 중단</text><text x="836" y="559.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">→ KV 회수 → 재개 대기</text></g><path d="M751,556 L802,556" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="816" y="714.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">자원 확보와 선택은 함께 조정</text><g data-box="816,814,336,187"><rect x="816" y="814" width="336" height="187" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="836" y="849.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">미완료 요청</text><text x="836" y="892.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">다음 단계의 선택으로 반복</text><text x="836" y="922.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">출력 전달은 계산과</text><text x="836" y="953.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">겹쳐 진행될 수도 있음</text></g><path d="M740,1019 H778 V510 H751" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="1126.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">단계 사이의 요청 관리입니다. GPU 커널을 중간에 끊는 흐름을 뜻하지 않습니다.</text></svg>