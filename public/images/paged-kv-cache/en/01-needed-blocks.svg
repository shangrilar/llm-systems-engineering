<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1007" viewBox="0 0 1200 1007" role="img" aria-labelledby="title desc"><title id="title">Replace a large reservation with needed blocks</title><desc id="desc">B has 6 KV positions in a 24-position pool. Reserving 20 leaves 14 unused reserved positions and only 4 free, so C with 6 input tokens waits. With 4 positions per block, assigning 2 blocks to B and 2 to C leaves 2 free blocks. C’s assigned blocks are still empty because its inputs have not yet been processed.</desc><metadata>{&quot;id&quot;:&quot;01-needed-blocks&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Replace a large reservation with needed blocks</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The same 24-position KV pool can admit C when B reserves less space in advance.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="207" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B currently holds 6 KV positions</text><text x="1152" y="207" fill="#7954A3" font-size="24" font-weight="700" text-anchor="end">New request C · 6 input tokens</text><text x="48" y="278" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Reserve a large region in advance</text><text x="1152" y="278" fill="#7954A3" font-size="27" font-weight="700" text-anchor="end">C waits</text><text x="68" y="335" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">20 positions reserved for B</text><text x="1060" y="335" fill="#5C6C7C" font-size="24" font-weight="700" text-anchor="middle">4 free</text><rect x="58" y="354" width="900" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="978" y="354" width="164" height="90" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><rect x="66" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="83" y="406" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="104" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121" y="406" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="142" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159" y="406" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="180" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="197" y="406" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="250" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="267" y="406" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="288" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="305" y="406" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="326" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="364" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="472" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="510" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="548" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="618" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="656" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="694" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="732" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="802" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="840" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="878" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="916" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="986" y="375" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="1024" y="375" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="1062" y="375" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><rect x="1100" y="375" width="34" height="48" rx="5" fill="white" stroke="#5C6C7C" stroke-width="1.5"/><text x="191" y="485" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">6 actual KV</text><text x="638" y="485" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">14 reserved, unused</text><text x="1060" y="485" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">4 &lt; C’s 6 inputs</text><path d="M48,531 H1152" stroke="#DCE4EC"/><text x="48" y="587" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Allocate only the blocks needed</text><text x="1152" y="587" fill="#7954A3" font-size="27" font-weight="700" text-anchor="end">C can join</text><text x="232" y="644" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 2 blocks = 8 slots</text><text x="600" y="644" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · 2 blocks = 8 slots</text><text x="968" y="644" fill="#5C6C7C" font-size="24" font-weight="700" text-anchor="middle">Free · 2 blocks = 8 slots</text><rect x="58" y="666" width="164" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="66" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="83" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="104" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="142" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="180" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="197" y="718" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="242" y