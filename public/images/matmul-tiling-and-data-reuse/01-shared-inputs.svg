<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">출력은 독립적이지만, 입력은 겹칩니다</title><desc id="desc">A 4×8과 B 8×4를 곱해 C 4×4를 만든다. c00과 c01은 A의 0행을 공유하고 c00과 c10은 B의 0열을 공유한다. 각 출력은 길이 8인 두 벡터의 내적이다. 도형의 칸은 행렬 요소이며 스레드가 아니다. 출력은 독립적이지만 입력이 겹치므로 함께 계산할 때 데이터를 재사용할 수 있다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1020" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">출력은 독립적이지만, 입력은 겹칩니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">여러 출력이 같은 입력을 사용한다는 점에서 행렬 곱의 재사용이 시작됩니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="217" fill="#182C40" font-size="25" font-weight="600" text-anchor=