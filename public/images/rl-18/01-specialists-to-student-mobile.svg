oke-width="1.5"/><text x="52" y="549" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="436">분야 C · SFT → RL</text><text x="52" y="589" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="436">분야 보상으로 학습 → 전문 교사 TC</text></g><path d="M 508 255 H 517 V 695" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M 508 420 H 517 V 695" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M 508 585 H 517 V 695" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M517 695 H260 V745" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="760" width="488" height="178" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="791" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학생의 OPD 학습 · 여러 교사 활용</text><text x="32" y="831" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">학생 응답 생성 → 같은 문맥의 교사 확률</text><text x="32" y="859" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">→ 학생 손실·역전파 → 학생 가중치 갱신</text></g><path d="M260 950 L260 988" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="1000" width="488" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="1031" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">여러 분야의 능력을 배운 학생</text><text x="32" y="1071" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">통합은 학생 학습으로 수행</text></g></g></svg>