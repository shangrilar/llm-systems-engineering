xt x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Toy d=2 · Same e gives the same k and v</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">· RMSNorm: γ=1, ε omitted</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><g data-container="true"><rect x="10" y="20" width="500" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="26" y="51" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="468">Shared: suffix A B C · N=3</text><text x="26" y="91" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="468">k = [1, 1] · v = [2, −1]</text></g><text x="10" y="205" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="140">Compare</text><text x="245" y="205" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle" data-max-width="175">Context P</text><text x="425" y="205" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle" data-max-width="175">Context Q</text><path d="M10 230 L510 230" stroke="#DCE4EC" stroke-width="2" fill="none"/><text x="10" y="285" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="140">Context h</text><text x="245" y="285" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle" data-max-width="170">[1, 1]</text><text x="425" y="285" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle" data-max-width="170">[−1, −1]</text><path d="M10 340 L510 340" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="10" y="385" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="140">Normalized</text><text x="10" y="414.4" fill="#182C40" font-size="21" font-weight="400" text-a