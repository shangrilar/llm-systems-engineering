<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">많은 계산을 작업 묶음으로 관리합니다</title><desc id="desc">한 번의 벡터 덧셈 실행에 속한 block A부터 H까지를 grid 안에 그린다. 각 block에는 일부 thread만 작은 칸으로 표시한다. 하나의 thread를 확대해 입력 1과 10 읽기, 덧셈, 결과 11 저장을 보여준다. 예시는 출력 1024개에 block 8개와 block당 thread 128개를 사용하며 한 thread가 한 출력을 담당한다. 작은 칸은 물리적 연산 장치가 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1010" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">많은 계산을 작업 묶음으로 관리합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Thread의 작업을 block으로 묶고, 그 전체를 grid로 구성합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="220" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">많은 출력 계산을 여러 작업 묶음으로 구성합니다.</text><rect x="48" y="249" width="650" height="601" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="296" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Grid · 한 번의 커널 실행에 속한 block 전체</text><rect x="76" y="324" width="284" height="99" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="94" y="357" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">Block A · thread 128개</text><rect x="94" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="120" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="146" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="172" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="198" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="224" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="250" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="276" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="321" y="398" fill="#2470BB" font-size="25" font-weight="400" text-anchor="start">⋯</text><rect x="382" y="324" width="284" height="99" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="400" y="357" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="start">Block B · thread 128개</text><rect x="400" y="378" width="18" height="22" rx="3" fill="#FFFFFF" stroke="#5C6C7C" stroke-width="1.5"/><rect x="426" y="378" width="18" height="22" rx="3" fill="#FFFFFF" stroke="#5C6C7C" stroke-width="1.5"/><rect x="452" y="378" width="18" height="22" rx="3" fill="#FFFFFF" stroke="#5C6C7C" strok