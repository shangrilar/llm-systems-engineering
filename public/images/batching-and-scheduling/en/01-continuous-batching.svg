"#2470BB" stroke-width="1.5"/><text x="309" y="694.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">P</text><rect x="377" y="656" width="114" height="58" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="434" y="694.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">D ✓</text><rect x="502" y="656" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="559" y="694.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="627" y="656" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="684" y="694.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="752" y="656" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="809" y="694.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="877" y="656" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="934" y="694.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="1002" y="656" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="1059" y="694.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><text x="48" y="767.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">B</text><rect x="252" y="728" width="114" height="58" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="309" y="766.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">P</text><rect x="377" y="728" width="114" height="58" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="434" y="766.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">D</text><rect x="502" y="728" width="114" height="58" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><tex