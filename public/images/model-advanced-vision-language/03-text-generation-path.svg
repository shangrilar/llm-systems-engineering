<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1922" viewBox="0 0 1200 1922" role="img" aria-labelledby="title desc"><title id="title">함께 처리한 Hidden에서 다음 Text Token을 고릅니다</title><desc id="desc">Visual 네 행과 text 세 행의 입력을 decoder가 처리한다. 마지막 위치의 h_last[8]가 LM head[8×|Vocab|]를 지나 text logits를 만들고 ID y0를 선택한다. 다음 step에는 y0의 embedding 여덟 성분을 Pos7에 넣는다. 별도 회색 비교도에서는 decoder Query와 visual bank의 KV가 cross-attention에서 만나 이후 언어 경로로 간다.</desc><metadata>{&quot;id&quot;:&quot;ma-22-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;LLaVA §4.1–4.2, autoregressive language output&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2304.08485v2#S4.SS2&quot;},{&quot;label&quot;:&quot;Flamingo §3.1.1–3.1.2, resampler and visual cross-attention&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2204.14198v1#S3.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orie