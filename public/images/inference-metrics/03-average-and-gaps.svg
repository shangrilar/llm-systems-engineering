<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1007" viewBox="0 0 1200 1007" role="img" aria-labelledby="title desc"><title id="title">평균이 같아도 출력 간격은 다릅니다</title><desc id="desc">두 출력열의 ITL은35·35ms와5·65ms. TPOT는둘다35ms/token이지만두번째에는65ms공백이있습니다.</desc><metadata>{&quot;id&quot;:&quot;03-average-and-gaps&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">평균이 같아도 출력 간격은 다릅니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">TPOT는 간격의 평균입니다. ITL은 각 간격을 드러냅니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="205" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">두 경우 모두 첫 토큰부터 마지막 토큰까지 70 ms</text><text x="48" y="245" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">일정한 간격</text><path d="M170,330 L940,330" stroke="#5C6C7C" stroke-width="2" fill="none"/><circle cx="170" cy="330" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><text x="170" y="369" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">x0</text><circle cx="555" cy="330" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><text x="555" y="369" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">x1</text><circle cx="940" cy="330" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><text x="940" y="369" fill="#2470BB" font-size="21" font-weight="700" text-anchor="middle">x2</text><path d="M170,310 L555,310" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M170,302 L170,318" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M555,302 L555,318" stroke="#2470BB" stroke-width="2" fill="none"/><text x="362.5" y="290" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">35 ms</text><path d="M555,310 L940,310" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M555,302 L555,318" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M940,302 L940,318" stroke="#2470BB" stroke-width="2" fill="none"/><text x="747.5" y="290" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">35 ms</text><text x="990" y="337" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">TPOT</text><text x="980" y="377" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">35 ms/token</text><text x="48" y="505" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">긴 출력 공백</text><path d="M170,590 L940,590" stroke="#5C6C7C" stroke-width="2" fill="none"/><circle cx="170" cy="590" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="170" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">x0</text><circle cx="225" cy="590" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="225" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">x1</text><circle cx="940" cy="590" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="940" y="629" fill="#287D78" font-size="21" font-weight="700" text-anchor="middle">x2</text><path d="M170,570 L225,570" stroke="#287D78" stroke-width="2" fill="none"/><path d="M170,562 L170,578" stroke="#287D78" stroke-width="2" fill="none"/><path d="M225,562 L225,578" stroke="#287D78" stroke-width="2" fill="none"/><text x="197.5" y="550" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle"></text><path d="M197.5,562 L270,525" stroke="#287D78" stroke-width="2" fill="none"/><text x="280" y="523" fill="#287D78" font-size="22" font-weight="700" text-anchor="start">5 ms</text><path d="M225,570 L940,570" stroke="#287D78" stroke-width="2" fill="none"/><path d="M225,562 L225,578" stroke="#287D78" stroke-width="2" fill="none"/><path d="M940,562 L940,578" stroke="#287D78" stroke-width="2" fill="none"/><text x="582.5" y="550" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">65 ms</text><text x="990" y="597" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">TPOT</text><text x="980" y="637" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">35 ms/token</text><rect x="250" y="653" width="650" height="55" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="575" y="688" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">65 ms 동안 다음 출력이 오지 않음</text><rect x="48" y="775" width="1104" height="100" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="80" y="816" fill="#7954A3" font-size="27" font-weight="700" text-anchor="start">같은 평균으로는 생성 도중의 멈춤을 알 수 없습니다.</text><text x="80" y="852" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">(35 + 35) / 2 = (5 + 65) / 2 = 35 ms/token</text></g></g><path d="M48,929 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="967" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">같은 TPOT라도 실제 토큰 간격을 보면 생성 중의 긴 멈춤이 드러납니다.</text></svg>