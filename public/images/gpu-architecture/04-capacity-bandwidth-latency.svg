<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">용량·대역폭·접근 지연은 다릅니다</title><desc id="desc">용량은 같은 크기의 데이터 칸 네 개와 여덟 개가 들어가는 공간으로 비교한다. 대역폭은 같은 시간에 도착한 데이터 묶음 세 개와 여섯 개로 비교한다. 접근 지연은 요청부터 사용 가능 시점까지 짧고 긴 두 시간선으로 비교한다. 각 패널은 독립적인 개념 비교이며 실측 수치가 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1200" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">용량·대역폭·접근 지연은 다릅니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">데이터를 담는 양, 전달하는 양, 기다리는 시간을 구분합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="215" width="1104" height="245" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="78" y="271" fill="#182C40" font-size="30" font-weight="700" text-anchor="start">용량</text><text x="78" y="315" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">얼마나</text><text x="78" y="346" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">담을 수 있나?</text><text x="744" y="258" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">저장할 수 있는 데이터의 양</text><rect x="374" y="287" width="208" height="69" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="389" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="435" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="481" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="527" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="478" y="432" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">작은 용량</text><rect x="812" y="287" width="208" height="113" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="827" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="873" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="919" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="965" y="303" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="827" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="873" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="919" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="965" y="347" width="39" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="916" y="432" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">큰 용량</text><rect x="48" y="484" width="1104" height="272" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="78" y="542" fill="#182C40" font-size="30" font-weight="700" text-anchor="start">대역폭</text><text x="78" y="586" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 시간에</text><text x="78" y="617" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">얼마나 전달하나?</text><text x="744" y="528" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">같은 시간에 도착한 데이터</text><text x="417" y="592" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">적게</text><rect x="489" y="557" width="602" height="60" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="509" y="570" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="600" y="570" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="691" y="570" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="417" y="691" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">많이</text><rect x="489" y="656" width="602" height="60" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="509" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="600" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="691" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="782" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="873" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="964" y="669" width="72" height="34" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="48" y="780" width="1104" height="307" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="78" y="838" fill="#182C40" font-size="30" font-weight="700" text-anchor="start">접근 지연</text><text x="78" y="882" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">요청한 뒤</text><text x="78" y="913" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">얼마나 기다리나?</text><text x="385" y="839" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">요청</text><text x="677" y="839" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">사용 가능</text><rect x="385" y="860" width="292" height="44" rx="6" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><path d="M385,852 V912" fill="none" stroke="#7954A3" stroke-width="2"/><path d="M389,882 L677,882" fill="none" stroke="#7954A3" stroke-width="2.5" marker-end="url(#purple)"/><path d="M677,852 V912" fill="none" stroke="#7954A3" stroke-width="2"/><text x="531.0" y="939" fill="#7954A3" font-size="21" font-weight="400" text-anchor="middle">기다리는 시간</text><text x="385" y="974" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">요청</text><text x="1058" y="974" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">사용 가능</text><rect x="385" y="995" width="673" height="44" rx="6" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><path d="M385,987 V1047" fill="none" stroke="#7954A3" stroke-width="2"/><path d="M389,1017 L1058,1017" fill="none" stroke="#7954A3" stroke-width="2.5" marker-end="url(#purple)"/><path d="M1058,987 V1047" fill="none" stroke="#7954A3" stroke-width="2"/><text x="721.5" y="1074" fill="#7954A3" font-size="21" font-weight="400" text-anchor="middle">기다리는 시간</text><text x="600" y="1151" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">저장량, 전달량, 기다리는 시간은 서로 다른 특성입니다.</text></svg>