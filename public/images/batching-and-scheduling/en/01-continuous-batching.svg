<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">Reuse a completed request’s batch slot</title><desc id="desc">Static batching makes C wait for B despite A finishing. Continuous batching admits C for prefill at step 3, followed by decode and completion.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1110" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Reuse a completed request’s batch slot</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A teaching schedule with at most two requests per step; not a performance</text><text x="48" y="140.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">measurement.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">P = full prefill · D = decode one new token per request · — = no execution</text><text x="48" y="251.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Static batching</text><text x="310" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1</text><text x="435" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">2</text><text x="560" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">3</text><text x="685" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">4</text><text x="810" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">5</text><text x="935" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">6</text><text x="1060" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">7</text><text x="48" y="350.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">A</text><rect x="252" y="311" width="114" height="58" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="309" y="349.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">P</text><rect x="377" y="311" width="114" height="58" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="434" y="349.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">D ✓</text><rect x="502" y="311" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="559" y="349.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="627" y="311" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="684" y="349.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="752" y="311" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="809" y="349.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="877" y="311" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="934" y="349.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><rect x="1002" y="311" width="114" height="58" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="1059" y="349.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">—</text><text x="48" y="422.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">B</text><rect x="252" y="383" width="114" height="58" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="309" y="421.0" fill="#287D78" font-size="2