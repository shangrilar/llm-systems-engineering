h="1104">Learned weights of CSA attention</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">What differs from HCA: overlapping compression (twice as wide) and the indexer</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g data-matrix="X"><rect x="16" y="66" width="128" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="80" y="54" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="248"><tspan>X</tspan></text><text x="88" y="137" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[T, D]</tspan></text><g data-path="q"><g data-matrix="W^{DQ}"><rect x="242" y="176" width="96" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="290" y="164" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="216"><tspan>W</tspan><tspan dy="-9.1" font-size="16.8">DQ</tspan></text><text x="298" y="247" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[D, r</tspan><tspan dy="4" font-size="12.6">q</tspan><tspan dy="-4">]</tspan></text><path d="M290 224 L290 253" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/><circle cx="290" cy="270" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="290" y="276.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><rect x="354" y="253" width="128" height="34" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="418" y="277" fill="#657789" font-size="19" font-weight="600" text-anchor="middle" data-max-width="120">RMSNorm</text><g data-matrix="c^Q"><rect x="530" y="246" width="96" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="578" y="234" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="216"><tspan>c</tspan><tspan dy="-9.1" font-size="16.8">Q</tspan></text><text x="578" y="317" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, r</tspan><tspan dy="4" font-size="12.6">q</tspan><tspan dy="-4">]</tspan></text><text x="100" y="260" fill="#182C40" font-size="19" font-weight="600" text-anchor="start" data-max-width="190">Shared query part</text><text x="654" y="264" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>the indexer reuses this c</tspan><tspan dy="-6.5" font-size="11.9">Q</tspan></text><text x="654" y="290" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>c</tspan><tspan dy="-6.5" font-size="11.9">Q</tspan><tspan dy="6.5"> → W</tspan><tspan dy="-6.5" font-size="11.9">UQ</tspan><tspan dy="6.5"> → Q: as in HCA</tspan></text></g><g data-path="c"><g data-matrix="W^{KV}_{comp}"><rect x="240" y="546" width="100" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="290" y="534" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>W</tspan><tspan dy="-9.1" font-size="16.8">KV</tspan><tspan dy="14.4" dx="-19.2" font-size="16.8">comp</tspan></text><text x="298" y="617" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[D, 2c]</tspan></text><path d="M290 594 L290 623" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/><circle cx="290" cy="640" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="290" y="646.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><g data-matrix="C"><rect x="360" y="616" width="100" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="410" y="604" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>C</tspan></text><text x="410" y="687" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, 2c]</tspan></text><text x="100" y="630" fill="#182C40" font-size="19" font-weight="600" text-anchor="start" data-max-width="190">Compression KV · C</text><text x="488" y="634" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>first half a: for the previous span</tspan></text><text x="488" y="660" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="400"><tspan>second half b: for its own span (overlap)</tspan></text></g><g data-path="z"><g data-matrix="W^Z"><rect x="240" y="726" width="100" height="48" rx="0" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/></g><text x="290" y="714" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>W</tspan><tspan dy="-9.1" font-size="16.8">Z</tspan></text><text x="298" y="797" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[D, 2c]</tspan></text><path d="M290 774 L290 803" stroke="#7954A3" stroke-width="1.8" fill="none" marker-end="url(#arrow-purple)"/><circle cx="290" cy="820" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="290" y="826.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><g data-matrix="Z"><rect x="360" y="796" width="100" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="410" y="784" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><tspan>Z</tspan></text><text x="410" y="867" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[T, 2c]</tspan></text><text x="100" y="810" fill="#182C40" font-size="19" font-weight="600" text-anchor="start" data-max-width="190">Compression KV · Z</text></g><g data-path="iq"><rect x="5