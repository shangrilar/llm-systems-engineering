<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">Subtracting the Maximum for Stable Computation</title><desc id="desc">Compare softmax for scores 1000,1001,1002. Direct exponentiation exceeds the FP32 and FP64 ranges and cannot yield valid probabilities. Subtracting the maximum 1002 gives -2,-1,0, whose exponentials are about 0.135,0.368,1. Dividing by their sum, about 1.503, gives about 9.0%,24.5%,66.5%. Scaling the numerator and denominator by the same positive factor exp(-max) preserves the probabilities in real arithmetic. This does not mean bitwise identical floating-point results. The example uses finite scores and rounded values.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1260" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Subtracting the Maximum for Stable Computation</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Softmax recap: Apply exp → Sum all values → Divide each value by the sum</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="536" height="853" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="253" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">Use the original scores</text><text x="76" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Scores</text><rect x="96.0" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.33333333333331" y="358.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="242.66666666666666" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="311.0" y="358.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1001</text><rect x="389.3333333333333" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="457.66666666666663" y="358.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1002</text><path d="M316,439 L316,459" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)"/><text x="316" y="426" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">Keep scores unchanged</text><rect x="96.0" y="474" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.33333333333331" y="515.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="242.66666666666666" y="474" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311.0" y="515.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1001</text><rect x="389.3333333333333" y="474" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="457.66666666666663" y="515.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1002</text><path d="M316,553 L316,601" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)"/><text x="76" y="590" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Apply exp</text><rect x="96.0" y="622" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.33333333333331" y="663.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">exp(1000)</text><rect x="242.66666666666666" y="622" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311.0" y="663.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">exp(1001)</text><rect x="389.3333333333333" y="622" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="457.66666666666663" y="663.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">exp(1002)</text><text x="316" y="727" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">Exceeds the FP32 / FP64 range</text><path d="M316,745 L316,786" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)"/><rect x="96" y="806" width="430" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311.0" y="846.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">The sum is also out of range</text><text x="316" y="909" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Divide each exponential by the sum</text><rect x="96" y="938" width="430" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311.0" y="979.0" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">Cannot compute valid probabilities</text><rect x="616" y="207" width="536" height="853" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="253" fill="#287D78" font-size="29" font-weight="700" text-anchor="middle">Subtract the maximum</text><text x="644" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Scores</text><rect x="664.0" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="358.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="810.6666666666666" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="879.0" y="358.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1001</text><rect x="957.3333333333333" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="358.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1002</text><path d="M884,439 L884,459" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><text x="884" y="426" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Subtract max = 1002 from all scores</text><rect x="664.0" y="474" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="515.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">-2</text><rect x="810.6666666666666" y="474" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879.0" y="515.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">-1</text><rect x="957.3333333333333" y="474" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="515.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">0</text><path d="M884,553 L884,601" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><text x="644" y="590" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Apply exp</text><rect x="664.0" y="622" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="663.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">0.135</text><rect x="810.6666666666666" y="622" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879.0" y="663.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">0.368</text><rect x="957.3333333333333" y="622" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="663.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">1</text><text x="884" y="727" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">The largest exponential is 1</text><path d="M884,745 L884,786" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><rect x="664" y="806" width="430" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879.0" y="846.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Sum ≈ 1.503</text><text x="884" y="909" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Divide each exponential by the sum</text><rect x="664.0" y="938" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="979.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">9.0%</text><rect x="810.6666666666666" y="938" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879.0" y="979.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">24.5%</text><rect x="957.3333333333333" y="938" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="979.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">66.5%</text><rect x="48" y="1093" width="1104" height="121" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1139" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">The same factor exp(−max) scales the numerator and denominator.</text><text x="600" y="1184" fill="#287D78" font-size="25" font-weight="400" text-anchor="middle">Mathematically identical probabilities, computed with bounded exponentials.</text></svg>