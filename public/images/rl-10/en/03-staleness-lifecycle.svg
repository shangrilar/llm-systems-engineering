<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" role="img" aria-labelledby="title desc"><title id="title">Experience ages during generation and in the buffer</title><desc id="desc">Generation starts with v3 and resumes with v4 after synchronization. At completion the oldest generation version v3 lags current v4 by one. After v5 is published during buffer waiting, the gap at dequeue is two.</desc><metadata>{&quot;id&quot;:&quot;10-3&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §2.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Experience ages during generation and in the buffer</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">An illustrative trace of generation versions and the current published rollout version.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">① While generation is running</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="110" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Start generation · v3</text><text x="32" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Generate the initial tokens</text></g><path d="M260 207 L260 242" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="252" width="488" height="92" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="283" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Weight sync · v3 → v4</text><text x="32" y="323" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Pause generation and apply new weights</text></g><path d="M260 351 L260 386" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="396" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="427" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Resume generation · v4</text><text x="32" y="467" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Keep the prefix and generate new tokens</text></g><path d="M260 493 L260 528" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="16" y="538" width="488" height="166" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="572" fill="#7954A3" font-size="24" font-weight="600" text-anchor="start" data-max-width="450">Generation complete</text><text x="32" y="618" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="450">Oldest generation version: v3</text><text x="32" y="668" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="450">Current v4 − oldest v3 = 1</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">② While waiting in the buffer</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="16" y="110" width="488" height="206" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="32" y="146" fill="#182C40" font-size="24" font-weight="600" text-anchor="start" data-max-width="450">Completed experience · queued</text><g data-container="true"><rect x="36" y="171" width="448" height="120" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="52" y="202" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="416">Generation history: v3 + v4</text><text x="52" y="242" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="416">Oldest version stays v3</text></g><path d="M260 323 L260 358" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><g data-container="true"><rect x="16" y="368" width="488" height="94" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="399" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Weight sync · v4 → v5</text><text x="32" y="439" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Stored generation history is unchanged</text></g><path d="M260 469 L260 528" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="16" y="538" width="488" height="166" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="572" fill="#7954A3" font-size="24" font-weight="600" text-anchor="start" data-max-width="450">When dequeuing for training</text><text x="32" y="618" fill="#182C40" font-size="22" font-weight="400" text-anchor="start" data-max-width="450">Oldest generation version: v3</text><text x="32" y="668" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="450">Current v5 − oldest v3 = 2</text></g></svg>