 y="296" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Thread 하나의 작업</text><text x="968" y="341" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">벡터 덧셈의 한 위치 담당</text><rect x="826" y="386" width="284" height="72" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="968.0" y="430.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">입력 1과 10 읽기</text><path d="M968,470 L968,514" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="826" y="528" width="284" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="968.0" y="572.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">1 + 10 계산</text><path d="M968,612 L968,656" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="826" y="670" width="284" height="72" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="968.0" y="714.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">결과 11 저장</text><text x="968" y="803" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">각 thread가 맡은 계산을 진행</text><text x="600" y="910" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">출력 1,024개 → block 8개 × block당 thread 128개</text><text x="600" y="959" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">Block은 함께 배정되는 묶음이고, thread는 개별 작업의 흐름입니다.</text></svg>