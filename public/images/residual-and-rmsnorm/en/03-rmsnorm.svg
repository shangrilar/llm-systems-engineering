<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">Apply RMSNorm across a token’s d components</title><desc id="desc">For [1,−1,3,3], the mean square is 5 and the RMS is √5. With γ=1 and ε omitted, output is approximately [0.45,−0.45,1.34,1.34]. Bars share a scale. All d components contribute to a single RMS per token. The general formula includes ε and the learned per-component weights γ.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1120" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Apply RMSNorm across a token’s d components</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Compute the RMS across d components, then divide each component by it.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="250" y="223" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Input vector x</text><text x="950" y="223" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">RMSNorm output</text><path d="M70,274 V266 H430 V274" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="250.0" y="253" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">d = 4</text><path d="M770,274 V266 H1130 V274" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="950.0" y="253" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">d = 4</text><rect x="70.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="115.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="160.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="205.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="250.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="295.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="340.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="385.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="770.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="815.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0.45</text><rect x="860.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="905.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">−0.45</text><rect x="950.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="995.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1.34</text><rect x="1040.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1085.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1.34</text><text x="600" y="272" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">÷ √5</text><path d="M464,314 L736,314" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="600" y="360" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">√5 ≈ 2.24</text><text x="600" y="393" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">One divisor for all d values</text><path d="M70,532 L430,532" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="58" y="539" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="end">0</text><rect x="92" y="497" width="46" height="35" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">1</text><rect x="182" y="532" width="46" height="35" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="205" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2</text><rect x="272" y="427" width="46" height="105" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="295" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">3</text><rect x="362" y="427" width="46" height="105" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="385" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4</text><path d="M770,532 L1130,532" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="758" y="539" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="end">0</text><rect x="792" y="516.3475241575014" width="46" height="15.652475842498527" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="815" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">1</text><rect x="882" y="532" width="46" height="15.652475842498527" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="905" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2</text><rect x="972" y="485.0425724725044" width="46" height="46.95742752749558" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="995" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">3</text><rect x="1062" y="485.0425724725044" width="46" height="46.95742752749558" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1085" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4</text><text x="600" y="640" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Horizontal axis: the d component positions. Both charts use the same scale.</text><rect x="48" y="660" width="1104" height="132" rx="14" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1.5"/><text x="80" y="700" fill="#287D78" font-size="26" font-weight="600" text-anchor="start">Compute one RMS from all d components.</text><text x="80" y="752" fill="#287D78" font-size="30" font-weight="400" text-anchor="start">√((1² + (−1)² + 3² + 3²) / d) = √(20 / 4) = √5</text><text x="80" y="833" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">γ (gamma) is a learned weight vector, multiplied component by component.</text><text x="80" y="870" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Above, γ = [1, 1, 1, 1] to show the effect of dividing by the RMS.</text><text x="80" y="907" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">The small ε term that prevents a zero denominator is omitted in this example.</text><text x="600" y="962" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">i</tspan> = x<tspan baseline-shift="sub" font-size="70%">i</tspan> / √((x<tspan baseline-shift="sub" font-size="70%">1</tspan>² + … + x<tspan baseline-shift="sub" font-size="70%">d</tspan>²) / d + ε) × γ<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text x="600" y="1010" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">Applied separately to each token · d dimensions in and out</text><path d="M48,1040 L1152,1040" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1081" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Illustrative d = 4. Output labels are rounded to two decimals; bars use unrounded values.</text>
</svg>