url(#arrow-blue)"/><circle cx="214" cy="180" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="214" y="186.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><g data-matrix="O"><rect x="278" y="156" width="60" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="308" y="144" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="180"><tspan>O</tspan></text><text x="308" y="227" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[n</tspan><tspan dy="4" font-size="12.6">h</tspan><tspan dy="-4">, c]</tspan></text><rect x="386" y="163" width="150" height="34" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="461" y="187" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle" data-max-width="142">inv. RoPE (t)</text><text x="110" y="256" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>P from ②</tspan></text><text x="254" y="108" fill="#2470BB" font-size="17" font-weight="400" text-anchor="start" data-max-width="260"><tspan>as the Value · the same E as in ①</tspan></text><path d="M150 180 L197 180" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/><path d="M230 180 L272 180" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/><path d="M338 180 L384 180" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/></g><g transform="translate(48 1170) scale(1)" data-panel="4"><text x="0" y="30" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="640"><tspan>④ Grouped output projection</tspan></text><g data-matrix="O_g"><rect x="60" y="156" width="100" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="110" y="144" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="220"><ts