<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Rebuild KV while preserving output history</title><desc id="desc">Before preemption KV covers p0,p1,p2,x0 while x1 is delivered. Retaining history allows recomputation through x1 and delivery of only the new x2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1050" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Rebuild KV while preserving output history</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Teaching example: request B has prompt p0/p1/p2 and outputs x0/x1.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><g data-panel="true"><rect x="48" y="203" width="1104" height="167" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="239.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Before preemption: x1 selected and delivered</text><text x="68" y="287.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">History: p0 p1 p2 x0 x1 / GPU KV: p0 p1 p2 x0</text><text x="68" y="319.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">x1 is the next input and need not have its own KV yet.</text></g><path d="M600,390 L600,433" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="454" width="1104" height="141" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="68" y="490.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Preempt: retain token history, release GPU KV</text><text x="68" y="538.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">History: p0 p1 p2 x0 x1 / GPU KV: none / No new user output</text></g><path d="M600,615 L600,658" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="679" width="1104" height="168" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="715.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Resume: rebuild KV from the fixed history</text><text x="68" y="763.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Input: p0 p1 p2 x0 x1 → KV: p0 p1 p2 x0 x1 → select next token x2</text><text x="68" y="795.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Do not resample x0 or x1. Deliver only the new x2 to the user.</text></g><g data-panel="true"><rect x="48" y="895" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="930.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Rebuild computation state while preserving earlier output choices.</text><text x="72" y="972.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">This shows recomputation. Swapping instead restores KV saved in another storage</text><text x="72" y="1004.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">tier.</text></g></svg>