<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951" role="img" aria-labelledby="title desc"><title id="title">Read latency on one request timeline</title><desc id="desc">Submit at 0ms, tokens at 100, 130 and 170ms, end at 180ms. TTFT 100ms, ITLs 30 and 40ms, TPOT 35ms/token, E2E 180ms.</desc><metadata>{&quot;id&quot;:&quot;01-request-latency&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Read latency on one request timeline</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Each metric measures a different span on the same timeline.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="205" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Client receipt times · One token per chunk in this example</text><path d="M120,325 L1020,325" stroke="#5C6C7C" stroke-width="2" fill="none"/><circle cx="120" cy="325" r="9" fill="#182C40" stroke="#182C40" stroke-width="3"/><text x="120" y="270" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Submit</text><text x="120" y="302" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">0 ms</text><circle cx="620" cy="325" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="620" y="270" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">First token x0</text><text x="620" y="302" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">100 ms</text><circle cx="770" cy="325" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="770" y="270" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Token x1</text><text x="770" y="302" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">130 ms</text><circle cx="970" cy="325" r="9" fill="#287D78" stroke="#287D78" stroke-width="3"/><text x="970" y="270" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Token x2</text><text x="970" y="302" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">170 ms</text><path d="M1020,240 L1020,340" stroke="#B55B22" stroke-width="2" fill="none"/><text x="1020" y="239" fill="#B55B22" font-size="21" font-weight="700" text-anchor="middle">End 180 ms</text><path d="M120,410 L620,410" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M120,402 L120,418" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M620,402 L620,418" stroke="#2470BB" stroke-width="2" fill="none"/><text x="370" y="390" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">TTFT · 100 ms</text><path d="M620,480 L770,480" stroke="#287D78" stroke-width="2" fill="none"/><path d="M620,472 L620,488" stroke="#287D78" stroke-width="2" fill="none"/><path d="M770,472 L770,488" stroke="#287D78" stroke-width="2" fill="none"/><text x="695" y="460" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">ITL · 30 ms</text><path d="M770,480 L970,480" stroke="#287D78" stroke-width="2" fill="none"/><path d="M770,472 L770,488" stroke="#287D78" stroke-width="2" fill="none"/><path d="M970,472 L970,488" stroke="#287D78" stroke-width="2" fill="none"/><text x="870" y="460" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">ITL · 40 ms</text><rect x="500" y="535" width="620" height="120" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="530" y="574" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">TPOT · Average interval after the first token</text><text x="530" y="621" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">(30 + 40) / 2 = 35 ms/token</text><path d="M120,740 L1020,740" stroke="#182C40" stroke-width="2" fill="none"/><path d="M120,732 L120,748" stroke="#182C40" stroke-width="2" fill="none"/><path d="M1020,732 L1020,748" stroke="#182C40" stroke-width="2" fill="none"/><text x="570" y="720" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Full request time · E2E = 180 ms</text><text x="48" y="812" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">3 output tokens → 2 intervals · Last-token receipt and request end are distinct.</text></g></g><path d="M48,873 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="911" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Different starting and ending points on the same request produce different latency metrics.</text></svg>