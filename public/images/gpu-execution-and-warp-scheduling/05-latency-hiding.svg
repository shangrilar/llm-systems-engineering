<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1255" viewBox="0 0 1200 1255" role="img" aria-labelledby="title desc"><title id="title">한 warp가 기다리는 동안 다른 warp를 실행합니다</title><desc id="desc">한 스케줄러의 명령 발행을 두 경우로 비교한다. Warp A가 읽기를 요청하고 다음 덧셈에 필요한 입력을 기다리는 동안, 준비된 B와 D가 있으면 그 명령들을 발행한다. A의 입력이 준비되면 A의 덧셈을 선택할 수 있다. 아래쪽은 다른 warp들도 모두 기다려 A의 입력 대기 중 명령 발행이 비는 경우이다. 두 경우의 데이터 대기 시간은 같다고 가정한다. 칸은 실제 사이클이나 명령 소요 시간을 뜻하지 않고 B와 D를 번갈아 고르는 정책을 의미하지 않는다. A가 다시 선택되는 시점도 항상 즉시라고 보장하지 않는다. 발행이 비었다고 이미 진행 중인 모든 하드웨어 연산이 멈추는 것은 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1255" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">한 warp가 기다리는 동안 다른 warp를 실행합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">메모리 접근을 빠르게 만드는 대신, 그동안 진행할 수 있는 작업을 실행합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="218" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 warp scheduler의 명령 발행 흐름</text><path d="M699,211 L1140,211" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="921" y="194" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">시간 흐름</text><rect x="48" y="250" width="1104" height="343" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="296" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">실행 가능한 다른 warp가 있을 때</text><text x="77" y="365" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Warp A</text><text x="77" y="400" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">입력 상태</text><rect x="292" y="337" width="124" height="67" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="354.0" y="378.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">읽기 요청</text><rect x="430" y="337" width="538" height="67" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="699.0" y="378.5" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">다음 계산에 필요한 값을 기다림</text><rect x="982" y="337" width="124" height="67" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1044.0" y="378.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">입력 준비</text><text x="77" y="482" fill="#182C40" font-size="23" font-weight="600" text-anchor="start">발행한 명령</text><rect x="292" y="440" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="354.0" y="483.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A 읽기</text><rect x="430" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="492.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B 명령</text><rect x="568" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="630.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">D 명령</text><rect x="706" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="768.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">B 명령</text><rect x="844" y="440" width="124" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="906.0" y="483.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">D 명령</text><rect x="982" y="440" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1044.0" y="483.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A 덧셈</text><text x="600" y="560" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">A가 기다리는 동안 B와 D의 명령을 실행할 수 있습니다.</text><rect x="48" y="629" width="1104" height="343" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="675" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">다른 warp도 모두 기다릴 때</text><text x="77" y="744" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Warp A</text><text x="77" y="779" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">입력 상태</text><rect x="292" y="716" width="124" height="67" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="354.0" y="757.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">읽기 요청</text><rect x="430" y="716" width="538" height="67" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="699.0" y="757.5" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">다음 계산에 필요한 값을 기다림</text><rect x="982" y="716" width="124" height="67" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1044.0" y="757.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">입력 준비</text><text x="77" y="861" fill="#182C40" font-size="23" font-weight="600" text-anchor="start">발행한 명령</text><rect x="292" y="819" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="354.0" y="862.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A 읽기</text><rect x="430" y="819" width="538" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="699" y="861" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">명령 발행 없음</text><rect x="982" y="819" width="124" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1044.0" y="862.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">A 덧셈</text><text x="600" y="939" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">실행 가능한 warp가 없으면 이 스케줄러는 명령을 발행하지 못합니다.</text><rect x="48" y="1007" width="1104" height="150" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1057" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">지연 숨기기 · Latency hiding</text><text x="600" y="1109" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">기다리는 동안 다른 작업을 진행해 연산 장치가 쉬는 시간을 줄입니다.</text><text x="600" y="1207" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">두 경우에서 A가 데이터를 기다리는 시간은 같습니다.</text></svg>