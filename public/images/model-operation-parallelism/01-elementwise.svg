<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc"><title id="title">원소별 연산: 각 출력을 독립적으로</title><desc id="desc">Residual 덧셈을 네 개의 독립적인 세로 경로로 표현한다. 1+10=11, 2+20=22, 3+30=33, 4+40=44이며 다른 위치 사이의 의존성은 없다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="895" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">원소별 연산: 각 출력을 독립적으로</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">각 위치의 입력만 준비되면 서로 독립적으로 계산할 수 있습니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="221" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">Residual 덧셈: 같은 위치의 두 값을 더합니다.</text><rect x="188" y="252" width="196" height="473" rx="12" fill="#EDF5FD" stroke="#EDF5FD" stroke-width="1.5"/><text x="286" y="289" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">위치 1</text><rect x="234" y="314" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="286.0" y="356.0" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">1</text><text x="286" y="421" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">+</text><rect x="234" y="452" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="286.0" y="494.0" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">10</text><path d="M286,535 L286,609" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="234" y="627" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="286.0" y="669.0" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">11</text><rect x="417" y="252" width="196" height="473" rx="12" fill="#EDF7F5" stroke="#EDF7F5" stroke-width="1.5"/><text x="515" y="289" fill="#287D78" font-size="21" font-weight="600" text-anchor="middle">위치 2</text><rect x="463" y="314" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="515.0" y="356.0" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">2</text><text x="515" y="421" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">+</text><rect x="463" y="452" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="515.0" y="494.0" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">20</text><path d="M515,535 L515,609" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)"/><rect x="463" y="627" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="515.0" y="669.0" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">22</text><rect x="646" y="252" width="196" height="473" rx="12" fill="#FFF2E6" stroke="#FFF2E6" stroke-width="1.5"/><text x="744" y="289" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">위치 3</text><rect x="692" y="314" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="744.0" y="356.0" fill="#B55B22" font-size="30" font-weight="600" text-anchor="middle">3</text><text x="744" y="421" fill="#B55B22" font-size="30" font-weight="600" text-anchor="middle">+</text><rect x="692" y="452" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="744.0" y="494.0" fill="#B55B22" font-size="30" font-weight="600" text-anchor="middle">30</text><path d="M744,535 L744,609" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><rect x="692" y="627" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="744.0" y="669.0" fill="#B55B22" font-size="30" font-weight="600" text-anchor="middle">33</text><rect x="875" y="252" width="196" height="473" rx="12" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><text x="973" y="289" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">위치 4</text><rect x="921" y="314" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="973.0" y="356.0" fill="#7954A3" font-size="30" font-weight="600" text-anchor="middle">4</text><text x="973" y="421" fill="#7954A3" font-size="30" font-weight="600" text-anchor="middle">+</text><rect x="921" y="452" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="973.0" y="494.0" fill="#7954A3" font-size="30" font-weight="600" text-anchor="middle">40</text><path d="M973,535 L973,609" fill="none" stroke="#7954A3" stroke-width="3" marker-end="url(#purple)"/><rect x="921" y="627" width="104" height="68" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="973.0" y="669.0" fill="#7954A3" font-size="30" font-weight="600" text-anchor="middle">44</text><text x="75" y="357" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">입력 A</text><text x="75" y="495" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">입력 B</text><text x="75" y="670" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">출력 C</text><text x="600" y="786" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">C의 각 원소 = 같은 위치의 A 원소 + B 원소</text><text x="600" y="840" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">다른 위치의 출력이 완성되기를 기다릴 필요가 없습니다.</text></svg>