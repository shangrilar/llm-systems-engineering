<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2465" viewBox="0 0 1200 2465" role="img" aria-labelledby="title desc"><title id="title">Tree: reduce, then broadcast</title><desc id="desc">Four panels keep the same tree layout: two reduction steps to GPU 0, followed by two broadcast steps along reversed edges.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="2465" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Tree: reduce, then broadcast</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Each arrow carries a whole array. Boxes show values after transfer; faint lines show</text><text x="48" y="140.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">tree edges.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="204.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Start: the same four input arrays as the ring</text><rect x="48" y="225" width="264" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="255.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[1, 2, 3, 4]</text><text x="66" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">Send the whole array</text><rect x="328" y="225" width="264" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="255.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">GPU 1</text><text x="346" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[10, 20, 30, 40]</text><text x="346" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">Send the whole array</text><rect x="608" y="225" width="264" height="126" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="255.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">GPU 2</text><text x="626" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[100, 200, 300, 400]</text><text x="626" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">Send the whole array</text><rect x="888" y="225" width="264" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="255.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="start">GPU 3</text><text x="906" y="292.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="start">[1000, 2000, 3000, 4000]</text><text x="906" y="330.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">Send the whole array</text><text x="48" y="434.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Step 1 · reduce in two places</text><path d="M450,570 L330,624" stroke="#DCE4EC" stroke-width="2.5"/><path d="M750,570 L870,624" stroke="#DCE4EC" stroke-width="2.5"/><path d="M910,748 L910,791" stroke="#DCE4EC" stroke-width="2.5"/><path d="M330,624 L450,570" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M910,791 L910,748" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="426" y="458" width="348" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="492.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0 · root</text><text x="600" y="534.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[11, 22, 33, 44]</text><rect x="116" y="631" width="348" height="106" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="665.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">GPU 1</text><text x="290" y="707.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[10, 20, 30, 40]</text><rect x="736" y="631" width="348" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="910" y="665.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="910" y="707.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1100, 2200, 3300, 4400]</text><rect x="736" y="799" width="348" height="106" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="910" y="833.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="910" y="875.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1000, 2000, 3000, 4000]</text><text x="80" y="826.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">1 → 0, 3 → 2</text><text x="80" y="858.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Both transfers reduce in parallel</text><text x="48" y="944.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Step 2 · complete the sum on GPU 0</text><path d="M450,1080 L330,1134" stroke="#DCE4EC" stroke-width="2.5"/><path d="M750,1080 L870,1134" stroke="#DCE4EC" stroke-width="2.5"/><path d="M910,1258 L910,1301" stroke="#DCE4EC" stroke-width="2.5"/><path d="M870,1134 L750,1080" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="426" y="968" width="348" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="1002.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0 · root</text><text x="600" y="1044.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><rect x="116" y="1141" width="348" height="106" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="1175.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">GPU 1</text><text x="290" y="1217.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[10, 20, 30, 40]</text><rect x="736" y="1141" width="348" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="910" y="1175.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="910" y="1217.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1100, 2200, 3300, 4400]</text><rect x="736" y="1309" width="348" height="106" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="910" y="1343.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="910" y="1385.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1000, 2000, 3000, 4000]</text><text x="80" y="1336.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">2 → 0</text><text x="80" y="1368.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Add the two partial sums</text><text x="48" y="1454.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Step 3 · broadcast from GPU 0 to GPU 2</text><path d="M450,1590 L330,1644" stroke="#DCE4EC" stroke-width="2.5"/><path d="M750,1590 L870,1644" stroke="#DCE4EC" stroke-width="2.5"/><path d="M910,1768 L910,1811" stroke="#DCE4EC" stroke-width="2.5"/><path d="M750,1590 L870,1644" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="426" y="1478" width="348" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="1512.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0 · root</text><text x="600" y="1554.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><rect x="116" y="1651" width="348" height="106" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="1685.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">GPU 1</text><text x="290" y="1727.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[10, 20, 30, 40]</text><rect x="736" y="1651" width="348" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="910" y="1685.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="910" y="1727.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><rect x="736" y="1819" width="348" height="106" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="910" y="1853.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="910" y="1895.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1000, 2000, 3000, 4000]</text><text x="80" y="1846.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">0 → 2</text><text x="80" y="1878.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Copy the completed array</text><text x="48" y="1964.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Step 4 · broadcast to GPUs 1 and 3</text><path d="M450,2100 L330,2154" stroke="#DCE4EC" stroke-width="2.5"/><path d="M750,2100 L870,2154" stroke="#DCE4EC" stroke-width="2.5"/><path d="M910,2278 L910,2321" stroke="#DCE4EC" stroke-width="2.5"/><path d="M450,2100 L330,2154" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M910,2278 L910,2321" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="426" y="1988" width="348" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="2022.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0 · root</text><text x="600" y="2064.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><rect x="116" y="2161" width="348" height="106" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="290" y="2195.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">GPU 1</text><text x="290" y="2237.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><rect x="736" y="2161" width="348" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="910" y="2195.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">GPU 2</text><text x="910" y="2237.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><rect x="736" y="2329" width="348" height="106" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="910" y="2363.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="910" y="2405.0" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">[1111, 2222, 3333, 4444]</text><text x="80" y="2356.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">0 → 1, 2 → 3</text><text x="80" y="2388.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Copy without adding again</text></svg>