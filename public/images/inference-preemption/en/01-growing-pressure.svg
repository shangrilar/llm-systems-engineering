<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">Running out of KV space during generation</title><desc id="desc">A and B each hold seven KV positions in a four-block pool. Each fills its final empty slot, reaching eight positions. Processing position eight then requires a new block, but none is free.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1060" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Running out of KV space during generation</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Once the remaining positions fill, the next input requires another block.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">KV pool: 4 blocks · 4 positions per block · No sharing</text><text x="48" y="265.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. One position remains in each tail block</text><rect x="48" y="294" width="260" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="324.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">P0 · A</text><rect x="60" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88.0" y="371.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="120" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="148.0" y="371.0" fill="#2470BB" font-si