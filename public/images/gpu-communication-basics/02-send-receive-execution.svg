<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc"><title id="title">계산 A의 결과가 계산 B에 도착하기까지</title><desc id="desc">상단 CPU 프로세스 0은 GPU 0의 스트림 S0에 A와 송신을, 프로세스 1은 GPU 1의 스트림 S1에 수신과 B를 등록한다. 상단은 시간축이 아니다. 하단 공통 시간축에서 GPU 1은 수신 작업을 먼저 시작해 기다린다. GPU 0의 A가 끝난 뒤 송신과 데이터 수신이 함께 진행된다. 수신 완료 뒤 B가 실행된다. 송신과 수신은 같은 데이터 전달에 참여한다. CPU 호출 반환은 GPU 수신 완료나 B 완료와 다르다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1340" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 13 · 그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">계산 A의 결과가 계산 B에 도착하기까지</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">CPU의 등록 순서와 두 GPU에서 실제로 진행되는 작업을 구별합니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="228" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU: 각 프로세스가 맡은 GPU에 작업 등록</text><text x="48" y="268" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">위쪽은 등록 순서이며, 두 CPU 호출이 같은 시각일 필요는 없습니다.</text><rect x="48" y="298" width="1104" height="270" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="356" fill="#182C40" font-size="26" font-weight="600" text-anchor="start">프로세스 0</text><text x="76" y="392" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">GPU 0 · S₀</text><text x="76" y="490" fill="#182C40" font-size="26" font-weight="600" text-anchor="start">프로세스 1</text><text x="76" y="526" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">GPU 1 · S₁</text><rect x="292" y="318" width="324" height="94" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="454.0" y="374.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">계산 A 등록</text><path d="M626,365 H662" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="674" y="318" width="430" height="94" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="889.0" y="359.0" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">송신 등록</text><text x="889.0" y="394.0" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">ncclSend(...)</text><rect x="292" y="452" width="324" height="94" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="454.0" y="493.0" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">수신 등록</text><text x="454.0" y="528.0" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">ncclRecv(...)</text><path d="M626,499 H662" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="674" y="452" width="430" height="94" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="889.0" y="508.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">계산 B 등록</text><text x="600" y="615" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">호출이 반환되어도 GPU의 수신이나 계산이 끝난 것은 아닙니다.</text><text x="48" y="697" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU: 각 스트림의 순서와 송수신을 연결해 실행</text><path d="M250,747 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="732" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="838" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0</text><text x="48" y="875" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">스트림 S₀</text><rect x="250" y="803" width="320" height="88" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="410.0" y="856.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">계산 A</text><rect x="570" y="803" width="305" height="88" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="722.5" y="856.0" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">송신</text><text x="570" y="784" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">A 완료</text><text x="875" y="784" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="middle">송신 완료</text><path d="M600,902 V965" fill="none" stroke="#4C60A8" stroke-width="2.5" marker-end="url(#comm)"/><text x="632" y="942" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">NCCL로 데이터 전달</text><text x="48" y="1025" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="1062" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">스트림 S₁</text><rect x="250" y="985" width="320" height="88" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="410.0" y="1038.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">수신에서 대기</text><rect x="570" y="985" width="305" height="88" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="722.5" y="1038.0" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">데이터 수신</text><rect x="875" y="985" width="255" height="88" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1002.5" y="1038.0" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">계산 B</text><path d="M250,1086 v10 H875 v-10" fill="none" stroke="#4C60A8" stroke-width="2"/><text x="562.5" y="1132" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="middle">하나의 수신 작업</text><path d="M875,1084 V1145" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="888" y="1125" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="start">수신 완료</text><text x="1130" y="1125" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">B 완료</text><rect x="48" y="1190" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1235" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">GPU 0의 순서 → NCCL 송수신 → GPU 1의 순서</text><text x="600" y="1274" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">수신 완료 뒤에 B가 실행됩니다.</text></svg>