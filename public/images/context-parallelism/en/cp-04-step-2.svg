<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1245" viewBox="0 0 1200 1245" role="img" aria-labelledby="title desc"><title id="title">Ulysses: switch from token shards to head shards</title><desc id="desc">Each GPU computes full-context attention for its assigned head.</desc><metadata>{&quot;id&quot;:&quot;cp-04-step-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><marker id="ported-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.5" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Ulysses: switch from token shards to head shards</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Rearrange Q·K·V and outputs, not weights · The original work also calls this Sequence</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Parallelism.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1)" data-panel="1"><g transform="translate(-48 -148)"><rect x="40" y="137" width="220" height="44" rx="10" fill="#F1F4F7" stroke="#F1F4F7" stroke-width="1.5"/><text x="150" y="166" font-size="20" fill="#5C6C7C" font-weight="700" text-anchor="middle">Token shards</text><rect x="273" y="137" width="220" height="44" rx="10" fill="#F1F4F7" stroke="#F1F4F7" stroke-width="1.5"/><text x="383" y="166" font-size="20" fill="#5C6C7C" font-weight="700" text-anchor="middle">All-to-All</text><rect x="506" y="137" width="220" height="44" rx="10" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><text x="616" y="166" font-size="20" fill="#7954A3" font-weight="700" text-anchor="middle">Attention per head</text><rect x="739" y="137" width="220" height="44" rx="10" fill="#F1F4F7" stroke="#F1F4F7" stroke-width="1.5"/><text x="849" y="166" font-size="20" fill="#5C6C7C" font-weight="700" text-anchor="middle">Reverse All-to-All</text><rect x="972" y="137" width="220" height="44" rx="10" fill="#F1F4F7" stroke="#F1F4F7" stroke-width="1.5"/><text x="1082" y="166" font-size="20" fill="#5C6C7C" font-weight="700" text-anchor="middle">Restore token shards</text><rect x="48" y="213" width="528" height="621" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="70" y="247" font-size="24" fill="#2470BB" font-weight="700" text-anchor="start">GPU 0</text><rect x="624" y="213" width="528" height="621" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><text x="646" y="247" font-size="24" fill="#B55B22" font-weight="700" text-anchor="start">GPU 1</text><text x="312" y="350" font-size="20" fill="#182C40" font-weight="700" text-anchor="middle">O = Attention(Q,K,V)</text><rect x="282" y="365" width="60" height="60" fill="#EDF5FD" stroke="#2470BB" stroke-width="1"/><text x="312" y="406.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="425" width="60" height="60" fill="#EDF5FD" stroke="#2470BB" stroke-width="1"/><text x="312" y="466.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="485" width="60" height="60" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="312" y="526.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h0</text><rect x="282" y="545" width="60" height="60" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="312" y="586.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h0</text><text x="272" y="407" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t0</text><text x="272" y="467" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t1</text><text x="272" y="527" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t2</text><text x="272" y="587" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t3</text><text x="312" y="753" font-size="20" fill="#2470BB" font-weight="700" text-anchor="middle">Head h0: All Q tokens × All K tokens</text><text x="888" y="350" font-size="20" fill="#182C40" font-weight="700" text-anchor="middle">O = Attention(Q,K,V)</text><rect x="858" y="365" width="60" height="60" fill="#EDF5FD" stroke="#2470BB" stroke-width="1"/><text x="888" y="406.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="425" width="60" height="60" fill="#EDF5FD" stroke="#2470BB" stroke-width="1"/><text x="888" y="466.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="485" width="60" height="60" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="888" y="526.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h1</text><rect x="858" y="545" width="60" height="60" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="888" y="586.4" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">h1</text><text x="848" y="407" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t0</text><text x="848" y="467" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t1</text><text x="848" y="527" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t2</text><text x="848" y="587" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t3</text><text x="888" y="753" font-size="20" fill="#B55B22" font-weight="700" text-anchor="middle">Head h1: All Q tokens × All K tokens</text><rect x="276" y="864" width="648" height="44" rx="10" fill="#EDF7F5" stroke="#EDF7F5" stroke-width="1.5"/><text x="600" y="893" font-size="20" fill="#287D78" font-weight="700" text-anchor="middle">Each head’s full context is now on one GPU.</text><text x="600" y="949" font-size="24" fill="#182C40" font-weight="700" text-anchor="middle">Complete attention locally for the assigned head.</text><text x="600" y="1025" font-size="21" fill="#5C6C7C" font-weight="400" text-anchor="middle">Example: 4 tokens · 2 heads · 2 GPUs / Basic multi-head attention</text></g></g><path d="M48,1166.2 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1204.2" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The forward pass needs two All-to-All operations, one before and one after attention.</text></svg>