<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1071" viewBox="0 0 1200 1071" role="img" aria-labelledby="title desc"><title id="title">실행 사이에 다음 배치를 다시 구성하기</title><desc id="desc">실행 결과 A가 완료되고 B는 계속 생성한다. A가 독점 소유한 GPU KV를 반환하고 B의 KV는 유지한다. GPU KV가 없는 새 요청 C·D를 도착 순서대로 검토해 자원이 충분한 C를 합류시킨다. 최대 두 요청을 실행하는 예시에서 다음 배치는 B의 Decode와 C의 Prefill이며 D는 기다린다. 실행 결과를 다시 반영하는 화살표가 반복을 나타낸다.</desc><metadata>{&quot;id&quot;:&quot;02-scheduling-cycle&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><marker id="ported-batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#5C6C7C" stroke-width="1.7" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">실행 사이에 다음 배치를 다시 구성하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">대기 큐, 진행 중인 요청의 상태, 실제로 실행할 배치는 서로 구별합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">1. 실행 결과</text><rect x="48" y="249" width="352" height="552" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="424" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">2. 상태 갱신과 자원 확인</text><rect x="424" y="249" width="352" height="552" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">3. 다음 배치 실행</text><rect x="800" y="249" width="352" height="552" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="294" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">진행 중인 요청</text><rect x="72" y="314" width="304" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="224" y="348.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · 완료 ✓</text><rect x="72" y="380" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="224" y="414.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 계속 생성</text><text x="72" y="481" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU에 보관 중인 KV</text><rect x="72" y="502" width="144" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="144" y="536.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A KV</text><rect x="232" y="502" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="304" y="536.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><path d="M72,590 H376" stroke="#DCE4EC"/><text x="72" y="630" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">대기 큐 · 도착 순서</text><rect x="72" y="651" width="144" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="144" y="685.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C</text><rect x="232" y="651" width="144" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="304" y="685.16" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">D</text><text x="224" y="749" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">C·D는 GPU KV 없음</text><text x="448" y="294" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">A 제거, B 유지</text><rect x="448" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 계속 생성</text><text x="448" y="413" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">A의 KV 공간 반환</text><rect x="448" y="437" width="144" height="52" rx="8" fill="white" stroke="#2470BB" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520" y="471" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">반환됨</text><rect x="608" y="437" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="680" y="471.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><rect x="448" y="537" width="304" height="218" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="577" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">C부터 합류 검토</text><text x="472" y="632" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ 실행 토큰 예산</text><text x="472" y="674" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ 필요한 KV 공간</text><text x="600" y="723" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">이 예시에서는 충분</text><text x="824" y="294" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">이번에 선택한 작업</text><rect x="824" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="976" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · Decode</text><rect x="824" y="380" width="304" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="976" y="414.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · Prefill</text><path d="M976,443 L976,474" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="824" y="489" width="304" height="91" rx="10" fill="#EEF1FC" stroke="#5C6C7C" stroke-width="1.5"/><text x="976" y="544" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">GPU 실행</text><path d="M824,617 H1128" stroke="#DCE4EC"/><text x="824" y="657" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">대기 큐</text><rect x="824" y="679" width="304" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="976" y="712.82" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">D · 다음 기회 대기</text><text x="976" y="774" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">동시에 최대 2개 요청</text><path d="M403,340 L419,340" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><path d="M779,340 L795,340" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><path d="M1132,535 H1175 V872 H24 V340 H43" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><text x="600" y="847" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">실행 결과를 반영하고, 다음 배치를 다시 구성</text><text x="48" y="932" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">완료된 요청이 없어도, 자원이 충분하면 새 요청을 추가할 수 있습니다.</text></g></g><path d="M48,993 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1031" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">완료된 요청의 KV를 반환하고, 도착 순서대로 자원이 충분한 새 요청을 다음 배치에 합류시킵니다.</text></svg>