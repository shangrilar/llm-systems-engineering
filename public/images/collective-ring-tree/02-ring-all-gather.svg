"710.4000000000001" y="528" width="214.8" height="80" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C · D</text><rect x="931.2" y="528" width="214.8" height="80" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="562.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A · B · C · D</text><rect x="48" y="650" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="686.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">GPU 0 → GPU 1 → GPU 2 → GPU 3 → GPU 0</text><text x="72" y="726.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">완성된 조각을 한 개씩 전달합니다. 다시 더하지 않습니다.</text><rect x="48" y="784" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="820.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">모든 GPU의 최종 결과</text><text x="72" y="860.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">[A, B, C, D] = [1111, 2222, 3333, 4444]</text></svg>