<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc"><title id="title">아직 읽지 않은 점수가 확률을 바꿉니다</title><desc id="desc">causal self-attention의 마지막 쿼리 토큰 행처럼 네 점수 모두 유효한 경우를 비교한다. 스케일링을 마친 앞의 두 점수는 0,0으로 같다. 나머지가 0,0이면 모든 지수값이 1이고 합은 4, 첫 확률은 25%이다. 나머지가 2,2이면 지수값이 1,1,exp(2),exp(2)이며 합은 약 16.78, 첫 확률은 약 5.96%로 그림에서는 6%로 표시한다. 소수는 반올림한 값이다. 최댓값을 빼는 수치 안정화와 온라인 갱신은 다음 편의 범위다. 아직 보지 않은 점수도 현재 점수의 최종 확률에 영향을 미친다는 의존성을 보여준다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1300" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">아직 읽지 않은 점수가 확률을 바꿉니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 앞쪽 점수에 서로 다른 나머지 점수를 이어 붙여 비교합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="216" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">네 점수 모두 유효한 한 행 · 앞의 두 점수만 계산한 상태</text><rect x="390" y="256" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="438.0" y="296.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="495" y="256" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="543.0" y="296.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="600" y="256" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="648.0" y="296.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">?</text><rect x="705" y="256" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="753.0" y="296.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">?</text><text x="600" y="364" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">확률 = 해당 점수의 지수값 ÷ 행 전체 지수값의 합</text><path d="M600,391 V427 H316 V458" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M600,427 H884 V458" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="48" y="478" width="536" height="529" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="524" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">나머지 점수가 0, 0이면</text><text x="79" y="568" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">점수</text><rect x="109" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="157.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="214" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="262.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="319" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="367.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="424" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="472.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">0</text><text x="79" y="696" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">지수값</text><rect x="109" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="157.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="214" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="262.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="319" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="367.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="424" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="472.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">1</text><text x="316" y="829" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">행 전체의 합 = 4</text><rect x="78" y="862" width="476" height="105" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="316" y="901" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">첫 번째 점수 0의 확률</text><text x="316" y="946" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">1 ÷ 4 = 25%</text><rect x="616" y="478" width="536" height="529" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="524" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">나머지 점수가 2, 2이면</text><text x="647" y="568" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">점수</text><rect x="677" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="725.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="782" y="589" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="830.0" y="629.0" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">0</text><rect x="887" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="935.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">2</text><rect x="992" y="589" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="1040.0" y="629.0" fill="#7954A3" font-size="28" font-weight="600" text-anchor="middle">2</text><text x="647" y="696" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">지수값</text><rect x="677" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="725.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="782" y="717" width="96" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="830.0" y="757.0" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1</text><rect x="887" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="935.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">7.39</text><rect x="992" y="717" width="96" height="64" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="1040.0" y="757.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">7.39</text><text x="884" y="829" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">행 전체의 합 ≈ 16.78</text><rect x="646" y="862" width="476" height="105" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="884" y="901" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">첫 번째 점수 0의 확률</text><text x="884" y="946" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">1 ÷ 16.78 ≈ 6%</text><text x="600" y="1061" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">앞의 점수는 같아도, 뒤의 점수에 따라 앞의 확률이 달라집니다.</text><rect x="48" y="1110" width="1104" height="138" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="1161" fill="#7954A3" font-size="28" font-weight="400" text-anchor="middle">전체 점수를 저장하지 않고, 일부씩 읽으면서</text><text x="600" y="1205" fill="#7954A3" font-size="28" font-weight="400" text-anchor="middle">정규화에 필요한 정보를 구할 수 있을까요?</text></svg>