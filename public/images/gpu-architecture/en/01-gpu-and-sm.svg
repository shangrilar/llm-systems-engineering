<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">From the GPU to the Inside of an SM</title><desc id="desc">The GPU chip contains multiple SMs and an L2 cache, with HBM outside the chip. An enlarged SM shows instruction control, CUDA Cores, Tensor Cores, registers, L1 cache, and shared memory. CUDA Cores are illustrated with scalar arithmetic and Tensor Cores with matrix multiplication and accumulation.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1050" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">From the GPU to the Inside of an SM</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Each SM contains compute units and nearby storage.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="218" width="430" height="600" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="72" y="262" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU chip</text><rect x="74" y="292" width="176" height="90" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="162" y="329" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">SM</text><rect x="96" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="123" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="150" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="177" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="204" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="276" y="292" width="176" height="90" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="364" y="329" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">SM</text><rect x="298" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="325" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="352" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="379" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="406" y="348" width="22" height="14" rx="2" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="74" y="404" width="176" height="90" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="162" y="441" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">SM</text><rect x="96" y="460" w