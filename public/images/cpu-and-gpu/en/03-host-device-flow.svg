<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc"><title id="title">The CPU requests work; the GPU computes</title><desc id="desc">The host copies inputs and requests execution. Two GPU operations keep intermediate data on the device. Needed results are copied back after completion.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1250" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">The CPU requests work; the GPU computes</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Follow an input from preparation to result retrieval.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="208" width="410" height="804" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="710" y="208" width="442" height="804" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="253" y="252" fill="#182C40" font-size="32" font-weight="700" text-anchor="middle">Host</text><text x="253" y="286" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">CPU + host memory</text><text x="931" y="252" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">Device</text><text x="931" y="286" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">GPU + GPU memory</text><rect x="80" y="328" width="346" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="253.0" y="371.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">① CPU prepares input</text><rect x="750" y="328" width="362" height="70" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="931.0" y="371.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">GPU memory</text><path d="M427,365 L742,365" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue)"/><text x="584" y="341" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">② Copy data</text><path d="M253,403 L253,452" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="80" y="466" width="346" height="76" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="253.0" y="512.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">③ Request GPU work</text><path d="M427,503 L741,503" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7"/><text x="584" y="479" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="middle">Execution request</text><path d="M931,403 L931,456" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue)"/><rect x="750" y="466" width="362" height="354" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="931" y="506" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">④ Compute on GPU</text><rect x="798" y="534" width="266" height="56" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="931.0" y="570.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Operation A</text><path d="M931,594 L931,623" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="798" y="634" width="266" height="48" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="931.0" y="666.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Intermediate data</text><path d="M931,686 L931,715" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="798" y="726" width="266" height="56" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="931.0" y="762.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Operation B</text><text x="253" y="665" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">When needed,</text><text x="253" y="702" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">wait for completion.</text><path d="M931,825 L931,882" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="750" y="899" width="362" height="66" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="931.0" y="940.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Result data</text><rect x="80" y="899" width="346" height="66" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="253.0" y="940.0" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Use the needed results</text><path d="M747,932 L433,932" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue)"/><text x="584" y="905" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">⑤ Copy results</text><path d="M70,1060 L136,1060" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue)"/><text x="151" y="1068" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">Data transfer</text><path d="M449,1060 L515,1060" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7"/><text x="532" y="1068" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Execution request</text><text x="48" y="1122" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Intermediate results can stay on the GPU for the next operation.</text><path d="M48,1172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1212" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">CPU and GPU use separate memories here. Weights are already stored in GPU memory.</text></svg>