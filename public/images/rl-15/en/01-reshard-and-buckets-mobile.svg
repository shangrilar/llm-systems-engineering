dth="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="434" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">13</text><rect x="150" y="394" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="434" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">14</text><rect x="216" y="394" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="434" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">15</text><rect x="282" y="394" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="434" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">16</text><path d="M214 188 L214 468" stroke="#182C40" stroke-width="3" fill="none" stroke-dasharray="7 5"/><path d="M214 477 L214 515" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="38" y="535" width="442" height="103" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="54" y="566" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="410">Same 16 values · rearrange the</text><text x="54" y="596.8" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="410">pieces</text></g><path d="M214 656 L214 696" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="8" y="742" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="512">Inference · two row shards</text><rect x="84" y="782" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="822" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">1</text><rect x="150" y="782" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="822" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">2</text><rect x="216" y="782" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="822" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">3</text><rect x="282" y="782" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="313" y="822" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">4</text><rect x="84" y="848" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="888" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">5</text><rect x="150" y="848" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="888" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">6</text><rect x="216" y="848" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="888" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">7</text><rect x="282" y="848" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="313" y="888" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">8</text><rect x="84" y="914" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="954" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">9</text><rect x="150" y="914" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="954" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">10</text><rect x="216" y="914" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="954" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">11</text><rect x="282" y="914" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="954" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">12</text><rect x="84" y="980" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="1020" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">13</text><rect x="150" y="980" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="1020" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">14</text><rect x="216" y="980" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="1020" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">15</text><rect x="282" y="980" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="1020" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">16</text><path d="M74 912 L358 912" stroke="#182C40" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="372" y="851" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start" data-max-width="130">GPU 0</text><text x="372" y="982" fill="#287D78" font-size="21" font-weight="400" text-anchor="start" data-max-width="130">GPU 1</text><text x="8" y="1120" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="504">Dashed line = shard boundary between GPUs</text></g><g transform="translate(16 1021.3076923076923) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">From tensors to transfer units</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="103" width="488" height="128" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">① Gather weight pieces</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Collect the required pieces from training</text><text x="32" y="202" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">GPUs</text></g><path d="M260 244 L260 275" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="294" width="488" height="128" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="325" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">② Convert to the inference format</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Match the partitioning and storage format</text><text x="32" y="393" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">of inference GPUs</text></g><path d="M260 434 L260 465" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="483" width="488" height="164" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="514" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">③ Pack pieces into a bucket</text><text x="32" y="554" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">A transfer unit may contain pieces from</text><text x="32" y="582" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">multiple tensors; it is not the whole model</text></g><text x="16" y="704" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Preparation and transfer may overlap</text><path d="M154 764 L496 764" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="412" y="747" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-width="90">Time</text><text x="16" y="817" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="135">Bucket 1</text><rect x="154" y="782" width="108" height="52" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="208" y="816" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="96">Prep</text><rect x="268" y="782" width="222" height="52" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="379" y="816" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="210">Send</text><text x="16" y="897" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="135">Bucket 2</text><rect x="268" y="862" width="108" height="52" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="322" y="896" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="96">Prep</text><rect x="382" y="862" width="108" height="52" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="436" y="896" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="96">Send</text><path d="M268 848 L376 848" stroke="#5C6C7C" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M268 841 L268 855" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M376 841 L376 855" stroke="#5C6C7C" stroke-width="2" fill="none"/><text x="16" y="974" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Dashed interval: B2 can be prepared while B1</text><text x="16" y="1003.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">transfers</text><text x="16" y="1082" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">Bar lengths are not measurements. Actual</text><text x="16" y="1111.4" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">overlap depends on buffers, streams and</text><text x="16" y="1140.8" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">transport implementation.</text></g></svg>