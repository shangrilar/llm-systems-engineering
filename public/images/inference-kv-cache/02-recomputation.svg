<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc"><title id="title">캐시가 없으면 입력 문맥을 다시 계산합니다</title><desc id="desc">캐시가 없을 때 첫 실행은 p0 p1 p2를 계산해 x0를 선택합니다. 다음 실행은 p0 p1 p2를 재계산하고 x0를 새로 계산해 x1을 선택합니다. 그 다음은 p0 p1 p2 x0를 재계산하고 x1을 새로 계산해 x2를 선택합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1280" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">캐시가 없으면 입력 문맥을 다시 계산합니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">같은 세 실행에서 모델의 각 층이 계산하는 위치를 펼쳐 봅니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">x0 생성</text><rect x="48" y="247" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><path d="M86,312 L86,334" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="136" y="247" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><path d="M174,312 L174,334" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="224" y="247" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><path d="M262,312 L262,334" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="30" y="341" width="854" height="112" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="48" y="360" width="76" height="72" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="86" y="389.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">p0</text><text x="86" y="417.0" fill="#B55B22" font-size="18" font-weight="400" text-anchor="middle">계산</text><rect x="136" y="360" width="76" height="72" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="174" y="389.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">p1</text><text x="174" y="417.0" fill="#B55B22" font-size="18" font-weight="400" text-anchor="middle">계산</text><rect x="224" y="360" width="76" height="72" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="262" y="389.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">p2</text><text x="262" y="417.0" fill="#B55B22" font-size="18" font-weight="400" text-anchor="middle">계산</text><text x="694" y="385.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">모델의 각 층</text><text x="694" y="422.0" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">이 위치들을 계산</text><path d="M896,396 L1034,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="965" y="375.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">선택</text><rect x="1044" y="368" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="405.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="48" y="530.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">x1 생성</text><rect x="48" y="557" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="594.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="mid