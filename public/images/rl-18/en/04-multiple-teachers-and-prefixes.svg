<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1375" viewBox="0 0 1200 1375" role="img" aria-labelledby="title desc"><title id="title">Choose both the teacher and the student’s starting context</title><desc id="desc">Standard MOPD on the left generates a full student rollout from the prompt and uses a mixRL teacher. On the right, h1 contains P and two source turns, while h2 contains P and three source turns from teacher rollouts or SFT data. They independently start fresh student turns y1 (turn 3) and y2 (turn 4), supervised by an assigned teacher. Both paths update the student.</desc><metadata>{&quot;id&quot;:&quot;5-4&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;MiMo V2.6 §5.6 · Figure 13&quot;,&quot;url&quot;:&quot;https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL/blob/main/MiMo_V2_6_technical_report.pdf&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Choose both the teacher and the student’s starting context</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">MiMo MOPD² uses both full student rollouts and single turns starting from prepared</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">conversation histories.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Full student rollout</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="112" width="488" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="143" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Verifiable domains</text><text x="32" y="183" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Use a suitable mixRL teacher</text></g><g data-container="true"><rect x="16" y="286" width="488" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="317" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Task prompt P</text><text x="32" y="357" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Supplied starting context</text></g><path d="M260 388 L260 448" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="461" width="488" height="164" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="492" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Full student rollout</text><text x="32" y="532" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">y₁ → y₂ → … → yT</text><text x="32" y="560" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">The student continues later interactions</text></g><path d="M260 637 L260 755" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M508 165 H518 V807 H508" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="768" width="488" height="145" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="799" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Teacher scores the same contexts</text><text x="32" y="839" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Condition on preceding student tokens</text><text x="32" y="867" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Provide token-level probability information</text></g><path d="M260 925 L260 964" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="977" width="488" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="1008" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Student loss → student weight update</text></g></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">One turn from a prepared history</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="112" width="488" height="130" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="143" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Source of histories</text><text x="32" y="183" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Teacher rollout or SFT data</text><text x="32" y="211" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Cut just before each assistant turn</text></g><text x="16" y="322" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">h₁ · P + 2 source turns</text><g data-container="true"><rect x="16" y="350" width="48" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="381" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="16">P</text></g><rect x="72" y="350" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="111" y="382" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">Source</text><text x="111" y="422" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">Turn 1</text><rect x="158" y="350" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="197" y="382" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">Source</text><text x="197" y="422" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">Turn 2</text><path d="M246 402 L366 402" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="378" y="350" width="126" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="441" y="382" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle" data-max-width="106">y₁</text><text x="441" y="422" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="112">New turn 3</text><path d="M508 402 H518 V720" stroke="#2470BB" stroke-width="2" fill="none"/><text x="16" y="517" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">h₂ · P + 3 source turns</text><g data-container="true"><rect x="16" y="545" width="48" height="104" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="576" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="16">P</text></g><rect x="72" y="545" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="111" y="577" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">Source</text><text x="111" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">Turn 1</text><rect x="158" y="545" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="197" y="577" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">Source</text><text x="197" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">Turn 2</text><rect x="244" y="545" width="78" height="104" rx="10" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="283" y="577" fill="#5C6C7C" font-size="18" font-weight="600" text-anchor="middle" data-max-width="66">Source</text><text x="283" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="66">Turn 3</text><path d="M332 597 L366 597" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="378" y="545" width="126" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="441" y="577" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle" data-max-width="106">y₂</text><text x="441" y="617" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle" data-max-width="112">New turn 4</text><path d="M508 597 H518 V720" stroke="#2470BB" stroke-width="2" fill="none"/><path d="M518 720 H260 V755" stroke="#2470BB" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="768" width="488" height="145" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="799" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Assigned domain teacher scores</text><text x="32" y="839" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">mixRL teacher or SFT teacher</text><text x="32" y="867" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Context: same hᵢ + preceding student tokens</text></g><path d="M260 925 L260 964" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="977" width="488" height="76" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="1008" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Student loss → student weight update</text></g></g></svg>