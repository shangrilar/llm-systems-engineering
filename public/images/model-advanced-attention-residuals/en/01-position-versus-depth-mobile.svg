-size="17" font-weight="400" text-anchor="start" data-max-width="328">output · e is the embedding</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Standard residual · Accumulate</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="160" y="120" width="270" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="295" y="158" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="258">e</text><path d="M295 190 L295 210" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><circle cx="295" cy="237" r="19" fill="#FFFFFF" stroke="#287D78"/><text x="295" y="244" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle" data-max-width="35">+</text><rect x="20" y="213" width="110" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="75" y="245" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="98">f₁</text><path d="M140 237 L267 237" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M295 263 L295 268" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="160" y="275" width="270" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="295" y="313" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="258">e + f₁</text><path d="M295 345 L295 365" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><circle cx="295" cy="392" r="19" fill="#FFFFFF" stroke="#287D78"/><text x="295" y="399" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle" data-max-width="35">+</text><rect x="20" y="368" width="110" height="48" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="75" y="400" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="98">f₂</text><path d="M140 392 L267 392" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M295 418 L295 423" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="160" y="430" width="270" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="295" y="468" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="258">e + f₁ + f₂</text><path d="M295 500 L295 542" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="160" y="554" width="270" height="102" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="176" y="585" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="238">F₃ · Next step</text><text x="176" y="625" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="238">Read the sum</text></g><path d="M295 666 L295 705" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="190" y="717" width="210" height="58" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="295" y="754" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">f₃</text></g><g transform="translate(16 749.7846153846153) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. AttnRes · Select by source</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="50" y="120" width="230" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="165" y="158" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">e</text><text x="320" y="159" fill="#7954A3" font-size="27" font-weight="400" text-anchor="start" data-max-width="170">× α₀</text><path d="M165 190 V195 H460" stroke="#7954A3" stroke-width="2" fill="none"/><rect x="50" y="230" width="230" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="165" y="268" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">f₁</text><text x="320" y="269" fill="#7954A3" font-size="27" font-weight="400" text-anchor="start" data-max-width="170">× α₁</text><path d="M165 300 V305 H460" stroke="#7954A3" stroke-width="2" fill="none"/><rect x="50" y="340" width="230" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="165" y="378" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">f₂</text><text x="320" y="379" fill="#7954A3" font-size="27" font-weight="400" text-anchor="start" data-max-width="170">× α₂</text><path d="M165 410 V415 H460" stroke="#7954A3" stroke-width="2" fill="none"/><path d="M460 195 L460 458" stroke="#7954A3" stroke-width="2" fill="none"/><path d="M460 458 H260 V488" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="55" y="500" width="410" height="92" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="71" y="531" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">Weighted input for this sublayer</text><text x="71" y="571" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">h₃ = α₀e + α₁f₁ + α₂f₂</text></g><path d="M260 602 L260 640" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="155" y="652" width="210" height="62" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="691" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="198">F₃ → f₃</text><text x="260" y="760" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="490">After computing, add f₃ as a new source</text><text x="260" y="803" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="490">Selection axis: token position → depth</text></g></svg>