<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="881" viewBox="0 0 1200 881" role="img" aria-labelledby="title desc"><title id="title">EP: dispatch tokens and return the results</title><desc id="desc">Send t1 from GPU 0 to E2 on GPU 1, and t2 from GPU 1 to E1 on GPU 0, then return the results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="881" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">EP: dispatch tokens and return the results</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">E0–E3 are different experts. Start with top-1 routing: one expert per token.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="199" width="266" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="236.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Order</text><rect x="320" y="199" width="410" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="236.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0 · E0, E1</text><rect x="736" y="199" width="410" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="236.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1 · E2, E3</text><rect x="48" y="265" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="299.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Token origin</text><rect x="320" y="265" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="299.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0 → E0; t1 → E2</text><rect x="736" y="265" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="299.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t2 → E1; t3 → E2</text><rect x="48" y="393" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="427.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Dispatch to</text><text x="62" y="457.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">experts</text><rect x="320" y="393" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="427.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E0: t0</text><text x="334" y="457.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E1: t2</text><rect x="736" y="393" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="427.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E2: t1, t3</text><text x="750" y="457.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E3: —</text><rect x="48" y="521" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Expert computation</text><rect x="320" y="521" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E0(t0), E1(t2)</text><rect x="736" y="521" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">E2(t1), E2(t3)</text><rect x="48" y="649" width="266" height="120" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="683.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Return to origin</text><rect x="320" y="649" width="410" height="120" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="334" y="683.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">y(t0), y(t1)</text><rect x="736" y="649" width="410" height="120" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="750" y="683.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">y(t2), y(t3)</text><text x="48" y="825.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Token vectors and results move; expert weights stay on their assigned GPU.</text></svg>