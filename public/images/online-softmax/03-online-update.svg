<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1821" viewBox="0 0 1200 1821" role="img" aria-labelledby="title desc"><title id="title">새 점수를 반영해 max와 지수합 갱신하기</title><desc id="desc">점수 묶음 1,2 다음 0,1 다음 3,2를 순서대로 처리한다. 첫 상태는 m=2와 l 약 1.368이다. 0,1은 기존 최대보다 작으므로 m=2를 유지하고 exp(0-2)+exp(1-2) 약 0.503을 더해 l 약 1.871을 얻는다. 다음 3,2에서 m은 3으로 커진다. 이전 l 전체에 exp(2-3)을 곱해 약 0.688로 보정하고 새 묶음의 exp(3-3)+exp(2-3) 약 1.368을 더한다. 최종 m=3, l 약 2.056이다. 이전 점수들을 다시 읽지 않고 누적 지수합 한 값에 보정 배율을 곱한다. 이 그림은 정규화 통계의 계산만 다룬다. 모든 확률의 출력에는 각 점수를 최종 m,l로 정규화하는 과정이 추가로 필요하다. 그림 수치는 정확한 계산 후 반올림했다.</desc><metadata>{&quot;id&quot;:&quot;03-online-update&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">새 점수를 반영해 max와 지수합 갱신하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">점수 묶음을 순서대로 읽으며, 지금까지 처리한 점수의 두 값을 유지합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="205" width="1104" height="185" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="251" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">시작 · 첫 묶음 [1, 2]를 처리한 상태</text><rect x="85" y="284" width="110" height="66" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="140" y="325" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="205" y="284" width="110" height="66" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="260" y="325" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M356,318 L672,318" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="511" y="298" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">두 값 유지</text><rect x="709" y="284" width="169" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="793.5" y="325" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">m = 2</text><rect x="897" y="284" width="227" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1010.5" y="325" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ℓ ≈ 1.368</text><rect x="48" y="429" width="1104" height="422" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="475" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">① 새 묶음 [0, 1] · max 유지</text><rect x="83" y="506" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="138" y="547" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0</text><rect x="203" y="506" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="258" y="547" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><text x="386" y="547" fill="#7954A3" font-size="27" font-weight="700" text-anchor="start">max(기존 max 2, 묶음 max 1) = 2</text><rect x="83" y="615" width="362" height="73" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="264" y="659.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">기존 합 ≈ 1.368</text><text x="480" y="661" fill="#287D78" font-size="35" font-weight="700" text-anchor="middle">+</text><rect x="515" y="615" width="609" height="73" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="819.5" y="659.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">exp(0 − 2) + exp(1 − 2) ≈ 0.503</text><text x="264" y="726" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">같은 기준이므로 그대로</text><text x="819" y="726" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">새 점수도 max 2 기준으로 계산</text><text x="84" y="801" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">두 묶음을 반영한 상태</text><rect x="709" y="759" width="169" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="793.5" y="800" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">m = 2</text><rect x="897" y="759" width="227" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1010.5" y="800" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ℓ ≈ 1.871</text><path d="M980,864 L980,902" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="48" y="921" width="1104" height="485" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="968" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">② 새 묶음 [3, 2] · max 갱신</text><rect x="83" y="999" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="138" y="1040" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">3</text><rect x="203" y="999" width="110" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="258" y="1040" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><text x="386" y="1040" fill="#7954A3" font-size="27" font-weight="700" text-anchor="start">max(기존 max 2, 묶음 max 3) = 3</text><rect x="83" y="1107" width="450" height="73" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="308" y="1151.5" fill="#B55B22" font-size="28" font-weight="600" text-anchor="middle">기존 합 × exp(2 − 3)</text><text x="574" y="1153" fill="#287D78" font-size="35" font-weight="700" text-anchor="middle">+</text><rect x="615" y="1107" width="509" height="73" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="869.5" y="1151.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">exp(3 − 3) + exp(2 − 3)</text><text x="308" y="1220" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">≈ 1.871 × 0.368 ≈ 0.688</text><text x="869" y="1220" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">≈ 1.368</text><text x="308" y="1262" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle">이전 합을 max 3 기준으로 보정</text><text x="869" y="1262" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">새 점수도 max 3 기준으로 계산</text><text x="84" y="1355" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">모든 묶음을 반영한 상태</text><rect x="709" y="1312" width="169" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="793.5" y="1353" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">m = 3</text><rect x="897" y="1312" width="227" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1010.5" y="1353" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ℓ ≈ 2.056</text><rect x="48" y="1450" width="1104" height="170" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1499" fill="#287D78" font-size="29" font-weight="700" text-anchor="middle">max를 먼저 정하고, 같은 max 기준의 합끼리 더합니다.</text><text x="600" y="1550" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">새 지수합 = 기존 지수합 × exp(기존 max − 새 max)</text><text x="600" y="1591" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">+ 새 점수들의 exp(점수 − 새 max) 합</text><text x="600" y="1662" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">max가 같으면 보정 배율은 exp(0) = 1 · 소수는 반올림한 값</text></g></g><path d="M48,1713 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1751" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">이 그림은 정규화 통계의 계산만 다룹니다. 확률을 출력하려면 각 점수를 최종 m과 ℓ로 정규화하는 과정이 더</text><text x="48" y="1780.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">필요합니다.</text></svg>