e="#7954A3" stroke-width="1.5"/><rect x="763.8" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="845" y="235" width="206" height="85" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="859" y="264" fill="#B55B22" font-size="23" font-weight="700" text-anchor="start">D</text><rect x="860" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="895.2" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="930.4" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="965.6" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="1000.8" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><text x="600" y="366" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">한 배치의 순전파 · 파란 블록 = 계산 · 회색 구간 = 이 배치의 계산 없음</text><text x="248" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">0</text><text x="302" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">1</text><text x="356" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">2</text><text x="410" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">3</text><text x="464" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">4</text><text x="518" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">5</text><text x="572" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">6</text><text x="626" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">7</text><text x="680" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">8</text><text x="734" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">9</text><text x="788" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">10</text><text x="842" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">11</text><text x="896" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">12</text><text x="950" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">13</text><text x="1004" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">14</text><text x="1058" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">15</text><text x="1112" y="410" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">16</text><text x="70" y="459" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 0</text><text x="70" y="487" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">레이어 0·1</text><rect x="248" y="428" width="864" height="64" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="788" y="467" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">계산 없음</text><rect x="250" y="428" width="212" height="64" rx="10" fill="#DCE4EC" stroke="#2470BB" stroke-width="1.5"/><text x="356" y="467" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="541" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 1</text><text x="70" y="569" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">레이어 2·3</text><rect x="248" y="510" width="864" height="64" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="356" y="549" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">입력 대기</text><text x="896" y="549" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">계산 없음</text><rect x="466" y="510" width="212" height="64" rx="10" fill="#DCE4EC" stroke="#2470BB" stroke-width="1.5"/><text x="572" y="549" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="623" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 2</text><text x="70" y="651" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">레이어 4·5</text><rect x="248" y="592" width="864" height="64" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="464" y="631" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">입력 대기</text><text x="1004" y="631" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">계산 없음</text><rect x="682" y="592" width="212" height="64" rx="10" fill="#DCE4EC" stroke="#2470BB" stroke-width="1.5"/><text x="788" y="631" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="705" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 3</text><text x="70" y="733" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">레이어 6·7</text><rect x="248" y="674" width="864" height="64" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="572" y="713" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">입력 대기</text><rect x="898" y="674" width="212" height="64" rx="10" fill="#DCE4EC" stroke="#2470BB" stroke-width="1.5"/><text x="1004" y="713" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="600" y="804" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">예시: 단계마다 배치 전체를 4칸 동안 계산 · 통신 시간 생략</text><rect x="48" y="839" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="875" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 GPU가 계산하는 동안, 다른 세 GPU는 이 배치를 계산하지 못합니다.</text><text x="72" y="915" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">다음 GPU는 네 입력의 결과를 모두 받은 뒤 시작합니다.</text></g></g><path d="M48,993 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1031" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">레이어를 나누어 담았지만, 이 배치만 실행하면 계산은 여전히 GPU 순서대로 진행됩니다.</text></svg>