<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">CPU 메모리를 거쳐 서버 밖으로 전달하기</title><desc id="desc">CPU 메모리를 중간 버퍼로 사용하는 경로의 예시다. 서버 0에서 GPU 0의 A가 만든 x를 CPU 메모리에 복사하고 NIC가 그 버퍼를 읽어 네트워크로 전송한다. 서버 1의 NIC가 받은 x를 CPU 메모리에 쓰고 GPU 1 메모리로 복사한다. 수신이 완료되어 값을 사용할 수 있게 되면 B가 실행된다. CPU 메모리를 사용한다는 것은 CPU의 스레드가 x를 직접 한 원소씩 복사한다는 뜻이 아니다. 다음 그림과 GPU 메모리, NIC, 네트워크 위치를 맞춰 중간 복사가 빠지는 부분을 비교한다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1120" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 15 · 그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">CPU 메모리를 거쳐 서버 밖으로 전달하기</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">NIC는 서버의 네트워크 송수신 장치입니다. 중간 버퍼를 사용하는 경로부터 봅니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="210" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="250" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">CPU 메모리를 중간 버퍼로 사용하는 경로</text><rect x="48" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">서버 0</text><rect x="632" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">서버 1</text><rect x="96" y="365" width="424" height="82" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308.0" y="400.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 · 계산 A</text><text x="308.0" y="435.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">전달할 x 만들기</text><rect x="680" y="365" width="424" height="82" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="892.0" y="400.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">GPU 1 · 계산 B</text><text x="892.0" y="435.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">수신이 끝난 뒤 실행</text><rect x="96" y="520" width="424" height="106" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308.0" y="567.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 메모리</text><text x="308.0" y="602.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">A가 만든 x = [1, 2, 3, 4]</text><rect x="680" y="520" width="424" height="106" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="567.0" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">GPU 1 메모리</text><text x="892.0" y="602.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">수신 버퍼에 x 도착</text><path d="M308,456 V510" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M892,510 V457" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="176" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308.0" y="952.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="308.0" y="987.0" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">네트워크 송수신</text><rect x="760" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="952.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="892.0" y="987.0" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">네트워크 송수신</text><rect x="96" y="722" width="424" height="108" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="308.0" y="770.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">CPU 메모리</text><text x="308.0" y="805.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">중간 버퍼의 x</text><rect x="680" y="722" width="424" height="108" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="892.0" y="770.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">CPU 메모리</text><text x="892.0" y="805.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">중간 버퍼의 x</text><path d="M308,637 V711" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><path d="M308,841 V889" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><path d="M892,711 V637" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><path d="M892,889 V841" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="342" y="663" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="start">중간 복사</text><text x="342" y="699" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">PCIe</text><text x="926" y="663" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="start">중간 복사</text><text x="926" y="699" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">PCIe</text><text x="342" y="874" fill="#4C60A8" font-size="22" font-weight="400" text-anchor="start">NIC가 읽기</text><text x="926" y="874" fill="#4C60A8" font-size="22" font-weight="400" text-anchor="start">NIC가 쓰기</text><path d="M440,958 H749" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="600" y="924" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">네트워크</text><text x="600" y="998" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">x 전달</text></svg>