<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="894" viewBox="0 0 1200 894" role="img" aria-labelledby="title desc"><title id="title">Gather and repartition around the operation</title><desc id="desc">Normalize local tokens, All-Gather the TP input, then Reduce-Scatter completed outputs by token.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="894" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Gather and repartition around the operation</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Forward-pass flow; the residual input keeps the matching token partition.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="193" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="230.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Order</text><rect x="328" y="193" width="406" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="230.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="740" y="193" width="406" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="230.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="48" y="259" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="293.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Per-token</text><text x="62" y="323.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">normalization</text><rect x="328" y="259" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="293.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1</text><rect x="740" y="259" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="293.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t2, t3</text><rect x="48" y="364" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="398.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">All-Gather</text><rect x="328" y="364" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="398.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1, t2, t3</text><rect x="740" y="364" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="398.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1, t2, t3</text><rect x="48" y="469" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="503.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">TP MLP computation</text><rect x="328" y="469" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="503.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Partial sum P₀ for all tokens</text><rect x="740" y="469" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="503.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Partial sum P₁ for all tokens</text><rect x="48" y="574" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="608.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reduce-Scatter</text><rect x="328" y="574" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="608.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Completed results t0, t1</text><rect x="740" y="574" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="608.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Completed results t2, t3</text><rect x="48" y="679" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="713.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Residual addition,</text><text x="62" y="743.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">etc.</text><rect x="328" y="679" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="713.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1</text><rect x="740" y="679" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="713.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t2, t3</text><text x="48" y="839.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Reduce and partition by token instead of replicating the All-Reduce result.</text></svg>