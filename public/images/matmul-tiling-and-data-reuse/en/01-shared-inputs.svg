<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">Independent outputs, overlapping inputs</title><desc id="desc">A (4 × 8) times B (8 × 4) produces C (4 × 4). c00 and c01 share row 0 of A; c00 and c10 share column 0 of B. Each output is a dot product of two vectors of length 8. Cells are matrix elements, not threads. Independent outputs have overlapping inputs that can be reused when computing them together.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1020" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Independent outputs, overlapping inputs</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Reuse in matrix multiplication starts with outputs that need the same inputs.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="217" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">C = A × B     ·     A: 4 × 8     B: 8 × 4     C: 4 × 4</text><text x="240" y="278" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">Input A</text><text x="615" y="278" fill="#7954A3" font-size="28" font-weight="700" text-anchor="middle">Input B</text><text x="988" y="278" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">Output C</text><rect x="96" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="132" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="168" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="204" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="240" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="276" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="312" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="348" y="347" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="96" y="383" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="132" y="383" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="168" y="383" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="204" y="383" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="240" y="383" width="33" height="33" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="276" y="383" width="33" height="33" rx="3" fil