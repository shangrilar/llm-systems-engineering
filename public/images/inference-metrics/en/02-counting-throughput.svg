cond window containing all requests and outputs</text><path d="M190,258 L1010,258" stroke="#182C40" stroke-width="2" fill="none"/><path d="M190,250 L190,266" stroke="#182C40" stroke-width="2" fill="none"/><path d="M1010,250 L1010,266" stroke="#182C40" stroke-width="2" fill="none"/><text x="600" y="238" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Observation time: 10 s</text><path d="M190,290 L190,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="190" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">0 s</text><path d="M354,290 L354,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="354" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2 s</text><path d="M518,290 L518,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="518" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4 s</text><path d="M682,290 L682,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="682" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">6 s</text><path d="M846,290 L846,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="846" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">8 s</text><path d="M1010,290 L1010,610" stroke="#DCE4EC" stroke-width="2" fill="none" stroke-dasharray="6 5"/><text x="1010" y="638" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">10 s</text><text x="48" y="342" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">A</text><path d="M272,335 L632.8,335" stroke="#2470BB" stroke-width="2" fill="none"/><circle cx="272" cy="335" r="9" fill="white" stroke="#2470BB" stroke-width="3"/><circle cx="436" cy="335" r="9" fill="#2470BB" stroke="#2470BB" stroke-width="3"/><circle cx="518" cy="335" r="9" fill="#2470BB" stroke="#2470BB" 