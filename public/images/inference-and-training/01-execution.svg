<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1499" viewBox="0 0 1200 1499" role="img" aria-labelledby="title desc"><title id="title">추론은 토큰을 생성하고, 학습은 모델을 갱신합니다</title><desc id="desc">추론에서는 입력 p0 p1 p2가 고정된 가중치의 모델을 통과하고 마지막 위치의 점수로 x0를 선택합니다. 계속 생성하면 x0가 다음 입력입니다. 학습에서는 입력 p0 p1 p2의 위치별 예측 점수와 데이터의 정답 p1 p2 p3를 손실에서 비교합니다. 손실로부터 역전파해 기울기를 구하고 모델 가중치를 갱신합니다.</desc><metadata>{&quot;id&quot;:&quot;01-execution&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">추론은 토큰을 생성하고, 학습은 모델을 갱신합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">동일한 입력 p0 p1 p2가 모델을 통과한 뒤, 결과를 사용하는 방식이 달라집니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="219" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">추론: 다음 토큰을 생성</text><g data-box="48,267,310,126"><rect x="48" y="267" width="310" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="302" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">요청의 입력</text><text x="68" y="345" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2</text></g><g data-box="442,267,290,126"><rect x="442" y="267" width="290" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="462" y="302" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">모델</text><text x="462" y="345" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">가중치 W 유지</text><text x="462" y="375.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">예측 점수 계산</text></g><g data-box="816,267,336,150"><rect x="816" y="267" width="336" height="150" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="836" y="302" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">다음 토큰 선택</text><text x="836" y="345" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">마지막 위치의 점수로</text><text x="836" y="375.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">x0 선택</text></g><path d="M368,330 L432,330" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M742,330 L806,330" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M984,425 V466 H394 V362 H432" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="442" y="507" fill="#2470BB" font-size="25" font-weight="400" text-anchor="start">계속 생성하면 x0가 다음 입력</text><path d="M48,543 H1152" stroke="#DCE4EC"/><text x="48" y="595" fill="#287D78" font-size="29" font-weight="700" text-anchor="start">학습: 알려진 정답으로 모델을 갱신</text><text x="48" y="637" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">학습 데이터 p0 p1 p2 p3에서 입력과 다음 위치의 정답을 가져옵니다.</text><g data-box="48,684,310,126"><rect x="48" y="684" width="310" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="719" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">학습 입력</text><text x="68" y="762" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2</text></g><g data-box="442,684,290,126"><rect x="442" y="684" width="290" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="462" y="719" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">모델</text><text x="462" y="762" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">가중치 W로 계산</text><text x="462" y="792.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">각 위치의 점수 계산</text></g><g data-box="816,684,336,126"><rect x="816" y="684" width="336" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="719" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">위치별 예측 점수</text><text x="836" y="762" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 · p1 · p2 각각의</text><text x="836" y="792.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">후보 토큰별 점수</text></g><path d="M368,747 L432,747" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M742,747 L806,747" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="48" y="867" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">각 입력 위치는 현재와</text><text x="48" y="900.6" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">앞선 위치만 참조합니다.</text><g data-box="896,867,256,126"><rect x="896" y="867" width="256" height="126" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="916" y="902" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">데이터의 정답</text><text x="916" y="945" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p1 p2 p3</text></g><path d="M840,820 L840,1027" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M1024,1003 L1024,1027" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="816,1037,336,126"><rect x="816" y="1037" width="336" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="1072" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">손실</text><text x="836" y="1115" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">위치별 예측 점수와</text><text x="836" y="1145.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">정답을 비교</text></g><path d="M984,1173 L984,1190" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="816,1200,336,110"><rect x="816" y="1200" width="336" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="1235" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">역전파</text><text x="836" y="1278" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">손실에서 기울기 계산</text></g><path d="M806,1255 L742,1255" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="442,1200,290,110"><rect x="442" y="1200" width="290" height="110" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="462" y="1235" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">가중치 갱신</text><text x="462" y="1278" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">기울기로 W 갱신</text></g><path d="M587,1190 L587,820" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="48" y="1235" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">가중치를 갱신한 뒤</text><text x="48" y="1268.6" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">다음 학습 배치를</text><text x="48" y="1302.2" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">처리합니다.</text><text x="48" y="1370" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">화살표는 계산과 데이터가 이어지는 경로입니다. 길이는 실행 시간을 뜻하지 않습니다.</text></g></g><path d="M48,1421 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1459" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">학습에서는 모델이 고른 토큰을 기다리지 않고, 데이터에서 다음 입력과 정답을 가져옵니다.</text></svg>