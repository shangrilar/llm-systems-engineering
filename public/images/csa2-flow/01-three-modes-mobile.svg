<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2066" viewBox="0 0 360 2066" role="img" aria-labelledby="title desc"><title id="title">CSA2 층의 세 모드</title><desc id="desc">CSA2의 한 층은 Full, Reindex, Reuse 중 하나다. Full은 압축 KV와 검색용 key를 만들고 자기 indexer query로 top-k KV 행을 새로 고른다. Reindex는 최근 Full 층의 KV와 검색용 key를 빌리고 자기 indexer query로 다시 고른다. Reuse 층에는 indexer가 없어서 KV와 최근 Full 또는 Reindex 층의 선택 목록을 빌린다. 세 모드 모두 선택한 k행과 자기 윈도 KV를 이어 붙이고, 자기 Query로 attention을 새로 계산한다.</desc><metadata>{&quot;id&quot;:&quot;csa2-flow-01-three-modes&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3 (CSA2)&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash model card and code&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth