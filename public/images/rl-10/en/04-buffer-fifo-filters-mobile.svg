<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1274" viewBox="0 0 360 1274" role="img" aria-labelledby="title desc"><title id="title">Check entry conditions, then staleness at dequeue</title><desc id="desc">Before insertion, reject aborted or failed groups and user-filter rejections. Accepted groups admitted in B,C,A order are dequeued in that order. With current v5 and maximum lag 1, B with oldest version v3 is excluded, then C is checked.</desc><metadata>{&quot;id&quot;:&quot;10-4&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §2.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 4</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Check entry conditions,</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">then staleness at dequeue</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">A simplified example of Miles v0.1’s</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">three exclusion reasons and default</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">FIFO buffer.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Entry · accept completed groups</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="112" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="143" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Group generation and scoring</text><text x="32" y="183" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Collect the required sample results</text></g><path d="M168 210 L168 252" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="262" width="298" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="293" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="266">Check abort / failure</text><text x="32" y="333" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="266">Completed successfully?</text></g><path d="M319 323 L359 323" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="369" y="262" width="135" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="385" y="293" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="103">① Reject</text></g><path d="M168 395 L168 455" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="185" y="429" fill="#287D78" font-size="20" font-weight="400" text-anchor="start" data-max-width="125">Pass</text><g data-container="true"><rect x="16" y="465" width="298" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="496" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="266">User filter</text><text x="32" y="536" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="266">Keep this group for</text><text x="32" y="564" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="266">training?</text></g><path d="M319 526 L359 526" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="369" y="465" width="135" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="385" y="496" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="103">② Reject</text></g><path d="M168 598 L168 652" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="185" y="628" fill="#287D78" font-size="20" font-weight="400" text-anchor="start" data-max-width="125">Pass</text><g data-container="true"><rect x="16" y="662" width="488" height="98" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="693" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Append to the completed-group buffer</text></g></g><g transform="translate(16 751.5076923076924) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Exit · first in, first out</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="120" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Admission order: B → C → A</text><text x="16" y="160" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">Each version is the oldest within its group</text><g data-container="true"><rect x="16" y="203" width="152" height="83" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="234" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="120">B · v3</text></g><g data-container="true"><rect x="184" y="203" width="152" height="83" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="200" y="234" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="120">C · v4</text></g><g data-container="true"><rect x="352" y="203" width="152" height="83" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="368" y="234" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="120">A · v4</text></g><text x="16" y="322" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start" data-max-width="488">Check B first → then C</text><path d="M260 338 L260 381" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="391" width="488" height="131" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="422" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Check staleness</text><text x="32" y="462" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Current v5 · maximum lag 1</text></g><path d="M135 530 L135 574" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M385 530 L385 574" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="584" width="236" height="152" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="615" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">B: 5 − 3 = 2</text><text x="32" y="655" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="204">③ Too stale →</text><text x="32" y="683" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="204">exclude</text></g><g data-container="true"><rect x="268" y="584" width="236" height="152" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="284" y="615" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">C: 5 − 4 = 1</text><text x="284" y="655" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="204">Pass → training</text><text x="284" y="683" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="204">batch</text></g></g></svg>