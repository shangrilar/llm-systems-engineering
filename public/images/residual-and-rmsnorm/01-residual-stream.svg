<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc">
<title id="title">같은 디코더 블록을 두 가지 배치로 보기</title><desc id="desc">왼쪽은 RMSNorm, Attention, 덧셈, RMSNorm, MLP, 덧셈을 중앙에 놓고 Residual 경로가 바깥으로 우회한다. 오른쪽은 Residual stream을 중앙에 놓고 RMSNorm과 Attention 또는 MLP가 오른쪽으로 갈라져 다시 더해진다. 두 배치는 같은 계산이며 입출력은 T × d다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1230" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">같은 디코더 블록을 두 가지 배치로 보기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">왼쪽은 Attention·MLP를, 오른쪽은 Residual stream을 중심에 둡니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
