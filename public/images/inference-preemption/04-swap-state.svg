<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1188" viewBox="0 0 1200 1188" role="img" aria-labelledby="title desc"><title id="title">KV를 GPU 밖에 보관했다가 복원하기</title><desc id="desc">Swap의 세 단계. B의 KV 8개를 GPU에서 CPU로 복사하고, 복사 완료 후 GPU 두 블록을 반환한다. 나중에 GPU 공간을 확보하면 두 블록에 KV를 복원한다. 토큰 이력 p0부터 p6, x0, x1은 유지한다. 복원 후 x1을 처리할 세 번째 블록을 배정해 KV 9개를 만들고 새 출력 x2를 전달한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1188" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">KV를 GPU 밖에 보관했다가 복원하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">재계산과 같은 중단 전 상태에서 출발하는 다른 방법: 이미 계산한 KV 값을 옮깁니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="265" y="218.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">1. GPU → CPU 보관</text><text x="615" y="218.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">2. GPU 블록 반환</text><text x="965" y="218.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">3. CPU → GPU 복원</text><text x="265" y="254.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">계산한 KV 값을 복사</text><text x="615" y="254.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">복사가 끝난 뒤 반환</text><text x="965" y="254.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">재개할 공간을 확보한 뒤</text><path d="M420,212 L442.0,212.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M452,212 L442.0,216.5 L442.0,207.5 Z" fill="#526577"/><path d="M770,212 L792.0,212.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M802,212 L792.0,216.5 L792.0,207.5 Z" fill="#526577"/><rect x="48" y="281" width="1104" height="224" rx="10" fill="#F6F8FA" stroke="#DCE4EC" stroke-width="1.5"/><rect x="48" y="551" width="1104" height="224" rx="10" fill="#F6F8FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="381.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU</text><text x="75" y="651.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">CPU</text><rect x="175" y="317" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="196.0" y="348.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><rect x="221" y="317" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242.0" y="348.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><rect x="267" y="317" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="288.0" y="348.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><rect x="313" y="317" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="334.0" y="348.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><rect x="175" y="393" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="196.0" y="424.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p4</text><rect x="221" y="393" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242.0" y="424.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p5</text><rect x="267" y="393" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="288.0" y="424.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p6</text><rect x="313" y="393" width="42" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="