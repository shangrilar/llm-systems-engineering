<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1234" viewBox="0 0 1200 1234" role="img" aria-labelledby="title desc"><title id="title">가중치 재사용과 KV 읽기는 다릅니다</title><desc id="desc">요청 A B C는 동일한 가중치 W를 재사용하지만 자기 요청의 독립된 KV를 각각 읽습니다. 배칭은 가중치 재사용을 늘려도 누적 문맥을 읽는 비용을 없애지 않습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1234" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">가중치 재사용과 KV 읽기는 다릅니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">각 요청은 이번 decode에서 새 입력 하나를 처리합니다. 화살표는 데이터 의존 관계입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#7954A3" font-size="28" font-weight="700" text-anchor="start">가중치 읽기</text><text x="642" y="220.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">KV 읽기</text><g data-box="48,253,510,170"><rect x="48" y="253" width="510" height="170" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="68" y="288.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">요청들이 같은 W를 사용</text><text x="68" y="331.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">동일한 모델·가중치의 요청을 배칭</text><text x="68" y="361.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">토큰을 더 모으면 가중치 재사용 증가</text></g><g data-box="642,253,510,170"><rect x="642" y="253" width="510" height="170" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="288.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">요청마다 자기 문맥을 사용</text><text x="662" y="331.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A는 KV(A), B는 KV(B), C는 KV(C)</text><text x="662" y="361.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청이 늘면 읽을 KV도 늘어남</text></g><rect x="207" y="468" width="190" height="91" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="302" y="526.0" fill="#7954A3" font-size="31" font-weight="700" text-anchor="middle">W</text><rect x="55" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="112.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">A</text><path d="M302,573 L112,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="642" y="468" width="160" height="91" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="722" y="523.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">KV(A)</text><rect x="664" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="721.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">A</text><path d="M722,573 L722,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="241" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="298.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">B</text><path d="M302,573 L298,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="816" y="468" width="160" height="91" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="896" y="523.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">KV(B)</text><rect x="838" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="895.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">B</text><path d="M896,573 L896,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="427" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="484.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">C</text><path d="M302,573 L484,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="990" y="468" width="160" height="91" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1070" y="523.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">KV(C)</text><rect x="1012" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1069.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">C</text><path d="M1070,573 L1070,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="750.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">같은 W를 여러 새 토큰에 재사용</text><text x="642" y="750.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">독립된 문맥은 서로 합쳐 참조하지 않음</text><g data-box="48,828,1104,122"><rect x="48" y="828" width="1104" height="122" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="863.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">작은 배치의 decode: 적은 연산에 비해 많은 가중치·KV를 읽기 쉽습니다</text><text x="70" y="905.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">문맥이 길어지면 요청별 KV 읽기도 커집니다. 배칭의 이득은 무한히 늘지 않습니다.</text></g><g data-box="48,990,1104,120"><rect x="48" y="990" width="1104" height="120" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="1025.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">메모리 대역폭의 한계와 저장 공간 부족을 구별합니다</text><text x="70" y="1067.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">읽는 속도가 병목인 것과 KV를 저장할 공간이 모자라는 것은 다른 문제입니다.</text></g><text x="48" y="1160.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">기본 예시: 독립적인 KV, prefix 공유 없음. 실제 병목은 T·문맥 길이·정밀도·모델·하드웨어에 따라</text><text x="48" y="1190.8" fill="#526577" font-size="22" font-weight="400" text-anchor="start">달라집니다.</text></svg>