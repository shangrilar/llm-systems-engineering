<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1475" viewBox="0 0 1200 1475" role="img" aria-labelledby="title desc"><title id="title">완성된 과거 요약과 최근 원본을 함께 읽습니다</title><desc id="desc">왼쪽 현재 p6에서 0…5는 완료된 block b0,b1,b2에 속하고, 6,7의 b3는 p7이 미래라 미완성이다. q6는 summary bank b0…b2와 최근 위치별 KV 4,5,6을 읽는다. 오른쪽 현재 p8에서는 b0…b3가 완료되고 8,9의 b4가 미완성이다. q8은 b0…b3와 최근 위치별 KV 6,7,8을 읽으며 미래 p9는 읽지 않는다.</desc><metadata>{&quot;id&quot;:&quot;ma-06-03&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 §2.3, preceding compressed blocks and sliding-window branch&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2606.19348v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" o