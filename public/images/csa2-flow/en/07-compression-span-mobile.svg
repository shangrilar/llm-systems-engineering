<svg xmlns="http://www.w3.org/2000/svg" width="360" height="934" viewBox="0 0 360 934" role="img" aria-labelledby="title desc"><title id="title">CSA2 compresses without overlap</title><desc id="desc">CSA builds an entry from 8 tokens, the previous span a and its own span b, so neighbouring entries share half their span; the compressor has an absolute in-span position bias B and one softmax over 8. CSA2 removes the overlap and B: an entry comes from the m tokens of its own span only, with one softmax over m.</desc><metadata>{&quot;id&quot;:&quot;csa2-flow-07-compression-span&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3 (CSA2)&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash model card and code&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">CSA2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">CSA2 compresses without</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">overlap</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Comparison m = 4 (real CSA2: encoder m</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">= 2, decoder m = 1) · tokens behind</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">entry 1 and the softmax size</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. CSA · overlapping compression</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="24" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="42" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">0</text><rect x="64" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="82" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">1</text><rect x="104" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="122" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">2</text><rect x="144" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="162" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">3</text><rect x="184" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="202" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">4</text><rect x="224" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">5</text><rect x="264" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="282" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">6</text><rect x="304" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="322" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">7</text><rect x="344" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="362" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">8</text><rect x="384" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="402" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">9</text><rect x="424" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="442" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">10</text><rect x="464" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="482" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">11</text><text x="24" y="88" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="100">tokens</text><path d="M24 152 V161 H180 V152" stroke="#B55B22" stroke-width="2" fill="none"/><text x="102" y="184" fill="#B55B22" font-size="17" font-weight="400" text-anchor="middle" data-max-width="186"><tspan>a: previous span</tspan></text><path d="M184 152 V161 H340 V152" stroke="#287D78" stroke-width="2" fill="none"/><text x="262" y="184" fill="#287D78" font-size="17" font-weight="400" text-anchor="middle" data-max-width="186"><tspan>b: own span</tspan></text><path d="M24 214 V223 H340 V214" stroke="#287D78" stroke-width="3" fill="none"/><text x="182" y="246" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle" data-max-width="346"><tspan>entry 1 = 8 tokens</tspan></text><path d="M184 278 V287 H500 V278" stroke="#5C6C7C" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="342" y="310" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle" data-max-width="346"><tspan>entry 2 = tokens 4–11 (half shared)</tspan></text><text x="24" y="372" fill="#182C40" font-size="17" font-weight="400" text-anchor="start" data-max-width="470"><tspan>per channel S = softmax([Z</tspan><tspan dy="-6.5" font-size="11.9">a</tspan><tspan dy="6.5">+B</tspan><tspan dy="-6.5" font-size="11.9">a</tspan><tspan dy="6.5"> ; Z</tspan><tspan dy="-6.5" font-size="11.9">b</tspan><tspan dy="6.5">+B</tspan><tspan dy="-6.5" font-size="11.9">b</tspan><tspan dy="6.5">]) · 8 tokens</tspan></text><text x="24" y="428" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="470"><tspan>compression weights are [D, 2c] (a | b halves)</tspan></text></g><g transform="translate(16 581.2) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. CSA2 · no overlap</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="24" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="42" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">0</text><rect x="64" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="82" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">1</text><rect x="104" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="122" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">2</text><rect x="144" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="162" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">3</text><rect x="184" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="202" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">4</text><rect x="224" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">5</text><rect x="264" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="282" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">6</text><rect x="304" y="100" width="36" height="40" rx="6" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="322" y="127" fill="#287D78" font-size="18" font-weight="700" text-anchor="middle" data-max-width="32">7</text><rect x="344" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="362" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">8</text><rect x="384" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="402" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">9</text><rect x="424" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="442" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">10</text><rect x="464" y="100" width="36" height="40" rx="6" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="482" y="127" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="32">11</text><text x="24" y="88" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="100">tokens</text><path d="M24 152 V161 H180 V152" stroke="#5C6C7C" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="102" y="184" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle" data-max-width="186"><tspan>entry 0</tspan></text><path d="M184 152 V161 H340 V152" stroke="#287D78" stroke-width="3" fill="none"/><text x="262" y="184" fill="#287D78" font-size="17" font-weight="700" text-anchor="middle" data-max-width="186"><tspan>entry 1 = 4 tokens</tspan></text><path d="M344 152 V161 H500 V152" stroke="#5C6C7C" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="422" y="184" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle" data-max-width="186"><tspan>entry 2</tspan></text><text x="24" y="290" fill="#287D78" font-size="17" font-weight="600" text-anchor="start" data-max-width="470"><tspan>spans do not overlap · each token feeds one entry</tspan></text><text x="24" y="372" fill="#182C40" font-size="17" font-weight="400" text-anchor="start" data-max-width="470"><tspan>per channel S = softmax(Z) · m tokens</tspan></text><text x="24" y="400" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="470"><tspan>no B</tspan></text><text x="24" y="428" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="470"><tspan>compression weights are [D, c] (no overlap)</tspan></text></g></svg>