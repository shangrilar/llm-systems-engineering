<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="917" viewBox="0 0 1200 917" role="img" aria-labelledby="title desc"><title id="title">LLM의 전체 구조</title><desc id="desc">왼쪽은 Embedding, Decoder block × N, LM Head의 압축 표현이다. 오른쪽은 같은 구조의 Decoder block 1, 2, 생략 기호, N을 펼쳐 보여준다. 블록들은 구조가 반복되며 내부는 표시하지 않는다.</desc><metadata>{&quot;id&quot;:&quot;01-model-overview&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">LLM의 전체 구조</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">디코더 블록의 내부는 잠시 닫아 두고, 입력부터 출력까지의 경로를 봅니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><rect x="48" y="195" width="534" height="555" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="618" y="195" width="534" height="555" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="236" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">압축해서 보기</text><text x="885" y="236" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">펼쳐서 보기</text><rect x="165" y="265" width="300" height="64" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="306" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Embedding</text><rect x="165" y="648" width="300" height="64" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="689" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">LM Head</text><rect x="735" y="265" width="300" height="64" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="306" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Embedding</text><rect x="735" y="648" width="300" height="64" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="689" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">LM Head</text><text x="600" y="786" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">같은 구조를 압축하거나 펼쳐서 표현한 것입니다.</text><rect x="165" y="424" width="300" height="105" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="476.5" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block</text><text x="315" y="507.5" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">× N</text><path d="M315,340 L315,410" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M315,542 L315,634" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="735" y="360" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="401" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block 1</text><path d="M885,337 L885,350" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="735" y="449" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="490" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block 2</text><path d="M885,429 L885,440" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><text x="885" y="545" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">⋮</text><rect x="735" y="564" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="605" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block N</text><path d="M885,634 L885,641" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><line x1="1080" y1="360" x2="1090" y2="360" stroke="#5C6C7C" stroke-width="2"/><line x1="1090" y1="360" x2="1090" y2="628" stroke="#5C6C7C" stroke-width="2"/><line x1="1080" y1="628" x2="1090" y2="628" stroke="#5C6C7C" stroke-width="2"/><text x="1112" y="504" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" transform="rotate(90 1112 504)">N개</text></g></g><path d="M48,839 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="877" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">구조를 단순화한 그림입니다. 최종 정규화 등 세부 단계는 생략했습니다.</text></svg>