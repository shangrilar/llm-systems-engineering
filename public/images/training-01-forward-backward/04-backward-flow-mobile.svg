<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1462" viewBox="0 0 360 1462" role="img" aria-labelledby="title desc"><title id="title">돌아온 gradient가 두 경로로 갈라진다</title><desc id="desc">두 선형층의 forward는 X0에서 X1, Y를 만든다. 역방향의 dY2는 dX2와 dW2로 갈라지고 dX2가 이전 층의 dY1이 되어 dX1과 dW1을 만든다. 저장 X0와 X1은 dW 계산에 재사용된다.</desc><metadata>{&quot;id&quot;:&quot;1-4&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;PyTorch autograd&quot;,&quot;url&quot;:&quot;https://docs.pytorch.org/docs/stable/notes/autograd.html&quot;},{&quot;label&quot;:&quot;PyTorch cross_entropy&quot;,&quot;url&quot;:&quot;https://docs.pytorch.org/docs/stable/generated/torch.nn.functional.cross_entropy.html&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8"