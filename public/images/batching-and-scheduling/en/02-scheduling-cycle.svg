<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1101" viewBox="0 0 1200 1101" role="img" aria-labelledby="title desc"><title id="title">Rebuild the batch between executions</title><desc id="desc">A completes and B continues. A’s exclusively owned GPU KV is released while B’s KV is retained. New requests C and D have no GPU KV and are considered in arrival order. C fits the available resources. With at most two requests per execution, the next batch is B Decode and C Prefill while D waits. The returning arrow feeds execution results into the next decision.</desc><metadata>{&quot;id&quot;:&quot;02-scheduling-cycle&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><marker id="ported-batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#5C6C7C" stroke-width="1.7" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Rebuild the batch between executions</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Distinguish the queue, admitted request state, and the next batch.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">1. Execution results</text><rect x="48" y="249" width="352" height="552" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="424" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">2. Update and check</text><rect x="424" y="249" width="352" height="552" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="220" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">3. Execute next batch</text><rect x="800" y="249" width="352" height="552" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="294" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Admitted requests</text><rect x="72" y="314" width="304" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="224" y="348.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · complete ✓</text><rect x="72" y="380" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="224" y="414.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · continue</text><text x="72" y="481" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">KV stored on the GPU</text><rect x="72" y="502" width="144" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="144" y="536.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A KV</text><rect x="232" y="502" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="304" y="536.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><path d="M72,590 H376" stroke="#DCE4EC"/><text x="72" y="630" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Queue · arrival order</text><rect x="72" y="651" width="144" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="144" y="685.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C</text><rect x="232" y="651" width="144" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="304" y="685.16" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">D</text><text x="224" y="749" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">C and D have no GPU KV</text><text x="448" y="294" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Remove A; retain B</text><rect x="448" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · continue</text><text x="448" y="413" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">Release A’s KV allocation</text><rect x="448" y="437" width="144" height="52" rx="8" fill="white" stroke="#2470BB" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520" y="471" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Freed</text><rect x="608" y="437" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="680" y="471.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><rect x="448" y="537" width="304" height="218" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="577" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">Check C first</text><text x="472" y="632" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ Step token budget</text><text x="472" y="674" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ Required KV space</text><text x="600" y="723" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Both fit in this example</text><text x="824" y="294" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Work selected now</text><rect x="824" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="976" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · Decode</text><rect x="824" y="380" width="304" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="976" y="414.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · Prefill</text><path d="M976,443 L976,474" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="824" y="489" width="304" height="91" rx="10" fill="#EEF1FC" stroke="#5C6C7C" stroke-width="1.5"/><text x="976" y="544" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">GPU execution</text><path d="M824,617 H1128" stroke="#DCE4EC"/><text x="824" y="657" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Waiting queue</text><rect x="824" y="679" width="304" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="976" y="712.82" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">D · still waiting</text><text x="976" y="774" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">At most 2 requests at once</text><path d="M403,340 L419,340" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><path d="M779,340 L795,340" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><path d="M1132,535 H1175 V872 H24 V340 H43" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><text x="600" y="847" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Use the execution results to build the next batch again</text><text x="48" y="932" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">A new request can join without a completion if sufficient resources are available.</text></g></g><path d="M48,993 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1031" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">KV of finished requests is returned, and waiting requests join the next batch in arrival order when</text><text x="48" y="1060.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">resources allow.</text></svg>