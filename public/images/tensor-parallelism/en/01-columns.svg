<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="803" viewBox="0 0 1200 803" role="img" aria-labelledby="title desc"><title id="title">Split output columns, split the result</title><desc id="desc">Splitting W by columns gives completed outputs 5 on GPU 0 and 11 on GPU 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="803" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Split output columns, split the result</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">In TP, multiple GPUs cooperate on one operation for the same input.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="192" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="228.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">The same matrix product</text><text x="72" y="268.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">X = [1, 2]     W = [[1, 3], [2, 4]]     Y = [5, 11]</text><rect x="48" y="335" width="510" height="245" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="371.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="421.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full X: [1, 2]</text><text x="66" y="453.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">First W column: [1, 2]ᵀ</text><text x="66" y="485.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">1×1 + 2×2 = 5</text><rect x="642" y="335" width="510" height="245" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="371.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="421.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Full X: [1, 2]</text><text x="660" y="453.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Second W column: [3, 4]ᵀ</text><text x="660" y="485.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">1×3 + 2×4 = 11</text><path d="M303,592 L303,640" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,592 L897,640" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="657" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="693.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Completed output shards: [5] and [11]</text><text x="72" y="733.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Concatenate if the full output is needed; these are not partial sums.</text></svg>