<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="894" viewBox="0 0 1200 894" role="img" aria-labelledby="title desc"><title id="title">Distinguish execution time from throughput</title><desc id="desc">One GPU finishes in four slots; two GPUs finish in two, while each request executes for one slot.</desc><metadata>{&quot;id&quot;:&quot;03-throughput&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Distinguish execution time from throughput</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">All four requests arrive together; interference and dispatch costs are omitted.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="211" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Assume each request takes one time slot</text><rect x="48" y="254" width="214.8" height="58" rx="10" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="291" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Deployment</text><rect x="268.8" y="254" width="214.8" height="58" rx="10" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="291" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 1</text><rect x="489.6" y="254" width="214.8" height="58" rx="10" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="291" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 2</text><rect x="710.4000000000001" y="254" width="214.8" height="58" rx="10" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="291" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 3</text><rect x="931.2" y="254" width="214.8" height="58" rx="10" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="291" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Slot 4</text><rect x="48" y="320" width="214.8" height="92" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="354" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">1 GPU</text><rect x="268.8" y="320" width="214.8" height="92" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="354" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A</text><rect x="489.6" y="320" width="214.8" height="92" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="354" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B</text><rect x="710.4000000000001" y="320" width="214.8" height="92" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="354" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C</text><rect x="931.2" y="320" width="214.8" height="92" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="354" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D</text><rect x="48" y="420" width="214.8" height="92" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="454" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">2 GPUs · GPU 0</text><rect x="268.8" y="420" width="214.8" height="92" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="454" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A</text><rect x="489.6" y="420" width="214.8" height="92" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="454" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">C</text><rect x="710.4000000000001" y="420" width="214.8" height="92" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="454" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="931.2" y="420" width="214.8" height="92" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="454" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="48" y="520" width="214.8" height="92" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="554" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">2 GPUs · GPU 1</text><rect x="268.8" y="520" width="214.8" height="92" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="282.8" y="554" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">B</text><rect x="489.6" y="520" width="214.8" height="92" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="503.6" y="554" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">D</text><rect x="710.4000000000001" y="520" width="214.8" height="92" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.4000000000001" y="554" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="931.2" y="520" width="214.8" height="92" rx="10" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.2" y="554" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">—</text><rect x="48" y="662" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="698" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Completion of all four requests: 4 slots → 2 slots</text><text x="72" y="738" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Each request still executes for one slot; time spent in the queue can shrink.</text></g></g><path d="M48,816 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="854" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Slots are illustrative time units, not actual execution times.</text></svg>