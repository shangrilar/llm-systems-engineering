<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2552" viewBox="0 0 360 2552" role="img" aria-labelledby="title desc"><title id="title">배치와 통신 환경에 맞는 전송 경로를 고른다</title><desc id="desc">Broadcast는 학습 측에서 NCCL로 분배한 후 추론 측에서 분할 적용한다. P2P는 학습 GPU에서 CPU 모델의 layout 변환과 pinned host buffer를 거쳐 RDMA로 대상 GPU의 weight 주소에 쓴다. Disk-delta는 같은 기준 checkpoint의 byte 변경을 공유 저장소로 전달하고 수신 측 local checkpoint를 패치한 후 GPU로 읽는다.</desc><metadata>{&quot;id&quot;:&quot;15-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SGLang receiver, Miles v0.1.0 release pin&quot;,&quot;url&quot;:&quot;https://github.com/sgl-project/sglang/blob/cb05a44f35a7c9e27e46d74112cc841ca674ef43/python/sglang/srt/model_loader/remote_instance_weight_loader_utils.py&quot;},{&quot;label&quot;:&quot;Miles P2P v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/p2p-weight-transfer.md&quot;},{&quot;label&quot;:&quot;Miles disk-delta v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/miles/backends/megatron_utils/update_weight/update_weight_from_distributed/delta.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">배치와 통신 환경에 맞는 전송</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">경로를 고른다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Miles v0.1.0의 세 경로를 단순화했습니다.</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">화살표는 메모리·저장소 사이 이동이며,</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">길이나 굵기는 속도 비교가 아닙니다.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">같은 원본과 대상 · 다른 이동 경로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g transform="translate(0 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Broadcast</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">공통 GPU 통신망의 기본 선택</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학습 GPU들</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">동일한 새 가중치</text></g><path d="M260 217 L260 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="488" height="164" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="297" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">전송할 텐서 준비</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Gather·형식 변환 후 source rank에서 배포</text></g><g data-container="true"><rect x="16" y="492" width="488" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">NCCL broadcast</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">collective 통신 그룹</text></g><g data-container="true"><rect x="16" y="681" width="488" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">대상별 load</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">각 추론 rank의 분할에 맞춰 적용</text></g><path d="M260 443 L260 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 632 L260 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 855 L260 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">추론 GPU들</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">일관된 새 가중치</text></g></g></g><g transform="translate(0 1284)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">P2P</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">여러 노드의 병렬 전송 활용</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학습 GPU들</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">동일한 새 가중치</text></g><path d="M260 217 L260 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="488" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">송신 CPU 메모리</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">CPU 모델로 layout 변환 → pinned host buffer</text></g><g data-container="true"><rect x="16" y="492" width="488" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">RDMA write</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">대상 rank별 필요한 조각</text></g><g data-container="true"><rect x="16" y="681" width="488" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">등록된 GPU 주소</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">대상 가중치 메모리에 직접 쓰기</text></g><path d="M260 443 L260 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 632 L260 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 855 L260 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">추론 GPU들</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">일관된 새 가중치</text></g></g></g><g transform="translate(0 2464)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Disk-delta</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">직접 통신망 없이 저장소 공유</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학습 GPU들</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">동일한 새 가중치</text></g><path d="M260 217 L260 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="488" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">CPU의 이전 snapshot</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">같은 base에서 바뀐 bytes를 인코딩</text></g><g data-container="true"><rect x="16" y="492" width="488" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">공유 파일 저장소</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">base b → delta b+1</text></g><g data-container="true"><rect x="16" y="681" width="488" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">로컬 checkpoint 패치</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">base·version·checksum 확인 → GPU로 reload</text></g><path d="M260 443 L260 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 632 L260 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 855 L260 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">추론 GPU들</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">일관된 새 가중치</text></g></g></g></g></svg>