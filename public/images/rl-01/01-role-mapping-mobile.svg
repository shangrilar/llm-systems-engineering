<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1268" viewBox="0 0 360 1268" role="img" aria-labelledby="title desc"><title id="title">상황을 보고 행동을 고르는 정책</title><desc id="desc">미로 예는 현재 위치에서 이동을 선택해 위치를 바꾸는 순환이다. LLM 예는 질문과 생성 이력을 읽고 다음 토큰을 선택해 문맥을 늘리는 순환이다. 각 예는 완료 후 결과를 평가하고 경험과 보상으로 정책을 학습한다.</desc><metadata>{&quot;id&quot;:&quot;1-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;RLHF Book — Training Overview&quot;,&quot;url&quot;:&quot;https://rlhfbook.com/c/03-training-overview&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">상황을 보고 행동을 고르는</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">정책</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">미로의 이동과 LLM의 토큰 선택은 같은</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">강화학습 틀로 읽을 수 있습니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">미로에서 이동하기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="44" y="96" width="422" height="82" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="60" y="128" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="300">현재 위치 + 미로 지도</text><text x="60" y="161" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="310">● 현재 위치  ■ 목표</text><rect x="393" y="106" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="413" y="106" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="433" y="106" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="393" y="126" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="413" y="126" width="18" height="18" rx="0" fill="#182C40" stroke="#DCE4EC" stroke-width="1.5"/><rect x="433" y="126" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="393" y="146" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="413" y="146" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="433" y="146" width="18" height="18" rx="0" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="402" cy="115" r="6" fill="#2470BB" stroke="#2470BB"/><rect x="435" y="148" width="14" height="14" rx="0" fill="#B55B22" stroke="#B55B22" stroke-width="1.5"/><path d="M255 187 L255 207" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="44" y="216" width="422" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="247" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">이동을 고르는 정책</text></g><path d="M255 302 L255 322" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="44" y="332" width="422" height="114" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="363" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">한 칸 이동 선택</text><text x="60" y="403" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="390">위 · 아래 · 왼쪽 · 오른쪽</text></g><path d="M255 455 L255 475" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="44" y="485" width="422" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="60" y="516" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">이동한 뒤의 위치</text></g><path d="M477 530 H504 V136 H477" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><text x="280" y="606" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="220">완료 후</text><path d="M255 584 L255 614" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="44" y="625" width="422" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="60" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">목표에 도달했는지 확인</text><text x="60" y="696" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="390">이 예에서는 마지막에 보상</text></g><path d="M35 680 H12 V254 H35" stroke="#287D78" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><text x="55" y="788" fill="#287D78" font-size="20" font-weight="400" text-anchor="start" data-max-width="453">경험 + 보상 → 이후 정책 학습</text></g><g transform="translate(16 736.5384615384615) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">LLM으로 다음 토큰 고르기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="44" y="96" width="422" height="82" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="60" y="127" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">질문 + 생성한 토큰</text><text x="60" y="167" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="390">예: “2+3은?” + x₁ …</text></g><path d="M255 187 L255 207" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="44" y="216" width="422" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="247" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">언어 모델 정책</text></g><path d="M255 302 L255 322" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="44" y="332" width="422" height="114" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="363" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">다음 토큰 하나 선택</text><text x="60" y="403" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="390">문맥을 보고 후보 중에서 선택</text></g><path d="M255 455 L255 475" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="44" y="485" width="422" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="60" y="516" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">선택한 토큰이 추가된 문맥</text></g><path d="M477 530 H504 V136 H477" stroke="#5C6C7C" stroke-width="2" fill="none" marker-end="url(#arrow-muted)"/><text x="280" y="606" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="220">완료 후</text><path d="M255 584 L255 614" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="44" y="625" width="422" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="60" y="656" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="390">완성된 응답 평가</text><text x="60" y="696" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="390">보상 모델 / 정답·테스트 검증 등</text></g><path d="M35 680 H12 V254 H35" stroke="#287D78" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><text x="55" y="788" fill="#287D78" font-size="20" font-weight="400" text-anchor="start" data-max-width="453">경험 + 보상 → 이후 정책 학습</text></g></svg>