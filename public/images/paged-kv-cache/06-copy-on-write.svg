-weight="400" text-anchor="middle">가득 찬 첫 블록은 계속 공유하고, 쓰기가 필요한 마지막 블록만 분리합니다.</text></g></g><path d="M48,1086 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1124" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">새 KV를 쓸 마지막 공유 블록만 분리하고, 가득 찬 첫 블록은 계속 공유합니다.</text></svg>