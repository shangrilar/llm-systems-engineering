<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1650" viewBox="0 0 1200 1650" role="img" aria-labelledby="title desc"><title id="title">계산한 K와 V를 저장하고 다음 생성에서 읽습니다</title><desc id="desc">첫 실행은 p0 p1 p2의 K와 V를 각 층의 캐시에 저장하고 x0를 선택합니다. 다음 실행은 x0의 새 Q와 K와 V만 계산하고 과거 및 현재 KV를 Attention에서 읽어 x1을 선택합니다. 이어 x1의 KV를 추가하고 x2를 선택합니다. 각 실행에서 선택한 출력 토큰의 KV는 아직 만들어지지 않았습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1650" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">계산한 K와 V를 저장하고 다음 생성에서 읽습니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">같은 세 실행에서 각 층의 새 계산, K·V 추가, Attention의 참조를 따라갑니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="211.0" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">주황 선: 새 K·V 추가</text><text x="642" y="211.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">초록 선: Attention에서 참조</text><text x="48" y="280.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">입력 문맥 처리</text><text x="354" y="280.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">각 층의 Attention 부분</text><rect x="332" y="303" width="624" height="141" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="48" y="346" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86.0" y="383.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="346" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174.0" y="383.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="346" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262.0" y="383.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><path d="M310,374 L344,374" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="354" y="330" width="240" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="474" y="382.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Q · K · V 계산</text><path d="M604,374 L706,374" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="656" y="356.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">Q</text><rect x="716" y="330" width="218" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="825" y="367.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">Attention</text><text x="825" y="400.0" fill="#287D78" font-size="17" font-weight="400" text-anchor="middle">현재·앞선 위치만</text><path d="M966,374 L984,374" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="994" y="329" width="160" height="117" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1074" y="369.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">나머지</text><text x="1074" y="403.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">모델 계산</text><path d="M1087,456 L1087,511" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="1099" y="487.0" fill="#526577" font-size="20" font-weight="400" text-anchor="start">선택</text><rect x="1044" y="521" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087.0" y="558.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><g data-box="354,512,88,74"><re