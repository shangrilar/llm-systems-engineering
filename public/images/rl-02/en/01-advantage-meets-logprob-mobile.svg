<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1583" viewBox="0 0 360 1583" role="img" aria-labelledby="title desc"><title id="title">Loss gradients flow back to model weights</title><desc id="desc">Return 1 minus baseline 0.4 gives advantage +0.6. The recorded context and chosen token produce a current log probability. Fixed advantage and log probability form loss -A log p. Backpropagation reaches trainable model parameters.</desc><metadata>{&quot;id&quot;:&quot;2-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;PPO §2&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/1707.06347&quot;},{&quot;label&quot;:&quot;RLHF Book — Policy gradients&quot;,&quot;url&quot;:&quot;https://rlhfbook.com/c/06-policy-gradients&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Loss gradients flow back</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">to model weights</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Follow token u from Figure 1. Blue</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">shows probability computation; dashed</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">green arrows show backpropagation.</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Forward · score the first token u</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="98" width="488" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="129" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Input P · recorded choice u</text><text x="32" y="169" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Token IDs are fixed training data</text></g><path d="M260 198 L260 224" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="234" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="265" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Transformer → h₁</text><text x="32" y="305" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Compute trainable context features</text></g><path d="M260 334 L260 360" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="370" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="401" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">LM head → softmax</text><text x="32" y="441" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Gather the probability of u</text></g><path d="M260 470 L260 496" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="506" width="488" height="90" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="537" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">pθ(u | P) = 0.5</text><text x="32" y="577" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">log pθ(u | P) ≈ −0.693</text></g><g data-container="true"><rect x="16" y="628" width="488" height="90" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="659" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Fixed signal from evaluation</text><text x="32" y="699" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">A₁ = 1 − 0.4 = +0.6</text></g><path d="M 510 554 H 516 V 826 H 506" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 728 L260 754" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="764" width="488" height="106" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="795" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">L₁ = −A₁ log pθ(u | P)</text><text x="32" y="835" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">−0.6 × (−0.693) ≈ 0.416</text></g></g><g transform="translate(16 813.323076923077) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Backward · from that loss to weights</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="98" width="488" height="160" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="129" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Gradient with respect to log probability z</text><text x="32" y="169" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">z = log pθ(u | P)</text><text x="32" y="197" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">L₁ = −0.6z → ∂L₁/∂z = −0.6</text></g><path d="M260 268 L260 294" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="304" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="335" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">softmax · LM head</text><text x="32" y="375" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Differentiate through the LM output</text></g><path d="M260 404 L260 430" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="440" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="471" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">h₁ → Transformer</text><text x="32" y="511" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Continue into the trainable context layers</text></g><path d="M260 540 L260 566" stroke="#287D78" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="576" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="607" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Accumulate parameter gradients</text><text x="32" y="647" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Include other token contributions</text></g><path d="M260 676 L260 698" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="708" width="488" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="739" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Optimizer → new weights θ′</text><text x="32" y="779" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Update model parameters</text></g><path d="M260 808 L260 834" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="844" width="488" height="96" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="875" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Next forward: new probabilities</text><text x="32" y="915" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">The distribution for P can now change</text></g></g><path d="M16,1441.6 H344" stroke="#DCE4EC" stroke-width="2"/><text x="16" y="1468.6" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">An educational example of basic policy</text><text x="16" y="1491" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">gradient. A is fixed for this policy</text><text x="16" y="1513.3999999999999" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">update. Shared parameters and other</text><text x="16" y="1535.8" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">samples can affect each token’s actual</text><text x="16" y="1558.1999999999998" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">probability change.</text></svg>