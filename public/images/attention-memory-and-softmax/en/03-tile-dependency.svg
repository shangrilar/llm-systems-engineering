<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-labelledby="title desc"><title id="title">Can We Continue to the Next Stage Tile by Tile?</title><desc id="desc">With T=4 and dh=2, compute a 2 × 2 score tile for query tokens 2 and 3 against key tokens 0 and 1. Each score has completed its sum over input components; it is not a partial dot product. Scaling and a causal mask can be applied to the computed scores. Query row 2 still needs the score for key 2; key 3 is a future position and is excluded. Query row 3 still needs the scores for keys 2 and 3. The current tile alone therefore cannot determine each row&#x27;s exponential sum and final probabilities. Continuing Attention tile by tile requires handling this normalization dependency. The online weighted-sum solution is not explained here. Neither masking nor tiled Attention is claimed to be impossible.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1290" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Can We Continue to the Next Stage Tile by Tile?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">From scores and masking to Softmax, which needs information from the full row.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="1104" height="373" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="252" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. Compute a subset of scores first.</text><text x="179.0" y="315" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Part of Q</text><rect x="130" y="343" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="179" y="343" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="130" y="392" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="179" y="392" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="179.0" y="472" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Query tokens 2, 3</text><text x="319" y="405" fill="#5C6C7C" font-size="36" font-weight="400" text-anchor="middle">×</text><text x="491.0" y="315" fill="#7954A3" font-size="27" font-weight="700" text-anchor="middle">Part of Kᵀ</text><rect x="442" y="343" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="491" y="343" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="442" y="392" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="491" y="392" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="491.0" y="472" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Key tokens 0, 1</text><path d="M619,392 L745,392" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="923.0" y="315" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">Score tile</text><rect x="874" y="343" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="923" y="343" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="874" y="392" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="923" y="392" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="923.0" y="472" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">2 × 2 scores</text><text x="600" y="531" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">We can immediately scale and mask the computed scores.</text><rect x="48" y="616" width="1104" height="370" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="661" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">2. Softmax also needs the remaining scores in the same row.</text><text x="432" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Key token 0</text><text x="602" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Key token 1</text><text x="772" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Key token 2</text><text x="942" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Key token 3</text><text x="101" y="796" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">Query token 2</text><rect x="354" y="749" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="431.5" y="793.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Computed</text><rect x="524" y="749" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="601.5" y="793.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Computed</text><rect x="694" y="749" width="155" height="72" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="771.5" y="793.0" fill="#7954A3" font-size="20" font-weight="600" text-anchor="middle">Not computed</text><rect x="864" y="749" width="155" height="72" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="941.5" y="793.0" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">−∞ · Masked</text><text x="101" y="888" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">Query token 3</text><rect x="354" y="841" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="431.5" y="885.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Computed</text><rect x="524" y="841" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="601.5" y="885.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Computed</text><rect x="694" y="841" width="155" height="72" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="771.5" y="885.0" fill="#7954A3" font-size="20" font-weight="600" text-anchor="middle">Not computed</text><rect x="864" y="841" width="155" height="72" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="941.5" y="885.0" fill="#7954A3" font-size="20" font-weight="600" text-anchor="middle">Not computed</text><text x="600" y="957" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">The row&#x27;s exponential sum must include every unmasked score.</text><path d="M600,1000 L600,1040" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><rect x="117" y="1064" width="438" height="94" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="336.0" y="1119.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">Final probabilities still unknown</text><path d="M573,1111 L647,1111" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="666" y="1064" width="418" height="94" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="875.0" y="1119.0" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">How can we weight and sum V?</text><text x="600" y="1233" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">A tile&#x27;s scores alone cannot determine its final probabilities.</text></svg>