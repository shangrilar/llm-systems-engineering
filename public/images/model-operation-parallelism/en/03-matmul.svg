<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">Matrix Multiplication: Independent Outputs, Accumulation Within</title><desc id="desc">X, a 2-by-3 matrix, times W, a 3-by-4 matrix, produces Y, a 2-by-4 matrix. The rows of Y are 7,4,7,6 and 16,13,16,15. The first output is expanded as 1×1+2×0+3×2=7, showing multiplication and reduction. Multiple outputs can reuse a row of X or a column of W.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1100" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Matrix Multiplication: Independent Outputs, Accumulation Within</text><text x="48" y="141" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">M and N define the output shape; K is the length of the axis along which products are summed.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="600" y="219" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">X (M × K) × W (K × N) = Y (M × N)</text><text x="85" y="272" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">X · 2 × 3</text><text x="398" y="272" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">W · 3 × 4</text><text x="806" y="272" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Y · 2 × 4</text><rect x="85" y="304" width="58" height="58" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="114.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="147" y="304" width="58" height="58" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="176.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">2</text><rect x="209" y="304" width="58" height="58" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="238.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">3</text><rect x="85" y="366" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="114.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">4</text><rect x="147" y="366" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="176.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">5</text><rect x="209" y="366" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="238.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">6</text><text x="314" y="379" fill="#5C6C7C" font-size="34" font-weight="600" text-anchor="middle">×</text><rect x="398" y="304" width="58" height="58" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="427.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="460" y="304" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="489.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">2</text><rect x="522" y="304" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="551.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">0</text><rect x="584" y="304" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="613.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="398" y="366" width="58" height="58" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="427.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">0</text><rect x="460" y="366" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="489.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="522" y="366" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="551.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">2</text><rect x="584" y="366" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="613.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="398" y="428" width="58" height="58" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="427.0" y="465.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">2</text><rect x="460" y="428" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="489.0" y="465.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">0</text><rect x="522" y="428" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="551.0" y="465.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="584" y="428" width="58" height="58" rx="5" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="613.0" y="465.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><text x="720" y="379" fill="#5C6C7C" font-size="34" font-weight="600" text-anchor="middle">=</text><rect x="806" y="304" width="58" height="58" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="835.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">7</text><rect x="868" y="304" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="897.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">4</text><rect x="930" y="304" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="959.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">7</text><rect x="992" y="304" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="1021.0" y="341.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">6</text><rect x="806" y="366" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="835.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">16</text><rect x="868" y="366" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="897.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">13</text><rect x="930" y="366" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="959.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">16</text><rect x="992" y="366" width="58" height="58" rx="5" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="1021.0" y="403.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">15</text><text x="930" y="471" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">8 independent outputs</text><path d="M800,333 H767 V515 H600 V548" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" stroke-dasharray="7 7" /><rect x="48" y="560" width="1104" height="278" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="605" fill="#B55B22" font-size="26" font-weight="700" text-anchor="start">One output, expanded: the first element of Y</text><rect x="140" y="633" width="192" height="58" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="236.0" y="670.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1 × 1</text><path d="M236,699 L236,727" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" /><text x="236" y="760" fill="#B55B22" font-size="28" font-weight="700" text-anchor="middle">1</text><rect x="504" y="633" width="192" height="58" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="600.0" y="670.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">2 × 0</text><path d="M600,699 L600,727" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" /><text x="600" y="760" fill="#B55B22" font-size="28" font-weight="700" text-anchor="middle">0</text><rect x="868" y="633" width="192" height="58" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="964.0" y="670.0" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">3 × 2</text><path d="M964,699 L964,727" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" /><text x="964" y="760" fill="#B55B22" font-size="28" font-weight="700" text-anchor="middle">6</text><text x="600" y="810" fill="#B55B22" font-size="28" font-weight="700" text-anchor="middle">1 + 0 + 6 = 7</text><text x="600" y="892" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Sum the products along K to produce one output.</text><rect x="48" y="926" width="1104" height="131" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="969" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">Multiple outputs use the same inputs</text><text x="78" y="1013" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Same row of X → same row of Y     ·     Same column of W → same column of Y</text></svg>