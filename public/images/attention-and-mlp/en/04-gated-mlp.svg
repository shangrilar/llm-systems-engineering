<title id="title">Gated MLP: two branches, then multiply</title><desc id="desc">The same d=4 input branches into Gate projection followed by SiLU, producing g with m=8, and Up projection, producing u with m=8. Their component-wise product goes through Down projection to d=4. The three linear transformations are not a sequential stack.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1380" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Gated MLP: two branches, then multiply</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">In SwiGLU, both the Gate and Up values are computed from the same input.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="600" y="224" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">The same token input x · d = 4</text><rect x="400.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700.0" y="250" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="287.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">x<tspan baseline-shift="sub" font-size="70%">4</tspan></text><path d="M600,306 L600,360" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="600" cy="360" r="5" fill="#2470BB"/><path d="M600,360 H320 V404" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><path d="M600,360 H880 V404" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="120.0" y="420" width="400" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="320" y="452" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Gate projection</text><text x="320" y="480" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">d → m  ·  4 → 8</text><rect x="680.0" y="420" width="400" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="880" y="452" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Up projection</text><text x="880" y="480" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → m  ·  4 → 8</text><path d="M320,508 L320,548" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><rect x="120.0" y="562" width="400" height="70" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="320" y="594" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">SiLU</text><text x="320" y="622" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Component-wise activation</text><path d="M320,644 L320,682" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><path d="M880,508 L880,682" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="320" y="721" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">Gate values g · m = 8</text><text x="880" y="721" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Up values u · m = 8</text><rect x="96.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="124.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="152.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="180.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="208.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="236.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="264.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="292.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="320.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="348.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="376.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="404.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="432.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="460.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="488.0" y="743" width="56.0" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="516.0" y="780.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">g<tspan baseline-shift="sub" font-size="70%">8</tspan></text><rect x="656.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="684.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="712.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="740.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="768.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="796.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="824.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="852.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="880.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="908.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="936.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="964.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="992.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1020.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="1048.0" y="743" width="56.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1076.0" y="780.0" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">u<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M320,810 V862 H565" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><path d="M880,810 V862 H635" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><circle cx="600" cy="862" r="24" fill="white" stroke="#287D78" stroke-width="2.5"/><text x="600" y="871" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">⊙</text><text x="600" y="922" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">Multiply matching components · retain m dimensions</text><path d="M600,943 L600,983" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><rect x="410.0" y="998" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Down projection</text><text x="600" y="1058" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">m → d  ·  8 → 4</text><path d="M600,1086 L600,1126" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><rect x="400.0" y="1140" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500.0" y="1140" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600.0" y="1140" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700.0" y="1140" width="100.0" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="1177.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">4</tspan></text><text x="600" y="1238" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">Output: d = 4 · the three linear transformations are Gate, Up and Down.</text><path d="M48,1300 L1152,1300" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1341" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Gate and Up use different weights. Dimensions are illustrative; biases are omitted.</text>
