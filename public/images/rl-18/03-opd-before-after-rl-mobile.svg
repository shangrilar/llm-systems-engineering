<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1314" viewBox="0 0 360 1314" role="img" aria-labelledby="title desc"><title id="title">OPD의 위치는 학습 목적에 따라 달라진다</title><desc id="desc">왼쪽은 교사 RL로 전문 교사를 만든 후 확률 정보를 학생 OPD에 전달하고 학생을 평가한다. 오른쪽은 준비된 학생이 외부 교사의 정보로 OPD를 학습한 뒤 과제 보상으로 RL을 수행한다.</desc><metadata>{&quot;id&quot;:&quot;5-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek V4 §5.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2606.19348v1#S5.SS1&quot;},{&quot;label&quot;:&quot;RL Starts before RL&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.28145&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">OPD의 위치는 학습 목적에</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">따라 달라진다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">교사의 능력을 학생에게 통합할 수도 있고,</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">학생의 후속 RL을 준비할 수도 있습니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">능력 전달과 통합</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="108" width="488" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="139" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">교사의 분야별 RL</text><text x="32" y="179" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">각 분야 보상으로 전문 능력 학습</text></g><path d="M260 232 L260 269" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="282" width="488" height="100" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="313" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">준비된 전문 교사들</text><text x="32" y="353" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">학생 증류 중 교사는 고정</text></g><path d="M260 394 L260 482" stroke="#7954A3" stroke-width="2.5" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><text x="282" y="440" fill="#7954A3" font-size="19" font-weight="400" text-anchor="start" data-max-width="215">확률 정보</text><g data-container="true"><rect x="16" y="495" width="488" height="152" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="526" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학생의 OPD</text><text x="32" y="566" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">학생 문맥에서 교사의 분포를 읽고</text><text x="32" y="594" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">학생의 가중치 갱신</text></g><path d="M260 659 L260 762" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="776" width="488" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="807" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">통합된 학생 평가</text><text x="32" y="847" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">여러 분야 능력이 전달되었는가?</text></g></g><g transform="translate(16 825.4769230769231) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">후속 RL의 출발점 준비</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="108" width="488" height="100" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="139" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">준비된 학생</text><text x="32" y="179" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">출발 모델 체크포인트</text></g><path d="M260 220 L260 382" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="282" y="238" width="222" height="103" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="298" y="269" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="190">외부 교사</text><text x="298" y="309" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="190">학습 신호 제공</text></g><path d="M393 353 V369 H445 V382" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="395" width="488" height="112" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="426" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">학생의 OPD</text><text x="32" y="466" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">교사 정보로 학생을 먼저 학습</text></g><path d="M260 519 L260 557" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="570" width="488" height="130" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="601" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">같은 학생의 후속 RL</text><text x="32" y="641" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">과제 보상으로 계속 개선</text></g></g></svg>