ont-size="23" font-weight="400" text-anchor="start" data-max-width="1104">and C continue to occupy KV memory.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(0.9857142857142858)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1120">Request progress and KV snapshots</text><path d="M0 68 L1120 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="122" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="125">Slot</text><text x="150" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">0</text><path d="M150 136 L150 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="306.66666666666663" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">1</text><path d="M306.66666666666663 136 L306.66666666666663 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="463.3333333333333" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">2</text><path d="M463.3333333333333 136 L463.3333333333333 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="620" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">3</text><path d="M620 136 L620 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="776.6666666666666" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">4</text><path d="M776.6666666666666 136 L776.6666666666666 408" stroke="#DCE4EC" stroke-width="1" fill="none" stroke-dasharray="7 5"/><text x="933.3333333333333" y="121" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="40">5</text><path d="M933.3333333333333 136 L933.3333333333333 408" st