<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">An SM Executes Instructions in Warps</title><desc id="desc">A block of 128 threads is divided into warps 0 through 3, each with 32 threads. Each row contains exactly 32 cells. Four threads from warp 0 are expanded to show one addition instruction applied to individual inputs, producing 11, 22, 33, and 44. All threads participate here; partial participation due to branching is omitted. Cells do not represent CUDA Cores or instruction cycle counts.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1140" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">An SM Executes Instructions in Warps</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Each thread uses its own data, even when executing the same instruction.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="214" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="75" y="259" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">One block · 128 threads</text><text x="78" y="309" fill="#B55B22" font-size="24" font-weight="600" text-anchor="start">Warp 0</text><rect x="244" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="271" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="298" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="325" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="352" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="379" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="406" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="433" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="460" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="487" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="514" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="541" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="568" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="595" y="286" width="22" height="27" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-