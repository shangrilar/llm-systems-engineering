<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc"><title id="title">완료된 요청의 자리를 다음 요청에게</title><desc id="desc">Static에서는 A가 끝나도 B의 종료까지 C가 기다립니다. Continuous에서는 C의 prefill이 단계 3에 들어가고 decode 뒤 종료합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1110" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">완료된 요청의 자리를 다음 요청에게</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">동시에 최대 두 요청을 실행하는 교육용 일정입니다. 성능 측정값이 아닙니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">P = 전체 입력 prefill · D = 요청당 새 토큰 1개 decode · — = 실행 없음</text><text x="48" y="251.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Static batching</text><text x="310" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">1</text><text x="435" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">2</text><text x="560" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">3</text><text x="685" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">4</text><text x="810" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">5</text><text x="935" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">6</text><text x="1060" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">7</text><text x="48" y="350.0" fill="#2470BB" font-size="28" font-weig