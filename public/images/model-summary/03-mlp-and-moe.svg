<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1610" viewBox="0 0 1200 1610" role="img" aria-labelledby="title desc">
<title id="title">같은 자리에 놓이는 MLP와 MoE</title><desc id="desc">왼쪽 Gated MLP는 Gate projection과 SiLU, Up projection 결과의 성분별 곱, Down projection으로 이어진다. 오른쪽 MoE는 Router가 고른 두 Gated MLP expert의 결과를 가중합하며 선택적으로 shared expert 결과를 더한다. 둘 다 한 토큰의 d차원 입력에서 d차원 출력을 만든다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1610" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">같은 자리에 놓이는 MLP와 MoE</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">토큰 하나를 어떻게 변환할까요? 두 구조 모두 d차원으로 돌아옵니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="285" width="528" height="1145" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="331" fill="#182C40" font-size="31" font-weight="600" text-anchor="middle">Gated MLP</text><text x="312" y="376" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">모든 토큰에 같은 MLP 적용</text><rect x="192.0" y="425" width="240" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="455" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">x</text><text x="312" y="482" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">한 토큰의 d차원 입력</text><rect x="624" y="285" width="528" height="1145" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="331" fill="#182C40" font-size="31" font-weight="600" text-anchor="middle">MoE</text><text x="888" y="376" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">토큰마다 사용할 expert 선택</text><rect x="768.0" y="425" width="240" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="455" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">x</text><text x="888" y="482" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">한 토큰의 d차원 입력</text><path d="M312,510 V532 H182 V548" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-arrow)"/><path d="M312,532 H442 V548" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-arrow)"/><rect x="69.5" y="562" width="225" height="80" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="182" y="592" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Gate projection</text><text x="182" y="619" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → m</text><rect x="329.5" y="562" width="225" height="80" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="442" y="592" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Up projection</text><text x="442" y="619" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → m</text><path d="M182,655 L182,688" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="69.5" y="702" width="225" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="182" y="732" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">SiLU</text><text x="182" y="759" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">성분별 활성화</text><path d="M182,795 V900 H278" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M442,655 V900 H346" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><circle cx="312" cy="900" r="24" fill="white" stroke="#287D78" stroke-width="3"/><text x="312" y="909" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">⊙</text><text x="312" y="960" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">같은 성분끼리 곱하기</text><text x="312" y="995" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">m차원</text><path d="M312,1010 L312,1034" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="137.0" y="1048" width="350" height="85" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="1078" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Down projection</text><text x="312" y="1105" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">m → d</text><path d="M312,1146 L312,1274" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="192.0" y="1290" width="240" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="1320" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">y</text><text x="312" y="1347" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d차원 출력</text><path d="M888,510 V532 H806 V548" fill="none" stroke="#8191A0" stroke-width="2.2" marker-end="url(#arrow-arrow)"/><path d="M888,532 H1060 V728" fill="none" stroke="#8191A0" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-arrow)"/><path d="M888,518 H645 V830 H655" fill="none" stroke="#2470BB" stroke-width="2.2" marker-end="url(#blue-arrow)"/><text x="669" y="700" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start">입력 x</text><rect x="661.0" y="562" width="290" height="80" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="806" y="592" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">Router</text><text x="806" y="619" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">선택 + 가중치</text><path d="M806,655 L806,727" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="661" y="742" width="290" height="180" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="806" y="781" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">선택된 experts</text><rect x="677.0" y="806" width="118" height="85" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="736" y="836" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">E1</text><text x="736" y="863" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → d</text><rect x="817.0" y="806" width="118" height="85" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="876" y="836" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">E3</text><text x="876" y="863" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d → d</text><path d="M806,937 L806,1027" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="661.0" y="1040" width="290" height="88" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="806" y="1070" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">Combine</text><text x="806" y="1097" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">Router 가중치로 가중합</text><rect x="981" y="742" width="158" height="180" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="7 6"/><text x="1060" y="784" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">Shared</text><text x="1060" y="815" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">expert</text><text x="1060" y="858" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">선택 구성</text><text x="1060" y="894" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">d → d</text><path d="M806,1142 V1210 H854" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M1060,938 V1210 H922" fill="none" stroke="#8191A0" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#arrow-arrow)"/><circle cx="888" cy="1210" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M879,1210 L897,1210" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M888,1201 L888,1219" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M888,1244 L888,1274" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="768.0" y="1290" width="240" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="1320" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">y</text><text x="888" y="1347" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d차원 출력</text><text x="600" y="1494" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">각 expert의 내부도 왼쪽과 같은 Gated MLP 구조입니다.</text><text x="600" y="1542" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">점선: 일부 모델이 추가하는 Shared expert 경로 · 모든 토큰에 적용</text>
</svg>