<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Each GPU has its own compute and memory</title><desc id="desc">GPU 0 and GPU 1 each have compute units and HBM. Blue arrows show local memory traffic; purple arrows show communication between their memories. The memories are not depicted as one automatically pooled space.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="900" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 11 · Figure 1</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Each GPU has its own compute and memory</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Extend the view from data movement within one GPU to movement between GPUs.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="216" width="476" height="474" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="262" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">GPU 0</text><rect x="92" y="299" width="388" height="116" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="286.0" y="365.0" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">Compute units</text><path d="M198,435 L198,511" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M236,511 L236,435" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><text x="272" y="460" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Local memory</text><text x="272" y="492" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">traffic</text><rect x="92" y="530" width="388" height="112" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="286.0" y="594.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Own memory · HBM</text><rect x="676" y="216" width="476" height="474" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="704" y="262" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">GPU 1</text><rect x="720" y="299" width="388" height="116" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="914.0" y="365.0" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">Compute units</text><path d="M826,435 L826,511" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M864,511 L864,435" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><text x="900" y="460" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">Local memory</text><text x="900" y="492" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">traffic</text><rect x="720" y="530" width="388" height="112" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="914.0" y="594.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Own memory · HBM</text><path d="M482,561 L718,561" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><path d="M718,610 L482,610" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="600" y="470" fill="#7954A3" font-size="20" font-weight="400" text-anchor="middle">Between GPUs</text><text x="600" y="500" fill="#7954A3" font-size="20" font-weight="400" text-anchor="middle">Data transfer</text><text x="600" y="593" fill="#7954A3" font-size="20" font-weight="600" text-anchor="middle">Interconnect</text><rect x="48" y="727" width="1104" height="125" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="774" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">More compute and memory also introduce communication between GPUs.</text><text x="600" y="817" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">A computation that needs another GPU’s data must arrange that transfer.</text></svg>