<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1183" viewBox="0 0 1200 1183" role="img" aria-labelledby="title desc"><title id="title">같은 가중치로 더 많은 토큰 계산하기</title><desc id="desc">동일한 W를 입력 토큰 하나와 네 개에 사용하는 두 경우를 비교합니다. 출력 행과 선형 연산량은 하나에서 네 개로 늘지만 가중치 데이터량은 같습니다. 각 비교 막대는 해당 항목의 한 토큰 값을 기준으로 합니다.</desc><metadata>{&quot;id&quot;:&quot;03-weight-reuse&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">같은 가중치로 더 많은 토큰 계산하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">가중치의 크기는 같고, 함께 계산하는 입력과 출력 행이 늘어납니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="306" y="221" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">입력 토큰 1개</text><rect x="211" y="265" width="190" height="132" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><path d="M249,265 V397 M211, 291.4 H401" stroke="#7954A3" opacity=".18"/><path d="M287,265 V397 M211, 317.8 H401" stroke="#7954A3" opacity=".18"/><path d="M325,265 V397 M211, 344.2 H401" stroke="#7954A3" opacity=".18"/><path d="M363,265 V397 M211, 370.6 H401" stroke="#7954A3" opacity=".18"/><rect x="271" y="301" width="70" height="56" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="306" y="339" fill="#7954A3" font-size="33" font-weight="700" text-anchor="middle">W</text><path d="M306,412 L306,489" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="263" y="504" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="306" y="541" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t0</text><path d="M306,575 L306,610" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="263" y="626" width="86" height="18" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="306" y="691" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">출력 1행</text><text x="48" y="771" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">가중치 데이터량</text><rect x="48" y="790" width="240" height="38" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="306" y="818" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">1×</text><text x="48" y="884" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">선형 연산량</text><rect x="48" y="903" width="56" height="38" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124" y="931" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">1×</text><text x="894" y="221" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">입력 토큰 4개</text><rect x="799" y="265" width="190" height="132" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><path d="M837,265 V3