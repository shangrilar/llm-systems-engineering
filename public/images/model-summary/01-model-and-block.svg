rm</text><text x="248" y="962" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">마지막 정규화</text><path d="M248,994 L248,1064" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><text x="280" y="1036" fill="#2470BB" font-size="22" font-weight="400" text-anchor="start">T × d</text><rect x="108" y="1080" width="280" height="80" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="1128" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">LM Head</text><path d="M248,1175 L248,1240" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="93" y="1255" width="310" height="85" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="248" y="1285" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">Logits</text><text x="248" y="1312" fill="#B55B22" font-size="20" font-weight="400" text-anchor="middle">T × Vocab size</text><rect x="557.5" y="320" width="245" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="680" y="350" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">블록 입력</text><text x="680" y="377" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">T × d</text><text x="680" y="429" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Residual stream</text><path d="M680,445 L680,458" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="680" cy="458" r="5" fill="#2470BB"/><path d="M680,458 L680,761" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M680,458 H940 V487" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="790" y="500" width="300" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="530" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="940" y="557" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">토큰별 정규화</text><path d="M940,587 L940,617" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="790" y="630" width="300" height="75" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="660" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Attention</text><text x="940" y="687" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">그림 2에서 확대</text><path d="M940,718 V790 H715" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><circle cx="680" cy="790" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M671,790 L689,790" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,781 L680,799" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,815 L680,850" fill="none" stroke="#2470BB" stroke-width="3"/><circle cx="680" cy="850" r="5" fill="#2470BB"/><path d="M680,850 L680,1161" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><path d="M680,850 H940 V882" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="790" y="895" width="300" height="75" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="925" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle">RMSNorm</text><text x="940" y="952" fill="#287D78" font-size="20" font-weight="400" text-anchor="middle">토큰별 정규화</text><path d="M940,982 L940,1012" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="790" y="1025" width="300" height="75" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="940" y="1055" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">MLP 또는 MoE</text><text x="940" y="1082" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">그림 3에서 확대</text><path d="M940,1113 V1190 H715" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><circle cx="680" cy="1190" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M671,1190 L689,1190" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,1181 L680,1199" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M680,1215 L680,1276" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="557.5" y="1290" width="245" height="72" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="680" y="1320" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">블록 출력</text><text x="680" y="1347" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">T × d</text><text x="600" y="1450" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">블록에서는 d차원 흐름을 유지하고, 변환 결과를 Residual stream에 더합니다.</text></g></g><path d="M48,1503 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1541" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">블록 안에서는 Residual stream이 T × d를 유지하고, Attention과 MLP·MoE의 결과를 두 번 더합니다.</text></svg>