<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1046" viewBox="0 0 1200 1046" role="img" aria-labelledby="title desc"><title id="title">First, make room to run the workload</title><desc id="desc">One 24 GiB GPU cannot hold 24 GiB of weights plus 8 GiB for execution. TP2 places W1/W2 and W3/W4 on separate GPUs; each uses 12+8 GiB with 4 GiB free.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1046" fill="white"/><text x="48" y="60.0" font-size="32" fill="#182c40" font-weight="700" text-anchor="start">First, make room to run the workload</text><text x="48" y="111.0" font-size="23" fill="#526577" font-weight="400" text-anchor="start">Weights, request state, activations, and buffers must all fit.</text><path d="M48,158 H1152" stroke="#d5dfe8"/><rect x="48" y="206" width="342" height="662" rx="12" fill="#fbfcfd" stroke="#d5dfe8" stroke-width="2"/><rect x="438" y="206" width="714" height="662" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><text x="219" y="249.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">Whole model on one GPU</text><text x="795" y="249.0" font-size="26" fill="#182c40" font-weight="700" text-anchor="middle">TP 2 · One model across two GPUs</text><text x="795" y="301.0" font-size="23" fill="#246fb4" font-weight="400" text-anchor="middle">Both GPUs compute the same request</text><rect x="70" y="350" width="298" height="328" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="219" y="391.0" font-size="26" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><text x="219" y="445.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="middle">Weights: 24 GiB</text><rect x="87" y="522" width="192" height="60" rx="0" fill="#f2f5f7" stroke="#d5dfe8" stroke-width="2"/><rect x="87" y="522" width="48" height="60" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="111" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="135" y="522" width="48" height="60" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="159" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="183" y="522" width="48" height="60" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="207" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="231" y="522" width="48" height="60" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="255" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><rect x="279" y="522" width="64" height="60" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="311" y="560.0" font-size="23" fill="#b8701e" font-weight="700" text-anchor="middle">8</text><text x="183" y="500.0" font-size="21" fill="#526577" font-weight="400" text-anchor="middle">24 GiB available</text><path d="M279,494 V601" stroke="#b64036" stroke-width="3" stroke-dasharray="6 5"/><text x="219" y="636.0" font-size="20" fill="#b64036" font-weight="700" text-anchor="middle">Extra 8 GiB does not fit</text><rect x="460" y="350" width="324" height="328" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="622" y="391.0" font-size="26" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><text x="622" y="445.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="middle">Weights: 12 GiB</text><rect x="526" y="522" width="192" height="60" rx="0" fill="#f2f5f7" stroke="#d5dfe8" stroke-width="2"/><rect x="526" y="522" width="48" height="60" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="550" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="574" y="522" width="48" height="60" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="598" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="622" y="522" width="64" height="60" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="654" y="560.0" font-size="23" fill="#b8701e" font-weight="700" text-anchor="middle">8</text><text x="622" y="500.0" font-size="21" fill="#526577" font-weight="400" text-anchor="middle">24 GiB available</text><text x="622" y="636.0" font-size="21" fill="#526577" font-weight="400" text-anchor="middle">Execution: 8 + free: 4 GiB</text><rect x="806" y="350" width="324" height="328" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="968" y="391.0" font-size="26" fill="#182c40" font-weight="700" text-anchor="middle">GPU 1</text><text x="968" y="445.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="middle">Weights: 12 GiB</text><rect x="872" y="522" width="192" height="60" rx="0" fill="#f2f5f7" stroke="#d5dfe8" stroke-width="2"/><rect x="872" y="522" width="48" height="60" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="896" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="920" y="522" width="48" height="60" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="944" y="560.0" font-size="20" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><rect x="968" y="522" width="64" height="60" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="1000" y="560.0" font-size="23" fill="#b8701e" font-weight="700" text-anchor="middle">8</text><text x="968" y="500.0" font-size="21" fill="#526577" font-weight="400" text-anchor="middle">24 GiB available</text><text x="968" y="636.0" font-size="21" fill="#526577" font-weight="400" text-anchor="middle">Execution: 8 + free: 4 GiB</text><text x="219" y="733.0" font-size="26" fill="#182c40" font-weight="700" text-anchor="middle">24 + 8 = 32 GiB</text><text x="219" y="788.0" font-size="25" fill="#b64036" font-weight="700" text-anchor="middle">Insufficient memory</text><text x="795" y="733.0" font-size="27" fill="#182c40" font-weight="700" text-anchor="middle">Per GPU: 12 + 8 = 20 GiB</text><text x="795" y="788.0" font-size="27" fill="#247b72" font-weight="700" text-anchor="middle">A group that can run requests</text><rect x="100" y="918" width="30" height="25" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="144" y="940.0" font-size="22" fill="#182c40" font-weight="400" text-anchor="start">W1–W4: weight shards</text><rect x="490" y="918" width="30" height="25" rx="0" fill="#ffe3b5" stroke="#b8701e" stroke-width="2"/><text x="534" y="940.0" font-size="22" fill="#182c40" font-weight="400" text-anchor="start">Execution memory</text><rect x="866" y="918" width="30" height="25" rx="0" fill="#f2f5f7" stroke="#d5dfe8" stroke-width="2"/><text x="910" y="940.0" font-size="22" fill="#182c40" font-weight="400" text-anchor="start">Free memory</text><text x="600" y="1001.0" font-size="22" fill="#526577" font-weight="400" text-anchor="middle">Capacity example: assume 8 GiB of execution memory per GPU</text></svg>