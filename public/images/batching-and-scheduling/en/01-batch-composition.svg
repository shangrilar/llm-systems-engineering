<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">Static and continuous batching</title><desc id="desc">Each card is the batch selected for one execution. A and B are decoding. A completes at execution 1, then C arrives. Static batching waits for B to finish at execution 3 and prefills C at execution 4. Continuous batching selects B Decode and C Prefill for execution 2; B and C complete at execution 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1010" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Static and continuous batching</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Changing which requests enter the next execution lets new work fill vacant slots.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><defs><marker id="batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#526577" stroke-width="1.7"/></marker></defs><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">P = Prefill · D = Decode · ✓ = complete</text><text x="1152" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="end">At most 2 requests per execution</text><text x="48" y="262.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Static batching</text><text x="1152" y="262.0" fill="#526577" font-size="23" font-weight="400" text-anchor="end">Admit new requests after the whole batch finishes</text><rect x="148" y="286" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="319.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 1</text><rect x="161" y="334" width="162" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="242.0" y="368.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · D ✓</text><rect x="161" y="400" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242.0" y="434.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><path d="M338,380 L348,380" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="352" y="286" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="446" y="319.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 2</text><rect x="365" y="334" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="446.0" y="368.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><rect x="365" y="400" width="162" height="52" rx="8" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="446" y="434.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Idle slot</text><path d="M542,380 L552,380" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="556" y="286" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="650" y="319.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 3</text><rect x="569" y="334" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="650.0" y="368.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D ✓</text><rect x="569" y="400" width="162" height="52" rx="8" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="650" y="434.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Idle slot</text><path d="M746,380 L756,380" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="760" y="286" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="854" y="319.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 4</text><rect x="773" y="334" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="854.0" y="368.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · P</text><rect x="773" y="400" width="162" height="52" rx="8" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="854" y="434.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Idle slot</text><path d="M950,380 L960,380" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="964" y="286" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1058" y="319.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 5</text><rect x="977" y="334" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="1058.0" y="368.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · D ✓</text><rect x="977" y="400" width="162" height="52" rx="8" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="1058" y="434.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Idle slot</text><text x="48" y="512.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Queue</text><rect x="352" y="484" width="392" height="49" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="548.0" y="516.66" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C waiting</text><text x="242" y="562.0" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">C arrives after 1</text><text x="650" y="562.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">B completes</text><text x="854" y="562.0" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">C admitted</text><path d="M48,601 H1152" stroke="#DCE4EC"/><text x="48" y="653.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Continuous batching</text><text x="1152" y="653.0" fill="#526577" font-size="23" font-weight="400" text-anchor="end">Update the batch between executions</text><rect x="148" y="677" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="710.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 1</text><rect x="161" y="725" width="162" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="242.0" y="759.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · D ✓</text><rect x="161" y="791" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242.0" y="825.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><path d="M338,771 L348,771" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="352" y="677" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#7954A3" stroke-width="1.5"/><text x="446" y="710.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 2</text><rect x="365" y="725" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="446.0" y="759.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><rect x="365" y="791" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="446.0" y="825.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · P</text><path d="M542,771 L552,771" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="556" y="677" width="188" height="188" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="650" y="710.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Execution 3</text><rect x="569" y="725" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="650.0" y="759.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D ✓</text><rect x="569" y="791" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="650.0" y="825.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · D ✓</text><text x="950" y="762.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">All three requests complete</text><text x="950" y="808.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">C also starts with Prefill</text><text x="242" y="906.0" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">C arrives after 1</text><text x="446" y="906.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">[A, B] → [B, C]</text><text x="48" y="968.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Columns show execution order. A and B are already decoding; C is new.</text></svg>