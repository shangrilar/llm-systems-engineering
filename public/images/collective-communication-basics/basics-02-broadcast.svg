<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="777" viewBox="0 0 1200 777" role="img" aria-labelledby="title desc">
<title id="title">Broadcast: 같은 데이터를 모두에게</title><desc id="desc">root인 GPU 0의 입력은 [1,2]이다. 나머지 GPU는 이 동작의 입력을 제공하지 않지만 수신에 참여한다. Broadcast 완료 후 네 GPU의 출력 버퍼에 같은 [1,2]가 있다. root는 고정된 물리 장치 종류가 아니라 통신 그룹 안의 역할이며 이 예시에서는 GPU 번호와 rank를 같게 두었다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="777" fill="white"/>
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">집합 통신의 기본 동작 · 그림 2</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Broadcast: 같은 데이터를 모두에게</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">root는 기준 데이터를 제공하는 참여자입니다. 여기서는 GPU 0이 맡습니다.</text><path d="M48,169 H1152" stroke="#DCE4EC"/><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">통신 전 · 입력 버퍼</text><rect x="48" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="222" y="244" width="72" height="30" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="258" y="266" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle">root</text><rect x="72" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="236.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M180,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5"/><text x="364" y="267" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="460" y="326.0" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">입력 제공 없음</text><rect x="608" y="229" width="264" heig