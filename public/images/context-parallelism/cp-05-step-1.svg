<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020" role="img" aria-labelledby="title desc"><title id="title">인과적 어텐션에서는 토큰 배치도 중요합니다 · 앞·뒤 토큰을 묶은 분할</title><desc id="desc">GPU 0과 GPU 1이 각각 네 토큰을 맡는다. 계산할 토큰 쌍은 18 대 18이다. 원래 토큰 위치와 causal mask는 변하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1020" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">인과적 어텐션에서는 토큰 배치도 중요합니다</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">토큰 8개 · GPU 2개 · 각 GPU의 Q가 계산할 토큰 쌍 수를 비교</text><path d="M40,112 H1160" stroke="#d8e2ea"/><text x="600" y="159.0" font-size="27" fill="#183149" font-weight="700" text-anchor="middle">앞·뒤 토큰을 묶어 배치</text><text x="156" y="280.9" font-size="22" fill="#2470bb" font-weight="700" text-anchor="end">t0</text><text x="206.0" y="216.0" font-size="20" fill="#587084" font-weight="400" text-anchor="middle">t0</text><rect x="173" y="238" width="66" height="66" rx="0" fill="#eaf3fd" stroke="#2470bb" stroke-width="1.5"/><text x="206.0" y="281.56" font-size="24" fill="#2470bb" font-weight="400" text-anchor="middle">●</text><rect x="239" y="238" width="66" height="66" rx="0" fill="#fafafa" stroke="#d8e2ea" stroke-width="1.5"/><rect x="305" y="238" width="66" height="66" rx="0" fill="#fafafa" stroke="#d8e2ea" stroke-width="1.5"/><rect x="371" y="238" width="66" height="66" rx="0" fill="#fafafa" stroke="#d8e2ea" stroke-width="1.5"/><rect x="437" y="238" width="66" height="66" rx="0" fill="#fafafa" stroke="#d8e2ea" stroke-width="1.5"/><rect x="503" y="238" width="66" height="66" rx="0" fill="#fafafa"