<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1323" viewBox="0 0 1200 1323" role="img" aria-labelledby="title desc"><title id="title">읽고 섞고 나누어 쓰는 계수의 역할이 다릅니다</title><desc id="desc">첫 패널에서 H_pre .75,.25가 X [[2,0],[0,2]]를 [1.5,.5]로 읽고 F 출력 .4,−.2를 가정한다. 둘째 패널은 H_res [[.8,.2],[.2,.8]]로 같은 X를 섞어 B [[1.6,.4],[.4,1.6]]를 만든다. 첫 패널의 쓰기 계수 [1,.5] 세로벡터와 u의 곱 W [[.4,−.2],[.2,−.1]]를 B에 더해 [[2,.2],[.6,1.5]]를 얻는다.</desc><metadata>{&quot;id&quot;:&quot;ma-13-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC §3, three HC mappings; transpose convention explained in caption&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1#S3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3 · 세 연결의 계산</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">읽고 섞고 나누어 쓰는 계수의 역할이 다릅니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 토큰 · 두 stream · d = 2 · X의 행은 stream, 열은 특징 성분</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 읽기 → F → 쓰기 기여</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="118" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="490">같은 입력 X · 행 = stream</text><g data-container="true"><rect x="205" y="155" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="250" y="189.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">2</text></g><g data-container="true"><rect x="303" y="155" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="348" y="189.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0</text></g><g data-container="true"><rect x="205" y="215" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="250" y="249.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0</text></g><g data-container="true"><rect x="303" y="215" width="90" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="348" y="249.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">2</text></g><text x="193" y="189.64" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="end" data-max-width="45">x₁</text><text x="193" y="249.64" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="end" data-max-width="45">x₂</text><path d="M299 278 L299 310" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="55" y="323" width="410" height="115" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="71" y="354" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">읽기 · 0.75 x₁ + 0.25 x₂</text><text x="71" y="394" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">[1.5, 0.5]</text></g><path d="M260 448 L260 480" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="55" y="492" width="410" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="71" y="523" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">F · 출력 u를 가정</text><text x="71" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">u = [0.4, −0.2]</text></g><path d="M260 614 L260 650" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="55" y="662" width="410" height="112" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="71" y="693" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="378">쓰기 · stream별 배율</text><text x="71" y="733" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="378">1 × u,  0.5 × u</text></g><path d="M260 784 L260 817" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="205" y="833" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="250" y="867.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">0.4</text></g><g data-container="true"><rect x="303" y="833" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="348" y="867.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="78">−0.2</text></g><g data-container="true"><rect x="205" y="893" width="90" height="52" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="250" y="927.64" fill=