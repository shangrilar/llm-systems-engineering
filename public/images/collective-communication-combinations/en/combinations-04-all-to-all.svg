<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1093" viewBox="0 0 1200 1093" role="img" aria-labelledby="title desc">
<title id="title">All-to-All: exchange destination chunks</title><desc id="desc">Each GPU sends one chunk for each destination and receives its own destination chunks from all source GPUs in rank order. Labels indicate source to destination; colors follow the source.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1093" fill="white" />
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Combining and Extending Collectives · Figure 4</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">All-to-All: exchange destination chunks</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Each box is a chunk. Its label means source GPU → destination GPU.</text><path d="M48,169 H1152" stroke="#DCE4EC" /><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Before communication · input buffers</text><rect x="48" y="229" width="264" height="298" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5" /><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="72" y="293" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="180.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 0</text><rect x="72" y="347" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="180.0" y="378" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 1</text><rect x="72" y="401" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="180.0" y="432" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 2</text><rect x="72" y="455" width="216" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="180.0" y="486" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0 → 3</text><path d="M180,536 V565" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="328" y="229" width="264" height="298" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5" /><text x="364" y="267" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="293" width="216" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="460.0" y="324" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1 → 0</text><rect x="352" y="347" width="216" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="460.0" y="378" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1 → 1</text><rect x="352" y="401" width="216" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="460.0" y="432" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1 → 2</text><rect x="352" y="455" width="216" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="460.0" y="486" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1 → 3</text><path d="M460,536 V565" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="608" y="229" width="264" height="298" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5" /><rect x="624" y="244" width="8" height="27" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5" /><text x="644" y="267" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><rect x="632" y="293" width="216" height="44" rx="7" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" /><text x="740.0" y="324" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">2 → 0</text><rect x="632" y="347" width="216" height="44" rx="7" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" /><text x="740.0" y="378" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">2 → 1</text><rect x="632" y="401" width="216" height="44" rx="7" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" /><text x="740.0" y="432" fill="#7954A3" font-s