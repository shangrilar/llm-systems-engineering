<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">이번 계산 위치와 참조할 문맥</title><desc id="desc">Prefill은 네 입력 위치의 projection과 MLP를 계산하고 삼각형 causal attention을 적용합니다. Decode는 요청마다 한 입력 위치만 계산하지만 각 Q는 자기 요청의 길이 L인 K/V를 참조합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1260" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">이번 계산 위치와 참조할 문맥</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">토큰별 연산에는 이번 위치 수가, attention에는 참조하는 문맥 길이도 중요합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="213.0" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">Prefill: 한 요청, 입력 4개</text><rect x="48" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="91.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="148" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="191.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="248" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="291.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="348" y="243" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="391.0" y="280.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">p3</text><g data-box="502,243,650,133"><rect x="502" y="243" width="650" height="133" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="522" y="278.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">토큰별 연산: T = 4</text><text x="522" y="321.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Projection · MLP는 네 입력 위치를 계산</text><text x="522" y="351.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Attention은 각 위치에서 과거·현재 K/V 참조</text></g><text x="48" y="418.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">인과적 어텐션: 행은 Q, 열은 K/V 위치</text><text x="258" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p0</text><text x="324" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p1</text><text x="390" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p2</text><text x="456" y="468.0" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle">p3</text><text x="48" y="520.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p0)</text><rect x="232" y="488" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="517.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="488" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="517.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><rect x="364" y="488" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="517.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><rect x="430" y="488" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="517.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><text x="48" y="576.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p1)</text><rect x="232" y="544" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="573.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="544" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="573.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="364" y="544" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="573.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><rect x="430" y="544" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="573.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><text x="48" y="632.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p2)</text><rect x="232" y="600" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="629.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="600" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="629.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="364" y="600" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="629.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="430" y="600" width="51" height="42" rx="10" fill="#F3F5F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="629.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">—</text><text x="48" y="688.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q(p3)</text><rect x="232" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="257" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="298" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="323" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="364" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="389" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><rect x="430" y="656" width="51" height="42" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="455" y="685.0" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">●</text><g data-box="642,463,510,240"><rect x="642" y="463" width="510" height="240" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="498.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">여러 위치의 Q를 함께 계산</text><text x="662" y="541.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Q: [4, d] · K/V: [4, d]</text><text x="662" y="571.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">점수의 논리적 형태: [4, 4]</text><text x="662" y="602.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">미래 위치는 마스크로 제외</text></g><text x="48" y="779.0" fill="#B55B22" font-size="27" font-weight="700" text-anchor="start">Decode: 요청 B개, 요청당 새 입력 1개</text><g data-box="48,808,510,196"><rect x="48" y="808" width="510" height="196" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="68" y="843.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">토큰별 연산: T = B</text><text x="68" y="886.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청 A의 새 입력 x0</text><text x="68" y="916.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청 B의 새 입력 x0</text><text x="68" y="947.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청마다 독립적인 토큰·문맥</text></g><g data-box="642,808,510,196"><rect x="642" y="808" width="510" height="196" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="843.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">요청마다 자기 누적 K/V 참조</text><text x="662" y="886.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청당 Q: [1, d]</text><text x="662" y="916.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청당 K/V: [L, d]</text><text x="662" y="947.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">요청당 점수: [1, L]</text></g><g data-box="48,1044,1104,114"><rect x="48" y="1044" width="1104" height="114" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="1079.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">T: 이번 계산 위치 수 · L: 한 요청이 참조하는 누적 문맥 길이</text><text x="70" y="1121.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">한 head의 단순 차원입니다. L은 현재 위치를 포함하며 요청마다 다를 수 있습니다.</text></g><text x="48" y="1205.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">● 참조할 위치 / — 미래라 제외. 점수 배열을 실제 메모리에 저장해야 한다는 뜻은 아닙니다.</text></svg>