<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="title desc"><title id="title">전달 순서와 실제 연결을 구별하기</title><desc id="desc">논리적으로 Ring 순서로 전달해도 네 GPU가 공유 스위치를 거칠 수 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="884" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">전달 순서와 실제 연결을 구별하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">위는 알고리즘의 관계, 아래는 가능한 물리 연결의 한 예입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="198" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="234.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">논리적 Ring: 통신 상대와 순서</text><text x="72" y="274.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0 → GPU 1 → GPU 2 → GPU 3 → GPU 0</text><text x="48" y="360.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">실제 하드웨어: GPU들이 스위치를 통해 연결된 예</text><rect x="48" y="407" width="240" height="120" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="443.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="493.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M168,536 L426,637" stroke="#526577" stroke-width="2.5"/><rect x="336" y="407" width="240" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="354" y="443.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="354" y="493.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M456,536 L542,637" stroke="#526577" stroke-width="2.5"/><rect x="624" y="407" width="240" height="120" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="642" y="443.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="642" y="493.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M744,536 L658,637" stroke="#526577" stroke-width="2.5"/><rect x="912" y="407" width="240" height="120" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="930" y="443.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="930" y="493.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M1032,536 L774,637" stroke="#526577" stroke-width="2.5"/><rect x="375" y="637" width="450" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="393" y="673.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">공유 스위치</text><text x="393" y="723.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 경로에서 대역폭 경쟁 가능</text><text x="48" y="828.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Ring의 이웃이라고 전용 케이블로 직접 연결된 것은 아닙니다.</text></svg>