<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1215" viewBox="0 0 1200 1215" role="img" aria-labelledby="title desc"><title id="title">Use program state to relieve memory pressure</title><desc id="desc">Reasoning P and Acting Q hold KV on backend A. Pause Q, detach it from the backend and retain its record in a global queue. Restore on A or B with capacity, recomputing evicted prefix KV before later Reasoning.</desc><metadata>{&quot;id&quot;:&quot;12-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1#S4&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Use program state to relieve memory pressure</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">A simplified view of ThunderAgent program-aware scheduling. Phase, context length and available</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">capacity inform Pause and Restore.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(0.9857142857142858)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1120">Reclaim resources, retain the program</text><path d="M0 68 L1120 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g transform="translate(0 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">① KV pressure</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="101" width="312" height="99" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="132" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Backend A</text><text x="32" y="172" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">KV capacity is tight</text></g><g data-container="true"><rect x="16" y="226" width="312" height="110" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="257" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">P · Reasoning</text><text x="32" y="297" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Generating on GPU</text></g><g data-container="true"><rect x="16" y="362" width="312" height="110" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="393" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Q · Acting</text><text x="32" y="433" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Tool running · KV held</text></g><text x="16" y="524" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="312">Protect current Reasoning</text><text x="16" y="554.8" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="312">when choosing a Pause</text><text x="16" y="585.6" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="312">candidate</text></g><g transform="translate(388 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">② Pause</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="101" width="312" height="135" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="132" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Q · global queue</text><text x="32" y="172" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Keep program records and</text><text x="32" y="200" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">tool-state tracking</text></g><path d="M172 247 L172 299" stroke="#657789" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="172" y="320" fill="#B34242" font-size="30" font-weight="400" text-anchor="middle" data-max-width="50">×</text><g data-container="true"><rect x="16" y="346" width="312" height="125" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="377" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Detach from backend A</text><text x="32" y="417" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">KV becomes reclaimable</text></g><text x="16" y="524" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="312">Retaining the program ≠</text><text x="16" y="554.8" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="312">retaining its GPU KV</text></g><g transform="translate(776 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="344">③ Restore</text><path d="M0 68 L344 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="101" width="312" height="135" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="132" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Backend A or B</text><text x="32" y="172" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Place on a backend with</text><text x="32" y="200" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">capacity</text></g><path d="M172 242 L172 285" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="295" width="312" height="124" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="326" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Recompute evicted KV</text><text x="32" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Prepare valid context</text></g><path d="M172 425 L172 468" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="478" width="312" height="110" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="509" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="280">Q · later Reasoning</text><text x="32" y="549" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="280">Continue with tool results</text></g></g><text x="16" y="816" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="1088">Retain: KV stays occupied while waiting · Evict: may need recomputation on resume</text></g></svg>