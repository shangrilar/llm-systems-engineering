th="490">점수ᵢ = wᵀ RMSNorm(sourceᵢ)</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 비중을 원본에 적용</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="124" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="480">e, f₁, f₂의 점수</text><g data-container="true"><rect x="56" y="153" width="128" height="60" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="120" y="191.64" fill="#2470BB" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">0</text></g><g data-container="true"><rect x="196" y="153" width="128" height="60" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="191.64" fill="#2470BB" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">ln2</text></g><g data-container="true"><rect x="336" y="153" width="128" height="60" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="400" y="191.64" fill="#2470BB" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">0</text></g><path d="M260 229 L260 292" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="286" y="265" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start" data-max-width="190">softmax</text><g data-container="true"><rect x="56" y="312" width="128" height="60" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="120" y="350.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">0.25</text></g><g data-container="true"><rect x="196" y="312" width="128" height="60" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="350.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">0.5</text></g><g data-container="true"><rect x="336" y="312" width="128" height="60" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="400" y="350.64" fill="#B55B22" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">0.25</text></g><path d="M260 389 L260 440" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="25" y="457" width="470" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="41" y="488" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="438">정규화 전 원본의 가중합</text><text x="41" y="528" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="438">h₃ = .25e + .5f₁ + .25f₂</text></g><g data-container="true"><rect x="56" y="615" width="128" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="120" y="653.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">0.5</text></g><g data-container="true"><rect x="196" y="615" width="128" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="653.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">2</text></g><g data-container="true"><rect x="336" y="615" width="128" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="400" y="653.64" fill="#287D78" font-size="27" font-weight="500" text-anchor="middle" data-max-width="116">1.5</text></g><text x="260" y="737" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="480">같은 w라도 source에 따라 비중이 변함</text></g></svg>