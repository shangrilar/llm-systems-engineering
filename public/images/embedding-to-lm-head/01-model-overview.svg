<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">LLM의 전체 구조</title><desc id="desc">왼쪽은 Embedding, Decoder block × N, LM Head의 압축 표현이다. 오른쪽은 같은 구조의 Decoder block 1, 2, 생략 기호, N을 펼쳐 보여준다. 블록들은 구조가 반복되며 내부는 표시하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"Arial","Apple SD Gothic Neo","Noto Sans KR",sans-serif;} path,line{stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1200" height="900" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" >그림 1</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" >LLM의 전체 구조</text>
<text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" >디코더 블록의 내부는 잠시 닫아 두고, 입력부터 출력까지의 경로를 봅니다.</text>
<line x1="48" y1="169" x2="1152" y2="169" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="195" width="534" height="555" rx="14" fill="#FAFCFE" stroke="#DCE4EC" stroke-width="1.5"/><rect x="618" y="195" width="534" height="555" rx="14" fill="#FAFCFE" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="236" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle" >압축해서 보기</text><text x="885" y="236" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle" >펼쳐서 보기</text><rect x="165" y="265" width="300" height="64" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="315.0" y="306.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Embedding</text><rect x="165" y="648" width="300" height="64" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="315.0" y="689.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >LM Head</text><rect x="735" y="265" width="300" height="64" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="885.0" y="306.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Embedding</text><rect x="735" y="648" width="300" height="64" rx="14" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="885.0" y="689.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >LM Head</text><text x="600" y="786" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle" >같은 구조를 압축하거나 펼쳐서 표현한 것입니다.</text><rect x="165" y="424" width="300" height="105" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="315.0" y="476.5" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Decoder block</text><text x="315.0" y="507.5" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle" >× N</text><path d="M315,340 L315,410" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M315,542 L315,634" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="360" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885.0" y="401.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Decoder block 1</text><path d="M885,337 L885,350" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="735" y="449" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885.0" y="490.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Decoder block 2</text><path d="M885,429 L885,440" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><text x="885" y="545" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle" >⋮</text><rect x="735" y="564" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885.0" y="605.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Decoder block N</text><path d="M885,634 L885,641" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><line x1="1080" y1="360" x2="1090" y2="360" stroke="#5C6C7C" stroke-width="2"/><line x1="1090" y1="360" x2="1090" y2="628" stroke="#5C6C7C" stroke-width="2"/><line x1="1080" y1="628" x2="1090" y2="628" stroke="#5C6C7C" stroke-width="2"/><text x="1112" y="504" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" transform="rotate(90 1112 504)">N개</text>
<line x1="48" y1="820" x2="1152" y2="820" stroke="#DCE4EC" stroke-width="2"/>
<text x="48" y="861" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" >구조를 단순화한 그림입니다. 최종 정규화 등 세부 단계는 생략했습니다.</text>
</svg>