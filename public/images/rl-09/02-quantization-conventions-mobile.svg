<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1112" viewBox="0 0 360 1112" role="img" aria-labelledby="title desc"><title id="title">추론만 양자화하거나, 학습 순전파도 맞춘다</title><desc id="desc">왼쪽은 공통 양자화 규약으로 학습 순전파와 추론이 같은 양자화 값을 사용한다. 오른쪽은 학습은 BF16 원래 값을 쓰고 추론은 FP8 근삿값을 쓴다.</desc><metadata>{&quot;id&quot;:&quot;8-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §3.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">추론만 양자화하거나, 학습</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">순전파도 맞춘다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">각 구성에서 두 엔진에 같은 입력 P와 앞선</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">토큰을 넣습니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">양쪽에 같은 양자화 적용</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="65" y="100" width="390" height="95" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="81" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">같은 가중치 버전</text></g><path d="M260 208 L260 244" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="260" width="488" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="291" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">공통 양자화 규약</text><text x="32" y="331" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">같은 값·scale 규칙</text></g><path d="M260 396 V422 H132 V452" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 422 H388 V452" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="470" width="232" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">학습 순전파</text><text x="32" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">양자화한 값</text></g><g data-container="true"><rect x="272" y="470" width="232" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="288" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">추론</text><text x="288" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">같은 양자화 값</text></g><text x="260" y="646" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle" data-max-width="488">FP8 / MXFP8 / NVFP4</text></g><g transform="translate(16 658.3230769230769) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">BF16 학습 + FP8 추론</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="65" y="100" width="390" height="95" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="81" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">같은 가중치 버전</text></g><path d="M260 208 V235 H132 V452" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 235 H388 V270" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="276" y="285" width="228" height="100" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="292" y="316" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="196">FP8 양자화</text></g><path d="M388 398 L388 452" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="470" width="232" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">학습 순전파</text><text x="32" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">BF16 원래 값</text></g><g data-container="true"><rect x="272" y="470" width="232" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="288" y="501" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">추론</text><text x="288" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">FP8 근삿값</text></g></g></svg>