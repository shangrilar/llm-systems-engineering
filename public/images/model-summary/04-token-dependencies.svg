<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1960" viewBox="0 0 1200 1960" role="img" aria-labelledby="title desc">
<title id="title">토큰 사이의 정보는 어디서 합쳐질까요?</title><desc id="desc">세 토큰의 세로 경로를 나란히 표시한다. RMSNorm, projection, RoPE와 MLP 또는 MoE는 같은 토큰 위치에서 계산한다. Core Attention에서 토큰1의 결과는 토큰1, 토큰2의 결과는 토큰1과2, 토큰3의 결과는 토큰1과2와3에 의존한다. 이어붙이기와 출력 projection, Residual 덧셈도 같은 위치에서 진행한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
