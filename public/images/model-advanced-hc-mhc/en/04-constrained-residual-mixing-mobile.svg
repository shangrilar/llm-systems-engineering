<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1124" viewBox="0 0 360 1124" role="img" aria-labelledby="title desc"><title id="title">mHC constrains how streams are mixed</title><desc id="desc">Mixing [2,0] gives [1.6,.4], both within0–2 and summing to2. H_res=[[.8,.2],[.2,.8]] has unit row and column sums, obtained from positive scores by iterative normalization.</desc><metadata>{&quot;id&quot;:&quot;ma-13-04&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC §4.1–4.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1#S4.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 5</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">mHC constrains how</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">streams are mixed</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Zoom into bypass H_res · Same</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">illustrative matrix as before</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Values mix; the sum is kept</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="25" y="115" width="185" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="117.5" y="155.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="173">[2, 0]ᵀ</text><path d="M220 148 L296 148" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="310" y="115" width="190" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="405" y="155.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="178">[1.6, 0.4]ᵀ</text><text x="260" y="230" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle" data-max-width="490">0.8 × 2 + 0.2 × 0 = 1.6</text><text x="260" y="274" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle" data-max-width="490">0.2 × 2 + 0.8 × 0 = 0.4</text><text x="260" y="350" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle" data-max-width="490">Each output stays in the input range</text><path d="M45 401 L475 401" stroke="#5C6C7C" stroke-width="2" fill="none"/><circle cx="45" cy="401" r="5" fill="#287D78" stroke="#287D78"/><text x="45" y="444" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="75">0</text><circle cx="131" cy="401" r="5" fill="#287D78" stroke="#287D78"/><text x="131" y="444" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="75">0.4</text><circle cx="389" cy="401" r="5" fill="#287D78" stroke="#287D78"/><text x="389" y="444" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="75">1.6</text><circle cx="475" cy="401" r="5" fill="#287D78" stroke="#287D78"/><text x="475" y="444" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle" data-max-width="75">2</text><g data-container="true"><rect x="40" y="495" width="440" height="95" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="526" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">Preserve the sum across streams</text><text x="56" y="566" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">2 + 0 = 1.6 + 0.4 = 2</text></g><text x="260" y="645" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="490">Before adding the fresh F output</text></g><g transform="translate(16 664.6307692307691) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Make row and column sums 1</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="118" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="490">Every coefficient ≥ 0</text><g data-container="true"><rect x="130" y="172" width="90" height="58" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="175" y="209.96" fill="#287D78" font-size="28" font-weight="500" text-anchor="middle" data-max-width="78">0.8</text></g><g data-container="true"><rect x="232" y="172" width="90" height="58" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="277" y="209.96" fill="#287D78" font-size="28" font-weight="500" text-anchor="middle" data-max-width="78">0.2</text></g><g data-container="true"><rect x="130" y="242" width="90" height="58" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="175" y="279.96" fill="#287D78" font-size="28" font-weight="500" text-anchor="middle" data-max-width="78">0.2</text></g><g data-container="true"><rect x="232" y="242" width="90" height="58" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="277" y="279.96" fill="#287D78" font-size="28" font-weight="500" text-anchor="middle" data-max-width="78">0.8</text></g><text x="400" y="210" fill="#287D78" font-size="28" font-weight="400" text-anchor="start" data-max-width="90">= 1</text><text x="400" y="280" fill="#287D78" font-size="28" font-weight="400" text-anchor="start" data-max-width="90">= 1</text><text x="175" y="355" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle" data-max-width="60">1</text><text x="277" y="355" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle" data-max-width="60">1</text><text x="398" y="355" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="115">Column</text><text x="398" y="384.4" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="115">sums</text><text x="260" y="408" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="500">Rows: bound values · Columns: keep sum</text><g data-container="true"><rect x="35" y="461" width="450" height="133" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="51" y="492" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="418">How coefficients are formed</text><text x="51" y="532" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="418">Scores → positive entries → repeated</text><text x="51" y="560" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="418">row/column normalization</text></g><text x="260" y="645" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="490">Read and write have separate gates</text></g></svg>