<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="918" viewBox="0 0 1200 918" role="img" aria-labelledby="title desc"><title id="title">Replace a large reservation with needed blocks</title><desc id="desc">B has 6 KV positions in a 24-position pool. Reserving 20 leaves 14 unused reserved positions and only 4 free, so C with 6 input tokens waits. With 4 positions per block, assigning 2 blocks to B and 2 to C leaves 2 free blocks. C’s assigned blocks are still empty because its inputs have not yet been processed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="918" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Replace a large reservation with needed blocks</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">The same 24-position KV pool can admit C when B reserves less space in advance.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="207.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B currently holds 6 KV positions</text><text x="1152" y="207.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="end">New request C · 6 input tokens</text><text x="48" y="278.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Reserve a large region in advance</text><text x="1152" y="278.0" fill="#7954A3" font-size="27" font-weight="700" text-anchor="end">C waits</text><text x="68" y="335.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">20 positions reserved for B</text><text x="1060" y="335.0" fill="#526577" font-size="24" font-weight="700" text-anchor="middle">4 free</text><rect x="58" y="354" width="900" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="978" y="354" width="164" height="90" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="66" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="83.0" y="406.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="104" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121.0" y="406.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="142" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159.0" y="406.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="180" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="197.0" y="406.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="250" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="267.0" y="406.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="288" y="375" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="305.0" y="406.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="326" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="364" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="472" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="510" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="548" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="618" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="656" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="694" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="732" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="802" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="840" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="878" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="916" y="375" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="986" y="375" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="1024" y="375" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="1062" y="375" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="1100" y="375" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><text x="191" y="485.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">6 actual KV</text><text x="638" y="485.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">14 reserved, unused</text><text x="1060" y="485.0" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">4 &lt; C’s 6 inputs</text><path d="M48,531 H1152" stroke="#DCE4EC"/><text x="48" y="587.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Allocate only the blocks needed</text><text x="1152" y="587.0" fill="#7954A3" font-size="27" font-weight="700" text-anchor="end">C can join</text><text x="232" y="644.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 2 blocks = 8 slots</text><text x="600" y="644.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · 2 blocks = 8 slots</text><text x="968" y="644.0" fill="#526577" font-size="24" font-weight="700" text-anchor="middle">Free · 2 blocks = 8 slots</text><rect x="58" y="666" width="164" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="66" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="83.0" y="718.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="104" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="121.0" y="718.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="142" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159.0" y="718.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="180" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="197.0" y="718.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="242" y="666" width="164" height="90" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="250" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="267.0" y="718.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="288" y="687" width="34" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="305.0" y="718.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="326" y="687" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="364" y="687" width="34" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="426" y="666" width="164" height="90" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="434" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="472" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="510" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="548" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="610" y="666" width="164" height="90" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="618" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="656" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="694" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="732" y="687" width="34" height="48" rx="5" fill="white" stroke="#7954A3" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="794" y="666" width="164" height="90" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="802" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="840" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="878" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="916" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="978" y="666" width="164" height="90" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="986" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="1024" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="1062" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><rect x="1100" y="687" width="34" height="48" rx="5" fill="white" stroke="#526577" stroke-width="1.5"/><text x="232" y="799.0" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">B can grow to 7 KV positions</text><text x="600" y="799.0" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">Allocated to C · still empty</text><text x="968" y="799.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">2 blocks remain free</text><text x="48" y="868.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">1 block = 4 KV positions · Filled cells hold KV; empty cells do not.</text></svg>