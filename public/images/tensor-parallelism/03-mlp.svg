<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="867" viewBox="0 0 1200 867" role="img" aria-labelledby="title desc"><title id="title">두 연산 사이의 조각을 그대로 사용하기</title><desc id="desc">첫 선형 연산의 열 분할과 둘째 선형 연산의 행 분할을 연결해 중간 All-Gather를 피하는 MLP 흐름입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="867" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">두 연산 사이의 조각을 그대로 사용하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">중간 H를 모으지 않아도, 각 GPU가 자기 조각으로 다음 부분합을 계산할 수 있습니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="204" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="241.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">계산 순서 ↓</text><rect x="328" y="204" width="406" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="241.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="740" y="204" width="406" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="241.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="48" y="270" width="274" height="88" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="304.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">같은 입력</text><rect x="328" y="270" width="406" height="88" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="304.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">X</text><rect x="740" y="270" width="406" height="88" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="304.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">X</text><rect x="48" y="366" width="274" height="88" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="400.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">첫 선형 연산</text><rect x="328" y="366" width="406" height="88" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="400.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">X × U₀ → H₀</text><rect x="740" y="366" width="406" height="88" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="400.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">X × U₁ → H₁</text><rect x="48" y="462" width="274" height="88" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="496.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">원소별 활성화</text><rect x="328" y="462" width="406" height="88" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="496.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">f(H₀)</text><rect x="740" y="462" width="406" height="88" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="496.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">f(H₁)</text><rect x="48" y="558" width="274" height="88" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="592.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">둘째 선형 연산</text><rect x="328" y="558" width="406" height="88" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="592.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">f(H₀) × V₀ → P₀</text><rect x="740" y="558" width="406" height="88" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="592.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">f(H₁) × V₁ → P₁</text><rect x="48" y="654" width="274" height="88" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="688.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">All-Reduce 후</text><rect x="328" y="654" width="406" height="88" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="688.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Y = P₀ + P₁</text><rect x="740" y="654" width="406" height="88" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="688.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Y = P₀ + P₁</text><text x="48" y="812.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">U는 출력 열, V는 그에 대응하는 입력 행으로 나눕니다.</text></svg>