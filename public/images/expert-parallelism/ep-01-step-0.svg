<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc"><title id="title">어텐션은 복제하고, Expert는 나누어 배치하기</title><desc id="desc">GPU0과 GPU1의 어텐션 및 Router 가중치는 복제한다. GPU0에는 E0/E1, GPU1에는 E2/E3를 둔다. 토큰은 Expert로 전달되고 결과는 출발 GPU의 원래 토큰으로 돌아가 다음 공통 연산에 사용된다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1570" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">어텐션은 복제하고, Expert는 나누어 배치하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">두 GPU가 서로 다른 시퀀스를 맡고, MoE 구간에서 토큰과 결과를 교환합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="205" width="480" height="1275" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="1275" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="289.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">입력 시퀀스 A</text><rect x="110.0" y="310" width="140" height="44" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="339.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A1</text><rect x="326.0" y="310" width="140" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="396" y="339.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><path d="M288,361 L288,393" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="78.0" y="401" width="420" height="101" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="435.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">어텐션 등 공통 부분 · DP</text><text x="288" y="469.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">같은 가중치의 복제본</text><path d="M288,509 L288,541" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="125.0" y="548" width="326" height="84" rx="10" fill="#edf7f5" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="582.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="288" y="616.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">자기 토큰의 Expert 선택</text><text x="912" y="289.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">입력 시퀀스 B</text><rect x="734.0" y="310" width="140" height="44" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="804" y="339.0" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">B1</text><rect x="950.0" y="310" width="140" height="44" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="339.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">B2</text><path d="M912,361 L912,393" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="702.0" y="401" width="420" height="101" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="435.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">어텐션 등 공통 부분 · DP</text><text x="912" y="469.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">같은 가중치의 복제본</text><path d="M912,509 L912,541" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="749.0" y="548" width="326" height="84" rx="10" fill="#edf7f5" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="582.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="912" y="616.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">자기 토큰의 Expert 선택</text><text x="600" y="670.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">선택한 Expert 쪽으로 토큰 전달</text><path d="M220,632 L220,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M356,632 L356,702 L804,702 L804,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M844,632 L844,747 L396,747 L396,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M980,632 L980,776 L864,776 L864,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><rect x="82" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="180" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E0</text><rect x="298" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="396" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E1</text><rect x="706" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="804" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E2</text><rect x="922" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="1020" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E3</text><text x="180" y="877.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">서로 다른 가중치</text><text x="396" y="877.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">서로 다른 가중치</text><text x="804" y="877.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">서로 다른 가중치</text><text x="1020" y="877.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">서로 다른 가중치</text><text x="600" y="841.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">EP</text><text x="600" y="879.0" fill="#526577" font-size="20" font-weight="400" text-anchor="middle">분할 보관</text><path d="M180,926 L180,1139" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M804,926 L804,1010 L356,1010 L356,1139" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M396,926 L396,1060 L844,1060 L844,1139" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M864,926 L864,1139" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="1106.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">출발 GPU로 결과 회수</text><rect x="78.0" y="1147" width="420" height="94" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="1181.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">원래 토큰별 결과</text><text x="288" y="1215.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">A1 · A2</text><path d="M288,1249 L288,1281" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="78.0" y="1289" width="420" height="110" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="1323.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">다음 공통 연산 · DP</text><text x="288" y="1357.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">자기 입력의 계산을 이어감</text><rect x="702.0" y="1147" width="420" height="94" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="1181.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">원래 토큰별 결과</text><text x="912" y="1215.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">B1 · B2</text><path d="M912,1249 L912,1281" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="702.0" y="1289" width="420" height="110" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="1323.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">다음 공통 연산 · DP</text><text x="912" y="1357.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">자기 입력의 계산을 이어감</text><text x="600" y="1444.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">GPU는 그대로 · 연산 부분에 따라 DP와 EP를 적용</text><text x="600" y="1527.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">예시: 공통 가중치와 Router는 복제 · Expert 가중치는 분할 · 순전파</text></svg>