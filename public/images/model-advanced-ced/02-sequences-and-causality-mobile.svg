<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1579" viewBox="0 0 360 1579" role="img" aria-labelledby="title desc"><title id="title">입력 전체를 읽는 ED와 과거부터 이어 가는 CED</title><desc id="desc">ED encoder의 3x3 격자는 모두 허용되고 decoder cross-attention의 2x3도 입력 전체를 읽는다. CED의 encoder 및 decoder 대 encoder 위치 격자는 4x4 하삼각이며 미래 위치를 차단한다.</desc><metadata>{&quot;id&quot;:&quot;ced-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;T5 masks, Figure 3–4&quot;,&quot;url&quot;:&quot;https://jmlr.org/papers/volume21/20-074/20-074.pdf&quot;},{&quot;label&quot;:&quot;CED §2.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHei