<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1174" viewBox="0 0 1200 1174" role="img" aria-labelledby="title desc"><title id="title">All-to-All: 목적지별로 조각 교환하기</title><desc id="desc">위 입력에서 GPU i의 네 조각은 i에서 GPU 0,1,2,3으로 향하는 조각이다. 아래 출력에서 GPU j는 GPU 0,1,2,3이 자신에게 보낸 조각을 출발 rank 순서로 갖는다. 조각 안의 두 숫자는 실제 데이터 값이 아닌 출발 GPU와 목적지 GPU를 표시한 표식이다. 색상은 원래 출발 GPU를 유지한다. 모든 GPU가 같은 전체 배열을 갖는 All-Gather와 달리 GPU마다 받는 조각이 다르다. 자기 자신을 목적지로 하는 조각도 결과에 포함된다.</desc><metadata>{&quot;id&quot;:&quot;combinations-04-all-to-all&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/>