<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">Assign Blocks to SMs and Use Their Resources</title><desc id="desc">Blocks E through H wait for SM assignment. Blocks A and B reside on SM 1, while C and D reside on SM 2. Per-thread register values and per-block shared memory are distinguished logically, with an L1 cache common to each SM. Registers are physical SM resources used for individual thread values. Shared memory illustrates work that uses it; it is not required for vector addition. The layout and block counts are examples. Actual residency depends on resource use and device limits.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1160" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Assign Blocks to SMs and Use Their Resources</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Distinguish unassigned work from work resident on an SM.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="214" width="1104" height="119" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="74" y="255" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Blocks awaiting SM assignment</text><rect x="491" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="562.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block E</text><rect x="650" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="721.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block F</text><rect x="809" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="880.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block G</text><rect x="968" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="1039.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block H</text><path d="M316,334 V427" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7" /><path d="M884,334 V427" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7" /><text x="600" y="390" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Assign when SM resources are available</text><rect x="48" y="441" width="536" height="515" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5" /><text x="72" y="486" fill="#2470BB" font-size="30" font-weight="700" text-anchor="start">SM 1</text><rect x="72" 