 fill="#526577" font-size="19" font-weight="400" text-anchor="middle">새로 받은 조각: A</text><rect x="120" y="1218" width="300" height="114" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="270" y="1250.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 3</text><text x="270" y="1288.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">B · C · D</text><text x="270" y="1318.0" fill="#526577" font-size="19" font-weight="400" text-anchor="middle">새로 받은 조각: B</text><text x="600" y="1268.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">받은 조각을 보관</text><text x="600" y="1297.4" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">다시 더하지 않음</text><path d="M600,1516 L600,1541" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="1587.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">3단계 · 전달한 뒤의 상태</text><path d="M758,1705 L899,1782" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="1739.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">C</text><path d="M899,1908 L758,1985" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="935" y="1965.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">D</text><path d="M442,1985 L301,1908" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="1965.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A</text><path d="M301,1782 L442,1705" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="265" y="1739.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">B</text><rect x="450" y="1619" width="300" height="114" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="1651.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">GPU 0</text>