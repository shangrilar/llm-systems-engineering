xt><text x="0" y="464" fill="#5C6C7C" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">KV FP8, RoPE BF16: 584 B · search key FP4: 68 B</text><text x="0" y="482" fill="#B55B22" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">+ separately: local KV (SWA, last 128 positions), about</text><text x="0" y="498.8" fill="#B55B22" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">3.2 MB</text><text x="0" y="534" fill="#182C40" font-size="14" font-weight="700" text-anchor="start" data-max-width="328">V4.1-Flash · 40 layers</text><rect x="0" y="544" width="59.6" height="14" rx="3" fill="#2470BB" fill-opacity="0.9"/><text x="0" y="572" fill="#182C40" font-size="13" font-weight="700" text-anchor="start" data-max-width="328">890 B · ≈1/4,418 of MHA</text><text x="0" y="590" fill="#5C6C7C" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">KV FP4: 288 B · search key FP4: 68 B</text><text x="0" y="608" fill="#B55B22" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">+ separately: local KV (SWA, last 128 positions), about</text><text x="0" y="624.8" fill="#B55B22" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">2.7 MB</text><text x="0" y="664" fill="#5C6C7C" font-size="11" font-weight="400" text-anchor="start" data-max-width="80">100 B</text><text x="62.8" y="664" fill="#5C6C7C" font-size="11" font-weight="400" text-anchor="middle" data-max-width="80">1 kB</text><text x="125.6" y="664" fill="#5C6C7C" font-size="11" font-weight="400" text-anchor="middle" data-max-width="80">10 kB</text><text x="188.4" y="664" fill="#5C6C7C" font-size="11" font-weight="400" text-anchor="middle" data-max-width="80">100 kB</text><text x="251.2" y="664" fill="#5C6C7C" font-size="11" font-weight="400" text-anchor="middle" data-max-width="80">1 MB</text><text x="314" y="664" fill="#5C6C7C" font-size="11" font-weight="400" text-anchor="end" data-max-width="80">10