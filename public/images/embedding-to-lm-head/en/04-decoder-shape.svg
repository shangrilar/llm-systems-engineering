<style>text{font-family:"Arial","Apple SD Gothic Neo","Noto Sans KR",sans-serif;} path,line{stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1200" height="800" fill="white" />
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Same dimensions, different vector values</text>
<text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Token count and model dimension stay the same; vector values change through the block.</text>
