<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1150" viewBox="0 0 360 1150" role="img" aria-labelledby="title desc"><title id="title">확률비로 학습에 반영할 비중을 조절한다</title><desc id="desc">생성 확률 q와 학습 측 비교 확률 p로 비율 p/q를 계산하고, TIS 상한을 적용한 고정 가중치를 토큰 정책 손실에 곱한 뒤 역전파한다. 비율3을 상한2로 제한하는 예.</desc><metadata>{&quot;id&quot;:&quot;9-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §3.4&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 3</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">확률비로 학습에 반영할</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">비중을 조절한다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">학습기에 도착한 생성 기록을 이용해,</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">토큰별 정책 손실의 기여를 보정합니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">보정 가중치 계산</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="8" y="80" width="504" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="24" y="111" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">생성 기록의 확률 q</text><text x="24" y="151" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">생성 시점의 값을 보존</text></g><g data-container="true"><rect x="8" y="212" width="504" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="24" y="243" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">학습 측 비교 확률 p</text><text x="24" y="283" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">어느 버전에서 평가했는지 확인</text></g><path d="M260 333 L260 375" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="8" y="390" width="504" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="24" y="421" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">확률비 p / q</text><text x="24" y="461" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">예: 0.60 / 0.20 = 3</text></g><path d="M260 510 L260 545" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="8" y="560" width="504" height="115" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="24" y="591" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">TIS · 큰 가중치를 제한</text><text x="24" y="631" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">상한 2의 예: 3 → 2</text></g></g><g transform="translate(16 677.2461538461539) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">정책 손실에 반영</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="8" y="80" width="504" height="135" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="24" y="111" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">토큰별 정책 손실</text><text x="24" y="151" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">현재 log p · 어드밴티지 등으로 계산</text></g><path d="M260 232 L260 273" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="8" y="290" width="504" height="140" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="24" y="321" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">보정 가중치 × 정책 손실</text><text x="24" y="361" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">보정 가중치는 고정해 사용</text></g><path d="M260 447 L260 490" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="8" y="507" width="504" height="168" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="24" y="538" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="472">역전파 → 모델 가중치 갱신</text><text x="24" y="578" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">확률을 직접 고치는 것이 아니라</text><text x="24" y="606" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="472">이번 학습의 기여를 조절</text></g></g></svg>