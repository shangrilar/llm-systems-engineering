<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1705" viewBox="0 0 360 1705" role="img" aria-labelledby="title desc"><title id="title">메모리가 부족할 때 프로그램 상태를 보고 쉬게 한다</title><desc id="desc">backend A의 Reasoning P와 Acting Q가 KV를 점유한다. Q를 Pause해 backend 연결을 해제하고 기록을 전역 대기열에 보존한다. 공간이 있는 A 또는 B에 Restore해 회수한 prefix KV를 재계산하고 후속 Reasoning을 실행한다.</desc><metadata>{&quot;id&quot;:&quot;12-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ThunderAgent §4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2602.13692v1#S4&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">메모리가 부족할 때 프로그램</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">상태를 보고 쉬게 한다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">ThunderAgent의 program-aware</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">scheduling을 단순화했습니다. 실행</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">단계·문맥 길이·현재 용량을 보고 Pause와</text><text x="16" y="205" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Restore를 결정합니다.</text><path d="M16,225 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 249) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">자원 회수와 프로그램 보존</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g transform="translate(0 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">① KV 압박</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="101" width="488" height="99" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="132" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Backend A</text><text x="32" y="172" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">KV 공간이 부족</text></g><g data-container="true"><rect x="16" y="226" width="488" height="110" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="257" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">P · Reasoning</text><text x="32" y="297" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">GPU 생성 진행</text></g><g data-container="true"><rect x="16" y="362" width="488" height="110" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="393" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Q · Acting</text><text x="32" y="433" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">도구 실행 중 · KV 보유</text></g><text x="16" y="524" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">현재 Reasoning을 보호하며 Pause 후보 판단</text></g><g transform="translate(0 776)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">② Pause</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="101" width="488" height="135" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="132" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Q · 전역 대기열</text><text x="32" y="172" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">프로그램 기록·도구 상태 추적 유지</text></g><path d="M260 247 L260 299" stroke="#657789" stroke-width="2" fill="none" stroke-dasharray="7 5"/><text x="260" y="320" fill="#B34242" font-size="30" font-weight="400" text-anchor="middle" data-max-width="50">×</text><g data-container="true"><rect x="16" y="346" width="488" height="125" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="377" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Backend A 연결 해제</text><text x="32" y="417" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">KV 회수 가능</text></g><text x="16" y="524" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">프로그램 보존 ≠ GPU KV 계속 점유</text></g><g transform="translate(0 1448)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">③ Restore</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="101" width="488" height="135" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="132" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Backend A 또는 B</text><text x="32" y="172" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">공간이 있는 곳에 재배치</text></g><path d="M260 242 L260 285" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="295" width="488" height="124" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="326" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">회수한 prefix KV 재계산</text><text x="32" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">유효한 문맥 상태 준비</text></g><path d="M260 425 L260 468" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="478" width="488" height="110" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="509" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Q · 후속 Reasoning</text><text x="32" y="549" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">도구 결과를 이어서 사용</text></g></g><text x="16" y="2134" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">유지: 대기 중 KV 점유 · 퇴거: 재개 시 재계산이</text><text x="16" y="2166.2" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">필요할 수 있음</text></g></svg>