<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">차원은 유지되고, 벡터 값은 달라집니다</title><desc id="desc">3개 토큰의 4차원 벡터가 하나의 내부 비공개 디코더 블록에 들어간다. 출력도 3행 4열이지만 모든 행의 숫자가 바뀐다. 행별로 별도 블록에 들어가는 그림이 아니며, 이 그림은 토큰별 독립 처리를 의미하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"Arial","Apple SD Gothic Neo","Noto Sans KR",sans-serif;} path,line{stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1200" height="800" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" >그림 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" >차원은 유지되고, 벡터 값은 달라집니다</text>
<text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" >토큰 수와 모델 차원은 유지되지만, 블록을 지나면서 각 토큰의 벡터 값이 바뀝니다.</text>
