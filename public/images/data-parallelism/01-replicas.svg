<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="854" viewBox="0 0 1200 854" role="img" aria-labelledby="title desc"><title id="title">DP: 같은 모델, 서로 다른 입력</title><desc id="desc">네 GPU가 모델 W 전체를 각각 보관하며 요청 A부터 D까지 따로 계산합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="854" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">DP: 같은 모델, 서로 다른 입력</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">고정 가중치의 일반적인 dense 모델 추론 예시입니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">같은 모델 W를 네 벌 보관</text><rect x="48" y="249" width="264" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="285.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">요청 A</text><text x="66" y="335.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M180,386 L180,427" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="439" width="264" height="178" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="475.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="525.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">전체 모델 W</text><text x="66" y="557.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">자기 요청 계산</text><path d="M180,630 L180,673" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="685" width="264" height="125" rx=