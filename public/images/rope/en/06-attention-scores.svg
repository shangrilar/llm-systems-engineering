l="#657789" font-size="27" font-weight="600" text-anchor="middle">Causal mask → Softmax → PV</text><text x="600" y="1256" fill="#657789" font-size="21" font-weight="400" text-anchor="middle">Use the new scores to determine weights on the Values</text><rect x="48" y="1330" width="1104" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1374" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Scores now reflect both the Q–K content and relative position.</text></g></g><path d="M48,1451 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1489" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Illustrative rates: 30° / 10° per position. Decimals are rounded to three places.</text></svg>