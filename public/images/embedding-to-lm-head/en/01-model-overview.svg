300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="885.0" y="401.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block 1</text><path d="M885,337 L885,350" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)" /><rect x="735" y="449" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="885.0" y="490.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block 2</text><path d="M885,429 L885,440" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)" /><text x="885" y="545" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">⋮</text><rect x="735" y="564" width="300" height="64" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="885.0" y="605.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Decoder block N</text><path d="M885,634 L885,641" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)" /><line x1="1080" y1="360" x2="1090" y2="360" stroke="#5C6C7C" stroke-width="2" /><line x1="1090" y1="360" x2="1090" y2="628" stroke="#5C6C7C" stroke-width="2" /><line x1="1080" y1="628" x2="1090" y2="628" stroke="#5C6C7C" stroke-width="2" /><text x="1112" y="504" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" transform="rotate(90 1112 504)">N blocks</text>
<line x1="48" y1="820" x2="1152" y2="820" stroke="#DCE4EC" stroke-width="2" />
<text x="48" y="861" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Simplified architecture. Details such as the final normalization are omitted.</text>
