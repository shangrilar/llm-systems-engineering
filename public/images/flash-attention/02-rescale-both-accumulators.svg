<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1770" viewBox="0 0 1200 1770" role="img" aria-labelledby="title desc"><title id="title">지수합과 가중합을 함께 갱신하기</title><desc id="desc">점수 묶음 1,2 다음 0,1 다음 3,2에 대응하는 Value를 연결한다. 최댓값이 유지되면 지수합과 가중합에 새 기여를 더한다. 최댓값이 2에서 3으로 증가하면 이전 지수합과 가중합 모두에 exp(-1)을 곱한 뒤 새 타일의 기여를 더한다. 최종 지수합 약2.056, 가중합 약0.959,3.153이며 출력은 약0.466,1.534다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1770" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">지수합과 가중합을 함께 갱신하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">최댓값이 커지면, 기존 지수합뿐 아니라 기존 Value 가중합도 같은 배율로 보정합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="1104" height="204" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="253" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">시작 · 첫 점수 묶음 [1, 2]와 대응하는 Value를 처리합니다.</text><text x="76" y="305" fill="#287D78" font-size="25" font-weight="600" text-anchor="start">V = [2, 0], [0, 2]</text><rect x="76.0" y="331" width="341.3333333333333" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="246.66666666666666" y="371.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">m = 2</text><rect x="425.3333333333333" y="331" width="341.3333333333333" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="596.0" y="371.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">ℓ ≈ 1.368</text><rect x="774.6666666666666" y="331" width="341.3333333333333" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="945.3333333333333" y="371.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">a ≈ [0.736, 2]</text><rect x="48" y="447" width="1104" height="444" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="494" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">① 최댓값 유지 · 보정 배율 1</text><text x="76" y="541" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">새 점수 [0, 1]    대응하는 V: [1, 1], [2, 0]</text><text x="76" y="586" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start">m: 2 → 2     보정 배율 α = exp(2 − 2) ≈ 1</text><text x="360" y="633" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">이전 누적값 × α</text><text x="770" y="633" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">새 타일의 기여</text><text x="100" y="688" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">지수합 ℓ</text><rect x="241" y="652" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="688.5" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">1.368</text><text x="568" y="691" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="652" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="688.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">0.503</text><text x="925" y="691" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">= 1.871</text><text x="100" y="769" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">가중합 a</text><rect x="241" y="733" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="769.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">[0.736, 2]</text><text x="568" y="772" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="733" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="769.5" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[0.871, 0.135]</text><text x="926" y="769" fill="#287D78" font-size="21" font-weight="600" text-anchor="start">벡터끼리 더함</text><text x="600" y="851" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">갱신 후: m = 2    ℓ ≈ 1.871    a ≈ [1.607, 2.135]</text><rect x="48" y="927" width="1104" height="444" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="974" fill="#7954A3" font-size="29" font-weight="700" text-anchor="start">② 최댓값 증가 · 두 누적값을 함께 보정</text><text x="76" y="1021" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">새 점수 [3, 2]    대응하는 V: [0, 2], [1, 1]</text><text x="76" y="1066" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start">m: 2 → 3     보정 배율 α = exp(2 − 3) ≈ 0.368</text><text x="360" y="1113" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">이전 누적값 × α</text><text x="770" y="1113" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">새 타일의 기여</text><text x="100" y="1168" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">지수합 ℓ</text><rect x="241" y="1132" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="1168.5" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">0.688</text><text x="568" y="1171" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="1132" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="1168.5" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">1.368</text><text x="925" y="1171" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">= 2.056</text><text x="100" y="1249" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">가중합 a</text><rect x="241" y="1213" width="295" height="57" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.5" y="1249.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">[0.591, 0.786]</text><text x="568" y="1252" fill="#5C6C7C" font-size="31" font-weight="400" text-anchor="middle">+</text><rect x="601" y="1213" width="295" height="57" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="748.5" y="1249.5" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[0.368, 2.368]</text><text x="926" y="1249" fill="#287D78" font-size="21" font-weight="600" text-anchor="start">벡터끼리 더함</text><text x="600" y="1331" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">갱신 후: m = 3    ℓ ≈ 2.056    a ≈ [0.959, 3.153]</text><rect x="48" y="1410" width="1104" height="210" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1458" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">같은 기준의 지수합과 가중합을 함께 유지합니다.</text><text x="600" y="1510" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">새 ℓ = 이전 ℓ × α + Σ exp(새 점수 − 새 m)</text><text x="600" y="1559" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">새 a = 이전 a × α + Σ exp(새 점수 − 새 m) × V</text><text x="600" y="1600" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">α = exp(이전 m − 새 m)</text><text x="600" y="1676" fill="#287D78" font-size="28" font-weight="700" text-anchor="middle">모든 묶음 처리 후: 출력 = a ÷ ℓ ≈ [0.466, 1.534]</text><text x="600" y="1725" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">a는 벡터 · 보정 배율은 a의 모든 원소에 동일하게 적용 · 표시 수치는 반올림</text></svg>