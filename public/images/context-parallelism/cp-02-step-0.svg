<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">토큰을 나눠도 어텐션의 연결은 끊을 수 없습니다 · 다른 GPU의 K·V가 필요한 이유</title><desc id="desc">GPU 1의 Q(t3)는 GPU 0에 있는 토큰 t0,t1의 K,V도 필요하다. 하삼각형 행렬에서 GPU 경계를 넘는 참조를 보여준다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#587084" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1050" fill="white"/><text x="40" y="48.0" font-size="30" fill="#183149" font-weight="700" text-anchor="start">토큰을 나눠도 어텐션의 연결은 끊을 수 없습니다</text><text x="40" y="87.0" font-size="21" fill="#587084" font-weight="400" text-anchor="start">인과적 어텐션 예시 · 행 = 질의 Q의 토큰 / 열 = 참조할 K의 토큰</text><path d="M40,112 H1160" stroke="#d8e2ea"/><rect x="48" y="147" width="528" height="252" rx="10" fill="white" stroke="#2470bb" stroke-width="1.5"/><text x="70" y="181.0" font-size="24" fill="#2470bb" font-weight="700" text-anchor="start">GPU 0</text><rect x="624" y="147" width="528" height="252" rx="10" fill="white" stroke="#b55b22" stroke-width="1.5"/><text x="646" y="181.0" font-size="24" fill="#b55b22" font-weight="700" text-anchor="start">GPU 1</text><text x="158.0" y="223.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">Q</text><rect x="122" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="158" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="122" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="158" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="112" y="263.2" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="112" y="299.2" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="322.0" y="223.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">K</text><rect x="286" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="322" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="286" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="322" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="486.0" y="223.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">V</text><rect x="450" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="486" y="238" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="450" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><rect x="486" y="274" width="36" height="36" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="312" y="365.0" font-size="22" fill="#2470bb" font-weight="700" text-anchor="middle">내 토큰에서 Q·K·V를 계산</text><text x="734.0" y="223.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">Q</text><rect x="698" y="238" width="36" height="36" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><rect x="734" y="238" width="36" height="36" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><rect x="698" y="274" width="36" height="36" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><rect x="734" y="274" width="36" height="36" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="688" y="263.2" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="688" y="299.2" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="898.0" y="223.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">K</text><rect x="862" y="238" width="36" hei