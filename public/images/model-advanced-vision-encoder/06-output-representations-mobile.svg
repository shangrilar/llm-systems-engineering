<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1490" viewBox="0 0 360 1490" role="img" aria-labelledby="title desc"><title id="title">이미지 하나의 요약과 패치별 표현은 쓰임이 다릅니다</title><desc id="desc">이미지 전체의 분류나 이미지–문장 비교에는 CLS 또는 pooling 등의 요약을 사용할 수 있습니다. VLM 연결에는 여러 공간 위치의 hidden state를 전달할 수 있습니다. 이미지 수준 loss도 인코더를 통해 패치 표현을 학습시키며 패치별 정답 라벨이 반드시 필요한 것은 아닙니다. 실제로 선택하는 출력 층과 요약 방식은 모델마다 다릅니다.</desc><metadata>{&quot;id&quot;:&quot;ma-21-06&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ViT&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2010.11929&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 6 · 시각 인코더</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">이미지 하나의 요약과 패치별</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">표현은 쓰임이 다릅니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">학습에 쓰는 요약 벡터와 VLM에 넘기는</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">벡터열을 구별</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 이미지 전체를 요약</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">시각 인코더의 표현</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">여러 패치 위치의 정보를 반영</text></g><path d="M135 240 L135 290" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M385 240 L385 290" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="300" width="230" height="170" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="331" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">CLS 출력 선택</text><text x="36" y="371" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">CLS는 입력부터</text><text x="36" y="399" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">패치와 함께 처리</text></g><g data-container="true"><rect x="270" y="300" width="230" height="170" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="286" y="331" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">패치 출력 pooling</text><text x="286" y="371" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">여러 패치 행을 집계</text></g><path d="M135 480 L215 525" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M385 480 L305 525" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="100" y="540" width="320" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="583" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">이미지 벡터 하나</text><path d="M260 620 L260 660" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="670" width="480" height="155" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="701" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">분류 / 이미지–문장 비교</text><text x="36" y="741" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">이미지 수준 정답으로 loss 계산</text></g></g><g transform="translate(16 847.5538461538462) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 공간별 표현을 전달</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">시각 인코더의 표현</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">여러 패치 위치의 정보를 반영</text></g><path d="M260 240 L260 290" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="260" y="335" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="400">Z [4, dᵥ]</text><rect x="60" y="375" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="408" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_A  ·  dᵥ</text><rect x="60" y="440" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="473" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_B  ·  dᵥ</text><rect x="60" y="505" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="538" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_C  ·  dᵥ</text><rect x="60" y="570" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="603" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_D  ·  dᵥ</text><path d="M260 650 L260 700" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="715" width="480" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="746" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">언어 모델 연결: 다음 편</text><text x="36" y="786" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">벡터 수 축소 → projector → 입력열</text></g></g></svg>