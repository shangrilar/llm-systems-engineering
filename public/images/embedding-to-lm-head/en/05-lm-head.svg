<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc" lang="en">
<title id="title">From vectors to vocabulary scores</title><desc id="desc">The LM Head maps token representations of shape T by d to vocabulary scores of shape T by V. The displayed output columns correspond to token IDs 0, 1, an ellipsis, and V minus 1. Values are illustrative logits, not probabilities. The last position's scores are used to select the next token. Input vectors continue the previous illustration; the final normalization calculation is omitted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker></defs>
<style>text{font-family:"Arial","Apple SD Gothic Neo","Noto Sans KR",sans-serif;} path,line{stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1200" height="880" fill="white" />
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 5</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">From vectors to vocabulary scores</text>
<text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">At each position, map a d-dimensional vector to V scores, one per vocabulary token.</text>
<line x1="48" y1="169" x2="1152" y2="169" stroke="#DCE4EC" stroke-width="2" />
