<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1744" viewBox="0 0 1200 1744" role="img" aria-labelledby="title desc"><title id="title">같은 GPU를 분할과 복제에 다르게 배분하기</title><desc id="desc">같은네GPU를 TP2×DP2의 두모델그룹 또는 TP4×DP1의 한모델그룹으로 구성한다. 첫배치는 A/B와C/D를 별도그룹에, 두번째는 A/B/C/D를 한그룹에 보낸다. 그룹하나도 여러요청을 배칭할수있으며 메모리여유,응답시간,처리량,내부통신을 비교한다.</desc><metadata>{&quot;id&quot;:&quot;03-balance-shards-and-replicas&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><marker id="ported-arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#5C6C7C" stroke-width="1.5" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">같은 GPU를 분할과 복제에 다르게 배분하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">두 배치 모두 GPU 4개와 동일한 요청을 사용합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -117)"><text x="48" y="145" font-size="20" fill="#5C6C7C" font-weight="400" text-anchor="start">↔ : 그룹 내부 통신 관계</text><rect x="48" y="204" width="1104" height="504" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="76" y="248" font-size="29" fill="#182C40" font-weight="700" text-anchor="start">TP 2 × DP 2</text><text x="1124" y="248" font-size="25" fill="#2470BB" font-weight="700" text-anchor="end">모델 복제본 2개</text><text x="600" y="300" font-size="23" fill="#5C6C7C" font-weight="400" text-anchor="middle">동일한 요청 A · B · C · D</text><rect x="76" y="330" width="498" height="278" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2"/><rect x="259" y="344" width="132" height="44" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="2"/><text x="325" y="373" font-size="23" fill="#287D78" font-weight="700" text-anchor="middle">A · B</text><rect x="111" y="456" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="201" y="496" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="127" y="523" width="74" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="164" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="201" y="523" width="74" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="238" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="359" y="456" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="449" y="496" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="375" y="523" width="74" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="412" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="449" y="523" width="74" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="486" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><path d="M325,394 L325,416 L201,416 L201,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M325,416 L449,416 L449,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M298,554 L352,554" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><rect x="626" y="330" width="498" height="278" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2"/><rect x="809" y="344" width="132" height="44" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="2"/><text x="875" y="373" font-size="23" fill="#287D78" font-weight="700" text-anchor="middle">C · D</text><rect x="661" y="456" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="751" y="496" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="677" y="523" width="74" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="714" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="751" y="523" width="74" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="788" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="909" y="456" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="999" y="496" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="925" y="523" width="74" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="962" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="999" y="523" width="74" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="1036" y="560" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><path d="M875,394 L875,416 L751,416 L751,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M875,416 L999,416 L999,450" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M848,554 L902,554" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><text x="600" y="651" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">두 그룹이 서로 다른 요청을 처리</text><text x="600" y="689" font-size="22" fill="#5C6C7C" font-weight="400" text-anchor="middle">그룹별로 입력을 배분하고 독립적으로 실행</text><rect x="48" y="740" width="1104" height="504" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="76" y="784" font-size="29" fill="#182C40" font-weight="700" text-anchor="start">TP 4 × DP 1</text><text x="1124" y="784" font-size="25" fill="#2470BB" font-weight="700" text-anchor="end">모델 복제본 1개</text><text x="600" y="836" font-size="23" fill="#5C6C7C" font-weight="400" text-anchor="middle">동일한 요청 A · B · C · D</text><rect x="76" y="866" width="1048" height="278" rx="12" fill="#F8FAFC" stroke="#2470BB" stroke-width="2"/><rect x="471" y="880" width="258" height="44" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="2"/><text x="600" y="909" font-size="23" fill="#287D78" font-weight="700" text-anchor="middle">A · B · C · D</text><path d="M600,930 L600,952 L210,952 L210,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M600,952 L470,952 L470,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M600,952 L730,952 L730,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M600,952 L990,952 L990,986" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="120" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="210" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="173" y="1059" width="74" height="58" rx="0" fill="#DCE4EC" stroke="#2470BB" stroke-width="2"/><text x="210" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W1</text><rect x="380" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="470" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="433" y="1059" width="74" height="58" rx="0" fill="#bbdaf7" stroke="#2470BB" stroke-width="2"/><text x="470" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W2</text><rect x="640" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="730" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="693" y="1059" width="74" height="58" rx="0" fill="#9bc9f1" stroke="#2470BB" stroke-width="2"/><text x="730" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W3</text><rect x="900" y="992" width="180" height="136" rx="12" fill="white" stroke="#DCE4EC" stroke-width="2"/><text x="990" y="1032" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="953" y="1059" width="74" height="58" rx="0" fill="#79b4e5" stroke="#2470BB" stroke-width="2"/><text x="990" y="1096" font-size="23" fill="#2470BB" font-weight="700" text-anchor="middle">W4</text><path d="M307,1090 L373,1090" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><path d="M567,1090 L633,1090" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><path d="M827,1090 L893,1090" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow-muted)" marker-start="url(#ported-arrow-start)"/><text x="600" y="1187" font-size="25" fill="#182C40" font-weight="700" text-anchor="middle">한 그룹의 네 GPU가 요청들의 계산에 함께 참여</text><text x="600" y="1225" font-size="22" fill="#5C6C7C" font-weight="400" text-anchor="middle">한 그룹도 여러 요청을 배치로 처리할 수 있음</text><text x="600" y="1317" font-size="27" fill="#182C40" font-weight="700" text-anchor="middle">실행 가능한 두 후보에서 함께 비교할 것</text><rect x="48" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="180" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">GPU당 메모리 여유</text><rect x="328" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="460" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">요청의 응답 시간</text><rect x="608" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="740" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">전체 처리량</text><rect x="888" y="1347" width="264" height="100" rx="12" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="2"/><text x="1020" y="1403" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">그룹 내부 통신</text><text x="600" y="1496" font-size="23" fill="#5C6C7C" font-weight="400" text-anchor="middle">한 모델에 쓸 GPU 수와 독립 복제본 수를 함께 조정합니다.</text></g></g><path d="M48,1636 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1674" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">그룹 하나도 여러 요청을 배치로 함께 처리할 수 있으므로, 복제본이 하나라고 요청을 하나씩만 처리하는 것은</text><text x="48" y="1703.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">아닙니다.</text></svg>