<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1852" viewBox="0 0 1200 1852" role="img" aria-labelledby="title desc"><title id="title">Distant information can travel through intermediate positions</title><desc id="desc">Horizontal axis is position 0–7; depth increases upward from L0 to L3. Only ancestors of L3,p7 are highlighted. One orange path connects L0,p1, L1,p3, L2,p5, and L3,p7; mobile unfolds this path vertically. The table shows possible L0 input influence on p7: positions 5–7 after one layer, 3–7 after two, and 1–7 after three.</desc><metadata>{&quot;id&quot;:&quot;ma-04-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mistral 7B §2, stacked sliding-window attention&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2310.06825v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stro