<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1230" viewBox="0 0 1200 1230" role="img" aria-labelledby="title desc"><title id="title">이번 계산과 누적 KV를 따로 셉니다</title><desc id="desc">B는 KV 6개를 보유하고 새 입력 1개를 처리해 7개로 늘립니다. C는 입력 6개를 처리해 KV 6개를 만듭니다. 이번 계산 7토큰은 예산 8개 이내이고, 실행 뒤 실제 KV 13개는 저장 용량 24개 이내입니다. 실선은 기존 KV, 점선은 이번 실행에서 추가할 KV입니다.</desc><metadata>{&quot;id&quot;:&quot;03-work-and-state&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">이번 계산과 누적 KV를 따로 셉니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">새 토큰 계산은 기존 KV를 없애지 않습니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="219" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">다음 실행의 후보</text><rect x="48" y="246" width="520" height="160" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="600" y="246" width="552" height="160" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="72" y="283" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">B · Decode</text><text x="72" y="326" fill="#287D78" font-size="24" font-weight="400" text-anchor="start">기존 KV 6개</text><text x="72" y="373" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">새 입력 1개 → KV 7개</text><text x="624" y="283" fill="#7954A3" font-size="28" font-weight="700" text-anchor="start">C · Prefill</text><text x="624" y="326" fill="#7954A3" font-size="24" font-weight="400" text-anchor="start">아직 KV 없음</text><text x="624" y="373" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">입력 6개 → KV 6개</text><text x="48" y="471" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">이번에 계산할 토큰</text><text x="115" y="510" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">B</text><text x="262" y="510" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">C</text><rect x="96" y="529" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="180" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="222" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="264" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="306" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="348" y="529" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="390" y="529" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,590 v9 h332 v-9" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="262" y="632" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">실행 토큰 예산 8개</text><text x="650" y="564" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">1 + 6 = 7</text><text x="650" y="609" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">예산 8개 안에 들어갑니다</text><path d="M48,679 H1152" stroke="#DCE4EC"/><text x="48" y="731" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">이 실행 뒤 보관할 실제 KV</text><text x="241" y="776" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">B · 7</text><text x="514" y="776" fill="#7954A3" font-size="23" font-weight="700" text-anchor="middle">C · 6</text><rect x="96" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="180" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="222" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="264" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="306" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="348" y="798" width="38" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="390" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="432" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="474" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="516" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="558" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="600" y="798" width="38" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6" stroke-dasharray="5 4"/><rect x="642" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="684" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="726" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="768" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="810" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="852" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="894" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="936" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="978" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1020" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1062" y="798" width="38" height="48" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,858 v9 h1004 v-9" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="598" y="900" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">KV 저장 용량: 24개 위치 분량</text><text x="48" y="951" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">7 + 6 = 13</text><text x="364" y="951" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">용량 24개 안에 들어갑니다</text><rect x="48" y="987" width="26" height="28" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><text x="89" y="1010" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">기존 KV</text><rect x="319" y="987" width="26" height="28" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6" stroke-dasharray="5 4"/><text x="360" y="1010" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">이번 실행에서 추가할 KV</text><text x="48" y="1090" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">이 공간을 실제로 배정할 수 있는지도 확인해야 합니다.</text></g></g><path d="M48,1152 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1190" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">이번 계산 7토큰은 예산 8개 이내이고, 실행 뒤 실제 KV 13개는 용량 24개 이내입니다.</text></svg>