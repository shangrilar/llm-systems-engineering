<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1263" viewBox="0 0 360 1263" role="img" aria-labelledby="title desc"><title id="title">Query는 현재 층에서, KV는 앞부분에서 만듭니다</title><desc id="desc">h3에서 WQ로 q를 만들고 M의 네 행에서 WK와 WV로 K와 V를 만든다. q의 네 점수를 softmax로 바꾸어 V 네 행을 섞는다.</desc><metadata>{&quot;id&quot;:&quot;yoco-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;YOCO §2.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.05254v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2 · Cross-attention의 두 출처</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Query는 현재 층에서, KV는</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">앞부분에서 만듭니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">같은 생성열 · 현재 p3 · 행벡터 표기 · d =</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">4, d_head = 2</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Q와 K/V를 만들기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="10" y="110" width="225" height="150" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">뒤층 h(p3) [1×4]</text><text x="26" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">현재 위치 하나</text></g><g data-container="true"><rect x="285" y="110" width="225" height="150" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">M [4×4]</text><text x="301" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">앞부분의 p0…p3</text></g><path d="M122 270 L122 320" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M397 270 L397 320" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="10" y="330" width="225" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="361" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">W_Q [4×2]</text><text x="26" y="401" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">층마다 다름</text></g><g data-container="true"><rect x="285" y="330" width="225" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="361" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">W_K, W_V</text><text x="301" y="401" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">각각 [4×2]</text></g><path d="M122 465 L122 515" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M397 465 L397 515" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="10" y="525" width="225" height="120" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="556" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">q [1×2]</text></g><g data-container="true"><rect x="285" y="525" width="225" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="556" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">K, V [4×2]</text><text x="301" y="596" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">뒤층들이 공유</text></g><g data-container="true"><rect x="10" y="695" width="500" height="90" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="26" y="726" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="468">출처가 다름 = Cross-attention</text></g></g><g transform="translate(16 734.0153846153846) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 익숙한 Attention 계산</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="30" y="110" width="460" height="115" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">q Kᵀ / √2</text><text x="46" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">[1×2] × [2×4] → [1×4]</text></g><path d="M260 235 L260 275" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="135" y="285" width="250" height="60" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="260" y="323" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="238">softmax</text><path d="M260 355 L260 400" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="80" y="438" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="100">p0</text><rect x="30" y="460" width="100" height="60" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="80" y="498" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">α0</text><text x="200" y="438" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="100">p1</text><rect x="150" y="460" width="100" height="60" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="200" y="498" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">α1</text><text x="320" y="438" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="100">p2</text><rect x="270" y="460" width="100" height="60" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="320" y="498" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">α2</text><text x="440" y="438" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="100">p3</text><rect x="390" y="460" width="100" height="60" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="440" y="498" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">α3</text><path d="M260 530 L260 565" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="30" y="575" width="460" height="100" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="46" y="606" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">α V → o [1×2]</text><text x="46" y="646" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">같은 위치의 V를 가중합</text></g><path d="M260 685 L260 715" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="90" y="725" width="340" height="55" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="760.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="328">o W_O → [1×4]</text></g></svg>