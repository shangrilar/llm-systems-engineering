<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1860" viewBox="0 0 1200 1860" role="img" aria-labelledby="title desc">
<title id="title">Connecting the computations inside Attention</title><desc id="desc">Projected Q K V are separated into two heads. RoPE rotates Q and K only. Each head computes Q K scores, scaling, masking, Softmax and PV. Its 3 by 4 output is concatenated with the other head at the same token positions, then output projection produces 3 by 8.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1860" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Connecting the computations inside Attention</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">MHA · T = 3 · d = 8 · h = 2 · dₕ = 4</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
