<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">같은 모델, 다른 실행 흐름</title><desc id="desc">생성은 고정된 가중치로 forward와 토큰 선택을 반복하고, 학습은 알려진 여러 위치의 예측과 손실, 역전파, 가중치 갱신을 수행합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1210" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">같은 모델, 다른 실행 흐름</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">생성은 다음 입력을 선택하고, 학습은 알려진 정답으로 가중치를 갱신합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="219.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">자기회귀 생성</text><text x="642" y="219.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">Next-token 학습</text><g data-box="48,249,510,130"><rect x="48" y="249" width="510" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="284.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">알고 있는 입력</text><text x="68" y="327.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2</text><text x="68" y="357.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">다음 토큰은 아직 모름</text></g><g data-box="642,249,510,130"><rect x="642" y="249" width="510" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="284.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">알고 있는 학습 토큰열</text><text x="662" y="327.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">p0 p1 p2 p3</text><text x="662" y="357.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">다음 위치의 정답도 데이터에 있음</text></g><path d="M303,393 L303,418" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,393 L897,418" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,435,510,125"><rect x="48" y="435" width="510" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="470.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Forward: 예측 계산</text><text x="68" y="513.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">가중치 W 유지</text><text x="68" y="543.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">현재 입력과 앞선 문맥 사용</text></g><g data-box="642,435,510,125"><rect x="642" y="435" width="510" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="470.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Forward: 여러 위치를 함께</text><text x="662" y="513.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">입력 p0 p1 p2의 예측 계산</text><text x="662" y="543.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">각 위치는 미래를 보지 못함</text></g><path d="M303,574 L303,599" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,574 L897,599" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,616,510,140"><rect x="48" y="616" width="510" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="651.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Logits → 다음 토큰 선택</text><text x="68" y="694.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">마지막 입력 위치의 logits → x0</text><text x="68" y="724.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Greedy 또는 sampling</text></g><g data-box="642,616,510,140"><rect x="642" y="616" width="510" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="651.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Loss → backward</text><text x="662" y="694.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">정답 p1 p2 p3와 비교</text><text x="662" y="724.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">손실에서 가중치 기울기 계산</text></g><path d="M303,770 L303,795" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,770 L897,795" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-box="48,812,510,138"><rect x="48" y="812" width="510" height="138" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="847.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">선택한 토큰으로 생성 계속</text><text x="68" y="890.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">종료하지 않으면 x0가 다음 입력</text><text x="68" y="920.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">한 요청 안에서는 순차적으로 반복</text></g><g data-box="642,812,510,138"><rect x="642" y="812" width="510" height="138" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="847.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Optimizer → 가중치 갱신</text><text x="662" y="890.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">기울기로 W 갱신</text><text x="662" y="920.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">다음 학습 배치에서 반복</text></g><g data-box="48,996,510,130"><rect x="48" y="996" width="510" height="130" rx="10" fill="#F5F7FA" stroke="#526577" stroke-width="1.5"/><text x="68" y="1031.0" fill="#526577" font-size="25" font-weight="700" text-anchor="start">유지할 상태</text><text x="68" y="1074.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">토큰 이력 · KV 캐시 · 종료 조건</text></g><g data-box="642,996,510,130"><rect x="642" y="996" width="510" height="130" rx="10" fill="#F5F7FA" stroke="#526577" stroke-width="1.5"/><text x="662" y="1031.0" fill="#526577" font-size="25" font-weight="700" text-anchor="start">유지할 상태</text><text x="662" y="1074.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">활성값 · 기울기 · 옵티마이저 상태</text></g><text x="48" y="1160.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">표준적인 지도 학습과 생성의 비교입니다. 화살표는 실행 순서이며 시간 비율이 아닙니다.</text></svg>