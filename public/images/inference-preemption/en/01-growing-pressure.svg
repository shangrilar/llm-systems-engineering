<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1154" viewBox="0 0 1200 1154" role="img" aria-labelledby="title desc"><title id="title">Running out of KV space during generation</title><desc id="desc">A and B each hold seven KV positions in a four-block pool. Each fills its final empty slot, reaching eight positions. Processing position eight then requires a new block, but none is free.</desc><metadata>{&quot;id&quot;:&quot;01-growing-pressure&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Running out of KV space during generation</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Once the remaining positions fill, the next input requires another block.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="205" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">KV pool: 4 blocks · 4 positions per block · No sharing</text><text x="48" y="265" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. One position remains in each tail block</text><rect x="48" y="294" width="260" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="60" y="324" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">P0 · A</text><rect x="60" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88" y="371" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="120" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="148" y="371" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="180" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="208" y="371" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="240" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="268" y="371" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">3</text><rect x="328" y="294" width="260" height="112" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="340" y="324" fill="#2470BB" font-size="22" font-weight="700" text-anchor="start">P1 · A</text><rect x="340" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="368" y="371" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="400" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="428" y="371" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="460" y="340" width="56" height="48" rx="5" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><