<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">Compute attention over scattered KV</title><desc id="desc">B maps L0 to P3, L1 to P0 and L2 to P5. Q at input position 8 uses 4 KV positions in P3, 4 in P0 and 1 in P5 to compute one attention result. C’s KV, free P2 and unused P5 slots are excluded.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Compute attention over scattered KV</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">The block table locates storage; the current Q uses the KV of its own request.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="203" width="1104" height="116" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="72" y="242.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">B’s block table</text><text x="72" y="286.0" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">L0 → P3  ·  L1 → P0  ·  L2 → P5</text><text x="48" y="368.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Read B’s 9 valid KV positions in the physical pool</text><text x="48" y="409.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Colored cells = KV being read · gray = not read</text><text x="48" y="465.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">P0 · B</text><rect x="48" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="65.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">4</text><rect x="86" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="103.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">5</text><rect x="124" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="141.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">6</text><rect x="162" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="179.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">7</text><text x="232" y="465.0" fill="#8B969F" font-size="24" font-weight="700" text-anchor="start">P1 · C</text><rect x="232" y="489" width="34" height="52" rx="5" fill="#F0F2F4" stroke="#B7C0C8" stroke-width="1.5"/><text x="249.0" y="522.0" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">0</text><path d="M237,536 L261,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="270" y="489" width="34" height="52" rx="5" fill="#F0F2F4" stroke="#B7C0C8" stroke-width="1.5"/><text x="287.0" y="522.0" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">1</text><path d="M275,536 L299,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="308" y="489" width="34" height="52" rx="5" fill="#F0F2F4" stroke="#B7C0C8" stroke-width="1.5"/><text x="325.0" y="522.0" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">2</text><path d="M313,536 L337,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="346" y="489" width="34" height="52" rx="5" fill="#F0F2F4" stroke="#B7C0C8" stroke-width="1.5"/><text x="363.0" y="522.0" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">3</text><path d="M351,536 L375,494" stroke="#A9B3BC" stroke-width="1.4"/><text x="416" y="465.0" fill="#8B969F" font-size="24" font-weight="700" text-anchor="start">P2</text><rect x="416" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M421,536 L445,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="454" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M459,536 L483,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="492" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M497,536 L521,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="530" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M535,536 L559,494" stroke="#A9B3BC" stroke-width="1.4"/><text x="600" y="465.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">P3 · B</text><rect x="600" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="617.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">0</text><rect x="638" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="655.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">1</text><rect x="676" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="693.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">2</text><rect x="714" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="731.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">3</text><text x="784" y="465.0" fill="#8B969F" font-size="24" font-weight="700" text-anchor="start">P4 · C</text><rect x="784" y="489" width="34" height="52" rx="5" fill="#F0F2F4" stroke="#B7C0C8" stroke-width="1.5"/><text x="801.0" y="522.0" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">4</text><path d="M789,536 L813,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="822" y="489" width="34" height="52" rx="5" fill="#F0F2F4" stroke="#B7C0C8" stroke-width="1.5"/><text x="839.0" y="522.0" fill="#B7C0C8" font-size="22" font-weight="700" text-anchor="middle">5</text><path d="M827,536 L851,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="860" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M865,536 L889,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="898" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M903,536 L927,494" stroke="#A9B3BC" stroke-width="1.4"/><text x="968" y="465.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">P5 · B</text><rect x="968" y="489" width="34" height="52" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="985.0" y="522.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">8</text><rect x="1006" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M1011,536 L1035,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="1044" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M1049,536 L1073,494" stroke="#A9B3BC" stroke-width="1.4"/><rect x="1082" y="489" width="34" height="52" rx="5" fill="white" stroke="#B7C0C8" stroke-width="1.5"/><path d="M1087,536 L1111,494" stroke="#A9B3BC" stroke-width="1.4"/><path d="M48,552 V566 H196 V552 M122.0,566 V650" fill="none" stroke="#287D78" stroke-width="2.5"/><path d="M600,552 V566 H748 V552 M674.0,566 V650" fill="none" stroke="#287D78" stroke-width="2.5"/><path d="M968,552 V566 H1002 V552 M985.0,566 V650" fill="none" stroke="#287D78" stroke-width="2.5"/><path d="M122,650 H985" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M590,650 L590.0,727.0" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M590,737 L585.5,727.0 L594.5,727.0 Z" fill="#287D78"/><text x="625" y="704.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">9 KV positions</text><rect x="48" y="753" width="248" height="124" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="172" y="801.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">Current Q</text><text x="172" y="846.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Input position 8</text><path d="M306,815 L397.0,815.0" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M407,815 L397.0,819.5 L397.0,810.5 Z" fill="#2470BB"/><g data-panel="true"><rect x="420" y="753" width="340" height="124" rx="10" fill="#F4F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="590" y="805.0" fill="#182C40" font-size="30" font-weight="700" text-anchor="middle">Attention</text><text x="590" y="848.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Over all valid KV</text></g><path d="M773,815 L895.0,815.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M905,815 L895.0,819.5 L895.0,810.5 Z" fill="#526577"/><rect x="918" y="753" width="234" height="124" rx="10" fill="#F4F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="1035" y="821.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">One result</text><text x="48" y="949.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">KV stays in its own physical blocks while being read.</text><text x="48" y="994.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">C’s KV and the 3 unused slots in P5 are excluded.</text></svg>