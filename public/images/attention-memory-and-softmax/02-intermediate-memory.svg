<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc"><title id="title">중간 행렬의 저장과 데이터 이동</title><desc id="desc">중간 S와 P를 전역 메모리에 저장하는 기본 구현의 경로를 나타낸다. QK 전치 계산이 S를 저장하고 다음 계산이 다시 읽어 스케일링과 마스크 및 Softmax를 수행한다. 이 계산은 P를 저장하고 PV가 P를 다시 읽는다. 스케일링과 마스크마다 별도 중간 행렬을 그리지 않는다. Q K V의 입력과 O 출력의 이동은 중간 행렬에 집중하기 위해 생략했다. 전역 메모리는 논리적 메모리 공간이며 캐시가 관여하므로 모든 접근이 HBM의 물리적 전송과 일대일 대응하지 않는다. 긴 시퀀스의 큰 중간 행렬은 HBM 저장 및 이동 부담을 만든다. 토큰 수가 두 배가 되면 점수와 확률 행렬 각각의 요소 수가 네 배가 된다. 도형은 4×4와 8×8 크기 비교이며 처리 시간을 나타내지 않는다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1350" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">중간 행렬의 저장과 데이터 이동</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">점수와 확률을 전역 메모리에 저장하는 구현에서 생기는 이동을 봅니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="76" y="223" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">GPU 내부의 계산</text><rect x="76" y="255" width="260" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="206" y="298" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">점수 계산</text><text x="206" y="340" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">QKᵀ</text><rect x="470" y="255" width="260" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="298" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">확률 계산</text><text x="600" y="340" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">스케일링·마스크</text><text x="600" y="372" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Softmax</text><rect x="864" y="255" width="260" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="994" y="298" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">출력 계산</text><text x="994" y="340" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">PV</text><rect x="48" y="543" width="1104" height="300" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="76" y="585" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">전역 메모리</text><text x="76" y="620" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">중간 행렬</text><rect x="235" y="630" width="280" height="102" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="375.0" y="689.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">점수 S · T × T</text><rect x="686" y="630" width="280" height="102" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="826.0" y="689.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">확률 P · T × T</text><path d="M210,404 L310,616" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="159" y="480" fill="#B55B22" font-size="24" font-weight="700" text-anchor="start">저장</text><path d="M447,616 L548,404" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="535" y="499" fill="#B55B22" font-size="22" font-weight="700" text-anchor="start">다시 읽기</text><path d="M654,404 L755,616" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="720" y="480" fill="#B55B22" font-size="24" font-weight="700" text-anchor="start">저장</text><path d="M900,616 L1001,404" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="990" y="499" fill="#B55B22" font-size="22" font-weight="700" text-anchor="start">다시 읽기</text><text x="600" y="799" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">중간 결과를 크게 저장할수록, 다음 계산에 전달할 데이터도 많아집니다.</text><rect x="48" y="891" width="1104" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="938" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">토큰 수가 늘면 중간 행렬은 더 빠르게 커집니다.</text><rect x="202" y="1025" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="227" y="1025" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="252" y="1025" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="277" y="1025" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="202" y="1050" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="227" y="1050" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="252" y="1050" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="277" y="1050" width="22" height="22" rx="3" fill="#FFF2E6" s