<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">처리 토큰 수가 선형 연산의 병목을 바꿉니다</title><desc id="desc">Roofline의 기울어진 대역폭 상한 아래는 memory-bound, 수평 연산 성능 상한 아래는 compute-bound 영역입니다. 작은 배치 Decode의 적은 새 토큰과 충분한 입력 Prefill의 많은 토큰을 각각 낮은 산술 강도와 높은 산술 강도의 예로 표시합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1100" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">처리 토큰 수가 선형 연산의 병목을 바꿉니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">가중치를 사용하는 선형 연산에 Roofline을 적용합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">연산 처리량</text><path d="M145,765 L145,265" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M145,765 L1145,765" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M145,765 L705,355" fill="none" stroke="#2470BB" stroke-width="6"/><path d="M705,355 H1110" fill="none" stroke="#B55B22" stroke-width="6"/><path d="M145,355 H705 V765" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="460" y="306.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">대역폭 × 산술 강도</text><text x="920" y="306.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU 연산 성능 상한</text><circle cx="330" cy="629.5535714285714" r="10" fill="white" stroke="#182C40" stroke-width="3"/><circle cx="955" cy="355" r="10" fill="white" stroke="#182C40" stroke-width="3"/><text x="190" y="466.0" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">작은 배치의 Decode</text><text x="190" y="505.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">적은 새 입력 토큰</text><path d="M330,526 L330,589" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="810" y="448.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">충분한 입력의 Prefill</text><text x="810" y="488.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">많은 입력 토큰</text><path d="M955,418 L955,374" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="330" y="817.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">낮음</text><text x="955" y="817.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">높음</text><text x="665" y="867.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">산술 강도 · FLOP/byte</text><text x="350" y="708.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Memory-bound</text><text x="917" y="708.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">Compute-bound</text><path d="M226,929 L1080,929" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="654" y="975.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">처리 토큰 수 ↑ → 가중치 재사용 ↑ → 산술 강도 ↑</text><text x="48" y="1044.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">선은 처리량의 상한 · 위치는 실행 조건의 예시이며 실측값이 아닙니다.</text></svg>