<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1420" viewBox="0 0 1200 1420" role="img" aria-labelledby="title desc">
<title id="title">Softmax: 점수를 가중치로 바꾸기</title><desc id="desc">마스크 적용 점수 각 행에 Softmax를 적용한다. P의 행은 [1,0,0], [0.818,0.182,0], [0.114,0.042,0.844]다. 토큰 3 행에서 점수 1,0,3를 지수화하고 합으로 나누는 과정과 가중치 막대를 보여준다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1420" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Softmax: 점수를 가중치로 바꾸기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">P = softmax(S / √dh + M) · 각 행에 적용</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="197" width="1104" height="62" rx="14" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1.5"/><text x="80" y="237" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">Head 1 확대 · Head 2도 같은 순서로 독립적으로 계산합니다.</text><text x="600" y="315" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">Query 토큰 하나마다, 한 행 안에서 가중치를 계산합니다.</text><text x="285" y="383" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">마스크 적용 점수</text><rect x="150.0" y="440" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="195.0" y="483.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="240.0" y="440" width="90.0" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="285.0" y="483.0" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="330.0" y="440" width="90.0" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="375.0" y="483.0" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="150.0" y="508" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="195.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="240.0" y="508" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="285.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="330.0" y="508" width="90.0" height="68" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="375.0" y="551.0" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle">−∞</text><rect x="150.0" y="576" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="195.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="240.0" y="576" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="285.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="330.0" y="576" width="90.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="375.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">3</text><text x="132" y="482.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="132" y="550.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="132" y="618.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="195.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="285.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="375.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><path d="M473,540 L682,540" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="578" y="497" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Softmax</text><text x="885" y="383" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Attention 가중치 P</text><rect x="750.0" y="440" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="483.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="850.0" y="440" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900.0" y="483.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="950.0" y="440" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000.0" y="483.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="750.0" y="508" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.818</text><rect x="850.0" y="508" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.182</text><rect x="950.0" y="508" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000.0" y="551.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0</text><rect x="750.0" y="576" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="800.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.114</text><rect x="850.0" y="576" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="900.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.042</text><rect x="950.0" y="576" width="100.0" height="68" rx="0" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1"/><text x="1000.0" y="619.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">0.844</text><text x="731" y="482.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">1</text><text x="731" y="550.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">2</text><text x="731" y="618.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">3</text><text x="800.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">1</text><text x="900.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">2</text><text x="1000.0" y="420" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">3</text><text x="600" y="709" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">각 행의 합 = 1 · 마스크로 제외한 위치 = 0</text><path d="M48,760 L1152,760" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="819" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">토큰 3의 행에 집중해서 보면,</text><text x="600" y="875" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">[1, 0, 3] → [e¹, e⁰, e³] ÷ (e¹ + e⁰ + e³)</text><text x="280" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">토큰 1</text><rect x="190" y="990" width="180" height="175" rx="0" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="190" y="1145.015840107696" width="180" height="19.984159892304035" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.114</text><text x="600" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">토큰 2</text><rect x="510" y="990" width="180" height="175" rx="0" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="510" y="1157.6482384265385" width="180" height="7.351761573461559" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.042</text><text x="920" y="950" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">토큰 3</text><rect x="830" y="990" width="180" height="175" rx="0" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><rect x="830" y="1017.3359214657656" width="180" height="147.6640785342344" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="920" y="1208" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">0.844</text><text x="600" y="1280" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">점수가 클수록 해당 토큰의 Value에 더 큰 가중치를 줍니다.</text><path d="M48,1340 L1152,1340" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1381" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Head 1 · P는 소수점 셋째 자리까지 반올림했습니다.</text>
</svg>