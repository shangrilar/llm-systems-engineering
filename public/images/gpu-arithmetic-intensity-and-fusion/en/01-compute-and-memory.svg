<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">What Limits Processing Speed?</title><desc id="desc">Compare data-supply and compute-throughput bottlenecks on the same GPU. Above, limited inputs leave some compute units waiting. Below, more computation per input makes compute throughput the limit. Small boxes represent data and compute activity, not core counts or measured utilization. These are different workloads with different bottlenecks, not a speed comparison of the same computation.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">What Limits Processing Speed?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Consider both data supply from memory and work in the compute units.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="215" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="76" y="261" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">When Data Supply Is the Bottleneck</text><rect x="76" y="313" width="170" height="127" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="161.0" y="384.5" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">HBM</text><path d="M268,330 H501 M268,425 H501" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="280" y="364" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="310" y="364" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><path d="M468,377 L514,377" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)" /><rect x="536" y="303" width="370" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="721" y="337" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">Compute units</text><rect x="560" y="366" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="601" y="366" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="642" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><rect x="683" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><rect x="724" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><rect x="765" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><rect x="806" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><rect x="847" y="366" width="31" height="40" rx="4" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><path d="M919,377 L960,377" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)" /><rect x="979" y="333" width="145" height="91" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="1051.5" y="386.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Results</text><text x="381" y="483" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Supply required inputs</text><text x="721" y="483" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Limited inputs leave compute idle</text><text x="600" y="530" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Data supply limits progress even when compute capacity remains.</text><rect x="48" y="596" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="76" y="642" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">When Compute Throughput Is the Bottleneck</text><rect x="76" y="694" width="170" height="127" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="161.0" y="765.5" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">HBM</text><path d="M268,711 H501 M268,806 H501" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="280" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="310" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="340" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="370" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="400" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="430" y="745" width="23" height="27" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><path d="M468,758 L514,758" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)" /><rect x="536" y="684" width="370" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="721" y="718" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">Compute units</text><rect x="560" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="601" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="642" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="683" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="724" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="765" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="806" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><rect x="847" y="747" width="31" height="40" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><path d="M919,758 L960,758" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal)" /><rect x="979" y="714" width="145" height="91" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="1051.5" y="767.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Results</text><text x="381" y="864" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Supply required inputs</text><text x="721" y="864" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">More computation per input</text><text x="600" y="911" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Even with enough data, completing the computation takes time.</text><text x="600" y="991" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">On the same GPU, computation and data movement determine the bottleneck.</text></svg>