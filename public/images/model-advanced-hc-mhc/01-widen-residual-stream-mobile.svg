<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1560" viewBox="0 0 360 1560" role="img" aria-labelledby="title desc"><title id="title">한 토큰의 Residual 경로를 여러 stream으로 넓힙니다</title><desc id="desc">A에는 토큰 t의 d차원 x가 하나의 F와 우회 경로로 나뉘어 더해진다. B에는 같은 토큰 t의 x1,x2 두 stream이 있다. 파란 읽기가 두 stream을 하나의 d차원 F 입력으로 모으고, 주황 쓰기가 F 출력을 2×d로 분배한다. 청록 residual 혼합의 결과와 stream별로 더해 두 출력 stream을 얻는다.</desc><metadata>{&quot;id&quot;:&quot;ma-13-01&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;mHC §1 and §3, residual and HC equations&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2512.24880v1#S3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2 · 한 단계의 연결</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">한 토큰의 Residual 경로를</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">여러 stream으로 넓힙니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">깊이 방향의 한 단계 · 같은 토큰 t · 파랑:</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">읽기 · 청록: 우회 혼합 · 주황: 쓰기</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 한 stream</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="300" y="112" width="180" height="66" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="390" y="153" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">t · x [d]</text><path d="M390 188 L390 228" stroke="#287D78" stroke-width="4" fill="none"/><circle cx="390" cy="228" r="5" fill="#287D78" stroke="#287D78"/><path d="M390 228 H130 V380" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M390 228 L390 588" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="390" width="220" height="115" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="421" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">F</text><text x="36" y="461" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">입력 d → 출력 d</text></g><path d="M130 515 V620 H356" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><circle cx="390" cy="620" r="24" fill="#FFFFFF" stroke="#287D78"/><text x="390" y="628" fill="#182C40" font-size="32" font-weight="400" text-anchor="middle" data-max-width="45">+</text><path d="M390 655 L390 721" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="270" y="731" width="240" height="68" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="390" y="773" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="228">t · x + F(x) [d]</text><text x="20" y="855" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="480">F를 거치지 않는 x가 그대로 더해집니다.</text></g><g transform="translate(16 816.0153846153846) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 두 stream · F는 하나</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="270" y="104" width="240" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="390" y="134" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="225">X [2×d]</text><rect x="282" y="161" width="104" height="62" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="334" y="200" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="92">t · x₁</text><rect x="397" y="161" width="104" height="62" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="449" y="200" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="92">t · x₂</text><path d="M260 176 H130 V280" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="290" width="220" height="111" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="321" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">읽기 · H_pre</text><text x="36" y="361" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">2×d → d</text></g><path d="M130 411 L130 446" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="456" width="220" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="487" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">F · 변환 하나</text><text x="36" y="527" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">d → d</text></g><path d="M130 574 L130 609" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="20" y="619" width="220" height="111" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="650" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">쓰기 · H_post</text><text x="36" y="690" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">d → 2×d</text></g><path d="M334 250 L334 380" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M449 250 L449 380" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="270" y="390" width="240" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="421" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="208">혼합 · H_res</text><text x="286" y="461" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="208">2×d → 2×d</text></g><path d="M334 540 L334 755" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M449 540 L449 755" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M130 740 V815 H260" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="270" y="765" width="240" height="107" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="796" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="208">+ · stream별 덧셈</text><text x="286" y="836" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="208">[2×d] + [2×d]</text></g><path d="M334 882 L334 918" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M449 882 L449 918" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="282" y="928" width="104" height="62" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="334" y="967" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="92">t · x₁′</text><rect x="397" y="928" width="104" height="62" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="449" y="967" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="92">t · x₂′</text><text x="260" y="1052" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="480">보관 2×d · F 입출력 d</text><text x="260" y="1097" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="490">F: Attention 또는 MLP (정규화 생략)</text></g></svg>