<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1233" viewBox="0 0 1200 1233" role="img" aria-labelledby="title desc"><title id="title">The starting policy changes the experience available to learn from</title><desc id="desc">Two hypothetical policies each generate eight responses to one prompt. All eight rewards are zero on the left, yielding zero group-relative signal. Mixed zero and one rewards on the right provide reward contrast.</desc><metadata>{&quot;id&quot;:&quot;5-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Daniel Han · RL intuition, 2:05:26&quot;,&quot;url&quot;:&quot;https://www.youtube.com/watch?v=uIiA6DquRiE&amp;t=7526s&quot;},{&quot;label&quot;:&quot;DeepSeekMath §4.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2402.03300v3#S4.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">The starting policy changes the experience available to learn</text><text x="48" y="149.4" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">from</text><text x="48" y="191.4" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Eight responses to the same prompt: encountering successful responses creates opportunities</text><text x="48" y="223.6" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">to learn from reward differences.</text><path d="M48,252.6 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 288.6) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">All eight attempts fail this time</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="105" width="488" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="136" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Starting policy A</text><text x="32" y="176" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Same prompt Q · budget: 8 responses</text></g><path d="M260 221 L260 264" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="282" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="313" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 1 · R = 0</text></g><g data-container="true"><rect x="268" y="282" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="284" y="313" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 2 · R = 0</text></g><g data-container="true"><rect x="16" y="373" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="404" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 3 · R = 0</text></g><g data-container="true"><rect x="268" y="373" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="284" y="404" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 4 · R = 0</text></g><g data-container="true"><rect x="16" y="464" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="495" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 5 · R = 0</text></g><g data-container="true"><rect x="268" y="464" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="284" y="495" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 6 · R = 0</text></g><g data-container="true"><rect x="16" y="555" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="586" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 7 · R = 0</text></g><g data-container="true"><rect x="268" y="555" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="284" y="586" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 8 · R = 0</text></g><path d="M260 645 L260 685" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="700" width="488" height="160" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="731" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">No reward contrast within the group</text><text x="32" y="771" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Each reward − group mean = 0</text><text x="32" y="799" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">→ zero task advantage for this group</text></g></g><g transform="translate(624 288.6) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Encountering both success and failure</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="105" width="488" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="136" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Starting policy B</text><text x="32" y="176" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Same prompt Q · budget: 8 responses</text></g><path d="M260 221 L260 264" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="282" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="313" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 1 · R = 0</text></g><g data-container="true"><rect x="268" y="282" width="236" height="74" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="284" y="313" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 2 · R = 1</text></g><g data-container="true"><rect x="16" y="373" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="404" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 3 · R = 0</text></g><g data-container="true"><rect x="268" y="373" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="284" y="404" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 4 · R = 0</text></g><g data-container="true"><rect x="16" y="464" width="236" height="74" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="495" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 5 · R = 1</text></g><g data-container="true"><rect x="268" y="464" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="284" y="495" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 6 · R = 0</text></g><g data-container="true"><rect x="16" y="555" width="236" height="74" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="586" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 7 · R = 0</text></g><g data-container="true"><rect x="268" y="555" width="236" height="74" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="284" y="586" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="204">Response 8 · R = 1</text></g><path d="M260 645 L260 685" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="700" width="488" height="160" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="731" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Rewards differ within the group</text><text x="32" y="771" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Success above average; failure below</text><text x="32" y="799" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">→ signal to adjust token probabilities</text></g></g></svg>