<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">다른 스트림의 결과는 어떻게 기다릴까?</title><desc id="desc">위쪽은 CPU가 등록하는 순서이며 시간축이 아니다. 프로그램이 같은 GPU에 두 스트림을 만든다. S0에 계산 A와 이벤트 E 기록을, S1에 계산 C와 이벤트 E 완료 대기와 계산 B를 순서대로 등록한다. CPU는 이벤트 E 완료까지 기다리지 않고 다음 작업을 계속한다. 아래쪽 GPU 시간축에서는 독립적인 A와 C가 겹쳐 실행된다. C가 끝나도 이벤트 E가 완료되지 않았다면 B는 기다린다. A가 끝나고 이벤트 E가 완료된 뒤 B가 실행된다. 동시 실행은 자원이 허용하는 경우다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1260" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 5 · 그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">다른 스트림의 결과는 어떻게 기다릴까?</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">이벤트 E로 A의 완료를 표시하고, B가 그 완료를 기다리도록 지정합니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="205" width="1104" height="70" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="250" fill="#2470BB" font-size="27" font-weight="600" text-anchor="start">A → u → B</text><text x="436" y="250" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="start">C는 별도 데이터를 사용하는 독립적인 계산</text><text x="48" y="326" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU: 두 스트림에 작업과 순서를 등록</text><text x="48" y="363" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">프로그램이 스트림을 만들고, 각 작업을 어느 스트림에 넣을지 지정합니다.</text><rect x="48" y="389" width="1104" height="223" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="447" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">스트림 S₀</text><rect x="250" y="412" width="200" height="64" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350.0" y="453.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">계산 A</text><path d="M461,444 H485" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="496" y="412" width="280" height="64" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="636.0" y="453.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">이벤트 E 기록</text><text x="800" y="452" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">A 뒤에 완료 지점 표시</text><text x="76" y="553" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">스트림 S₁</text><rect x="250" y="518" width="200" height="64" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="350.0" y="559.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">계산 C</text><path d="M461,550 H485" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="496" y="518" width="280" height="64" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="636.0" y="559.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">이벤트 E 완료 대기</text><path d="M787,550 H811" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="822" y="518" width="280" height="64" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="962.0" y="559.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">계산 B</text><text x="600" y="654" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">CPU는 이벤트 E 완료를 기다리지 않고 다음 CPU 작업을 계속합니다.</text><text x="48" y="732" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU: 등록된 순서와 조건에 따라 실행</text><text x="48" y="769" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 GPU의 두 스트림</text><path d="M250,807 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="792" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">시간 →</text><text x="48" y="884" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">스트림 S₀</text><rect x="250" y="844" width="500" height="76" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="500.0" y="891.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">계산 A</text><path d="M751,882 H770" fill="none" stroke="#2470BB" stroke-width="2"/><circle cx="780" cy="882" r="9" fill="#B55B22"/><text x="810" y="872" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">이벤트 E 완료</text><text x="810" y="909" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">A의 결과 u 준비</text><text x="48" y="1020" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">스트림 S₁</text><rect x="250" y="980" width="210" height="76" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="355.0" y="1027.0" fill="#7954A3" font-size="29" font-weight="600" text-anchor="middle">계산 C</text><rect x="460" y="980" width="320" height="76" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="620.0" y="1027.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">이벤트 E 완료 대기</text><rect x="780" y="980" width="350" height="76" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="955.0" y="1027.0" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">계산 B</text><path d="M780,894 V969" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)"/><rect x="48" y="1104" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1149" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">B는 이벤트 E 완료 뒤에 실행됩니다.</text><text x="600" y="1188" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">A와 C는 자원이 허용하면 겹쳐 실행될 수 있습니다.</text></svg>