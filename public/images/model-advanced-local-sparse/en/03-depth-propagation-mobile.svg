<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1364" viewBox="0 0 360 1364" role="img" aria-labelledby="title desc"><title id="title">Distant information can travel through intermediate positions</title><desc id="desc">Horizontal axis is position 0–7; depth increases upward from L0 to L3. Only ancestors of L3,p7 are highlighted. One orange path connects L0,p1, L1,p3, L2,p5, and L3,p7; mobile unfolds this path vertically. The table shows possible L0 input influence on p7: positions 5–7 after one layer, 3–7 after two, and 1–7 after three.</desc><metadata>{&quot;id&quot;:&quot;ma-04-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mistral 7B §2, stacked sliding-window attention&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2310.06825v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 3 · Across layers</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Distant information can</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">travel through</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">intermediate positions</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Window 3: same position and two</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">preceding positions in the previous</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">layer · L0 is the input · L1…L3 are</text><text x="16" y="238.59999999999997" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">layer depths</text><path d="M16,258.59999999999997 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 282.59999999999997) scale(0.6307692307692307)" data-panel="1"><text x="0" y="32" fill="#182C40" font-size="26" font-weight="600" text-anchor="start" data-max-width="520">Follow one path from bottom to top.</text><rect x="220" y="662" width="230" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="335" y="705" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L0 · p1</text><path d="M335 654 L335 560" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="150" y="607" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="180">Position +2</text><rect x="220" y="482" width="230" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="335" y="525" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L1 · p3</text><path d="M335 474 L335 380" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="150" y="427" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="180">Position +2</text><rect x="220" y="302" width="230" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="335" y="345" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L2 · p5</text><path d="M335 294 L335 200" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="150" y="247" fill="#B55B22" font-size="23" font-weight="400" text-anchor="middle" data-max-width="180">Position +2</text><rect x="220" y="122" width="230" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="335" y="165" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">L3 · p7</text><path d="M35 729 L35 115" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="10" y="94" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="190">Depth</text><text x="260" y="800" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">Orange: one possible path</text><path d="M0 879 L520 879" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="0" y="919" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Possible L0 input influence on position p7</text><text x="306" y="978" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle" data-max-width="360">Input position j</text><rect x="140" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="182" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="224" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="266" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="308" y="1019" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="350" y="1019" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="392" y="1019" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="1019" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="140" y="1061" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="182" y="1061" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="224" y="1061" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="266" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="308" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="350" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="392" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="1061" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="140" y="1103" width="38" height="38" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="182" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="224" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="266" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="308" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="350" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="392" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="434" y="1103" width="38" height="38" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="159" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">0</text><text x="201" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">1</text><text x="243" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">2</text><text x="285" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">3</text><text x="327" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">4</text><text x="369" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">5</text><text x="411" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">6</text><text x="453" y="1007" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="38">7</text><text x="122" y="1046" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L1, p7</text><text x="122" y="1088" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L2, p7</text><text x="122" y="1130" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L3, p7</text><text x="260" y="1205" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle" data-max-width="500">p0 is still out of reach after three</text><text x="260" y="1240" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle" data-max-width="500">layers.</text></g><path d="M16,1132.9076923076923 H344" stroke="#DCE4EC" stroke-width="2"/><text x="16" y="1159.9076923076923" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">Each layer can move information at most</text><text x="16" y="1182.3076923076924" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">two positions to the right. The</text><text x="16" y="1204.7076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">highlighted path is L0,p1 → L1,p3 → L2,p5 →</text><text x="16" y="1227.1076923076923" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">L3,p7. Thus L3,p7 can be influenced by</text><text x="16" y="1249.5076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">input positions p1…p7, but p0 is still out</text><text x="16" y="1271.9076923076923" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">of reach. Indirect propagation does not</text><text x="16" y="1294.3076923076924" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">guarantee the same information</text><text x="16" y="1316.7076923076922" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">preservation as directly reading the</text><text x="16" y="1339.1076923076923" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start" data-max-width="328">original KV.</text></svg>