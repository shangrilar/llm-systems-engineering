<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">Sharing common KV across responses</title><desc id="desc">The top duplicates the KV for prompt positions p0 through p5 for two responses, using four physical blocks. Below, two separate block tables both reference P0 and P1, using only two physical blocks. P0 holds p0 through p3; P1 holds p4 and p5 with two unused slots.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1010" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Sharing common KV across responses</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Two responses start from the same 6-token prompt. Each block holds KV for 4</text><text x="48" y="140.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">positions.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="210.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">A copy for each response</text><text x="1152" y="210.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="end">4 physical blocks</text><rect x="48" y="237" width="1104" height="316" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="273.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Block table</text><rect x="76" y="293" width="172" height="156" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="162.0" y="326.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Response 1</text><path d="M90,342 H234" stroke="#DCE4EC"/><text x="162.0" y="376.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L0 → P0</text><text x="162.0" y="425.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L1 → P1</text><text x="352" y="330.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P0</text><rect x="352" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="374.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><rect x="400" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="422.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><rect x="448" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="470.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><rect x="496" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="518.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><text x="352" y="436.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P1</text><rect x="352" y="452" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="374.0" y="483.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p4</text><rect x="400" y="452" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="422.0" y="483.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p5</text><rect x="448" y="452" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="496" y="452" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><path d="M256,370 L330.0,370.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M340,370 L330.0,374.5 L330.0,365.5 Z" fill="#526577"/><path d="M256,419 H302 V476" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M302,476 L330.0,476.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M340,476 L330.0,480.5 L330.0,471.5 Z" fill="#526577"/><text x="652" y="273.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Block table</text><rect x="652" y="293" width="172" height="156" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="738.0" y="326.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Response 2</text><path d="M666,342 H810" stroke="#DCE4EC"/><text x="738.0" y="376.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L0 → P2</text><text x="738.0" y="425.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L1 → P3</text><text x="928" y="330.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P2</text><rect x="928" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="950.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><rect x="976" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="998.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><rect x="1024" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1046.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><rect x="1072" y="346" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1094.0" y="377.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><text x="928" y="436.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P3</text><rect x="928" y="452" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="950.0" y="483.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p4</text><rect x="976" y="452" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="998.0" y="483.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p5</text><rect x="1024" y="452" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="1072" y="452" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><path d="M832,370 L906.0,370.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M916,370 L906.0,374.5 L906.0,365.5 Z" fill="#526577"/><path d="M832,419 H878 V476" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M878,476 L906.0,476.0" stroke="#526577" stroke-width="2.5" fill="none"/><path d="M916,476 L906.0,480.5 L906.0,471.5 Z" fill="#526577"/><text x="48" y="611.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Share the common KV blocks</text><text x="1152" y="611.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="end">2 physical blocks</text><rect x="48" y="638" width="1104" height="333" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="675.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Block table</text><text x="952" y="675.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Block table</text><rect x="76" y="695" width="172" height="156" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="162.0" y="728.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Response 1</text><path d="M90,744 H234" stroke="#DCE4EC"/><text x="162.0" y="778.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L0 → P0</text><text x="162.0" y="827.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L1 → P1</text><rect x="952" y="695" width="172" height="156" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1038.0" y="728.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Response 2</text><path d="M966,744 H1110" stroke="#DCE4EC"/><text x="1038.0" y="778.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L0 → P0</text><text x="1038.0" y="827.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">L1 → P1</text><text x="504" y="732.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P0</text><rect x="504" y="748" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="526.0" y="779.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p0</text><rect x="552" y="748" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="574.0" y="779.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p1</text><rect x="600" y="748" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="622.0" y="779.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p2</text><rect x="648" y="748" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="670.0" y="779.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p3</text><text x="504" y="850.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">P1</text><rect x="504" y="866" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="526.0" y="897.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p4</text><rect x="552" y="866" width="44" height="48" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="574.0" y="897.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">p5</text><rect x="600" y="866" width="44" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="648" y="866" width="44" height="48" 