<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc"><title id="title">학습 DP: 기울기를 맞추고 같은 갱신</title><desc id="desc">기울기 2와 6을 평균내어 4를 얻고 두 GPU 모두 가중치 10을 9.6으로 갱신합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="830" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">학습 DP: 기울기를 맞추고 같은 갱신</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">동일 크기의 입력 묶음, 묶음별 평균 손실, 단순 SGD 갱신을 가정합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="207" width="510" height="160" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="243.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 가중치 w = 10</text><text x="66" y="325.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">입력 A → 기울기 g₀ = 2</text><rect x="642" y="207" width="510" height="160" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="243.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="293.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 가중치 w = 10</text><text x="660" y="325.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">입력 B → 기울기 g₁ = 6</text><path d="M303,378 L303,431" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,378 L897,431" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="446" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="482.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">All-Reduce로 합산한 뒤 참여자 수로 나누기</text><text x="72" y="522.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">g = (2 + 6) / 2 = 4</text><path d="M303,562 L303,601" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="615" width="510" height="167" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="651.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="701.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">학습률 η = 0.1</text><text x="66" y="733.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 갱신: 10 − 0.1 × 4 = 9.6</text><path d="M897,562 L897,601" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="642" y="615" width="510" height="167" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="651.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="660" y="701.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">학습률 η = 0.1</text><text x="660" y="733.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 갱신: 10 − 0.1 × 4 = 9.6</text></svg>