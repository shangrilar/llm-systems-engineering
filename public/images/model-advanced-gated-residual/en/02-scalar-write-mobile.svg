6" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Componentwise read gates · One write</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">scalar per branch · Same input as</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Figure 2</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Fresh output and write scales</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="15" y="120" width="230" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="31" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Read input x</text><text x="31" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">[0.6, −0.2]</text></g><g data-container="true"><rect x="280" y="120" width="225" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="296" y="151" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">R̂₁, R̂₂</text><text x="296" y="191" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">All branches</text></g><path d="M130 235 L130 280" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M393 235 L393 280" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="15" y="292" width="230" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="31" y="323" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">F</text><text x="31" y="363" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Assume output y</text></g><g data-container="true"><rect x="280" y="292" width="225" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="296" y="323" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="193">Write scales</text><text x="296" y="363" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="193">2 × sigmoid</text></g><path d="M130 407 L130 450" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M393 407 L393 450" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><rect x="20" y="462" width="225" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="132.5" y="502.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="213">y = [0.5, −0.25]</text><rect x="280" y="462" width="225" height="65" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="392.5" y="502.5" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="213">s₁ = 1.2, s₂ = 0.4</text><text x="260" y="606" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle" data-max-width="490">Read: a gate for each component</text><text x="260" y="653" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle" data-max-width="490">Write: one scalar for each stream</text><text x="260" y="766" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle" data-max-width="490">0 &lt; sᵢ &lt; 2</text></g><g transform="translate(16 776.7384615384615) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Add the same y to each original</text><path d="M0 68 L520 68" stroke="#DCE4EC" strok