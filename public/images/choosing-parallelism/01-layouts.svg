<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951" role="img" aria-labelledby="title desc"><title id="title">GPU 네 개를 배치하는 세 가지 방법</title><desc id="desc">4개 단일 GPU 복제본, 2개의 2-GPU TP 복제본, 1개의 4-GPU TP 복제본을 비교합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="951" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">GPU 네 개를 배치하는 세 가지 방법</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">예시는 dense 모델의 가중치를 균등하게 나눌 수 있는 TP를 가정합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">모델 네 벌 · DP</text><rect x="48" y="241" width="264" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 0</text><text x="180" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W 전체</text><rect x="328" y="241" width="264" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="460" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 1</text><text x="460" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W 전체</text><rect x="608" y="241" width="264" height="140" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="740" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 2</text><text x="740" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W 전체</text><rect x="888" y="241" width="264" height="140" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="295.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 3</text><text x="1020" y="339.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W 전체</text><text x="48" y="438.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">두 GPU씩 두 벌 · TP + DP</text><rect x="48" y="467" width="544" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 0</text><text x="180" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/2</text><text x="460" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 1</text><text x="460" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/2</text><rect x="608" y="467" width="544" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="740" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 2</text><text x="740" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/2</text><text x="1020" y="521.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 3</text><text x="1020" y="565.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/2</text><text x="48" y="664.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">네 GPU로 한 벌 · TP</text><rect x="48" y="693" width="1104" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 0</text><text x="180" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/4</text><text x="460" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 1</text><text x="460" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/4</text><text x="740" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 2</text><text x="740" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/4</text><text x="1020" y="747.0" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">GPU 3</text><text x="1020" y="791.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">W의 1/4</text><text x="48" y="901.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">같은 테두리 안의 GPU들이 한 모델 실행을 함께 담당합니다.</text></svg>