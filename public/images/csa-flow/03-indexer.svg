<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1508" viewBox="0 0 1200 1508" role="img" aria-labelledby="title desc"><title id="title">indexer: 블록을 점수 매기고 고르기</title><desc id="desc">indexer는 메인 압축기와 별개의 압축기로 후보 key K^{IComp}를 만들고, 메인 Query와 같은 c^Q에서 올린 q^I와 head 가중치 w^I로 점수 I[t, s] = Σ_h w_h · ReLU(q_h · K_s)를 계산해, 완성된 블록 중 점수가 큰 k개의 번호를 고른다. 그 번호는 메인 압축 entry를 가리킨다.</desc><metadata>{&quot;id&quot;:&quot;csa-flow-03-indexer&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 report · §2.3.1 (CSA)&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro&quot;},{&quot;label&quot;:&quot;DeepSeek-V4-Pro inference code · Attention, Compressor, Indexer&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/blob/main/inference/model.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><p