<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">Manage Many Computations in Groups</title><desc id="desc">A grid contains blocks A through H for one vector addition execution. Only some threads are drawn as cells in each block. One thread is expanded to show reading 1 and 10, adding them, and storing 11. The example has 1,024 outputs, eight blocks, and 128 threads per block, with one output per thread. The cells are not physical compute units.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1010" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Manage Many Computations in Groups</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Group threads into blocks, and organize all the blocks into a grid.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="48" y="220" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Organize many output computations into groups of work.</text><rect x="48" y="249" width="650" height="601" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="76" y="296" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Grid · all blocks in one kernel execution</text><rect x="76" y="324" width="284" height="99" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="94" y="357" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">Block A · 128 threads</text><rect x="94" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="120" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="146" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="172" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="198" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="224" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="250" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><rect x="276" y="378" width="18" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5" /><text x="321" y="398" fill="#2470BB" font-size="25" font-weight="400" text-anchor="start">⋯</text><rect x="382" y="324" width="284" height="99" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="400" y="357" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="start">Block B · 128 threads</text><rect x="400" y="378" width="18" height="22" rx="3" fill="#FFFFF