 font-size="22" font-weight="700" text-anchor="middle">p5</text><rect x="982" y="793" width="48" height="48" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="1006" y="824" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">a0</text><rect x="1034" y="793" width="48" height="48" rx="5" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1025" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">The full first block stays shared; only the tail that needs a write is split.</text></g></g><path d="M48,1086 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1124" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Only the last shared block that needs new KV is split; the full first block remains shared.</text></svg>