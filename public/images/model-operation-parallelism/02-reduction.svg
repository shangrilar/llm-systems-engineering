<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="965" viewBox="0 0 1200 965" role="img" aria-labelledby="title desc"><title id="title">Reduction: 나누어 계산하고 결과 모으기</title><desc id="desc">두 행의 합을 별개의 트리로 보여준다. 첫 행은 1부터 8까지 더해 부분합 3,7,11,15에서 10,26을 거쳐 36이 된다. 두 번째 행은 2,1을 네 번 반복해 3,3,3,3에서 6,6을 거쳐 12가 된다. 같은 단계의 덧셈과 서로 다른 행은 독립적이며 다음 단계는 이전 부분합에 의존한다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="965" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Reduction: 나누어 계산하고 결과 모으기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">합 계산도 병렬화할 수 있지만, 다음 단계에는 앞선 결과가 필요합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="216" width="536" height="589" rx="12" fill="#FFFFFF" stroke="