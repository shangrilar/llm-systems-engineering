"/><rect x="757.6" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="792.8" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><text x="740" y="637" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle">크기 1</text><rect x="888" y="467" width="264" height="188" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="501" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">마이크로배치 4</text><rect x="917" y="520" width="206" height="85" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="931" y="549" fill="#B55B22" font-size="23" font-weight="700" text-anchor="start">D</text><rect x="932" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="967.2" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="1002.4" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="1037.6" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="1072.8" y="565" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="637" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle">크기 1</text><text x="600" y="707" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">처리할 입력은 그대로 네 개 · 더 작은 묶음 네 개로 실행</text><rect x="100" y="746" width="1000" height="104" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="785" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A·B·C·D 각각이 같은 경로를 끝까지 통과</text><text x="600" y="827" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">GPU 0 → GPU 1 → GPU 2 → GPU 3</text><rect x="100" y="888" width="1000" height="109" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="928" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">학습 예시: 네 마이크로배치의 기울기를 누적 → 가중치 한 번 갱신</text><text x="600" y="970" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">마이크로배치 하나마다 가중치를 바꾸는 예시가 아닙니다.</text></g></g><path d="M48,1051 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1089" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">크기 1은 설명용 예시입니다. 모든 마이크로배치는 GPU 0부터 GPU 3까지 모두 통과합니다.</text></svg>