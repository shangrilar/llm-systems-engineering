<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1272" viewBox="0 0 1200 1272" role="img" aria-labelledby="title desc"><title id="title">토큰마다 Key를 펼치는 계산을 없앱니다</title><desc id="desc">헤드 1의 같은 Query와 네 위치 p0에서 p3까지를 비교한다. 왼쪽은 각 cⱼ 1×3을 같은 Uᴷ₁ 3×2로 투영해 네 content Key 1×2를 만들고 Query와 내적한다. 오른쪽은 Query 1×2를 (Uᴷ₁)ᵀ 2×3으로 한 번 변환해 q̃ 1×3을 얻고 네 캐시 행과 직접 내적한다. 네 content 점수는 같다.</desc><metadata>{&quot;id&quot;:&quot;ma-03-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V2 §2.1.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.04434v5#S2.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B5