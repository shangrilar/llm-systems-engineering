<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title desc">
<title id="title">토큰별 계산에서 위치 정보까지</title><desc id="desc">디코더 블록에서 Attention, 그 안의 Core Attention으로 범위를 좁힌다. QK 전치는 점수, mask는 참조 범위, PV는 정보 결합이다. 토큰 3에서 한 칸 전과 두 칸 전 모두 허용되지만 위치 차이는 다르다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1530" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">토큰별 계산에서 위치 정보까지</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">지금까지의 흐름을 좁혀 보며, 위치 차이를 묻습니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="215" width="1104" height="188" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="250" fill="#182C40" font-size="23" font-weight="600" text-anchor="start">디코더 블록</text><rect x="76" y="273" width="518" height="102" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="335" y="310" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">RMSNorm · MLP · Residual 덧셈</text><text x="335" y="347" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">각 토큰의 벡터에 적용</text><rect x="622" y="273" width="518" height="102" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="881" y="310" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Attention</text><text x="881" y="347" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">토큰 사이의 정보 결합</text><rect x="48" y="440" width="1104" height="188" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="475" fill="#182C40" font-size="23" font-weight="600" text-anchor="start">Attention 내부</text><rect x="76" y="498" width="518" height="102" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="335" y="535" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">Q·K·V / 출력 projection</text><text x="335" y="572" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">각 토큰의 벡터에 적용</text><rect x="622" y="498" width="518" height="102" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="881" y="535" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Core Attention</text><text x="881" y="572" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">토큰 사이의 계산</text><path d="M600,410 L600,432" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M600,636 L600,658" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="48" y="668" width="1104" height="222" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="705" fill="#182C40" font-size="23" font-weight="600" text-anchor="start">Core Attention 내부</text><rect x="76" y="734" width="304" height="125" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="228" y="771" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">QKᵀ</text><text x="228" y="810" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle">Q·K의 성분을 비교</text><text x="228" y="839" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">토큰 사이의 점수</text><rect x="448" y="734" width="304" height="125" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="771" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">Causal mask</text><text x="600" y="810" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle">참조 가능한 위치만 남김</text><text x="600" y="839" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">자기 자신과 이전 토큰</text><rect x="820" y="734" width="304" height="125" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="972" y="771" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">PV</text><text x="972" y="810" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle">Value를 가중합</text><text x="972" y="839" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">토큰 사이의 정보 결합</text><text x="600" y="948" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">토큰 3은 토큰 1과 2를 모두 참조할 수 있습니다.</text><rect x="106" y="988" width="236" height="98" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="1027" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">토큰 1</text><text x="224" y="1063" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">위치 0</text><rect x="482" y="988" width="236" height="98" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1027" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">토큰 2</text><text x="600" y="1063" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">위치 1</text><rect x="858" y="988" width="236" height="98" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="1027" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">토큰 3</text><text x="976" y="1063" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">위치 2</text><path d="M976,1103 V1137 H600 V1103" fill="none" stroke="#2470BB" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="788" y="1174" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">한 칸 전 · 참조 가능</text><path d="M1004,1103 V1223 H224 V1103" fill="none" stroke="#2470BB" stroke-width="2.5" marker-end="url(#blue-arrow)"/><text x="600" y="1264" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">두 칸 전 · 참조 가능</text><rect x="48" y="1316" width="1104" height="93" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1373" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">이 위치 차이를 Q·K의 비교에 어떻게 반영할까?</text><path d="M48,1450 L1152,1450" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1491" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Causal mask는 순서에 따라 참조 범위를 정합니다. 위치 차이를 점수에 직접 반영하는 연산은 아닙니다.</text>
</svg>