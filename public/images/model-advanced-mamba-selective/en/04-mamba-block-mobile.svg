<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1679" viewBox="0 0 360 1679" role="img" aria-labelledby="title desc"><title id="title">Place the selective SSM inside a Mamba block</title><desc id="desc">After norm and projections,input splits into main and output-gate branches. The main branch has short convolution,SiLU,and selective SSM. Multiply by the output gate,project,and add residual. Carry convolution input history and N-component-per-channel SSM state to the next step.</desc><metadata>{&quot;id&quot;:&quot;mamba-04&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Mamba §3.4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2312.00752v2#S3.SS4&quot;},{&quot;label&quot;:&quot;Official Mamba-1 v2.2.2&quot;,&quot;url&quot;:&quot;https://github.com/state-spaces/mamba/blob/v2.2.2/mamba_ssm/modules/mamba_simple.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" 