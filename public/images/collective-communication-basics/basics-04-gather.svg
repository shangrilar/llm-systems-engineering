<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="935" viewBox="0 0 1200 935" role="img" aria-labelledby="title desc">
<title id="title">Gather: 각자의 조각을 한곳으로</title><desc id="desc">각 GPU의 입력은 [1,2], [10,20], [100,200], [1000,2000]이다. Gather 완료 후 root인 GPU 0의 출력은 이 배열들을 rank 순서로 이어 붙인 [1,2,10,20,100,200,1000,2000]이다. 배열의 네 행은 원래 각 GPU의 두 원소짜리 조각이며 하나의 일차원 배열을 접어 표시했다. 다른 GPU는 출력 대상이 아니며 입력은 유지된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="935" fill="white"/>
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">집합 통신의 기본 동작 · 그림 4</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Gather: 각자의 조각을 한곳으로</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">각 GPU의 배열을 rank 순서로 이어 붙여 root에 모읍니다.</text><path d="M48,169 H1152" stroke="#DCE4EC"/><text x="48" y="205" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">통신 전 · 입력 버퍼</text><rect x="48" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="64" y="244" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="84" y="267" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="222" y="244" width="72" height="30" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="258" y="266" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle">root</text><rect x="72" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="293" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="236.0" y="324" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M180,378 V407" fill="none" stroke="#5C6C7C" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="328" y="229" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="344" y="244" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5"/><text x="364" y="267" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="293" width="104" height="44" rx="7" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="404.0" y="324" fill="#287D78" font-size="2