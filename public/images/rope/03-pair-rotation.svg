<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="title desc">
<title id="title">두 성분을 회전한다는 의미</title><desc id="desc">한 쌍 [1,1]을 평면에 그리고 30도 회전하면 약 [0.366,1.366]이 된다. 회전 전후 길이 제곱은 모두 2다. 회전은 cos와 sin을 곱해 두 성분을 조합하는 계산이다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1280" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">두 성분을 회전한다는 의미</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">두 수를 평면 위 벡터의 좌표로 봅니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="205" width="1104" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="244" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Head 1 · 네 성분 중 한 쌍 [a, b]를 확대합니다.</text><text x="320" y="337" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">회전 전</text><path d="M144,536 L496,536" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M320,360 L320,712" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="320" cy="536" r="176" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><text x="880" y="337" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">30° 회전 후</text><path d="M704,536 L1056,536" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M880,360 L880,712" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="880" cy="536" r="176" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M320,536 L430,426" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M880,536 L990,426" fill="none" stroke="#8191A0" stroke-width="2" marker-end="url(#arrow-arrow)"/><path d="M880,536 L920.2627944162882,385.7372055837118" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><path d="M938.6898628384835,477.31013716151654 A83,83 0 0 0 901.4819807435092,455.8281564180073" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue-arrow)"/><text x="981" y="477" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">30°</text><text x="320" y="772" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">[a, b] = [1, 1]</text><text x="880" y="772" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">[a′, b′] ≈ [0.366, 1.366]</text><path d="M552,536 L648,536" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><rect x="48" y="819" width="1104" height="78" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="869" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">두 성분의 값은 달라지고, 벡터의 길이는 유지됩니다.</text><text x="600" y="956" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">회전각 α에 따른 두 성분의 계산</text><text x="600" y="1018" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">a′ = a cos α − b sin α</text><text x="600" y="1076" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">b′ = a sin α + b cos α</text><text x="600" y="1147" fill="#5C6C7C" font-size="27" font-weight="400" text-anchor="middle">a′² + b′² = a² + b² = 2</text><path d="M48,1200 L1152,1200" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1241" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">회전각은 설명용입니다. 실제 모델의 주파수 설정을 나타내지 않습니다.</text>
</svg>