d="url(#arrow-red)" data-wire="branch" data-source="80,114"/><g data-path="q"><path d="M306 270 L352 270" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/></g><g data-path="q"><path d="M482 270 L524 270" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/></g><g data-path="c"><path d="M306 640 L354 640" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/></g><g data-path="z"><path d="M306 820 L354 820" stroke="#287D78" stroke-width="1.8" fill="none" marker-end="url(#arrow-teal)"/></g><path d="M626 270 L647 270 L647 389.8 L700 389.8 L700 424" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M807 452 L897 452" stroke="#B34242" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/></g></svg>