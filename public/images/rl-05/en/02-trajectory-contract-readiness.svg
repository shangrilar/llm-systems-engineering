<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="976" viewBox="0 0 1200 976" role="img" aria-labelledby="title desc"><title id="title">From inference to the buffer: what travels with experience</title><desc id="desc">A trajectory travels from the inference engine to the data buffer. The record links input and generated tokens, generation log probabilities, loss masks, rewards, policy versions, and task/group IDs, assembled from inference, environment records, evaluation, and execution management.</desc><metadata>{&quot;id&quot;:&quot;5-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0 architecture&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/developer/architecture.md&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">From inference to the buffer: what travels with experience</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">A closer look at the trajectory path in Figure 1.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(0.9857142857142858)" data-panel="1"><g data-container="true"><rect x="8" y="12" width="300" height="116" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="24" y="43" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="268">Inference engine</text><text x="24" y="83" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="268">e.g. SGLang</text></g><g data-container="true"><rect x="812" y="12" width="300" height="116" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="828" y="43" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="268">Data buffer</text></g><path d="M320 70 L800 70" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="560" y="45" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="230">trajectory</text><path d="M560 84 V189" stroke="#7954A3" stroke-width="2" fill="none" stroke-dasharray="7 5"/><rect x="8" y="205" width="1104" height="518" rx="14" fill="#FFFFFF" stroke="#7954A3" stroke-width="1.5"/><text x="30" y="245" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start" data-max-width="1060">Information linked to the experience</text><g data-container="true"><rect x="30" y="287" width="518" height="124" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="318" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">Input / generated token IDs</text><text x="46" y="358" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">Inference / environment → context and actions</text></g><g data-container="true"><rect x="572" y="287" width="518" height="124" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="588" y="318" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">Generation log probabilities</text><text x="588" y="358" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">Inference → probabilities at generation time</text></g><g data-container="true"><rect x="30" y="427" width="518" height="124" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="458" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">Loss mask</text><text x="46" y="498" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">Conversation / environment → tokens to train on</text></g><g data-container="true"><rect x="572" y="427" width="518" height="124" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="588" y="458" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">Reward</text><text x="588" y="498" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">Evaluation / verification → task score</text></g><g data-container="true"><rect x="30" y="567" width="518" height="124" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="598" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">Policy version</text><text x="46" y="638" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">Manager / inference → weights used to generate</text></g><g data-container="true"><rect x="572" y="567" width="518" height="124" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="588" y="598" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">Task / group ID</text><text x="588" y="638" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">Execution manager → task and comparison group</text></g></g></svg>