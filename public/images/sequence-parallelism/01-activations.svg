<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906" viewBox="0 0 1200 906" role="img" aria-labelledby="title desc"><title id="title">복제된 활성값을 토큰 방향으로 나누기</title><desc id="desc">TP에서 복제된 t0부터 t3를 SP에서는 GPU 0의 t0,t1과 GPU 1의 t2,t3로 나눕니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="906" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">복제된 활성값을 토큰 방향으로 나누기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Megatron SP의 관점입니다. 모델 가중치의 TP 분할은 유지합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">활성값: 계산 중 만들어지는 토큰별 벡터</text><text x="48" y="245.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">TP의 복제 구간</text><rect x="48" y="273" width="510" height="213" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="310.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="68" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="123" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="123" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="187" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="242" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="242" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="306" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="361" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="361" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="425" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="480" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="480" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="642" y="273" width="510" height="213" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="310.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="662" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="717" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="717" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="781" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="836" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="836" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="900" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="955" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="955" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="1019" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="1074" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="1074" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><text x="48" y="533.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">SP로 나눈 구간</text><rect x="48" y="561" width="510" height="213" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="598.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="68" y="625" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="123" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="123" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="187" y="625" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="242" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="242" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="642" y="561" width="510" height="213" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="598.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="662" y="625" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="717" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="717" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="781" y="625" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="836" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="836" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><text x="48" y="853.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 토큰의 특징 네 개는 함께 유지합니다. 토큰 묶음만 나눕니다.</text></svg>