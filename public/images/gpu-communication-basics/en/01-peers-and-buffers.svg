<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1284" viewBox="0 0 1200 1284" role="img" aria-labelledby="title desc"><title id="title">Preparing Peers and Receive Space</title><desc id="desc">Two processes on the same server handle GPUs 0 and 1. CPU code prepares communicators as ranks 0 and 1 in the same group and requests GPU buffers. A produces [1,2,3,4] on GPU 0 and the data is transferred into GPU 1 receive memory. Before receiving, only space exists; after completion, the input is ready for B. The original stays on GPU 0. The peers match four float32 elements. Dashed arrows are allocation requests and the solid arrow is logical data transfer.</desc><metadata>{&quot;id&quot;:&quot;01-peers-and-buffers&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Preparing Peers and Receive Space</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The CPU prepares the group and buffers; the data lives in GPU memory.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><rect x="48" y="205" width="1104" height="54" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="241" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Two processes each handle one GPU on the same server</text><rect x="48" y="282" width="520" height="210" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="323" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Process 0 · CPU code</text><text x="76" y="367" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">GPU 0 · Rank 0 in this group</text><text x="76" y="411" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Prepare communicator: comm₀</text><text x="76" y="454" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">Request GPU buffer allocation</text><path d="M308,501 V559" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)" stroke-dasharray="7 7"/><text x="328" y="540" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Allocate space</text><rect x="632" y="282" width="520" height="210" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="323" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Process 1 · CPU code</text><text x="660" y="367" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">GPU 1 · Rank 1 in this group</text><text x="660" y="411" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Prepare communicator: comm₁</text><text x="660" y="454" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">Request GPU buffer allocation</text><path d="M892,501 V559" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)" stroke-dasharray="7 7"/><text x="912" y="540" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Allocate space</text><rect x="48" y="576" width="520" height="420" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="620" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0 · Send buffer</text><rect x="632" y="576" width="520" height="420" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="620" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1 · Receive buffer</text><text x="112" y="668" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">x produced by A</text><rect x="112" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="150" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">1</text><rect x="200" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="238" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">2</text><rect x="288" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="326" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">3</text><rect x="376" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="414" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">4</text><text x="672" y="668" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start">Before receive: space only</text><rect x="672" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><rect x="760" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><rect x="848" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><rect x="936" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="112" y="825" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Original stays after transfer</text><rect x="112" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="150" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">1</text><rect x="200" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="238" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">2</text><rect x="288" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="326" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">3</text><rect x="376" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="414" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">4</text><text x="672" y="825" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">Receive complete: x arrives</text><rect x="672" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="710" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">1</text><rect x="760" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="798" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">2</text><rect x="848" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="886" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">3</text><rect x="936" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="974" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">4</text><path d="M458,749 H596 V876 H664" fill="none" stroke="#4C60A8" stroke-width="2.5" marker-end="url(#arrow-indigo)"/><text x="892" y="956" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">Input ready for B to read</text><rect x="48" y="1032" width="1104" height="102" rx="12" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1073" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">Send to rank 1  ·  Receive from rank 0</text><text x="600" y="1110" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Both sides match: 4 elements · float32</text></g></g><path d="M48,1176 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1214" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Dashed lines request buffer space; solid lines show logical data transfer. GPU 0 keeps its original after</text><text x="48" y="1243.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">sending.</text></svg>