ke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="714" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="753.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">−1</text><text x="831.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">5</text><rect x="792" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="792" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="792" y="438" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="475" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="792" y="494" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="831.0" y="531" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">2</text><path d="M831.0,566 L831.0,622" fill="none" stroke="#8191A0" stroke-width="1.7" marker-end="url(#arrow-arrow)"/><rect x="792" y="638" width="78" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="831.0" y="675" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">3</text><text x="909.0" y="308" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">6</text><rect x="870" y="326" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="909.0" y="363" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">0</text><rect x="870" y="382" width="78" height="56" rx="0" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1"/><text x="909.0" y="419" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">1</text><rect x="870" 