<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2576" viewBox="0 0 360 2576" role="img" aria-labelledby="title desc"><title id="title">Choose a transfer path for the deployment</title><desc id="desc">Broadcast distributes via NCCL then loads target shards. P2P stages weights through a CPU model and pinned host buffers before RDMA writes into registered target GPU weight memory. Disk-delta publishes byte changes against a matching checkpoint base, patches a local checkpoint and reloads it to GPUs.</desc><metadata>{&quot;id&quot;:&quot;15-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SGLang receiver, Miles v0.1.0 release pin&quot;,&quot;url&quot;:&quot;https://github.com/sgl-project/sglang/blob/cb05a44f35a7c9e27e46d74112cc841ca674ef43/python/sglang/srt/model_loader/remote_instance_weight_loader_utils.py&quot;},{&quot;label&quot;:&quot;Miles P2P v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/docs/advanced/p2p-weight-transfer.md&quot;},{&quot;label&quot;:&quot;Miles disk-delta v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/blob/v0.1.0/miles/backends/megatron_utils/update_weight/update_weight_from_distributed/delta.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Choose a transfer path</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">for the deployment</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Three simplified paths in Miles v0.1.0.</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Arrows show movement between memory</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">and storage; their length and width do</text><text x="16" y="205" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">not encode speed.</text><path d="M16,225 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 249) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Three weight-transfer routes</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g transform="translate(0 104)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Broadcast</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">Default on a shared GPU fabric</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Training GPUs</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">The same new weights</text></g><path d="M260 217 L260 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="488" height="164" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="297" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Prepare tensors to send</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Gather and convert; distribute from source</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">ranks</text></g><g data-container="true"><rect x="16" y="492" width="488" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">NCCL broadcast</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Collective communication group</text></g><g data-container="true"><rect x="16" y="681" width="488" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Load on each target</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Apply the shard needed by each inference</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">rank</text></g><path d="M260 443 L260 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 632 L260 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 855 L260 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Inference GPUs</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Consistent new weights</text></g></g></g><g transform="translate(0 1284)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">P2P</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">Parallel senders across nodes</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Training GPUs</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">The same new weights</text></g><path d="M260 217 L260 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="488" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Sender CPU memory</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">CPU model layout conversion → pinned host</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">buffer</text></g><g data-container="true"><rect x="16" y="492" width="488" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">RDMA write</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Required shards per target rank</text></g><g data-container="true"><rect x="16" y="681" width="488" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Registered GPU addresses</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Write directly into target weights</text></g><path d="M260 443 L260 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 632 L260 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 855 L260 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Inference GPUs</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Consistent new weights</text></g></g></g><g transform="translate(0 2464)"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Disk-delta</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="101" fill="#287D78" font-size="21" font-weight="600" text-anchor="start" data-max-width="488">Shared storage without a direct fabric</text><g transform="translate(0 65)"><g data-container="true"><rect x="16" y="103" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Training GPUs</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">The same new weights</text></g><path d="M260 217 L260 250" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="266" width="488" height="164" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="297" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Previous CPU snapshot</text><text x="32" y="337" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Encode byte changes against the same base</text></g><g data-container="true"><rect x="16" y="492" width="488" height="127" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="523" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Shared filesystem</text><text x="32" y="563" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">base b → delta b+1</text></g><g data-container="true"><rect x="16" y="681" width="488" height="161" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="712" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Patch a local checkpoint</text><text x="32" y="752" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Check base, version and checksum → reload to</text><text x="32" y="780" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">GPU</text></g><path d="M260 443 L260 476" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 632 L260 665" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 855 L260 889" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="906" width="488" height="101" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="937" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Inference GPUs</text><text x="32" y="977" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Consistent new weights</text></g></g></g></g></svg>