<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1406" viewBox="0 0 1200 1406" role="img" aria-labelledby="title desc"><title id="title">압축 entry 만들기</title><desc id="desc">압축 entry 하나는 블록 안 토큰 4개의 후보 C를 채널마다 가중합한 것이다. 점수 Z에 위치 편향 B를 더해 토큰 방향으로 softmax한 S가 비중이 되고, C와 곱해 토큰 방향으로 합친 한 행에 RMSNorm과 RoPE를 적용하면 entry가 된다. 최근 토큰의 KV는 별도 가중치로 압축 없이 만든다.</desc><metadata>{&quot;id&quot;:&quot;hca-flow-02-compression&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 report · §2.3.2 (HCA)&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro&quot;},{&quot;label&quot;:&quot;DeepSeek-V4-Pro inference code · Attention, Compressor&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/blob/main/inference/model.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="