<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1115" viewBox="0 0 1200 1115" role="img" aria-labelledby="title desc"><title id="title">Rebuild KV from retained tokens</title><desc id="desc">B retains prompt p0 through p6 and outputs x0 and x1 while paused. Its original eight KV positions cover through x0, not x1. After releasing KV and obtaining space again, nine known tokens enter the model. Eight KV positions are rebuilt, x1’s KV is computed for the first time, and only new x2 is selected and delivered.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1115" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Rebuild KV from retained tokens</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Use the unchanged history as input to rebuild the state needed for generation.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Request B · 7 prompt tokens + delivered outputs x0 and x1</text><rect x="48" y="242" width="340" height="772" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="66" y="281.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">1. Before preemption</text><text x="66" y="337.0" fill="#526577" font-size="22" font-weight="700" text-anchor="start">Retained token history</text><rect x="77" y="361" width="27" height="42" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="90.5" y="389.0" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">p0</text><rect x="108" y="361" width="27" heig