<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1466" viewBox="0 0 1200 1466" role="img" aria-labelledby="title desc"><title id="title">Balance partitioning and replication on the same GPUs</title><desc id="desc">Four GPUs form either two TP2 replicas or one TP4 replica. The first assigns A/B and C/D to separate groups; the second sends A/B/C/D to one group, which can batch requests. Compare memory headroom, latency, throughput, and within-group communication.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1466" fill="white"/><text x="48" y="60.0" font-size="32" fill="#182c40" font-weight="700" text-anchor="start">Balance partitioning and replication on the same GPUs</text><text x="48" y="111.0" font-size="23" fill="#526577" font-weight="400" text-anchor="start">Both arrangements use four GPUs and the same requests.</text><path d="M48,158 H1152" stroke="#d5dfe8"/><text x="48" y="145.0" font-size="20" fill="#526577" font-weight="400" text-anchor="start">↔ : communication within a group</text><rect x="48" y="204" width="1104" height="466" rx="12" fill="#fbfcfd" stroke="#d5dfe8" stroke-width="2"/><text x="76" y="248.0" font-size="29" fill="#182c40" font-weight="700" text-anchor="start">TP 2 × DP 2</text><text x="1124" y="248.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="end">Two model replicas</text><text x="600" y="300.0" font-size="23" fill="#526577" font-weight="400" text-anchor="middle">The same requests A · B · C · D</text><rect x="76" y="330" width="498" height="240" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><rect x="259.0" y="348" width="132" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="325" y="377.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">A · B</text><rect x="100" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="201.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="116.0" y="485" width="85.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="158.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="201.0" y="485" width="85.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="243.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="348" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="449.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="364.0" y="485" width="85.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="406.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="449.0" y="485" width="85.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="491.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><path d="M325,399 L325,410 L201,410 L201,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M325,410 L449,410 L449,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M309,516 L341,516" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="626" y="330" width="498" height="240" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><rect x="809.0" y="348" width="132" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="875" y="377.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">C · D</text><rect x="650" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="751.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="666.0" y="485" width="85.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="708.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="751.0" y="485" width="85.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="793.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="898" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="999.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="914.0" y="485" width="85.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="956.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="999.0" y="485" width="85.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="1041.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><path d="M875,399 L875,410 L751,410 L751,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875,410 L999,410 L999,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M859,516 L891,516" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="600" y="613.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">Two groups handle different requests</text><text x="600" y="651.0" font-size="22" fill="#526577" font-weight="400" text-anchor="middle">Requests are assigned to independently running groups</text><rect x="48" y="702" width="1104" height="466" rx="12" fill="#fbfcfd" stroke="#d5dfe8" stroke-width="2"/><text x="76" y="746.0" font-size="29" fill="#182c40" font-weight="700" text-anchor="start">TP 4 × DP 1</text><text x="1124" y="746.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="end">One model replica</text><text x="600" y="798.0" font-size="23" fill="#526577" font-weight="400" text-anchor="middle">The same requests A · B · C · D</text><rect x="76" y="828" width="1048" height="240" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><rect x="471.0" y="846" width="258" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="600" y="875.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">A · B · C · D</text><path d="M600,897 L600,908 L210,908 L210,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600,908 L470,908 L470,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600,908 L730,908 L730,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600,908 L990,908 L990,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="210.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="168.0" y="983" width="84.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="210.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="370" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="470.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="428.0" y="983" width="84.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="470.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="630" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="730.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="688.0" y="983" width="84.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="730.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="890" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="990.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="948.0" y="983" width="84.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="990.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><path d="M317,1014 L363,1014" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><path d="M577,1014 L623,1014" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><path d="M837,1014 L883,1014" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="600" y="1111.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">All four GPUs cooperate on the requests in one group</text><text x="600" y="1149.0" font-size="22" fill="#526577" font-weight="400" text-anchor="middle">One group can also batch multiple requests</text><text x="600" y="1241.0" font-size="27" fill="#182c40" font-weight="700" text-anchor="middle">Compare both feasible candidates</text><rect x="48" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="180" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">Memory headroom</text><rect x="328" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="460" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">Request latency</text><rect x="608" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="740" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">Total throughput</text><rect x="888" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="1020" y="1309.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">Within-group</text><text x="1020" y="1339.8" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">communication</text><text x="600" y="1420.0" font-size="23" fill="#526577" font-weight="400" text-anchor="middle">Adjust GPUs per model together with the number of independent replicas.</text></svg>