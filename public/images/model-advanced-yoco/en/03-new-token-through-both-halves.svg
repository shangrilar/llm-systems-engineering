<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2257" viewBox="0 0 1200 2257" role="img" aria-labelledby="title desc"><title id="title">A new token still passes through the memory-producing layers</title><desc id="desc">x4 passes through self-decoder 1 and 2, reading and updating distinct S1 and S2. Output m4 produces k4,v4, appended as orange p4 while the four older rows remain. Cross-decoder 3 and 4 read those five rows with q3 and q4; the LM head selects x5.</desc><metadata>{&quot;id&quot;:&quot;yoco-03&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;YOCO §2 and §3.1, recurrent state and global KV&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.05254v1#S2&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report §2.2–2.3&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 