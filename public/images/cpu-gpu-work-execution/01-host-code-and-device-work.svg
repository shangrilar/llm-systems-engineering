<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1058" viewBox="0 0 1200 1058" role="img" aria-labelledby="title desc"><title id="title">이 코드는 어디에서 실행될까?</title><desc id="desc">CPU 코드가 GPU 버퍼 확보, 입력 복사, 커널 A와 B 실행, 결과 복사를 요청한다. GPU 커널 A는 입력에 1을 더하고 B는 중간값을 두 배로 만든다. 입력 [1,2,3,4]가 GPU로 복사되고 x, u, y를 거쳐 결과 [4,6,8,10]이 CPU로 돌아온다. 중간값 u는 GPU에 남는다. 점선은 실행 요청, 실선은 데이터 이동이다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1058" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">하드웨어 5 · 그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">이 코드는 어디에서 실행될까?</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">CPU의 호출 코드와 GPU의 커널 본문을 연결합니다.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="210" width="510" height="424" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><rect x="612" y="210" width="540" height="424" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="251" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">CPU에서 실행하는 호출 코드</text><text x="640" y="251" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU에서 실행하는 커널 본문</text><text x="76" y="297" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMalloc(...)</text><text x="76" y="325" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU의 x·u·y 버퍼 확보</text><text x="76" y="366" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMemcpy(...)</text><text x="76" y="394" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">CPU의 입력을 GPU로 복사</text><text x="76" y="590" fill="#182C40" font-size="23" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">cudaMemcpy(...)</text><text x="76" y="618" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU의 결과를 CPU로 복사</text><text x="76" y="445" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace">A&lt;&lt;&lt;...&gt;&gt;&gt;(d_x, d_u);</text><text x="76" y="521" fill="#287D78" font-size="23" font-weight="600" text-anchor="start" font-family="Menlo,Consolas,monospace">B&lt;&lt;&lt;...&gt;&gt;&gt;(d_u, d_y);</text><rect x="640" y="398" width="484" height="70" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="425" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">계산 A</text><text x="662" y="453" fill="#2470BB" font-size="24" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">u[i] = x[i] + 1;</text><rect x="640" y="474" width="484" height="70" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="501" fill="#287D78" font-size="21" font-weight="600" text-anchor="start">계산 B</text><text x="662" y="529" fill="#287D78" font-size="24" font-weight="400" text-anchor="start" font-family="Menlo,Consolas,monospace">y[i] = 2 * u[i];</text><path d="M544,437 H631" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" stroke-dasharray="7 7"/><path d="M544,513 H631" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" stroke-dasharray="7 7"/><text x="640" y="310" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">공간 확보와 복사는 CPU에서 요청</text><text x="640" y="347" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">커널의 계산은 GPU 스레드가 수행</text><path d="M646,588 H704" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7"/><text x="719" y="596" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">점선: 커널 실행 요청</text><text x="48" y="698" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">데이터가 놓이는 곳과 이동 경로</text><rect x="48" y="736" width="226" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="161.0" y="776" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">CPU 메모리</text><rect x="343" y="736" width="514" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="600.0" y="776" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">GPU 메모리</text><rect x="926" y="736" width="226" height="160" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="1039.0" y="776" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">CPU 메모리</text><text x="161" y="829" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">입력 x</text><text x="161" y="865" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">[1, 2, 3, 4]</text><rect x="364" y="806" width="112" height="62" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="420.0" y="846.0" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">x</text><rect x="544" y="806" width="112" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="600.0" y="846.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">u</text><rect x="724" y="806" width="112" height="62" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="780.0" y="846.0" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">y</text><path d="M278,837 H355" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><path d="M860,837 H918" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><path d="M482,837 H535" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><text x="507" y="793" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">A</text><path d="M662,837 H715" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><text x="688" y="793" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">B</text><text x="1039" y="829" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">결과 y</text><text x="1039" y="865" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">[4, 6, 8, 10]</text><rect x="48" y="938" width="1104" height="82" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="983" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">중간값 u는 GPU에 남아 다음 계산 B의 입력이 됩니다.</text></svg>