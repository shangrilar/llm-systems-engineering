<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1454" viewBox="0 0 1200 1454" role="img" aria-labelledby="title desc"><title id="title">From the Result of A to Computation B</title><desc id="desc">The top shows CPU submission order, not a timeline. Process 0 submits A and send in GPU 0 stream S0; process 1 submits receive and B in GPU 1 stream S1. Below, GPU 1 receive starts early and waits until A produces x. Send and receive then transfer the data, and B starts after receive completion. CPU return does not guarantee GPU completion. Each GPU stream and matching NCCL operations connect the execution order.</desc><metadata>{&quot;id&quot;:&quot;02-send-receive-execution&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">From the Result of A to Computation B</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Distinguish CPU submission order from actual work on the two GPUs.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><text x="48" y="228" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU: Each process submits work to its GPU</text><text x="48" y="268" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Submission order above; the two CPU calls need not happen at the same time.</text><rect x="48" y="298" width="1104" height="270" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="356" fill="#182C40" font-size="26" font-weight="600" text-anchor="start">Process 0</text><text x="76" y="392" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">GPU 0 · S₀</text><text x="76" y="490" fill="#182C40" font-size="26" font-weight="600" text-anchor="start">Process 1</text><text x="76" y="526" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">GPU 1 · S₁</text><rect x="292" y="318" width="324" height="94" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="454" y="374" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Submit A</text><path d="M626,365 H662" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="674" y="318" width="430" height="94" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="889" y="359" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Submit send</text><text x="889" y="394" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">ncclSend(...)</text><rect x="292" y="452" width="324" height="94" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="454" y="493" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Submit receive</text><text x="454" y="528" fill="#4C60A8" font-size="25" font-weight="400" text-anchor="middle">ncclRecv(...)</text><path d="M626,499 H662" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="674" y="452" width="430" height="94" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="889" y="508" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Submit B</text><text x="600" y="615" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">A returned call does not mean the GPU receive or computation has finished.</text><text x="48" y="697" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU: Connect stream order with send and receive</text><path d="M250,747 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><text x="1148" y="732" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="838" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0</text><text x="48" y="875" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Stream S₀</text><rect x="250" y="803" width="320" height="88" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="410" y="856" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Compute A</text><rect x="570" y="803" width="305" height="88" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="722.5" y="856" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">Send</text><text x="570" y="784" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">A completes</text><text x="875" y="784" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="middle">Send completes</text><path d="M600,902 V965" fill="none" stroke="#4C60A8" stroke-width="2.5" marker-end="url(#arrow-indigo)"/><text x="632" y="942" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">Data transfer via NCCL</text><text x="48" y="1025" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="1062" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Stream S₁</text><rect x="250" y="985" width="320" height="88" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="410" y="1038" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">Wait in receive</text><rect x="570" y="985" width="305" height="88" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="722.5" y="1038" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Receive data</text><rect x="875" y="985" width="255" height="88" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1002.5" y="1038" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Compute B</text><path d="M250,1086 v10 H875 v-10" fill="none" stroke="#4C60A8" stroke-width="2"/><text x="562.5" y="1132" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="middle">One receive operation</text><path d="M875,1084 V1145" fill="none" stroke="#4C60A8" stroke-width="2" stroke-dasharray="7 7"/><text x="888" y="1168" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="start">Receive completes</text><text x="1130" y="1125" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">B completes</text><rect x="48" y="1190" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1235" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">GPU 0 order → NCCL send/receive → GPU 1 order</text><text x="600" y="1274" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">B executes after the receive completes.</text></g></g><path d="M48,1346 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1384" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The lower timeline shows GPU 1’s receive starting first. The send and receive take part in the same data</text><text x="48" y="1413.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">transfer.</text></svg>