<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="919" viewBox="0 0 1200 919" role="img" aria-labelledby="title desc"><title id="title">Evaluate latency and throughput together</title><desc id="desc">Distinguish queueing from execution and compare memory, latency distributions, and throughput under matching conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="919" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Evaluate latency and throughput together</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">There is no single best parallelization for every workload.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="216" width="510" height="212" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="252.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Completion of one request</text><text x="66" y="302.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Arrival → queue → execution →</text><text x="66" y="334.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">completion</text><text x="66" y="366.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">The user experiences queueing too.</text><rect x="642" y="216" width="510" height="212" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="252.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Throughput across requests</text><text x="660" y="302.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Work completed per unit time</text><text x="660" y="334.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Compare matching input/output</text><text x="660" y="366.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">conditions.</text><path d="M303,443 L303,495" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,443 L897,495" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="513" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="549.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Check end-to-end completion for feasible deployments</text><text x="72" y="589.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Less computation ↔ repeated communication, waiting, and replica count</text><rect x="48" y="665" width="546" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="702.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Measurement conditions</text><rect x="600" y="665" width="546" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="614" y="702.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Record together</text><rect x="48" y="731" width="546" height="144" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="765.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Same model, precision, lengths, and</text><text x="62" y="795.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">arrival pattern</text><rect x="600" y="731" width="546" height="144" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="614" y="765.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Peak memory, latency distribution,</text><text x="614" y="795.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">throughput, communication and waiting</text></svg>