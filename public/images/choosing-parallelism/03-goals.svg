<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="919" viewBox="0 0 1200 919" role="img" aria-labelledby="title desc"><title id="title">응답 시간과 처리량을 함께 판단하기</title><desc id="desc">요청의 대기와 실행 시간을 구별하고 메모리, 응답 시간 분포, 처리량을 같은 조건에서 측정합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="919" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">응답 시간과 처리량을 함께 판단하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">모든 경우에 가장 좋은 병렬화 하나가 정해져 있지는 않습니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="216" width="510" height="212" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="252.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">한 요청의 완료</text><text x="66" y="302.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">도착 → 대기 → 실행 → 완료</text><text x="66" y="334.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">사용자는 대기 시간도 경험합니다.</text><rect x="642" y="216" width="510" height="212" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="660" y="252.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">여러 요청의 처리량</text><text x="660" y="302.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 시간에 완료한 작업량</text><text x="660" y="334.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 입력·출력 조건으로 비교합니다.</text><path d="M303,443 L303,495" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M897,443 L897,495" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="513" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="549.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">목표를 만족하는 배치에서 전체 완료를 확인</text><text x="72" y="589.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">계산 감소 ↔ 반복 통신 · 대기 · 동시에 처리할 복제본 수</text><rect x="48" y="665" width="546" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="702.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">측정 조건</text><rect x="600" y="665" width="546" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="614" y="702.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">함께 기록할 항목</text><rect x="48" y="731" width="546" height="144" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="765.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">같은 모델·정밀도·입력/출력 길이·요청 도착</text><text x="62" y="795.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">패턴</text><rect x="600" y="731" width="546" height="144" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="614" y="765.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">메모리 최고 사용량·응답 시간</text><text x="614" y="795.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">분포·처리량·통신과 대기</text></svg>