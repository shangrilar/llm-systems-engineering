<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="982" viewBox="0 0 1200 982" role="img" aria-labelledby="title desc"><title id="title">Rebuild the batch between executions</title><desc id="desc">A completes and B continues. A’s exclusively owned GPU KV is released while B’s KV is retained. New requests C and D have no GPU KV and are considered in arrival order. C fits the available resources. With at most two requests per execution, the next batch is B Decode and C Prefill while D waits. The returning arrow feeds execution results into the next decision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="982" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Rebuild the batch between executions</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Distinguish the queue, admitted request state, and the next batch.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><defs><marker id="batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#526577" stroke-width="1.7"/></marker></defs><text x="48" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">1. Execution results</text><rect x="48" y="249" width="352" height="552" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="424" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">2. Update and check</text><rect x="424" y="249" width="352" height="552" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">3. Execute next batch</text><rect x="800" y="249" width="352" height="552" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="294.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Admitted requests</text><rect x="72" y="314" width="304" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="224.0" y="348.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · complete ✓</text><rect x="72" y="380" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="224.0" y="414.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · continue</text><text x="72" y="481.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">KV stored on the GPU</text><rect x="72" y="502" width="144" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="144.0" y="536.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A KV</text><rect x="232" y="502" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="304.0" y="536.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><path d="M72,590 H376" stroke="#DCE4EC"/><text x="72" y="630.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Queue · arrival order</text><rect x="72" y="651" width="144" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="144.0" y="685.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C</text><rect x="232" y="651" width="144" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="304.0" y="685.16" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">D</text><text x="224" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">C and D have no GPU KV</text><text x="448" y="294.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Remove A; retain B</text><rect x="448" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600.0" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · continue</text><text x="448" y="413.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">Release A’s KV allocation</text><rect x="448" y="437" width="144" height="52" rx="8" fill="white" stroke="#2470BB" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520" y="471.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Freed</text><rect x="608" y="437" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="680.0" y="471.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><rect x="448" y="537" width="304" height="218" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="577.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">Check C first</text><text x="472" y="632.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ Step token budget</text><text x="472" y="674.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ Required KV space</text><text x="600" y="723.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">Both fit in this example</text><text x="824" y="294.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Work selected now</text><rect x="824" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="976.0" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · Decode</text><rect x="824" y="380" width="304" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="976.0" y="414.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · Prefill</text><path d="M976,443 L976,474" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="824" y="489" width="304" height="91" rx="10" fill="#E8EDF4" stroke="#526577" stroke-width="1.5"/><text x="976" y="544.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">GPU execution</text><path d="M824,617 H1128" stroke="#DCE4EC"/><text x="824" y="657.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Waiting queue</text><rect x="824" y="679" width="304" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="976.0" y="712.82" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">D · still waiting</text><text x="976" y="774.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">At most 2 requests at once</text><path d="M403,340 L419,340" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><path d="M779,340 L795,340" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><path d="M1132,535 H1175 V872 H24 V340 H43" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><text x="600" y="847.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Use the execution results to build the next batch again</text><text x="48" y="932.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">A new request can join without a completion if sufficient resources are available.</text></svg>