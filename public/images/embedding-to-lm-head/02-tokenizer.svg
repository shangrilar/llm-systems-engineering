<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" role="img" aria-labelledby="title desc">
<title id="title">텍스트를 토큰 ID로</title><desc id="desc">Hello world!를 Qwen3 토크나이저로 변환한 실제 결과. Hello는 9707, 앞에 공백이 있는 world는 1879, 느낌표는 0이다. 토큰 ID는 임베딩 층의 입력이 된다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:"Arial","Apple SD Gothic Neo","Noto Sans KR",sans-serif;} path,line{stroke-linecap:round;stroke-linejoin:round;}</style>
<rect width="1200" height="830" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" >그림 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" >텍스트를 토큰 ID로</text>
<text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" >텍스트를 토큰 조각으로 나누고, 각 조각에 대응하는 정수 ID를 가져옵니다.</text>
<line x1="48" y1="169" x2="1152" y2="169" stroke="#DCE4EC" stroke-width="2"/>
<text x="80" y="244" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="start" >입력 텍스트</text><rect x="80" y="268" width="340" height="92" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="250" y="324" fill="#182C40" font-size="34" font-weight="500" text-anchor="middle" >Hello world!</text><path d="M440,314 L504,314" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="528" y="268" width="300" height="92" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="678.0" y="314.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle" >Tokenizer</text><text x="678.0" y="345.0" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle" >Qwen3</text><text x="80" y="495" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" >토큰 조각</text><text x="80" y="627" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="start" >토큰 ID</text><line x1="678" y1="370" x2="678" y2="388" stroke="#8191A0" stroke-width="2.5"/><line x1="440" y1="388" x2="1000" y2="388" stroke="#8191A0" stroke-width="2.5"/><path d="M440,388 L440,438" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720,388 L720,438" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M1000,388 L1000,438" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="450" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="440" y="495" fill="#182C40" font-size="31" font-weight="500" text-anchor="middle" >Hello</text><path d="M440,532 L440,569" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="330" y="582" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="440" y="627" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle" >9707</text><rect x="610" y="450" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="720" y="495" fill="#182C40" font-size="31" font-weight="500" text-anchor="middle" >␣world</text><path d="M720,532 L720,569" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="610" y="582" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="720" y="627" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle" >1879</text><rect x="890" y="450" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1000" y="495" fill="#182C40" font-size="31" font-weight="500" text-anchor="middle" >!</text><path d="M1000,532 L1000,569" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="890" y="582" width="220" height="70" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1000" y="627" fill="#182C40" font-size="30" font-weight="600" text-anchor="middle" >0</text><text x="678" y="700" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle" >토큰마다 고유한 ID가 대응합니다.</text>
<line x1="48" y1="750" x2="1152" y2="750" stroke="#DCE4EC" stroke-width="2"/>
<text x="48" y="791" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" >Qwen3 실제 예시 · ␣는 공백을 보이게 쓴 기호입니다. 특수 토큰은 추가하지 않았습니다.</text>
</svg>