he same output row</text><text x="76" y="773" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">c00 = A row 0 · B column 0</text><text x="76" y="815" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">c01 = A row 0 · B column 1</text><text x="316" y="878" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">Reuse the same row of A</text><rect x="616" y="676" width="536" height="235" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="644" y="723" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">Computing the same output column</text><text x="644" y="773" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">c00 = A row 0 · B column 0</text><text x="644" y="815" fill="#182C40" font-size="25" font-weight="400" text-anchor="start">c10 = A row 1 · B column 0</text><text x="884" y="878" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">Reuse the same column of B</text><text x="600" y="973" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">Compute outputs together to reuse their common inputs.</text></svg>