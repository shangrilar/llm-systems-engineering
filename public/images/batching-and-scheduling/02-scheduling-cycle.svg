<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="982" viewBox="0 0 1200 982" role="img" aria-labelledby="title desc"><title id="title">실행 사이에 다음 배치를 다시 구성하기</title><desc id="desc">실행 결과 A가 완료되고 B는 계속 생성한다. A가 독점 소유한 GPU KV를 반환하고 B의 KV는 유지한다. GPU KV가 없는 새 요청 C·D를 도착 순서대로 검토해 자원이 충분한 C를 합류시킨다. 최대 두 요청을 실행하는 예시에서 다음 배치는 B의 Decode와 C의 Prefill이며 D는 기다린다. 실행 결과를 다시 반영하는 화살표가 반복을 나타낸다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="982" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">실행 사이에 다음 배치를 다시 구성하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">대기 큐, 진행 중인 요청의 상태, 실제로 실행할 배치는 서로 구별합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><defs><marker id="batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#526577" stroke-width="1.7"/></marker></defs><text x="48" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">1. 실행 결과</text><rect x="48" y="249" width="352" height="552" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="424" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">2. 상태 갱신과 자원 확인</text><rect x="424" y="249" width="352" height="552" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">3. 다음 배치 실행</text><rect x="800" y="249" width="352" height="552" rx="10" fill="#FAFBFD" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="294.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">진행 중인 요청</text><rect x="72" y="314" width="304" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="224.0" y="348.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · 완료 ✓</text><rect x="72" y="380" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="224.0" y="414.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 계속 생성</text><text x="72" y="481.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU에 보관 중인 KV</text><rect x="72" y="502" width="144" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="144.0" y="536.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A KV</text><rect x="232" y="502" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="304.0" y="536.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><path d="M72,590 H376" stroke="#DCE4EC"/><text x="72" y="630.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">대기 큐 · 도착 순서</text><rect x="72" y="651" width="144" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="144.0" y="685.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C</text><rect x="232" y="651" width="144" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="304.0" y="685.16" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">D</text><text x="224" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">C·D는 GPU KV 없음</text><text x="448" y="294.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">A 제거, B 유지</text><rect x="448" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600.0" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · 계속 생성</text><text x="448" y="413.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">A의 KV 공간 반환</text><rect x="448" y="437" width="144" height="52" rx="8" fill="white" stroke="#2470BB" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520" y="471.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">반환됨</text><rect x="608" y="437" width="144" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="680.0" y="471.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B KV</text><rect x="448" y="537" width="304" height="218" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="600" y="577.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">C부터 합류 검토</text><text x="472" y="632.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ 실행 토큰 예산</text><text x="472" y="674.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">✓ 필요한 KV 공간</text><text x="600" y="723.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">이 예시에서는 충분</text><text x="824" y="294.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">이번에 선택한 작업</text><rect x="824" y="314" width="304" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="976.0" y="348.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · Decode</text><rect x="824" y="380" width="304" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="976.0" y="414.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · Prefill</text><path d="M976,443 L976,474" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><rect x="824" y="489" width="304" height="91" rx="10" fill="#E8EDF4" stroke="#526577" stroke-width="1.5"/><text x="976" y="544.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">GPU 실행</text><path d="M824,617 H1128" stroke="#DCE4EC"/><text x="824" y="657.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">대기 큐</text><rect x="824" y="679" width="304" height="52" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="976.0" y="712.82" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">D · 다음 기회 대기</text><text x="976" y="774.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">동시에 최대 2개 요청</text><path d="M403,340 L419,340" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><path d="M779,340 L795,340" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><path d="M1132,535 H1175 V872 H24 V340 H43" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#batch-arrow)"/><text x="600" y="847.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">실행 결과를 반영하고, 다음 배치를 다시 구성</text><text x="48" y="932.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">완료된 요청이 없어도, 자원이 충분하면 새 요청을 추가할 수 있습니다.</text></svg>