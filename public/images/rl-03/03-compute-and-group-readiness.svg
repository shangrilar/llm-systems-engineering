<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1167" viewBox="0 0 1200 1167" role="img" aria-labelledby="title desc"><title id="title">어떤 응답의 완료를 기다려야 할까?</title><desc id="desc">그룹 방식에서는 같은 P의 세 응답이 완료되어도 네 번째 응답의 보상을 기다려야 그룹 기준을 구한다. Single-rollout에서는 서로 다른 P₁,P₂,P₃의 완료 경험을 버퍼에 모으고 P₄는 계속 실행한다. 배치 구성과 업데이트는 뒤의 별도 단계이다.</desc><metadata>{&quot;id&quot;:&quot;3-3&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;SAO §3.2&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2607.07508v1#S3.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">어떤 응답의 완료를 기다려야 할까?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 시점의 완료 상태를 놓고, 그룹 비교에 필요한 결과와 개별 rollout 수집을 비교합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">그룹 비교: 같은 P의 응답 4개</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="113" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">같은 프롬프트 P</text><rect x="16" y="150" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="182" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">응답 1</text><path d="M188 175 L218 175" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="150" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="182" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">완료 · 보상 있음</text><path d="M496 175 L514 175" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="227" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="259" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">응답 2</text><path d="M188 252 L218 252" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="227" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="259" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">완료 · 보상 있음</text><path d="M496 252 L514 252" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="304" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="336" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">응답 3</text><path d="M188 329 L218 329" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="304" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="336" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">완료 · 보상 있음</text><path d="M496 329 L514 329" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="381" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">응답 4</text><path d="M188 406 L218 406" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="230" y="381" width="266" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="363" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">실행 중 · 보상 없음</text><path d="M514 175 V445 H260 V472" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="486" width="488" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="517" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">그룹 기준 계산 대기</text><text x="32" y="557" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">응답 4의 보상도 필요</text></g><path d="M260 623 L260 662" stroke="#657789" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/><g data-container="true"><rect x="16" y="676" width="488" height="106" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="707" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">그룹이 준비된 뒤 배치 구성·학습</text><text x="32" y="747" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">다른 그룹은 계속 처리할 수 있음</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Single-rollout: 질문마다 응답 1개</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="113" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">서로 다른 프롬프트 P₁…P₄</text><rect x="16" y="150" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="182" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₁</text><path d="M188 175 L218 175" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="150" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="182" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">완료 · 보상 있음</text><path d="M496 175 L514 175" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="227" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="259" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₂</text><path d="M188 252 L218 252" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="227" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="259" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">완료 · 보상 있음</text><path d="M496 252 L514 252" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="304" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="336" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₃</text><path d="M188 329 L218 329" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="230" y="304" width="266" height="48" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="363" y="336" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">완료 · 보상 있음</text><path d="M496 329 L514 329" stroke="#287D78" stroke-width="1.5" fill="none"/><rect x="16" y="381" width="162" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="97" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="150">P₄</text><path d="M188 406 L218 406" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="230" y="381" width="266" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="363" y="413" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="254">실행 중 · 보상 없음</text><path d="M514 175 V445 H260 V472" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="486" width="488" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="517" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">준비 버퍼: 완료 경험 3개</text><text x="32" y="557" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">P₄의 완료를 함께 기다릴 필요 없음</text></g><path d="M260 623 L260 662" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="676" width="488" height="106" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="707" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">배치 구성 → A 계산 → 업데이트</text><text x="32" y="747" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">채점·가치 계산 등도 충족해야 함</text></g></g><path d="M48,1059.3846153846152 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1097.3846153846152" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">설명용 상태이며 속도 측정이 아닙니다. 두 방식 모두 끝난 생성 슬롯은 재사용할 수 있습니다. 준비 버퍼에 들어갔다고</text><text x="48" y="1126.7846153846153" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">즉시 가중치를 갱신하는 것은 아닙니다.</text></svg>