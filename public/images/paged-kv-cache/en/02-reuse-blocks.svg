<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1015" viewBox="0 0 1200 1015" role="img" aria-labelledby="title desc"><title id="title">Free completed requests’ blocks and reallocate them</title><desc id="desc">A’s completion frees P0,P3,P5, then C receives P0,P5. B retains P1 throughout.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1015" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Free completed requests’ blocks and reallocate them</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Three snapshots of the same physical block pool P0–P5.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">A running · A owns P0/P3/P5; B owns P1</text><rect x="48" y="239" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="64" y="271.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P0</text><text x="64" y="311.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L1</text><rect x="232" y="239" width="168" height="97" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="248" y="271.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P1</text><text x="248" y="311.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B · L0</text><rect x="416" y="239" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="432" y="271.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P2</text><text x="432" y="311.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="600" y="239" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="616" y="271.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P3</text><text x="616" y="311.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L0</text><rect x="784" y="239" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="271.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P4</text><text x="800" y="311.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="968" y="239" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="984" y="271.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P5</text><text x="984" y="311.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L2</text><path d="M600,357 L600,403" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="446.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">A completes → return A’s three blocks to the free pool</text><rect x="48" y="480" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="64" y="512.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P0</text><text x="64" y="552.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="232" y="480" width="168" height="97" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="248" y="512.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P1</text><text x="248" y="552.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B · L0</text><rect x="416" y="480" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="432" y="512.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P2</text><text x="432" y="552.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="600" y="480" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="616" y="512.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P3</text><text x="616" y="552.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="784" y="480" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="512.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P4</text><text x="800" y="552.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="968" y="480" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="984" y="512.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P5</text><text x="984" y="552.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><path d="M600,595 L600,641" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="683.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">C prefills 6 tokens → allocate P0/P5 and write C’s KV</text><rect x="48" y="717" width="168" height="97" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="64" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P0</text><text x="64" y="789.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">C · L0</text><rect x="232" y="717" width="168" height="97" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="248" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P1</text><text x="248" y="789.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B · L0</text><rect x="416" y="717" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="432" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P2</text><text x="432" y="789.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="600" y="717" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="616" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P3</text><text x="616" y="789.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="784" y="717" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P4</text><text x="800" y="789.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">Free</text><rect x="968" y="717" width="168" height="97" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="984" y="749.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P5</text><text x="984" y="789.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">C · L1</text><g data-panel="true"><rect x="48" y="858" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="893.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Reuse the storage and write the new request’s contents.</text><text x="72" y="935.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">B’s block and mapping remain unchanged. This example has no prefix sharing.</text></g></svg>