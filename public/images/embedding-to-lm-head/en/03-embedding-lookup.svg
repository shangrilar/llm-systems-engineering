<title id="title">Look up a vector for each ID</title><desc id="desc">Input IDs are 9707, 1879, and 0. The table shows rows 0, 1, an ellipsis, 1879, an ellipsis, 9707, an ellipsis, and V−1 in ID order. Only the three selected rows are highlighted. Markers ①, ②, and ③ link each input to its table row and output. Output vectors are stacked in input order: 9707, 1879, 0. The full table is V × d and the output is 3 × d. Vector values are illustrative.</desc>
