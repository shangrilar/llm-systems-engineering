<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="778" viewBox="0 0 1200 778" role="img" aria-labelledby="title desc"><title id="title">PP: partition layers and pass activations</title><desc id="desc">Eight layers are placed two per GPU; an input passes through all four stages in order.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="778" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">PP: partition layers and pass activations</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">For one input, a stage depends on the preceding stage’s result.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="212.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Place consecutive model layers on four stages</text><rect x="48" y="275" width="232" height="253" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="311.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Layers 0 · 1</text><text x="66" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage weights</text><text x="66" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage</text><text x="66" y="457.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">computation</text><path d="M285,396 L323,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="328" y="275" width="232" height="253" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="346" y="311.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="346" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Layers 2 · 3</text><text x="346" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage weights</text><text x="346" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage</text><text x="346" y="457.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">computation</text><path d="M565,396 L603,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="608" y="275" width="232" height="253" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="626" y="311.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="626" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Layers 4 · 5</text><text x="626" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage weights</text><text x="626" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage</text><text x="626" y="457.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">computation</text><path d="M845,396 L883,396" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="888" y="275" width="232" height="253" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="906" y="311.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="906" y="361.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Layers 6 · 7</text><text x="906" y="393.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage weights</text><text x="906" y="425.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Stage</text><text x="906" y="457.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">computation</text><rect x="48" y="623" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="659.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Input → GPU 0 → GPU 1 → GPU 2 → GPU 3 → Output</text><text x="72" y="699.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Each stage sends the activations produced by its final layer.</text></svg>