<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1023" viewBox="0 0 1200 1023" role="img" aria-labelledby="title desc">
<title id="title">All-Gather: collect and share</title><desc id="desc">All-Gather concatenates the four two-element input chunks in rank order, producing the same eight-element output on every GPU.</desc>
