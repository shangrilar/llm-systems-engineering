 font-weight="600" text-anchor="middle">Concat</text><text x="600" y="1547" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">Head results at the same token position → H (3 × 8)</text><path d="M600,1594 L600,1626" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-slate)"/><rect x="175" y="1640" width="850" height="90" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1670" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Output projection</text><text x="600" y="1697" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">Combine head information within each token → Y (3 × 8)</text><text x="600" y="1790" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Core Attention compares tokens and combines their information.</text></g></g><path d="M48,1843 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1881" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Each head computes with 3 × 4 shapes, and RoPE applies only to Q and K. Values are illustrative.</text></svg>