<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1526" viewBox="0 0 1200 1526" role="img" aria-labelledby="title desc"><title id="title">차이를 보정할까, 입력의 기여를 더할까?</title><desc id="desc">왼쪽은 유지한 상태를 Key로 읽어 Value에서 뺀 차이에 beta와Key를 적용한 보정량을 원래 유지한 상태에 더한다. 오른쪽은 입력u를Bbar로 변환한 기여를 유지한 상태에 더한다. 두 경우 모두 새 상태에서 출력을 읽는다.</desc><metadata>{&quot;id&quot;:&quot;mamba-05&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Gated DeltaNet §3.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2412.06464v1#S3.SS1&quot;},{&quot;label&quot;:&quot;Kimi Linear §3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2510.26692v1#S3&quot;},{&quot;label&quot;:&quot;Mamba §2–3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2312.00752v2#S3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/><