<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="998" viewBox="0 0 1200 998" role="img" aria-labelledby="title desc"><title id="title">전달 순서와 실제 연결을 구별하기</title><desc id="desc">논리적으로 Ring 순서로 전달해도 네 GPU가 공유 스위치를 거칠 수 있습니다.</desc><metadata>{&quot;id&quot;:&quot;04-logical-physical&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">전달 순서와 실제 연결을 구별하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">위는 알고리즘의 관계, 아래는 가능한 물리 연결의 한 예입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><rect x="48" y="198" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="234" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">논리적 Ring: 통신 상대와 순서</text><text x="72" y="274" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0 → GPU 1 → GPU 2 → GPU 3 → GPU 0</text><text x="48" y="360" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">실제 하드웨어: GPU들이 스위치를 통해 연결된 예</text><rect x="48" y="407" width="240" height="120" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="66" y="443" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="66" y="493" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M168,536 L426,637" stroke="#5C6C7C" stroke-width="2.5"/><rect x="336" y="407" width="240" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="354" y="443" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="354" y="493" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M456,536 L542,637" stroke="#5C6C7C" stroke-width="2.5"/><rect x="624" y="407" width="240" height="120" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="642" y="443" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="642" y="493" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M744,536 L658,637" stroke="#5C6C7C" stroke-width="2.5"/><rect x="912" y="407" width="240" height="120" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="930" y="443" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="930" y="493" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><path d="M1032,536 L774,637" stroke="#5C6C7C" stroke-width="2.5"/><rect x="375" y="637" width="450" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="393" y="673" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">공유 스위치</text><text x="393" y="723" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 경로에서 대역폭 경쟁 가능</text><text x="48" y="828" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Ring의 이웃이라고 전용 케이블로 직접 연결된 것은 아닙니다.</text></g></g><path d="M48,890 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="928" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">같은 물리 링크를 공유하는 전송은 대역폭을 나눠 씁니다. GPU의 순서를 바꾸면 공유 링크를 지나는 트래픽도 달라질</text><text x="48" y="957.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">수 있습니다.</text></svg>