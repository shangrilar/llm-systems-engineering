x="20" y="270" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="480">유지 계수 0.25 → 남는 값 0.5</text><rect x="20" y="305" width="160" height="44" rx="4" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="20" y="305" width="40" height="44" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M20 395 L500 395" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="20" y="445" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="500">새 입력의 기록: Δ × B × u</text><text x="20" y="490" fill="#B55B22" font-size="26" font-weight="600" text-anchor="start" data-max-width="500">2 × 1 × 2 = 4</text><rect x="20" y="520" width="320" height="44" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="20" y="620" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">막대 길이: 상태 값 · 같은 척도</text></g></svg>