<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1246" viewBox="0 0 1200 1246" role="img" aria-labelledby="title desc"><title id="title">주소를 계산한 뒤 그 행의 학습된 벡터를 읽습니다</title><desc id="desc">입력 [2,5]가 h1 계산 11 mod7을 거쳐 주소4가 되고 일곱 행의 표에서 row4의 0.2,0.8을 읽는다. 표의 다른 행은 기호다. 추가 계산 [5,1]은16 mod7=2,[1,4]는7 mod7=0이다.</desc><metadata>{&quot;id&quot;:&quot;ma-19-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Qwen3.8-Next §2.3, deterministic n-gram addressing&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2608.30320v1#S2.SS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 4 · 주소와 벡터</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">주소를 계산한 뒤 그 행의 학습된 벡터를 읽습니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">교육용 hash h₁(u,v) = (3u + v) mod 7 · Table 1: 7행 × 2성분</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1104">주소에서 벡터로</text><path d="M0 68 L1104 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="110" y="125" width="300" height="68" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="167" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="288">[A, B] = [2, 5]</text><path d="M260 203 L260 240" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="60" y="250" width="400" height="143" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="76" y="281" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="368">h₁ = (3u + v) mod 7</text><text x="76" y="321" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="368">3 × 2 + 5 = 11</text><text x="76" y="349" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="368">11 mod 7 = 4</text></g><path d="M260 403 L260 440" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="160" y="450" width="200" height="70" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="493" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">4</text><text x="260" y="584" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">주소: 정해진 연산의 결과</text><g data-container="true"><rect x="20" y="644" width="480" height="150" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="675" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">같은 식으로 다른 묶음도 계산</text><text x="36" y="715" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">[5, 1] → 16 mod 7 = 2</text><text x="36" y="743" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" d