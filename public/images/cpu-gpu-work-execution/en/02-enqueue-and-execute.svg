<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="813" viewBox="0 0 1200 813" role="img" aria-labelledby="title desc"><title id="title">When does submitted work execute?</title><desc id="desc">On a shared time axis, the CPU submits A and B and then performs other work. In GPU stream S, A executes before B. At the marked instant, the CPU has submitted B, but the GPU is still executing A. The input copy has already completed.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="813" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 5 · Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">When does submitted work execute?</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">CPU submission and GPU completion happen at different times.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="222" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Input x is already ready on the GPU</text><path d="M240,254 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="239" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="327" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU</text><text x="48" y="363" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Submit work</text><rect x="240" y="292" width="126" height="70" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="303.0" y="336.0" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Submit A</text><rect x="410" y="292" width="126" height="70" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="473.0" y="336.0" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Submit B</text><rect x="650" y="292" width="488" height="70" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="894.0" y="336.0" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">Other CPU work</text><text x="48" y="506" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU</text><text x="48" y="542" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Stream S</text><rect x="376" y="474" width="404" height="86" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="578.0" y="526.0" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Compute A  ·  x → u</text><rect x="780" y="474" width="358" height="86" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="959.0" y="526.0" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">Compute B  ·  u → y</text><path d="M366,373 L376,464" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" stroke-dasharray="7 7"/><path d="M536,373 L780,464" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" stroke-dasharray="7 7"/><path d="M608,275 V490 M608,545 V585" fill="none" stroke="#B55B22" stroke-width="2.5" stroke-dasharray="7 7"/><text x="608" y="619" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">At this instant</text><rect x="48" y="657" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="702" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">The CPU has submitted B, but the GPU is still executing A.</text><text x="600" y="741" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">In the same stream, B executes after A finishes.</text></svg>