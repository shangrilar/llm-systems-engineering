<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1074" viewBox="0 0 1200 1074" role="img" aria-labelledby="title desc"><title id="title">토큰을 여러 번 선택하고 응답을 평가한다</title><desc id="desc">같은 LLM이 질문에서 x1을 고르고, 질문에 x1을 붙인 문맥에서 x2를 고른다. 여러 토큰으로 완성한 응답 2+3=5를 정답 검증한 뒤 보상 +1을 받는다.</desc><metadata>{&quot;id&quot;:&quot;1-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;RLHF Book — Training Overview&quot;,&quot;url&quot;:&quot;https://rlhfbook.com/c/03-training-overview&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">토큰을 여러 번 선택하고 응답을 평가한다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">선택한 토큰은 다음 문맥이 됩니다. 이 예의 보상은 응답을 끝낸 뒤 한 번 받습니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">선택한 토큰을 다음 입력에 붙이기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="104" width="488" height="102" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="135" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">문맥 1</text><text x="32" y="175" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">질문: “2+3은?”</text></g><path d="M210 215 L210 236" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="112" y="247" width="196" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="128" y="278" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="164">같은 LLM</text></g><path d="M317 285 L359 285" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="371" y="260" width="82" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="412" y="292" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">x₁</text><path d="M412 318 V373" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="386" width="488" height="102" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="417" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">문맥 2</text><text x="32" y="457" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">질문: “2+3은?” + x₁</text></g><path d="M210 497 L210 518" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="112" y="529" width="196" height="76" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="128" y="560" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="164">같은 LLM</text></g><path d="M317 567 L359 567" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="371" y="542" width="82" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="412" y="574" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">x₂</text><text x="16" y="682" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="488">같은 모델을 반복 호출</text><text x="16" y="718" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">선택 → 문맥 확장 → 다음 선택 → …</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">응답 하나에 보상 하나 붙이기</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="16" y="114" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">선택이 이어져 하나의 응답을 구성</text><rect x="31" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="76" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">x₁</text><rect x="153" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="198" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">x₂</text><rect x="275" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="320" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">…</text><rect x="397" y="148" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="442" y="180" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">xₜ</text><path d="M31 210 V226 H487 V210" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="260" y="261" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="480">응답 전체</text><g data-container="true"><rect x="30" y="294" width="460" height="104" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="325" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">완성된 응답</text><text x="46" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">“2+3=5”</text></g><path d="M260 409 L260 436" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="30" y="447" width="460" height="116" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="46" y="478" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="428">정답 검증</text><text x="46" y="518" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="428">완성된 응답이 맞는지 확인</text></g><path d="M260 575 L260 601" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="130" y="612" width="260" height="76" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="146" y="643" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="228">보상 +1</text></g><text x="16" y="732" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="488">이 예에서는 완료 후 한 번 평가</text></g><path d="M48,995.4153846153846 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1033.4153846153845" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">x₁·x₂는 설명용 토큰 기호입니다. 행동의 단위는 토큰 선택이고, 여기서 평가하는 단위는 완성된 응답입니다.</text></svg>