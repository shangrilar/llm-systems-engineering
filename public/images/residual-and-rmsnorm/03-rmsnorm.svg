<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
<title id="title">토큰 하나의 d개 성분에 RMSNorm 적용하기</title><desc id="desc">한 토큰의 d=4 입력 [1,−1,3,3]의 제곱 평균은 5, RMS는 √5다. γ=1이고 ε를 생략한 예시에서 출력은 약 [0.45,−0.45,1.34,1.34]다. 막대는 같은 눈금으로 부호와 크기를 비교한다. 모든 d개 성분이 RMS 계산에 참여하며, 정규화는 토큰마다 따로 적용된다. 일반 식은 ε와 성분별 학습 가중치 γ를 포함한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1120" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">토큰 하나의 d개 성분에 RMSNorm 적용하기</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">d개 성분에서 RMS를 구한 뒤, 각 성분을 같은 RMS로 나눕니다.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="250" y="223" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">입력 벡터 x</text><text x="950" y="223" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">RMSNorm 출력</text><path d="M70,274 V266 H430 V274" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="250.0" y="253" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">d = 4</text><path d="M770,274 V266 H1130 V274" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="950.0" y="253" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">d = 4</text><rect x="70.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="115.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="160.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="205.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="250.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="295.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="340.0" y="284" width="90.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="385.0" y="323.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="770.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="815.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0.45</text><rect x="860.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="905.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">−0.45</text><rect x="950.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="995.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1.34</text><rect x="1040.0" y="284" width="90.0" height="60" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1085.0" y="323.0" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1.34</text><text x="600" y="272" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">÷ √5</text><path d="M464,314 L736,314" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="600" y="360" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">√5 ≈ 2.24</text><text x="600" y="393" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">같은 값으로 나누기</text><path d="M70,532 L430,532" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="58" y="539" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="end">0</text><rect x="92" y="497" width="46" height="35" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">1</text><rect x="182" y="532" width="46" height="35" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="205" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2</text><rect x="272" y="427" width="46" height="105" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="295" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">3</text><rect x="362" y="427" width="46" height="105" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="385" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4</text><path d="M770,532 L1130,532" fill="none" stroke="#8191A0" stroke-width="1.5"/><text x="758" y="539" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="end">0</text><rect x="792" y="516.3475241575014" width="46" height="15.652475842498527" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="815" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">1</text><rect x="882" y="532" width="46" height="15.652475842498527" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="905" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2</text><rect x="972" y="485.0425724725044" width="46" height="46.95742752749558" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="995" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">3</text><rect x="1062" y="485.0425724725044" width="46" height="46.95742752749558" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1085" y="605" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4</text><text x="600" y="640" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">가로축: d개의 성분 위치 · 좌우 막대는 같은 눈금입니다.</text><rect x="48" y="660" width="1104" height="132" rx="14" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1.5"/><text x="80" y="700" fill="#287D78" font-size="26" font-weight="600" text-anchor="start">d개 성분으로 RMS 하나를 구합니다.</text><text x="80" y="752" fill="#287D78" font-size="30" font-weight="400" text-anchor="start">√((1² + (−1)² + 3² + 3²) / d) = √(20 / 4) = √5</text><text x="80" y="833" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">γ(감마)는 학습 가능한 가중치 벡터이며, 성분별로 곱합니다.</text><text x="80" y="870" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">위 예시는 나누기의 효과를 보이기 위해 γ = [1, 1, 1, 1]로 설정했습니다.</text><text x="80" y="907" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">분모가 0이 되지 않도록 더하는 작은 값 ε는 이 예시에서 생략했습니다.</text><text x="600" y="962" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">i</tspan> = x<tspan baseline-shift="sub" font-size="70%">i</tspan> / √((x<tspan baseline-shift="sub" font-size="70%">1</tspan>² + … + x<tspan baseline-shift="sub" font-size="70%">d</tspan>²) / d + ε) × γ<tspan baseline-shift="sub" font-size="70%">i</tspan></text><text x="600" y="1010" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">토큰마다 따로 적용 · 입력과 출력 모두 d차원</text><path d="M48,1040 L1152,1040" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1081" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">d = 4와 값은 설명용입니다. 출력은 소수 둘째 자리로 반올림했으며, 막대는 반올림 전 값입니다.</text>
</svg>