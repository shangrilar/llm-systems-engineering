<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Expert가 같은 개수여도 처리할 토큰 수는 다릅니다</title><desc id="desc">같은 수의 토큰에서 출발해도 라우팅 뒤 E0/E1/E2/E3는 각각 1/1/6/0개를 처리한다. 같은 Expert 수를 가진 GPU0과 GPU1의 토큰 계산량은 2/6개로 달라진다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1240" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Expert가 같은 개수여도 처리할 토큰 수는 다릅니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">처음에는 GPU마다 토큰 4개 · 라우팅 후에는 GPU0에 2개, GPU1에 6개</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="205" width="480" height="925" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="925" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="297.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">출발: 토큰 4개</text><rect x="105.0" y="320" width="150" height="44" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="349.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A1</text><rect x="321.0" y="320" width="150" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="396" y="349.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><rect x="105.0" y="378" width="150" height="