<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">실행을 쉬는 것과 공간을 돌려주는 것은 다릅니다</title><desc id="desc">B를 배치에서만 빼면 KV 블록 2개가 남아 빈 공간이 없습니다. B의 KV를 실제로 반환하면 2개가 비고 A에 1개를 줄 수 있습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1070" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">실행을 쉬는 것과 공간을 돌려주는 것은 다릅니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">B를 중단 대상으로 고른 단순 예시입니다. 최적의 정책을 뜻하지 않습니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><g data-panel="true"><rect x="48" y="194" width="1104" height="110" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="229.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">A가 다음 토큰을 처리하려면 새 블록 1개가 필요</text><text x="72" y="271.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">현재 풀: [A, A, B, B] · 빈 블록 0개 · B의 두 블록은 독점 소유</text></g><path d="M550,327 L303,382" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M650,327 L897,382" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="48" y="405" width="510" height="317" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="441.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">B를 이번 실행에서 제외</text><text x="68" y="489.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">B의 GPU KV는 그대로 유지</text><text x="68" y="521.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="68" y="553.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">풀: [A, A, B, B]</text><text x="68" y="585.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">빈 블록: 0개</text><text x="68" y="617.8" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">A의 새 블록을 확보하지 못함</text></g><g data-panel="true"><rect x="642" y="405" width="510" height="317" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="662" y="441.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">B를 중단하고 KV 회수</text><text x="662" y="489.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">B의 GPU KV 블록 두 개 반환</text><text x="662" y="521.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="662" y="553.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">풀: [A, A, —, —]</text><text x="662" y="585.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">빈 블록: 2개</text><text x="662" y="617.8" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">토큰 이력은 보존, B는 재개 대기</text></g><path d="M897,743 L897,798" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><g data-panel="true"><rect x="642" y="821" width="510" height="145" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="857.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">A에 블록 1개 배정</text><text x="662" y="905.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">풀: [A, A, A, —] · 빈 블록 1개</text></g><text x="48" y="822.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">메모리를 돌려주는 동작이</text><text x="48" y="858.4" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">실제로 있어야 공간이 생깁니다.</text><text x="48" y="1022.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">요청 단계 사이의 관리입니다. 실행 중 GPU 커널의 중단을 뜻하지 않습니다.</text></svg>