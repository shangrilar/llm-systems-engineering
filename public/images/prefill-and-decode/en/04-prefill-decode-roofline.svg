<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc"><title id="title">Token count changes the bottleneck of linear operations</title><desc id="desc">The sloped bandwidth ceiling marks the memory-bound region, and the flat compute ceiling marks the compute-bound region. Few new tokens in small-batch decode and many tokens in sufficiently large prefill illustrate low and high arithmetic intensity respectively.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1100" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Token count changes the bottleneck of linear operations</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Apply the Roofline model to linear operations that use model weights.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Compute throughput</text><path d="M145,765 L145,265" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M145,765 L1145,765" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M145,765 L705,355" fill="none" stroke="#2470BB" stroke-width="6"/><path d="M705,355 H1110" fill="none" stroke="#B55B22" stroke-width="6"/><path d="M145,355 H705 V765" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7"/><text x="460" y="306.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Bandwidth × arithmetic intensity</text><text x="920" y="306.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">GPU compute ceiling</text><circle cx="330" cy="629.5535714285714" r="10" fill="white" stroke="#182C40" stroke-width="3"/><circle cx="955" cy="355" r="10" fill="white" stroke="#182C40" stroke-width="3"/><text x="190" y="466.0" fill="#2470BB" font-size="26" font-weight="700" text-anchor="start">Small-batch decode</text><text x="190" y="505.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Few new input tokens</text><path d="M330,526 L330,589" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="810" y="448.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Prefill with enough input</text><text x="810" y="488.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Many input tokens</text><path d="M955,418 L955,374" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="330" y="817.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">Low</text><text x="955" y="817.0" fill="#526577" font-size="23" font-weight="400" text-anchor="middle">High</text><text x="665" y="867.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Arithmetic intensity · FLOP/byte</text><text x="350" y="708.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Memory-bound</text><text x="917" y="708.0" fill="#B55B22" font-size="24" font-weight="700" text-anchor="middle">Compute-bound</text><path d="M226,929 L1080,929" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="654" y="975.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">More tokens → more weight reuse → higher arithmetic intensity</text><text x="48" y="1044.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">The line is a throughput ceiling; positions illustrate conditions, not measurements.</text></svg>