"30" y="427" width="518" height="124" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="46" y="458" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">손실 마스크</text><text x="46" y="498" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">대화·환경 기록 → 학습할 토큰 위치</text></g><g data-container="true"><rect x="572" y="427" width="518" height="124" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="588" y="458" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">보상</text><text x="588" y="498" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">평가·검증 → 과제 수행 점수</text></g><g data-container="true"><rect x="30" y="567" width="518" height="124" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="46" y="598" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">정책 버전</text><text x="46" y="638" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">실행 관리·추론 → 경험을 만든 가중치</text></g><g data-container="true"><rect x="572" y="567" width="518" height="124" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="588" y="598" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="486">작업 / 그룹 ID</text><text x="588" y="638" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="486">실행 관리 → 과제와 비교 그룹</text></g></g></svg>