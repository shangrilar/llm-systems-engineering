<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title desc">
<title id="title">Position sets the angle; each component pair has its own rate</title><desc id="desc">Rotate the same four-component input [1,1,1,-1] at positions 0,1,2. The first pair rotates 30 degrees per position and the second 10. Colors distinguish component pairs, not heads.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1530" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Position sets the angle; each component pair has its own rate</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">α = position p × rate θ · applied to each component pair</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="205" width="1104" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="244" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Head 1 · dh = 4 · keep the input fixed to isolate the effect of position.</text><text x="110" y="321" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Before rotation</text><rect x="340.0" y="282" width="125.0" height="57" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="402.5" y="319.5" fill="#2470BB" font-size="27" font-weight="400" text-anchor="middle">1</text><rect x="465.0" y="282" width="125.0" height="57" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="527.5" y="319.5" fill="#2470BB" font-size="27" font-weight="400" text-anchor="middle">1</text><rect x="590.0" y="282" width="125.0" height="57" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="652.5" y="319.5" fill="#287D78" font-size="27" font-weight="400" text-anchor="middle">1</text><rect x="715.0" y="282" width="125.0" height="57" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="777.5" y="319.5" fill="#287D78" font-size="27" font-weight="400" text-anchor="middle">-1</text><text x="600" y="381" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Gray: before rotation · color: after rotation · colors identify component pairs.</text><text x="235" y="437" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Token 1 · position 0</text><text x="600" y="437" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Token 2 · position 1</text><text x="965" y="437" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Token 3 · position 2</text><rect x="48" y="453" width="1104" height="53" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="490" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Component pair 1 · 30° per position</text><path d="M115,643 L355,643" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,523 L235,763" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="235" cy="643" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,643 L307,571" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M235,643 L307.0,571.0" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="235" y="805" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">α = 0°</text><text x="235" y="849" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[1, 1]</text><path d="M480,643 L720,643" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,523 L600,763" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="600" cy="643" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,643 L672,571" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M600,643 L626.3538290724796,544.6461709275204" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="600" y="805" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">α = 30°</text><text x="600" y="849" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[0.366, 1.366]</text><path d="M845,643 L1085,643" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,523 L965,763" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="965" cy="643" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,643 L1037,571" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M965,643 L938.6461709275204,544.6461709275204" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="965" y="805" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">α = 60°</text><text x="965" y="849" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[-0.366, 1.366]</text><rect x="48" y="877" width="1104" height="53" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="914" fill="#287D78" font-size="24" font-weight="600" text-anchor="start">Component pair 2 · 10° per position</text><path d="M115,1067 L355,1067" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,947 L235,1187" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="235" cy="1067" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,1067 L307,1139" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M235,1067 L307.0,1139.0" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="235" y="1229" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">α = 0°</text><text x="235" y="1273" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">[1, -1]</text><path d="M480,1067 L720,1067" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,947 L600,1187" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="600" cy="1067" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,1067 L672,1139" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M600,1067 L683.408827008898,1125.40348942486" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="600" y="1229" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">α = 10°</text><text x="600" y="1273" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">[1.158, -0.811]</text><path d="M845,1067 L1085,1067" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,947 L965,1187" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="965" cy="1067" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,1067 L1037,1139" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M965,1067 L1057.2833190160336,1110.0324183771372" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="965" y="1229" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">α = 20°</text><text x="965" y="1273" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">[1.282, -0.598]</text><rect x="48" y="1345" width="1104" height="70" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1389" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">Place both pairs together: four components in, four components out</text><path d="M48,1450 L1152,1450" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1491" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Angles are illustrative, not a real model’s frequency settings.</text>
