<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1570" viewBox="0 0 1200 1570" role="img" aria-labelledby="title desc"><title id="title">Replicate attention and partition experts</title><desc id="desc">Attention and router weights are replicated on GPU0 and GPU1. E0/E1 reside on GPU0; E2/E3 on GPU1. Tokens travel to experts; results return to the source GPU and original token for the next common operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1570" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Replicate attention and partition experts</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Two GPUs handle different sequences and exchange tokens and results in the MoE</text><text x="48" y="140.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">block.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="205" width="480" height="1275" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="1275" rx="10" fill="#fbfcfd" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249.0" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="289.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Input sequence A</text><rect x="110.0" y="310" width="140" height="44" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180" y="339.0" fill="#2470BB" font-size="22" font-weight="700" text-anchor="middle">A1</text><rect x="326.0" y="310" width="140" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="396" y="339.0" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><path d="M288,361 L288,393" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="78.0" y="401" width="420" height="101" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="435.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Attention / common layers · DP</text><text x="288" y="469.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Replicas of the same weights</text><path d="M288,509 L288,541" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="125.0" y="548" width="326" height="84" rx="10" fill="#edf7f5" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="582.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="288" y="616.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Select experts for local tokens</text><text x="912" y="289.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Input sequence B</text><rect x="734.0" y="310" width="140" height="44" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="804" y="339.0" fill="#7954A3" font-size="22" font-weight="700" text-anchor="middle">B1</text><rect x="950.0" y="310" width="140" height="44" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1020" y="339.0" fill="#B55B22" font-size="22" font-weight="700" text-anchor="middle">B2</text><path d="M912,361 L912,393" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="702.0" y="401" width="420" height="101" rx="10" fill="#eef5fb" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="435.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Attention / common layers · DP</text><text x="912" y="469.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Replicas of the same weights</text><path d="M912,509 L912,541" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="749.0" y="548" width="326" height="84" rx="10" fill="#edf7f5" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="582.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="912" y="616.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">Select experts for local tokens</text><text x="600" y="670.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Dispatch tokens to selected experts</text><path d="M220,632 L220,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M356,632 L356,702 L804,702 L804,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M844,632 L844,747 L396,747 L396,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><path d="M980,632 L980,776 L864,776 L864,793" fill="none" stroke="#526577" stroke-width="3" marker-end="url(#arrow)"/><rect x="82" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="180" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E0</text><rect x="298" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="396" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E1</text><rect x="706" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="804" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E2</text><rect x="922" y="800" width="196" height="126" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="1020" y="836.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="mi