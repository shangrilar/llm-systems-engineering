<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="811" viewBox="0 0 1200 811" role="img" aria-labelledby="title desc">
<title id="title">Reduce: combine matching positions</title><desc id="desc">Reduce sums corresponding elements of four two-element inputs, producing [1111,2222] at root GPU 0 only.</desc>
