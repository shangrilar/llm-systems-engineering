<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1254" viewBox="0 0 1200 1254" role="img" aria-labelledby="title desc"><title id="title">통신할 상대와 받을 공간 준비하기</title><desc id="desc">같은 서버의 프로세스 0과 1이 GPU 0과 1을 각각 맡는다. 두 CPU 코드가 같은 통신 그룹의 rank 0과 1로 통신 객체를 준비하고 GPU 버퍼 확보를 요청한다. GPU 0의 A가 만든 [1,2,3,4]를 GPU 1 수신 버퍼로 전달한다. 수신 전에는 공간만 있고 수신 완료 뒤 값이 유효하다. GPU 0 원본은 유지된다. 상대 rank, 원소 수 4, 자료형 float32를 맞춘다. 점선은 공간 확보 요청이고 실선은 논리적인 데이터 전달이다.</desc><metadata>{&quot;id&quot;:&quot;01-peers-and-buffers&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">통신할 상대와 받을 공간 준비하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">CPU는 통신 그룹과 버퍼를 준비하고, 데이터는 GPU 메모리에 놓입니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><rect x="48" y="205" width="1104" height="54" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="241" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">한 서버의 GPU 두 개를 두 프로세스가 하나씩 담당합니다</text><rect x="48" y="282" width="520" height="210" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="323" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">프로세스 0 · CPU 코드</text><text x="76" y="367" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">GPU 0 담당 · 그룹 안 번호 rank 0</text><text x="76" y="411" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 그룹의 통신 객체 준비: comm₀</text><text x="76" y="454" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">GPU 버퍼 확보 요청</text><path d="M308,501 V559" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)" stroke-dasharray="7 7"/><text x="328" y="540" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">공간 확보 요청</text><rect x="632" y="282" width="520" height="210" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="323" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">프로세스 1 · CPU 코드</text><text x="660" y="367" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">GPU 1 담당 · 그룹 안 번호 rank 1</text><text x="660" y="411" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">같은 그룹의 통신 객체 준비: comm₁</text><text x="660" y="454" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">GPU 버퍼 확보 요청</text><path d="M892,501 V559" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)" stroke-dasharray="7 7"/><text x="912" y="540" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">공간 확보 요청</text><rect x="48" y="576" width="520" height="420" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="620" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0 · 송신 버퍼</text><rect x="632" y="576" width="520" height="420" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="620" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1 · 수신 버퍼</text><text x="112" y="668" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">계산 A가 만든 x</text><rect x="112" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="150" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">1</text><rect x="200" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="238" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">2</text><rect x="288" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="326" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">3</text><rect x="376" y="686" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="414" y="727" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">4</text><text x="672" y="668" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="start">수신 전: 공간만 확보</text><rect x="672" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><rect x="760" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><rect x="848" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><rect x="936" y="686" width="76" height="62" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="112" y="825" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">전달 뒤에도 원본 유지</text><rect x="112" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="150" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">1</text><rect x="200" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="238" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">2</text><rect x="288" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="326" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">3</text><rect x="376" y="845" width="76" height="62" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="414" y="886" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">4</text><text x="672" y="825" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="start">수신 완료: x 도착</text><rect x="672" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="710" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">1</text><rect x="760" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="798" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">2</text><rect x="848" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="886" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">3</text><rect x="936" y="845" width="76" height="62" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="974" y="886" fill="#4C60A8" font-size="29" font-weight="600" text-anchor="middle">4</text><path d="M458,749 H596 V876 H664" fill="none" stroke="#4C60A8" stroke-width="2.5" marker-end="url(#arrow-indigo)"/><text x="892" y="956" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">B가 읽을 입력 준비</text><rect x="48" y="1032" width="1104" height="102" rx="12" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1073" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">송신 상대: rank 1  ·  수신 상대: rank 0</text><text x="600" y="1110" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">양쪽이 맞추는 내용: 원소 4개 · 자료형 float32</text></g></g><path d="M48,1176 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1214" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">점선은 공간 확보 요청, 실선은 논리적인 데이터 전달입니다. 송신 뒤에도 GPU 0의 원본은 유지됩니다.</text></svg>