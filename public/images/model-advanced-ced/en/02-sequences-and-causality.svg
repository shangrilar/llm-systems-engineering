uery positions · Columns: Key positions · Color: allowed · Dashed: future blocked</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. ED · Two position axes</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="260" y="130" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">Encoder → Encoder</text><text x="200" y="193" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle" data-max-width="60">s0</text><text x="272" y="193" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle" data-max-width="60">s1</text><text x="344" y="193" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle" data-max-width="60">s2</text><text x="146" y="253" fill="#2470BB" font-size="21" font-weight="400" text-anchor="end" data-max-width="110">s0</text><rect x="170" y="215" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="242" y="215" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="314" y="215" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="146" y="325" fill="#2470BB" font-size="21" font-weight="400" text-anchor="end" data-max-width="110">s1</text><rect x="170" y="287" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="242" y="287" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="314" y="287" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="146" y="397" fill="#2470BB" font-size="21" font-weight="400" text-anchor="end" data-max-width="110">s2</text><rect x="170" y="359" width="60" height="60" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-wid