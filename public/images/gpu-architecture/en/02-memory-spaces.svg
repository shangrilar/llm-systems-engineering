<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">Where Is Data Stored?</title><desc id="desc">SM A and SM B each have registers, L1 cache, and shared memory. L1 cache and shared memory share on-chip resources but have different roles. Each SM accesses a common L2 cache and HBM. Lines indicate access relationships, not a mandatory sequence for all data.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1210" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Where Is Data Stored?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Distinguish storage shared across SMs from storage inside each SM.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="220" width="536" height="497" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="72" y="264" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">SM A</text><rect x="72" y="288" width="488" height="105" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="96" y="326" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start">Register</text><text x="96" y="365" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start">Values and intermediate results for computation</text><rect x="72" y="415" width="488" height="268" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="96" y="451" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="start">Shared on-chip storage resources</text><rect x="90" y="473" width="216" height="184" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="198" y="512" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">L1 cache</text><text x="198" y="556" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Retains some</text><text x="198" y="587" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">accessed data</text><text x="198" y="618" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">for later reads</text><rect x="320" y="473" width="198" height="184" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="419" y="512" fill="#287D78" font-size="21" font-weight="600" text-anchor="middle">Shared memory</text><text x="419" y="556" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Shared data is</text><text x="419" y="587" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">placed explicitly</text><text x="419" y="618" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">by the program</text><rect x="616" y="220" width="536" height="497" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="640" y="264" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">SM B</text><rect x="640" y="288" width="488" height="105" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5" /><text x="664" y="326" fill="#7954A3" font-size="25" font-weight="600" text-anchor="start">Register</text><text x="664" y="365" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start">Values and intermediate results for computation</text><rect x="640" y="415" width="488" height="268" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="664" y="451" fill="#5C6C7C" font-size="21" font-weight="600" text-anchor="start">Shared on-chip storage resources</text><rect x="658" y="473" width="216" height="184" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="766" y="512" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">L1 cache</text><text x="766" y="556" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Retains some</text><text x="766" y="587" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">accessed data</text><text x="766" y="618" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">for later reads</text><rect x="888" y="473" width="198" height="184" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="987" y="512" fill="#287D78" font-size="21" font-weight="600" text-anchor="middle">Shared memory</text><text x="987" y="556" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Shared data is</text><text x="987" y="587" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">placed explicitly</text><text x="987" y="618" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">by the program</text><path d="M316,718 V759 H884 V718" fill="none" stroke="#2470BB" stroke-width="2.5" /><path d="M600,759 V809" fill="none" stroke="#2470BB" stroke-width="2.5" /><rect x="48" y="810" width="1104" height="116" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="855" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">L2 cache</text><text x="78" y="895" fill="#2470BB" font-size="24" font-weight="400" text-anchor="start">A common cache supporting memory access across SMs</text><path d="M600,927 V980" fill="none" stroke="#2470BB" stroke-width="2.5" /><rect x="48" y="982" width="1104" height="116" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="78" y="1027" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">HBM</text><text x="78" y="1067" fill="#2470BB" font-size="24" font-weight="400" text-anchor="start">Large storage for model weights, inputs, intermediate data, and more</text><text x="600" y="1161" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">Each storage space has a different location and role.</text></svg>