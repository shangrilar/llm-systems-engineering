<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="title desc"><title id="title">Block을 SM에 배정하고 자원을 사용합니다</title><desc id="desc">Block E부터 H는 SM 배정을 기다리고 있다. SM 1에는 block A와 B, SM 2에는 block C와 D가 상주한다. 각 block 안에서 thread별 register 값과 block별 shared memory를 논리적으로 구분하고 SM 공통 L1 캐시를 표시한다. Register는 SM의 물리적 자원이며 thread가 개별 값을 사용한다. Shared memory는 이를 사용하는 작업의 예시이고 벡터 덧셈에 반드시 필요하다는 뜻은 아니다. 이 배치와 block 수는 예시이며 실제 상주 수는 자원 사용량과 장치 한도에 따라 달라진다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1160" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Block을 SM에 배정하고 자원을 사용합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">아직 배정되지 않은 작업과, SM에 상주하는 작업을 구분합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="214" width="1104" height="119" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="74" y="255" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">SM 배정을 기다리는 block</text><rect x="491" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="562.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block E</text><rect x="650" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="721.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block F</text><rect x="809" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="880.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block G</text><rect x="968" y="241" width="142" height="61" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="1039.0" y="279.5" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Block H</text><path d="M316,334 V427" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7"/><path d="M884,334 V427" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" stroke-dasharray="7 7"/><text x="600" y="390" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">SM에 자원이 확보되면 배정</text><rect x="48" y="441" width="536" height="515" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><text x="72" y="486" fill="#2470BB" font-size="30" font-weight="700" text-anchor="start">SM 1</text><rect x="72" y="510" width="232" height="338" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="188" y="548" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">Block A</text><text x="188" y="593" fill="#2470BB" font-size="21" font-weight="600" text-anchor="midd