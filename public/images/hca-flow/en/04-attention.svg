<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc"><title id="title">Attention over a shared K = V</title><desc id="desc">After per-head normalisation and RoPE of the query, the visible entries E serve as both K and V. S = Q·Eᵀ/√c goes through a softmax with the sink added to the denominator to give P, P·E gives the head outputs O, which get an inverse RoPE. Heads are grouped, each group uses its own W^{O,a}, and a shared W^{O,b} maps back to the hidden size.</desc><metadata>{&quot;id&quot;:&quot;hca-flow-04-attention&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4 report · §2.3.2 (HCA)&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro&quot;},{&quot;label&quot;:&quot;DeepSeek-V4-Pro inference code · Attention, Compressor&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro/blob/main/inference/model.py&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 15 · HCA</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Attention over a shared K = V</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The readable entries E serve as Key and Value, then a grouped output projection</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="640"><tspan>① Prepare the query, score</tspan></text><text x="1104" y="30" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="end" data-max-width="460"><tspan>computation for one token t · example: 4 heads</tspan></text><g data-matrix="Q"><rect x="80" y="156" width="60" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="110" y="144" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="180"><tspan>Q</tspan></text><text x="110" y="227" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[n</tspan><tspan dy="4" font-size="12.6">h</tspan><tspan dy="-4">, c]</tspan></text><rect x="188" y="163" width="110" height="34" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="243" y="187" fill="#657789" font-size="19" font-weight="600" text-anchor="middle" data-max-width="102">head RMS</text><rect x="346" y="163" width="92" height="34" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="392" y="187" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle" data-max-width="84">RoPE</text><path d="M392 244 L392 201" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><text x="392" y="267" fill="#2470BB" font-size="19" font-weight="400" text-anchor="middle" data-max-width="140"><tspan>position t</tspan></text><g data-matrix="E"><rect x="472" y="86" width="60" height="48" rx="0" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/></g><text x="502" y="74" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="180"><tspan>E</tspan></text><text x="510" y="157" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[N</tspan><tspan dy="4" font-size="12.6">t</tspan><tspan dy="-4">, c]</tspan></text><path d="M502 134 L502 163" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><circle cx="502" cy="180" r="16" fill="#FFFFFF" stroke="#DCE4EC"/><text x="502" y="186.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="26">×</text><text x="468" y="172" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="30">A</text><text x="472" y="154" fill="#5C6C7C" font-size="15" font-weight="400" text-anchor="start" data-max-width="30">Bᵀ</text><rect x="566" y="163" width="80" height="34" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="606" y="187" fill="#657789" font-size="19" font-weight="600" text-anchor="middle" data-max-width="72">÷ √c</text><g data-matrix="S"><rect x="694" y="156" width="80" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="734" y="144" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="200"><tspan>S</tspan></text><text x="734" y="227" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[n</tspan><tspan dy="4" font-size="12.6">h</tspan><tspan dy="-4">, N</tspan><tspan dy="4" font-size="12.6">t</tspan><tspan dy="-4">]</tspan></text><text x="542" y="108" fill="#2470BB" font-size="17" font-weight="400" text-anchor="start" data-max-width="100"><tspan>as the Key</tspan></text><path d="M140 180 L186 180" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M298 180 L344 180" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M438 180 L485 180" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M518 180 L564 180" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/><path d="M646 180 L688 180" stroke="#2470BB" stroke-width="1.8" fill="none" marker-end="url(#arrow-blue)"/></g><g transform="translate(48 554) scale(1)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="640"><tspan>② Softmax with a sink</tspan></text><g data-matrix="S"><rect x="70" y="86" width="80" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="110" y="74" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="200"><tspan>S</tspan></text><text x="110" y="157" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[n</tspan><tspan dy="4" font-size="12.6">h</tspan><tspan dy="-4">, N</tspan><tspan dy="4" font-size="12.6">t</tspan><tspan dy="-4">]</tspan></text><rect x="198" y="93" width="110" height="34" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="253" y="117" fill="#287D78" font-size="19" font-weight="600" text-anchor="middle" data-max-width="102">softmax</text><g data-matrix="P"><rect x="356" y="86" width="80" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="396" y="74" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="200"><tspan>P</tspan></text><text x="396" y="157" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>[n</tspan><tspan dy="4" font-size="12.6">h</tspan><tspan dy="-4">, N</tspan><tspan dy="4" font-size="12.6">t</tspan><tspan dy="-4">]</tspan></text><text x="110" y="186" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle" data-max-width="200"><tspan>S from ①</tspan></text><path d="M253