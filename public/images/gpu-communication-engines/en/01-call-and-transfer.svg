<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">From CPU Requests to Data Transfer</title><desc id="desc">CPU processes 0 and 1 request a send and a receive from NCCL. NCCL checks the requests, builds the work and submits it. Orange dashed arrows show submission; the blue solid arrow shows transfer of x from GPU 0 memory to GPU 1 memory. One CPU call does not necessarily correspond to one GPU kernel.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="920" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 14 · Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">From CPU Requests to Data Transfer</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">The CPU builds and submits communication work, which then transfers GPU data.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><path d="M70,216 H150" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)" stroke-dasharray="7 7"/><text x="170" y="224" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Requests / state</text><path d="M400,216 H480" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="500" y="224" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="start">Data movement</text><rect x="48" y="266" width="520" height="298" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="307" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Process 0 · CPU code</text><rect x="76" y="330" width="464" height="86" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="308.0" y="367.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">User code: request a send</text><text x="308.0" y="402.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">ncclSend(...)</text><path d="M308,425 V449" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="76" y="462" width="464" height="76" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="308.0" y="509.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">NCCL: check request, build work</text><rect x="48" y="678" width="520" height="198" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="718" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 0</text><rect x="96" y="750" width="424" height="100" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308.0" y="794.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">Communication · Send</text><text x="308.0" y="829.0" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">Send x from GPU memory</text><path d="M308,549 V739" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)" stroke-dasharray="7 7"/><text x="328" y="625" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">Submit work</text><rect x="632" y="266" width="520" height="298" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="307" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Process 1 · CPU code</text><rect x="660" y="330" width="464" height="86" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="892.0" y="367.0" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">User code: request a receive</text><text x="892.0" y="402.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">ncclRecv(...)</text><path d="M892,425 V449" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="660" y="462" width="464" height="76" rx="12" fill="#FFFFFF" stroke="#182C40" stroke-width="1.5"/><text x="892.0" y="509.0" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">NCCL: check request, build work</text><rect x="632" y="678" width="520" height="198" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="718" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">GPU 1</text><rect x="680" y="750" width="424" height="100" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="794.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">Communication · Receive</text><text x="892.0" y="829.0" fill="#4C60A8" font-size="24" font-weight="400" text-anchor="middle">Receive x into GPU memory</text><path d="M892,549 V739" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)" stroke-dasharray="7 7"/><text x="912" y="625" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">Submit work</text><path d="M520,800 H668" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="600" y="775" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="middle">Transfer x</text></svg>