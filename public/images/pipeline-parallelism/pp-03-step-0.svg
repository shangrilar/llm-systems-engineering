<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1410" viewBox="0 0 1200 1410" role="img" aria-labelledby="title desc"><title id="title">배치를 나누면 다음 GPU가 먼저 시작할 수 있습니다</title><desc id="desc">시각 0. 통째 배치는 각 단계 4칸씩 총 16칸, 마이크로배치 파이프라인은 총 7칸이다. 같은 네 입력과 네 GPU의 순전파를 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1410" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">배치를 나누면 다음 GPU가 먼저 시작할 수 있습니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">다음을 눌러 같은 시간축에서 두 실행의 진행과 완료를 비교하세요.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="600" y="205.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">같은 입력 A·B·C·D · 같은 GPU 4개 · 순전파 비교</text><rect x="48" y="226" width="1104" height="100" rx="10" fill="#f8fafc" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="263.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="start">가정: 단계마다 입력 1개 = 1칸 / 배치 크기 4를 통째로 = 4칸</text><text x="72" y="302.0" fill="#526577" font-size="21" font-weight="400" text-anchor="start">단계의 계산 시간은 같고 통신 시간은 생략합니다. 측정값이 아닌 비교 예시입니다.</text><text x="48" y="380.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">배치를 통째로 전달</text><text x="248" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">0</text><path d="M248,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="302" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">1</text><path d="M302,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="356" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">2</text><path d="M356,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="410" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">3</text><path d="M410,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="464" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">4</text><path d="M464,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="518" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">5</text><path d="M518,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="572" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">6</text><path d="M572,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="626" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">7</text><path d="M626,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="680" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">8</text><path d="M680,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="734" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">9</text><path d="M734,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="788" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">10</text><path d="M788,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="842" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">11</text><path d="M842,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="896" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">12</text><path d="M896,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="950" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">13</text><path d="M950,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="1004" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">14</text><path d="M1004,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="1058" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">15</text><path d="M1058,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="1112" y="427.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">16</text><path d="M1112,445 V717" stroke="#DCE4EC" stroke-width="1"/><text x="70" y="484.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 0</text><rect x="250" y="450" width="212" height="52" rx="10" fill="#f1f4f7" stroke="#a7b5c4" stroke-width="1.5"/><text x="356" y="483.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="552.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 1</text><rect x="466" y="518" width="212" height="52" rx="10" fill="#f1f4f7" stroke="#a7b5c4" stroke-width="1.5"/><text x="572" y="551.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="620.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 2</text><rect x="682" y="586" width="212" height="52" rx="10" fill="#f1f4f7" stroke="#a7b5c4" stroke-width="1.5"/><text x="788" y="619.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="688.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 3</text><rect x="898" y="654" width="212" height="52" rx="10" fill="#f1f4f7" stroke="#a7b5c4" stroke-width="1.5"/><text x="1004" y="687.0" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="250" y="759.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">완료한 입력: 0 / 4</text><text x="1105" y="759.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="end">전체 완료: 16칸</text><text x="48" y="857.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">마이크로배치로 나눠 겹쳐 실행</text><text x="248" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">0</text><path d="M248,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="302" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">1</text><path d="M302,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="356" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">2</text><path d="M356,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="410" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">3</text><path d="M410,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="464" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">4</text><path d="M464,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="518" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">5</text><path d="M518,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="572" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">6</text><path d="M572,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="626" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">7</text><path d="M626,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="680" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">8</text><path d="M680,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="734" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">9</text><path d="M734,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="788" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">10</text><path d="M788,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="842" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">11</text><path d="M842,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="896" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">12</text><path d="M896,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="950" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">13</text><path d="M950,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="1004" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">14</text><path d="M1004,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="1058" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">15</text><path d="M1058,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="1112" y="904.0" fill="#526577" font-size="17" font-weight="400" text-anchor="middle">16</text><path d="M1112,922 V1194" stroke="#DCE4EC" stroke-width="1"/><text x="70" y="961.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 0</text><rect x="250" y="927" width="50" height="52" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="275.0" y="961.0" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">A</text><rect x="304" y="927" width="50" height="52" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="329.0" y="961.0" fill="#287D78" font-size="24" font-weight="400" text-anchor="middle">B</text><rect x="358" y="927" width="50" height="52" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><text x="383.0" y="961.0" fill="#7954A3" font-size="24" font-weight="400" text-anchor="middle">C</text><rect x="412" y="927" width="50" height="52" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><text x="437.0" y="961.0" fill="#B55B22" font-size="24" font-weight="400" text-anchor="middle">D</text><text x="70" y="1029.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 1</text><rect x="304" y="995" width="50" height="52" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="329.0" y="1029.0" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">A</text><rect x="358" y="995" width="50" height="52" rx="10" fill=