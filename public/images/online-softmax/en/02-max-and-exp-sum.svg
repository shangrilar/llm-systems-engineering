<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1301" viewBox="0 0 1200 1301" role="img" aria-labelledby="title desc"><title id="title">Two Values for the Softmax Reference and Denominator</title><desc id="desc">For the row of scores 1,2, the maximum m is 2. exp(1-2) is about 0.368 and exp(2-2) is 1, giving exponential sum l about 1.368. Dividing each exponential by the same l gives probabilities of about 26.9%,73.1%. The sum contains exponentials after subtracting the current maximum, not exponentials of the original scores. Outputting all probabilities also requires each score. Displayed values are rounded.</desc><metadata>{&quot;id&quot;:&quot;02-max-and-exp-sum&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Two Values for the Softmax Reference and Denominator</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">m: the reference for exp · ℓ: the sum of exponentials using that reference</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="84" y="250" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">Scores x</text><rect x="330" y="211" width="190" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="425" y="252" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="530" y="211" width="190" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="625" y="252" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><path d="M743,244 L831,244" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#arrow-purple)"/><rect x="853" y="211" width="271" height="66" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="988.5" y="252" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">Maximum m = 2</text><rect x="48" y="328" width="1104" height="228" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="374" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. Subtract the same m from all scores, then apply exp.</text><rect x="330" y="401" width="340" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="500" y="442" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">exp(1 − 2)</text><rect x="680" y="401" width="340" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="850" y="442" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">exp(2 − 2)</text><text x="120" y="447" fill="#2470BB" font-size="26" font-weight="600" text-anchor="start">exp(x − m)</text><text x="500" y="517" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">≈ 0.368</text><text x="850" y="517" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">= 1</text><path d="M500,565 L500,611" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><path d="M850,565 L850,611" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="48" y="632" width="1104" height="177" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="76" y="679" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">2. Sum the exponentials to form a shared denominator.</text><text x="600" y="756" fill="#287D78" font-size="31" font-weight="700" text-anchor="middle">Sum ℓ = exp(1 − 2) + exp(2 − 2) ≈ 1.368</text><path d="M600,823 L600,866" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="48" y="887" width="1104" height="192" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="933" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">3. Divide each exponential by the same ℓ to get probabilities.</text><rect x="150" y="971" width="422" height="67" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="361" y="1012.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">0.368 ÷ 1.368 ≈ 26.9%</text><rect x="626" y="971" width="422" height="67" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="837" y="1012.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1 ÷ 1.368 ≈ 73.1%</text><text x="600" y="1140" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Keep the pair: maximum m and exponential sum ℓ using that m.</text></g></g><path d="M48,1193 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1231" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The exponential sum uses scores after subtracting the maximum, not the original scores. Decimals are</text><text x="48" y="1260.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">rounded.</text></svg>