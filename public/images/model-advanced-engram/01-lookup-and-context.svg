<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2792" viewBox="0 0 1200 2792" role="img" aria-labelledby="title desc"><title id="title">주소는 Token ID에서, 반영량은 Hidden에서 정합니다</title><desc id="desc">원래 token ID가 두 경로로 갈라진다. 기존 embedding과 앞선 backbone에서 h_t를 만들며, 별도 canonical ID 변환 뒤 suffix와 hash로 학습 표를 조회해 e_t를 만든다. 확대도에서 e_t를 W_K,W_V로 투영한다. h_t와 k_t는 RMSNorm 후 내적, √d 나눗셈, sigmoid로 scalar α_t를 만들고 α_t가 v_t를 곱해 gated value를 낸다.</desc><metadata>{&quot;id&quot;:&quot;ma-20-02&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2.2–2.4, Eqs. 1–4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1#S2.SS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2 · 조회와 문맥</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">주소는 Token ID에서, 반영량은 Hidden에서 정합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Engram의 한 위치 t · A에서 두 입력 준비 → C에서 문맥 gate로 합류</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 같은 ID에서 두 경로로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">원래 Token ID</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">x_1, …, x_t</text></g><path d="M260 225 L260 260" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M260 260 H120 V305" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 260 H385 V305" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="10" y="315" width="220" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="346" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Embedding</text></g><path d="M120 430 L120 485" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="10" y="495" width="220" height="150" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="526" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">앞선 Backbone</text><text x="26" y="566" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">현재 문맥 반영</text></g><path d="M120 655 L120 930" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="270" y="315" width="230" height="145" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="346" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Canonical IDs</text><text x="286" y="386" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">조회용 변환만</text></g><path d="M385 470 L385 520" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="270" y="530" width="230" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="561" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Suffix + Hash</text><text x="286" y="601" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">여러 주소 계산</text></g><path d="M385 680 L385 735" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="270" y="745" width="230" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="776" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">학습된 Table</text><text x="286" y="816" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">행 조회 → concat</text></g><path d="M385 895 L385 930" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="20" y="940" width="200" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="120" y="983" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">h_t [d]</text><rect x="270" y="940" width="230" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="385" y="983" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">e_t [d_mem]</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 길이 × head마다 별도 표</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="480" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="150.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">… A B C</text><rect x="20" y="235" width="480" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="270.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">2-gram (B,C)</text><path d="M135 300 L135 330" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="25" y="340" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="41" y="371" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 2,1</text><text x="41" y="411" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 1 → v1</text></g><path d="M395 300 L395 330" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="285" y="340" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="371" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 2,2</text><text x="301" y="411" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 2 → v2</text></g><rect x="20" y="525" width="480" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="560.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">3-gram (A,B,C)</text><path d="M135 590 L135 620" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="25" y="630" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="41" y="661" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 3,1</text><text x="41" y="701" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 1 → v3</text></g><path d="M395 590 L395 620" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="285" y="630" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="661" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 3,2</text><text x="301" y="701" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 2 → v4</text></g><rect x="20" y="790" width="480" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="828" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">Concat [v1 | v2 | v3 | v4]</text><path d="M25 455 H8 V775 H125 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M505 455 H515 V775 H395 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M135 735 V760 H255 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M395 735 V760 H265 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/></g><g transform="translate(48 1401.3846153846155) scale(1.0153846153846153)" data-panel="3"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">C. 문맥으로 Value 조절</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="205" y="110" width="295" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="352.5" y="153" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="283">e_t [d_mem]<