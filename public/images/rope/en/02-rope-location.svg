,720" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><path d="M950,738 L950,906" fill="none" stroke="#8191A0" stroke-width="2"/><rect x="805" y="925" width="290" height="76" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="950" y="957" fill="#657789" font-size="27" font-weight="600" text-anchor="middle">V · 3 × 4</text><text x="950" y="985" fill="#657789" font-size="21" font-weight="400" text-anchor="middle">Value is unchanged</text><path d="M950,1017 L950,1060" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="103" y="1079" width="994" height="114" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1120" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">Core Attention</text><text x="600" y="1162" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">Q′K′ᵀ / √dh → Mask → Softmax → PV</text><path d="M600,1205 L600,1238" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><text x="600" y="1282" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Head 1 output O1 · 3 × 4</text><path d="M600,1352 L600,1390" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-muted)"/><rect x="85" y="1408" width="1030" height="76" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1440" fill="#657789" font-size="27" font-weight="600" text-anchor="middle">Concat head results → output projection</text><text x="600" y="1468" fill="#657789" font-size="21" font-weight="400" text-anchor="middle">d output components per token · T × d = 3 × 8</text></g></g></g></g><path d="M48,1529 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1567" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">RoPE operates on each token independently; Q′K′ᵀ compares different tokens.</text></svg>