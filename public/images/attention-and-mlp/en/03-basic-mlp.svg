<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1343" viewBox="0 0 1200 1343" role="img" aria-labelledby="title desc"><title id="title">Basic MLP: expand, activate, project back</title><desc id="desc">One token goes from d=4 to m=8. ReLU maps the illustrative intermediate values [-2,1,0.5,-1,3,0,-0.5,2] to [0,1,0.5,0,3,0,0,2]. The second linear transformation returns to d=4. Components combine within one token, without mixing token positions.</desc><metadata>{&quot;id&quot;:&quot;03-basic-mlp&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Basic MLP: expand, activate, project back</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">An activation sits between two linear transformations. The token count T stays fixed.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><text x="600" y="225" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Zoom in on one token · input d = 4</text><rect x="400" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450" y="287" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="500" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550" y="287" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="600" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650" y="287" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="700" y="250" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750" y="287" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M600,318 L600,350" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="410" y="365" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="397" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Linear transformation 1</text><text x="600" y="425" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">d → m  ·  4 → 8</text><path d="M600,453 L600,495" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="600" y="530" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Intermediate vector · m = 8</text><rect x="200" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="250" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−2</text><rect x="300" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="350" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="400" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.5</text><rect x="500" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="600" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="700" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="800" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="850" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.5</text><rect x="900" y="550" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="950" y="587" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M600,618 L600,650" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="340" y="664" width="520" height="76" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="696" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">ReLU</text><text x="600" y="724" fill="#287D78" font-size="21" font-weight="400" text-anchor="middle">Apply max(0, value) to each component</text><path d="M600,752 L600,789" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><rect x="200" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="250" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="300" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="350" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="400" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="450" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0.5</text><rect x="500" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="550" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="600" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="650" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">3</text><rect x="700" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="750" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="800" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="850" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">0</text><rect x="900" y="804" width="100" height="56" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="950" y="841" fill="#287D78" font-size="28" font-weight="400" text-anchor="middle">2</text><path d="M600,872 L600,909" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="410" y="923" width="380" height="76" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="955" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Linear transformation 2</text><text x="600" y="983" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">m → d  ·  8 → 4</text><path d="M600,1011 L600,1043" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="400" y="1058" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="450.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="500" y="1058" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="550.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="600" y="1058" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="650.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="700" y="1058" width="100" height="56" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="750.0" y="1095.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">y<tspan baseline-shift="sub" font-size="70%">4</tspan></text><text x="600" y="1157" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Output: d = 4</text><text x="600" y="1212" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">Linear transformations combine components within one token.</text></g></g><path d="M48,1265 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1303" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Dimensions and intermediate values are illustrative. Linear weights and biases are omitted.</text></svg>