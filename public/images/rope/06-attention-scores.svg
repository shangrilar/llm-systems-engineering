 rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="780" y="481.5" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="820" y="448" width="80" height="49" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="860" y="481.5" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">2</text><rect x="900" y="448" width="80" height="49" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="940" y="481.5" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">1</text><rect x="980" y="448" width="80" height="49" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1020" y="481.5" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">1</text><text x="600" y="544" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">같은 Q·K에서 시작하고, RoPE 적용 여부만 바꿉니다.</text><path d="M48,587 L1152,587" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="315" y="642" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">RoPE 적용 전</text><text x="315" y="686" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">QKᵀ / √dh</text><rect x="165" y="755" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="215" y="796" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">-1</text><rect x="265" y="755" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="315" y="796" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">3</text><rect x="365" y="755" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="415" y="796" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">1.5</text><rect x="165" y="819" width="100" height="64" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="215" y="860" fill="#2470BB" font-size="25" font-weight="400" text-anchor="middle">3</text>