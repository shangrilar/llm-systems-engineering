<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966" role="img" aria-labelledby="title desc"><title id="title">Arithmetic Intensity Connects Memory and Compute Limits</title><desc id="desc">On the left, computation A performs 128 FLOP for 64 total HBM bytes read and written, giving intensity 2; B performs 512 FLOP for 64 bytes, giving intensity 8. The right uses linear axes with illustrative bandwidth 8 GB/s and compute ceiling 32 GFLOPS. The ceilings meet at intensity 4 FLOP/byte. A has ceiling 16 GFLOPS and B has ceiling 32 GFLOPS. The gray point illustrates a possible performance position below the ceiling and is not a measurement. These are not specifications for a particular GPU; the model assumes the same compute path and data type.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="966" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Arithmetic Intensity Connects Memory and Compute Limits</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Compare the amount of computation with the data read from and written to HBM.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="213" width="420" height="565" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="74" y="255" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">1. Computation per Byte Moved</text><rect x="72" y="284" width="372" height="183" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5" /><text x="94" y="322" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Computation A</text><text x="94" y="366" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">64 bytes moved to/from HBM</text><text x="94" y="403" fill="#182C40" font-size="21" font-weight="400" text-anchor="start">128 FLOP of required computation</text><text x="94" y="442" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">128 ÷ 64 = 2 FLOP/byte</text><rect x="72" y="493" width="372" height="183" rx="12" fill="#FFFFFF" stroke="#B55B22" stroke-width="1.5" /><text x="94" y="531" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Computation B</text><text x="94" y="575" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">64 bytes moved to/from HBM</text><text x="94" y="612" fill="#182C40" font-size="21" font-weight="400" text-anchor="start">512 FLOP of required computation</text><text x="94" y="651" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">512 ÷ 64 = 8 FLOP/byte</text><text x="258" y="724" fill="#182C40" font-size="21" font-weight="700" text-anchor="middle">Intensity = Operations ÷ Bytes moved</text><text x="258" y="758" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">Count both reads and writes</text><text x="506" y="255" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">2. Roofline: Throughput Ceiling</text><text x="582" y="294" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">Compute throughput (GFLOPS)</text><path d="M592,642 H1100" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7" /><text x="577" y="649" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="end">0</text><path d="M592,514 H1100" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7" /><text x="577" y="521" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="end">16</text><path d="M592,386 H1100" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7" /><text x="577" y="393" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="end">32</text><path d="M592,642 L592,318" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" /><path d="M592,642 L1125,642" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)" /><path d="M592,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2" /><text x="592" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">0</text><path d="M712,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2" /><text x="712" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">2</text><path d="M832,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2" /><text x="832" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">4</text><path d="M1072,642 v7" fill="none" stroke="#5C6C7C" stroke-width="2" /><text x="1072" y="675" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">8</text><path d="M592,642 L832,386" fill="none" stroke="#2470BB" stroke-width="5" /><path d="M832,386 H1100" fill="none" stroke="#B55B22" stroke-width="5" /><path d="M832,386 V642" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 7" /><text x="968" y="355" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">GPU compute ceiling</text><text x="609" y="416" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Bandwidth × intensity</text><path d="M703,434 L739,477" fill="none" stroke="#2470BB" stroke-width="2" /><circle cx="712" cy="514" r="7" fill="#2470BB" stroke="white" stroke-width="2" /><text x="728" y="539" fill="#2470BB" font-size="21" font-weight="600" text-anchor="start">A: ceiling 16</text><circle cx="1072" cy="386" r="7" fill="#B55B22" stroke="white" stroke-width="2" /><text x="1072" y="431" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">B: ceiling 32</text><circle cx="952" cy="534" r="7" fill="#5C6C7C" stroke="white" stroke-width="2" /><text x="970" y="560" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="start">Example performance point</text><text x="928" y="595" fill="#5C6C7C" font-size="16" font-weight="400" text-anchor="middle">Actual performance may fall below the ceiling</text><text x="851" y="717" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">Arithmetic intensity (FLOP/byte)</text><text x="704" y="761" fill="#2470BB" font-size="19" font-weight="600" text-anchor="middle">Bandwidth-limited ceiling</text><text x="978" y="761" fill="#B55B22" font-size="19" font-weight="600" text-anchor="middle">Compute-limited ceiling</text><rect x="48" y="816" width="1104" height="102" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="857" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">Throughput ceiling = min(Compute ceiling, Bandwidth × Arithmetic intensity)</text><text x="600" y="897" fill="#2470BB" font-size="22" font-weight="400" text-anchor="middle">Data supplied per unit time × Computation per byte</text></svg>