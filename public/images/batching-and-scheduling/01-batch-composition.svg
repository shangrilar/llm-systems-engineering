<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1107" viewBox="0 0 1200 1107" role="img" aria-labelledby="title desc"><title id="title">정적 배칭과 연속 배칭</title><desc id="desc">각 카드는 한 번의 실행에 선택한 배치다. A·B는 Decode 중이고 실행 1에서 A가 완료된 뒤 C가 도착한다. 정적 배칭은 실행 3에서 B가 끝난 뒤 실행 4에 C의 Prefill을 넣는다. 연속 배칭은 실행 2의 배치를 B의 Decode와 C의 Prefill로 구성하고 실행 3에서 B·C가 완료된다.</desc><metadata>{&quot;id&quot;:&quot;01-batch-composition&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><marker id="ported-batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M2,1 L8,5 L2,9" fill="none" stroke="#5C6C7C" stroke-width="1.7" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">정적 배칭과 연속 배칭</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">같은 요청이라도, 다음 실행에 넣는 요청을 바꾸면 빈자리를 활용할 수 있습니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="205" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">P = Prefill · D = Decode · ✓ = 완료</text><text x="1152" y="205" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="end">동시에 최대 2개 요청</text><text x="48" y="262" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">정적 배칭</text><text x="1152" y="262" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="end">묶음 전체가 끝난 뒤 새 요청 합류</text><rect x="148" y="286" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="319" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 1</text><rect x="161" y="334" width="162" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="242" y="368.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · D ✓</text><rect x="161" y="400" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242" y="434.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><path d="M338,380 L348,380" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="352" y="286" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="446" y="319" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 2</text><rect x="365" y="334" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="446" y="368.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><rect x="365" y="400" width="162" height="52" rx="8" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="446" y="434" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">빈자리</text><path d="M542,380 L552,380" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="556" y="286" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="650" y="319" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 3</text><rect x="569" y="334" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="650" y="368.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D ✓</text><rect x="569" y="400" width="162" height="52" rx="8" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="650" y="434" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">빈자리</text><path d="M746,380 L756,380" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="760" y="286" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="854" y="319" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 4</text><rect x="773" y="334" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="854" y="368.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · P</text><rect x="773" y="400" width="162" height="52" rx="8" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="854" y="434" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">빈자리</text><path d="M950,380 L960,380" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="964" y="286" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="1058" y="319" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 5</text><rect x="977" y="334" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="1058" y="368.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · D ✓</text><rect x="977" y="400" width="162" height="52" rx="8" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="5 5"/><text x="1058" y="434" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">빈자리</text><text x="48" y="512" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">대기 큐</text><rect x="352" y="484" width="392" height="49" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="548" y="516.66" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C 대기</text><text x="242" y="562" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">실행 1 뒤 C 도착</text><text x="650" y="562" fill="#287D78" font-size="22" font-weight="400" text-anchor="middle">B 완료</text><text x="854" y="562" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">C 합류</text><path d="M48,601 H1152" stroke="#DCE4EC"/><text x="48" y="653" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">연속 배칭</text><text x="1152" y="653" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="end">매 실행 사이에 배치 갱신</text><rect x="148" y="677" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="242" y="710" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 1</text><rect x="161" y="725" width="162" height="52" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="242" y="759.16" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">A · D ✓</text><rect x="161" y="791" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="242" y="825.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><path d="M338,771 L348,771" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="352" y="677" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#7954A3" stroke-width="1.5"/><text x="446" y="710" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 2</text><rect x="365" y="725" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="446" y="759.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D</text><rect x="365" y="791" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="446" y="825.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · P</text><path d="M542,771 L552,771" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#ported-batch-arrow)"/><rect x="556" y="677" width="188" height="188" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="650" y="710" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">실행 3</text><rect x="569" y="725" width="162" height="52" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="650" y="759.16" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · D ✓</text><rect x="569" y="791" width="162" height="52" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="650" y="825.16" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">C · D ✓</text><text x="950" y="762" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">세 요청 모두 완료</text><text x="950" y="808" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">C도 먼저 Prefill 수행</text><text x="242" y="906" fill="#7954A3" font-size="22" font-weight="400" text-anchor="middle">실행 1 뒤 C 도착</text><text x="446" y="906" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">[A, B] → [B, C]</text><text x="48" y="968" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">가로 방향은 실행 순서입니다. A·B는 이미 Decode 중이며, C는 새 요청입니다.</text></g></g><path d="M48,1029 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1067" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">각 카드는 한 번의 실행에 선택한 배치입니다. 연속 배칭은 실행마다 배치를 다시 구성해 빈자리에 새 요청을 넣습니다.</text></svg>