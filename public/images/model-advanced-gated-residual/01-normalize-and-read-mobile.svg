<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1263" viewBox="0 0 360 1263" role="img" aria-labelledby="title desc"><title id="title">각 Branch를 정규화하고, 성분별로 읽어 평균합니다</title><desc id="desc">두 원본 branch [2,2]와 [4,−4]는 각자 RMSNorm을 거쳐 [1,1]과 [1,−1]이 된다. 두 정규화 벡터 모두 읽기 controller에 들어간다. 같은 정규화 값에 gate를 곱하는 경로를 별도 패널로 표시했다. 예시 gate [.8,.2]와 [.4,.6]을 성분별로 곱한 뒤 두 결과를 평균해 [.6,−.2]를 만든다.</desc><metadata>{&quot;id&quot;:&quot;ma-15-01&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Qwen3.8-Flash-Next §2.2, equations 30–32&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2608.30320v1#S2.SS2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2 · Branch별 정규화와 읽기</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">각 Branch를 정규화하고,</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">성분별로 읽어 평균합니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">같은 토큰 · 2 branch × d = 2 ·</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">설명용으로 줄인 구성</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 값과 gate의 두 경로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="130" y="117" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle" data-max-width="150">R₁</text><g data-container="true"><rect x="52" y="147" width="72" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="88" y="181.32" fill="#287D78" font-size="26" font-weight="500" text-anchor="middle" data-max-width="60">2</text></g><g data-container="true"><rect x="136" y="147" width="72" height="52" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="172" y="181.32" fill="#287D78" font-size="26" font-weight="500" text-anchor="middle" data-max-width="60">2</text></g><path d="M130 209 L130 239" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="26" y="250" width="208" height="56" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="130" y="286" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="196">RMSNorm</text><path d="M130 316 L130 345" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="52" y="355" width="72" height="52" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88" y="389.32" fill="#2470BB" font-size="26" font-weight="500" text-anchor="middle" data-max-width="60">1</text></g><g data-container="true"><rect x="136" y="355" width="72" height="52" rx="4" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="172" y="389.