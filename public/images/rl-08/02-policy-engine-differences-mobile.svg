<svg xmlns="http://www.w3.org/2000/svg" width="360" height="731" viewBox="0 0 360 731" role="img" aria-labelledby="title desc"><title id="title">엔진이 달라진 것과 모델이 바뀐 것을 구별한다</title><desc id="desc">생성엔진v1 확률 .50과 학습엔진v1 .52의 차이는 엔진차이이다. 학습엔진v1 .52와 v2 .60의 차이는 가중치 업데이트이다. 현재학습 .60을 생성 .50으로 나눈 전체비율은1.2이다.</desc><metadata>{&quot;id&quot;:&quot;9-2&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §3.4, §5.3&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">엔진이 달라진 것과 모델이</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">바뀐 것을 구별한다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">같은 P·앞선 토큰에서, 같은 토큰 x의</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">확률을 비교한 교육용 예입니다.</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><g data-container="true"><rect x="40" y="20" width="440" height="130" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="56" y="51" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">생성 엔진 · v1</text><text x="56" y="91" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">토큰 x의 확률: 0.50</text></g><path d="M260 164 L260 229" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="282" y="198" fill="#B55B22" font-size="20" font-weight="400" text-anchor="start" data-max-width="220">엔진 차이</text><g data-container="true"><rect x="40" y="250" width="440" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="281" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">학습 엔진 · v1</text><text x="56" y="321" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">토큰 x의 확률: 0.52</text></g><path d="M260 394 L260 459" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><text x="282" y="428" fill="#7954A3" font-size="20" font-weight="400" text-anchor="start" data-max-width="220">가중치 업데이트</text><g data-container="true"><rect x="40" y="480" width="440" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="56" y="511" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="408">학습 엔진 · v2</text><text x="56" y="551" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="408">토큰 x의 확률: 0.60</text></g><g data-container="true"><rect x="16" y="705" width="488" height="85" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="736" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">현재 학습 확률 / 생성 확률</text><text x="32" y="776" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">0.60 / 0.50 = 1.2</text></g></g></svg>