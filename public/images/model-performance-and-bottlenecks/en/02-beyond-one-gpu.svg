<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="998" viewBox="0 0 1200 998" role="img" aria-labelledby="title desc"><title id="title">Improve execution and expand resources as needed</title><desc id="desc">Time drops from 100 to 60 ms but remains above a 30 ms target. A 16 GB requirement exceeds a GPU capacity of 12 GB. Reducing requirements or increasing resources leads to the multi-GPU question. Illustrative values.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="998" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 10 · Figure 2</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">Improve execution and expand resources as needed</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Distinguish a target execution time from the memory capacity needed to run.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="536" height="476" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="250" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">The target time has not been met</text><text x="76" y="287" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Improve execution on the current GPU</text><rect x="616" y="207" width="536" height="476" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="644" y="250" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Memory capacity is insufficient</text><text x="644" y="287" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Storage needed for the chosen execution</text><text x="156" y="349" fill="#182C40" font-size="20" font-weight="400" text-anchor="end">Initial</text><rect x="170" y="316" width="360" height="49" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350.0" y="348.5" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">100 ms</text><text x="156" y="436" fill="#182C40" font-size="20" font-weight="400" text-anchor="end">Improved</text><rect x="170" y="403" width="216" height="49" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="278.0" y="435.5" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">60 ms</text><path d="M278,384 V399 M278,457 V514" fill="none" stroke="#B55B22" stroke-width="2" stroke-dasharray="7 6"/><text x="278" y="550" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Target: 30 ms</text><text x="76" y="606" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Execution is faster, but meeting the target</text><text x="76" y="640" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">requires further improvement.</text><text x="644" y="349" fill="#2470BB" font-size="23" font-weight="600" text-anchor="start">One GPU: 12 GB capacity</text><rect x="644" y="382" width="300" height="128" rx="5" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><rect x="644" y="420" width="400" height="54" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="844" y="455" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Required memory: 16 GB</text><path d="M944,365 V415 M944,479 V526" fill="none" stroke="#2470BB" stroke-width="2" stroke-dasharray="7 6"/><text x="944" y="550" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Capacity limit</text><text x="644" y="606" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">This execution does not fit as configured.</text><text x="644" y="640" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Reduce its memory needs or add storage.</text><path d="M316,705 L316,750" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M884,705 L884,750" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="48" y="767" width="1104" height="183" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="76" y="813" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">What if we use more resources?</text><text x="76" y="858" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Faster responses · More requests · More memory capacity</text><text x="76" y="897" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">With additional GPUs, how should we divide data and computation?</text></svg>