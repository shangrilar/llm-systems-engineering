<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc"><title id="title">Many Outputs, One Computation Procedure</title><desc id="desc">At positions 0 through 3, add the values 1, 2, 3, 4 from A to 10, 20, 30, 40 from B and store 11, 22, 33, 44 in C. Each output is independent of results at other positions. Below, the common procedure is expressed as reading A[i] and B[i], adding them, and storing the result in C[i]. The index i starts at 0.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="950" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Many Outputs, One Computation Procedure</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Read two inputs at the same position, add them, and store the result there.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><g transform="translate(0,-50)"><rect x="48" y="263" width="258" height="278" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="177" y="304" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Position 0</text><text x="177" y="355" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">A[0] = 1</text><text x="177" y="395" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">B[0] = 10</text><path d="M78,417 H276" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="177" y="466" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">1 + 10 = 11</text><text x="177" y="511" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Store in C[0]</text><rect x="330" y="263" width="258" height="278" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="459" y="304" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Position 1</text><text x="459" y="355" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">A[1] = 2</text><text x="459" y="395" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">B[1] = 20</text><path d="M360,417 H558" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="459" y="466" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">2 + 20 = 22</text><text x="459" y="511" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Store in C[1]</text><rect x="612" y="263" width="258" height="278" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="741" y="304" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Position 2</text><text x="741" y="355" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">A[2] = 3</text><text x="741" y="395" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">B[2] = 30</text><path d="M642,417 H840" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="741" y="466" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">3 + 30 = 33</text><text x="741" y="511" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Store in C[2]</text><rect x="894" y="263" width="258" height="278" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="1023" y="304" fill="#2470BB" font-size="24" font-weight="700" text-anchor="middle">Position 3</text><text x="1023" y="355" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">A[3] = 4</text><text x="1023" y="395" fill="#182C40" font-size="25" font-weight="400" text-anchor="middle">B[3] = 40</text><path d="M924,417 H1122" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="1023" y="466" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">4 + 40 = 44</text><text x="1023" y="511" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Store in C[3]</text><text x="600" y="594" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Compute each output without waiting for results at other positions.</text><path d="M600,624 L600,672" fill="none" stroke="#2470BB" stroke-width="2.5" marker-end="url(#blue)" /><text x="600" y="720" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">The same computation procedure at every position</text><rect x="76" y="754" width="300" height="134" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="226" y="804" fill="#2470BB" font-size="26" font-weight="700" text-anchor="middle">Read inputs</text><text x="226" y="853" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">A[i] and B[i]</text><path d="M387,821 L438,821" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="450" y="754" width="300" height="134" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="804" fill="#B55B22" font-size="26" font-weight="700" text-anchor="middle">Add</text><text x="600" y="853" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">A[i] + B[i]</text><path d="M761,821 L812,821" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><rect x="824" y="754" width="300" height="134" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="974" y="804" fill="#2470BB" font-size="26" font-weight="700" text-anchor="middle">Store result</text><text x="974" y="853" fill="#182C40" font-size="26" font-weight="400" text-anchor="middle">Store in C[i]</text><text x="600" y="943" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">i is the assigned data position. Here, positions are numbered from 0.</text></g></svg>