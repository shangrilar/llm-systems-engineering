<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1250" viewBox="0 0 1200 1250" role="img" aria-labelledby="title desc"><title id="title">GPU memory in training and inference</title><desc id="desc">Both training and inference store model weights in GPU memory. Training retains activations for backpropagation, gradients, and optimizer state; inference retains KV for later generation. Both also need intermediate values and workspace. Cards compare storage roles, not memory amounts or proportions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1250" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">GPU memory in training and inference</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Both use model weights, but retain different state for the computations that follow.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="219.0" fill="#287D78" font-size="29" font-weight="700" text-anchor="start">Training</text><text x="642" y="219.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Inference</text><g data-box="48,255,510,126"><rect x="48" y="255" width="510" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="290.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Model weights W</text><text x="68" y="333.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Shared by inputs in a batch</text><text x="68" y="363.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Updated during training</text></g><g data-box="642,255,510,126"><rect x="642" y="255" width="510" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="290.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Model weights W</text><text x="662" y="333.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Shared by multiple requests</text><text x="662" y="363.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Kept fixed during generation</text></g><text x="48" y="433.0" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">Retained for weight updates</text><text x="642" y="433.0" fill="#B55B22" font-size="26" font-weight="700" text-anchor="start">Retained for later generation</text><g data-box="48,470,510,132"><rect x="48" y="470" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="505.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Saved activations</text><text x="68" y="548.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Forward-pass intermediate values</text><text x="68" y="578.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Retained for backward</text></g><g data-box="48,622,510,132"><rect x="48" y="622" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="657.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Gradients</text><text x="68" y="700.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Computed by backpropagation</text><text x="68" y="730.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Used to update the weights</text></g><g data-box="48,774,510,132"><rect x="48" y="774" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="809.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Optimizer state</text><text x="68" y="852.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Running statistics, for example</text><text x="68" y="882.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Contents depend on the optimizer</text></g><g data-box="642,470,510,132"><rect x="642" y="470" width="510" height="132" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="662" y="505.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV cache</text><text x="662" y="548.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">K and V from processed tokens</text><text x="662" y="578.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reused in later generation</text></g><text x="642" y="661.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">State for a request’s context</text><text x="642" y="714.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">Keeping more requests active</text><text x="642" y="747.6" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">or retaining longer contexts</text><text x="642" y="781.2" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">increases the space needed for KV.</text><g data-box="48,955,1104,142"><rect x="48" y="955" width="1104" height="142" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="990.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Both also need intermediate values and workspace</text><text x="70" y="1032.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Inference also creates activations during execution, without retaining them for</text><text x="70" y="1062.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">backpropagation.</text></g><text x="48" y="1141.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Cards explain storage roles, not a partition into separate memory regions or actual</text><text x="48" y="1171.8" fill="#526577" font-size="22" font-weight="400" text-anchor="start">amounts and proportions.</text><text x="48" y="1204.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Typical full-parameter training and generation with KV caching, with state on the GPU.</text><text x="48" y="1234.8" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Storage choices can vary.</text></svg>