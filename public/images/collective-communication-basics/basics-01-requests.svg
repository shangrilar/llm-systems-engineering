<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1119" viewBox="0 0 1200 1119" role="img" aria-labelledby="title desc">
<title id="title">개별 전달 요청에서 그룹의 동작으로</title><desc id="desc">네 GPU가 모두 GPU 0의 배열 [1,2]를 갖게 하는 동일한 목표를 비교한다. 왼쪽은 GPU 0을 담당하는 CPU 코드가 GPU 1,2,3에 각각 Send를 요청하고 나머지 CPU 코드가 GPU 0을 상대방으로 Recv를 요청한다. GPU 0은 자신의 입력을 유지한다. 오른쪽은 각 GPU를 담당하는 CPU 코드가 root 0인 Broadcast에 참여하며 root는 입력을 제공하고 다른 GPU는 받는다. 두 방식 모두 최종적으로 네 GPU가 [1,2]를 갖는다. 행 배치는 실행 시각이나 실제 전달 경로를 뜻하지 않으며 코드 문법은 생략했다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1119" fill="white"/>
<text x="48" y="46" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">집합 통신의 기본 동작 · 그림 1</text><text x="48" y="96" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">개별 전달 요청에서 그룹의 동작으로</text><text x="48" y="138" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">통신 상대를 하나씩 지정하거나, 그룹 전체가 수행할 동작을 요청합니다.</text><path d="M48,169 H1152" stroke="#DCE4EC"/><rect x="48" y="198" width="1104" height="64" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="239" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">같은 목표: GPU 0의 [1, 2]를 네 GPU가 모두 갖게 하기</text><text x="48" y="308" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="start">각 GPU를 담당하는 CPU 코드의 요청</text><text x="48" y="363" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">Send / Recv</text><text x="48" y="402" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="start">상대별로 송수신을 지정</text><rect x="48" y="426" width="528" height="429" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="624" y="363" fill="#182C40" font-size="29" font-weight="700" text-anchor="start">Broadcast</text><text x="624" y="402" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="start">그룹의 같은 동작에 참여</text><rect x="624" y="426" width="528" height="429" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="460" fill="#4C60A8" font-size="22" font-weight="600" text-anchor="middle">하나의 통신 그룹 · root = GPU 0</text><rect x="64" y="473" width="496" height="77" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="506" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="182" y="496" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Send → GPU 1, 2, 3</text><text x="182" y="530" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">각 상대에 같은 배열을 전달</text><rect x="640" y="473" width="496" height="77" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="656" y="506" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><text x="758" y="496" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Broadcast · root = 0</text><text x="758" y="530" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">기준 데이터를 제공</text><rect x="64" y="564" width="496" height="77" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="597" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="182" y="604" fill="#287D78" font-size="24" font-weight="600" text-anchor="start">Recv ← GPU 0</text><rect x="640" y="564" width="496" height="77" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="656" y="597" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><text x="758" y="587" fill="#287D78" font-size="24" font-weight="600" text-anchor="start">Broadcast · root = 0</text><text x="758" y="621" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">기준 데이터를 받기</text><rect x="64" y="655" width="496" height="77" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="688" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="182" y="695" fill="#7954A3" font-size="24" font-weight="600" text-anchor="start">Recv ← GPU 0</text><rect x="640" y="655" width="496" height="77" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="656" y="688" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><text x="758" y="678" fill="#7954A3" font-size="24" font-weight="600" text-anchor="start">Broadcast · root = 0</text><text x="758" y="712" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">기준 데이터를 받기</text><rect x="64" y="746" width="496" height="77" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="779" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="182" y="786" fill="#B55B22" font-size="24" font-weight="600" text-anchor="start">Recv ← GPU 0</text><rect x="640" y="746" width="496" height="77" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="656" y="779" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><text x="758" y="769" fill="#B55B22" font-size="24" font-weight="600" text-anchor="start">Broadcast · root = 0</text><text x="758" y="803" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">기준 데이터를 받기</text><text x="48" y="909" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">두 방식이 만드는 데이터 결과</text><rect x="48" y="935" width="264" height="142" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="64" y="950" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="84" y="973" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="72" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="124.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="184" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="236.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><rect x="328" y="935" width="264" height="142" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="344" y="950" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5"/><text x="364" y="973" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="404.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="464" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="516.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><rect x="608" y="935" width="264" height="142" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="624" y="950" width="8" height="27" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="644" y="973" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><rect x="632" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="684.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="744" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="796.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text><rect x="888" y="935" width="264" height="142" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="904" y="950" width="8" height="27" rx="3" fill="#B55B22" stroke="#B55B22" stroke-width="1.5"/><text x="924" y="973" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><rect x="912" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="964.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="1024" y="999" width="104" height="44" rx="7" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1076.0" y="1030" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">2</text></svg>