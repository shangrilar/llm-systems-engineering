<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1124" viewBox="0 0 1200 1124" role="img" aria-labelledby="title desc"><title id="title">Unused reservations keep new requests waiting</title><desc id="desc">B reserves 20 of 24 KV positions but currently uses only 6. The other 14 remain reserved for B, leaving just 4 positions available for allocation. C requires 6 for prefill and must wait. B would need 7 and C 6 after the next execution, only 13 total, but the reservation prevents C from entering.</desc><metadata>{&quot;id&quot;:&quot;04-reserved-memory&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker><pattern id="bs-reserved" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#EDF7F5" /><path d="M-2,2 L2,-2 M0,10 L10,0 M8,12 L12,8" stroke="#8DBCB8" stroke-width="1.5" /></pattern></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Unused reservations keep new requests waiting</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">The same B and C, with the same KV capacity of 24 positions.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="48" y="219" fill="#287D78" font-size="27" font-weight="700" text-anchor="start">If 20 KV positions are reserved for B</text><text x="48" y="261" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">B currently holds only 6 KV positions.</text><text x="220" y="316" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">Actual KV: 6</text><text x="640" y="316" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">Reserved, unused: 14</text><text x="1018" y="316" fill="#5C6C7C" font-size="23" font-weight="700" text-anchor="middle">Free: 4</text><rect x="96" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="138" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="180" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="222" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="264" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="306" y="340" width="38" height="65" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.6"/><rect x="348" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="390" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="432" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="474" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="516" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="558" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="600" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="642" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="684" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="726" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="768" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="810" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="852" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="894" y="340" width="38" height="65" rx="5" fill="url(#bs-reserved)" stroke="#287D78" stroke-width="1.6"/><rect x="936" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="978" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1020" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="1062" y="340" width="38" height="65" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><path d="M96,419 v9 h836 v-9" stroke="#287D78" stroke-width="1.5" fill="none"/><text x="514" y="461" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Allocated to B: 20</text><path d="M936,419 v9 h164 v-9" stroke="#5C6C7C" stroke-width="1.5" fill="none"/><text x="1018" y="461" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Available: 4</text><text x="48" y="526" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">The hatched space is unused, but unavailable to C.</text><path d="M48,577 H1152" stroke="#DCE4EC"/><text x="48" y="633" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">Space required by new request C</text><text x="671" y="633" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Space available for allocation</text><rect x="48" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="100" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="152" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="204" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="256" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="308" y="664" width="48" height="56" rx="5" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.6"/><rect x="671" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="723" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="775" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><rect x="827" y="664" width="48" height="56" rx="5" fill="white" stroke="#DCE4EC" stroke-width="1.6"/><text x="48" y="765" fill="#7954A3" font-size="23" font-weight="400" text-anchor="start">6 prompt inputs → 6 KV positions</text><text x="671" y="765" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">4 free &lt; 6 required</text><path d="M975,693 L1044,693" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="1059" y="661" width="93" height="63" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="1105" y="703" fill="#7954A3" font-size="29" font-weight="700" text-anchor="middle">C</text><text x="1105" y="772" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">Wait</text><path d="M48,824 H1152" stroke="#DCE4EC"/><text x="48" y="878" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Only 13 KV positions are needed, yet C cannot enter.</text><text x="48" y="924" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Next execution: B 7 + C 6 / total capacity 24</text><text x="48" y="983" fill="#B55B22" font-size="28" font-weight="700" text-anchor="start">What if KV storage could grow only as needed?</text></g></g><path d="M48,1046 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1084" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">A request waits because of reserved space even though actual KV requirements fit within capacity.</text></svg>