<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1530" viewBox="0 0 1200 1530" role="img" aria-labelledby="title desc">
<title id="title">위치별 회전각, 성분 쌍별 회전 속도</title><desc id="desc">같은 4차원 입력 [1,1,1,-1]을 위치 0,1,2에서 회전한다. 첫 쌍은 한 칸당 30도, 둘째 쌍은 한 칸당 10도로 회전한다. 색은 head가 아닌 성분 쌍을 구분한다.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1530" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 4</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">위치별 회전각, 성분 쌍별 회전 속도</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">α = 위치 p × 회전 속도 θ · 각 성분 쌍에 적용</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<rect x="48" y="205" width="1104" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="244" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">Head 1 · dh = 4 · 같은 입력을 고정해 위치에 따른 변화만 비교합니다.</text><text x="110" y="321" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">회전 전</text><rect x="340.0" y="282" width="125.0" height="57" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="402.5" y="319.5" fill="#2470BB" font-size="27" font-weight="400" text-anchor="middle">1</text><rect x="465.0" y="282" width="125.0" height="57" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="527.5" y="319.5" fill="#2470BB" font-size="27" font-weight="400" text-anchor="middle">1</text><rect x="590.0" y="282" width="125.0" height="57" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="652.5" y="319.5" fill="#287D78" font-size="27" font-weight="400" text-anchor="middle">1</text><rect x="715.0" y="282" width="125.0" height="57" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="777.5" y="319.5" fill="#287D78" font-size="27" font-weight="400" text-anchor="middle">-1</text><text x="600" y="381" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">회색: 회전 전 · 색상: 회전 후 · 색은 성분 쌍을 구분합니다.</text><text x="235" y="437" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">토큰 1 · 위치 0</text><text x="600" y="437" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">토큰 2 · 위치 1</text><text x="965" y="437" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">토큰 3 · 위치 2</text><rect x="48" y="453" width="1104" height="53" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="490" fill="#2470BB" font-size="24" font-weight="600" text-anchor="start">성분 쌍 1 · 한 칸당 30°</text><path d="M115,643 L355,643" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,523 L235,763" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="235" cy="643" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,643 L307,571" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M235,643 L307.0,571.0" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="235" y="805" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">α = 0°</text><text x="235" y="849" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[1, 1]</text><path d="M480,643 L720,643" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,523 L600,763" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="600" cy="643" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,643 L672,571" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M600,643 L626.3538290724796,544.6461709275204" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="600" y="805" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">α = 30°</text><text x="600" y="849" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[0.366, 1.366]</text><path d="M845,643 L1085,643" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,523 L965,763" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="965" cy="643" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,643 L1037,571" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M965,643 L938.6461709275204,544.6461709275204" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="965" y="805" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">α = 60°</text><text x="965" y="849" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">[-0.366, 1.366]</text><rect x="48" y="877" width="1104" height="53" rx="14" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="75" y="914" fill="#287D78" font-size="24" font-weight="600" text-anchor="start">성분 쌍 2 · 한 칸당 10°</text><path d="M115,1067 L355,1067" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,947 L235,1187" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="235" cy="1067" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M235,1067 L307,1139" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M235,1067 L307.0,1139.0" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="235" y="1229" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">α = 0°</text><text x="235" y="1273" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">[1, -1]</text><path d="M480,1067 L720,1067" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,947 L600,1187" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="600" cy="1067" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M600,1067 L672,1139" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M600,1067 L683.408827008898,1125.40348942486" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="600" y="1229" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">α = 10°</text><text x="600" y="1273" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">[1.158, -0.811]</text><path d="M845,1067 L1085,1067" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,947 L965,1187" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><circle cx="965" cy="1067" r="120" fill="none" stroke="#DCE4EC" stroke-width="1.5"/><path d="M965,1067 L1037,1139" fill="none" stroke="#8191A0" stroke-width="1.5" marker-end="url(#arrow-arrow)"/><path d="M965,1067 L1057.2833190160336,1110.0324183771372" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="965" y="1229" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">α = 20°</text><text x="965" y="1273" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">[1.282, -0.598]</text><rect x="48" y="1345" width="1104" height="70" rx="14" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1389" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">두 쌍을 다시 놓으면 네 성분 · 입출력 차원 dh = 4 유지</text><path d="M48,1450 L1152,1450" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1491" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">회전각은 설명용입니다. 실제 모델의 주파수 설정을 나타내지 않습니다.</text>
</svg>