rect x="48" y="679" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="64" y="694" width="8" height="27" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="84" y="717" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="72" y="743" width="216" height="44" rx="7" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="180" y="774" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">1111</text><rect x="328" y="679" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="344" y="694" width="8" height="27" rx="3" fill="#287D78" stroke="#287D78" stroke-width="1.5"/><text x="364" y="717" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="352" y="743" width="216" height="44" rx="7" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="460" y="774" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">2222</text><rect x="608" y="679" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="624" y="694" width="8" height="27" rx="3" fill="#7954A3" stroke="#7954A3" stroke-width="1.5"/><text x="644" y="717" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">GPU 2</text><rect x="632" y="743" width="216" height="44" rx="7" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="740" y="774" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">3333</text><rect x="888" y="679" width="264" height="140" rx="12" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><rect x="904" y="694" width="8" height="27" rx="3" fill="#B55B22" stroke="#B55B22" stroke-width="1.5"/><text x="924" y="717" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">GPU 3</text><rect x="912" y="743" width="216" height="44" rx="7" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="1020" y="774" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">4444</text><rect x="48" y="853" width="1104" height="96" rx="12" fill="#EEF1FC" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="893" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="middle">이 출력을 All-Gather하면</text><text x="600" y="927" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">모든 GPU가 [1111, 2222, 3333, 4444]를 갖습니다.</text></g></g><path d="M48,994 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1032" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">가운데 전체 합은 결과를 설명하기 위한 표현이며, 특정 GPU의 중간 버퍼가 아닙니다.</text></svg>