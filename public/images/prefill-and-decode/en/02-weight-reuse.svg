<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Compute more tokens with the same weights</title><desc id="desc">With T=1, W is used for one token; with T=4, the same W is reused across four tokens. Considering weight reads alone gives an arithmetic-intensity approximation of 2T/s for s bytes per weight element.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1240" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Compute more tokens with the same weights</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Larger T provides more computation per set of weights read.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><g data-box="48,197,1104,110"><rect x="48" y="197" width="1104" height="110" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="232.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Linear operation: X[T, d_in] × W[d_in, d_out] → Y[T, d_out]</text><text x="70" y="274.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">T counts the token positions passing through this operation now.</text></g><text x="48" y="366.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Use W for one token</text><g data-box="48,401,510,137"><rect x="48" y="401" width="510" height="137" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="436.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">T = 1</text><text x="68" y="479.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Decode with only one request</text></g><rect x="208" y="580" width="190" height="110" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="303" y="625.0" fill="#7954A3" font-size="32" font-weight="700" text-anchor="middle">W</text><text x="303" y="665.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">d_in × d_out</text><rect x="263" y="758" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="303.0" y="795.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t0</text><path d="M303,704 L303,745" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="303" y="860.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">Same weight size</text><text x="642" y="366.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Reuse the same W across tokens</text><g data-box="642,401,510,137"><rect x="642" y="401" width="510" height="137" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="436.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">T = 4</text><text x="662" y="479.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Multiple prefill tokens or batched</text><text x="662" y="509.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">decode</text></g><rect x="802" y="580" width="190" height="110" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="897" y="625.0" fill="#7954A3" font-size="32" font-weight="700" text-anchor="middle">W</text><text x="897" y="665.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">d_in × d_out</text><rect x="689" y="758" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="729.0" y="795.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t0</text><path d="M897,704 L729,745" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="805" y="758" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="845.0" y="795.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t1</text><path d="M897,704 L845,745" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="921" y="758" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="961.0" y="795.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t2</text><path d="M897,704 L961,745" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="1037" y="758" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1077.0" y="795.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">t3</text><path d="M897,704 L1077,745" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="897" y="860.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="middle">Same weight size</text><rect x="48" y="909" width="1104" height="155" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="948.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">FLOPs ≈ 2T × d_in × d_out</text><text x="70" y="990.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Weight bytes ≈ s × d_in × d_out</text><text x="70" y="1037.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Weight-only ratio ≈ 2T/s FLOP/byte (s: bytes per weight element)</text><text x="48" y="1110.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Approximation for weight-dominated traffic; input/output traffic, caching, tiling, and</text><text x="48" y="1140.8" fill="#526577" font-size="22" font-weight="400" text-anchor="start">execution efficiency are omitted.</text><text x="48" y="1187.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Arrows show reuse, not a physical GPU data path or measured speed.</text></svg>