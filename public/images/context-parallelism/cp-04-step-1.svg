-width="1"/><text x="877.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="853" y="414" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="877.5" y="447.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="853" y="463" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="877.5" y="496.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="853" y="512" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="877.5" y="545.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><text x="843" y="399.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="843" y="448.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="843" y="497.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="843" y="546.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="1036.5" y="350.0" font-size="20" fill="#183149" font-weight="700" text-anchor="middle">V</text><rect x="1012" y="365" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="1036.5" y="398.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="1012" y="414" width="49" height="49" fill="#eaf3fd" stroke="#2470bb" stroke-width="1"/><text x="1036.5" y="447.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="1012" y="463" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="1036.5" y="496.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><rect x="1012" y="512" width="49" height="49" fill="#fff0e3" stroke="#b55b22" stroke-width="1"/><text x="1036.5" y="545.81" font-size="21" fill="#183149" font-weight="400" text-anchor="middle">h1</text><text x="1002" y="399.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t0</text><text x="1002" y="448.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t1</text><text x="1002" y="497.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t2</text><text x="1002" y="546.3" font-size="19" fill="#587084" font-weight="400" text-anchor="end">t3</text><text x="888" y="753.0" font-size="23" fill="#b55b22" font-weight="700" text-anchor="middle">모든 토큰 / 내 헤드</text><path d="M365,637 L834,637" fill="none" stroke="#6750a4" stroke-width="2"  marker-end="url(#arrow)"/><text x="600" y="621.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">t0·t1의 h1 → GPU 1</text><path d="M834,701 L365,701" fill="none" stroke="#6750a4" stroke-width="2"  marker-end="url(#arrow)"/><text x="600" y="683.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">t2·t3의 h0 → GPU 0</text><rect x="193" y="864" width="814" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="600.0" y="893.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">All-to-All: h0 데이터는 GPU 0으로, h1 데이터는 GPU 1로</text><text x="600" y="949.0" font-size="22" fill="#183149" font-weight="700" text-anchor="middle">Q·K·V 모두 재배치: 각 GPU는 자기 헤드의 전체 문맥을 갖습니다.</text><text x="600" y="1025.0" font-size="21" fill="#587084" font-weight="400" text-anchor="middle">예: 토큰 4개 · 헤드 2개 · GPU 2개 / 기본 멀티헤드 어텐션</text></svg>