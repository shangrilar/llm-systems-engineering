<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2123" viewBox="0 0 360 2123" role="img" aria-labelledby="title desc"><title id="title">Three modes of a CSA2 layer</title><desc id="desc">A CSA2 layer is Full, Reindex or Reuse. Full builds the compressed KV and the indexer keys and selects the top-k KV rows with its own indexer query. Reindex borrows the KV and indexer keys from the latest Full layer and reselects with its own indexer query. A Reuse layer has no indexer: it borrows the KV and the latest Full or Reindex selection. All three join the k selected rows with their own window KV and compute attention with their own query.</desc><metadata>{&quot;id&quot;:&quot;csa2-flow-01-three-modes&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report · §2.3 (CSA2)&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2609.19969v1&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash model card and code&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 23 · CSA2</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Three modes of a CSA2</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">layer</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">What a layer builds and what it</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">borrows</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.9111111111111111)" data-panel="1"><g data-mode="full" transform="translate(0 0)"><text x="8" y="22" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="348"><tspan>top-k: example 2 / real 512 · window real 128</tspan></text><text x="8" y="44" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="348"><tspan>dashed = from an earlier layer · solid = computed here</tspan></text><text x="180" y="94" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle" data-max-width="360">Full</text><text x="180" y="122" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="360"><tspan>this layer builds the KV and the picks</tspan></text><g data-matrix="C^{Comp}"><rect x="12" y="170" width="64" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="44" y="158" fill="#287D78" font-size="20" font-weight="600" text-anchor="middle" data-max-width="184"><tspan>C</tspan><tspan dy="-7.6" font-size="14">Comp</tspan></text><text x="52" y="237" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[N</tspan><tspan dy="3.1" font-size="9.8">c</tspan><tspan dy="-3.1">, c]</tspan></text><g data-matrix="K^{IComp}"><rect x="226" y="170" width="48" height="48" rx="0" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/></g><text x="250" y="158" fill="#B34242" font-size="20" font-weight="600" text-anchor="middle" data-max-width="168"><tspan>K</tspan><tspan dy="-7.6" font-size="14">IComp</tspan></text><text x="258" y="237" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[N</tspan><tspan dy="3.1" font-size="9.8">c</tspan><tspan dy="-3.1">, d</tspan><tspan dy="3.1" font-size="9.8">I</tspan><tspan dy="-3.1">]</tspan></text><rect x="170" y="295" width="160" height="34" rx="8" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/><text x="250" y="319" fill="#B34242" font-size="15" font-weight="600" text-anchor="middle" data-max-width="152">Indexer scores</text><g data-matrix="q^I"><rect x="92" y="288" width="48" height="48" rx="0" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/></g><text x="116" y="276" fill="#B34242" font-size="20" font-weight="600" text-anchor="middle" data-max-width="168"><tspan>q</tspan><tspan dy="-7.6" font-size="14">I</tspan></text><text x="124" y="355" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[n</tspan><tspan dy="3.1" font-size="9.8">I</tspan><tspan dy="-3.1">, d</tspan><tspan dy="3.1" font-size="9.8">I</tspan><tspan dy="-3.1">]</tspan></text><g data-matrix="top-k"><rect x="230" y="392" width="40" height="48" rx="0" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/></g><text x="250" y="380" fill="#B34242" font-size="20" font-weight="600" text-anchor="middle" data-max-width="160"><tspan>top-k</tspan></text><text x="258" y="459" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[1, k]</tspan></text><text x="250" y="422" fill="#B34242" font-size="13" font-weight="600" text-anchor="middle" data-max-width="38">0, 3</text><rect x="60" y="450" width="104" height="28" rx="14" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="112" y="468.68" fill="#2470BB" font-size="13" font-weight="600" text-anchor="middle" data-max-width="104">new selection</text><path d="M140 312 L168 312" stroke="#B34242" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/><path d="M250 218 L250 293" stroke="#B34242" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/><path d="M250 329 L250 359" stroke="#B34242" stroke-width="1.8" fill="none" marker-end="url(#arrow-red)"/></g><path d="M0 506 L360 506" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-mode="reindex" transform="translate(0 516)"><text x="180" y="34" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle" data-max-width="360">Reindex</text><text x="180" y="62" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="middle" data-max-width="360"><tspan>borrows the KV, picks again</tspan></text><g data-matrix="C^{Comp}"><rect x="12" y="110" width="64" height="48" rx="0" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/></g><text x="44" y="98" fill="#287D78" font-size="20" font-weight="600" text-anchor="middle" data-max-width="184"><tspan>C</tspan><tspan dy="-7.6" font-size="14">Comp</tspan></text><text x="52" y="177" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data-max-width="200"><tspan>[N</tspan><tspan dy="3.1" font-size="9.8">c</tspan><tspan dy="-3.1">, c]</tspan></text><rect x="13" y="111" width="62" height="46" rx="0" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.5"/><rect x="12" y="110" width="64" height="48" rx="0" fill="none" stroke="#287D78" stroke-width="1.5" stroke-dasharray="7 5"/><g data-matrix="K^{IComp}"><rect x="226" y="110" width="48" height="48" rx="0" fill="#FFF0EE" stroke="#B34242" stroke-width="1.5"/></g><text x="250" y="98" fill="#B34242" font-size="20" font-weight="600" text-anchor="middle" data-max-width="168"><tspan>K</tspan><tspan dy="-7.6" font-size="14">IComp</tspan></text><text x="258" y="177" fill="#5C6C7C" font-size="14" font-weight="400" text-anchor="start" data