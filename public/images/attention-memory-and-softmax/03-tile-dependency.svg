<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1290" viewBox="0 0 1200 1290" role="img" aria-labelledby="title desc"><title id="title">타일별로 다음 계산까지 이어갈 수 있을까요?</title><desc id="desc">T=4, dh=2 예시에서 쿼리 토큰 2와 3, 키 토큰 0과 1에 해당하는 2×2 점수 타일을 계산한다. 타일 내부의 입력 성분 방향 합은 완료된 점수이며 내적 부분합을 뜻하지 않는다. 계산된 점수에 스케일링과 causal mask를 적용할 수 있다. 쿼리 2행은 키 2의 점수가 남고 키 3은 미래 위치라 제외된다. 쿼리 3행은 키 2와 3의 점수가 남는다. 따라서 현재 타일만으로 각 행의 지수합과 최종 확률을 확정할 수 없다. 전체 Attention을 타일별로 진행하려면 이 정규화 의존성을 다뤄야 한다. 온라인 가중합의 해결법은 여기서 설명하지 않는다. 마스크 자체나 타일 단위 Attention의 구현이 불가능하다는 뜻이 아니다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1290" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">타일별로 다음 계산까지 이어갈 수 있을까요?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">점수 계산과 마스크 적용에서, 행 전체의 정보가 필요한 Softmax로 넘어갑니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="207" width="1104" height="373" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="252" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. 필요한 점수 일부를 먼저 계산합니다.</text><text x="179.0" y="315" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Q의 일부</text><rect x="130" y="343" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="179" y="343" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="130" y="392" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="179" y="392" width="46" height="46" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="179.0" y="472" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">쿼리 토큰 2·3</text><text x="319" y="405" fill="#5C6C7C" font-size="36" font-weight="400" text-anchor="middle">×</text><text x="491.0" y="315" fill="#7954A3" font-size="27" font-weight="700" text-anchor="middle">Kᵀ의 일부</text><rect x="442" y="343" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="491" y="343" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="442" y="392" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="491" y="392" width="46" height="46" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="491.0" y="472" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">키 토큰 0·1</text><path d="M619,392 L745,392" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="923.0" y="315" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">점수 타일</text><rect x="874" y="343" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="923" y="343" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="874" y="392" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="923" y="392" width="46" height="46" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="923.0" y="472" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">2 × 2 점수</text><text x="600" y="531" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">계산한 점수에는 스케일링과 마스크를 바로 적용할 수 있습니다.</text><rect x="48" y="616" width="1104" height="370" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="661" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">2. Softmax에는 같은 행의 나머지 점수도 필요합니다.</text><text x="432" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">키 토큰 0</text><text x="602" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">키 토큰 1</text><text x="772" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">키 토큰 2</text><text x="942" y="719" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">키 토큰 3</text><text x="101" y="796" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">쿼리 토큰 2</text><rect x="354" y="749" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="431.5" y="793.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">계산됨</text><rect x="524" y="749" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="601.5" y="793.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">계산됨</text><rect x="694" y="749" width="155" height="72" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="771.5" y="793.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">미계산</text><rect x="864" y="749" width="155" height="72" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="941.5" y="793.0" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">−∞ · 제외</text><text x="101" y="888" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">쿼리 토큰 3</text><rect x="354" y="841" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="431.5" y="885.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">계산됨</text><rect x="524" y="841" width="155" height="72" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="601.5" y="885.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">계산됨</text><rect x="694" y="841" width="155" height="72" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="771.5" y="885.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">미계산</text><rect x="864" y="841" width="155" height="72" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="941.5" y="885.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">미계산</text><text x="600" y="957" fill="#7954A3" font-size="24" font-weight="600" text-anchor="middle">마스크로 제외되지 않은 점수를 모두 반영해야 행의 지수합을 알 수 있습니다.</text><path d="M600,1000 L600,1040" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><rect x="117" y="1064" width="438" height="94" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="336.0" y="1119.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">Softmax의 최종 확률은 아직 미정</text><path d="M573,1111 L647,1111" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="666" y="1064" width="418" height="94" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="875.0" y="1119.0" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle">그 확률로 V를 가중합하려면?</text><text x="600" y="1233" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">타일 하나의 점수만으로는, 그 타일의 최종 확률을 확정하기 어렵습니다.</text></svg>