<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">CPU and GPU designs prioritize different work</title><desc id="desc">CPU cores contain control, compute and cache. GPU groups contain many compute units, control and local storage. This is a conceptual comparison.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">CPU and GPU designs prioritize different work</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Compare how control, compute, and memory are organized.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="204" width="528" height="590" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="254" fill="#182C40" font-size="36" font-weight="700" text-anchor="middle">CPU</text><text x="312" y="294" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Focus on latency for complex tasks</text><rect x="624" y="204" width="528" height="590" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="254" fill="#182C40" font-size="36" font-weight="700" text-anchor="middle">GPU</text><text x="888" y="294" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Focus on throughput across many tasks</text><rect x="76" y="334" width="220" height="270" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="186" y="373" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">CPU core</text><rect x="92" y="395" width="188" height="67" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="186.0" y="436.5" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">Control</text><rect x="92" y="478" width="188" height="53" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="186.0" y="512.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Compute</text><rect x="92" y="545" width="188" height="42" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="186.0" y="574.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Cache</text><rect x="316" y="334" width="220" height="270" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="426" y="373" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">CPU core</text><rect x="332" y="395" width="188" height="67" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="426.0" y="436.5" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">Control</text><rect x="332" y="478" width="188" height="53" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="426.0" y="512.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Compute</text><rect x="332" y="545" width="188" height="42" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="426.0" y="574.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Cache</text><rect x="76" y="628" width="460" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="306.0" y="669.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">Shared cache</text><text x="312" y="752" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Each core also performs parallel work.</text><rect x="648" y="334" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="656" y="342" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.0" y="364.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">Control</text><rect x="657" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="691" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="725" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="759" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="657" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="691" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="725" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="759" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="656" y="440" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.0" y="460.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">Local storage</text><rect x="812" y="334" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="820" y="342" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.0" y="364.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">Control</text><rect x="821" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="855" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="889" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="923" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="821" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="855" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="889" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="923" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="820" y="440" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.0" y="460.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">Local storage</text><rect x="976" y="334" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="984" y="342" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052.0" y="364.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">Control</text><rect x="985" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1019" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1053" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1087" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="985" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1019" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1053" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1087" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="984" y="440" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052.0" y="460.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">Local storage</text><rect x="648" y="486" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="656" y="494" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.0" y="516.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">Control</text><rect x="657" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="691" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="725" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="759" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="657" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="691" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="725" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="759" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="656" y="592" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.0" y="612.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">Local storage</text><rect x="812" y="486" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="820" y="494" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.0" y="516.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">Control</text><rect x="821" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="855" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="889" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="923" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="821" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="855" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="889" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="923" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="820" y="592" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.0" y="612.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">Local storage</text><rect x="976" y="486" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="984" y="494" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052.0" y="516.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">Control</text><rect x="985" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1019" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1053" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1087" y="532" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="985" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1019" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1053" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="1087" y="560" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="984" y="592" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052.0" y="612.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">Local storage</text><rect x="648" y="658" width="480" height="42" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="888.0" y="687.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Shared cache</text><text x="888" y="752" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Groups of compute units repeat.</text><rect x="48" y="822" width="1104" height="88" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="858" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">A GPU distributes work across many compute units.</text><text x="600" y="891" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">This design benefits from enough independent work.</text><path d="M48,962 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1002" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="start">Conceptual only: not actual counts, areas, or performance ratios. CPU cores ≠ GPU compute units.</text></svg>