eight="700" text-anchor="middle">x2</text><text x="48" y="1116" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Earlier positions are recomputed; earlier output tokens are not selected again.</text><rect x="48" y="1170" width="22" height="22" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="82" y="1190" fill="#7954A3" font-size="23" font-weight="400" text-anchor="start">Computation cell: recompute an earlier position</text><rect x="48" y="1213" width="22" height="22" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="82" y="1233" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Computation cell: compute a new position</text></g></g><path d="M48,1284 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1322" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Without a cache, every run recomputes past positions’ K and V along with Attention and the MLP.</text></svg>