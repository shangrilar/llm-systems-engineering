<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1477" viewBox="0 0 1200 1477" role="img" aria-labelledby="title desc"><title id="title">같은 가중치를 추론 엔진의 분할에 맞춘다</title><desc id="desc">값 1에서 16의 논리 텐서를 학습 GPU 0은 왼쪽 두 열, GPU 1은 오른쪽 두 열로 보유한다. 추론 GPU 0은 위쪽 두 행, GPU 1은 아래쪽 두 행을 보유한다. 개별 텐서 수집과 이름·형식 변환 후 여러 조각을 bucket으로 전송한다. 조건에 따라 첫 bucket 전송과 다음 bucket 준비가 겹친다.</desc><metadata>{&quot;id&quot;:&quot;15-1&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1.0&quot;,&quot;url&quot;:&quot;https://github.com/radixark/miles/tree/v0.1.0&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">같은 가중치를 추론 엔진의 분할에 맞춘다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">4×4 논리 텐서의 열 분할을 행 분할로 바꾸는 교육용 예입니다. 색과 숫자는 변환 전후 같은 조각을</text><text x="48" y="173.2" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">가리킵니다.</text><path d="M48,202.2 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 238.2) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">분할은 달라도 값은 같음</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="8" y="115" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="512">학습 측 · 열 기준 2분할</text><text x="97" y="171" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start" data-max-width="115">GPU 0</text><text x="231" y="171" fill="#7954A3" font-size="21" font-weight="400" text-anchor="start" data-max-width="115">GPU 1</text><rect x="84" y="196" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="236" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">1</text><rect x="150" y="196" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="236" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">2</text><rect x="216" y="196" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="236" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">3</text><rect x="282" y="196" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="313" y="236" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">4</text><rect x="84" y="262" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="302" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">5</text><rect x="150" y="262" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="302" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">6</text><rect x="216" y="262" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="302" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">7</text><rect x="282" y="262" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="313" y="302" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">8</text><rect x="84" y="328" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="368" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">9</text><rect x="150" y="328" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="368" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">10</text><rect x="216" y="328" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="368" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">11</text><rect x="282" y="328" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="368" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">12</text><rect x="84" y="394" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="434" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">13</text><rect x="150" y="394" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="434" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">14</text><rect x="216" y="394" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="434" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">15</text><rect x="282" y="394" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="434" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">16</text><path d="M214 188 L214 468" stroke="#182C40" stroke-width="3" fill="none" stroke-dasharray="7 5"/><path d="M214 477 L214 515" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="38" y="535" width="442" height="103" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="54" y="566" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="410">같은 16개 값 · 필요한 조각 재배치</text></g><path d="M214 656 L214 696" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="8" y="742" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="512">추론 측 · 행 기준 2분할</text><rect x="84" y="782" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="822" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">1</text><rect x="150" y="782" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="822" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">2</text><rect x="216" y="782" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="822" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">3</text><rect x="282" y="782" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="313" y="822" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">4</text><rect x="84" y="848" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="115" y="888" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">5</text><rect x="150" y="848" width="62" height="62" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="181" y="888" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">6</text><rect x="216" y="848" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="247" y="888" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">7</text><rect x="282" y="848" width="62" height="62" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="313" y="888" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">8</text><rect x="84" y="914" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="954" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">9</text><rect x="150" y="914" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="954" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">10</text><rect x="216" y="914" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="954" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">11</text><rect x="282" y="914" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="954" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">12</text><rect x="84" y="980" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="115" y="1020" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">13</text><rect x="150" y="980" width="62" height="62" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="181" y="1020" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">14</text><rect x="216" y="980" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="247" y="1020" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">15</text><rect x="282" y="980" width="62" height="62" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="313" y="1020" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle" data-max-width="56">16</text><path d="M74 912 L358 912" stroke="#182C40" stroke-width="3" fill="none" stroke-dasharray="7 5"/><text x="372" y="851" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start" data-max-width="130">GPU 0</text><text x="372" y="982" fill="#287D78" font-size="21" font-weight="400" text-anchor="start" data-max-width="130">GPU 1</text><text x="8" y="1120" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="504">점선 = GPU 사이의 shard 경계</text></g><g transform="translate(624 238.2) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">텐서에서 전송 단위로</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="103" width="488" height="128" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="134" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">① 가중치 조각 모으기</text><text x="32" y="174" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">여러 학습 GPU에서 필요한 조각을 모음</text></g><path d="M260 244 L260 275" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="16" y="294" width="488" height="128" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="325" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">② 추론 형식에 맞춤</text><text x="32" y="365" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">추론 GPU에 맞게 분할과 저장 형식을 변환</text></g><path d="M260 434 L260 465" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="483" width="488" height="164" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="514" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">③ 조각을 bucket으로 묶음</text><text x="32" y="554" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">여러 텐서의 조각을 담는 전송 단위. 하나의 모델</text><text x="32" y="582" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">전체와 같지 않음</text></g><text x="16" y="704" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">조건에 따라 준비와 전송을 겹침</text><path d="M154 764 L496 764" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="412" y="747" fill="#182C40" font-size="19" font-weight="400" text-anchor="start" data-max-width="90">시간</text><text x="16" y="817" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="135">Bucket 1</text><rect x="154" y="782" width="108" height="52" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="208" y="816" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="96">준비</text><rect x="268" y="782" width="222" height="52" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="379" y="816" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="210">전송</text><text x="16" y="897" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="135">Bucket 2</text><rect x="268" y="862" width="108" height="52" rx="8" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="322" y="896" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle" data-max-width="96">준비</text><rect x="382" y="862" width="108" height="52" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="436" y="896" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="96">전송</text><path d="M268 848 L376 848" stroke="#5C6C7C" stroke-width="2" fill="none" stroke-dasharray="7 5"/><path d="M268 841 L268 855" stroke="#5C6C7C" stroke-width="2" fill="none"/><path d="M376 841 L376 855" stroke="#5C6C7C" stroke-width="2" fill="none"/><text x="16" y="974" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">점선 구간: B1 전송 중 B2 준비 가능</text><text x="16" y="1082" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">막대 길이는 실측 시간이 아닙니다. 실제 중첩은</text><text x="16" y="1111.4" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="488">buffer·stream·전송 구현에 달려 있습니다.</text></g></svg>