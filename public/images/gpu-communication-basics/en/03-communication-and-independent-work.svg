<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc"><title id="title">Independent Work While Waiting for Data</title><desc id="desc">Two GPU 1 executions after A completes are compared on the same time scale. In one stream receive, C and B run sequentially. In two streams the receive and independent C overlap. Event E is recorded after the receive. The compute stream waits for E after C, then executes B. Each transfer and computation has the same length in both cases. Overall completion includes both B and C. This example assumes hardware and resources allow overlap.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1340" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 13 · Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Independent Work While Waiting for Data</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Wait for required data while independent computation can proceed alongside it.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="205" width="1104" height="108" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="247" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">After A completes · Same transfer and computations B and C</text><text x="600" y="287" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">C is independent of x · Resources allow both streams to run concurrently</text><text x="48" y="369" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Sequential operations in one stream</text><path d="M250,415 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="400" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="492" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="528" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Stream S</text><rect x="250" y="457" width="350" height="90" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="425.0" y="511.0" fill="#4C60A8" font-size="28" font-weight="600" text-anchor="middle">Receive</text><rect x="600" y="457" width="190" height="90" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="695.0" y="511.0" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">Compute C</text><rect x="790" y="457" width="250" height="90" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="915.0" y="511.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Compute B</text><path d="M1040,558 V584" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="1040" y="616" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">B and C complete</text><text x="48" y="689" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Communication and independent work in separate streams</text><text x="48" y="729" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">GPU 1&#x27;s communication stream records event E after the receive.</text><path d="M250,778 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="763" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="858" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="894" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Comm. stream</text><rect x="250" y="822" width="350" height="88" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="425.0" y="875.0" fill="#4C60A8" font-size="28" font-weight="600" text-anchor="middle">Receive</text><path d="M600,910 V933" fill="none" stroke="#4C60A8" stroke-width="2"/><circle cx="600" cy="943" r="8" fill="#B55B22"/><text x="629" y="952" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">Event E completes</text><path d="M600,956 V1001" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)"/><text x="48" y="1059" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU 1</text><text x="48" y="1095" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Compute stream</text><rect x="250" y="1016" width="190" height="90" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="345.0" y="1070.0" fill="#7954A3" font-size="27" font-weight="600" text-anchor="middle">Compute C</text><rect x="440" y="1016" width="160" height="90" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="520.0" y="1055.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Event E</text><text x="520.0" y="1090.0" fill="#B55B22" font-size="22" font-weight="400" text-anchor="middle">Wait to finish</text><rect x="600" y="1016" width="250" height="90" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="725.0" y="1070.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Compute B</text><path d="M850,1117 V1144" fill="none" stroke="#287D78" stroke-width="2" stroke-dasharray="7 7"/><text x="850" y="1176" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">B and C complete</text><rect x="48" y="1220" width="1104" height="82" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1265" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">B executes after both the receive and C complete.</text></svg>