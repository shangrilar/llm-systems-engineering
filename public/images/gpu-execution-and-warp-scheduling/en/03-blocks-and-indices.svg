<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1270" viewBox="0 0 1200 1270" role="img" aria-labelledby="title desc"><title id="title">Find Data Positions with Block and Thread IDs</title><desc id="desc">Assign one thread to each of 1,024 outputs and group 128 threads per block, forming eight blocks in a grid. Thread IDs 0, 1, and 127 in block 0 handle i=0, 1, and 127; the same thread IDs in block 1 handle i=128, 129, and 255. The mapping is i=block ID times 128 plus thread ID within the block. Thread 0 in block 1 adds A[128] and B[128] and stores the result in C[128]. Blocks 2 through 7 also contain 128 threads each.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1270" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Find Data Positions with Block and Thread IDs</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Process 1,024 outputs using 8 blocks of 128 threads each.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="211" width="1104" height="565" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="76" y="255" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Grid · all blocks in one kernel execution</text><rect x="72" y="283" width="516" height="261" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5" /><text x="330" y="326" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Block ID 0 · 128 threads</text><text x="330" y="369" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Thread ID within the block</text><rect x="96" y="394" width="120" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="156.0" y="428.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">0</text><path d="M156,454 L156,476" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><text x="156" y="510" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">i = 0</text><rect x="270" y="394" width="120" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="330.0" y="428.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">1</text><path d="M330,454 L330,476" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><text x="330" y="510" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">i = 1</text><rect x="444" y="394" width="120" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="504.0" y="428.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">127</text><path d="M504,454 L504,476" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" /><text x="504" y="510" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">i = 127</text><text x="405" y="433" fill="#5C6C7C" font-size="26" font-weight="400" text-anchor="middle">⋯</text><text x="330" y="582" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Assigned positions 0–127</text><rect x="612" y="283" width="516" height="261" rx="12" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5" /><text x="870" y="326" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">Block ID 1 · 128 threads</text><text x="870" y="369" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Thread ID within the block</text><rect x="636" y="394" width="120" height="52" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="696.0" y="428.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">0</text><path d="M696,454 L696,476" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" /><text x="696" y="510" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">i = 128</text><rect x="810" y="394" width="120" height="52" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="870.0" y="428.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">1</text><path d="M870,454 L870,476" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" /><text x="870" y="510" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">i = 129</text><rect x="984" y="394" width="120" height="52" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="1044.0" y="428.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">127</text><path d="M1044,454 L1044,476" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" /><text x="1044" y="510" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">i = 255</text><text x="945" y="433" fill="#5C6C7C" font-size="26" font-weight="400" text-anchor="middle">⋯</text><text x="870" y="582" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">Assigned positions 128–255</text><rect x="68" y="615" width="164" height="108" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="150" y="655" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Block ID 2</text><text x="150" y="696" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">128 threads</text><rect x="248" y="615" width="164" height="108" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="330" y="655" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Block ID 3</text><text x="330" y="696" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">128 threads</text><rect x="428" y="615" width="164" height="108" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="510" y="655" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Block ID 4</text><text x="510" y="696" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">128 threads</text><rect x="608" y="615" width="164" height="108" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="690" y="655" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Block ID 5</text><text x="690" y="696" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">128 threads</text><rect x="788" y="615" width="164" height="108" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="870" y="655" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Block ID 6</text><text x="870" y="696" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">128 threads</text><rect x="968" y="615" width="164" height="108" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="1050" y="655" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Block ID 7</text><text x="1050" y="696" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">128 threads</text><text x="600" y="753" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Developer-chosen group size: 128 threads per block · 8 blocks total</text><text x="600" y="825" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">Assigned position i = block ID × 128 + thread ID within the block</text><rect x="48" y="865" width="258" height="177" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="177" y="905" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Block ID 0</text><text x="177" y="946" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Thread ID 0</text><text x="177" y="1003" fill="#2470BB" font-size="31" font-weight="700" text-anchor="middle">i = 0</text><rect x="330" y="865" width="258" height="177" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="459" y="905" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Block ID 0</text><text x="459" y="946" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Thread ID 1</text><text x="459" y="1003" fill="#2470BB" font-size="31" font-weight="700" text-anchor="middle">i = 1</text><rect x="612" y="865" width="258" height="177" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="741" y="905" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Block ID 1</text><text x="741" y="946" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Thread ID 0</text><text x="741" y="1003" fill="#287D78" font-size="31" font-weight="700" text-anchor="middle">i = 128</text><rect x="894" y="865" width="258" height="177" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="1023" y="905" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Block ID 1</text><text x="1023" y="946" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">Thread ID 1</text><text x="1023" y="1003" fill="#287D78" font-size="31" font-weight="700" text-anchor="middle">i = 129</text><path d="M741,1055 L741,1101" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" /><rect x="48" y="1117" width="1104" height="103" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="1155" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle">The computation performed by block 1, thread 0</text><text x="600" y="1198" fill="#287D78" font-size="31" font-weight="700" text-anchor="middle">A[128] + B[128] → C[128]</text></svg>