<svg xmlns="http://www.w3.org/2000/svg" width="360" height="2406" viewBox="0 0 360 2406" role="img" aria-labelledby="title desc"><title id="title">Token IDs set the address; hidden state sets the gate</title><desc id="desc">Original token IDs split into two paths: standard embedding and preceding backbone produce h_t; separate canonicalization, suffix hashing and learned table lookup produce e_t. The enlargement projects e_t through W_K and W_V. RMS-normalized h_t and k_t feed a dot product divided by √d and sigmoid, producing scalar α_t, which multiplies v_t to form the gated value.</desc><metadata>{&quot;id&quot;:&quot;ma-20-02&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Engram §2.2–2.4, Eqs. 1–4&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2601.07372v1#S2.SS3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 2 · Lookup and context</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">Token IDs set the address;</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">hidden state sets the gate</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">One position t in Engram · A prepares</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">two inputs → C joins them with a</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">context gate</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Two paths from the same IDs</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Original token IDs</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">x_1, …, x_t</text></g><path d="M260 225 L260 260" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M260 260 H120 V305" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 260 H385 V305" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="10" y="315" width="220" height="105" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="346" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Embedding</text></g><path d="M120 430 L120 485" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="10" y="495" width="220" height="150" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="526" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Preceding</text><text x="26" y="556.8" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">backbone</text><text x="26" y="597" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">Includes context</text></g><path d="M120 655 L120 930" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="270" y="315" width="230" height="145" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="346" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Canonical IDs</text><text x="286" y="386" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Lookup path only</text></g><path d="M385 470 L385 520" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="270" y="530" width="230" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="561" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Suffix + Hash</text><text x="286" y="601" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Compute several</text><text x="286" y="629" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">addresses</text></g><path d="M385 680 L385 735" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="270" y="745" width="230" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="286" y="776" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Learned tables</text><text x="286" y="816" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Read rows → concat</text></g><path d="M385 895 L385 930" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="20" y="940" width="200" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="120" y="983" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="188">h_t [d]</text><rect x="270" y="940" width="230" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="385" y="983" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="218">e_t [d_mem]</text></g><g transform="translate(16 965.9692307692308) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. A table per order × head</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="110" width="480" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="260" y="150.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">… A B C</text><rect x="20" y="235" width="480" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="270.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">2-gram (B,C)</text><path d="M135 300 L135 330" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="25" y="340" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="41" y="371" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 2,1</text><text x="41" y="411" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 1 → v1</text></g><path d="M395 300 L395 330" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="285" y="340" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="371" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 2,2</text><text x="301" y="411" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 2 → v2</text></g><rect x="20" y="525" width="480" height="55" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="560.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">3-gram (A,B,C)</text><path d="M135 590 L135 620" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="25" y="630" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="41" y="661" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 3,1</text><text x="41" y="701" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 1 → v3</text></g><path d="M395 590 L395 620" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="285" y="630" width="220" height="105" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="301" y="661" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">Table 3,2</text><text x="301" y="701" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">hash 2 → v4</text></g><rect x="20" y="790" width="480" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="260" y="828" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="468">Concat [v1 | v2 | v3 | v4]</text><path d="M25 455 H8 V775 H125 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M505 455 H515 V775 H395 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M135 735 V760 H255 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/><path d="M395 735 V760 H265 V780" stroke="#287D78" stroke-width="2" fill="none" marker-end="url(#arrow-teal)"/></g><g transform="translate(16 1542.7384615384615) scale(0.6307692307692307)" data-panel="3"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">C. Context gates the value</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="205" y="110" width="295" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="352.5" y="153" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="283">e_t [d_mem]</text><path d="M352 190 L352 220" stroke="#287D78" stroke-width="2.5" fill="none"/><path d="M352 220 H260 V270" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M352 220 H440 V270" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="185" y="280" width="150" height="100" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="201" y="311" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="118">W_K</text><text x="201" y="351" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="118">Compare</text></g><g data-container="true"><rect x="365" y="280" width="150" height="100" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="381" y="311" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="118">W_V</text><text x="381" y="351" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="118">Apply</text></g><path d="M260 390 L260 435" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M440 390 L440 435" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="10" y="445" width="145" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="82.5" y="485.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="133">h_t [d]</text><rect x="185" y="445" width="150" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="485.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="138">k_t [d]</text><rect x="365" y="445" width="150" height="65" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="440" y="485.5" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="138">v_t [d]</text><path d="M82 520 L82 570" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 520 L260 570" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="10" y="580" width="145" height="95" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="611" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="113">RMSNorm</text></g><g data-container="true"><rect x="185" y="580" width="150" height="95" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="201" y="611" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="118">RMSNorm</text></g><path d="M82 685 V735 H130 V780" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><path d="M260 685 V735 H240 V780" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="790" width="315" height="95" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="821" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="283">Dot product ÷ √d</text></g><path d="M177 895 L177 935" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="20" y="945" width="315" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="177.5" y="985.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="303">sigmoid → α_t</text><path d="M177 1020 L177 1090" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M440 520 V1120 H215" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><circle cx="177" cy="1120" r="30" fill="#FFF2E6" stroke="#B55B22"/><text x="177" y="1129" fill="#B55B22" font-size="29" font-weight="400" text-anchor="middle" data-max-width="40">×</text><path d="M177 1160 L177 1210" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="20" y="1220" width="315" height="65" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="177.5" y="1260.5" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="303">ṽ_t [d] = α_t v_t</text></g></svg>