<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="851" viewBox="0 0 1200 851" role="img" aria-labelledby="title desc"><title id="title">Check memory before comparing speed</title><desc id="desc">With 24 GiB GPUs, 32 GiB weights and 8 GiB extra state, per-GPU totals are 40, 24 and 16 GiB.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="851" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Check memory before comparing speed</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">An assumed capacity example, not a benchmark of a real model.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="194" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="230.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Usable memory: 24 GiB per GPU / model weights: 32 GiB</text><text x="72" y="270.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Assume 8 GiB per GPU for request state, activations, and temporary storage</text><rect x="48" y="344" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Deployment</text><rect x="328" y="344" width="244" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Weights / GPU</text><rect x="578" y="344" width="288" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Total / GPU</text><rect x="872" y="344" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="381.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Decision</text><rect x="48" y="410" width="274" height="103" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">DP × 4</text><rect x="328" y="410" width="244" height="103" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">32 GiB</text><rect x="578" y="410" width="288" height="103" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">32 + 8 = 40 GiB</text><rect x="872" y="410" width="274" height="103" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="444.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Too large</text><rect x="48" y="521" width="274" height="103" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">TP 2 × DP 2</text><rect x="328" y="521" width="244" height="103" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">16 GiB</text><rect x="578" y="521" width="288" height="103" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">16 + 8 = 24 GiB</text><rect x="872" y="521" width="274" height="103" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="555.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">No headroom</text><rect x="48" y="632" width="274" height="103" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">TP 4 × DP 1</text><rect x="328" y="632" width="244" height="103" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">8 GiB</text><rect x="578" y="632" width="288" height="103" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="592" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">8 + 8 = 16 GiB</text><rect x="872" y="632" width="274" height="103" rx="10" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="886" y="666.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">8 GiB headroom</text><text x="48" y="795.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">Fitting the weights alone does not establish that the workload fits.</text></svg>