<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1242" viewBox="0 0 1200 1242" role="img" aria-labelledby="title desc"><title id="title">Image summaries and patch features serve different roles</title><desc id="desc">Classification and image–text comparison may use a summary from CLS or pooling. A VLM can instead receive hidden states at multiple spatial positions. An image-level loss can train patch representations through the encoder without explicit labels for every patch. The selected layer and summary method vary by model.</desc><metadata>{&quot;id&quot;:&quot;ma-21-06&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ViT&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2010.11929&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 6 · Vision</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Image summaries and patch features serve different roles</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Distinguish a training summary from the sequence sent to a VLM</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. Summarize the whole image</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Vision encoder representations</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Informed by multiple patch positions</text></g><path d="M135 240 L135 290" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M385 240 L385 290" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="300" width="230" height="170" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="331" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Select CLS output</text><text x="36" y="371" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">CLS is processed</text><text x="36" y="399" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">with patches from</text><text x="36" y="427" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">input</text></g><g data-container="true"><rect x="270" y="300" width="230" height="170" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="286" y="331" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">Pool patch</text><text x="286" y="361.8" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="198">outputs</text><text x="286" y="402" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">Aggregate patch</text><text x="286" y="430" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="198">rows</text></g><path d="M135 480 L215 525" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><path d="M385 480 L305 525" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="100" y="540" width="320" height="70" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="583" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="308">One image vector</text><path d="M260 620 L260 660" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="670" width="480" height="155" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="701" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Classification / image–text comparison</text><text x="36" y="741" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Compute loss with image-level supervision</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. Pass spatial features</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="120" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Vision encoder representations</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Informed by multiple patch positions</text></g><path d="M260 240 L260 290" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="260" y="335" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="400">Z [4, dᵥ]</text><rect x="60" y="375" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="408" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_A  ·  dᵥ</text><rect x="60" y="440" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="473" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_B  ·  dᵥ</text><rect x="60" y="505" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="538" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_C  ·  dᵥ</text><rect x="60" y="570" width="400" height="50" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="603" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="388">z_D  ·  dᵥ</text><path d="M260 650 L260 700" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="715" width="480" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="746" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">Connect to the LM: next article</text><text x="36" y="786" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Reduce count → projector → input sequence</text></g></g></svg>