 the selected token to the next input</text><text x="48" y="490" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Generate x1</text><rect x="48" y="525" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86" y="562" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="525" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174" y="562" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="525" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262" y="562" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="312" y="525" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="350" y="562" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><path d="M402,553 L694,553" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="704" y="507" width="180" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="794" y="548" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">Model</text><text x="794" y="589" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Prediction scores</text><path d="M896,553 L1034,553" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="965" y="532" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Select</text><rect x="1044" y="525" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087" y="562" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><text x="48" y="623" fill="#2470BB" font-size="23" font-weight="400" text-anchor="start">Input context</text><path d="M1087,592 V666 H438 V787" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="470" y="709" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Append the selected token to the next input</text><text x="48" y="760" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Generate x2</text><rect x="48" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="86" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="136" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="174" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="224" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="262" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="312" y="795" width="76" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350" y="832" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">x0</text><rect x="400" y="795" width="76" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="438" y="832" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x1</text><path d="M490,823 L694,823" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="704" y="777" width="180" height="108" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="794" y="818" fill="#2470BB" font-size="28" font-weight="700" text-anchor="middle">Model</text><text x="794" y="859" fill="#2470BB" font-size="21" font-weight="400" text-anchor="middle">Prediction scores</text><path d="M896,823 L1034,823" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="965" y="802" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Select</text><rect x="1044" y="795" width="86" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="1087" y="832" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x2</text><text x="48" y="893" fill="#2470BB" font-size="23" font-weight="400" text-anchor="start">Input context</text><text x="48" y="975" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">Each execution selects the next token from scores at its final input position.</text><text x="48" y="1040" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Input context is the information generation uses. The next figure shows which positions</text><text x="48" y="1070.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">are computed.</text></g></g><path d="M48,1154.2 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1192.2" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The next input token is known only after the current token is chosen.</text></svg>