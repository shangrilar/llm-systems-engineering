<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Reducing Copies with GPUDirect RDMA</title><desc id="desc">With GPUDirect RDMA support, the sending NIC reads x produced by A directly from GPU 0 memory through PCIe and sends it across the network. The receiving NIC writes x into GPU 1 memory through PCIe. B runs after receive completion. The data does not use intermediate CPU-memory buffers. The figure does not specify whether the CPU participates in transfer control.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1120" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 15 · Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Reducing Copies with GPUDirect RDMA</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">The NIC directly accesses GPU memory, bypassing intermediate CPU buffers.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="210" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="250" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Environment with GPUDirect RDMA support</text><rect x="48" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Server 0</text><rect x="632" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Server 1</text><rect x="96" y="365" width="424" height="82" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308.0" y="400.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 · Compute A</text><text x="308.0" y="435.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Produce x to send</text><rect x="680" y="365" width="424" height="82" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="892.0" y="400.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">GPU 1 · Compute B</text><text x="892.0" y="435.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Run after receive completes</text><rect x="96" y="520" width="424" height="106" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308.0" y="567.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 memory</text><text x="308.0" y="602.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">A produced x = [1, 2, 3, 4]</text><rect x="680" y="520" width="424" height="106" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="567.0" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">GPU 1 memory</text><text x="892.0" y="602.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">x arrives in receive buffer</text><path d="M308,456 V510" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M892,510 V457" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="176" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308.0" y="952.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="308.0" y="987.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Network send/receive</text><rect x="760" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="952.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="892.0" y="987.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Network send/receive</text><path d="M308,637 V889" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="342" y="698" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">PCIe</text><text x="342" y="738" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">NIC</text><text x="342" y="774" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">reads x</text><path d="M892,889 V637" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="926" y="698" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">PCIe</text><text x="926" y="738" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">NIC</text><text x="926" y="774" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">writes x</text><path d="M440,958 H749" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="600" y="924" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Network</text><text x="600" y="998" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Transfer x</text></svg>