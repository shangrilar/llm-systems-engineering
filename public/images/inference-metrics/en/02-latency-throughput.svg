<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1036" viewBox="0 0 1200 1036" role="img" aria-labelledby="title desc"><title id="title">Distinguish latency and throughput denominators</title><desc id="desc">Three outputs give TTFT 100ms, ITLs 30/40ms, last-token TPOT 35ms, and E2E 180ms. Three requests and 10 output tokens over 10s give 0.3req/s and 1tok/s.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1036" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Distinguish latency and throughput denominators</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Left: one request’s trace. Right: a separate count over the server’s observation</text><text x="48" y="140.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">window.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><g data-panel="true"><rect x="48" y="197" width="530" height="445" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="233.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">One request A: time intervals</text><text x="68" y="281.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Send 0 ms · tokens 100 / 130 / 170 ms</text><text x="68" y="313.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Completion 180 ms · 3 output tokens</text><text x="68" y="345.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="68" y="377.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">TTFT = 100 − 0 = 100 ms</text><text x="68" y="409.79999999999995" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">ITL = 30 ms, 40 ms</text><text x="68" y="442.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">TPOT = (170 − 100) / (3 − 1)</text><text x="68" y="474.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">= 35 ms/token</text><text x="68" y="506.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">E2E = 180 − 0 = 180 ms</text></g><g data-panel="true"><rect x="622" y="197" width="530" height="445" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="642" y="233.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Whole server: a 10-second window</text><text x="642" y="281.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">A, B, C all finish within this window</text><text x="642" y="313.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Output tokens: A 3 · B 5 · C 2</text><text x="642" y="345.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start"></text><text x="642" y="377.6" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Request throughput = 3 / 10</text><text x="642" y="409.79999999999995" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">= 0.3 req/s</text><text x="642" y="442.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Output throughput = (3 + 5 + 2) / 10</text><text x="642" y="474.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">= 1 tok/s</text><text x="642" y="506.4" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">Input tokens are not in this</text><text x="642" y="538.5999999999999" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">numerator</text></g><g data-panel="true"><rect x="48" y="685" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="720.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Check the end boundary in the TPOT definition.</text><text x="72" y="762.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">This article uses the last token at 170 ms. Using completion at 180 ms gives</text><text x="72" y="794.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">TPOT 40 ms.</text></g><g data-panel="true"><rect x="48" y="851" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="886.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">The reciprocal of request latency is not whole-server throughput.</text><text x="72" y="928.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">These are arithmetic examples. One request cannot establish latency percentiles</text><text x="72" y="960.2" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">such as p95/p99.</text></g></svg>