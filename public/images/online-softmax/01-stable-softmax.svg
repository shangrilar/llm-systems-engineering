<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1336" viewBox="0 0 1200 1336" role="img" aria-labelledby="title desc"><title id="title">최댓값을 빼서 안정적으로 계산하기</title><desc id="desc">점수 1000,1001,1002의 소프트맥스를 비교한다. 직접 exp를 계산하면 FP32와 FP64 범위를 넘어서 유효한 확률을 계산할 수 없다. 모든 점수에서 최댓값 1002를 빼면 -2,-1,0이고 exp 값은 약 0.135,0.368,1이다. 합 약 1.503으로 나누면 약 9.0%,24.5%,66.5%이다. 분자와 분모에 같은 양수 exp(-max)를 곱하므로 실수 연산에서 확률은 동일하다. 부동소수점의 비트 단위 동일성을 뜻하지 않는다. 유한한 점수 예시이며 반올림한 수치다.</desc><metadata>{&quot;id&quot;:&quot;01-stable-softmax&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">최댓값을 빼서 안정적으로 계산하기</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">소프트맥스 복습: 점수에 exp 적용 → 모두 더하기 → 각 값을 합으로 나누기</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="207" width="536" height="853" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="316" y="253" fill="#B55B22" font-size="29" font-weight="700" text-anchor="middle">원래 점수로 계산</text><text x="76" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">점수</text><rect x="96" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.33333333333331" y="358" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="242.66666666666666" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="311" y="358" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1001</text><rect x="389.3333333333333" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="457.66666666666663" y="358" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1002</text><path d="M316,439 L316,459" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="316" y="426" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">점수를 그대로 사용</text><rect x="96" y="474" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.33333333333331" y="515" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="242.66666666666666" y="474" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311" y="515" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1001</text><rect x="389.3333333333333" y="474" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="457.66666666666663" y="515" fill="#B55B22" font-size="27" font-weight="600" text-anchor="middle">1002</text><path d="M316,553 L316,601" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#arrow-orange)"/><text x="76" y="590" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">exp 적용</text><rect x="96" y="622" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="164.33333333333331" y="663" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">exp(1000)</text><rect x="242.66666666666666" y="622" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311" y="663" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">exp(1001)</text><rect x="389.3333333333333" y="622" width="136.66666666666666" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="457.66666666666663" y="663" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">exp(1002)</text><text x="316" y="727" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">FP32·FP64에서 표현 범위를 넘음</text><path d="M316,745 L316,786" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#arrow-orange)"/><rect x="96" y="806" width="430" height="64" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311" y="846" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">exp 값의 합도 표현 불가</text><text x="316" y="909" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">각 exp 값을 합으로 나누기</text><rect x="96" y="938" width="430" height="66" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="311" y="979" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">유효한 확률을 계산할 수 없음</text><rect x="616" y="207" width="536" height="853" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="884" y="253" fill="#287D78" font-size="29" font-weight="700" text-anchor="middle">max를 빼고 계산</text><text x="644" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">점수</text><rect x="664" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="358" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1000</text><rect x="810.6666666666666" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="879" y="358" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1001</text><rect x="957.3333333333333" y="317" width="136.66666666666666" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="358" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">1002</text><path d="M884,439 L884,459" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="884" y="426" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">모든 점수에서 max = 1002 빼기</text><rect x="664" y="474" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="515" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">-2</text><rect x="810.6666666666666" y="474" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879" y="515" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">-1</text><rect x="957.3333333333333" y="474" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="515" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">0</text><path d="M884,553 L884,601" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="644" y="590" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">exp 적용</text><rect x="664" y="622" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="663" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">0.135</text><rect x="810.6666666666666" y="622" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879" y="663" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">0.368</text><rect x="957.3333333333333" y="622" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="663" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">1</text><text x="884" y="727" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">가장 큰 exp 값은 1</text><path d="M884,745 L884,786" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><rect x="664" y="806" width="430" height="64" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879" y="846" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">합 ≈ 1.503</text><text x="884" y="909" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">각 exp 값을 합으로 나누기</text><rect x="664" y="938" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="732.3333333333334" y="979" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">9.0%</text><rect x="810.6666666666666" y="938" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="879" y="979" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">24.5%</text><rect x="957.3333333333333" y="938" width="136.66666666666666" height="66" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1025.6666666666665" y="979" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">66.5%</text><rect x="48" y="1093" width="1104" height="121" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="600" y="1139" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">분자와 분모에 같은 배율 exp(−max)가 적용됩니다.</text><text x="600" y="1184" fill="#287D78" font-size="25" font-weight="400" text-anchor="middle">수학적으로 같은 확률을, 크기가 제한된 exp 값으로 계산합니다.</text></g></g><path d="M48,1258 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1296" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">실수 연산 기준으로 같은 확률이며, 부동소수점 결과가 비트 단위로 같다는 뜻은 아닙니다. 소수는 반올림한 값입니다.</text></svg>