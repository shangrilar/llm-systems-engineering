a-max-width="328">로그 눈금: 막대 길이는 합계, 막대 안의 칸은 KV와 검색용</text><text x="0" y="592.8" fill="#5C6C7C" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">key의 비율입니다.</text><text x="0" y="615.6" fill="#5C6C7C" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">층마다 필요한 KV와 검색 후보 key를 한 번씩 센 양 · 실측</text><text x="0" y="632.4" fill="#5C6C7C" font-size="12" font-weight="400" text-anchor="start" data-max-width="328">아님</text></g></svg>