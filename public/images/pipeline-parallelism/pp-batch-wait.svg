<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="987" viewBox="0 0 1200 987" role="img" aria-labelledby="title desc"><title id="title">배치를 통째로 넘기면 GPU들이 차례로 계산합니다</title><desc id="desc">GPU 0부터 3까지 배치 A·B·C·D를 각각 4칸씩 차례로 계산한다. 각 구간에서 GPU 하나만 계산하고 나머지 세 개는 이 배치를 계산하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="987" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">배치를 통째로 넘기면 GPU들이 차례로 계산합니다</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">입력 하나의 토큰을 자르지 않고, 네 입력을 함께 다음 단계로 전달합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="600" y="207.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">배치 크기 4: 입력 A·B·C·D를 한 묶음으로 실행</text><rect x="134" y="235" width="206" height="85" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="148" y="264.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="start">A</text><rect x="149.0" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="184.2" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="219.4" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="254.6" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="289.8" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><rect x="371" y="235" width="206" height="85" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="385" y="264.0" fill="#287D78" font-size="23" font-weight="700" text-anchor="start">B</text><rect x="386.0" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="421.2" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="456.4" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="491.6" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="526.8" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><rect x="608" y="235" width="206" height="85" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="622" y="264.0" fill="#7954A3" font-size="23" font-weight="700" text-anchor="start">C</text><rect x="623.0" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="658.2" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="693.4" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="728.6" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="763.8" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#7954A3" stroke-width="1.5"/><rect x="845" y="235" width="206" height="85" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="859" y="264.0" fill="#B55B22" font-size="23" font-weight="700" text-anchor="start">D</text><rect x="860.0" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="895.2" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="930.4" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="965.6" y="280" width="33.2" height="23" rx="10" fill="white" stroke="#B55B22" stroke-width="1.5"/><rect x="1000.8" y="280" width="33.2" 