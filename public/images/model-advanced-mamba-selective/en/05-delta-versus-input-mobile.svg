 data-container="true"><rect x="60" y="655" width="400" height="105" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="76" y="686" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="368">Transform input with B̄ₜ</text></g><path d="M260 770 L260 800" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="60" y="815" width="400" height="100" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="76" y="846" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="368">Current input contribution</text><text x="76" y="886" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="368">B̄ₜ uₜ</text></g><path d="M260 925 L260 940" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><circle cx="260" cy="970" r="23" fill="#FFFFFF" stroke="#287D78"/><text x="260" y="979" fill="#182C40" font-size="30" font-weight="400" text-anchor="middle" data-max-width="45">+</text><path d="M260 1005 L260 1040" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="90" y="1055" width="340" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="1093" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="328">New state</text><path d="M260 1125 L260 1160" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="60" y="1175" width="400" height="75" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="76" y="1206" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="368">Read output with Cₜ</text></g></g></svg>