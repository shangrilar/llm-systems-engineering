<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1013" viewBox="0 0 1200 1013" role="img" aria-labelledby="title desc"><title id="title">토큰 순서와 저장 위치를 분리하기</title><desc id="desc">A의 논리 블록 L0, L1, L2가 각각 물리 블록 P3, P0, P5에 대응합니다. 각 블록은 4토큰의 K와 V를 저장하며 마지막에는 2칸이 남습니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1013" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">토큰 순서와 저장 위치를 분리하기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">블록 크기 4의 교육용 예시입니다. A·B는 각자 KV 블록을 소유합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="207.0" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">요청 A: 토큰 10개 → 논리 블록 3개</text><g data-panel="true"><rect x="48" y="240" width="352" height="151" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="276.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">L0</text><text x="68" y="324.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">t0 t1 t2 t3</text></g><path d="M224,404 L224,449" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="48" y="467" width="352" height="83" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="519.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">L0 → P3</text><g data-panel="true"><rect x="424" y="240" width="352" height="151" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="444" y="276.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">L1</text><text x="444" y="324.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">t4 t5 t6 t7</text></g><path d="M600,404 L600,449" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="424" y="467" width="352" height="83" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="519.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">L1 → P0</text><g data-panel="true"><rect x="800" y="240" width="352" height="151" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="820" y="276.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">L2</text><text x="820" y="324.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">t8 t9 — —</text></g><path d="M976,404 L976,449" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="800" y="467" width="352" height="83" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="519.0" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">L2 → P5</text><text x="48" y="598.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">블록 테이블: 논리적 순서에서 물리 주소를 찾습니다.</text><text x="48" y="666.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 물리 블록 풀 · 각 블록은 4토큰의 K와 V 저장</text><rect x="48" y="705" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="64" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P0</text><text x="64" y="777.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L1</text><rect x="232" y="705" width="168" height="97" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="248" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P1</text><text x="248" y="777.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">B · L0</text><rect x="416" y="705" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="432" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P2</text><text x="432" y="777.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">비어 있음</text><rect x="600" y="705" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="616" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P3</text><text x="616" y="777.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L0</text><rect x="784" y="705" width="168" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="800" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P4</text><text x="800" y="777.0" fill="#526577" font-size="24" font-weight="700" text-anchor="start">비어 있음</text><rect x="968" y="705" width="168" height="97" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="984" y="737.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">P5</text><text x="984" y="777.0" fill="#2470BB" font-size="24" font-weight="700" text-anchor="start">A · L2</text><g data-panel="true"><rect x="48" y="851" width="1104" height="135" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="886.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Attention은 P3 → P0 → P5의 KV를 논리적 순서로 참조</text><text x="72" y="928.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">물리 블록은 이어 붙어 있지 않아도 됩니다. 마지막 블록의 두 칸은 남습니다.</text></g></svg>