<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Sending Across Servers via CPU Memory</title><desc id="desc">An example path using intermediate CPU-memory buffers. On server 0, x produced by A on GPU 0 is copied to CPU memory and read by the NIC for network transfer. On server 1 the NIC writes x to CPU memory, then it is copied to GPU 1 memory. B runs once the receive completes and x is usable. CPU memory does not mean CPU threads copy each element. GPU memory, NICs and the network have the same positions in the next figure.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="comm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1120" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 15 · Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Sending Across Servers via CPU Memory</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">A NIC sends and receives network data. Start with an intermediate-buffer path.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="210" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="250" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Path using CPU memory as an intermediate buffer</text><rect x="48" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Server 0</text><rect x="632" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Server 1</text><rect x="96" y="365" width="424" height="82" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308.0" y="400.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 · Compute A</text><text x="308.0" y="435.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Produce x to send</text><rect x="680" y="365" width="424" height="82" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="892.0" y="400.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">GPU 1 · Compute B</text><text x="892.0" y="435.0" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Run after receive completes</text><rect x="96" y="520" width="424" height="106" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308.0" y="567.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 memory</text><text x="308.0" y="602.0" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">A produced x = [1, 2, 3, 4]</text><rect x="680" y="520" width="424" height="106" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="567.0" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">GPU 1 memory</text><text x="892.0" y="602.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">x arrives in receive buffer</text><path d="M308,456 V510" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><path d="M892,510 V457" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="176" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308.0" y="952.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="308.0" y="987.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Network send/receive</text><rect x="760" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892.0" y="952.0" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="892.0" y="987.0" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Network send/receive</text><rect x="96" y="722" width="424" height="108" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="308.0" y="770.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">CPU memory</text><text x="308.0" y="805.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">x in intermediate buffer</text><rect x="680" y="722" width="424" height="108" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="892.0" y="770.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">CPU memory</text><text x="892.0" y="805.0" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle">x in intermediate buffer</text><path d="M308,637 V711" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><path d="M308,841 V889" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><path d="M892,711 V637" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><path d="M892,889 V841" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="342" y="663" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="start">Staging copy</text><text x="342" y="699" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">PCIe</text><text x="926" y="663" fill="#4C60A8" font-size="23" font-weight="600" text-anchor="start">Staging copy</text><text x="926" y="699" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">PCIe</text><text x="342" y="874" fill="#4C60A8" font-size="22" font-weight="400" text-anchor="start">NIC reads</text><text x="926" y="874" fill="#4C60A8" font-size="22" font-weight="400" text-anchor="start">NIC writes</text><path d="M440,958 H749" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#comm)"/><text x="600" y="924" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Network</text><text x="600" y="998" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Transfer x</text></svg>