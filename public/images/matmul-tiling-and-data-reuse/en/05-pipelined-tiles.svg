<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1690" viewBox="0 0 1200 1690" role="img" aria-labelledby="title desc"><title id="title">Prepare the next inputs while computing</title><desc id="desc">Each output sums eight products. Pairs are labeled Compute 1 through Compute 4, and Input 1 through Input 4 hold the corresponding A and B values. Each timeline computation processes that pair of products for every output owned by the block. Partial sums persist. A buffer is temporary storage, introduced before the timelines. One Buffer 0 appears above sequential execution; Buffer 0 and Buffer 1 appear above overlapped execution. Sequential execution fills, computes, then refills the same buffer. Overlapped execution alternates buffers: Inputs 1 and 3 use Buffer 0; Inputs 2 and 4 use Buffer 1. Transfers take two conceptual units and computations three. Each computation starts after its inputs are ready. Buffer 0 is refilled with Input 3 after Compute 1 finishes, and Buffer 1 with Input 4 after Compute 2 finishes. Both timelines have the same four transfers and computations, with equal total work and traffic. These are not measured times or performance. Each buffer holds A and B inputs, not output partial sums.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1690" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 5</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Prepare the next inputs while computing</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Keep the current and next inputs in separate storage areas.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="218" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Split each output&#x27;s eight products into groups of two.</text><text x="76" y="284" fill="#182C40" font-size="24" font-weight="600" text-anchor="start">One output =</text><rect x="249" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="345.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Product 1 + 2</text><text x="456" y="289" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">+</text><text x="345" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">Compute 1</text><rect x="471" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="567.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Product 3 + 4</text><text x="678" y="289" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">+</text><text x="567" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">Compute 2</text><rect x="693" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="789.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Product 5 + 6</text><text x="900" y="289" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">+</text><text x="789" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">Compute 3</text><rect x="915" y="249" width="193" height="62" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="1011.5" y="288.0" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Product 7 + 8</text><text x="1011" y="351" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">Compute 4</text><text x="600" y="395" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Input 1 holds A and B values for Compute 1. Inputs 2–4 follow the same pattern.</text><text x="48" y="454" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Reserve temporary input storage (a buffer) in shared memory.</text><rect x="48" y="482" width="270" height="74" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="183.0" y="527.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Buffer 0</text><text x="358" y="510" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Sequential execution uses one buffer.</text><text x="358" y="549" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Fill it, compute, then refill the same buffer.</text><rect x="48" y="607" width="1104" height="269" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="652" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Sequential · Load inputs, then compute</text><text x="76" y="708" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">Fill Buffer 0</text><text x="76" y="781" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">Compute</text><rect x="270" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="308.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Input 1</text><rect x="350" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="408.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 1</text><path d="M346,732 L346,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="470" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="508.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Input 2</text><rect x="550" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="608.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 2</text><path d="M546,732 L546,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="670" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="708.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Input 3</text><rect x="750" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="808.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 3</text><path d="M746,732 L746,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><rect x="870" y="676" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="908.0" y="710.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Input 4</text><rect x="950" y="749" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="1008.0" y="783.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 4</text><path d="M946,732 L946,744" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)"/><path d="M1070,668 V816" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="1070" y="849" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Done</text><text x="48" y="932" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Overlapped execution alternates between two buffers.</text><rect x="48" y="958" width="270" height="74" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="183.0" y="1003.0" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Buffer 0</text><rect x="358" y="958" width="270" height="74" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="493.0" y="1003.0" fill="#7954A3" font-size="26" font-weight="600" text-anchor="middle">Buffer 1</text><rect x="48" y="1100" width="1104" height="375" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="1147" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Overlapped · Load the next inputs while computing</text><text x="76" y="1205" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start">Fill Buffer 0</text><text x="76" y="1286" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start">Fill Buffer 1</text><text x="76" y="1367" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">Compute</text><rect x="270" y="1173" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="308.0" y="1207.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Input 1</text><rect x="470" y="1173" width="76" height="52" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="508.0" y="1207.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">Input 3</text><rect x="350" y="1254" width="76" height="52" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="388.0" y="1288.0" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">Input 2</text><rect x="590" y="1254" width="76" height="52" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="628.0" y="1288.0" fill="#7954A3" font-size="21" font-weight="600" text-anchor="middle">Input 4</text><rect x="350" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="408.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 1</text><rect x="470" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="528.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 2</text><rect x="590" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="648.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 3</text><rect x="710" y="1335" width="116" height="52" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="768.0" y="1369.0" fill="#B55B22" font-size="21" font-weight="600" text-anchor="middle">Compute 4</text><path d="M830,1170 V1399" fill="none" stroke="#5C6C7C" stroke-width="2" stroke-dasharray="7 7"/><text x="830" y="1444" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">Done</text><path d="M270,1505 L1110,1505" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1110" y="1539" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time</text><text x="600" y="1600" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">Keep current inputs in use while preparing the next inputs in the other buffer.</text><text x="600" y="1645" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Start when inputs are ready; refill a buffer only after its inputs are no longer in use.</text></svg>