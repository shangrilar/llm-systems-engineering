<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1484" viewBox="0 0 1200 1484" role="img" aria-labelledby="title desc"><title id="title">Three reasons to use multiple GPUs</title><desc id="desc">Panel 1 stores model parts A and B across two GPUs. Panel 2 splits one request into concurrent computations A and B and communicates to combine results. Panel 3 replicates the full model on each GPU and serves requests A and B separately. Goals may overlap.</desc><metadata>{&quot;id&quot;:&quot;02-three-goals&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Three reasons to use multiple GPUs</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Distinguish model capacity, time for one request, and total request throughput.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="208" width="1104" height="328" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="251" fill="#2470BB" font-size="19" font-weight="600" text-anchor="start">01</text><text x="119" y="251" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Run a larger model</text><text x="1124" y="251" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">More capacity</text><rect x="48" y="562" width="1104" height="375" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="605" fill="#2470BB" font-size="19" font-weight="600" text-anchor="start">02</text><text x="119" y="605" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Finish one request sooner</text><text x="1124" y="605" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">Lower latency</text><rect x="48" y="963" width="1104" height="344" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="1006" fill="#2470BB" font-size="19" font-weight="600" text-anchor="start">03</text><text x="119" y="1006" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Serve more requests</text><text x="1124" y="1006" fill="#287D78" font-size="22" font-weight="600" text-anchor="end">Higher throughput</text><text x="76" y="323" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">The whole model</text><text x="76" y="361" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">does not fit</text><text x="76" y="399" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">on one GPU.</text><rect x="423" y="289" width="329" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="445" y="326" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="445" y="348" width="285" height="65" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="587.5" y="388.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Model part A</text><rect x="795" y="289" width="329" height="151" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="817" y="326" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="817" y="348" width="285" height="65" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="959.5" y="388.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Model part B</text><path d="M439,457 V470 H1108 V457" fill="none" stroke="#B55B22" stroke-width="2"/><text x="773" y="505" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">Store the model across two GPUs</text><text x="76" y="684" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Split computation</text><text x="76" y="722" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">for one request,</text><text x="76" y="760" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">then join results.</text><rect x="423" y="641" width="329" height="120" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="445" y="676" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="445" y="696" width="285" height="45" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="587.5" y="726.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Compute A</text><rect x="795" y="641" width="329" height="120" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="817" y="676" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="817" y="696" width="285" height="45" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="959.5" y="726.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">Compute B</text><path d="M587,766 V786 H773 V804" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#arrow-purple)"/><path d="M959,766 V786 H773" fill="none" stroke="#7954A3" stroke-width="2"/><rect x="581" y="809" width="385" height="44" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="773.5" y="839" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">Communicate / combine → done</text><text x="773" y="899" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">When the total time, including communication, falls</text><text x="76" y="1085" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Replicate the model</text><text x="76" y="1123" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">on each GPU; handle</text><text x="76" y="1161" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">different requests.</text><rect x="423" y="1042" width="329" height="141" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="445" y="1078" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="445" y="1097" width="285" height="59" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="587.5" y="1134.5" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Same complete model</text><path d="M588,1189 L588,1210" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="588" y="1250" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Request A complete</text><rect x="795" y="1042" width="329" height="141" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="817" y="1078" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="817" y="1097" width="285" height="59" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="959.5" y="1134.5" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Same complete model</text><path d="M960,1189 L960,1210" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#arrow-teal)"/><text x="960" y="1250" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Request B complete</text><text x="600" y="1354" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">These goals can overlap. Placement and execution depend on the goal.</text></g></g><path d="M48,1406 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1444" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Each placement is a simplified example that separates the goals.</text></svg>