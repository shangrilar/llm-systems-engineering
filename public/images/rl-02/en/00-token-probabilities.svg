max</text></g><path d="M176 474 L176 502" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="0" y="532" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="352">Next-token probabilities</text><text x="2" y="578" fill="#2470BB" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">u</text><rect x="76" y="560" width="206" height="23" rx="3" fill="#2470BB" stroke="#2470BB" stroke-width="1.5"/><text x="348" y="579" fill="#2470BB" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.5</text><text x="2" y="618" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">b</text><rect x="76" y="600" width="82.4" height="23" rx="3" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="348" y="619" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.2</text><text x="2" y="658" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">d</text><rect x="76" y="640" width="41.2" height="23" rx="3" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="348" y="659" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.1</text><text x="2" y="698" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="64">Other</text><rect x="76" y="680" width="82.4" height="23" rx="3" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="348" y="699" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end" data-max-width="54">0.2</text><path d="M176 722 L176 743" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="0" y="754" width="352" height="64" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="16" y="785" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="320">pθ(u | P) = 0.5</text></g><text x=