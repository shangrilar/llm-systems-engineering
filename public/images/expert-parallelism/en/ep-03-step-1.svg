<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1529" viewBox="0 0 1200 1529" role="img" aria-labelledby="title desc"><title id="title">Return multiple expert results to the same token</title><desc id="desc">A2 on GPU0 selects local E0 and remote E2 on GPU1. Their results u0/u2 return to GPU0 and are weighted 0.7/0.3 to produce y(A2).</desc><metadata>{&quot;id&quot;:&quot;ep-03-step-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Return multiple expert results to the same token</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Send the same A2 vector to both experts</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><rect x="48" y="205" width="480" height="1120" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="249" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 0</text><rect x="672" y="205" width="480" height="1120" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="912" y="249" fill="#182C40" font-size="29" font-weight="700" text-anchor="middle">GPU 1</text><text x="288" y="291" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Source GPU for A2</text><rect x="218" y="313" width="140" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="288" y="342" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><text x="912" y="314" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">Other tokens omitted</text><path d="M288,365 L288,388" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><rect x="78" y="397" width="420" height="106" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="431" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">Router</text><text x="288" y="465" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">E0: 0.7     E2: 0.3</text><rect x="82" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="180" y="736" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E0</text><rect x="298" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="396" y="736" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E1</text><rect x="706" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="804" y="736" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E2</text><rect x="922" y="700" width="196" height="210" rx="10" fill="white" stroke="#DCE4EC" stroke-width="1.5"/><text x="1020" y="736" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">E3</text><text x="396" y="817" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">Not selected for A2</text><text x="1020" y="817" fill="#5C6C7C" font-size="19" font-weight="400" text-anchor="middle">Not selected for A2</text><path d="M220,503 L180,560 L180,695" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-muted)"/><path d="M356,503 L356,602 L804,602 L804,695" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-muted)"/><rect x="110" y="770" width="140" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="180" y="799" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><rect x="734" y="770" width="140" height="44" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="804" y="799" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">A2</text><text x="600" y="657" fill="#182C40" font-size="22" font-weight="700" text-anchor="middle">Same input vector for both experts</text><rect x="68" y="1098" width="440" height="137" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="288" y="1132" fill="#182C40" font-size="24" font-weight="700" text-anchor="middle">GPU0 · Combine results for A2</text><text x="288" y="1166" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Both outputs are needed</text><text x="600" y="1390" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Combine only the two results for A2, never results from different tokens.</text></g></g><path d="M48,1451 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1489" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Other tokens’ flows are omitted; the two expert outputs are combined on the source GPU.</text></svg>