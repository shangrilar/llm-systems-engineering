<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1260" viewBox="0 0 1200 1260" role="img" aria-labelledby="title desc"><title id="title">How do we wait for another stream?</title><desc id="desc">The top shows CPU submission order, not a timeline. The program creates two streams on the same GPU. It submits A and recording event E in S0, then C, a wait for E to complete, and B in S1. The CPU continues without waiting for E. In the GPU timeline below, independent A and C overlap. If E is not complete when C finishes, B waits. B executes after A finishes and E completes. Concurrent execution depends on available resources.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1260" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 5 · Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">How do we wait for another stream?</text><text x="48" y="141" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Mark completion of A with event E, and make B wait for that completion.</text><path d="M48,172 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="205" width="1104" height="70" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="80" y="250" fill="#2470BB" font-size="27" font-weight="600" text-anchor="start">A → u → B</text><text x="436" y="250" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="start">C is independent and uses separate data</text><text x="48" y="326" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">CPU: Submit work and ordering to two streams</text><text x="48" y="363" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">The program creates streams and chooses a stream for each operation.</text><rect x="48" y="389" width="1104" height="223" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="447" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Stream S₀</text><rect x="250" y="412" width="200" height="64" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="350.0" y="453.0" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">Compute A</text><path d="M461,444 H485" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="496" y="412" width="280" height="64" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="636.0" y="453.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Record event E</text><text x="800" y="452" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Mark completion after A</text><text x="76" y="553" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Stream S₁</text><rect x="250" y="518" width="200" height="64" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="350.0" y="559.0" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">Compute C</text><path d="M461,550 H485" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="496" y="518" width="280" height="64" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="636.0" y="559.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Wait for E to complete</text><path d="M787,550 H811" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="822" y="518" width="280" height="64" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="962.0" y="559.0" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">Compute B</text><text x="600" y="654" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">The CPU continues with other work without waiting for E to complete.</text><text x="48" y="732" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">GPU: Execute in the specified order and conditions</text><text x="48" y="769" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Two streams on the same GPU</text><path d="M250,807 H1142" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="1148" y="792" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="end">Time →</text><text x="48" y="884" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Stream S₀</text><rect x="250" y="844" width="500" height="76" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="500.0" y="891.0" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">Compute A</text><path d="M751,882 H770" fill="none" stroke="#2470BB" stroke-width="2"/><circle cx="780" cy="882" r="9" fill="#B55B22"/><text x="810" y="872" fill="#B55B22" font-size="25" font-weight="600" text-anchor="start">Event E completes</text><text x="810" y="909" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">A’s result u is ready</text><text x="48" y="1020" fill="#182C40" font-size="25" font-weight="600" text-anchor="start">Stream S₁</text><rect x="250" y="980" width="210" height="76" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="355.0" y="1027.0" fill="#7954A3" font-size="29" font-weight="600" text-anchor="middle">Compute C</text><rect x="460" y="980" width="320" height="76" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="620.0" y="1027.0" fill="#B55B22" font-size="23" font-weight="600" text-anchor="middle">Wait for E to complete</text><rect x="780" y="980" width="350" height="76" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="955.0" y="1027.0" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">Compute B</text><path d="M780,894 V969" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)"/><rect x="48" y="1104" width="1104" height="114" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1149" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">B executes after event E completes.</text><text x="600" y="1188" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">A and C can overlap when resources allow.</text></svg>