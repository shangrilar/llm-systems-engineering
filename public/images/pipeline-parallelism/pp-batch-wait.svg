eight="700" text-anchor="start">GPU 0</text><text x="70" y="487.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">레이어 0·1</text><rect x="248" y="428" width="864" height="64" rx="10" fill="#f1f4f7" stroke="#DCE4EC" stroke-width="1.5"/><text x="788" y="467.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">계산 없음</text><rect x="250" y="428" width="212" height="64" rx="10" fill="#d6e5f3" stroke="#2470BB" stroke-width="1.5"/><text x="356" y="467.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="541.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 1</text><text x="70" y="569.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">레이어 2·3</text><rect x="248" y="510" width="864" height="64" rx="10" fill="#f1f4f7" stroke="#DCE4EC" stroke-width="1.5"/><text x="356" y="549.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">입력 대기</text><text x="896" y="549.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">계산 없음</text><rect x="466" y="510" width="212" height="64" rx="10" fill="#d6e5f3" stroke="#2470BB" stroke-width="1.5"/><text x="572" y="549.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="623.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 2</text><text x="70" y="651.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">레이어 4·5</text><rect x="248" y="592" width="864" height="64" rx="10" fill="#f1f4f7" stroke="#DCE4EC" stroke-width="1.5"/><text x="464" y="631.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">입력 대기</text><text x="1004" y="631.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">계산 없음</text><rect x="682" y="592" width="212" height="64" rx="10" fill="#d6e5f3" stroke="#2470BB" stroke-width="1.5"/><text x="788" y="631.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="70" y="705.0" fill="#182C40" font-size="24" font-weight="700" text-anchor="start">GPU 3</text><text x="70" y="733.0" fill="#526577" font-size="19" font-weight="400" text-anchor="start">레이어 6·7</text><rect x="248" y="674" width="864" height="64" rx="10" fill="#f1f4f7" stroke="#DCE4EC" stroke-width="1.5"/><text x="572" y="713.0" fill="#526577" font-size="21" font-weight="400" text-anchor="middle">입력 대기</text><rect x="898" y="674" width="212" height="64" rx="10" fill="#d6e5f3" stroke="#2470BB" stroke-width="1.5"/><text x="1004" y="713.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">A · B · C · D</text><text x="600" y="804.0" fill="#526577" font-size="22" font-weight="400" text-anchor="middle">예시: 단계마다 배치 전체를 4칸 동안 계산 · 통신 시간 생략</text><rect x="48" y="839" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="875.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 GPU가 계산하는 동안, 다른 세 GPU는 이 배치를 계산하지 못합니다.</text><text x="72" y="915.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">다음 GPU는 네 입력의 결과를 모두 받은 뒤 시작합니다.</text></svg>