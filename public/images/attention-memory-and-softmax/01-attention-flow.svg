<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc"><title id="title">Attention의 전체 계산 흐름</title><desc id="desc">배치와 헤드 축을 제외한 causal self-attention 한 헤드의 계산이다. Q(T×dh)와 K의 전치(dh×T)를 곱해 점수 S(T×T)를 만든다. 스케일링과 미래 토큰 마스크를 적용하고 행별 Softmax로 확률 P(T×T)를 구한다. P와 V(T×dh)의 곱은 출력 O(T×dh)다. 도형은 T=4, dh=2일 때의 모양이다. P의 미래 토큰 위치는 0이며 유효한 행의 합은 1이다. 번호는 수학적 설명 단계이며 별도 커널 개수를 의미하지 않는다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1350" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Attention의 전체 계산 흐름</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">점수 계산 → 스케일링·마스크 → Softmax → Value 가중합</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="600" y="213" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">헤드 하나 기준 · T: 토큰 수 · dₕ: 헤드 차원</text><rect x="48" y="248" width="1104" height="301" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="290" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">1. Q와 K로 토큰 사이의 점수를 계산합니다.</text><text x="178.0" y="325" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Q</text><rect x="144" y="353" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="353" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="144" y="387" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="387" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="144" y="421" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="421" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="144" y="455" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><rect x="178" y="455" width="31" height="31" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="178.0" y="520" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">T × dₕ</text><text x="316" y="428" fill="#5C6C7C" font-size="36" font-weight="400" text-anchor="middle">×</text><text x="478.0" y="359" fill="#7954A3" font-size="27" font-weight="700" text-anchor="middle">Kᵀ</text><rect x="410" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="444" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="478" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="512" y="387" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="410" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="444" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="478" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><rect x="512" y="421" width="31" height="31" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="478.0" y="486" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">dₕ × T</text><path d="M627,420 L763,420" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><text x="961.0" y="325" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">점수 S</text><rect x="893" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="353" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="893" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="387" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="893" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="421" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="893" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="927" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="961" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="995" y="455" width="31" height="31" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="961.0" y="520" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">T × T</text><path d="M600,562 L600,595" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="48" y="613" width="1104" height="246" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="655" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">2. 점수를 조정하고, 행별 확률로 바꿉니다.</text><rect x="76" y="701" width="167" height="91" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="159.5" y="754.5" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">점수 S</text><path d="M257,747 L300,747" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="314" y="701" width="275" height="91" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="451" y="737" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">스케일링 · 마스크</text><text x="451" y="770" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">미래 토큰 제외</text><path d="M604,747 L647,747" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="660" y="701" width="198" height="91" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="759.0" y="754.5" fill="#7954A3" font-size="25" font-weight="600" text-anchor="middle">Softmax</text><path d="M872,747 L915,747" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#muted)"/><rect x="930" y="701" width="192" height="91" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x=