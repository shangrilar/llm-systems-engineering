ub" font-size="70%">6</tspan></text><rect x="852" y="377" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="909.0" y="421.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="966" y="377" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1023.0" y="421.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">q<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M624,377 L624,447" fill="none" stroke="#287D78" stroke-width="3"/><text x="624" y="489" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">All 8 components · still d dimensions</text><text x="93" y="642" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">K</text><path d="M168,583 V575 H624 V583" fill="none" stroke="#2470BB" stroke-width="1.5"/><text x="396" y="562" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Head 1 · dh = 4</text><path d="M624,583 V575 H1080 V583" fill="none" stroke="#287D78" stroke-width="1.5"/><text x="852" y="562" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Head 2 · dh = 4</text><rect x="168" y="597" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="225.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="282" y="597" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="339.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="396" y="597" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="453.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="510" y="597" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="567.0" y="641.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="624" y="597" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="681.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="738" y="597" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="795.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="852" y="597" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="909.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="966" y="597" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1023.0" y="641.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">k<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M624,597 L624,667" fill="none" stroke="#287D78" stroke-width="3"/><text x="624" y="709" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">All 8 components · still d dimensions</text><text x="93" y="862" fill="#182C40" font-size="32" font-weight="600" text-anchor="middle">V</text><path d="M168,803 V795 H624 V803" fill="none" stroke="#2470BB" stroke-width="1.5"/><text x="396" y="782" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">Head 1 · dh = 4</text><path d="M624,803 V795 H1080 V803" fill="none" stroke="#287D78" stroke-width="1.5"/><text x="852" y="782" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Head 2 · dh = 4</text><rect x="168" y="817" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="225.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">1</tspan></text><rect x="282" y="817" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="339.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">2</tspan></text><rect x="396" y="817" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="453.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">3</tspan></text><rect x="510" y="817" width="114" height="70" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="567.0" y="861.0" fill="#2470BB" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">4</tspan></text><rect x="624" y="817" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="681.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">5</tspan></text><rect x="738" y="817" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="795.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">6</tspan></text><rect x="852" y="817" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="909.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">7</tspan></text><rect x="966" y="817" width="114" height="70" rx="0" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1"/><text x="1023.0" y="861.0" fill="#287D78" font-size="29" font-weight="400" text-anchor="middle">v<tspan baseline-shift="sub" font-size="70%">8</tspan></text><path d="M624,817 L624,887" fill="none" stroke="#287D78" stroke-width="3"/><text x="624" y="929" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">All 8 components · still d dimensions</text><text x="600" y="1042" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">T × d = 3 × 8   ↔   T × h × dh = 3 × 2 × 4</text><text x="600" y="1087" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">These are two views of the same values; no extra matrix multiplication.</text></g></g><path d="M48,1139 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1177" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Each head uses all d input components in its projection. Here, dh = d/h.</text></svg>