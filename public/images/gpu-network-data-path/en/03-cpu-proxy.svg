<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1567" viewBox="0 0 1200 1567" role="img" aria-labelledby="title desc"><title id="title">How a CPU Proxy Helps Transfers Progress</title><desc id="desc">A sending-side CPU proxy used together with GPUDirect RDMA. The GPU memory, NIC and network positions and data path match the preceding figure. User CPU code calls NCCL. A CPU helper thread checks readiness through GPU progress state separate from x, requests the NIC transfer, checks completion and updates GPU-side state. Orange dashed arrows are requests and state; blue solid arrows are data movement. Receive-side control is omitted. Not every NIC path requires a CPU proxy.</desc><metadata>{&quot;id&quot;:&quot;03-cpu-proxy&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">How a CPU Proxy Helps Transfers Progress</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Data moves directly while the CPU helps request transfers and check completion.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -208)"><rect x="48" y="210" width="1104" height="60" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="250" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">Send-side CPU proxy detail · GPUDirect RDMA path</text><rect x="48" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Server 0</text><rect x="632" y="296" width="520" height="780" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="660" y="332" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">Server 1</text><rect x="96" y="365" width="424" height="82" rx="12" fill="#F1F4F7" stroke="#182C40" stroke-width="1.5"/><text x="308" y="400" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">CPU · User code</text><text x="308" y="435" fill="#182C40" font-size="23" font-weight="400" text-anchor="middle">Call NCCL communication</text><rect x="680" y="365" width="424" height="82" rx="12" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="892" y="400" fill="#287D78" font-size="25" font-weight="600" text-anchor="middle">GPU 1 · Compute B</text><text x="892" y="435" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle">Run after receive completes</text><rect x="96" y="520" width="424" height="106" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="308" y="567" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">GPU 0 memory</text><text x="308" y="602" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">A produced x = [1, 2, 3, 4]</text><rect x="680" y="520" width="424" height="106" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892" y="567" fill="#4C60A8" font-size="25" font-weight="600" text-anchor="middle">GPU 1 memory</text><text x="892" y="602" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">x arrives in receive buffer</text><path d="M892,510 V457" fill="none" stroke="#5C6C7C" stroke-width="2" marker-end="url(#arrow-muted)"/><rect x="176" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="308" y="952" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="308" y="987" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Network send/receive</text><rect x="760" y="900" width="264" height="116" rx="12" fill="#EEF1FC" stroke="#4C60A8" stroke-width="1.5"/><text x="892" y="952" fill="#4C60A8" font-size="26" font-weight="600" text-anchor="middle">NIC</text><text x="892" y="987" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Network send/receive</text><path d="M308,637 V889" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="342" y="698" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">PCIe</text><text x="342" y="738" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">NIC</text><text x="342" y="774" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">reads x</text><path d="M892,889 V637" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="926" y="698" fill="#4C60A8" font-size="24" font-weight="600" text-anchor="start">PCIe</text><text x="926" y="738" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">NIC</text><text x="926" y="774" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">writes x</text><path d="M440,958 H749" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="600" y="924" fill="#4C60A8" font-size="27" font-weight="600" text-anchor="middle">Network</text><text x="600" y="998" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="middle">Transfer x</text><rect x="104" y="650" width="188" height="44" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="198" y="681" fill="#B55B22" font-size="19" font-weight="600" text-anchor="middle">GPU progress state</text><rect x="96" y="730" width="200" height="104" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="196" y="776" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">CPU proxy</text><text x="196" y="811" fill="#B55B22" font-size="22" font-weight="400" text-anchor="middle">Helper thread</text><path d="M96,406 H64 V782 H86" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><path d="M166,695 V719" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><path d="M246,729 V705" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><path d="M236,835 V870 H210 V889" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><path d="M176,978 H120 V845" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><text x="137" y="716" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">①</text><text x="250" y="716" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">③</text><text x="246" y="882" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">②</text><text x="82" y="936" fill="#B55B22" font-size="23" font-weight="600" text-anchor="start">③</text><path d="M70,1125 H150" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#arrow-orange)" stroke-dasharray="7 7"/><text x="170" y="1133" fill="#B55B22" font-size="23" font-weight="400" text-anchor="start">Requests / state</text><path d="M400,1125 H480" fill="none" stroke="#4C60A8" stroke-width="4" marker-end="url(#arrow-indigo)"/><text x="500" y="1133" fill="#4C60A8" font-size="23" font-weight="400" text-anchor="start">Data movement</text><text x="48" y="1197" fill="#B55B22" font-size="27" font-weight="600" text-anchor="start">① Check data readiness</text><text x="48" y="1239" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Check whether the GPU-side data is ready to send</text><text x="48" y="1297" fill="#B55B22" font-size="27" font-weight="600" text-anchor="start">② Request transfer</text><text x="48" y="1339" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Ask the NIC to read and send the data</text><text x="48" y="1397" fill="#B55B22" font-size="27" font-weight="600" text-anchor="start">③ Check completion and update state</text><text x="48" y="1439" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Check NIC transfer completion and update GPU-side progress state</text></g></g><path d="M48,1489 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1527" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">Only send-side control is shown; not every NIC path needs a CPU proxy.</text></svg>