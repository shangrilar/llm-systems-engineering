<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1101" viewBox="0 0 1200 1101" role="img" aria-labelledby="title desc"><title id="title">Which context produces each token probability?</title><desc id="desc">The same model scores u from P, b from P+u, and d from P+u+b. Each context passes through Transformer layers, a context representation, and the LM head and softmax. Gather the recorded token probability without reading future tokens.</desc><metadata>{&quot;id&quot;:&quot;2-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;PPO&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/1707.06347&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Which context produces each token probability?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Score the recorded response u → b → d with the current model. Each column is a prediction</text><text x="48" y="173.2" fill