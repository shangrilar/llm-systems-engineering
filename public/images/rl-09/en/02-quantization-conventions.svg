<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="937" viewBox="0 0 1200 937" role="img" aria-labelledby="title desc"><title id="title">Quantize inference alone, or align training forward too</title><desc id="desc">Left: training forward and inference use the same quantized values under shared rules. Right: training uses original BF16 values while inference uses FP8 approximations.</desc><metadata>{&quot;id&quot;:&quot;8-2&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §3.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Quantize inference alone, or align training forward too</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Within each configuration, both engines receive the same P and preceding tokens.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Shared quantization</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="65" y="100" width="390" height="95" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="81" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Same weight version</text></g><path d="M260 208 L260 244" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="260" width="488" height="125" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="32" y="291" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Shared quantization rules</text><text x="32" y="331" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Same value and scale rules</text></g><path d="M260 396 V422 H132 V452" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><path d="M260 422 H388 V452" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><g data-container="true"><rect x="16" y="470" width="232" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">Training forward</text><text x="32" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">Quantized values</text></g><g data-container="true"><rect x="272" y="470" width="232" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="288" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">Inference</text><text x="288" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">Same quantized</text><text x="288" y="569" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">values</text></g><text x="260" y="646" fill="#7954A3" font-size="23" font-weight="400" text-anchor="middle" data-max-width="488">FP8 / MXFP8 / NVFP4</text></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">BF16 training + FP8 inference</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="65" y="100" width="390" height="95" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="81" y="131" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="358">Same weight version</text></g><path d="M260 208 V235 H132 V452" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M260 235 H388 V270" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="276" y="285" width="228" height="100" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="292" y="316" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="196">FP8 quantization</text></g><path d="M388 398 L388 452" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="470" width="232" height="126" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="501" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">Training forward</text><text x="32" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">Original BF16 values</text></g><g data-container="true"><rect x="272" y="470" width="232" height="126" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="288" y="501" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="200">Inference</text><text x="288" y="541" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="200">FP8 approximations</text></g></g></svg>