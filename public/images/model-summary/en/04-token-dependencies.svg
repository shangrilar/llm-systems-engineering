<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1960" viewBox="0 0 1200 1960" role="img" aria-labelledby="title desc">
<title id="title">Where is information combined across tokens?</title><desc id="desc">Three parallel token paths pass through a block. RMSNorm, projections, RoPE and MLP or MoE operate within each token position. In Core Attention, token 1 depends on token 1, token 2 on tokens 1 and 2, and token 3 on tokens 1, 2 and 3. Concatenation, output projection and residual additions preserve token positions.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
