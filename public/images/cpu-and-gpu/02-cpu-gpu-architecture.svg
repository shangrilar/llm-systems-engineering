<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">CPU와 GPU는 자원을 다르게 구성합니다</title><desc id="desc">CPU는 두 코어 내부에 제어, 연산, 캐시를 표시하고 GPU는 제어와 가까운 메모리를 갖는 여러 연산 묶음을 표시한다. 물리적 수량 비교가 아닌 개념도다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1040" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">CPU와 GPU는 자원을 다르게 구성합니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">제어·연산·메모리를 배치하는 설계 방향을 비교합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="204" width="528" height="590" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="312" y="254" fill="#182C40" font-size="36" font-weight="700" text-anchor="middle">CPU</text><text x="312" y="294" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">복잡한 작업의 지연을 줄이는 데 초점</text><rect x="624" y="204" width="528" height="590" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="888" y="254" fill="#182C40" font-size="36" font-weight="700" text-anchor="middle">GPU</text><text x="888" y="294" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">많은 계산의 전체 처리량에 초점</text><rect x="76" y="334" width="220" height="270" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="186" y="373" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">CPU 코어</text><rect x="92" y="395" width="188" height="67" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="186.0" y="436.5" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">제어</text><rect x="92" y="478" width="188" height="53" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="186.0" y="512.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">연산</text><rect x="92" y="545" width="188" height="42" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="186.0" y="574.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">캐시</text><rect x="316" y="334" width="220" height="270" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="426" y="373" fill="#182C40" font-size="23" font-weight="600" text-anchor="middle">CPU 코어</text><rect x="332" y="395" width="188" height="67" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="426.0" y="436.5" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">제어</text><rect x="332" y="478" width="188" height="53" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="426.0" y="512.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">연산</text><rect x="332" y="545" width="188" height="42" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="426.0" y="574.0" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">캐시</text><rect x="76" y="628" width="460" height="66" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="306.0" y="669.0" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle">공유 캐시</text><text x="312" y="752" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">각 코어도 병렬 연산을 수행합니다.</text><rect x="648" y="334" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="656" y="342" width="136" height="28" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.0" y="364.0" fill="#5C6C7C" font-size="16" font-weight="600" text-anchor="middle">제어</text><rect x="657" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="691" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="725" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="759" y="380" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="657" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="691" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="725" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="759" y="408" width="30" height="22" rx="3" fill="#FFF2E6" stroke="#EDD3BC" stroke-width="1.5"/><rect x="656" y="440" width="136" height="24" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="724.0" y="460.0" fill="#2470BB" font-size="15" font-weight="600" text-anchor="middle">가까운 메모리</text><rect x="812" y="334" width="152" height="138" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="820" y="342" width="136" height="