<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906" viewBox="0 0 1200 906" role="img" aria-labelledby="title desc"><title id="title">Partition replicated activations by token</title><desc id="desc">SP partitions replicated tokens t0–t3 into t0,t1 on GPU 0 and t2,t3 on GPU 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="906" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Partition replicated activations by token</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">This is Megatron-style SP; the TP partition of model weights is retained.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><text x="48" y="205.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Activations: per-token vectors produced during computation</text><text x="48" y="245.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Replicated region with TP</text><rect x="48" y="273" width="510" height="213" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="310.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="68" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="123" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="123" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="187" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="242" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="242" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="306" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="361" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="361" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="425" y="337" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="480" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="480" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="642" y="273" width="510" height="213" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="310.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="662" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="717" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="717" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="781" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="836" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="836" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="900" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="955" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="955" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="1019" y="337" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="1074" y="372.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="1074" y="415.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><text x="48" y="533.0" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">Region partitioned with SP</text><rect x="48" y="561" width="510" height="213" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="598.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">GPU 0</text><rect x="68" y="625" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="123" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t0</text><text x="123" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="187" y="625" width="110" height="112" rx="10" fill="white" stroke="#2470BB" stroke-width="1.5"/><text x="242" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t1</text><text x="242" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="642" y="561" width="510" height="213" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="598.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">GPU 1</text><rect x="662" y="625" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="717" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t2</text><text x="717" y="703.0" fill="#182C40" font-size="18" font-weight="400" text-anchor="middle">h₀ … h₃</text><rect x="781" y="625" width="110" height="112" rx="10" fill="white" stroke="#287D78" stroke-width="1.5"/><text x="836" y="660.0" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">t3</text><text x="836" y="703.0" fill="#182C40" font-size="18" font-weight="4