="603" width="26" height="54" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M990,630 H1016" stroke="#287D78" stroke-width="1"/><rect x="1019" y="603" width="26" height="54" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M1019,630 H1045" stroke="#287D78" stroke-width="1"/><rect x="1048" y="603" width="26" height="54" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M1048,630 H1074" stroke="#287D78" stroke-width="1"/><rect x="1077" y="603" width="26" height="54" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M1077,630 H1103" stroke="#287D78" stroke-width="1"/><rect x="1106" y="603" width="26" height="54" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M1106,630 H1132" stroke="#287D78" stroke-width="1"/><text x="1062" y="754" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">5개 위치</text><text x="636" y="840" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">한 단계에서 읽는 대상</text><rect x="636" y="873" width="92" height="70" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="682" y="917" fill="#7954A3" font-size="27" font-weight="700" text-anchor="middle">W</text><text x="744" y="917" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">+</text><rect x="761" y="873" width="106" height="70" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="814" y="915" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">KV(A)</text><text x="879" y="917" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">+</text><rect x="891" y="873" width="106" height="70" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="944" y="915" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">KV(B)</text><text x="1009" y="917" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">+</text><rect x="1021" y="873" width="106" height="70" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1074" y="915" fill="#287D78" font-size="22" font-weight="700" text-anchor="middle">KV(C)</text><text x="48" y="1003" fill="#182C40" font-size="26" font-weight="700" text-anchor="start">가중치는 공통으로 사용 · 읽을 KV는 요청마다 추가</text><text x="48" y="1058" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">동일한 모델·문맥 길이, 독립 KV의 예 · 칸 크기는 데이터량의 비율이 아닙니다.</text></g></g><path d="M48,1109 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1147" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">가중치 W는 모든 요청이 함께 쓰지만, KV는 요청마다 따로 읽습니다.</text></svg>