<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1448" viewBox="0 0 360 1448" role="img" aria-labelledby="title desc"><title id="title">The later layers read one global KV bank</title><desc id="desc">One token sequence passes through two self-decoder layers to M. M supplies global K/V and the cross-decoder input. Each self-decoder reads and updates its own recurrent/local state. Two cross-decoder layers read the same KV bank with their own Queries.</desc><metadata>{&quot;id&quot;:&quot;yoco-01&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;YOCO §2, self-decoder and cross-decoder&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.05254v1#S2&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 1 · Roles across depth</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">The later layers read one</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">global KV bank</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">One causal token sequence p0–p3 ·</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Illustrative 2 + 2 layers · Blue: hidden</text><text x="16" y="181.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">flow</text><path d="M16,201.2 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 225.2) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">YOCO</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="20" y="120" width="100" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="70" y="157" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">p0</text><rect x="146" y="120" width="100" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="196" y="157" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">p1</text><rect x="272" y="120" width="100" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="322" y="157" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">p2</text><rect x="398" y="120" width="100" height="58" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="448" y="157" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="88">p3</text><text x="260" y="223" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="510">One generation sequence · Causal</text><path d="M135 240 L135 285" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="410" y="270" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle" data-max-width="200">Local state</text><g data-container="true"><rect x="10" y="295" width="250" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="326" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="218">Self-decoder 1</text><text x="26" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="218">Efficient</text><text x="26" y="394" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="218">self-attention</text></g><g data-container="true"><rect x="310" y="295" width="200" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="326" y="326" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">State 1</text><text x="326" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">recurrent /</text><text x="326" y="394" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">local</text></g><path d="M300 335 L270 335" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M270 390 L300 390" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M135 430 L135 475" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="10" y="485" width="250" height="125" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="516" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="218">Self-decoder 2</text><text x="26" y="556" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="218">Efficient</text><text x="26" y="584" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="218">self-attention</text></g><g data-container="true"><rect x="310" y="485" width="200" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="326" y="516" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">State 2</text><text x="326" y="556" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">recurrent /</text><text x="326" y="584" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">local</text></g><path d="M300 525 L270 525" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M270 580 L300 580" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><path d="M135 620 L135 665" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="45" y="675" width="180" height="65" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="135" y="715.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">M</text><text x="135" y="790" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle" data-max-width="260">Early output</text><path d="M235 707 L300 707" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="310" y="650" width="200" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="326" y="681" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">KV projection</text><text x="326" y="721" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">M → K, V</text></g><path d="M410 790 L410 875" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="310" y="885" width="200" height="245" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="410" y="925" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="182">Global KV</text><text x="410" y="976" fill="#287D78" font-size="23" font-weight="400" 