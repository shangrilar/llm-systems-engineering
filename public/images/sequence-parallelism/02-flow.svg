<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="894" viewBox="0 0 1200 894" role="img" aria-labelledby="title desc"><title id="title">연산에 맞춰 모으고 다시 나누기</title><desc id="desc">정규화는 로컬 토큰에서 수행하고 All-Gather로 TP 입력을 만든 뒤 Reduce-Scatter로 결과를 다시 토큰별로 나눕니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="894" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">연산에 맞춰 모으고 다시 나누기</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">표는 순전파 흐름입니다. 잔차 입력도 대응하는 토큰 배치를 유지합니다.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="193" width="274" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="230.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">순서</text><rect x="328" y="193" width="406" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="230.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 0</text><rect x="740" y="193" width="406" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="230.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">GPU 1</text><rect x="48" y="259" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="293.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">토큰별 정규화</text><rect x="328" y="259" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="293.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1</text><rect x="740" y="259" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="293.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t2, t3</text><rect x="48" y="364" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="398.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">All-Gather</text><rect x="328" y="364" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="398.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1, t2, t3</text><rect x="740" y="364" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="398.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1, t2, t3</text><rect x="48" y="469" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="503.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">TP MLP 계산</text><rect x="328" y="469" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="503.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">모든 토큰의 부분합 P₀</text><rect x="740" y="469" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="503.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">모든 토큰의 부분합 P₁</text><rect x="48" y="574" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="608.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reduce-Scatter</text><rect x="328" y="574" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="608.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">완성된 결과 t0, t1</text><rect x="740" y="574" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="608.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">완성된 결과 t2, t3</text><rect x="48" y="679" width="274" height="97" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="713.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">잔차 연결 등</text><rect x="328" y="679" width="406" height="97" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="342" y="713.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t0, t1</text><rect x="740" y="679" width="406" height="97" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="754" y="713.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">t2, t3</text><text x="48" y="839.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">All-Reduce 뒤 전체 결과를 복제하는 대신, 합산과 토큰 분할을 함께 합니다.</text></svg>