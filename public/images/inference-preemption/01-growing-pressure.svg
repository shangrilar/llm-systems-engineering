or="middle">A · KV 8칸</text><text x="872" y="758.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">B · KV 8칸</text><text x="48" y="828.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">3. 그다음 입력에는 새 블록이 필요</text><rect x="48" y="858" width="222" height="98" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="159" y="895.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">A의 다음 입력</text><text x="159" y="931.0" fill="#2470BB" font-size="24" font-weight="400" text-anchor="middle">위치 8</text><path d="M284,907 L325.0,907.0" stroke="#2470BB" stroke-width="2.5" fill="none"/><path d="M335,907 L325.0,911.5 L325.0,902.5 Z" fill="#2470BB"/><rect x="352" y="858" width="264" height="98" rx="10" fill="white" stroke="#B55B22" stroke-width="2" stroke-dasharray="7 5"/><rect x="364" y="883" width="56" height="48" rx="5" fill="white" stroke="#B55B22" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="424" y="883" width="56" height="48" rx="5" fill="white" stroke="#B55B22" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="484" y="883" width="56" height="48" rx="5" fill="white" stroke="#B55B22" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="544" y="883" width="56" height="48" rx="5" fill="white" stroke="#B55B22" stroke-width="1.5" stroke-dasharray="4 4"/><text x="653" y="895.0" fill="#B55B22" font-size="27" font-weight="700" text-anchor="start">빈 블록 0개</text><text x="653" y="934.0" fill="#B55B22" font-size="24" font-weight="400" text-anchor="start">새 블록을 배정할 수 없음</text><text x="48" y="1015.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">숫자 = 요청 안의 KV 위치 · 기존 블록의 빈칸과 가용 블록은 다릅니다.</text></svg>