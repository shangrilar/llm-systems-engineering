<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">담당 인덱스가 다른 실행으로 나눕니다</title><desc id="desc">공통 계산 절차를 i=0,1,2인 세 개의 실행 흐름으로 펼친다. 각 실행은 A[i]와 B[i]를 읽어 더하고 C[i]에 저장한다. 첫 실행은 1+10=11을 C[0]에, 둘째는 2+20=22를 C[1]에, 셋째는 3+30=33을 C[2]에 저장한다. 각 실행 흐름 아래에 스레드 0,1,2라고 이름을 붙인다.</desc><metadata>{&quot;id&quot;:&quot;02-indexed-executions&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">담당 인덱스가 다른 실행으로 나눕니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">절차는 같고, 인덱스 i에 따라 읽는 입력과 저장하는 위치가 달라집니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="252" y="214" width="696" height="76" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="260" fill="#182C40" font-size="27" font-weight="600" text-anchor="middle">공통 절차: A[i]와 B[i]를 더해 C[i]에 저장</text><path d="M600,302 V330 H224 M600,330 H976" fill="none" stroke="#2470BB" stroke-width="2"/><path d="M224,331 L224,353" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="48" y="368" width="352" height="656" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><text x="224" y="416" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">i = 0</text><rect x="72" y="454" width="304" height="121" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="499" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">A[0]에서 1 읽기</text><text x="224" y="546" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">B[0]에서 10 읽기</text><path d="M224,587 L224,622" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="72" y="637" width="304" height="76" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="683" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">1 + 10 = 11</text><path d="M224,726 L224,768" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="72" y="784" width="304" height="93" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="224" y="838.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">C[0]에 11 저장</text><text x="224" y="948" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">스레드 0</text><text x="224" y="990" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">하나의 개별 실행 흐름</text><path d="M600,331 L600,353" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="424" y="368" width="352" height="656" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><text x="600" y="416" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">i = 1</text><rect x="448" y="454" width="304" height="121" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="499" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">A[1]에서 2 읽기</text><text x="600" y="546" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">B[1]에서 20 읽기</text><path d="M600,587 L600,622" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="448" y="637" width="304" height="76" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="683" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">2 + 20 = 22</text><path d="M600,726 L600,768" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="448" y="784" width="304" height="93" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="838.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">C[1]에 22 저장</text><text x="600" y="948" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">스레드 1</text><text x="600" y="990" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">하나의 개별 실행 흐름</text><path d="M976,331 L976,353" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="800" y="368" width="352" height="656" rx="12" fill="#FFFFFF" stroke="#2470BB" stroke-width="1.5"/><text x="976" y="416" fill="#2470BB" font-size="32" font-weight="700" text-anchor="middle">i = 2</text><rect x="824" y="454" width="304" height="121" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="499" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">A[2]에서 3 읽기</text><text x="976" y="546" fill="#2470BB" font-size="25" font-weight="600" text-anchor="middle">B[2]에서 30 읽기</text><path d="M976,587 L976,622" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="824" y="637" width="304" height="76" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="683" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">3 + 30 = 33</text><path d="M976,726 L976,768" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#arrow-blue)"/><rect x="824" y="784" width="304" height="93" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="976" y="838.5" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">C[2]에 33 저장</text><text x="976" y="948" fill="#2470BB" font-size="29" font-weight="700" text-anchor="middle">스레드 2</text><text x="976" y="990" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle">하나의 개별 실행 흐름</text><text x="600" y="1080" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">각 스레드는 같은 절차를 자신의 인덱스에 해당하는 데이터로 수행합니다.</text></g></g><path d="M48,1132 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1170" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">각 스레드는 같은 절차를 실행하고, 인덱스 i로 자신이 사용할 데이터 위치만 정합니다.</text></svg>