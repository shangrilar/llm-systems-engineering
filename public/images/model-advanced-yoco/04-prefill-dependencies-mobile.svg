<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1185" viewBox="0 0 360 1185" role="img" aria-labelledby="title desc"><title id="title">기억을 모두 만든 뒤 첫 출력에 필요한 위치를 계산합니다</title><desc id="desc">계산 격자의 self1,self2 행은 p0부터 p3까지 네 칸 모두 실행한다. Cross3,Cross4 행은 p0부터 p2까지가 점선 생략 칸이고 p3만 읽기 계산한다. p3 결과로 x4를 선택한다. 별도 조건 카드가 과거 cross 출력의 global KV 생성 비의존성과 생성이 이어질 때 새 토큰 처리를 설명한다.</desc><metadata>{&quot;id&quot;:&quot;yoco-04&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;YOCO §2.3, prefill early exit&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.05254v1#S2.SS3&quot;},{&quot;label&quot;:&quot;DeepSeek-V4.1-Flash report §2.2 and §3.2.2&quot;,&quot;url&quot;:&quot;https://huggingface.co/deepseek-ai/DeepSeek-V4.1-Flash/blob/main/DeepSeek_V41_Tech_Report.pdf&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">그림 4 · Prefill의 계산 범위</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">기억을 모두 만든 뒤 첫 출력에</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">필요한 위치를 계산합니다</text><text x="16" y="133.6" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">YOCO · Prompt p0부터 p3까지 · 첫 생성</text><text x="16" y="157.39999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">토큰 x₄만 필요 · 칸은 층별 계산 위치</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">YOCO의 첫 출력 준비</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="330" y="139" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle" data-max-width="365">Prompt</text><text x="194" y="208" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p0</text><text x="280" y="208" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p1</text><text x="366" y="208" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p2</text><text x="452" y="208" fill="#287D78" font-size="26" font-weight="600" text-anchor="middle" data-max-width="80">p3</text><text x="131" y="285" fill="#2470BB" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Self 1</text><rect x="155" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="194" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><rect x="241" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><rect x="327" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="366" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><rect x="413" y="240" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="452" y="284" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><text x="131" y="395" fill="#2470BB" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Self 2</text><rect x="155" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="194" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><rect x="241" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="280" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><rect x="327" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="366" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><rect x="413" y="350" width="78" height="74" rx="9" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="452" y="394" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">계산</text><text x="131" y="595" fill="#287D78" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Cross 3</text><rect x="155" y="550" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="194" y="594" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">생략</text><rect x="241" y="550" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="280" y="594" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">생략</text><rect x="327" y="550" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="366" y="594" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">생략</text><rect x="413" y="550" width="78" height="74" rx="9" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="452" y="594" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">읽기</text><text x="131" y="705" fill="#287D78" font-size="23" font-weight="600" text-anchor="end" data-max-width="129">Cross 4</text><rect x="155" y="660" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="194" y="704" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">생략</text><rect x="241" y="660" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="280" y="704" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">생략</text><rect x="327" y="660" width="78" height="74" rx="9" fill="#F1F4F7" stroke="#657789" stroke-width="1.5" stroke-dasharray="7 5"/><text x="366" y="704" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">생략</text><rect x="413" y="660" width="78" height="74" rx="9" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="452" y="704" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="70">읽기</text><text x="260" y="487" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">p0부터 p3까지의 global KV 준비 완료</text><path d="M452 744 L452 810" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><rect x="400" y="820" width="104" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="452" y="858" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="92">x₄</text><text x="260" y="943" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle" data-max-width="500">p3에서 전체 기억을 읽고 x₄ 선택</text><g data-container="true"><rect x="20" y="1035" width="480" height="175" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="1066" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">생략 조건</text><text x="36" y="1106" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">과거 뒤층 출력이 이후 global KV 생성에 필요하지</text><text x="36" y="1134" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">않습니다.</text></g><g data-container="true"><rect x="20" y="1250" width="480" height="233" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="1281" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">생성이 이어질 때</text><text x="36" y="1321" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">선택된 x₄는 다음 입력입니다. 그때 앞·뒤 층을</text><text x="36" y="1349" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">모두 지나며 새 KV를 추가합니다.</text></g></g></svg>