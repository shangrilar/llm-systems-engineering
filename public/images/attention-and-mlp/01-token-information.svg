<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1147" viewBox="0 0 1200 1147" role="img" aria-labelledby="title desc"><title id="title">Attention과 MLP는 어느 토큰을 참조할까?</title><desc id="desc">토큰 3의 출력을 강조한다. Attention은 토큰 1·2·3의 입력을 함께 참조하고, MLP는 토큰 3의 입력에만 계산을 적용한다. 변환 블록과 출력은 토큰 3의 열에 정렬되어 있으며 벡터와 같은 폭이다. 전체 입출력은 T × d이며 출력 벡터에도 d개 성분이 있다.</desc><metadata>{&quot;id&quot;:&quot;01-token-information&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Attention과 MLP는 어느 토큰을 참조할까?</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">토큰 사이에서 정보를 가져오는 계산과, 한 토큰 안의 계산을 구분합니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -205)"><text x="600" y="215" fill="#182C40" font-size="26" font-weight="600" text-anchor="middle">토큰 3의 벡터를 바꿀 때, 어느 입력을 사용할까요?</text><rect x="48" y="246" width="534" height="540" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="291" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">Attention</text><text x="148" y="339" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 1</text><rect x="83" y="358" width="130" height="58" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="148" y="395" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">d차원 벡터</text><path d="M148,427 L432,510" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="315" y="339" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 2</text><rect x="250" y="358" width="130" height="58" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="315" y="395" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">d차원 벡터</text><path d="M315,427 L457,510" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><text x="482" y="339" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 3</text><rect x="417" y="358" width="130" height="58" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="482" y="395" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">d차원 벡터</text><path d="M482,427 L482,510" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="417" y="524" width="130" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="482" y="561" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Attention</text><path d="M482,595 L482,630" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="417" y="644" width="130" height="77" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="482" y="675" fill="#2470BB" font-size="18" font-weight="600" text-anchor="middle">토큰 3 출력</text><text x="482" y="704" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d차원 벡터</text><text x="315" y="757" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 1·2·3의 정보를 함께 반영합니다.</text><rect x="618" y="246" width="534" height="540" rx="14" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="291" fill="#182C40" font-size="29" font-weight="600" text-anchor="middle">MLP</text><text x="718" y="339" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 1</text><rect x="653" y="358" width="130" height="58" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="718" y="395" fill="#657789" font-size="21" font-weight="600" text-anchor="middle">d차원 벡터</text><text x="885" y="339" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 2</text><rect x="820" y="358" width="130" height="58" rx="14" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="885" y="395" fill="#657789" font-size="21" font-weight="600" text-anchor="middle">d차원 벡터</text><text x="1052" y="339" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 3</text><rect x="987" y="358" width="130" height="58" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052" y="395" fill="#2470BB" font-size="21" font-weight="600" text-anchor="middle">d차원 벡터</text><path d="M1052,427 L1052,510" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="987" y="524" width="130" height="60" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052" y="561" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">MLP</text><path d="M1052,595 L1052,630" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#arrow-blue)"/><rect x="987" y="644" width="130" height="77" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1052" y="675" fill="#2470BB" font-size="18" font-weight="600" text-anchor="middle">토큰 3 출력</text><text x="1052" y="704" fill="#2470BB" font-size="20" font-weight="400" text-anchor="middle">d차원 벡터</text><text x="885" y="757" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">토큰 3의 벡터에만 계산을 적용합니다.</text><text x="600" y="829" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">전체 입출력은 T × d · 여기서는 토큰 3의 출력만 보여줍니다.</text><rect x="48" y="873" width="1104" height="151" rx="14" fill="#EDF7F5" stroke="#C8DFDA" stroke-width="1.5"/><text x="80" y="916" fill="#287D78" font-size="27" font-weight="600" text-anchor="start">RMSNorm · Residual 덧셈 · MLP</text><text x="80" y="956" fill="#287D78" font-size="23" font-weight="400" text-anchor="start">각 토큰의 벡터에 독립적으로 적용됩니다.</text><text x="80" y="996" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">같은 MLP의 가중치가 모든 토큰에 동일하게 적용됩니다.</text></g></g><path d="M48,1069 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1107" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">일반적인 dense Transformer 디코더의 순전파를 설명합니다. Attention 내부 연산은 생략했습니다.</text></svg>