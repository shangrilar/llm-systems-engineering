<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="916" viewBox="0 0 1200 916" role="img" aria-labelledby="title desc"><title id="title">Tree: reduce, then broadcast</title><desc id="desc">GPU 1 sends to 0 and GPU 3 to 2; GPU 2 then sends its partial sum to 0. The full sum returns along reversed edges.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="916" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Tree: reduce, then broadcast</text><text x="48" y="108.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Each transfer carries all four elements, rather than one chunk as in the ring.</text><path d="M48,160 H1152" stroke="#DCE4EC"/><rect x="48" y="198" width="168" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Step</text><rect x="222" y="198" width="420" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">Transfers in the same step</text><rect x="648" y="198" width="498" height="58" rx="10" fill="#E8EDF4" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="235.0" fill="#182C40" font-size="23" font-weight="700" text-anchor="start">New result</text><rect x="48" y="264" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reduce 1</text><rect x="222" y="264" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 1 → 0; GPU 3 → 2</text><rect x="648" y="264" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="298.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0: [11,22,33,44]</text><text x="662" y="328.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 2: [1100,2200,3300,4400]</text><rect x="48" y="380" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="414.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Reduce 2</text><rect x="222" y="380" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="414.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 2 → 0</text><rect x="648" y="380" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="414.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0: [1111,2222,3333,4444]</text><rect x="48" y="496" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="530.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Broadcast 1</text><rect x="222" y="496" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="530.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0 → 2</text><rect x="648" y="496" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="530.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPUs 0 and 2 hold the full sum</text><rect x="48" y="612" width="168" height="108" rx="10" fill="#F7F9FB" stroke="#DCE4EC" stroke-width="1.5"/><text x="62" y="646.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Broadcast 2</text><rect x="222" y="612" width="420" height="108" rx="10" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="236" y="646.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">GPU 0 → 1; GPU 2 → 3</text><rect x="648" y="612" width="498" height="108" rx="10" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="662" y="646.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">All four GPUs hold the full sum</text><rect x="48" y="772" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="808.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Reduction tree: 1 → 0 ← 2 ← 3</text><text x="72" y="848.0" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">GPU 0 is the reduction root. Broadcast reverses these edges.</text></svg>