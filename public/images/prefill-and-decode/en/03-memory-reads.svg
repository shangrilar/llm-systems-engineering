<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1234" viewBox="0 0 1200 1234" role="img" aria-labelledby="title desc"><title id="title">Weight reuse and KV reads behave differently</title><desc id="desc">Requests A, B, and C reuse the same weights W, but each reads its own independent KV. Batching improves weight reuse without removing the cost of reading accumulated context.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1234" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">Weight reuse and KV reads behave differently</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Each request consumes one new input in this decode step. Arrows denote data</text><text x="48" y="144.2" fill="#526577" font-size="23" font-weight="400" text-anchor="start">dependencies.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="220.0" fill="#7954A3" font-size="28" font-weight="700" text-anchor="start">Read model weights</text><text x="642" y="220.0" fill="#287D78" font-size="28" font-weight="700" text-anchor="start">Read request KV</text><g data-box="48,253,510,170"><rect x="48" y="253" width="510" height="170" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="68" y="288.0" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Requests use the same W</text><text x="68" y="331.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Batch requests using the same weights</text><text x="68" y="361.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">More tokens increase weight reuse</text></g><g data-box="642,253,510,170"><rect x="642" y="253" width="510" height="170" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="662" y="288.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">One context per request</text><text x="662" y="331.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">A uses KV(A), B uses KV(B), C uses</text><text x="662" y="361.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">KV(C)</text><text x="662" y="392.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">More requests also add KV to read</text></g><rect x="207" y="468" width="190" height="91" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="302" y="526.0" fill="#7954A3" font-size="31" font-weight="700" text-anchor="middle">W</text><rect x="55" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="112.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">A</text><path d="M302,573 L112,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="642" y="468" width="160" height="91" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="722" y="523.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">KV(A)</text><rect x="664" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="721.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">A</text><path d="M722,573 L722,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="241" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="298.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">B</text><path d="M302,573 L298,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="816" y="468" width="160" height="91" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="896" y="523.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">KV(B)</text><rect x="838" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="895.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">B</text><path d="M896,573 L896,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="427" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="484.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">C</text><path d="M302,573 L484,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="990" y="468" width="160" height="91" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="1070" y="523.0" fill="#287D78" font-size="25" font-weight="700" text-anchor="middle">KV(C)</text><rect x="1012" y="638" width="115" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1069.5" y="675.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">C</text><path d="M1070,573 L1070,624" stroke="#526577" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="48" y="750.0" fill="#7954A3" font-size="24" font-weight="700" text-anchor="start">Reuse the same W across new tokens</text><text x="642" y="750.0" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">Independent contexts are not attended</text><text x="642" y="783.6" fill="#287D78" font-size="24" font-weight="700" text-anchor="start">as one</text><g data-box="48,828,1104,122"><rect x="48" y="828" width="1104" height="122" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="863.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Small-batch decode can read many weight/KV bytes for relatively few FLOPs</text><text x="70" y="905.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Longer contexts add KV traffic per request. Batching gains do not grow without</text><text x="70" y="935.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">limit.</text></g><g data-box="48,990,1104,120"><rect x="48" y="990" width="1104" height="120" rx="10" fill="#F5F7FA" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="1025.0" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Distinguish memory bandwidth limits from insufficient capacity</text><text x="70" y="1067.0" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Being limited by reading speed differs from running out of space to store KV.</text></g><text x="48" y="1160.0" fill="#526577" font-size="22" font-weight="400" text-anchor="start">Baseline: independent KV, no prefix sharing. The bottleneck varies with T, context</text><text x="48" y="1190.8" fill="#526577" font-size="22" font-weight="400" text-anchor="start">length, precision, model, and hardware.</text></svg>