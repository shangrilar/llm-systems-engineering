<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1358" viewBox="0 0 1200 1358" role="img" aria-labelledby="title desc"><title id="title">Completing the Output Tile by Tile</title><desc id="desc">Two Q rows on the left, four K vectors above, four V vectors below, and output accumulator vectors on the right. K and V are transposed to arrange tokens horizontally. The center shows only the current 2×2 tile of scores or unnormalized exponentials. Q and output positions stay fixed while traversing two K/V tiles. The full grid maps processing positions and does not store the full score matrix. This educational example omits scaling and masking. Current step: Next tile · Accumulate into the same output.</desc><metadata>{&quot;id&quot;:&quot;03-step-08&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Completing the Output Tile by Tile</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Q left · K top · V bottom · Output right — follow the computation in one view.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><rect x="48" y="195" width="1104" height="94" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="76" y="233" fill="#2470BB" font-size="27" font-weight="700" text-anchor="start">8 / 9    Next tile · Accumulate into the same output</text><text x="76" y="269" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Add the new Value weighted sum to rescaled a without rereading previous scores.</text><text x="550" y="332" fill="#7954A3" font-size="25" font-weight="700" text-anchor="middle">Keys Kᵀ · One column vector per token</text><text x="370" y="369" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">K0</text><rect x="336" y="384" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="370" y="413" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">1</text><rect x="336" y="429" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="370" y="458" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">2</text><text x="490" y="369" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">K1</text><rect x="456" y="384" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="490" y="413" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">2</text><rect x="456" y="429" width="68" height="42" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="490" y="458" fill="#5C6C7C" font-size="22" font-weight="600" text-anchor="middle">1</text><text x="610" y="369" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">K2</text><rect x="576" y="384" width="68" height="42" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="610" y="413" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">3</text><rect x="576" y="429" width="68" height="42" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="610" y="458" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">0</text><text x="730" y="369" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">K3</text><rect x="696" y="384" width="68" height="42" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="730" y="413" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">2</text><rect x="696" y="429" width="68" height="42" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="730" y="458" fill="#7954A3" font-size="22" font-weight="600" text-anchor="middle">1</text><text x="151" y="549" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">Queries Q</text><text x="1036" y="549" fill="#287D78" font-size="20" font-weight="700" text-anchor="middle">Output accumulator a</text><text x="550" y="549" fill="#287D78" font-size="24" font-weight="700" text-anchor="middle">exp(score − m) tile</text><text x="63" y="570" fill="#2470BB" font-size="20" font-weight="600" text-anchor="start">Q0</text><rect x="62" y="582" width="84" height="54" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="104" y="617" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">1</text><rect x="149" y="582" width="84" height="54" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="191" y="617" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">0</text><rect x="311" y="573" width="114" height="73" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="368" y="617.5" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="middle"></text><text x="368" y="617" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">Consumed</text><rect x="431" y="573" width="114" height="73" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="488" y="617.5" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="middle"></text><text x="488" y="617" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">Consumed</text><rect x="551" y="573" width="114" height="73" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="608" y="617.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1</text><rect x="671" y="573" width="114" height="73" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="728" y="617.5" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">0.368</text><path d="M802,609 L923,609" fill="none" stroke="#287D78" stroke-width="3" marker-end="url(#arrow-teal)"/><text x="862" y="591" fill="#287D78" font-size="16" font-weight="600" text-anchor="middle">+ weighted sum</text><rect x="940" y="582" width="91" height="54" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="985.5" y="617" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">0.639</text><rect x="1034" y="582" width="91" height="54" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="1079.5" y="617" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle">3.104</text><text x="1033" y="671" fill="#7954A3" font-size="19" font-weight="600" text-anchor="middle">m = 3 · ℓ ≈ 1.871</text><text x="63" y="674" fill="#2470BB" font-size="20" font-weight="600" text-anchor="start">Q1</text><rect x="62" y="686" width="84" height="54" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="104" y="721" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle">0</text><rect x="149" y="686" width="84" height="54" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="191" y="721" fill="#2470BB" font-size="22" font-weight="600" text-an