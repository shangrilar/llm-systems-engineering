<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1843" viewBox="0 0 360 1843" role="img" aria-labelledby="title desc"><title id="title">Correct a mismatch or add the input contribution?</title><desc id="desc">Left: read the retained state with the key,subtract that readout from the value,form a correction with beta and the key,and add it to the retained state. Right: transform input u with Bbar and add its contribution to the retained state. Both then read an output from the new state.</desc><metadata>{&quot;id&quot;:&quot;mamba-05&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Gated DeltaNet §3.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2412.06464v1#S3.SS1&quot;},{&quot;label&quot;:&quot;Kimi Linear §3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2510.26692v1#S3&quot;},{&quot;label&quot;:&quot;Mamba §2–3&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2312.00752v2#S3&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marke