<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc"><title id="title">Storing and Moving Intermediate Matrices</title><desc id="desc">A basic implementation stores intermediate S and P in global memory. QK transpose writes S, and the next computation rereads it for scaling, masking, and Softmax. That computation writes P, which PV rereads. Separate intermediates are not shown for each scaling and masking step. Q, K, V input traffic and O output traffic are omitted to focus on intermediates. Global memory is a logical memory space; caches mean accesses do not correspond one-to-one with physical HBM transfers. Large intermediates for long sequences increase HBM storage and transfer costs. Doubling token count quadruples the elements in each score and probability matrix. The 4 × 4 and 8 × 8 shapes compare sizes, not execution times.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1350" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Storing and Moving Intermediate Matrices</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Data movement in an implementation that stores scores and probabilities in global memory.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="76" y="223" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Computation on the GPU</text><rect x="76" y="255" width="260" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="206" y="298" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Compute scores</text><text x="206" y="340" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">QKᵀ</text><rect x="470" y="255" width="260" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="298" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Compute probabilities</text><text x="600" y="340" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Scaling · Masking</text><text x="600" y="372" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">Softmax</text><rect x="864" y="255" width="260" height="136" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="994" y="298" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">Compute output</text><text x="994" y="340" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">PV</text><rect x="48" y="543" width="1104" height="300" rx="12" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="76" y="585" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">Global memory</text><text x="76" y="620" fill="#B55B22" font-size="22" font-weight="400" text-anchor="start">Intermediate matrices</text><rect x="235" y="630" width="280" height="102" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="375.0" y="689.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Scores S · T × T</text><rect x="686" y="630" width="280" height="102" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="826.0" y="689.0" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Probabilities P · T × T</text><path d="M210,404 L310,616" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="159" y="480" fill="#B55B22" font-size="24" font-weight="700" text-anchor="start">Store</text><path d="M447,616 L548,404" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="535" y="499" fill="#B55B22" font-size="22" font-weight="700" text-anchor="start">Reread</text><path d="M654,404 L755,616" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="720" y="480" fill="#B55B22" font-size="24" font-weight="700" text-anchor="start">Store</text><path d="M900,616 L1001,404" fill="none" stroke="#B55B22" stroke-width="3" marker-end="url(#orange)"/><text x="990" y="499" fill="#B55B22" font-size="22" font-weight="700" text-anchor="start">Reread</text><text x="600" y="799" fill="#B55B22" font-size="25" font-weight="600" text-anchor="middle">Larger stored intermediates mean more data to pass to the next computation.</text><rect x="48" y="891" width="1104" height="348" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="76" y="938" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">Intermediate matrices grow faster than the token count.</text><rect x="202" y="1025" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><rect x="227" y="1025" width="22" height="22" rx="3" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><r