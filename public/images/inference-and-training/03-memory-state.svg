<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1364" viewBox="0 0 1200 1364" role="img" aria-labelledby="title desc"><title id="title">학습과 추론에서 사용하는 GPU 메모리</title><desc id="desc">학습과 추론 모두 모델 가중치를 GPU 메모리에 둡니다. 학습은 역전파용 활성값, 그레디언트, 옵티마이저 상태를 유지하고 추론은 이후 생성에 재사용할 KV 캐시를 유지합니다. 두 실행 모두 중간값과 작업 공간이 필요합니다. 카드는 저장 목적을 비교하며 사용량과 비율을 나타내지 않습니다.</desc><metadata>{&quot;id&quot;:&quot;03-memory-state&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 2</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">학습과 추론에서 사용하는 GPU 메모리</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">둘 다 모델 가중치를 사용하지만, 다음 계산을 위해 보관하는 상태는 다릅니다.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><text x="48" y="219" fill="#287D78" font-size="29" font-weight="700" text-anchor="start">학습</text><text x="642" y="219" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">추론</text><g data-box="48,255,510,126"><rect x="48" y="255" width="510" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="290" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">모델 가중치 W</text><text x="68" y="333" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">한 배치의 입력들이 함께 사용</text><text x="68" y="363.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">가중치 갱신의 대상</text></g><g data-box="642,255,510,126"><rect x="642" y="255" width="510" height="126" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="662" y="290" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">모델 가중치 W</text><text x="662" y="333" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">여러 요청이 함께 사용</text><text x="662" y="363.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">생성 동안 가중치 유지</text></g><text x="48" y="433" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">가중치 갱신을 위해 유지</text><text x="642" y="433" fill="#B55B22" font-size="26" font-weight="700" text-anchor="start">이후 생성을 위해 유지</text><g data-box="48,470,510,132"><rect x="48" y="470" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="505" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">저장 활성값</text><text x="68" y="548" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">순전파에서 만든 중간값</text><text x="68" y="578.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">역전파의 기울기 계산에 사용</text></g><g data-box="48,622,510,132"><rect x="48" y="622" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="657" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">그레디언트</text><text x="68" y="700" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">역전파로 계산한 기울기</text><text x="68" y="730.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">가중치 갱신에 사용</text></g><g data-box="48,774,510,132"><rect x="48" y="774" width="510" height="132" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="68" y="809" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">옵티마이저 상태</text><text x="68" y="852" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">업데이트에 쓰는 누적 통계 등</text><text x="68" y="882.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">옵티마이저에 따라 구성이 달라짐</text></g><g data-box="642,470,510,132"><rect x="642" y="470" width="510" height="132" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="662" y="505" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV 캐시</text><text x="662" y="548" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">처리한 토큰에서 계산한 K와 V</text><text x="662" y="578.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">이후 생성에서 다시 읽기 위해 보관</text></g><text x="642" y="661" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">요청의 문맥을 이어 가는 상태</text><text x="642" y="714" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">더 많은 요청을 동시에 유지하거나</text><text x="642" y="747.6" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">더 긴 문맥을 보관하면</text><text x="642" y="781.2" fill="#182C40" font-size="24" font-weight="400" text-anchor="start">KV에 필요한 저장 공간이 늘어납니다.</text><g data-box="48,955,1104,142"><rect x="48" y="955" width="1104" height="142" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="70" y="990" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">양쪽 모두 실행 중 중간값과 작업 공간이 필요합니다</text><text x="70" y="1032" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">추론도 실행 중 활성값을 만듭니다. 역전파를 위해 보관하지 않는다는 점이 다릅니다.</text></g><text x="48" y="1141" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">카드는 저장 역할을 설명하며, 독립된 메모리 영역의 분할이나 실제 사용량·비율을 나타내지 않습니다.</text><text x="48" y="1204" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">전체 가중치 학습과 KV 캐시 생성의 GPU 내 기본 구성입니다. 세부 저장 방식은 달라질 수 있습니다.</text></g></g><path d="M48,1286 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1324" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">학습은 역전파와 갱신에 쓸 상태를, 추론은 이후 생성에 쓸 KV 캐시를 유지합니다.</text></svg>