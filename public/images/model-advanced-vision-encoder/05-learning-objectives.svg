<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1506" viewBox="0 0 1200 1506" role="img" aria-labelledby="title desc"><title id="title">시각 인코더는 서로 다른 정답으로 학습할 수 있습니다</title><desc id="desc">분류는 클래스, 이미지–텍스트 정렬은 올바른 짝, 복원은 가려진 픽셀, 언어 생성은 다음 텍스트 토큰을 학습 목표로 삼을 수 있습니다. 네 가지는 선택 가능한 예시이며 필수 연속 단계가 아닙니다. 정렬의 텍스트 인코더는 답변을 생성하는 LLM과 역할이 다릅니다.</desc><metadata>{&quot;id&quot;:&quot;ma-21-05&quot;,&quot;locale&quot;:&quot;ko&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;ViT&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2010.11929&quot;},{&quot;label&quot;:&quot;CLIP&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2103.00020&quot;},{&quot;label&quot;:&quot;MAE&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2111.06377&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">그림 5 · 시각 인코더</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">시각 인코더는 서로 다른 정답으로 학습할 수 있습니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">ViT는 구조 · 목적 함수는 학습할 문제의 선택</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">A. 이미지와 설명의 짝</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="220" height="140" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">이미지 인코더</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">사진 → 요약 벡터</text></g><g data-container="true"><rect x="280" y="110" width="220" height="140" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="296" y="141" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">텍스트 인코더</text><text x="296" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">설명 → 문장 벡터</text></g><path d="M130 260 L200 310" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M390 260 L320 310" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="260" y="350" fill="#182C40" font-size="22" font-weight="600" text-anchor="middle" data-max-width="480">이미지 × 설명의 유사도</text><g data-container="true"><rect x="140" y="390" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="177.5" y="430.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">✓</text></g><g data-container="true"><rect x="223" y="390" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260.5" y="430.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="306" y="390" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="343.5" y="430.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="140" y="463" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="177.5" y="503.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="223" y="463" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260.5" y="503.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">✓</text></g><g data-container="true"><rect x="306" y="463" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="343.5" y="503.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="140" y="536" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="177.5" y="576.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="223" y="536" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260.5" y="576.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">·</text></g><g data-container="true"><rect x="306" y="536" width="75" height="65" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="343.5" y="576.5" fill="#287D78" font-size="25" font-weight="500" text-anchor="middle" data-max-width="63">✓</text></g><text x="128" y="430.5" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="end" data-max-width="64">I₁</text><text x="128" y="503.5" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="end" data-max-width="64">I₂</text><text x="128" y="576.5" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="end" data-max-width="64">I₃</text><text x="177" y="380" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="70">T1</text><text x="260" y="380" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="70">T2</text><text x="343" y="380" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle" data-max-width="70">T3</text><g data-container="true"><rect x="20" y="650" width="480" height="145" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="681" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">정답: 대응하는 이미지–문장 쌍</text><text x="36" y="721" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">맞는 짝의 유사도는 높이고 다른 짝과 구별</text></g><g data-container="true"><rect x="20" y="900" width="480" height="230" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="931" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">다른 예: 이미지 분류</text><text x="36" y="971" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">이미지 → encoder → 분류 head</text><text x="36" y="999" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">예측 클래스와 정답 클래스 비교</text><text x="36" y="1027" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">예: 고양이 / 개</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">B. 이미지를 보고 텍스트 예측</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="20" y="110" width="480" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="36" y="141" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">이미지 → 시각 인코더</text><text x="36" y="181" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">패치별 hidden state</text></g><path d="M260 250 L260 285" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="295" width="480" height="145" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="36" y="326" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">연결 모듈 → 언어 모델</text><text x="36" y="366" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">질문 + 앞선 정답 토큰을 함께 입력</text></g><path d="M260 450 L260 490" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="20" y="500" width="480" height="115" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="531" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">다음 텍스트 토큰 예측</text><text x="36" y="571" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">어휘별 점수 → 정답과 비교</text></g><g data-container="true"><rect x="20" y="650" width="480" height="145" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="36" y="681" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">정답: 다음 텍스트 토큰</text><text x="36" y="721" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">loss가 시각 인코더까지 전달될 수 있음</text><text x="36" y="749" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">갱신 범위는 다음 편에서</text></g><g data-container="true"><rect x="20" y="900" width="480" height="230" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="36" y="931" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">다른 예: 가려진 패치 복원</text><text x="36" y="971" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">일부 패치를 가림 → 보이는 패치로 인코딩</text><text x="36" y="999" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">복원 decoder → 가린 위치의 픽셀 예측</text><text x="36" y="1027" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">원래 픽셀과 비교</text></g></g></svg>