<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1382" viewBox="0 0 360 1382" role="img" aria-labelledby="title desc"><title id="title">The same weights can lead to different computation values</title><desc id="desc">With the same input and weight version, training computes with original values and inference with quantized approximations. Next-token probabilities may differ.</desc><metadata>{&quot;id&quot;:&quot;8-1&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;Miles v0.1 §3.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/abs/2609.08368v1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="16" y="36" fill="#2470BB" font-size="15" font-weight="600" text-anchor="start" data-max-width="328">Figure 1</text><text x="16" y="70" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">The same weights can lead</text><text x="16" y="103.6" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">to different computation</text><text x="16" y="137.2" fill="#182C40" font-size="24" font-weight="700" text-anchor="start" data-max-width="328">values</text><text x="16" y="167.2" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Numbers illustrate simple rounding;</text><text x="16" y="191" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">probability bars are schematic.</text><text x="16" y="214.79999999999998" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">Neither shows an actual FP8</text><text x="16" y="238.59999999999997" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">conversion or measurement.</text><path d="M16,258.59999999999997 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 282.59999999999997) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Training forward · BF16</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="95" width="488" height="92" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="126" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Same input</text><text x="32" y="166" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">P + preceding tokens</text></g><path d="M260 199 L260 230" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="16" y="245" width="488" height="102" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="276" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Same weight version</text><text x="32" y="316" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Example weight: 0.26</text></g><path d="M260 360 L260 400" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="16" y="418" width="488" height="125" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="32" y="449" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Compute with original values</text><text x="32" y="489" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">0.26</text></g><path d="M260 610 L260 648" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="16" y="686" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Next-token probabilities</text><path d="M80 788 L440 788" stroke="#5C6C7C" stroke-width="2" fill="none"/><rect x="105" y="724" width="65" height="64" rx="10" fill="#287D78" stroke="#DCE4EC" stroke-width="1.5"/><text x="137" y="818" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="383">A</text><rect x="230" y="732" width="65" height="56" rx="10" fill="#287D78" stroke="#DCE4EC" stroke-width="1.5"/><text x="262" y="818" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="258">B</text><rect x="355" y="748" width="65" height="40" rx="10" fill="#287D78" stroke="#DCE4EC" stroke-width="1.5"/><text x="387" y="818" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="133">C</text></g><g transform="translate(16 834.1384615384616) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Inference · FP8</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><g data-container="true"><rect x="16" y="95" width="488" height="92" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="126" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Same input</text><text x="32" y="166" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">P + preceding tokens</text></g><path d="M260 199 L260 230" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-container="true"><rect x="16" y="245" width="488" height="102" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="32" y="276" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Same weight version</text><text x="32" y="316" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">Example weight: 0.26</text></g><path d="M260 360 L260 400" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><g data-container="true"><rect x="16" y="418" width="488" height="125" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="32" y="449" fill="#B55B22" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">Compute with quantized values</text><text x="32" y="489" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">0.26 → 0.30</text></g><text x="24" y="578" fill="#B55B22" font-size="21" font-weight="400" text-anchor="start" data-max-width="472">Potential memory and compute savings</text><path d="M260 610 L260 648" stroke="#B55B22" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/><text x="16" y="686" fill="#182C40" font-size="23" font-weight="600" text-anchor="start" data-max-width="488">Next-token probabilities</text><path d="M80 788 L440 788" stroke="#5C6C7C" stroke-width="2" fill="none"/><rect x="105" y="740" width="65" height="48" rx="10" fill="#B55B22" stroke="#DCE4EC" stroke-width="1.5"/><text x="137" y="818" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="383">A</text><rect x="230" y="716" width="65" height="72" rx="10" fill="#B55B22" stroke="#DCE4EC" stroke-width="1.5"/><text x="262" y="818" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="258">B</text><rect x="355" y="748" width="65" height="40" rx="10" fill="#B55B22" stroke="#DCE4EC" stroke-width="1.5"/><text x="387" y="818" fill="#182C40" font-size="20" font-weight="400" text-anchor="middle" data-max-width="133">C</text></g></svg>