<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc"><title id="title">처리하는 토큰 수와 참조하는 문맥 길이는 다릅니다</title><desc id="desc">Prefill은 p0 p1 p2 p3 네 위치를 처리하므로 토큰별 Projection과 MLP의 행은 네 개입니다. Decode는 새 x0 한 위치를 처리하므로 한 행입니다. Prefill의 Attention 참조는 네 행 네 열의 causal 삼각형이고, Decode의 x0 Q는 p0 p1 p2 p3 x0 다섯 위치의 K와 V를 참조합니다. T는 이번 처리 위치 수이고 L은 현재 위치를 포함한 참조 문맥 길이입니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1300" fill="white"/><text x="48" y="60.0" fill="#182C40" font-size="32" font-weight="700" text-anchor="start">처리하는 토큰 수와 참조하는 문맥 길이는 다릅니다</text><text x="48" y="112.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">캐시가 있으면 과거 위치의 토큰별 연산을 반복하지 않아도, Attention은 과거 K/V를 읽습니다.</text><path d="M48,170 H1152" stroke="#DCE4EC"/><text x="48" y="223.0" fill="#2470BB" font-size="29" font-weight="700" text-anchor="start">Prefill</text><text x="650" y="223.0" fill="#B55B22" font-size="29" font-weight="700" text-anchor="start">Decode</text><text x="48" y="265.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">새로 처리할 입력</text><text x="650" y="265.0" fill="#526577" font-size="24" font-weight="400" text-anchor="start">새로 처리할 입력</text><rect x="48" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="88.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p0</text><rect x="140" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="180.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p1</text><rect x="232" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="272.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p2</text><rect x="324" y="289" width="80" height="57" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="364.0" y="326.0" fill="#2470BB" font-size="25" font-weight="700" text-anchor="middle">p3</text><rect x="650" y="289" width="80" height="57" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="690.0" y="326.0" fill="#B55B22" font-size="25" font-weight="700" text-anchor="middle">x0</text><text x="420" y="326.0" fill="#2470BB" font-size="28" font-weight="700" text-anchor="start">T = 4</text><text x="805" y="326.0" fill="#B55B22" font-size="28" font-weight="700" text-anchor="start">T = 1</text><text x="48" y="408.0" fill="#182C40" font-size="27" font-weight="700" text-anchor="start">토큰별 연산의 행 수</text><text x="48" y="449.0" fill="#526577" font-size="23" font-weight="400" text-anchor="start">Projection · MLP 등</text><text x="84" y="507.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p0</text><rect x="132" y="476" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M248,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M306,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M364,476 V516" stroke="#2470BB" stroke-width="1"/><path d="M422,476 V516" stroke="#2470BB" stroke-width="1"/><text x="84" y="556.0" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">p1</text><rect x="132" y="525" width="348" height="40" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><path d="M190,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M248,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M306,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M364,525 V565" stroke="#2470BB" stroke-width="1"/><path d="M