name: Training lab CPU correctness
on:
  pull_request:
    paths: ['labs/training/**', '.github/workflows/training-lab.yml']
  push:
    paths: ['labs/training/**', '.github/workflows/training-lab.yml']
permissions:
  contents: read
jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.0.2 pyarrow==21.0.0
      - run: python -m unittest discover -s tests -v
        working-directory: labs/training
      - run: python -m training_lab runpod --config smoke --dry-run
        working-directory: labs/training
