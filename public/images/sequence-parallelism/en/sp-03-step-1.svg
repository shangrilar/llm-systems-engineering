idth="42" height="42" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="867" y="534.98" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">2</text><rect x="888" y="506" width="42" height="42" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="909" y="534.98" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">2</text><rect x="930" y="506" width="42" height="42" fill="#FFF2E6" stroke="#B55B22" stroke-width="1"/><text x="951" y="534.98" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">4</text><text x="794" y="409.4" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t0</text><text x="794" y="451.4" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t1</text><text x="794" y="493.4" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t2</text><text x="794" y="535.4" font-size="19" fill="#5C6C7C" font-weight="400" text-anchor="end">t3</text><text x="888" y="737" font-size="21" fill="#B55B22" font-weight="700" text-anchor="middle">Same X, different weight columns</text><rect x="284" y="842" width="632" height="44" rx="10" fill="#F3EEF8" stroke="#F3EEF8" stroke-width="1.5"/><text x="600" y="871" font-size="20" fill="#7954A3" font-weight="700" text-anchor="middle">All-Gather: combine the t0·t1 and t2·t3 shards</text><text x="600" y="925" font-size="21" fill="#182C40" font-weight="400" text-anchor="middle">Each GPU applies its weight columns to the inputs of all tokens.</text><text x="600" y="994" font-size="22" fill="#182C40" font-weight="700" text-anchor="middle">The same two GPUs split tokens in SP and hidden features inside TP.</text></g></g><path d="M48,1103 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1141" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">All-Gather collects the token pieces for the TP region; Reduce-Scatter returns the result to token</text><text x="48" y="1170.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">pieces.</text></svg>