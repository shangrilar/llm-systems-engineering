#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="135" y="715.5" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">M</text><text x="135" y="790" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle" data-max-width="260">앞부분의 최종 표현</text><path d="M235 707 L300 707" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="310" y="650" width="200" height="130" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="326" y="681" fill="#287D78" font-size="22" font-weight="600" text-anchor="start" data-max-width="168">KV projection</text><text x="326" y="721" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="168">M → K, V</text></g><path d="M410 790 L410 875" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><rect x="310" y="885" width="200" height="245" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="410" y="925" fill="#287D78" font-size="24" font-weight="600" text-anchor="middle" data-max-width="182">Global KV</text><text x="410" y="976" fill="#287D78" font-size="23" font-weight="400" text-anchor="middle" data-max-width="174">공유 bank</text><rect x="335" y="1012" width="150" height="16" rx="4" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5"/><rect x="335" y="1040" width="150" height="16" rx="4" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5"/><rect x="335" y="1068" width="150" height="16" rx="4" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5"/><rect x="335" y="1096" width="150" height="16" rx="4" fill="#FFFFFF" stroke="#287D78" stroke-width="1.5"/><path d="M135 819 L135 895" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="10" y="905" width="250" height="135" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="936" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="218">Cross-decoder 3</text><text x="26" y="976" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="218">층 hidden → q₃ → 읽기</text></g><path d="M300 972 L270 972" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M135 1050 L135 1165" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><g data-container="true"><rect x="10" y="1175" width="250" height="135" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="26" y="1206" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="218">Cross-decoder 4</text><text x="26" y="1246" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="218">층 hidden → q₄ → 읽기</text></g><path d="M410 1140 V1242 H270" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><path d="M135 1320 L135 1360" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><text x="135" y="1400" fill="#2470BB" font-size="24" font-weight="600" text-anchor="middle" data-max-width="260">출력 표현</text><g data-container="true"><rect x="600" y="560" width="480" height="250" rx="10" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="616" y="591" fill="#657789" font-size="22" font-weight="600" text-anchor="start" data-max-width="448">하나의 global KV를 재사용</text><text x="616" y="631" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">층별 상태: 고정 크기¹</text><text x="616" y="659" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">Global KV: 문맥 길이 T에 따라 증가</text><text x="616" y="687" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="448">청록: 읽기 · 주황: 갱신</text></g><text x="610" y="875" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="460">¹ 모델 크기와 local window 고정</text></g></svg>