<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1285" viewBox="0 0 1200 1285" role="img" aria-labelledby="title desc"><title id="title">From request arrival to completion</title><desc id="desc">Requests wait after input preparation, are selected within resource limits, execute, and update state and output. Unfinished requests repeat; KV pressure can delay admission or trigger preemption and reclamation.</desc><metadata>{&quot;id&quot;:&quot;02-request-lifecycle&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 3</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">From request arrival to completion</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">A conceptual map; engines differ in how they order selection, allocation, and delivery.</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -206)"><g data-box="48,208,692,121"><rect x="48" y="208" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="243" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Request arrives · prepare input</text><text x="68" y="286" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Tokenize text and create request state</text></g><path d="M394,331 L394,347" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="48,359,692,121"><rect x="48" y="359" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="394" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Waiting queue</text><text x="68" y="437" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Arriving requests wait for an execution opportunity</text></g><path d="M394,482 L394,498" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="48,510,692,121"><rect x="48" y="510" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="545" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Select work · check resources</text><text x="68" y="588" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Consider both the step token budget and KV capacity</text></g><path d="M394,633 L394,649" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="48,661,692,121"><rect x="48" y="661" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="696" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Execute selected tokens as a batch</text><text x="68" y="739" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Compute while preserving each request’s context</text></g><path d="M394,784 L394,800" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="48,812,692,121"><rect x="48" y="812" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="847" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Select next tokens · update state</text><text x="68" y="890" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Update KV, token history, and stop conditions</text></g><path d="M394,935 L394,951" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><g data-box="48,963,692,121"><rect x="48" y="963" width="692" height="121" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="68" y="998" fill="#2470BB" font-size="25" font-weight="700" text-anchor="start">Deliver output · clean up ended requests</text><text x="68" y="1041" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Free unused resources after finish or cancellation</text></g><g data-box="816,208,336,162"><rect x="816" y="208" width="336" height="162" rx="10" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="836" y="243" fill="#287D78" font-size="25" font-weight="700" text-anchor="start">Before execution</text><text x="836" y="286" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Waiting ≠ in progress</text><text x="836" y="316.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">≠ selected in this</text><text x="836" y="347.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">batch</text></g><g data-box="816,420,336,238"><rect x="816" y="420" width="336" height="238" rx="10" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="836" y="455" fill="#B55B22" font-size="25" font-weight="700" text-anchor="start">KV space shortage</text><text x="836" y="498" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Delay admission, or</text><text x="836" y="528.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">preempt a request</text><text x="836" y="559.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">→ free KV → wait</text></g><path d="M751,556 L802,556" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="816" y="714" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">Selection and allocation</text><text x="816" y="744.8" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">interact</text><g data-box="816,814,336,187"><rect x="816" y="814" width="336" height="187" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="836" y="849" fill="#7954A3" font-size="25" font-weight="700" text-anchor="start">Unfinished requests</text><text x="836" y="892" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Return to selection</text><text x="836" y="922.8" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">Output delivery may</text><text x="836" y="953.6" fill="#182C40" font-size="22" font-weight="400" text-anchor="start">overlap with execution</text></g><path d="M740,1019 H778 V510 H751" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="48" y="1126" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">These are request-management steps, not interruptions of a running GPU kernel.</text></g></g><path d="M48,1177 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1215" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">A batch is the unit that runs several requests’ work together; scheduling chooses which work joins each</text><text x="48" y="1244.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">run.</text></svg>