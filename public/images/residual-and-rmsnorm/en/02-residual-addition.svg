<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
<title id="title">Add an update to the input vector</title><desc id="desc">The input [1,2,−1,0] passes unchanged down the main path. Adding the illustrative update [0.2,−0.5,0.3,0.1] yields [1.2,1.5,−0.7,0.1]. Addition matches components, preserving d = 4.</desc><defs><marker id="arrow-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#8191A0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#2470BB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#287D78" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path,line{stroke-linecap:round;stroke-linejoin:round}</style>
<rect width="1200" height="1110" fill="white"/>
<text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 2</text>
<text x="48" y="98" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Add an update to the input vector</text><text x="48" y="139" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">The d-dimensional input passes through unchanged; a d-dimensional update is added.</text><path d="M48,169 L1152,169" fill="none" stroke="#DCE4EC" stroke-width="2"/>
<text x="80" y="221" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start">Zoom in on one token vector.</text><text x="420" y="270" fill="#2470BB" font-size="27" font-weight="600" text-anchor="middle">Input x</text><path d="M260,318 V310 H580 V318" fill="none" stroke="#5C6C7C" stroke-width="1.5"/><text x="420.0" y="297" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Model dimension d = 4</text><rect x="260.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="300.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="340.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="380.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="420.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="460.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="500.0" y="327" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="540.0" y="366.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M420,387 L420,562" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue-arrow)"/><path d="M420,424 H930 V461" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><circle cx="420" cy="424" r="5" fill="#2470BB"/><rect x="770" y="474" width="320" height="125" rx="14" fill="#F7F9FB" stroke="#E3E8ED" stroke-width="1.5"/><text x="930" y="513" fill="#728190" font-size="27" font-weight="600" text-anchor="middle">Transformation branch</text><text x="930" y="549" fill="#728190" font-size="22" font-weight="400" text-anchor="middle">RMSNorm →</text><text x="930" y="580" fill="#728190" font-size="22" font-weight="400" text-anchor="middle">Attention or MLP</text><text x="150" y="478" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">Unchanged</text><text x="150" y="513" fill="#2470BB" font-size="25" font-weight="600" text-anchor="start">input</text><text x="420" y="598" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">The same x before addition</text><rect x="260.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="300.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1</text><rect x="340.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="380.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">2</text><rect x="420.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="460.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−1</text><rect x="500.0" y="619" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="540.0" y="658.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0</text><path d="M930,599 L930,635" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><text x="930" y="670" fill="#5C6C7C" font-size="24" font-weight="600" text-anchor="middle">Update Δ · d = 4</text><rect x="770.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="810.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.2</text><rect x="850.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="890.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.5</text><rect x="930.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="970.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.3</text><rect x="1010.0" y="690" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="1050.0" y="729.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.1</text><path d="M930,760 V802 H455" fill="none" stroke="#8191A0" stroke-width="2.5" marker-end="url(#arrow-arrow)"/><path d="M420,679 L420,768" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue-arrow)"/><circle cx="420" cy="802" r="23" fill="white" stroke="#2470BB" stroke-width="3"/><path d="M411,802 L429,802" fill="none" stroke="#2470BB" stroke-width="2.5"/><path d="M420,793 L420,811" fill="none" stroke="#2470BB" stroke-width="2.5"/><text x="150" y="811" fill="#2470BB" font-size="28" font-weight="600" text-anchor="start">x + Δ</text><path d="M420,825 L420,864" fill="none" stroke="#2470BB" stroke-width="4" marker-end="url(#blue-arrow)"/><rect x="260.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="300.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1.2</text><rect x="340.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="380.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">1.5</text><rect x="420.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="460.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">−0.7</text><rect x="500.0" y="878" width="80.0" height="60" rx="0" fill="#EDF5FD" stroke="#C8DCEE" stroke-width="1"/><text x="540.0" y="917.0" fill="#2470BB" font-size="28" font-weight="400" text-anchor="middle">0.1</text><text x="420" y="976" fill="#2470BB" font-size="26" font-weight="600" text-anchor="middle">Output: d = 4</text><rect x="690" y="875" width="450" height="104" rx="14" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="915" y="916" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">Add matching components.</text><text x="915" y="953" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">Example: component 2 → 2 + (−0.5) = 1.5</text><path d="M48,1030 L1152,1030" fill="none" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1071" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start">d = 4 and values are illustrative. Attention can also reference other tokens.</text>
</svg>