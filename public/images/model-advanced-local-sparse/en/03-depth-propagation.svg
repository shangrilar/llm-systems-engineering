t x="48" y="1782" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">L2,p5 → L3,p7. Thus L3,p7 can be influenced by input positions p1…p7, but p0 is still out of reach. Indirect</text><text x="48" y="1811.3999999999999" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">propagation does not guarantee the same information preservation as directly reading the original KV.</text></svg>