<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc"><title id="title">Partition layers and connect forward and backward passes</title><desc id="desc">Eight layers are placed two per GPU, from GPU 0 to GPU 3.</desc><metadata>{&quot;id&quot;:&quot;pp-01-step-0&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 1</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Partition layers and connect forward and backward passes</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">One block = one Transformer layer · Arrows = computation direction for one input</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1)" data-panel="1"><g transform="translate(-48 -196)"><text x="600" y="211" fill="#182C40" font-size="27" font-weight="700" text-anchor="middle">One model · Eight Transformer layers</text><rect x="40" y="247" width="264" height="281" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="172" y="285" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 0</text><rect x="60" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="107" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 0</text><rect x="190" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="237" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 1</text><text x="172" y="477" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Stage 0 · Two layers</text><rect x="320" y="247" width="264" height="281" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="452" y="285" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 1</text><rect x="340" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="387" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 2</text><rect x="470" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="517" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 3</text><text x="452" y="477" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Stage 1 · Two layers</text><rect x="600" y="247" width="264" height="281" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="732" y="285" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 2</text><rect x="620" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="667" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 4</text><rect x="750" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="797" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 5</text><text x="732" y="477" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Stage 2 · Two layers</text><rect x="880" y="247" width="264" height="281" rx="10" fill="#F8FAFC" stroke="#DCE4EC" stroke-width="1.5"/><text x="1012" y="285" fill="#182C40" font-size="25" font-weight="700" text-anchor="middle">GPU 3</text><rect x="900" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="947" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 6</text><rect x="1030" y="326" width="94" height="106" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1077" y="385" fill="#182C40" font-size="23" font-weight="700" text-anchor="middle">Layer 7</text><text x="1012" y="477" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Stage 3 · Two layers</text><rect x="48" y="570" width="1104" height="100" rx="10" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="72" y="606" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Each GPU holds and computes its own layers</text><text x="72" y="646" fill="#182C40" font-size="23" font-weight="400" text-anchor="start">One input passes through the layers on all four GPUs.</text><text x="600" y="746" fill="#182C40" font-size="24" font-weight="400" text-anchor="middle">Next: see the directions of forward and backward passes</text></g></g><path d="M48,808 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="846" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">The forward pass runs from GPU 0 to GPU 3; the backward pass runs in reverse.</text></svg>