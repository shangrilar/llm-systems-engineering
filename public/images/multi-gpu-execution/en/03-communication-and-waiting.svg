<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1234" viewBox="0 0 1200 1234" role="img" aria-labelledby="title desc"><title id="title">More GPUs do not guarantee proportional speedup</title><desc id="desc">The same workload takes 100 ms on one GPU. Balanced: 50 ms compute per GPU and 10 ms communication/combine finish at 60 ms. Uneven: GPU 0 computes for 30 and waits 40 ms while GPU 1 computes for 70, then 10 ms communication/combine finishes at 80 ms. The 40 ms wait is not added again. Illustrative, with no compute/communication overlap.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1234" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Hardware 11 · Figure 3</text><text x="48" y="99" fill="#182C40" font-size="34" font-weight="700" text-anchor="start">More GPUs do not guarantee proportional speedup</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Extend one GPU’s timeline to include multiple GPUs, communication, and waiting.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="198" width="22" height="22" rx="3" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="82" y="216" fill="#2470BB" font-size="21" font-weight="400" text-anchor="start">Compute</text><rect x="239" y="198" width="22" height="22" rx="3" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="273" y="216" fill="#7954A3" font-size="21" font-weight="400" text-anchor="start">Transfer / combine</text><rect x="555" y="198" width="22" height="22" rx="3" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="589" y="216" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">Wait</text><text x="1152" y="216" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="end">Same workload · Unit: ms</text><text x="281" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">0</text><path d="M281,320 V385 M281,477 V627 M281,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="421" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">20</text><path d="M421,320 V385 M421,477 V627 M421,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="561" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">40</text><path d="M561,320 V385 M561,477 V627 M561,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="701" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">60</text><path d="M701,320 V385 M701,477 V627 M701,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="841" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">80</text><path d="M841,320 V385 M841,477 V627 M841,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="981" y="264" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">100</text><path d="M981,320 V385 M981,477 V627 M981,778 V928" fill="none" stroke="#DCE4EC" stroke-width="2" stroke-dasharray="7 6"/><text x="48" y="311" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">One GPU</text><text x="48" y="363" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 0</text><rect x="281" y="331" width="700" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="631.0" y="363.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Full computation: 100</text><text x="1010" y="363" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">100 ms</text><text x="48" y="463" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Balanced split</text><text x="48" y="520" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 0</text><rect x="281" y="488" width="350" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="456.0" y="520.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Compute: 50</text><rect x="631" y="488" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="666.0" y="520.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><text x="48" y="600" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 1</text><rect x="281" y="568" width="350" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="456.0" y="600.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Compute: 50</text><rect x="631" y="568" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="666.0" y="600.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><path d="M666,541 L666,561" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="725" y="601" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">60 ms</text><text x="281" y="659" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">50 ms compute + 10 ms transfer / combine = 60 ms</text><text x="48" y="765" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">Uneven split</text><text x="48" y="821" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 0</text><rect x="281" y="789" width="210" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="386.0" y="821.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Compute: 30</text><rect x="491" y="789" width="280" height="48" rx="12" fill="#F1F4F7" stroke="#5C6C7C" stroke-width="1.5"/><text x="631.0" y="821.0" fill="#5C6C7C" font-size="23" font-weight="600" text-anchor="middle">Wait: 40</text><rect x="771" y="789" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="806.0" y="821.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><text x="48" y="901" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start">GPU 1</text><rect x="281" y="869" width="490" height="48" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="526.0" y="901.0" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">Compute: 70</text><rect x="771" y="869" width="70" height="48" rx="12" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="806.0" y="901.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">10</text><path d="M806,842 L806,862" fill="none" stroke="#7954A3" stroke-width="2" marker-end="url(#purple)"/><text x="865" y="901" fill="#182C40" font-size="25" font-weight="700" text-anchor="start">80 ms</text><text x="281" y="959" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">70 ms for the slower computation + 10 ms transfer / combine = 80 ms</text><rect x="48" y="1049" width="1104" height="137" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="600" y="1095" fill="#182C40" font-size="26" font-weight="700" text-anchor="middle">Less computation per GPU can come with communication and waiting.</text><text x="600" y="1137" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle">Elapsed time follows the execution path; it is not the sum of GPU times.</text></svg>