rect x="378" y="122" width="80" height="70" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="418" y="165" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p2</text><rect x="502" y="122" width="80" height="70" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="542" y="165" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p3</text><rect x="626" y="122" width="80" height="70" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="666" y="165" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p4</text><rect x="750" y="122" width="80" height="70" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="790" y="165" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p5</text><rect x="874" y="122" width="80" height="70" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="914" y="165" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p6</text><rect x="998" y="122" width="80" height="70" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1038" y="165" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="68">p7</text><path d="M294 654 L542 560" stroke="#B55B22" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/><path d="M542 474 L790 380" stroke="#B55B22" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/><path d="M790 294 L1038 200" stroke="#B55B22" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/><text x="104" y="707" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="end" data-max-width="64">L0</text><text x="104" y="527" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="end" data-max-width="64">L1</text><text x="104" y="347" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="end" data-max-width="64">L2</text><text x="104" y="167" fill="#5C6C7C" font-size="27" font-weight="600" text-anchor="end" data-max-width="64">L3</text><path d="M24 731 L24 114" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="0" y="86" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="start" data-max-width="150">층 깊이</text><path d="M130 784 L1080 784" stroke="#5C6C7C" stroke-width="2.5" fill="none" marker-end="url(#arrow-muted)"/><text x="605" y="825" fill="#5C6C7C" font-size="25" font-weight="400" text-anchor="middle" data-max-width="500">토큰 위치 →</text><text x="550" y="886" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle" data-max-width="1080">주황: 가능한 경로 하나 · 초록: 그 밖의 조상 위치</text><path d="M0 945 L1104 945" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="0" y="985" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="1104">p7에 영향을 줄 수 있는 입력(L0)의 범위</text><text x="612" y="1044" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="middle" data-max-width="360">입력 위치 j</text><rect x="390" y="1085" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="446" y="1085" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="502" y="1085" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="558" y="1085" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="614" y="1085" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="670" y="1085" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="726" y="1085" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="782" y="1085" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="390" y="1141" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="446" y="1141" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="502" y="1141" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="558" y="1141" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="614" y="1141" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="670" y="1141" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="726" y="1141" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="782" y="1141" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="390" y="1197" width="52" height="52" rx="3" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><rect x="446" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="502" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="558" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="614" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="670" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="726" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><rect x="782" y="1197" width="52" height="52" rx="3" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="416" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">0</text><text x="472" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">1</text><text x="528" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">2</text><text x="584" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">3</text><text x="640" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">4</text><text x="696" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">5</text><text x="752" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">6</text><text x="808" y="1073" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="middle" data-max-width="52">7</text><text x="372" y="1119" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L1, p7</text><text x="372" y="1175" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L2, p7</text><text x="372" y="1231" fill="#182C40" font-size="23" font-weight="600" text-anchor="end" data-max-width="120">L3, p7</text><text x="552" y="1313" fill="#5C6C7C" font-size="25" font-weight="600" text-anchor="middle" data-max-width="1084">p0은 세 층으로 아직 도달하지 못합니다.</text></g><path d="M48,1632 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1670" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">한 층을 지날 때 오른쪽으로 최대 두 위치까지 전달됩니다. 강조한 경로는 L0,p1 → L1,p3 → L2,p5 → L3,p7입니다.</text><text x="48" y="1699.4" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">따라서 L3,p7은 입력 p1…p7의 영향을 받을 수 있지만 p0은 아직 도달하지 못합니다. 간접 전달은 원래 KV를 직접 읽는</text><text x="48" y="1728.8" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">것과 같은 정보 보존을 보장하지 않습니다.</text></svg>