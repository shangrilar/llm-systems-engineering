<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1210" viewBox="0 0 1200 1210" role="img" aria-labelledby="title desc"><title id="title">Independent Output Elements, Different Computations</title><desc id="desc">Three columns compare element-wise addition, row-sum reduction, and matrix multiplication. Each shows two independently computed results. Expanding the first gives 1+10=11, the sum of 1 through 8 equal to 36, and 1×1+2×0+3×2=7. The row of X and column of W are displayed horizontally to align their K positions. Input range and work per output differ. Reduction here produces one result per row.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6" /></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6" /></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6" /></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6" /></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6" /></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1210" fill="white" /><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">Figure 4</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">Independent Output Elements, Different Computations</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">Each operation needs a different range of inputs and amount of work per output.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2" /><rect x="48" y="211" width="352" height="838" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="224" y="259" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">Element-wise addition</text><text x="224" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Compute both independently</text><text x="136" y="339" fill="#2470BB" font-size="20" font-weight="600" text-anchor="middle">Result 1</text><rect x="91" y="359" width="90" height="61" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="136.0" y="397.5" fill="#2470BB" font-size="29" font-weight="600" text-anchor="middle">11</text><text x="310" y="339" fill="#5C6C7C" font-size="20" font-weight="600" text-anchor="middle">Result 2</text><rect x="265" y="359" width="90" height="61" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="310.0" y="397.5" fill="#5C6C7C" font-size="29" font-weight="600" text-anchor="middle">22</text><path d="M136,425 V449 H224 V477" fill="none" stroke="#2470BB" stroke-width="2" marker-end="url(#blue)" stroke-dasharray="7 7" /><text x="224" y="518" fill="#2470BB" font-size="23" font-weight="700" text-anchor="middle">Computing result 1</text><text x="224" y="558" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="middle">Two inputs at matching positions</text><rect x="86" y="591" width="98" height="61" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="135.0" y="629.5" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">1</text><text x="224" y="632" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">+</text><rect x="264" y="591" width="98" height="61" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="313.0" y="629.5" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">10</text><text x="224" y="751" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">1 + 10</text><path d="M224,790 L224,822" fill="none" stroke="#2470BB" stroke-width="2.5" marker-end="url(#blue)" /><rect x="164" y="838" width="120" height="60" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5" /><text x="224.0" y="876.0" fill="#2470BB" font-size="30" font-weight="600" text-anchor="middle">11</text><path d="M72,929 H376" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="224" y="977" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">In this example, each output</text><text x="224" y="1011" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">requires one addition.</text><rect x="424" y="211" width="352" height="838" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="600" y="259" fill="#287D78" font-size="27" font-weight="700" text-anchor="middle">Row-sum reduction</text><text x="600" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Compute both independently</text><text x="512" y="339" fill="#287D78" font-size="20" font-weight="600" text-anchor="middle">Result 1</text><rect x="467" y="359" width="90" height="61" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="512.0" y="397.5" fill="#287D78" font-size="29" font-weight="600" text-anchor="middle">36</text><text x="686" y="339" fill="#5C6C7C" font-size="20" font-weight="600" text-anchor="middle">Result 2</text><rect x="641" y="359" width="90" height="61" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="686.0" y="397.5" fill="#5C6C7C" font-size="29" font-weight="600" text-anchor="middle">12</text><path d="M512,425 V449 H600 V477" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)" stroke-dasharray="7 7" /><text x="600" y="518" fill="#287D78" font-size="23" font-weight="700" text-anchor="middle">Computing result 1</text><text x="600" y="558" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="middle">All input elements in a row</text><rect x="455" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="471.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="491" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="507.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">2</text><rect x="527" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="543.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">3</text><rect x="563" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="579.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">4</text><rect x="599" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="615.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">5</text><rect x="635" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="651.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">6</text><rect x="671" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="687.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">7</text><rect x="707" y="606" width="32" height="39" rx="5" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5" /><text x="723.0" y="633.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">8</text><text x="600" y="751" fill="#287D78" font-size="27" font-weight="600" text-anchor="middle">1 + 2 + ⋯ + 8</text><path d="M600,790 L600,822" fill="none" stroke="#287D78" stroke-width="2.5" marker-end="url(#teal)" /><rect x="540" y="838" width="120" height="60" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5" /><text x="600.0" y="876.0" fill="#287D78" font-size="30" font-weight="600" text-anchor="middle">36</text><path d="M448,929 H752" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="600" y="977" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">Add the values in one row</text><text x="600" y="1011" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">to produce one output.</text><rect x="800" y="211" width="352" height="838" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" /><text x="976" y="259" fill="#B55B22" font-size="27" font-weight="700" text-anchor="middle">Matrix multiplication</text><text x="976" y="299" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="middle">Compute both independently</text><text x="888" y="339" fill="#B55B22" font-size="20" font-weight="600" text-anchor="middle">Result 1</text><rect x="843" y="359" width="90" height="61" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="888.0" y="397.5" fill="#B55B22" font-size="29" font-weight="600" text-anchor="middle">7</text><text x="1062" y="339" fill="#5C6C7C" font-size="20" font-weight="600" text-anchor="middle">Result 2</text><rect x="1017" y="359" width="90" height="61" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5" /><text x="1062.0" y="397.5" fill="#5C6C7C" font-size="29" font-weight="600" text-anchor="middle">4</text><path d="M888,425 V449 H976 V477" fill="none" stroke="#B55B22" stroke-width="2" marker-end="url(#orange)" stroke-dasharray="7 7" /><text x="976" y="518" fill="#B55B22" font-size="23" font-weight="700" text-anchor="middle">Computing result 1</text><text x="976" y="558" fill="#5C6C7C" font-size="17" font-weight="400" text-anchor="middle">Inputs from one row and one column</text><text x="824" y="610" fill="#B55B22" font-size="18" font-weight="600" text-anchor="start">Row of X</text><rect x="929" y="581" width="55" height="39" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="956.5" y="608.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="988" y="581" width="55" height="39" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="1015.5" y="608.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">2</text><rect x="1047" y="581" width="55" height="39" rx="5" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5" /><text x="1074.5" y="608.5" fill="#182C40" font-size="24" font-weight="600" text-anchor="middle">3</text><text x="824" y="675" fill="#B55B22" font-size="18" font-weight="600" text-anchor="start">Col. of W</text><rect x="929" y="646" width="55" height="39" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="956.5" y="673.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">1</text><rect x="988" y="646" width="55" height="39" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="1015.5" y="673.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">0</text><rect x="1047" y="646" width="55" height="39" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="1074.5" y="673.5" fill="#B55B22" font-size="24" font-weight="600" text-anchor="middle">2</text><text x="976" y="732" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle">1 × 1 + 2 × 0 + 3 × 2</text><text x="976" y="774" fill="#B55B22" font-size="26" font-weight="600" text-anchor="middle">= 1 + 0 + 6</text><path d="M976,790 L976,822" fill="none" stroke="#B55B22" stroke-width="2.5" marker-end="url(#orange)" /><rect x="916" y="838" width="120" height="60" rx="12" fill="#FFF2E6" stroke="#DCE4EC" stroke-width="1.5" /><text x="976.0" y="876.0" fill="#B55B22" font-size="30" font-weight="600" text-anchor="middle">7</text><path d="M824,929 H1128" fill="none" stroke="#DCE4EC" stroke-width="2" /><text x="976" y="977" fill="#182C40" font-size="21" font-weight="400" text-anchor="middle">Compute and sum K products</text><text x="976" y="1011" fill="#182C40" font-size="22" font-weight="400" text-anchor="middle">to produce one output.</text><text x="600" y="1108" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">Consider both the number of independent outputs</text><text x="600" y="1154" fill="#182C40" font-size="28" font-weight="700" text-anchor="middle">and the computation needed to produce each one.</text></svg>