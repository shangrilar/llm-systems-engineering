Using only local tokens</text><text x="670" y="783.0" font-size="23" fill="#183149" font-weight="700" text-anchor="start">leaves out earlier context t0·t1.</text><text x="402" y="922.0" font-size="21" fill="#587084" font-weight="400" text-anchor="middle">● Token pair computed   — Future token: masked</text><rect x="186" y="968" width="828" height="44" rx="10" fill="#f1eafa" stroke="#f1eafa" stroke-width="1.5"/><text x="600.0" y="997.0" font-size="20" fill="#6750a4" font-weight="700" text-anchor="middle">Ring: circulate K·V blocks / Ulysses: rearrange full context by head</text></svg>