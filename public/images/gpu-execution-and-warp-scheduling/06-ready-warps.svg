<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">상주하는 워프가 모두 실행 가능한 것은 아닙니다</title><desc id="desc">한 워프 스케줄러의 상주 워프 A,B,C,D를 보여준다. A는 필요한 메모리 읽기 결과를, C는 동기화 지점에서 기다린다. B와 D는 다음 명령을 실행할 준비가 되어 있고 스케줄러가 이번에는 B를 선택해 명령을 발행한다. 상주 4개 중 실행 가능 2개, 선택 1개이다. 준비되었지만 선택되지 않은 D와 명령을 발행할 수 없는 A,C를 구분한다. SM 전체에 스케줄러가 하나라는 뜻이 아니며 그림 5의 워프 0~3과 일대일 배정을 나타내지 않는 별도 예시이다.</desc><defs><marker id="muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1050" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start">그림 6</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start">상주하는 워프가 모두 실행 가능한 것은 아닙니다</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start">스케줄러는 다음 명령을 발행할 수 있는 워프를 선택합니다.</text><path d="M48,170 H1152" fill="none" stroke="#DCE4EC" stroke-width="2"/><rect x="48" y="218" width="726" height="554" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="77" y="263" fill="#182C40" font-size="28" font-weight="700" text-anchor="start">한 스케줄러가 담당하는 상주 워프들</text><rect x="74" y="294" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="329" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">워프 A</text><text x="97" y="365" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">메모리 읽기 결과를 기다림</text><rect x="571" y="316" width="152" height="48" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="647.0" y="348.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">대기</text><rect x="74" y="406" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="441" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">워프 B</text><text x="97" y="477" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">다음 명령을 실행할 준비가 됨</text><rect x="571" y="428" width="152" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="647.0" y="460.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">실행 가능</text><rect x="74" y="518" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="553" fill="#7954A3" font-size="26" font-weight="700" text-anchor="start">워프 C</text><text x="97" y="589" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">동기화 지점에서 기다림</text><rect x="571" y="540" width="152" height="48" rx="12" fill="#F3EEF8" stroke="#DCE4EC" stroke-width="1.5"/><text x="647.0" y="572.0" fill="#7954A3" font-size="23" font-weight="600" text-anchor="middle">대기</text><rect x="74" y="630" width="674" height="93" rx="12" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5"/><text x="97" y="665" fill="#287D78" font-size="26" font-weight="700" text-anchor="start">워프 D</text><text x="97" y="701" fill="#5C6C7C" font-size="22" font-weight="400" text-anchor="start">다음 명령을 실행할 준비가 됨</text><rect x="571" y="652" width="152" height="48" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="647.0" y="684.0" fill="#287D78" font-size="23" font-weight="600" text-anchor="middle">실행 가능</text><path d="M750,452 H825 V405 H855" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><path d="M750,676 H825 V472 H855" fill="none" stroke="#287D78" stroke-width="2" marker-end="url(#teal)"/><rect x="861" y="354" width="291" height="187" rx="12" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="1006" y="399" fill="#2470BB" font-size="27" font-weight="700" text-anchor="middle">워프 스케줄러</text><text x="1006" y="449" fill="#2470BB" font-size="23" font-weight="400" text-anchor="middle">실행 가능한 후보 중</text><text x="1006" y="493" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">이번에는 B를 선택</text><path d="M1006,551 L1006,612" fill="none" stroke="#2470BB" stroke-width="3" marker-end="url(#blue)"/><rect x="861" y="630" width="291" height="69" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="1006.5" y="672.5" fill="#2470BB" font-size="23" font-weight="600" text-anchor="middle">B의 다음 명령 발행</text><rect x="48" y="821" width="352" height="70" rx="12" fill="#F1F4F7" stroke="#DCE4EC" stroke-width="1.5"/><text x="224.0" y="864.0" fill="#182C40" font-size="28" font-weight="600" text-anchor="middle">상주 4개</text><rect x="424" y="821" width="352" height="70" rx="12" fill="#EDF7F5" stroke="#DCE4EC" stroke-width="1.5"/><text x="600.0" y="864.0" fill="#287D78" font-size="28" font-weight="600" text-anchor="middle">실행 가능 2개</text><rect x="800" y="821" width="352" height="70" rx="12" fill="#EDF5FD" stroke="#DCE4EC" stroke-width="1.5"/><text x="976.0" y="864.0" fill="#2470BB" font-size="28" font-weight="600" text-anchor="middle">이번에 선택 1개</text><text x="600" y="949" fill="#182C40" font-size="25" font-weight="600" text-anchor="middle">D도 준비되어 있지만, 이번에는 선택되지 않았습니다.</text><text x="600" y="997" fill="#5C6C7C" font-size="24" font-weight="400" text-anchor="middle">대기하는 워프도 SM에 상주하며 자신의 실행 상태를 유지합니다.</text></svg>