<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Add two scores, then combine values</title><desc id="desc">Left: latent cⱼ (1×3) is projected by head 1 matrices Uᴷ₁ and Uⱽ₁ (3×2) into content key and value vectors (1×2). Position key kⱼᴿ (1×2) is shared across heads. Right: add the content and position query-key dot products, scale and softmax across positions, then combine values with the resulting weights.</desc><metadata>{&quot;id&quot;:&quot;ma-03-01&quot;,&quot;locale&quot;:&quot;en&quot;,&quot;kind&quot;:&quot;original educational diagram&quot;,&quot;sources&quot;:[{&quot;label&quot;:&quot;DeepSeek-V2 §2.1&quot;,&quot;url&quot;:&quot;https://arxiv.org/html/2405.04434v5#S2.SS1&quot;}]}</metadata><defs><marker id="arrow-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#182C40" stroke-width="1.6"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6C7C" stroke-width="1.6"/></marker><marker id="arrow-line" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#DCE4EC" stroke-width="1.6"/></marker><marker id="arrow-paper" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#FFFFFF" stroke-width="1.6"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#2470BB" stroke-width="1.6"/></marker><marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#287D78" stroke-width="1.6"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B55B22" stroke-width="1.6"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7954A3" stroke-width="1.6"/></marker><marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#657789" stroke-width="1.6"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34242" stroke-width="1.6"/></marker><marker id="arrow-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4C60A8" stroke-width="1.6"/></marker><marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#8191A0" stroke-width="1.6"/></marker><marker id="arrow-surface" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#F8FAFC" stroke-width="1.6"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}text[font-family]{font-family:Menlo,Consolas,monospace}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="white"/><text x="48" y="49" fill="#2470BB" font-size="18" font-weight="600" text-anchor="start" data-max-width="1104">Figure 2 · Basic MLA computation</text><text x="48" y="99" fill="#182C40" font-size="36" font-weight="700" text-anchor="start" data-max-width="1104">Add two scores, then combine values</text><text x="48" y="141" fill="#5C6C7C" font-size="23" font-weight="400" text-anchor="start" data-max-width="1104">Current position p₃ · Head 1 · j indexes cached positions</text><path d="M48,170 H1152" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(48 206) scale(1.0153846153846153)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">1. Key and value at position j</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><rect x="150" y="115" width="220" height="60" rx="8" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><text x="260" y="153" fill="#287D78" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">cⱼ · 1×3</text><path d="M260 183 L260 215 L130 215 L130 260" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="20" y="270" width="220" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="36" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">× Uᴷ₁</text><text x="36" y="341" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">3×2</text></g><path d="M130 383 L130 432" stroke="#7954A3" stroke-width="2.5" fill="none" marker-end="url(#arrow-purple)"/><rect x="20" y="440" width="220" height="60" rx="8" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="130" y="478" fill="#B55B22" font-size="22" font-weight="600" text-anchor="middle" data-max-width="208">kⱼ,₁ᶜ · 1×2</text><path d="M260 183 L260 215 L390 215 L390 260" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><g data-container="true"><rect x="280" y="270" width="220" height="105" rx="10" fill="#F3EEF8" stroke="#7954A3" stroke-width="1.5"/><text x="296" y="301" fill="#7954A3" font-size="22" font-weight="600" text-anchor="start" data-max-width="188">× Uⱽ₁</text><text x="296" y="341" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="188">3×2</text></g><path d="M390 383 L390 432"