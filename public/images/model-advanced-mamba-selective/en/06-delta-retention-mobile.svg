ill="#5C6C7C" font-size="17" font-weight="400" text-anchor="start" data-max-width="328">= ln(0.5) &lt; 0 · B = 1 · u = 2</text><path d="M16,177.39999999999998 H344" stroke="#DCE4EC" stroke-width="2"/><g transform="translate(16 201.39999999999998) scale(0.6307692307692307)" data-panel="1"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Δ = 1</text><path d="M0 68 L520 68" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="20" y="115" fill="#182C40" font-size="22" font-weight="600" text-anchor="start" data-max-width="500">Old state = 2</text><rect x="20" y="140" width="160" height="44" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M100 195 L100 237" stroke="#287D78" stroke-width="2.5" fill="none" marker-end="url(#arrow-teal)"/><text x="20" y="270" fill="#182C40" font-size="21" font-weight="400" text-anchor="start" data-max-width="480">Retention 0.5 → retained 1</text><rect x="20" y="305" width="160" height="44" rx="4" fill="#FFFFFF" stroke="#DCE4EC" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="20" y="305" width="80" height="44" rx="4" fill="#EDF7F5" stroke="#287D78" stroke-width="1.5"/><path d="M20 395 L500 395" stroke="#DCE4EC" stroke-width="1" fill="none"/><text x="20" y="445" fill="#182C40" font-size="21" font-weight="600" text-anchor="start" data-max-width="500">New input write: Δ × B × u</text><text x="20" y="490" fill="#B55B22" font-size="26" font-weight="600" text-anchor="start" data-max-width="500">1 × 1 × 2 = 2</text><rect x="20" y="520" width="160" height="44" rx="4" fill="#FFF2E6" stroke="#B55B22" stroke-width="1.5"/><text x="20" y="620" fill="#5C6C7C" font-size="18" font-weight="400" text-anchor="start" data-max-width="500">Bar length: state value · same scale</text></g><g transform="translate(16 639.4) scale(0.6307692307692307)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor="start" data-max-width="520">Δ = 2</text><p