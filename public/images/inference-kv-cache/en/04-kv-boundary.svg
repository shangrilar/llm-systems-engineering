d</text></g></g><path d="M48,1414 H1152" stroke="#DCE4EC" stroke-width="2"/><text x="48" y="1452" fill="#5C6C7C" font-size="21" font-weight="400" text-anchor="start" data-max-width="1104">A just-chosen token has no KV yet; its KV is created when it enters the next run as input.</text></svg>