<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1115" viewBox="0 0 1200 1115" role="img" aria-labelledby="title desc"><title id="title">Replicate the entire working GPU group</title><desc id="desc">Replicate the two-GPU TP group. GPUs0 and2 hold W1/W2; GPUs1 and3 hold W3/W4. Both GPUs in group1 compute requests A/B; both GPUs in group2 compute C/D.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1115" fill="white"/><text x="48" y="60.0" font-size="32" fill="#182c40" font-weight="700" text-anchor="start">Replicate the entire working GPU group</text><text x="48" y="111.0" font-size="23" fill="#526577" font-weight="400" text-anchor="start">Copy the weight placement on GPUs 0–1 to GPUs 2–3.</text><path d="M48,158 H1152" stroke="#d5dfe8"/><text x="48" y="145.0" font-size="20" fill="#526577" font-weight="400" text-anchor="start">↔ : communication within a group</text><text x="600" y="213.0" font-size="27" fill="#182c40" font-weight="700" text-anchor="middle">Independent requests A · B · C · D</text><rect x="412.0" y="236" width="76" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="450" y="265.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">A</text><rect x="512.0" y="236" width="76" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="550" y="265.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">B</text><rect x="612.0" y="236" width="76" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="650" y="265.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">C</text><rect x="712.0" y="236" width="76" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="750" y="265.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">D</text><path d="M480,294 L480,331 L312,331 L312,373" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M720,294 L720,331 L888,331 L888,373" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="48" y="387" width="528" height="568" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><text x="312" y="429.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">Group 1 · One model replica</text><rect x="117.0" y="457" width="390" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="312" y="486.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">Assigned requests A · B</text><path d="M312,510 L312,538 L180,538 L180,558" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M312,538 L444,538 L444,558" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="68" y="566" width="224" height="253" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="180.0" y="606.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="84.0" y="633" width="96.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="132.0" y="670.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="180.0" y="633" width="96.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="228.0" y="670.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><text x="180" y="735.0" font-size="25" fill="#247b72" font-weight="700" text-anchor="middle">A · B</text><text x="180" y="782.0" font-size="18" fill="#526577" font-weight="400" text-anchor="middle">Participate in computation</text><rect x="332" y="566" width="224" height="253" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="444.0" y="606.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="348.0" y="633" width="96.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="396.0" y="670.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="444.0" y="633" width="96.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="492.0" y="670.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><text x="444" y="735.0" font-size="25" fill="#247b72" font-weight="700" text-anchor="middle">A · B</text><text x="444" y="782.0" font-size="18" fill="#526577" font-weight="400" text-anchor="middle">Participate in computation</text><path d="M299,684 L325,684" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="312" y="868.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">TP 2 · Split each request’s computation</text><text x="312" y="916.0" font-size="23" fill="#247b72" font-weight="400" text-anchor="middle">Group outputs: A · B</text><rect x="624" y="387" width="528" height="568" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2" stroke-dasharray="8 6"/><text x="888" y="429.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">Group 2 · Same model replica</text><rect x="693.0" y="457" width="390" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="888" y="486.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">Assigned requests C · D</text><path d="M888,510 L888,538 L756,538 L756,558" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/