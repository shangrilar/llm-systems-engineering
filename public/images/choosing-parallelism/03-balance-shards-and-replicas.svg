<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1466" viewBox="0 0 1200 1466" role="img" aria-labelledby="title desc"><title id="title">같은 GPU를 분할과 복제에 다르게 배분하기</title><desc id="desc">같은네GPU를 TP2×DP2의 두모델그룹 또는 TP4×DP1의 한모델그룹으로 구성한다. 첫배치는 A/B와C/D를 별도그룹에, 두번째는 A/B/C/D를 한그룹에 보낸다. 그룹하나도 여러요청을 배칭할수있으며 메모리여유,응답시간,처리량,내부통신을 비교한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M9 1 L1 5 L9 9" fill="none" stroke="#526577" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}path{stroke-linecap:round;stroke-linejoin:round}</style><rect width="1200" height="1466" fill="white"/><text x="48" y="60.0" font-size="32" fill="#182c40" font-weight="700" text-anchor="start">같은 GPU를 분할과 복제에 다르게 배분하기</text><text x="48" y="111.0" font-size="23" fill="#526577" font-weight="400" text-anchor="start">두 배치 모두 GPU 4개와 동일한 요청을 사용합니다.</text><path d="M48,158 H1152" stroke="#d5dfe8"/><text x="48" y="145.0" font-size="20" fill="#526577" font-weight="400" text-anchor="start">↔ : 그룹 내부 통신 관계</text><rect x="48" y="204" width="1104" height="466" rx="12" fill="#fbfcfd" stroke="#d5dfe8" stroke-width="2"/><text x="76" y="248.0" font-size="29" fill="#182c40" font-weight="700" text-anchor="start">TP 2 × DP 2</text><text x="1124" y="248.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="end">모델 복제본 2개</text><text x="600" y="300.0" font-size="23" fill="#526577" font-weight="400" text-anchor="middle">동일한 요청 A · B · C · D</text><rect x="76" y="330" width="498" height="240" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><rect x="259.0" y="348" width="132" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="325" y="377.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">A · B</text><rect x="100" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="201.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="116.0" y="485" width="85.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="158.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="201.0" y="485" width="85.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="243.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="348" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="449.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="364.0" y="485" width="85.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="406.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="449.0" y="485" width="85.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="491.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><path d="M325,399 L325,410 L201,410 L201,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M325,410 L449,410 L449,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M309,516 L341,516" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><rect x="626" y="330" width="498" height="240" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><rect x="809.0" y="348" width="132" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="875" y="377.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">C · D</text><rect x="650" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="751.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="666.0" y="485" width="85.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="708.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="751.0" y="485" width="85.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="793.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="898" y="418" width="202" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="999.0" y="458.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="914.0" y="485" width="85.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="956.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="999.0" y="485" width="85.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="1041.5" y="522.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><path d="M875,399 L875,410 L751,410 L751,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M875,410 L999,410 L999,415" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M859,516 L891,516" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="600" y="613.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">두 그룹이 서로 다른 요청을 처리</text><text x="600" y="651.0" font-size="22" fill="#526577" font-weight="400" text-anchor="middle">그룹별로 입력을 배분하고 독립적으로 실행</text><rect x="48" y="702" width="1104" height="466" rx="12" fill="#fbfcfd" stroke="#d5dfe8" stroke-width="2"/><text x="76" y="746.0" font-size="29" fill="#182c40" font-weight="700" text-anchor="start">TP 4 × DP 1</text><text x="1124" y="746.0" font-size="25" fill="#246fb4" font-weight="700" text-anchor="end">모델 복제본 1개</text><text x="600" y="798.0" font-size="23" fill="#526577" font-weight="400" text-anchor="middle">동일한 요청 A · B · C · D</text><rect x="76" y="828" width="1048" height="240" rx="12" fill="#f5f9fc" stroke="#246fb4" stroke-width="2"/><rect x="471.0" y="846" width="258" height="44" rx="8" fill="#eaf6f2" stroke="#247b72" stroke-width="2"/><text x="600" y="875.0" font-size="23" fill="#247b72" font-weight="700" text-anchor="middle">A · B · C · D</text><path d="M600,897 L600,908 L210,908 L210,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600,908 L470,908 L470,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600,908 L730,908 L730,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M600,908 L990,908 L990,913" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="110" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="210.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 0</text><rect x="168.0" y="983" width="84.0" height="58" rx="0" fill="#d9ebfc" stroke="#246fb4" stroke-width="2"/><text x="210.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W1</text><rect x="370" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="470.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 1</text><rect x="428.0" y="983" width="84.0" height="58" rx="0" fill="#bbdaf7" stroke="#246fb4" stroke-width="2"/><text x="470.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W2</text><rect x="630" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="730.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 2</text><rect x="688.0" y="983" width="84.0" height="58" rx="0" fill="#9bc9f1" stroke="#246fb4" stroke-width="2"/><text x="730.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W3</text><rect x="890" y="916" width="200" height="136" rx="12" fill="white" stroke="#d5dfe8" stroke-width="2"/><text x="990.0" y="956.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">GPU 3</text><rect x="948.0" y="983" width="84.0" height="58" rx="0" fill="#79b4e5" stroke="#246fb4" stroke-width="2"/><text x="990.0" y="1020.0" font-size="23" fill="#246fb4" font-weight="700" text-anchor="middle">W4</text><path d="M317,1014 L363,1014" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><path d="M577,1014 L623,1014" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><path d="M837,1014 L883,1014" fill="none" stroke="#526577" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="600" y="1111.0" font-size="25" fill="#182c40" font-weight="700" text-anchor="middle">한 그룹의 네 GPU가 요청들의 계산에 함께 참여</text><text x="600" y="1149.0" font-size="22" fill="#526577" font-weight="400" text-anchor="middle">한 그룹도 여러 요청을 배치로 처리할 수 있음</text><text x="600" y="1241.0" font-size="27" fill="#182c40" font-weight="700" text-anchor="middle">실행 가능한 두 후보에서 함께 비교할 것</text><rect x="48" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="180" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">GPU당 메모리 여유</text><rect x="328" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="460" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">요청의 응답 시간</text><rect x="608" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="740" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">전체 처리량</text><rect x="888" y="1271" width="264" height="100" rx="12" fill="#f5f8fb" stroke="#d5dfe8" stroke-width="2"/><text x="1020" y="1327.0" font-size="22" fill="#182c40" font-weight="700" text-anchor="middle">그룹 내부 통신</text><text x="600" y="1420.0" font-size="23" fill="#526577" font-weight="400" text-anchor="middle">한 모델에 쓸 GPU 수와 독립 복제본 수를 함께 조정합니다.</text></svg>