 stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="414" y="301" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="459" y="333" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">0.6</text><text x="16" y="385" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="300">다음 선택: b</text><rect x="16" y="446" width="180" height="48" rx="8" fill="#F1F4F7" stroke="#657789" stroke-width="1.5"/><text x="106" y="478" fill="#657789" font-size="22" font-weight="600" text-anchor="middle" data-max-width="168">P + u + b</text><path d="M204 471 L235 471" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="246" y="446" width="120" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="306" y="478" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="108">Critic</text><path d="M376 471 L403 471" stroke="#2470BB" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/><rect x="414" y="446" width="90" height="48" rx="8" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="459" y="478" fill="#2470BB" font-size="22" font-weight="600" text-anchor="middle" data-max-width="78">0.4</text><text x="16" y="530" fill="#5C6C7C" font-size="20" font-weight="400" text-anchor="start" data-max-width="300">다음 선택: d</text><g data-container="true"><rect x="16" y="614" width="488" height="94" rx="10" fill="#EDF5FD" stroke="#2470BB" stroke-width="1.5"/><text x="32" y="645" fill="#2470BB" font-size="22" font-weight="600" text-anchor="start" data-max-width="456">V = 앞으로 받을 보상의 예상</text><text x="32" y="685" fill="#182C40" font-size="20" font-weight="400" text-anchor="start" data-max-width="456">각 위치는 앞선 문맥만 읽습니다.</text></g></g><g transform="translate(624 206) scale(1.0153846153846153)" data-panel="2"><text x="0" y="30" fill="#182C40" font-size="25" font-weight="600" text-anchor=